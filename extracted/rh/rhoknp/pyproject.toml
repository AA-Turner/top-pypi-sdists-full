[project]
name = "rhoknp"
version = "1.8.1"
description = "Yet another Python binding for Juman++/KNP/KWJA"
license = "MIT"
readme = "README.md"
keywords = [
    "NLP",
    "Japanese",
    "Juman++",
    "KNP",
    "KWJA",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Japanese",
    "Operating System :: MacOS",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.10"
dependencies = ["typing-extensions>=4.4; python_version < '3.12'"]

[[project.authors]]
name = "Hirokazu Kiyomaru"
email = "h.kiyomaru@gmail.com"

[[project.authors]]
name = "Nobuhiro Ueda"
email = "ueda@nlp.i.kyoto-u.ac.jp"

[[project.maintainers]]
name = "Hirokazu Kiyomaru"
email = "h.kiyomaru@gmail.com"

[[project.maintainers]]
name = "Nobuhiro Ueda"
email = "ueda@nlp.i.kyoto-u.ac.jp"

[project.optional-dependencies]
cli = [
    "typer-slim>=0.24.0",
    "PyYAML>=6.0",
    "rich>=14.0",
    "uvicorn>=0.50.0",
    "fastapi>=0.140.0",
    "jinja2>=3.1.4",
    "pygments>=2.20.0",
]

[project.urls]
Homepage = "https://github.com/ku-nlp/rhoknp"
Documentation = "https://rhoknp.readthedocs.io/en/latest"
Repository = "https://github.com/ku-nlp/rhoknp"
Issues = "https://github.com/ku-nlp/rhoknp/issues"

[project.scripts]
rhoknp = "rhoknp.cli.cli:app"

[dependency-groups]
dev = [
    "types-click>=7.1.8",
    "types-pygments>=2.20.0.20260518",
    "types-pyyaml>=6.0.12.20260518",
]
test = [
    "pytest>=9.1.0",
    "coverage[toml]>=7.15.0",
    "pytest-cov>=7.0.0",
    "httpx>=0.28.0",
]
docs = [
    "Sphinx>=9.0.0; python_version >= '3.11'",
    "Sphinx>=8.0,<9; python_version < '3.11'",
    "sphinx-prompt>=1.10.0; python_version >= '3.11'",
    "sphinx-prompt>=1.9,<1.10; python_version < '3.11'",
    "sphinx-copybutton>=0.5.0",
    "myst-parser>=5.0; python_version >= '3.11'",
    "myst-parser>=4.0; python_version < '3.11'",
    "markdown-it-py>=4.0.0; python_version >= '3.11'",
    "markdown-it-py>=3.0,<4; python_version < '3.11'",
    "furo>=2025.12.19",
    "typing-extensions>=4.4",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.hatch.build.targets.sdist]
only-include = ["/src/rhoknp"]

[tool.uv]
package = true
default-groups = [
    "dev",
    "test",
]

[tool.ruff]
line-length = 120
indent-width = 4
src = ["src"]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "B",
    "PL",
    "PD",
    "NPY",
    "RUF",
    "UP",
    "TID",
    "COM",
    "PT",
    "D",
    "ARG",
    "PYI",
    "ANN",
    "G",
    "FBT",
    "EM",
    "TRY",
    "PTH",
    "T",
    "INP",
    "C",
]
ignore = [
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
    "UP037",
    "COM812",
    "PLR2004",
    "D100",
    "D105",
    "D107",
    "D301",
    "D403",
    "D415",
    "ANN002",
    "ANN003",
    "FA100",
    "S101",
    "G004",
    "FBT001",
    "FBT002",
    "FBT003",
    "EM101",
    "EM102",
    "TRY003",
    "C408",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104"]
"tests/*" = [
    "D",
    "S101",
    "INP001",
    "PLR0915",
]
"src/rhoknp/cli/*" = ["T201"]
"examples/*" = [
    "T201",
    "INP001",
    "PTH123",
]
"docs/conf.py" = ["INP001"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-branches = 25
max-statements = 60
max-returns = 10
max-args = 15

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ty.environment]
python-version = "3.10"

[tool.coverage.run]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "except ImportError",
    "raise AssertionError",
    "raise NotImplementedError",
    "raise ImportError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    '@(abc\.)?abstractmethod',
    "@overload",
]
