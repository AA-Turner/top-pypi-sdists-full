[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "gravitas-md2gdocs"
dynamic = ["version"]
description = "Convert Markdown to Google Docs API requests"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Nicholas Tindle", email = "nicholastindle@agpt.co" }
]
keywords = [
    "markdown",
    "google-docs",
    "google-api",
    "converter",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
google = [
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "python-dotenv>=1.0.0",
    "google-auth-oauthlib>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/significant-gravitas/gravitas-md2gdocs"
Documentation = "https://github.com/significant-gravitas/gravitas-md2gdocs#readme"
Repository = "https://github.com/significant-gravitas/gravitas-md2gdocs"
Issues = "https://github.com/significant-gravitas/gravitas-md2gdocs/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/gravitas_md2gdocs/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gravitas_md2gdocs"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["src/gravitas_md2gdocs/_version.py"]  # Auto-generated by hatch-vcs

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
