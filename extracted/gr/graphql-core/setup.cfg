[bdist_wheel]
python-tag = py3

[aliases]
test = pytest

[tool:pytest]
minversion = 7.4
addopts = --benchmark-disable
python_classes = PyTest*
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
timeout = 100
filterwarnings = ignore::pytest.PytestConfigWarning
testpaths = tests

[egg_info]
tag_build = 
tag_date = 0

