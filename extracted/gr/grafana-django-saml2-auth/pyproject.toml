[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "grafana-django-saml2-auth"
version = "3.21.0"
description = "Deprecated compatibility package. Install django-saml2-auth-community instead."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Mostafa Moradian" }]
dependencies = ["django-saml2-auth-community==3.21.0"]
classifiers = [
  "Development Status :: 7 - Inactive",
  "Programming Language :: Python :: 3",
]
[project.urls]
Homepage = "https://github.com/mostafa/django-saml2-auth"
Issues = "https://github.com/mostafa/django-saml2-auth/issues"
[tool.setuptools]
packages = ["grafana_django_saml2_auth"]
