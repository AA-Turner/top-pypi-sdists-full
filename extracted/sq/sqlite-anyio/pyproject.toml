[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[project]
name = "sqlite-anyio"
description = "Asynchronous client for SQLite using AnyIO"
readme = "README.md"
version = "0.3.1"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
    "Topic :: Database",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">= 3.10"
dependencies = [
    "anyio >=4.14,<5.0",
    "typing-extensions >=4.15.0",
]

[[project.authors]]
name = "Alex Grönholm"
email = "alex.gronholm@nextday.fi"

[[project.authors]]
name = "David Brochart"
email = "david.brochart@gmail.com"

[project.license]
file = "LICENSE"

[project.urls]
Source = "https://github.com/davidbrochart/sqlite-anyio"
Issues = "https://github.com/davidbrochart/sqlite-anyio/issues"

[dependency-groups]
test = [
    "pytest >=9,<10",
    "trio >=0.32.0,<1",
    "mypy",
    "coverage",
]

[tool.coverage.run]
source = [
    "sqlite_anyio",
    "tests",
]

[tool.coverage.report]
show_missing = true
