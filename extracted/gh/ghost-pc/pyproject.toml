[project]
name = "ghost-pc"
version = "0.2.24"
description = "Control your Windows PC from WhatsApp with AI vision"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Nexar Labs", email = "hello@nexarlabs.ai"},
]
keywords = ["whatsapp", "ai", "desktop-automation", "windows", "gemini", "computer-use"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment",
    "Topic :: Communications :: Chat",
]

dependencies = [
    # AI — ADK handles the full agent loop, genai is the underlying SDK
    "google-adk>=1.0.0",
    "google-genai>=1.0.0",
    # Persistent sessions (SQLite async driver for DatabaseSessionService)
    "aiosqlite>=0.20.0",
    # Screen capture (Windows DXGI Desktop Duplication)
    "bettercam>=1.0.0",
    # JPEG encoding (SIMD-accelerated)
    "PyTurboJPEG>=1.7.0",
    # Live screen streaming
    "aiohttp>=3.9.0",
    # System tray
    "pystray>=0.19.0",
    "Pillow>=10.0.0",
    # Hotkey detection
    "pynput>=1.7.0",
    # Utilities
    "rich>=13.0.0",
    # QR code display
    "qrcode>=7.0.0",
    # System info (process management, CPU/RAM)
    "psutil>=5.9.0",
    # CLI framework
    "click>=8.1.0",
    # Interactive prompts
    "questionary>=2.0.0",
    # Config schema validation
    "pydantic>=2.0.0",
    "typing-extensions>=4.15.0",
]

[project.optional-dependencies]
tunnel = ["cloudflared"]
# Windows-only desktop control extras
desktop = [
    "pywinauto>=0.6.8",      # UIA element inspection
    "pywin32>=306",           # COM automation (Office), Win32 APIs
    "pycaw>=20240210",        # Audio/volume control
    "windows-toasts>=1.1.0",  # Desktop notifications
]
# Browser automation via Chrome DevTools Protocol
browser = ["playwright>=1.40.0"]
# Voice control (Gemini Live audio streaming)
voice = [
    "edge-tts>=6.1.0",         # Text-to-speech for WhatsApp voice replies
    "sounddevice>=0.5.5",      # Mic capture + speaker playback (WASAPI on Windows)
]
# Wake word detection — requires tflite-runtime which only has wheels for
# Python <=3.11.  Install manually on supported versions:
#   pip install openwakeword
wakeword = ["openwakeword>=0.6.0; python_version < '3.12'"]
# WebRTC low-latency streaming (LAN only, optional upgrade over MJPEG)
webrtc = ["aiortc>=1.14.0"]
# Persistent vector memory (local ChromaDB, no cloud)
memory = ["chromadb>=1.0.0"]
# Proactive notifications (scheduled reminders, file watching)
notifications = [
    "apscheduler>=3.11.0",     # Scheduled tasks and reminders
    "watchdog>=6.0.0",         # File system monitoring
]
# OCR (optional fallback when WinRT OCR unavailable)
ocr = ["rapidocr-onnxruntime>=1.3.0"]
# Full install (all optional features except wakeword which needs Python <3.12)
all = [
    "ghost-pc[desktop,browser,voice,webrtc,memory,notifications,tunnel,ocr]",
]

[project.scripts]
ghost = "ghost_pc.cli.main:main"

[project.urls]
Homepage = "https://github.com/nexarlabs-ai/GhostPC"
Repository = "https://github.com/nexarlabs-ai/GhostPC"
Issues = "https://github.com/nexarlabs-ai/GhostPC/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "src/ghost_pc",
    "bridge/index.js",
    "bridge/package.json",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ghost_pc"]

[tool.hatch.build.targets.wheel.force-include]
"bridge/index.js" = "ghost_pc/_bridge/index.js"
"bridge/package.json" = "ghost_pc/_bridge/package.json"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "ruff>=0.9.0",
    "pyright>=1.1.390",
    "py>=1.11.0",
    "pyinstaller>=6.14",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]  # line length handled by formatter, not linter

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
reportMissingImports = "warning"
reportMissingTypeStubs = false

[tool.coverage.run]
source = ["ghost_pc"]

[tool.coverage.report]
show_missing = true
skip_empty = true
