name: Release Please
on:
  push:
    branches:
      - main


permissions:
  actions: read # Read the metrics
  contents: write # to be able to publish a GitHub release
  issues: write # to be able to comment on released issues
  pull-requests: write # to be able to comment on released pull requests
  id-token: write # to enable use of OIDC for npm provenance / AWS

env:
  MISE_PYTHON_COMPILE: false
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # ratchet:googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          release-type: python
    outputs:
      # Root level release_created
      release_created: ${{ steps.release.outputs['release_created'] }}
      # Root level tag_name
      tag_name: ${{ steps.release.outputs['tag_name'] }}
      sha: ${{ steps.release.outputs['sha'] }}

  publish:
    name: Publishes tag to pypi
    runs-on: ubuntu-latest
    needs: release-please

    if: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # ratchet:astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.26"

      - name: Build and Publish
        run: |
          uv sync --frozen
          uv build
          uv publish
