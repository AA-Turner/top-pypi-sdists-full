[build-system]
build-backend = "uv_build"
requires = ["uv-build>=0.12.1,<0.13"]

[project]
name = "unittest-parametrize"
version = "1.9.0"
description = "Parametrize tests within unittest TestCases."
readme = "README.rst"
keywords = ["unittest"]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]

[[project.authors]]
name = "Adam Johnson"
email = "me@adamj.eu"

[project.urls]
Changelog = "https://github.com/adamchainz/unittest-parametrize/blob/main/CHANGELOG.rst"
Funding = "https://adamj.eu/books/"
Repository = "https://github.com/adamchainz/unittest-parametrize"

[dependency-groups]
test = [
    "coverage[toml]",
    "pytest>=9",
    "pytest-randomly",
]

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "E",
    "F",
    "I",
    "SIM",
    "TID",
    "UP",
    "W",
]
ignore = [
    "B9",
    "E501",
    "SIM105",
    "SIM108",
]
extend-safe-fixes = ["UP006"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.pyproject-fmt]
max_supported_python = "3.15"

[tool.mypy]
mypy_path = "src/"
namespace_packages = false
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
]
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
allow_untyped_defs = true

[tool.pytest]
strict = true

[tool.coverage.run]
source = [
    "tests",
    "unittest_parametrize",
]
branch = true
data_file = ".coverage/cov"
parallel = true

[tool.coverage.paths]
source = [
    "src",
    ".tox/**/site-packages",
]

[tool.coverage.report]
skip_covered = true
skip_empty = true
show_missing = true

[tool.rstcheck]
report_level = "ERROR"
