[project]
name = "istari-digital-client"
version = "13.1.9"
description = "Python client for the Istari Digital platform"
license = { file = "LICENSE" }
readme = "README.md"
authors = [{ name = "Istari Digital Developers" }]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
homepage = "https://istaridigital.com"
documentation = "https://docs.istaridigital.com"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
python-dotenv = "^1.0.1"
pydantic = "^2.9.0"
python-dateutil = "^2.9.0.post0"
urllib3 = "^2.6.0"
typing-extensions = "^4.12.2"
types-python-dateutil = "^2.9.0.20240906"
deprecation = "^2.1.0"
inflection = "^0.5.1"
istari-digital-core = "7.3.2"
istari-digital-core-fips = { version = "7.3.2", optional = true }
boto3 = { version = ">=1.26.0", optional = true }
awscrt = { version = ">=0.19.0", optional = true }
# Floor, no ceiling. 49.0.0 is the first release carrying the CVE-2026-34073 and
# CVE-2026-39892 fixes -- no 48.x has them. A caret here has twice become a CVE
# ceiling for consumers (^46.0.0 forced #461; ^48.0.1 forced DPLAT-637), so pin
# the floor and let consumers choose the ceiling.
cryptography = ">=49.0.0"
pyjwt = "^2.13.0"

[tool.poetry.extras]
s3 = ["boto3"]
s3-crt = ["boto3", "awscrt"]
fips = ["istari-digital-core-fips"]

[[tool.poetry.source]]
name = "istari"
url = "https://istaridigital.jfrog.io/artifactory/api/pypi/main-pypi/simple"
priority = "primary"

[[tool.poetry.source]]
name = "istari-local"
url = "https://istaridigital.jfrog.io/artifactory/api/pypi/main-pypi-local/simple"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
pytest-cov = "^4.1.0"
pytest = "^9.0.3"
setuptools = "^83.0.0"
pre-commit = "^4.3.0"
pytest-subtests = "^0.15.0"
ruff = "^0.16.0"
mypy = "^1.11.1"
interrogate = "^1.7.0"
requests = "^2.32.3"
yamllint = "^1.35.1"
istari-license = { version = "^1.1.2", source = "istari" }
lorem-text = "^3.0"
azure-storage-blob = "^12.28.0"
pytest-mock = "^3.14.1"
towncrier = "^24.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.towncrier]
# Per-PR changelog fragments live in changelog.d/. The release workflow renders
# them via `towncrier build --draft`, aggregates via Claude into customer-facing
# release notes, and (on a full release) consumes the fragments into
# docs/changelog/<date>-Release.md. Pre-releases render notes for the GitHub
# release body but leave fragments in place — they belong to the next full
# release.
#
# CHANGELOG.md is frozen as a historical archive; nothing in this project
# writes to it anymore.
name = "Istari Python Client"
directory = "changelog.d"
template = "changelog.d/_template.md.jinja"
title_format = "## v{version} — {project_date}"
issue_format = "PR #{issue}"
underlines = ["", "", ""]
all_bullets = false
wrap = false

[[tool.towncrier.type]]
directory = "breaking"
name = "breaking"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "feature"
showcontent = true

[[tool.towncrier.type]]
directory = "fix"
name = "fix"
showcontent = true

[[tool.towncrier.type]]
directory = "improvement"
name = "improvement"
showcontent = true

[[tool.towncrier.type]]
directory = "internal"
name = "internal"
showcontent = true

[tool.coverage.run]
# Coverage for the istari facade measures the HAND-WRITTEN code we own, not the
# autogenerated clients (tested upstream) or the vendored runtime/auth/storage.
# Without this, `--cov=istari` is dominated by ~25k lines of generated boilerplate
# (e.g. v2_api.py alone is 9.6k statements) and reports a meaningless ~45%.
omit = [
  "*/istari/_generated/*",
  "*/istari/_auth/*",
  "*/istari/_storage/*",
  "*/istari/_compatibility/*",
  "*/istari/_api_client.py",
  "*/istari/_api_response.py",
  "*/istari/_configuration.py",
  "*/istari/_rest.py",
  "*/istari/_env.py",
  "*/istari/_log_utils.py",
  # exceptions.py is mostly the generated OpenApiException/ApiException base; the
  # hand-written IstariError hierarchy + map_api_error are covered by test_errors.
  "*/istari/_exceptions.py",
]

[tool.mypy]
exclude = [
  # New facade code (istari_digital_client/sdk/)
  'istari_digital_client/sdk/_generated',
  'istari_digital_client/sdk/_storage',
  'istari_digital_client/sdk/_auth',
  'istari_digital_client/sdk/_compatibility',
  'istari_digital_client/sdk/_api_client.py',
  'istari_digital_client/sdk/_api_response.py',
  'istari_digital_client/sdk/_configuration.py',
  'istari_digital_client/sdk/_rest.py',
  'istari_digital_client/sdk/_exceptions.py',
  'istari_digital_client/sdk/_log_utils.py',
  'istari_digital_client/sdk/_env.py',
  # Legacy generated code (istari_digital_client/legacy/)
  'istari_digital_client/legacy/v2',
  'istari_digital_client/legacy/v3',
  'istari_digital_client/legacy/storage',
  'istari_digital_client/legacy/auth',
  'istari_digital_client/legacy/mixin',
  'istari_digital_client/legacy/protocol',
  'istari_digital_client/legacy/api_client.py',
  'istari_digital_client/legacy/api_response.py',
  'istari_digital_client/legacy/configuration.py',
  'istari_digital_client/legacy/rest.py',
  'istari_digital_client/legacy/exceptions.py',
  'istari_digital_client/legacy/log_utils.py',
  'istari_digital_client/legacy/env.py',
  'istari_digital_client/legacy/client.py',
  'istari_digital_client/legacy/v3_client.py',
  'istari_digital_client/legacy/key_management.py',
]

[tool.ruff]
exclude = [
  # New facade code
  'istari_digital_client/sdk',
  # Legacy generated code
  'istari_digital_client/legacy',
]

[tool.ruff.format]
exclude = [
  'istari_digital_client/sdk',
  'istari_digital_client/legacy',
]

[tool.ruff.lint]
exclude = [
  'istari_digital_client/sdk',
  'istari_digital_client/legacy',
]

[tool.interrogate]
ignore-init-method = false
ignore-init-module = false
ignore-magic = true
ignore-semiprivate = true
ignore-private = true

ignore-property-decorators = true
ignore-module = false
ignore-nested-functions = true
ignore-nested-classes = true
ignore-setters = false
fail-under = 80
exclude = [
  "setup.py",
  "docs",
  "build",
  "alembic",
  "scripts",
  "data",
  "docker",
  "reports",
  # Exclude new facade code and legacy generated code
  "istari_digital_client/sdk",
  "istari_digital_client/legacy",
]
ignore-regex = ["^get$", "^mock_.*", ".*BaseClass.*"]
verbose = 1
quiet = false
whitelist-regex = []
color = true
omit-covered-files = false
