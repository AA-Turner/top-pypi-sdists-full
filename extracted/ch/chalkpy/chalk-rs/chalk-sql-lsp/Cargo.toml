[package]
name = "chalk-sql-lsp"
version = "0.1.0"
edition = "2021"

[lib]
name = "chalk_sql_lsp"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "chalk-sql-lsp"
path = "src/main.rs"
required-features = ["server"]

[features]
default = []
server = ["lsp-server", "crossbeam-channel", "log", "env_logger"]
wasm = ["wasm-bindgen"]

[dependencies]
lsp-types = "0.97"
sqlparser = "0.61"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# WASM (optional)
wasm-bindgen = { version = "0.2", optional = true }

# Server (optional)
lsp-server = { version = "0.7", optional = true }
crossbeam-channel = { version = "0.5", optional = true }
log = { version = "0.4", optional = true }
env_logger = { version = "0.11", optional = true }

[dev-dependencies]
serde_json = "1"
serde_yaml = "0.9"
glob = "0.3"
