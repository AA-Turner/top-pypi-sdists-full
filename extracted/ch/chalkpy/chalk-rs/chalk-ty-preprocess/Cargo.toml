[package]
name = "chalk-ty-preprocess"
version = "0.1.0"
edition = "2021"

[lib]
name = "chalk_ty_preprocess"
path = "src/lib.rs"

[[bin]]
name = "chalk-ty-preprocess"
path = "src/main.rs"

[dependencies]
chalk-proto = { path = "../chalk-proto" }
prost = "0.13"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", tag = "0.15.2" }
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", tag = "0.15.2" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff", tag = "0.15.2" }
walkdir = "2"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
