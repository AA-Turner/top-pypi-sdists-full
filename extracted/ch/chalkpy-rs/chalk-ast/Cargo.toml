[package]
name = "chalk-ast"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"

[lib]
name = "chalk_ast"
path = "src/file_parser_cache.rs"

[dependencies]
chalk-project = { path = "../chalk-project" }
chalk-utils = { path = "../chalk-utils" }
lsp-types = "0.97"
# Python 3.15 final syntax requires a current parser; keep ty separately pinned.
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", tag = "0.17.0" }
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", tag = "0.17.0" }
ruff_python_trivia = { git = "https://github.com/astral-sh/ruff", tag = "0.17.0" }
ruff_source_file = { git = "https://github.com/astral-sh/ruff", tag = "0.17.0" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff", tag = "0.17.0" }

[dev-dependencies]
tempfile = "3"
