# PullApprove v5: https://5.pullapprove.com/docs/

extends = ["CODEREVIEW-TEAMS.toml"]

[[scopes]]
name = "frontend"
reviewers = ["$frontend"]
request = 1
require = 1
labels = ["frontend"]
ownership = "append"
paths = ["**/*", "!Dockerfile", "!azure-pipelines.yml", "!deployment/**.yml"]

[[scopes]]
name = "frontend-interested"
reviewers = ["$frontend-interested"]
request = 1
require = 0
paths = ["**/*", "!Dockerfile", "!azure-pipelines.yml", "!deployment/**.yml"]

[[scopes]]
name = "dev-ops"
reviewers = ["$dev-ops"]
request = 1
require = 1
labels = ["dev-ops"]
ownership = "append"
paths = ["Dockerfile", "azure-pipelines.yml", "deployment/**.yml"]

[[scopes]]
name = "dev-ops-interested"
reviewers = ["$dev-ops-interested"]
request = 1
require = 0
paths = ["Dockerfile", "azure-pipelines.yml", "deployment/**.yml"]
