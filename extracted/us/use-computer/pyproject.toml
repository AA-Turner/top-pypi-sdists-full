[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "use-computer"
version = "0.0.46"
description = "Python SDK for use.computer macOS sandboxes"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "use.computer" }]
dependencies = ["httpx>=0.27"]
keywords = ["computer-use", "macos", "automation", "sandbox", "vnc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.optional-dependencies]
agents = [
    "Pillow>=10",
    "openai>=1",
    "anthropic>=0.86",
    "litellm>=1",
    "google-genai>=1",
    "tinker>=0.14.0 ; python_full_version >= '3.11'",
    "tinker-cookbook>=0.1.0 ; python_full_version >= '3.11'",
]


[dependency-groups]
dev = [
    "anthropic>=0.86",
    "google-genai>=1",
    "harbor @ git+https://github.com/josancamon19/harbor.git@mirror ; python_version >= '3.12'",
    "litellm>=1",
    "openai>=1",
    "pre-commit>=4",
    "pytest>=9",
    "ruff>=0.15",
    "Pillow>=10",
    "PyYAML>=6",
    "tomli>=2",
    "twine>=6",
    "ty>=0.0.34",
]

[project.urls]
Homepage = "https://use.computer"
Documentation = "https://api.use.computer/docs"
Repository = "https://github.com/josancamon19/use-computer-sdk"

[tool.hatch.build.targets.wheel]
packages = ["use_computer"]

[tool.hatch.build]
exclude = [
    "/.github",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.venv",
    "/dist",
    "/results",
    "/tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
