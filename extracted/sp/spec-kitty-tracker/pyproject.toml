[project]
name = "spec-kitty-tracker"
version = "0.5.2"
description = "Universal tracker interface, connector SDK, and sync engine for Spec Kitty"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Spec Kitty Contributors" }
]
license = {file = "LICENSE"}
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "httpx>=0.27.0,<1.0.0"
]

[project.urls]
Homepage = "https://github.com/Priivacy-ai/spec-kitty-tracker"
Changelog = "https://github.com/Priivacy-ai/spec-kitty-tracker/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "mypy>=1.10.0",
  "ruff>=0.6.0",
  "build>=1.2.0",
  "twine>=5.0.0"
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "mypy>=1.10.0",
  "ruff>=0.6.0",
  "build>=1.2.0",
  "twine>=5.0.0"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.package-data]
spec_kitty_tracker = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
include = [
  "examples/**/*.py",
  "scripts/**/*.py",
  "src/**/*.py",
  "tests/**/*.py",
  "pyproject.toml"
]
extend-exclude = ["docker/vendor-site-packages"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
