[project]
name = "spring-api-intel-mcp"
version = "1.0.0"
description = "MCP server for Spring Boot codebase intelligence"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "spring-boot", "java", "ai", "developer-tools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.26.0",
]

[project.scripts]
springboot-intel = "server:main_sync"

[project.urls]
Homepage = "https://github.com/mparth14/spring-api-intel-mcp"
Repository = "https://github.com/mparth14/spring-api-intel-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "tools", "handlers"]
include = ["server.py"]

[tool.hatch.build.targets.wheel.shared-data]
"server.py" = "server.py"

[dependency-groups]
dev = [
    "build>=1.4.0",
    "twine>=6.2.0",
]
