[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seltz"
version = "1.15.0"
description = "Seltz Python SDK for AI-powered search"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Seltz", email = "support@seltz.ai"}
]
keywords = [
    "seltz",
    "search",
    "ai",
    "sdk",
    "api",
    "web-search",
    "news-search",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search"
]
dependencies = [
    "grpcio>=1.76.0",
    # Supported runtime window of the generated stubs (gencode 5.29.5): protobuf
    # guarantees gencode runs on its own major and the next, so 5.29.5 works on
    # 5.29.5+ and all of 6.x, and provably fails on 7.x. Verified across the range.
    "protobuf>=5.29.5,<7",
    # TypeGuard is only in typing from 3.10; requires-python is >=3.9.
    "typing_extensions>=4.0",
]

[project.urls]
Homepage = "https://seltz.ai"
Documentation = "https://docs.seltz.ai"
Repository = "https://github.com/seltz-ai/seltz-python-sdk"
"Bug Tracker" = "https://github.com/seltz-ai/seltz-python-sdk/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["seltz", "seltz.*", "seltz_public_api", "seltz_public_api.*"]

[tool.setuptools.package-dir]
"" = "src"
"seltz_public_api" = "src/seltz_public_api"

# PEP 561: without this marker an installed package is untyped, so a consumer's
# type checker reads every name in it as `Any`.
[tool.setuptools.package-data]
seltz = ["py.typed"]
seltz_public_api = ["py.typed"]

[dependency-groups]
dev = [
    "build>=1.3.0",
    "codespell>=2.4.2",
    "dotenv>=0.9.9",
    "ipython>=8.18.1",
    "jupyter>=1.1.1",
    "mypy>=1.19.1",
    "notebook>=7.5.5",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.14.7",
    "twine>=6.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests that hit the live Seltz API (require SELTZ_API_KEY)",
]

[tool.ruff.lint.isort]
force-single-line = false
split-on-trailing-comma = true

[tool.ruff]
exclude = ["src/seltz_public_api"]

[tool.mypy]
# examples/ and tests/ are checked too: nothing else type-checks them, and a
# broken sample is the kind of defect a reader hits before any test does.
files = ["src/seltz", "examples", "tests"]
ignore_missing_imports = true
# An ignore with nothing left to ignore is an error, so a fixed annotation does not
# leave a dead marker behind. The two test modules below are exempt.
warn_unused_ignores = true
exclude = "src/seltz_public_api/"

[[tool.mypy.overrides]]
# protoc emits a module-level `ClassVar` for a top-level extension, which mypy
# rejects. Only this one module carries an extension, and skipping it alone leaves
# every generated message properly typed where `src/seltz` names one.
module = "seltz_public_api.proto.v1.options_pb2"
follow_imports = "skip"
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
# Every ignore in these two exists only because `seltz` is typed. The pre-commit
# mypy hook runs in its own environment, where this package is not installed, so
# `seltz` resolves to `Any`, all of those ignores look dead, and the hook fails on
# a tree the project-wide run calls clean. There is no `tests/__init__.py`, so
# these are the module names both runs use.
module = ["test_typing", "test_agent_waiters"]
warn_unused_ignores = false
