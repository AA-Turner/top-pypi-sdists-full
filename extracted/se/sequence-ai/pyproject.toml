[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sequence-ai"
version = "0.67.0"
description = "SequenceLink is an open-source framework for serving robot policies from remote GPUs over wide-area networks (WANs)."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "General Sequences" }]
keywords = ["robotics", "vla", "inference", "manipulation", "policy", "robot policy serving", "remote inference",
            "cuda graphs", "batching", "action chunk", "openpi", "lerobot", "gr00t", "latency", "wide-area network"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.24,<1",
    "pydantic>=2; python_version >= '3.10'",
    "sequence-base>=0.8.15,<0.9; python_version >= '3.10'",
    "sequence-cloud~=0.67.0; python_version >= '3.10' and platform_python_implementation == 'CPython' and (sys_platform == 'darwin' or (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')) or (sys_platform == 'win32' and platform_machine == 'AMD64'))",
    "pillow>=10",
    "uvicorn>=0.30,<1",
    "numpy>=1.24",
    "zstandard>=0.22; python_version < '3.15'",
    'av>=17.1; python_version >= "3.10" and (sys_platform != "win32" or platform_machine != "ARM64" or python_version >= "3.11")',
]

[project.optional-dependencies]
teleop = ["aiortc>=1.16,<1.17; python_version >= '3.11'", "aioice>=0.13,<0.14; python_version >= '3.11'"]
moq = ["moq-rs==0.5.2; python_version >= '3.10'", "moq-ffi==0.4.27; python_version >= '3.10'"]
data = ["pyarrow>=14"]
dev = [
    "pytest>=7",
    "sequence-base>=0.8.15,<0.9; python_version >= '3.10'",
    "pillow>=10",
    "numpy>=1.24",
    "zstandard>=0.22; python_version < '3.15'",
    "uvicorn>=0.30,<1",
    "websockets>=14,<19",
    "msgpack>=1.0,<2",
    "msgpack-numpy>=0.4.8,<0.5",
    "torch>=2.4,<3",
    "jax>=0.4.30; python_version >= '3.10'",
    "eclipse-zenoh>=1.10,<2",
    "ruff>=0.6,<1",
    "aiortc>=1.16,<1.17; python_version >= '3.11'",
    "aioice>=0.13,<0.14; python_version >= '3.11'",
    "opencv-python-headless>=4.8",
    "pyarrow>=14",
    "moq-rs==0.5.2; python_version >= '3.10'",
    "moq-ffi==0.4.27; python_version >= '3.10'",
]

[project.scripts]
seq = "seq_launch:main"

[project.urls]
Homepage = "https://generalsequences.com"
Documentation = "https://generalsequences.com/docs/"
Console = "https://app.generalsequences.com"
Repository = "https://github.com/General-Sequences/sequence-ai"
Issues = "https://github.com/General-Sequences/sequence-ai/issues"
Changelog = "https://generalsequences.com/docs/changelog/"

[tool.hatch.build.targets.wheel]
packages = ["sequence_ai", "seq"]
[tool.hatch.build.targets.wheel.force-include]
"seq_launch.py" = "seq_launch.py"

[tool.hatch.build.targets.sdist]
only-include = ["seq", "sequence_ai", "seq_launch.py", "README.md", "LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
