[build-system]
requires = ["uv_build>=0.11.2,<1.0"]
build-backend = "uv_build"

[project]
name = "class-resolver"
version = "0.8.1"
description = "Lookup and instantiate classes with style."
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Framework :: Pytest",
    "Framework :: tox",
    "Framework :: Sphinx",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
keywords = [
    "snekpack",
    "cookiecutter",
    "development tool",
    "configurability",
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["typing-extensions"]

[[project.authors]]
name = "Charles Tapley Hoyt"
email = "cthoyt@gmail.com"

[[project.maintainers]]
name = "Charles Tapley Hoyt"
email = "cthoyt@gmail.com"

[project.optional-dependencies]
click = ["click>=8.5"]
torch = ["torch"]
torch-geometric = [
    "torch",
    "torch-sparse",
    "torch-geometric",
]
optuna = ["optuna"]
numpy = ["numpy"]
sklearn = ["scikit-learn"]
tabulate = ["tabulate"]

[project.urls]
"Bug Tracker" = "https://github.com/cthoyt/class-resolver/issues"
Homepage = "https://github.com/cthoyt/class-resolver"
Repository = "https://github.com/cthoyt/class-resolver.git"
Documentation = "https://class_resolver.readthedocs.io"
Funding = "https://github.com/sponsors/cthoyt"

[project.scripts]

[project.entry-points.class_resolver_demo]
add = "operator:add"
sub = "operator:sub"
mul = "operator:mul"
expected_failure = "operator:nope_this_is_not_real"

[dependency-groups]
tests = [
    "pytest",
    "coverage[toml]",
    "docdata",
]
docs = [
    "sphinx<9",
    "sphinx-rtd-theme>=3.0",
    "sphinx_automodapi",
]
lint = ["ruff"]
typing = [
    { include-group = "tests" },
    "mypy",
    "pydantic",
    "types-click",
    "types-tabulate",
]
docs-lint = [
    { include-group = "docs" },
    "doc8",
]
format-docs = [
    { include-group = "docs" },
    "docstrfmt",
]
doctests = [
    "xdoctest",
    "pygments",
]
pyroma = [
    "uv-build",
    "pyroma",
    "pygments",
]

[tool.uv.extra-build-dependencies]
torch-sparse = ["torch"]

[tool.cruft]
skip = [
    "**/__init__.py",
    "tests/*",
]

[tool.mypy]
plugins = []
ignore_missing_imports = true

[tool.doc8]
max-line-length = 120

[tool.pytest.ini_options]
markers = ["""slow: marks tests as slow (deselect with '-m "not slow"')"""]

[tool.coverage.run]
branch = true
source = ["class_resolver"]
omit = [
    "tests/*",
    "docs/*",
    "src/class_resolver/version.py",
    "src/class_resolver/__main__.py",
]

[tool.coverage.paths]
source = [
    "src/class_resolver",
    ".tox/*/lib/python*/site-packages/class_resolver",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
    "if TYPE_CHECKING:",
    "def __str__",
    "def __repr__",
]

[tool.ruff]
line-length = 100
extend-include = ["*.ipynb"]

[tool.ruff.lint]
extend-select = [
    "F",
    "E",
    "W",
    "C90",
    "I",
    "UP",
    "D",
    "DOC",
    "B",
    "S",
    "T20",
    "N",
    "ERA",
    "NPY",
    "RUF",
    "C4",
]
ignore = ["D105"]

[tool.ruff.lint.per-file-ignores]
"src/class_resolver/version.py" = [
    "S603",
    "S607",
]
"docs/source/conf.py" = ["ERA001"]
"notebooks/**/*.ipynb" = ["T201"]
"tests/test_docs.py" = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
relative-imports-order = "closest-to-furthest"
known-third-party = ["tqdm"]
known-first-party = [
    "class_resolver",
    "tests",
]

[tool.ruff.format]
docstring-code-format = true

[tool.bumpversion]
current_version = "0.8.1"
parse = '(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)(?:-(?P<release>[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+(?P<build>[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?'
serialize = [
    "{major}.{minor}.{patch}-{release}+{build}",
    "{major}.{minor}.{patch}+{build}",
    "{major}.{minor}.{patch}-{release}",
    "{major}.{minor}.{patch}",
]
commit = true
tag = false

[tool.bumpversion.parts.release]
optional_value = "production"
first_value = "dev"
values = [
    "dev",
    "production",
]

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "docs/source/conf.py"
search = 'release = "{current_version}"'
replace = 'release = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/class_resolver/version.py"
search = 'VERSION = "{current_version}"'
replace = 'VERSION = "{new_version}"'
