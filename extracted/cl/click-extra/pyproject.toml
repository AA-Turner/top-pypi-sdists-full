[build-system]
build-backend = "uv_build"
requires = ["uv-build>=0.8"]

[project]
name = "click-extra"
version = "8.9.1"
description = "🌈 Drop-in replacement for Click to make user-friendly and colorful CLI"
readme = "readme.md"
keywords = [
    "ansi-colors",
    "ansi-escape-codes",
    "cli-framework",
    "click",
    "click-extension",
    "click-plugin",
    "cloup",
    "colorization",
    "config-file",
    "configuration-file",
    "hjson",
    "ini",
    "json5",
    "pygments",
    "pytest-plugin",
    "python-cli",
    "python-tabulate",
    "sphinx-extension",
    "tabulate",
    "toml-parser",
]
license = "GPL-2.0-or-later"
license-files = ["license"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Plugins",
    "Framework :: Pytest",
    "Framework :: Sphinx",
    "Framework :: Sphinx :: Extension",
    "Framework :: Sphinx :: Theme",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: BSD :: FreeBSD",
    "Operating System :: POSIX :: BSD :: NetBSD",
    "Operating System :: POSIX :: BSD :: OpenBSD",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Documentation :: Sphinx",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: System :: Logging",
    "Topic :: System :: Shells",
    "Topic :: Terminals",
    "Topic :: Text Processing :: Filters",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Text Processing :: Markup :: reStructuredText",
    "Topic :: Text Processing :: Markup :: XML",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "boltons>=20",
    "click>=8.3.1",
    "cloup>=3.0.7",
    "deepmerge>=1.0.1",
    "extra-platforms>=13.4",
    "tabulate[widechars]>=0.9",
    "tomli>=2; python_version<'3.11'",
    "wcmatch>=10",
    "wcwidth>=0.2",
]

[[project.authors]]
name = "Kevin Deldycke"
email = "kevin@deldycke.com"

[project.optional-dependencies]
all = ["click-extra[carapace,hjson,json5,jsonc,mkdocs,pygments,pytest,sphinx,toml,xml,yaml]"]
carapace = ["pyyaml>=6.0.3"]
hjson = ["hjson>=3.1"]
json5 = ["json5>=0.12.1"]
jsonc = ["json-with-comments>=1.2.10"]
mkdocs = [
    "mkdocs>=1.4",
    "pygments>=2.14",
    "pymdown-extensions>=10",
]
pygments = ["pygments>=2.14"]
pytest = ["pytest>=9"]
sphinx = [
    "docutils>=0.20",
    "pygments>=2.14",
    "sphinx>=8",
]
toml = ["tomlkit>=0.13"]
xml = ["xmltodict>=1"]
yaml = ["pyyaml>=6.0.3"]

[project.urls]
Changelog = "https://github.com/kdeldycke/click-extra/blob/main/changelog.md"
Download = "https://github.com/kdeldycke/click-extra/releases/tag/v8.9.1"
Funding = "https://github.com/sponsors/kdeldycke"
Homepage = "https://github.com/kdeldycke/click-extra"
Issues = "https://github.com/kdeldycke/click-extra/issues"
Repository = "https://github.com/kdeldycke/click-extra"

[project.scripts]
click-extra = "click_extra.__main__:main"

[project.entry-points."mkdocs.plugins"]
click-extra = "click_extra.mkdocs:AnsiColorPlugin"

[project.entry-points."pygments.filters"]
ansi-filter = "click_extra.pygments:AnsiFilter"

[project.entry-points."pygments.formatters"]
ansi-html-formatter = "click_extra.pygments:AnsiHtmlFormatter"

[project.entry-points."pygments.lexers"]
ansi-bash-session = "click_extra.pygments:AnsiBashSessionLexer"
ansi-color = "click_extra.pygments:AnsiColorLexer"
ansi-dylan-console = "click_extra.pygments:AnsiDylanConsoleLexer"
ansi-elixir-console = "click_extra.pygments:AnsiElixirConsoleLexer"
ansi-erlang-shell = "click_extra.pygments:AnsiErlangShellLexer"
ansi-gap-console = "click_extra.pygments:AnsiGAPConsoleLexer"
ansi-julia-console = "click_extra.pygments:AnsiJuliaConsoleLexer"
ansi-matlab-session = "click_extra.pygments:AnsiMatlabSessionLexer"
ansi-msdos-session = "click_extra.pygments:AnsiMSDOSSessionLexer"
ansi-output = "click_extra.pygments:AnsiOutputLexer"
ansi-postgres-console = "click_extra.pygments:AnsiPostgresConsoleLexer"
ansi-power-shell-session = "click_extra.pygments:AnsiPowerShellSessionLexer"
ansi-psysh-console = "click_extra.pygments:AnsiPsyshConsoleLexer"
ansi-python-console = "click_extra.pygments:AnsiPythonConsoleLexer"
ansi-r-console = "click_extra.pygments:AnsiRConsoleLexer"
ansi-ruby-console = "click_extra.pygments:AnsiRubyConsoleLexer"
ansi-sqlite-console = "click_extra.pygments:AnsiSqliteConsoleLexer"
ansi-tcsh-session = "click_extra.pygments:AnsiTcshSessionLexer"

[project.entry-points.pytest11]
click-extra = "click_extra.pytest"

[dependency-groups]
test = [
    "backports-strenum>=1.3; python_version<'3.11'",
    "coverage[toml]>=7.11",
    "extra-platforms[pytest]>=13.4",
    "jsonschema>=4.18",
    "mkdocs>=1.4",
    "mkdocs-click>=0.8",
    "myst-parser>=4",
    "pymdown-extensions>=10",
    "pytest>=9",
    "pytest-cov>=4",
    "pytest-github-actions-annotate-failures>=0.2",
    "pytest-httpserver>=1.1",
    "pytest-randomly>=3",
    "requests>=2.34",
    "sphinx>=8",
    "tomli>=2; python_version<'3.11'",
]
docs = [
    "flask>=3",
    "furo>=2025.9.25",
    "hjson>=3.1",
    "json-with-comments>=1.2.10",
    "json5>=0.12.1",
    "mkdocs>=1.4",
    "myst-parser>=5.1",
    "pygments>=2.14",
    "pymdown-extensions>=10",
    "pytest>=9",
    "pyyaml>=6.0.3",
    "sphinx>=8",
    "sphinx-autodoc-typehints>=2.4",
    "sphinx-copybutton>=0.5.2",
    "sphinx-datatables>=1",
    "sphinx-design>=0.6",
    "sphinxcontrib-mermaid>=1.2.3",
    "sphinxext-opengraph>=0.13",
    "xmltodict>=1",
]
typing = [
    "types-boltons>=25.0.0.20250919",
    "types-docutils>=0.22.3.20251115",
    "types-jsonschema>=4.18",
    "types-pygments>=2.19.0.20251121",
    "types-pyyaml>=6.0.12.9",
    "types-tabulate>=0.9.0.2",
    "types-xmltodict>=1.0.1.20250920",
]

[tool.setuptools.package-data]
click_extra = [
    "*.toml",
    "py.typed",
]

[tool.uv]
required-version = ">=0.11.15"
exclude-newer = "1 week"

[tool.uv.dependency-groups.docs]
requires-python = ">= 3.14"

[tool.uv.build-backend]
module-root = ""
source-exclude = [
    "**/*.bak",
    "**/.DS_Store",
    "**/__pycache__",
    "docs/_build",
    "docs/_linkcheck",
    "docs/html",
    "tests/.coverage",
]
source-include = [
    ".github/**",
    "changelog.md",
    "docs/**",
    "tests/**",
]

[tool.nuitka]
include-package-data = "click_extra"

[tool.ruff]
preview = true
fix = true
unsafe-fixes = false
show-fixes = true
output-prefer-rule-codes = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
extend-select = ["PLW1514"]
ignore = [
    "B008",
    "D400",
    "ERA001",
    "LOG015",
]
future-annotations = true

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.typos.default]
extend-ignore-re = [
    "(?s)<!-- typos:off -->.*?<!-- typos:on -->",
    'chalk\.ist',
]
extend-ignore-identifiers-re = [
    "valuE",
    "SeCoNd",
    "sUper",
    "fAlsE",
    "nd",
    "mey",
    "certifi",
    "optoin",
    "astroid",
]

[tool.typos.default.extend-identifiers]
Github = "GitHub"
IOS = "iOS"
Javascript = "JavaScript"
MacOS = "macOS"
PyPi = "PyPI"
Typescript = "TypeScript"

[tool.mypy]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
pretty = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "hjson",
    "jsonc",
    "pymdownx",
    "pymdownx.*",
    "sphinxcontrib.mermaid",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sphinx.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest]
addopts = [
    "--durations=10",
    "--import-mode=importlib",
]
markers = [
    "network: Tests that require network access (excluded with -m 'not network').",
    "once: Tests that only need to run once, not across the full CI matrix.",
]
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["click_extra"]

[tool.coverage.report]
fail_under = 70
precision = 2

[tool.bumpversion]
current_version = "8.9.1"
parse = '(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)(\.dev(?P<dev>\d+))?'
serialize = [
    "{major}.{minor}.{patch}.dev{dev}",
    "{major}.{minor}.{patch}",
]
ignore_missing_files = true
allow_dirty = true

[tool.bumpversion.parts.dev]
optional_value = "release"
values = [
    "0",
    "release",
]

[[tool.bumpversion.files]]
glob = "./**/__init__.py"
ignore_missing_version = true

[[tool.bumpversion.files]]
filename = "./pyproject.toml"
regex = true
search = '(?m)^version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "./pyproject.toml"
search = "releases/tag/v{current_version}"
replace = "releases/tag/v{new_version}"

[[tool.bumpversion.files]]
filename = "./pyproject.toml"
ignore_missing_version = true
serialize = ["{major}.{minor}.{patch}"]
search = '-version = "{current_version}"'
replace = '-version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "./changelog.md"
search = "## [`{current_version}` (unreleased)]("
replace = "## [`{new_version}` (unreleased)]("

[[tool.bumpversion.files]]
filename = "./citation.cff"
regex = true
search = "(?m)^version: {current_version}"
replace = "version: {new_version}"

[[tool.bumpversion.files]]
filename = "./citation.cff"
regex = true
search = 'date-released: \d{{4}}-\d{{2}}-\d{{2}}'
replace = "date-released: {utcnow:%Y-%m-%d}"

[[tool.bumpversion.files]]
filename = "./readme.md"
ignore_missing_version = true
include_bumps = ["dev"]
search = "raw.githubusercontent.com/kdeldycke/click-extra/main/"
replace = "raw.githubusercontent.com/kdeldycke/click-extra/v{new_version}/"

[[tool.bumpversion.files]]
filename = "./docs/tutorial.md"
ignore_missing_version = true
include_bumps = ["dev"]
search = "raw.githubusercontent.com/kdeldycke/click-extra/main/"
replace = "raw.githubusercontent.com/kdeldycke/click-extra/v{new_version}/"

[[tool.bumpversion.files]]
filename = "./readme.md"
ignore_missing_version = true
exclude_bumps = ["dev"]
search = "raw.githubusercontent.com/kdeldycke/click-extra/v{current_version}/"
replace = "raw.githubusercontent.com/kdeldycke/click-extra/main/"

[[tool.bumpversion.files]]
filename = "./docs/tutorial.md"
ignore_missing_version = true
exclude_bumps = ["dev"]
search = "raw.githubusercontent.com/kdeldycke/click-extra/v{current_version}/"
replace = "raw.githubusercontent.com/kdeldycke/click-extra/main/"

[tool.lychee]
exclude = [
    "^https://github.com/.+/issues/[0-9]+#issuecomment-.*$",
    "^https://github.com/.+/blob/.+#L[0-9]+",
    "^https://github.com/.+/releases/.+/download/.*$",
    "^https://doi.org/.+/zenodo.*$",
    "^https://star-history.com/#.*$",
    "^https://crates.io/crates/.*$",
    '^https://www\.virustotal\.com/gui/.*$',
    "^https://asciinema.org.*$",
    "^https://no-color.org.*$",
    "theme.md#(dark|dracula|light|manpage|monokai|nord|solarized-dark)$",
]

[tool.repomatic]
exclude = ["workflows/debug.yaml"]
minimum-release-age = "7 days"

[tool.repomatic.dependency-graph]
all-extras = true
all-groups = false
no-extras = ["all"]

[tool.repomatic.manpages]
script = "click_extra.cli:demo"

[tool.repomatic.nuitka]
nofollow-imports = ["tkinter"]

[tool.repomatic.test-matrix.remove]
os = [
    "macos-26-intel",
    "windows-11-arm",
]

[[tool.repomatic.test-matrix.include]]
click-version = "released"

[[tool.repomatic.test-matrix.include]]
cloup-version = "released"

[[tool.repomatic.test-matrix.exclude]]
os = "ubuntu-26.04"
python-version = "3.15"

[[tool.repomatic.test-matrix.exclude]]
