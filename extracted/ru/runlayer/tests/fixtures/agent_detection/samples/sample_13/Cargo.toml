[package]
name = "rig-rust-agent"
version = "0.1.0"
edition = "2021"
description = "Minimal Rig agent with tools (framework detection corpus)."

[dependencies]
rig-core = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
