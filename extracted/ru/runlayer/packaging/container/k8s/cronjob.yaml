# Runlayer AI Watch scanner — single-pass CronJob (single-node / simple
# alternative to the DaemonSet).
#
# ┌─ RUN EITHER THE DAEMONSET OR THE CRONJOB, NOT BOTH ─────────────────────────┐
# │ Both scan the same node-local homes and report to the same device id (the   │
# │ host machine-id), so running both double-reports every node. Pick one.      │
# └─────────────────────────────────────────────────────────────────────────────┘
#
# PER-NODE CAVEAT: a CronJob does NOT naturally run once-per-node — it schedules
# a single Job, whose pod lands on ONE node (whichever the scheduler picks), so
# only that node gets scanned each tick. For fleet-wide per-node coverage use
# the DaemonSet (the recommended shape). This CronJob fits:
#   * single-node clusters, or
#   * a specific node pinned via `nodeSelector`/`nodeName` below (one CronJob
#     per node you want covered).
# `--once` / RUNLAYER_RUN_ONCE=1 makes the entrypoint do a single pass and exit.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: runlayer-aiwatch
  namespace: runlayer
  labels:
    app.kubernetes.io/name: runlayer-aiwatch
    app.kubernetes.io/part-of: runlayer
    app.kubernetes.io/component: scanner
spec:
  schedule: "*/15 * * * *"
  # Never overlap passes: a slow scan still running when the next tick fires
  # skips the new run (mirrors the entrypoint's own flock overlap guard).
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # Don't fire a backlog of missed runs after downtime.
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      # Single pass; don't retry a failed pass within the tick — the next
      # */15 schedule is the retry.
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: runlayer-aiwatch
            app.kubernetes.io/part-of: runlayer
            app.kubernetes.io/component: scanner
        spec:
          restartPolicy: Never
          # Detect-only: no K8s API access ⇒ no RBAC, and drop the SA token.
          automountServiceAccountToken: false
          # Private ECR image — add a pull secret if nodes lack ECR access
          # (see daemonset.yaml + the deploy guide):
          # imagePullSecrets:
          #   - name: runlayer-aiwatch-ecr
          # The image is linux/amd64-only and mounts Linux host paths — always
          # keep the os/arch pins. To target a specific node (per-node use),
          # additionally set kubernetes.io/hostname: <node-name>. Without a
          # hostname pin the pod lands on any matching node.
          nodeSelector:
            kubernetes.io/os: linux
            kubernetes.io/arch: amd64
          containers:
            - name: scanner
              # PLACEHOLDER — substitute the real image pushed by the ECR-publish
              # chunk (kustomize `images:` override or edit directly). Do NOT
              # commit a real registry here.
              image: <ECR_REGISTRY>/runlayer/ai-watch-linux:<tag>
              imagePullPolicy: IfNotPresent
              # Single-pass mode. RUNLAYER_RUN_ONCE=1 and the --once arg are
              # redundant belt-and-suspenders; either alone suffices.
              args: ["--once"]
              env:
                - name: RUNLAYER_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: runlayer-aiwatch
                      key: RUNLAYER_API_KEY
                - name: RUNLAYER_HOSTNAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
                - name: RUNLAYER_RUN_ONCE
                  value: "1"
              envFrom:
                - configMapRef:
                    name: runlayer-aiwatch
              securityContext:
                # See daemonset.yaml for the rationale on each field.
                runAsUser: 0
                runAsGroup: 0
                allowPrivilegeEscalation: true
                privileged: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                  add:
                    - SETUID
                    - SETGID
                # SELinux (RHEL/OpenShift): reading host user_home_t is blocked by
                # default — grant an SCC / set an seLinuxOptions type valid on YOUR
                # cluster (do not hardcode blindly):
                # seLinuxOptions:
                #   type: spc_t
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              volumeMounts:
                # Granular read-only host mounts — NOT a whole-root mount. Mounting
                # the node's entire filesystem into a uid-0 container would expose
                # node credentials the scanner never needs (/etc/shadow, kubelet
                # certs, /var/lib/kubelet pod secrets), which the K8s hostPath docs
                # warn against. We mount only what the scanner reads. Coverage is
                # "users whose homes are under a mounted prefix": /home/* and /root
                # by default. Homes elsewhere (service accounts under /var/lib,
                # custom /srv homes) are NOT silently missed — the entrypoint LOGS
                # each skipped user and a scanned/skipped summary; add a mount +
                # matching hostPath volume below for any prefix you need covered.
                - name: host-home
                  mountPath: /host/home
                  readOnly: true
                  # Uncomment on K8s 1.30+ with the RecursiveReadOnlyMounts feature
                  # gate (pre-1.30 API servers REJECT this field). See daemonset.yaml.
                  # recursiveReadOnly: IfPossible
                - name: host-root
                  mountPath: /host/root
                  readOnly: true
                  # Uncomment on K8s 1.30+ with the RecursiveReadOnlyMounts feature
                  # gate (pre-1.30 API servers REJECT this field). See daemonset.yaml.
                  # recursiveReadOnly: IfPossible
                - name: host-passwd
                  mountPath: /host/etc/passwd
                  readOnly: true
                - name: host-group
                  mountPath: /host/etc/group
                  readOnly: true
                - name: host-machine-id
                  mountPath: /host/etc/machine-id
                  readOnly: true
                # Writable scratch so readOnlyRootFilesystem holds: the overlap-guard
                # lock + heartbeat live in /run, mktemp for the passwd snapshot in /tmp.
                - name: run
                  mountPath: /run
                - name: tmp
                  mountPath: /tmp
          volumes:
            # Only the paths the scanner reads (see volumeMounts). To cover homes
            # outside /home + /root, add another hostPath here + a matching mount.
            - name: host-home
              hostPath:
                path: /home
                type: Directory
            - name: host-root
              hostPath:
                path: /root
                type: Directory
            - name: host-passwd
              hostPath:
                path: /etc/passwd
                type: File
            - name: host-group
              hostPath:
                path: /etc/group
                type: File
            - name: host-machine-id
              hostPath:
                path: /etc/machine-id
                type: File
            - name: run
              emptyDir: {}
            - name: tmp
              emptyDir: {}
