# EXAMPLE ONLY — do NOT commit a real API key.
#
# Preferred: create the Secret imperatively so the key never lands in git:
#
#   kubectl -n runlayer create secret generic runlayer-aiwatch \
#     --from-literal=RUNLAYER_API_KEY=rl_org_xxxxxxxxxxxxxxxx
#
# This file exists so you can see the exact shape the Deployments expect
# (a Secret named `runlayer-aiwatch` with an `RUNLAYER_API_KEY` key). If you
# do apply it, replace the placeholder first and keep it out of version control.
apiVersion: v1
kind: Secret
metadata:
  name: runlayer-aiwatch
  namespace: runlayer
  labels:
    app.kubernetes.io/name: runlayer-aiwatch
    app.kubernetes.io/part-of: runlayer
type: Opaque
stringData:
  # Org API key. Empty ⇒ the entrypoint exits 0 without scanning
  # (unconfigured-fleet gate), so a placeholder is inert but pointless.
  RUNLAYER_API_KEY: "REPLACE_WITH_rl_org_API_KEY"
