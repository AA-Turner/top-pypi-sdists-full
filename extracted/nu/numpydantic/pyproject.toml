[project]
name = "numpydantic"
dynamic = []
description = "Type and shape validation and serialization for arbitrary array types in pydantic models"
authors = [
    { name = "sneakers-the-rat", email = "sneakers-the-rat@protonmail.com" },
]
dependencies = [
    "pydantic>=2.7.0",
    "numpy>=2.0.0",
    "typing-extensions>=4.11.0;python_version<'3.11'",
]
requires-python = "<4.0,>=3.10"
readme = "README.md"
repository = "https://github.com/p2p-ld/numpydantic"
keywords = [
    "arrays",
    "validation",
    "serialization",
    "numpy",
    "pydantic",
]
classifiers = [
    "Framework :: Pydantic",
    "Framework :: Pydantic :: 2",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: File Formats :: JSON :: JSON Schema",
    "Topic :: Utilities",
]
version = "1.10.0"

[project.license]
text = "MIT"

[project.urls]
homepage = "https://numpydantic.readthedocs.io"
documentation = "https://numpydantic.readthedocs.io"
repository = "https://github.com/p2p-ld/numpydantic"
changelog = "https://numpydantic.readthedocs.io/en/latest/changelog.html"

[project.optional-dependencies]
dask = [
    "dask>=2024.4.0",
]
hdf5 = [
    "h5py>=3.10.0",
]
video = [
    "opencv-python>=4.9.0.80",
]
zarr = [
    "zarr>=2.17.2,<3.0.0",
]
arrays = [
    "numpydantic[dask,hdf5,zarr,video]",
]
mypy = [
    "mypy>=1.17.1",
    "tomli>=2.4.1;python_version<'3.11'",
]
tests = [
    "numpydantic[arrays,mypy]",
    "pytest>=7.4.0",
    "pytest-depends<2.0.0,>=1.0.1",
    "coverage>=6.1.1",
    "pytest-cov>=4.1.0",
    "coveralls>=3.3.1",
    "pyright>=1.1.408",
    "pytest-xdist>=3.8.0",
]
docs = [
    "numpydantic[arrays,mypy]",
    "sphinx>=8.0.0;python_version>='3.11'",
    "furo>=2024.1.29",
    "myst-parser>=2.0.0",
    "autodoc-pydantic>=2.0.1",
    "sphinx-design>=0.5.0",
    "sphinxcontrib-mermaid>=0.9.2",
    "myst-nb>=1.1.1",
    "rich>=13.8.1",
    "erbsland-sphinx-ansi>=1.2.0",
    "sphinxcontrib-programoutput>=0.19",
]
dev = [
    "numpydantic[tests,docs]",
    "sphinx-autobuild>=2021.3.14",
    "black>=24.1.1",
    "ruff<1.0.0,>=0.2.0",
]

[tool.pdm]
distribution = true

[tool.pdm.build]
includes = []

[tool.pdm.resolution]
exclude-newer = "7d"

[tool.pdm.scripts]
test = "pytest"
docs = "sphinx-autobuild ./docs ./docs/_build"
docs-prod = "python -m sphinx -M html ./docs ./docs/_build -W -E -a --keep-going"

[tool.pdm.scripts.lint]
composite = [
    "ruff check",
    "black . --diff",
]

[tool.pdm.scripts.format]
composite = [
    "black .",
    "ruff check --fix",
]

[tool.pdm.scripts.lock]
composite = [
    "pdm lock --with :all --python=\">=3.10,<3.12\"",
    "pdm lock --with :all --python=\">=3.12,<3.14\" --append",
    "pdm lock --with :all --python=\">=3.14\" --append",
]

[tool.pdm.version]
source = "scm"
tag_filter = "v*"
tag_regex = "v(?P<version>([1-9][0-9]*!)?(0|[1-9][0-9]*)(\\.(0|[1-9][0-9]*))*((a|b|c|rc)(0|[1-9][0-9]*))?(\\.post(0|[1-9][0-9]*))?(\\.dev(0|[1-9][0-9]*))?$)$"

[tool.pytest.ini_options]
addopts = [
    "--cov=numpydantic",
    "--cov-append",
]
testpaths = [
    "tests",
]
filterwarnings = [
    "ignore:.*deprecated alias.*Deprecated NumPy 1\\.24.*",
    "ignore:.*divide by zero encountered in log10.*",
]
markers = [
    "dtype: mark test related to dtype validation",
    "shape: mark test related to shape validation",
    "json_schema: mark test related to json schema generation",
    "serialization: mark test related to serialization",
    "proxy: test for proxy class in any interface",
    "dask: dask interface",
    "hdf5: hdf5 interface",
    "numpy: numpy interface",
    "video: video interface",
    "zarr: zarr interface",
    "datetime: datetime handling",
    "union: union dtypes",
    "pipe_union: union dtypes specified with a pipe",
    "scalar: scalar values",
    "model: dtype annotatiosn are a pydantic model",
    "typechecking: type checker integration - mypy, pyright",
]

[tool.black]
target-version = [
    "py310",
    "py311",
    "py312",
    "py313",
    "py314",
]

[tool.ruff]
target-version = "py310"
include = [
    "src/numpydantic/**/*.py",
    "tests/**/*.py",
    "pyproject.toml",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "UP",
    "B",
    "SIM",
    "I",
    "ANN",
    "PERF",
    "NPY",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D106",
    "D107",
    "D207",
    "D208",
    "D210",
    "D211",
    "D419",
    "T100",
]
ignore = [
    "ANN401",
    "ANN204",
    "B905",
    "D107",
]
fixable = [
    "ALL",
]

[tool.ruff.lint.per-file-ignores]
"src/numpydantic/testing/*" = [
    "D",
    "F722",
]
"tests/*" = [
    "D",
    "F403",
    "F722",
    "ANN",
]

[tool.mypy]
plugins = [
    "numpydantic.mypy",
    "pydantic.mypy",
]

[[tool.mypy.overrides]]
module = [
    "zarr.*",
]
follow_untyped_imports = true

[tool.numpydantic.mypy]
interfaces = [
    "numpy",
    "dask",
    "zarr",
]

[tool.pydantic-mypy]
init_typed = true

[tool.coverage.run]
omit = [
    "src/numpydantic/vendor/*",
]

[build-system]
requires = [
    "pdm-backend",
]
build-backend = "pdm.backend"
