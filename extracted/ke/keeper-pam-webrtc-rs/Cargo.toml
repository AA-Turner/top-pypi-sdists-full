[workspace]
members = ["crates/keeper-pam-webrtc-rs", "crates/webrtc-bindings", "crates/guacr", "crates/guacr-encoder", "crates/guacr-handlers", "crates/guacr-protocol", "crates/guacr-terminal", "crates/guacr-ssh", "crates/guacr-telnet", "crates/guacr-rdp", "crates/guacr-vnc", "crates/guacr-database", "crates/guacr-sftp", "crates/guacr-rbi", "crates/guacr-threat-detection", "crates/guacr-tn3270", "crates/guacr-tn5250", "crates/guacr-recording", "crates/guacr-recorder", "crates/guacr-guacd", "crates/pam-socks5"]
resolver = "2"

[workspace.package]
version = "2.2.2"
edition = "2021"
license = "MIT"
authors = ["Keeper Security Engineering <pam@keepersecurity.com>"]

# Shared dependencies across workspace
[workspace.dependencies]
# QUIC / HTTP-3 / WebTransport (see crates/keeper-pam-quic — dials kturn relay)
# FIPS 140-3: aws-lc-rs FIPS module for both the TLS handshake and QUIC's own
# Initial/Retry packet protection (quinn-proto has its own compile-time crypto
# backend, independent of the rustls CryptoProvider passed at runtime).
# "aws-lc-rs" is required in addition to "rustls-aws-lc-rs-fips" because it
# gates quinn's own Endpoint::client()/server() helpers at the quinn-crate
# level (rustls-aws-lc-rs-fips only implies quinn-proto's equivalent); the
# actual crypto stays FIPS via proto/aws-lc-rs-fips either way.
quinn = { version = "0.11", default-features = false, features = ["rustls-aws-lc-rs-fips", "aws-lc-rs", "runtime-tokio", "platform-verifier", "log", "bloom"] }
h3 = "0.0.8"
h3-quinn = { version = "0.0.10", features = ["datagram"] }
http = "1"
h3-webtransport = "0.1.2"
rcgen = "0.13"
time = { version = "0.3", features = ["std"] }
# KeeperDB SDK — git dep tracking the release branch (latest keeperdb). Cargo.lock pins
# the exact commit for reproducible CI; run `cargo update -p keeperdb-core` to pull forward.
# CI fetches over https via the ACCESS_TOKEN insteadOf rewrite in pr-tests.yml; deny.toml allows it.
keeperdb-core = { git = "https://github.com/Keeper-Security/keeperdb.git", branch = "release" }
# Unified driver registry — aggregates every keeperdb driver behind feature flags.
# guacr connects via keeperdb_drivers::with_builtin_factories() + registry.connect(),
# so adding a driver in keeperdb needs no guacr code change (only the feature list here).
# Lean by design: depends on keeperdb-core + driver crates, NOT the full keeperdb-sdk
# (which would drag in storage/AI/auth and reintroduce banned openssl/aws weight).
keeperdb-drivers = { git = "https://github.com/Keeper-Security/keeperdb.git", branch = "release", features = ["all-drivers"] }
secrecy = { version = "0.8", features = ["serde"] }

# Core async
tokio = { version = "1.49.0", features = ["full", "rt-multi-thread"] }
tokio-util = "0.7.18"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
async-trait = "0.1.89"

# Data structures
bytes = "1.11.1"
crossbeam-queue = "0.3.12"
dashmap = "6.1.0"
parking_lot = "0.12"
smallvec = "1.15.1"

# WebRTC
webrtc = "0.14.0"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

# Error handling
anyhow = "1.0.100"
thiserror = "2.0.17"

# Logging
log = "0.4.29"
zmq = "0.10"
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.20", features = ["fmt", "env-filter", "json", "tracing-log"] }

# Utilities
uuid = { version = "1.19.0", features = ["v4"] }
base64 = "0.22.1"
lazy_static = "1.5.0"
once_cell = "1.21.3"
arc-swap = "1.8.0"
bitflags = "2.9"

# Python bindings
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py38"] }

# Crate-specific dependencies
aes-gcm = "0.10.3"
des = "0.8"
flate2 = "1.1"
chrono = { version = "0.4.42", features = ["serde"] }
futures = "0.3.31"
heapless = "0.9.2"
hex = "0.4.3"
hkdf = "0.12.4"
if-addrs = "0.14"
ipnet = "2.11"
p256 = { version = "0.13.2", features = ["ecdsa", "ecdh"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
# Workspace default is the non-FIPS "ring" provider (matches the pre-QUIC
# baseline), so crates that don't need FIPS — WebRTC DTLS, guacr, keeperdb-proxy
# — don't pull the heavy aws-lc-fips build (Go/CMake/Perl toolchain). FIPS is
# scoped to keeper-pam-quic, which opts in via
# `rustls = { workspace = true, features = ["fips"] }`; feature unification then
# still makes the combined keeper_pam_connections wheel FIPS. Crates needing the
# aws_lc_rs provider without FIPS (keeperdb-proxy) add features = ["aws_lc_rs"].
rustls = { version = "0.23.36", features = ["ring"], default-features = false }
# Direct dependency (only used by keeper-pam-quic) so it can call
# aws_lc_rs::try_fips_mode() for the module-level FIPS check, distinct from
# rustls's CryptoProvider::fips() module-and-suite-policy check.
aws-lc-rs = { version = "1", default-features = false, features = ["fips"] }
sha2 = "0.10.9"
socket2 = { version = "0.6.1", features = ["all"] }

# keeperdb-proxy dependencies
clap = { version = "4", features = ["derive"] }
serde_yaml = "0.9"
sha1 = "0.10"
md-5 = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
hmac = "0.12"
aes = "0.8"
cbc = "0.1"
ed25519-dalek = { version = "2.1", features = ["hazmat"] }
rsa = { version = "0.9", features = ["sha1"] }
zeroize = { version = "1.7", features = ["derive"] }
rand = "0.8"
libsodium-sys = { version = "0.2" }
subtle = "2.5"
tracing-log = "0.2"
tokio-rustls = "0.26"
zstd = { version = "0.13", features = ["zstdmt"] }
rustls-pemfile = "2"
webpki-roots = "1.0"
pyo3-log = "0.13.4"

[patch.crates-io]
# tiberius: match the fork keeperdb-driver-mssql is authored against. Keeper's fork
# patches cross-platform NTLM (AuthMethod::windows on unix, prisma/tiberius#408) which
# our old vendor/tiberius copy lacked. Must live in the ROOT [patch] because the root
# workspace patch is the only one that applies to path-dep keeperdb crates.
tiberius = { git = "https://github.com/Keeper-Security/tiberius", rev = "f012b7948be64dcc95d2a6d3f8db8dd7e8a916b2" }

[profile.dev]
incremental = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
strip = "symbols"

[profile.release-dist]
inherits = "release"
lto = "fat"
codegen-units = 1
