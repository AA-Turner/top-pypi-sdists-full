[package]
name = "keeper-pam-webrtc-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Keeper WebRTC tube abstraction - secure WebRTC tunneling core library"

[lib]
name = "keeper_pam_webrtc_rs"
crate-type = ["rlib"]

[features]
# Transport only by default. `builtin-handlers` pulls the whole guacr protocol tree
# (RDP/VNC/SSH/RBI/database and their native toolchains), so it is opt-in: a dev
# working on the WebRTC transport should not have to build it. Consumers that serve
# protocol sessions must enable it explicitly — python-bindings does, and
# decide_guacd_route() fails a guacr session loudly when it is off rather than
# falling through to external guacd.
default = []
builtin-handlers = []
python-support = ["pyo3"]
# FFmpeg hardware H.264 encode — passthrough to guacr (rdp/rbi). Weak-dep so it's a no-op
# when builtin-handlers/guacr is disabled.
ffmpeg = []
host-sftp = []
threat-detection = []
# ZeroMQ recording transports — passthrough to guacr. Off by default; the file/FIFO
# recording path needs no libzmq. Same weak-dep shape as ffmpeg.
zmq-transport = ["guacr-handlers/zmq-transport"]
profiling = []
# Opt-in HTTP metrics endpoint (/metrics Prometheus, /metrics/json JSON).
# When disabled, no HTTP server is compiled (AC-3 of observability R2).
metrics-http = ["dep:axum", "dep:tokio-stream"]

[dependencies]
# Protocol handler traits and registry (always available for trait-based code)
guacr-handlers = { path = "../guacr-handlers" }

# Concrete protocol handlers (optional, provides built-in handler registry)
# Includes: SSH, Telnet, VNC, SFTP, RDP, Database, RBI (Remote Browser Isolation)

# Guacamole protocol codec (streaming parser, instruction types)
guacr-protocol = { path = "../guacr-protocol" }

# Guacd wire protocol (client-side handshake)
guacr-guacd = { path = "../guacr-guacd" }

# Tunnel protocol crate (SOCKS5)
pam-socks5 = { path = "../pam-socks5" }

# Async trait (for EventCallback impl in handler_connections)
async-trait.workspace = true

# Core async
tokio.workspace = true
tokio-util.workspace = true

# Data structures
bytes.workspace = true
crossbeam-queue.workspace = true
dashmap.workspace = true
parking_lot.workspace = true
smallvec.workspace = true

# WebRTC
webrtc.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Logging
log.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Utilities
uuid.workspace = true
base64.workspace = true
lazy_static.workspace = true
once_cell.workspace = true
arc-swap.workspace = true
bitflags.workspace = true

# Crate-specific dependencies
aes-gcm.workspace = true
chrono.workspace = true
flate2 = "1.0"
futures.workspace = true
heapless.workspace = true
hex.workspace = true
hkdf.workspace = true
if-addrs.workspace = true
ipnet.workspace = true
p256.workspace = true
pyo3 = { workspace = true, optional = true }
# HTTP server for metrics endpoint (optional, only with metrics-http feature)
axum = { version = "0.7", optional = true }
tokio-stream = { version = "0.1", optional = true }
reqwest.workspace = true
rustls.workspace = true
sha2.workspace = true
socket2.workspace = true

[dev-dependencies]
ctor = "0.6.2"  # For test initialization (rustls crypto provider setup)

# IronRDP patches are now at workspace level
