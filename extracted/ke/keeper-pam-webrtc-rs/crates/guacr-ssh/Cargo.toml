[package]
name = "guacr-ssh"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SSH protocol handler for guacr"

[dependencies]
# Local dependencies
guacr-handlers = { path = "../guacr-handlers" }
guacr-protocol = { path = "../guacr-protocol" }
guacr-recorder = { path = "../guacr-recorder" }
guacr-terminal = { path = "../guacr-terminal" }

# Workspace dependencies
tokio.workspace = true
async-trait.workspace = true
bytes.workspace = true
thiserror.workspace = true
log.workspace = true

# SSH client
russh.workspace = true
russh-keys.workspace = true
ssh-key.workspace = true

# Utilities
base64.workspace = true

# Threat detection (optional)
guacr-threat-detection = { path = "../guacr-threat-detection", optional = true }
uuid = { workspace = true, optional = true }

[features]
default = []
threat-detection = ["guacr-threat-detection", "uuid"]
