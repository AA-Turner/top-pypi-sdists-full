[package]
name = "guacr-rbi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Remote Browser Isolation (RBI) handler for guacr"
readme = "README.md"

[dependencies]
# Local dependencies
guacr-handlers = { path = "../guacr-handlers" }
guacr-terminal = { path = "../guacr-terminal" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Workspace dependencies
tokio.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures = "0.3"
thiserror.workspace = true
log.workspace = true

# Browser engine
# Chrome CDP - uses installed Chrome via DevTools Protocol
chromiumoxide = { version = "0.7", optional = true }

# Protocol parsing
guacr-protocol = { path = "../guacr-protocol" }

# JSON for configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
base64.workspace = true
uuid.workspace = true
once_cell = "1"
reqwest = { workspace = true, optional = true }

# Cryptography for secure TOTP implementation
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"


# Secure temp directory creation for session isolation
tempfile = "3"

# Cross-platform file locking (replaces Linux-only flock)
fs2 = "0.4"

# Cross-platform binary path resolution (replaces `which`/`where` subprocess)
which = "5.0"

# Threat detection (optional)
guacr-threat-detection = { path = "../guacr-threat-detection", optional = true }

# Unix system calls for Linux sandbox (chrome_sandbox.rs)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["chrome"]
chrome = ["chromiumoxide", "reqwest"]
threat-detection = ["guacr-threat-detection"]
