[package]
name = "guacr-recording"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Session recording for Guacamole protocol handlers"

[features]
default = []
# ZeroMQ recording transport. Off by default: zmq-sys builds libzmq from source
# and needs a C++ toolchain, which consumers that never record should not pay
# for. Crates that ship recording enable it explicitly.
zmq-transport = ["dep:zmq"]

[dependencies]
async-trait.workspace = true
bytes.workspace = true
# Terminal-family handlers record binary opcode frames, so classifying what a frame
# carries means reading the opcode byte against the real `Opcode` enum rather than
# re-declaring the numbers here. guacr-protocol depends on none of our crates.
guacr-protocol = { path = "../guacr-protocol" }
chrono.workspace = true
log.workspace = true
rustix = { version = "1.1.5", features = ["fs"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
zmq = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
