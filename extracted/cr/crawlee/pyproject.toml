[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[project]
name = "crawlee"
version = "1.9.1"
description = "Crawlee for Python"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
keywords = [
    "apify",
    "automation",
    "chrome",
    "crawlee",
    "crawler",
    "headless",
    "scraper",
    "scraping",
]
dependencies = [
    "async-timeout>=5.0.1",
    "cachetools>=5.5.0",
    "colorama>=0.4.0",
    "impit>=0.8.0",
    "more-itertools>=10.2.0",
    "protego>=0.5.0",
    "psutil>=6.0.0",
    "pydantic-settings>=2.12.0",
    "pydantic>=2.11.0",
    "tldextract>=5.3.0",
    "typing-extensions>=4.10.0",
    "yarl>=1.18.0",
]

[[project.authors]]
name = "Apify Technologies s.r.o."
email = "support@apify.com"

[project.optional-dependencies]
all = ["crawlee[adaptive-crawler,pydantic-ai,beautifulsoup,cli,curl-impersonate,httpx,parsel,playwright,otel,sql_sqlite,sql_postgres,sql_mysql,stagehand,redis]"]
adaptive-crawler = [
    "crawlee[beautifulsoup,parsel]",
    "jaro-winkler>=2.0.3",
    "playwright>=1.27.0",
    "scikit-learn>=1.6.0",
    "apify_fingerprint_datapoints>=0.0.3",
    "browserforge>=1.2.4",
]
pydantic-ai = [
    "pydantic-ai-slim[openai]>=2.1.0",
    "parsel>=1.10.0",
    "lxml[html_clean]>=5.2.0",
]
beautifulsoup = [
    "beautifulsoup4[lxml]>=4.12.0",
    "html5lib>=1.0",
]
cli = [
    "cookiecutter>=2.6.0",
    "inquirer>=3.3.0",
    "rich>=13.9.0",
    "typer>=0.26.0",
]
curl-impersonate = ["curl-cffi>=0.9.0"]
httpx = [
    "httpx[brotli,http2,zstd]>=0.27.0",
    "apify_fingerprint_datapoints>=0.0.2",
    "browserforge>=1.2.3",
]
parsel = ["parsel>=1.10.0"]
playwright = [
    "playwright>=1.27.0",
    "apify_fingerprint_datapoints>=0.0.2",
    "browserforge>=1.2.3",
]
otel = [
    "opentelemetry-api>=1.34.1",
    "opentelemetry-distro[otlp]>=0.54",
    "opentelemetry-instrumentation>=0.54",
    "opentelemetry-instrumentation-httpx>=0.54",
    "opentelemetry-sdk>=1.34.1",
    "opentelemetry-semantic-conventions>=0.54",
    "wrapt>=1.17.0",
]
sql_postgres = [
    "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
    "asyncpg>=0.24.0",
]
stagehand = [
    "stagehand>=3.19.5",
    "playwright>=1.27.0",
    "apify_fingerprint_datapoints>=0.0.2",
    "browserforge>=1.2.3",
]
sql_sqlite = [
    "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
    "aiosqlite>=0.21.0",
]
sql_mysql = [
    "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
    "aiomysql>=0.3.2",
    "cryptography>=46.0.5",
]
redis = ["redis[hiredis] >= 7.0.0"]

[project.scripts]
crawlee = "crawlee._cli:cli"

[project.urls]
"Apify Homepage" = "https://apify.com"
Changelog = "https://crawlee.dev/python/docs/changelog"
Discord = "https://discord.com/invite/jyEM2PRvMU"
Documentation = "https://crawlee.dev/python/docs/quick-start"
Homepage = "https://crawlee.dev/python"
"Issue Tracker" = "https://github.com/apify/crawlee-python/issues"
"Release Notes" = "https://crawlee.dev/python/docs/upgrading"
"Source Code" = "https://github.com/apify/crawlee-python"

[dependency-groups]
dev = [
    "black>=24.3.0",
    "anyio<5.0.0",
    "apify_client<3.0.0",
    "build<2.0.0",
    "fakeredis[probabilistic,json,lua]<3.0.0",
    "poethepoet<1.0.0",
    "pre-commit<5.0.0",
    "proxy-py<3.0.0",
    "pydoc-markdown<5.0.0",
    "pytest-asyncio<2.0.0",
    "pytest-cov<8.0.0",
    "pytest-rerunfailures<17.0.0",
    "pytest-timeout<3.0.0",
    "pytest-xdist<4.0.0",
    "pytest<10.0.0",
    "ruff~=0.16.0",
    "setuptools",
    "ty~=0.0.0",
    "types-beautifulsoup4<5.0.0",
    "types-cachetools<8.0.0",
    "types-colorama<1.0.0",
    "types-psutil<8.0.0",
    "types-python-dateutil<3.0.0",
    "uvicorn[standard]<1.0.0",
]

[tool.ruff]
line-length = 120
include = [
    "**/*.py",
    "**/*.md",
    "**/*.mdx",
]
exclude = ["website/versioned_docs/**"]
extend-exclude = ["src/crawlee/project_template"]

[tool.ruff.extension]
mdx = "markdown"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",
    "ASYNC109",
    "BLE001",
    "C901",
    "COM812",
    "CPY001",
    "D100",
    "D104",
    "D107",
    "D203",
    "D213",
    "D413",
    "EM",
    "G004",
    "ISC001",
    "FIX",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PYI034",
    "PYI036",
    "S102",
    "S105",
    "S106",
    "S301",
    "S303",
    "S311",
    "TD002",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"**/{scripts}/*" = [
    "D",
    "INP001",
    "PLR2004",
    "T20",
]
"**/{tests}/*" = [
    "ASYNC230",
    "D",
    "INP001",
    "PLR2004",
    "S101",
    "SLF001",
    "T20",
    "TRY301",
]
"**/{docs,website}/**" = [
    "D",
    "INP001",
    "F841",
    "N999",
    "T201",
]
"**/docs/examples/code_examples/*crawler_with_error_snapshotter.py" = ["PLR2004"]
"**/docs/guides/code_examples/running_in_web_server/server.py" = ["TC002"]
"**/docs/guides/code_examples/creating_web_archive/*.*" = ["ASYNC230"]
"**/docs/guides/code_examples/scrapy_migration/scrapy_*.py" = [
    "ANN",
    "RUF012",
]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
]

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["id"]

[tool.ruff.lint.isort]
known-first-party = ["crawlee"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "-r a --verbose"
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
timeout = 1800
markers = ["run_alone: marks tests that must run in isolation"]
filterwarnings = [
    "ignore:websockets.legacy is deprecated:DeprecationWarning",
    "ignore:websockets.server.WebSocketServerProtocol is deprecated:DeprecationWarning",
]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = [
    "src",
    "tests",
    "scripts",
    "docs",
    "website",
]
exclude = [
    "src/crawlee/project_template",
    "docs/guides/code_examples/storage_clients/custom_storage_client_example.py",
    "website/versioned_docs",
]

[tool.ty.rules]
unused-ignore-comment = "error"

[[tool.ty.overrides]]
include = [
    "docs/**/*.py",
    "website/**/*.py",
]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "assert_never()",
]

[tool.ipdb]
context = 7

[tool.uv]
exclude-newer = "24 hours"

[tool.uv.build-backend]
source-include = [
    "CHANGELOG.md",
    "CONTRIBUTING.md",
]

[tool.uv.exclude-newer-package]
apify-client = false
apify-shared = false
apify_fingerprint_datapoints = false
crawlee = false

[tool.poe.tasks]
clean = "rm -rf .coverage .pytest_cache .ruff_cache .ty_cache .uv-cache build coverage-unit.xml dist htmlcov website/.docusaurus website/module_shortcuts.json website/node_modules "
install-sync = "uv sync --all-extras"
build = "uv build --verbose"
publish-to-pypi = "uv publish --verbose --token ${APIFY_PYPI_TOKEN_CRAWLEE}"
type-check = "uv run ty check"
check-code = [
    "lint",
    "type-check",
    "unit-tests",
]

[tool.poe.tasks.install-dev]
shell = "uv sync --all-extras && uv run pre-commit install && uv run playwright install"

[tool.poe.tasks.lint]
shell = "uv run ruff format --check && uv run ruff check"

[tool.poe.tasks.format]
shell = "uv run ruff check --fix && uv run ruff format"

[tool.poe.tasks.unit-tests]
shell = """
uv run pytest --numprocesses=1 -m "run_alone" tests/unit && uv run pytest --numprocesses=${TESTS_CONCURRENCY:-auto} -m "not run_alone" tests/unit
"""

[tool.poe.tasks.unit-tests-cov]
shell = """
uv run pytest --numprocesses=1 -m "run_alone" --cov=src/crawlee --cov-report=xml:coverage-unit.xml tests/unit && uv run pytest --numprocesses=${TESTS_CONCURRENCY:-auto} -m "not run_alone" --cov=src/crawlee --cov-report=xml:coverage-unit.xml --cov-append tests/unit
"""

[tool.poe.tasks.e2e-templates-tests]
cmd = """
uv run pytest --numprocesses=${TESTS_CONCURRENCY:-auto} --basetemp=./.pytest-tmp tests/e2e/project_template
"""

[tool.poe.tasks.update-docs-theme]
shell = "pnpm update @apify/docs-theme"
cwd = "website"

[tool.poe.tasks.build-docs]
shell = "./build_api_reference.sh && pnpm install && uv run pnpm build"
cwd = "website"

[tool.poe.tasks.run-docs]
shell = "./build_api_reference.sh && pnpm install && uv run pnpm start"
cwd = "website"
