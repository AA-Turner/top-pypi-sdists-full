[workspace]
resolver = "2"
members = ["crates/html-to-markdown-py"]

[workspace.package]
version = "3.23.4"
edition = "2024"
authors = ["Na'aman Hirschfeld <naaman@xberg.io>", "Tobias Perlstein <tobias@xberg.io>"]
license = "MIT"
repository = "https://github.com/xberg-io/html-to-markdown"
homepage = "https://xberg.io"
documentation = "https://docs.rs/html-to-markdown-rs"
readme = "README.md"
keywords = ["html", "markdown", "converter"]
categories = ["text-processing", "web-programming"]
rust-version = "1.99"

[workspace.dependencies]
ahash = { version = "0.8", default-features = false, features = ["std", "compile-time-rng"] }
astral-html = "=0.0.4"
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
clap_mangen = "0.3"
encoding_rs = "0.8"
html-to-markdown-rs = { version = "3.23.4" }
html5ever = "0.40.1"
mimalloc = { version = "0.1", default-features = false }
once_cell = "1.21"
regex = "1.13"
serde_json = "1.0"
smallvec = "1"
tempfile = "3.27"
thiserror = "2.0"
tikv-jemallocator = "0.7"
toml = "1.2"
tracing = "0.1"
url = "2.5"

