[workspace]
resolver = "2"
members = ["crates/html-to-markdown-py"]

[workspace.package]
version = "3.8.1"
edition = "2024"
authors = ["Na'aman Hirschfeld <naaman@xberg.io>"]
description = "High-performance HTML to Markdown converter"
license = "MIT"
repository = "https://github.com/xberg-io/html-to-markdown"
homepage = "https://xberg.io"
documentation = "https://docs.rs/html-to-markdown-rs"
readme = "README.md"
keywords = ["html", "markdown", "converter"]
categories = ["text-processing", "web-programming"]
rust-version = "1.85"

[workspace.dependencies]
ahash = { version = "0.8", default-features = false, features = ["std", "compile-time-rng"] }
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
clap_mangen = "0.3"
encoding_rs = "0.8"
ext-php-rs = "0.15.15"
html-to-markdown-rs = { version = "3.8.1" }
html5ever = "0.39.0"
once_cell = "1.21"
pyo3 = { version = "0.29.0", features = ["abi3-py310"] }
rayon = "1.12"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
thiserror = "2.0"
tl = { package = "astral-tl", version = "0.7.11" }
toml = "1.1"
which = "8"

