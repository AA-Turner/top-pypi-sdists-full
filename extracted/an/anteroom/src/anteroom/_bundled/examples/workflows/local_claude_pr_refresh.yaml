kind: workflow
id: local_claude_pr_refresh
version: 0.1.0

inputs:
  issue_number:
    type: integer
    required: true

steps:
  - id: gate_issue_current
    type: gate
    condition: issue_is_current
    if_false: blocked_issue_not_open

  - id: prepare_issue
    type: runner
    runner: python_script
    command: "scripts/workflows/local_cli_issue_flow.py"
    argv:
      - "prepare"
      - "--issue"
      - "{issue_number}"
    timeout: 300
    retry:
      max_attempts: 2
      backoff: fixed
      initial_delay: 5

  - id: refresh_pr
    type: runner
    runner: python_script
    command: "scripts/workflows/local_cli_issue_flow.py"
    argv:
      - "refresh-pr"
      - "--issue"
      - "{issue_number}"
    timeout: 3600
    retry:
      max_attempts: 2
      backoff: exponential
      initial_delay: 10

  - id: refresh_checks_loop
    type: loop
    max_rounds: 4
    until:
      step: refresh_checks
      field: result_status
      equals: success
    fail_if_not_met: true
    steps:
      - id: refresh_checks
        type: runner
        runner: python_script
        command: "scripts/workflows/local_cli_issue_flow.py"
        argv:
          - "checks"
          - "--issue"
          - "{issue_number}"
          - "--mode"
          - "refresh"
        env:
          ANTEROOM_LOCAL_CHECKS: "ruff check src/ tests/ && python -m pytest tests/unit/ -x -q --tb=short"
        timeout: 1800
        continue_on:
          - failed

      - id: autofix_refresh_checks
        type: runner
        runner: python_script
        when:
          step: refresh_checks
          field: result_status
          equals: failed
        command: "scripts/workflows/local_cli_issue_flow.py"
        argv:
          - "autofix"
          - "--issue"
          - "{issue_number}"
          - "--mode"
          - "refresh"
        env:
          ANTEROOM_LOCAL_AUTOFIX: "ruff check src/ tests/ --fix"
        timeout: 600

      - id: fix_refresh_checks
        type: runner
        runner: python_script
        when:
          step: refresh_checks
          field: result_status
          equals: failed
        command: "scripts/workflows/local_cli_issue_flow.py"
        argv:
          - "fix-checks"
          - "--issue"
          - "{issue_number}"
          - "--mode"
          - "refresh"
        timeout: 1800

  - id: refresh_sync
    type: runner
    runner: python_script
    command: "scripts/workflows/local_cli_issue_flow.py"
    argv:
      - "sync"
      - "--issue"
      - "{issue_number}"
      - "--mode"
      - "refresh"
    timeout: 600
    retry:
      max_attempts: 2
      backoff: fixed
      initial_delay: 5

  - id: assert_pr_fresh
    type: runner
    runner: python_script
    command: "scripts/workflows/local_cli_issue_flow.py"
    argv:
      - "assert-pr-fresh"
      - "--issue"
      - "{issue_number}"
    timeout: 30

  - id: assert_pr_mergeable
    type: runner
    runner: python_script
    command: "scripts/workflows/local_cli_issue_flow.py"
    argv:
      - "assert-pr-mergeable"
      - "--issue"
      - "{issue_number}"
    timeout: 30
