kind: workflow
id: local_claude_codex_issue_delivery
version: 0.3.0

inputs:
  issue_number:
    type: integer
    required: true

steps:
  - id: gate_issue_current
    type: gate
    condition: issue_is_current
    if_false: blocked_issue_not_open

  - id: prepare_issue
    type: runner
    runner: python_script
    command: "scripts/workflows/local_cli_issue_flow.py"
    argv:
      - "prepare"
      - "--issue"
      - "{issue_number}"
    timeout: 300
    retry:
      max_attempts: 2
      backoff: fixed
      initial_delay: 5
    # prepare_issue is the single source of truth for reusable issue worktree
    # cleanliness: stdout remains the machine-consumed path, while stderr/result
    # summary surfaces whether prepare created, reused, or junk-cleaned the worktree.

  - id: assess_existing_work
    type: runner
    runner: python_script
    command: "scripts/workflows/local_cli_issue_flow.py"
    argv:
      - "assess-existing-work"
      - "--issue"
      - "{issue_number}"
    timeout: 120

  - id: plan_loop
    type: loop
    when:
      step: assess_existing_work
      field: result_summary
      not_equals: existing_work_present
    max_rounds: 3
    until:
      step: verify_plan_labels
      field: result_status
      equals: success
    fail_if_not_met: true
    # Stop early when plan review keeps churning. After a few failed rounds on a
    # crisp issue, operators should switch to manual approval or a narrower path
    # instead of burning more draft/review cycles.
    steps:
      - id: draft_plan
        type: runner
        runner: python_script
        command: "scripts/workflows/local_cli_issue_flow.py"
        argv:
          - "plan"
          - "--issue"
          - "{issue_number}"
        timeout: 1800
        retry:
          max_attempts: 2
          backoff: exponential
          initial_delay: 10

      - id: review_plan
        type: runner
        runner: python_script
        command: "scripts/workflows/local_cli_issue_flow.py"
        argv:
          - "review-plan"
          - "--issue"
          - "{issue_number}"
        timeout: 360
        continue_on:
          - failed

      - id: verify_plan_labels
        type: runner
        runner: shell
        command: "gh issue view {issue_number} --json labels -q '.labels[].name' | grep -q senior-approved"
        timeout: 30
        continue_on:
          - failed

  - id: existing_work_loop
    type: loop
    when:
      step: assess_existing_work
      field: result_summary
      equals: existing_work_present
    max_rounds: 2
    until:
      step: verify_existing_work_labels
      field: result_status
      equals: success
    fail_if_not_met: true
    steps:
      - id: plan_existing_work
        type: runner
        runner: python_script
        command: "scripts/workflows/local_cli_issue_flow.py"
        argv:
          - "plan-existing-work"
          - "--issue"
          - "{issue_number}"
        timeout: 120

      - id: review_existing_work
        type: runner
        runner: python_script
        command: "scripts/workflows/local_cli_issue_flow.py"
        argv:
          - "review-existing-work"
          - "--issue"
          - "{issue_number}"
        timeout: 360
        continue_on:
          - failed

      - id: verify_existing_work_labels
        type: runner
        runner: shell
        command: "gh issue view {issue_number} --json labels -q '.labels[].name' | grep -q senior-approved"
        timeout: 30
        continue_on:
          - failed

  - id: gate_plan_approved
    type: gate
    condition: plan_is_approved
    if_false: blocked_plan_not_approved

  - id: implement_issue
    type: runner
    when:
      step: assess_existing_work
      field: result_summary
      not_equals: existing_work_present
    runner: python_script
    command: "scripts/workflows/local_cli_issue_flow.py"
    argv:
      - "implement"
      - "--issue"
      - "{issue_number}"
    timeout: 3600
    retry:
      max_attempts: 2
      backoff: exponential
      initial_delay: 15
    on_failure:
      - id: capture_impl_state
        type: runner
        runner: shell
        command: |
          cd "$(cat /tmp/anteroom-worktree-{issue_number} 2>/dev/null || echo .)" &&
          echo "=== git status ===" && git status --short &&
          echo "=== git diff --stat ===" && git diff --stat &&
          echo "=== recent commits ===" && git log --oneline -5
        timeout: 30

  - id: capture_baseline
    type: runner
    runner: python_script
    command: "scripts/workflows/local_cli_issue_flow.py"
    argv:
      - "capture-baseline"
      - "--issue"
      - "{issue_number}"
    timeout: 1800

  - id: initial_checks_loop
    type: loop
    max_rounds: 8
    until:
      step: initial_checks
      field: result_status
      equals: success
    fail_if_not_met: true
    steps:
      - id: initial_checks
        type: runner
        runner: python_script
        working_dir: "{prepare_issue.summary}"
        command: "scripts/workflows/local_cli_issue_flow.py"
        argv:
          - "checks"
          - "--issue"
          - "{issue_number}"
          - "--mode"
          - "initial"
          - "--allow-baseline"
        env:
          ANTEROOM_LOCAL_CHECKS: "ruff check src/ tests/ && python -m pytest tests/unit/ -x -q --tb=short"
        timeout: 1800
        continue_on:
          - failed

      - id: autofix_checks
        type: runner
        runner: python_script
        working_dir: "{prepare_issue.summary}"
        when:
          step: initial_checks
          field: result_status
          equals: failed
        command: "scripts/workflows/local_cli_issue_flow.py"
        argv:
          - "autofix"
          - "--issue"
          - "{issue_number}"
          - "--mode"
          - "initial"
        env:
          ANTEROOM_LOCAL_AUTOFIX: "ruff check src/ tests/ --fix"
        timeout: 600

      - id: fix_checks
        type: runner
        runner: python_script
        when:
          step: initial_checks
          field: result_status
          equals: failed
        command: "scripts/workflows/local_cli_issue_flow.py"
        argv:
          - "fix-checks"
          - "--issue"
          - "{issue_number}"
          - "--mode"
          - "initial"
        timeout: 1800

  - id: initial_sync
    type: runner
    runner: python_script
    working_dir: "{prepare_issue.summary}"
    command: "scripts/workflows/local_cli_issue_flow.py"
    argv:
      - "sync"
      - "--issue"
      - "{issue_number}"
      - "--mode"
      - "initial"
    timeout: 600
    retry:
      max_attempts: 2
      backoff: fixed
      initial_delay: 5

  - id: open_pr
    type: runner
    runner: python_script
    command: "scripts/workflows/local_cli_issue_flow.py"
    argv:
      - "open-pr"
      - "--issue"
      - "{issue_number}"
    timeout: 300
    retry:
      max_attempts: 2
      backoff: fixed
      initial_delay: 10

  - id: pr_review_loop
    type: loop
    max_rounds: 10
    until:
      step: verify_pr_labels
      field: result_status
      equals: success
    fail_if_not_met: true
    steps:
      - id: inspect_pr
        type: runner
        runner: python_script
        command: "scripts/workflows/local_cli_issue_flow.py"
        argv:
          - "inspect-pr"
          - "--issue"
          - "{issue_number}"
        timeout: 60

      - id: assert_pr_fresh
        type: runner
        runner: python_script
        command: "scripts/workflows/local_cli_issue_flow.py"
        argv:
          - "assert-pr-fresh"
          - "--issue"
          - "{issue_number}"
        timeout: 60
        continue_on:
          - failed

      - id: assert_pr_mergeable
        type: runner
        runner: python_script
        command: "scripts/workflows/local_cli_issue_flow.py"
        argv:
          - "assert-pr-mergeable"
          - "--issue"
          - "{issue_number}"
        timeout: 60
        continue_on:
          - failed

      - id: ensure_pr_ready
        type: runner
        runner: python_script
        command: "scripts/workflows/local_cli_issue_flow.py"
        argv:
          - "ready-pr"
          - "--issue"
          - "{issue_number}"
        timeout: 60

      - id: review_pr
        type: runner
        runner: python_script
        command: "scripts/workflows/local_cli_issue_flow.py"
        argv:
          - "review-pr"
          - "--issue"
          - "{issue_number}"
        timeout: 180
        continue_on:
          - failed

      - id: fix_pr
        type: runner
        runner: python_script
        command: "scripts/workflows/local_cli_issue_flow.py"
        argv:
          - "fix-pr"
          - "--issue"
          - "{issue_number}"
        timeout: 3600
        retry:
          max_attempts: 2
          backoff: exponential
          initial_delay: 10

      - id: post_review_checks
        type: runner
        runner: python_script
        command: "scripts/workflows/local_cli_issue_flow.py"
        argv:
          - "checks"
          - "--issue"
          - "{issue_number}"
          - "--mode"
          - "post-review"
        env:
          ANTEROOM_LOCAL_CHECKS: "ruff check src/ tests/ && python -m pytest tests/unit/ -x -q --tb=short"
        timeout: 1800
        continue_on:
          - failed
        on_failure:
          - id: autofix_post_review
            type: runner
            runner: python_script
            command: "scripts/workflows/local_cli_issue_flow.py"
            argv:
              - "autofix"
              - "--issue"
              - "{issue_number}"
              - "--mode"
              - "post-review"
            env:
              ANTEROOM_LOCAL_AUTOFIX: "ruff check src/ tests/ --fix"
            timeout: 600
          - id: fix_post_review
            type: runner
            runner: python_script
            command: "scripts/workflows/local_cli_issue_flow.py"
            argv:
              - "fix-checks"
              - "--issue"
              - "{issue_number}"
              - "--mode"
              - "post-review"
            timeout: 1800
          - id: rerun_post_checks
            type: runner
            runner: python_script
            command: "scripts/workflows/local_cli_issue_flow.py"
            argv:
              - "checks"
              - "--issue"
              - "{issue_number}"
              - "--mode"
              - "post-review"
            env:
              ANTEROOM_LOCAL_CHECKS: "ruff check src/ tests/ && python -m pytest tests/unit/ -x -q --tb=short"
            timeout: 1800

      - id: post_review_sync
        type: runner
        runner: python_script
        command: "scripts/workflows/local_cli_issue_flow.py"
        argv:
          - "sync"
          - "--issue"
          - "{issue_number}"
          - "--mode"
          - "post-review"
        timeout: 600
        retry:
          max_attempts: 2
          backoff: fixed
          initial_delay: 5

      - id: verify_pr_labels
        type: runner
        runner: python_script
        command: "scripts/workflows/local_cli_issue_flow.py"
        argv:
          - "assert-pr-approved"
          - "--issue"
          - "{issue_number}"
          - "--wait-seconds"
          - "0"
          - "--poll-interval"
          - "5"
        timeout: 15
        continue_on:
          - failed

  - id: assert_pr_approved
    type: runner
    runner: python_script
    command: "scripts/workflows/local_cli_issue_flow.py"
    argv:
      - "assert-pr-approved"
      - "--issue"
      - "{issue_number}"
      - "--wait-seconds"
      - "30"
      - "--poll-interval"
      - "5"
    timeout: 90
