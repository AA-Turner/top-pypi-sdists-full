kind: workflow
id: local_claude_codex_pr_repair
version: 0.1.0

inputs:
  issue_number:
    type: integer
    required: true

steps:
  - id: gate_issue_current
    type: gate
    condition: issue_is_current
    if_false: blocked_issue_not_open

  - id: prepare_issue
    type: runner
    runner: python_script
    command: "scripts/workflows/local_cli_issue_flow.py"
    argv:
      - "prepare"
      - "--issue"
      - "{issue_number}"
    timeout: 300
    retry:
      max_attempts: 2
      backoff: fixed
      initial_delay: 5

  - id: assert_pr_fresh
    type: runner
    runner: python_script
    command: "scripts/workflows/local_cli_issue_flow.py"
    argv:
      - "assert-pr-fresh"
      - "--issue"
      - "{issue_number}"
    timeout: 30

  - id: assert_pr_mergeable
    type: runner
    runner: python_script
    command: "scripts/workflows/local_cli_issue_flow.py"
    argv:
      - "assert-pr-mergeable"
      - "--issue"
      - "{issue_number}"
    timeout: 30

  - id: pr_review_loop
    type: loop
    max_rounds: 10
    until:
      step: verify_pr_labels
      field: result_status
      equals: success
    fail_if_not_met: true
    steps:
      - id: ensure_pr_ready
        type: runner
        runner: python_script
        command: "scripts/workflows/local_cli_issue_flow.py"
        argv:
          - "ready-pr"
          - "--issue"
          - "{issue_number}"
        timeout: 60

      - id: review_pr
        type: runner
        runner: python_script
        command: "scripts/workflows/local_cli_issue_flow.py"
        argv:
          - "review-pr"
          - "--issue"
          - "{issue_number}"
        timeout: 180
        continue_on:
          - failed

      - id: fix_pr
        type: runner
        runner: python_script
        command: "scripts/workflows/local_cli_issue_flow.py"
        argv:
          - "fix-pr"
          - "--issue"
          - "{issue_number}"
        timeout: 3600
        retry:
          max_attempts: 2
          backoff: exponential
          initial_delay: 10

      - id: post_review_checks
        type: runner
        runner: python_script
        command: "scripts/workflows/local_cli_issue_flow.py"
        argv:
          - "checks"
          - "--issue"
          - "{issue_number}"
          - "--mode"
          - "post-review"
        env:
          ANTEROOM_LOCAL_CHECKS: "ruff check src/ tests/ && python -m pytest tests/unit/ -x -q --tb=short"
        timeout: 1800
        continue_on:
          - failed
        on_failure:
          - id: autofix_post_review
            type: runner
            runner: python_script
            command: "scripts/workflows/local_cli_issue_flow.py"
            argv:
              - "autofix"
              - "--issue"
              - "{issue_number}"
              - "--mode"
              - "post-review"
            env:
              ANTEROOM_LOCAL_AUTOFIX: "ruff check src/ tests/ --fix"
            timeout: 600
          - id: fix_post_review
            type: runner
            runner: python_script
            command: "scripts/workflows/local_cli_issue_flow.py"
            argv:
              - "fix-checks"
              - "--issue"
              - "{issue_number}"
              - "--mode"
              - "post-review"
            timeout: 1800
          - id: rerun_post_checks
            type: runner
            runner: python_script
            command: "scripts/workflows/local_cli_issue_flow.py"
            argv:
              - "checks"
              - "--issue"
              - "{issue_number}"
              - "--mode"
              - "post-review"
            env:
              ANTEROOM_LOCAL_CHECKS: "ruff check src/ tests/ && python -m pytest tests/unit/ -x -q --tb=short"
            timeout: 1800

      - id: post_review_sync
        type: runner
        runner: python_script
        command: "scripts/workflows/local_cli_issue_flow.py"
        argv:
          - "sync"
          - "--issue"
          - "{issue_number}"
          - "--mode"
          - "post-review"
        timeout: 600
        retry:
          max_attempts: 2
          backoff: fixed
          initial_delay: 5

      - id: verify_pr_labels
        type: runner
        runner: python_script
        command: "scripts/workflows/local_cli_issue_flow.py"
        argv:
          - "assert-pr-approved"
          - "--issue"
          - "{issue_number}"
          - "--wait-seconds"
          - "0"
          - "--poll-interval"
          - "5"
        timeout: 15
        continue_on:
          - failed

  - id: assert_pr_approved
    type: runner
    runner: python_script
    command: "scripts/workflows/local_cli_issue_flow.py"
    argv:
      - "assert-pr-approved"
      - "--issue"
      - "{issue_number}"
      - "--wait-seconds"
      - "30"
      - "--poll-interval"
      - "5"
    timeout: 90
