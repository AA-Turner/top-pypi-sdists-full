site_name: Anteroom
site_url: https://anteroom.readthedocs.io
site_description: Your gateway to AI conversation
repo_url: https://github.com/troylar/anteroom
repo_name: troylar/anteroom
edit_uri: edit/main/docs/

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.top
    - navigation.indexes
    - navigation.path
    - navigation.prune
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - toc.follow
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - def_list
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - minify:
      minify_html: true
  - redirects:
      redirect_maps:
        'web-ui/projects.md': 'web-ui/spaces.md'
        'api/projects.md': 'api/spaces.md'
        'cli/themes.md': 'web-ui/themes.md'

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/troylar/anteroom
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/anteroom/

extra_css:
  - assets/stylesheets/extra.css

