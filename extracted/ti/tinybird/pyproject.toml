[project.scripts]
tinybird_server = "tinybird.app:run"
tinybird_tool = "tinybird.tinybird_tool.main:cli"
tb_old = "tinybird.tb_cli:cli"
tb = "tinybird.tb.cli:cli"
colibri = "tinybird.colibri.cli:cli"

[tool.uv.workspace]
members = ["data_connector"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
namespaces = false
include = ["tinybird", "tinybird.*", "tinybird_shared", "tinybird_shared.*", "scripts"]
exclude = ["tests*"]

[tool.setuptools.package-data]
tinybird = [
    "templates/**/*",
    "static/**/*",
    "default_pipes/**/*",
    "sql/**/*",
    "monitors/**/*.sql",
    "scripts/**/*",
    "data_projects/**/*",
    "data_projects/**/.*",
    "raw_events/**/*",
    "query_booster/**/*",
    "deployments/**/*",
]
tinybird_shared = [
    "redis_client/**/*",
    "retry/**/*",
    "metrics/**/*",
    "gatherer_settings/**/*",
    "clickhouse/**/*",
    "gatherer_backpressure/**/*",
    "data_connector_circuit_breaker/**/*",
]
