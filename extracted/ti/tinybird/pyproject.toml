[build-system]
requires = [
    "setuptools>=61.0",
    "wheel==0.37.1",
    "cffi~=2.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "tinybird"
version = "1.0"
description = "tinybird"
readme = { text = "tinybird analytics", content-type = "text/markdown" }
requires-python = ">=3.13,<3.15"
authors = [
    { name = "tinybird.co" },
]
dependencies = [
    "GitPython==3.1.44",
    "Markdown==3.5.1",
    "aioboto3~=15.0",
    "aiofiles==24.1.0",
    "aiohttp~=3.11",
    "anthropic~=1.9",
    "asgiref==3.13.0",
    "async-lru==2.3.0",
    "aws-msk-iam-sasl-signer-python==1.0.2",
    "cachetools~=6.2",
    "cffi~=2.0",
    "chardet==4.0.0",
    "ciso8601==2.3.3",
    "click~=8.5",
    "clickhouse-cityhash==1.0.2.5",
    "clickhouse-driver==0.2.10",
    "confluent-kafka[avro,json,schemaregistry]==2.12.2",
    "contextvars==2.4",
    "cramjam==2.11.0",
    "croniter==6.2.2",
    "cryptography~=50.0",
    "datasketch==1.6.5",
    "ddtrace==4.16.1",
    "dnspython==2.9.0",
    "docker==7.1.0",
    "fastavro==1.13.1",
    "fastmcp==2.12.2",
    "google-cloud-compute==1.48.0",
