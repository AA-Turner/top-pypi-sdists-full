    "prompt_toolkit==3.0.48",
    "propcache==0.5.4",
    "proto_plus==1.26.1",
    "protobuf==6.33.6",
    "psutil==7.2.2",
    "psycopg2-binary==2.9.12",
    "py-spy==0.4.3",
    "pyarrow==26.0.0",
    "pycurl==7.45.7",
    "pydantic-ai-slim[anthropic]~=2.0",
