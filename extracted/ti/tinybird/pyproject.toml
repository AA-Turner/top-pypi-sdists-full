    "grpcio_status==1.84.0",
    "humanfriendly==10.0",
    "isal==1.9.1",
    "jinja2",
    "jsondiff==2.2.1",
    "jsonschema==4.23.0",
    "litellm~=1.97",
    "logfire-api==4.2.0",
    "lru-dict==1.4.1",
    "lz4==4.4.5",
    "memray==1.20.0",
    "msgspec==0.21.1",
    "multidict==6.9.1",
