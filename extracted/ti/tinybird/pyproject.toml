[dependency-groups]
deploy = [
    "GitPython==3.1.44",
    "ansible==13.8.0",
    "ara==1.6.1",
    "boto3~=1.40",
    "fabric==3.2.2",
    "google-auth~=2.47",
    "jsonnet",
    "prettytable==3.8.0",
    "requests~=2.32.5",
    "requests[security]",
    "xmltodict",
]
devtools = [
    "flameprof",
    "matplotlib",
    "memory_profiler",
    "rope",
]
doc = [
    "Pallets-Sphinx-Themes==2.3.0",
    "pyOpenSSL~=26.4",
    "sphinx-autobuild==2024.2.4",
    "sphinx-sitemap",
    "sphinx==7.3.7",
    "sphinxcontrib-httpdomain",
    "sphinxcontrib-jquery==4.1",
]
lint = [
    "botocore-stubs~=1.40",
    "celery-types~=0.20.0",
    "flake8~=7.5",
    "flake8-async~=26.8",
    "mypy==2.4.1",
    "ruff==0.17.5",
    "types-Markdown",
    "types-PyYAML",
    "types-aiobotocore-s3~=2.25",
    "types-aiobotocore-sqs~=2.25",
    "types-aiofiles==24.1.0.20241221",
    "types-boto3-lite~=1.40",
    "types-cachetools",
    "types-chardet",
    "types-paramiko",
    "types-pycurl",
    "types-python-dateutil",
    "types-pytz",
    "types-requests",
    "types-tabulate",
    "types_croniter",
]
test = [
    "coverage~=7.16",
    "freezegun==1.5.5",
    "google-auth~=2.47",
    "gsutil==4.58",
    "httpx2~=2.13",
    "hypothesis==6.156.9",
    "oauth2client==3.0.0",
    "py==1.11.0",
    "pytest-asyncio~=1.4",
    "pytest-cov~=7.0",
    "pytest-env==1.1.3",
    "pytest-flakefinder==1.1.0",
    "pytest-timeout==2.3.1",
    "pytest-xdist==3.6.1",
    "pytest~=8.1",
    "rangehttpserver==1.4.0",
    "yappi==1.7.6",
]
# chdb is a 185 MB wheel: only `tests/dst` needs it. Kept out of `dev` so the jobs that export
# the default groups do not download it; install it with `uv sync --group dst`.
dst = [
    "chdb==4.4.0",
]
# Synced automatically by plain `uv run`/`uv sync`, no `--group` needed.
dev = [
    { include-group = "test" },
    { include-group = "deploy" },
    { include-group = "lint" },
]

[project.scripts]
tinybird_server = "tinybird.server_entrypoint:run"
tinybird_tool = "tinybird.tinybird_tool.main:cli"
tb_old = "tinybird.tb_cli:cli"
tb = "tinybird.tb.cli:cli"
colibri = "tinybird.colibri.cli:cli"

[tool.uv.workspace]
members = [
    "chbackups",
    "clickhouse",
    "data_connector",
    "gatherer",
    "platform-api",
    "songbird",
    "tinybird_orchestrator",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
namespaces = false
include = ["tinybird", "tinybird.*", "tinybird_shared", "tinybird_shared.*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
tinybird = [
    "templates/**/*",
    "static/**/*",
    "default_pipes/**/*",
    "sql/**/*",
    "monitors/**/*.sql",
    "scripts/**/*",
    "data_projects/**/*",
    "data_projects/**/.*",
    "raw_events/**/*",
    "query_booster/**/*",
    "deployments/**/*",
]
tinybird_shared = [
    "redis_client/**/*",
    "retry/**/*",
    "metrics/**/*",
    "gatherer_settings/**/*",
    "clickhouse/**/*",
    "gatherer_backpressure/**/*",
]
