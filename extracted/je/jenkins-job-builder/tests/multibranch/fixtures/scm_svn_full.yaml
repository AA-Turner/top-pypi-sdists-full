name: 'demo-multibranch-svn-full'
project-type: multibranch
scm:
    - svn:
        url: 'https://example.com/svnroot/'
        credentials-id: secret
        update-strategy: update-with-revert
        property-strategies:
            all-branches:
                - suppress-scm-triggering: true
                - pipeline-branch-durability-override: max-survivability
        include-branches:
            - trunk
            - branches/*
        exclude-branches:
            - branches/hidden/*
        browser:
            browser-type: viewvc
            url: 'https://viewvc.example.com'
            repository: 'svnroot'
