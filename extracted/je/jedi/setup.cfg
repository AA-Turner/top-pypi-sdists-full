[bdist_wheel]
universal = 1

[flake8]
max-line-length = 100
ignore = 
	E722,
	E226,
	E721,
	W503,
	E741,
per-file-ignores = 
	jedi/__init__.py:F401
	jedi/inference/compiled/__init__.py:F401
	jedi/inference/value/__init__.py:F401
exclude = 
	.tox/*
	jedi/third_party/*
	test/completion/*
	test/examples/*
	test/refactor/*
	test/static_analysis/*

[pycodestyle]
max-line-length = 100

[egg_info]
tag_build = 
tag_date = 0

