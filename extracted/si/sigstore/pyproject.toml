[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "sigstore"
version = "4.5.1"
description = "A tool for signing Python package distributions"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "cryptography >= 47",
    "id >= 1.1.0",
    "importlib_resources ~= 5.7; python_version < '3.11'",
    "pydantic >= 2,< 3",
    "pyjwt >= 2.1",
    "requests",
    "rich >= 13,< 16",
    "rfc8785 ~= 0.1.2",
    "rfc3161-client >= 1.0.3,< 1.1.0",
    "sigstore-models == 0.0.6",
    "sigstore-rekor-types == 0.0.18",
    "tuf >= 6, < 8",
    "platformdirs ~= 4.2",
]
requires-python = ">=3.10"

[[project.authors]]
name = "Sigstore Authors"
email = "sigstore-dev@googlegroups.com"

[project.scripts]
sigstore = "sigstore._cli:main"

[project.urls]
Homepage = "https://pypi.org/project/sigstore/"
Issues = "https://github.com/sigstore/sigstore-python/issues"
Source = "https://github.com/sigstore/sigstore-python"
Documentation = "https://sigstore.github.io/sigstore-python/"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pretend",
    "coverage[toml]",
    "bandit",
    "mypy>=1.1,<3.0",
    "ruff<0.15.23",
    "mkdocs-material[imaging]",
    "mkdocstrings-python",
    "bump >= 1.3.2",
    "pip-tools>=7.6.0",
]
uv = ["uv"]

[tool.coverage.run]
branch = true
parallel = true
relative_files = true
omit = ["sigstore/_cli.py"]

[tool.coverage.report]
exclude_lines = [
    "@abc.abstractmethod",
    "@typing.overload",
    "if typing.TYPE_CHECKING",
]

[tool.interrogate]
exclude = [
    "env",
    "test",
    "sigstore/_cli.py",
]
ignore-semiprivate = true
ignore-private = true
ignore-nested-classes = true
fail-under = 100

[tool.mypy]
allow_redefinition = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
]
ignore_missing_imports = true
no_implicit_optional = true
sqlite_cache = true
strict = true
strict_equality = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.bandit]
exclude_dirs = ["./test"]

[tool.ruff.lint]
extend-select = [
    "I",
    "UP",
]
ignore = [
    "UP007",
    "UP011",
    "UP015",
]

[tool.uv]
exclude-newer = "P7D"
constraint-dependencies = ["certifi >= 2026.10.19"]

[tool.uv.exclude-newer-package]
certifi = false

[tool.uv.build-backend]
module-root = ""
