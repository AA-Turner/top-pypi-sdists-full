[[project.authors]]
name = "Kevin Deldycke"
email = "kevin@deldycke.com"

[project.optional-dependencies]
pytest = ["pytest>=8.2.1"]

[project.urls]
Changelog = "https://github.com/kdeldycke/extra-platforms/blob/main/changelog.md"
Documentation = "https://kdeldycke.github.io/extra-platforms"
Download = "https://github.com/kdeldycke/extra-platforms/releases/tag/v13.5.3"
Funding = "https://github.com/sponsors/kdeldycke"
Homepage = "https://github.com/kdeldycke/extra-platforms"
Issues = "https://github.com/kdeldycke/extra-platforms/issues"
Repository = "https://github.com/kdeldycke/extra-platforms"

[project.scripts]
extra-platforms = "extra_platforms.__main__:main"

[project.entry-points.pytest11]
extra-platforms = "extra_platforms.pytest"

[dependency-groups]
test = [
    "coverage[toml]>=7.11",
    "pytest",
    "pytest-cov>=7",
    "pytest-github-actions-annotate-failures>=0.3",
    "pytest-randomly>=4",
    "pytest-xdist[psutil]>=3.7",
    "requests>=2.34",
    "tomli>=2.3; python_version<'3.11'",
]
docs = [
    "click-extra[sphinx]>=8.7",
    "furo>=2025.9.25",
    "myst-parser>=5.1",
    "pytest>=8.2.1",
    "sphinx>=9.1",
    "sphinx-autodoc-typehints>=2.4",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6",
    "sphinxcontrib-mermaid>=1.2.3",
    "sphinxext-opengraph>=0.13",
]

[tool.uv]
required-version = ">=0.11.15"
exclude-newer = "1 week"

[tool.uv.dependency-groups.docs]
requires-python = ">= 3.12"

[tool.uv.exclude-newer-package]
click-extra = "2026-07-30T17:07:28.533730Z"

[tool.uv.build-backend]
module-root = ""
source-exclude = [
    "**/*.bak",
    "**/.DS_Store",
    "**/__pycache__",
    "docs/_build",
    "docs/_linkcheck",
    "docs/html",
    "tests/.coverage",
]
source-include = [
    "changelog.md",
    "docs/**",
    "tests/**",
]

[tool.ruff]
extend-include = ["*.{markdown,mdown,mkdn,mdwn,mkd,md,mdtxt,mdtext,mdx}"]
preview = true
fix = true
unsafe-fixes = false
show-fixes = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
extend-select = ["PLW1514"]
ignore = [
    "D400",
    "ERA001",
    "LOG015",
]
future-annotations = true

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.typos.default]
extend-ignore-re = ["(?s)<!-- typos:off -->.*?<!-- typos:on -->"]
extend-ignore-identifiers-re = [
    "Tru64",
    "PASE",
    "Sur",
    "certifi",
]

[tool.typos.default.extend-identifiers]
Github = "GitHub"
IOS = "iOS"
Javascript = "JavaScript"
MacOS = "macOS"
PyPi = "PyPI"
Typescript = "TypeScript"

[tool.typos.default.extend-words]
astroid = "astroid"
oject = "oject"

[tool.mypy]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
pretty = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "click_extra.*"
ignore_missing_imports = true

[tool.pytest]
addopts = ["--durations=10"]
markers = ["network: Tests that require network access (excluded with -m 'not network')."]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["extra_platforms"]

[tool.coverage.report]
precision = 2

[tool.bumpversion]
current_version = "13.5.3"
parse = '(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)(\.dev(?P<dev>\d+))?'
serialize = [
    "{major}.{minor}.{patch}.dev{dev}",
    "{major}.{minor}.{patch}",
]
ignore_missing_files = true
allow_dirty = true

[tool.bumpversion.parts.dev]
optional_value = "release"
values = [
    "0",
    "release",
]

[[tool.bumpversion.files]]
glob = "./**/__init__.py"
ignore_missing_version = true

[[tool.bumpversion.files]]
filename = "./pyproject.toml"
regex = true
search = '(?m)^version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "./pyproject.toml"
search = "releases/tag/v{current_version}"
replace = "releases/tag/v{new_version}"

[[tool.bumpversion.files]]
filename = "./pyproject.toml"
ignore_missing_version = true
serialize = ["{major}.{minor}.{patch}"]
search = '-version = "{current_version}"'
replace = '-version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "./changelog.md"
search = "## [`{current_version}` (unreleased)]("
replace = "## [`{new_version}` (unreleased)]("

[[tool.bumpversion.files]]
filename = "./citation.cff"
regex = true
search = "(?m)^version: {current_version}"
replace = "version: {new_version}"

[[tool.bumpversion.files]]
filename = "./citation.cff"
regex = true
search = 'date-released: \d{{4}}-\d{{2}}-\d{{2}}'
replace = "date-released: {utcnow:%Y-%m-%d}"

[tool.lychee]
exclude = [
    "^https://github.com/.+/issues/[0-9]+#issuecomment-.*$",
    "^https://github.com/.+/releases/.+/download/.*$",
    "^https://doi.org/.+/zenodo.*$",
]

[tool.repomatic]
abandoned-versions = ["1.0.1"]
exclude = [
    "labels",
    "skills",
    "workflows/debug.yaml",
]

[tool.repomatic.docs]
update-script = ""

[tool.repomatic.nuitka]
enabled = false

[tool.repomatic.test-matrix.variations]
os = [
    "ubuntu-24.04",
    "ubuntu-22.04-arm",
    "ubuntu-22.04",
    "macos-15",
    "macos-15-intel",
    "macos-14",
    "windows-2022",
]
