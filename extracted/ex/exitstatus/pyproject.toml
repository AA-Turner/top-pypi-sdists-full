[project]
name = "exitstatus"
version = "2.8.0"
description = "POSIX exit status codes"
license = "MIT"
license-files = ["LICENSE.txt"]
readme = "README.md"
keywords = [
    "exit",
    "status",
    "POSIX",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = []

[[project.authors]]
name = "John Hagen"
email = "johnthagen@gmail.com"

[project.urls]
Homepage = "https://github.com/johnthagen/exitstatus"
Repository = "https://github.com/johnthagen/exitstatus"

[dependency-groups]
nox = ["nox-uv"]
test = [
    "pytest",
    "pytest-cov",
]
type_check = ["mypy"]
lint = ["ruff"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = "all"

[tool.mypy]
strict = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
]
allow_redefinition = true

[[tool.mypy.overrides]]
module = "tests.test_exitstatus"
disable_error_code = ["comparison-overlap"]

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "N",
    "UP",
    "RUF",
    "B",
    "C4",
    "ISC",
    "PIE",
    "PT",
    "PTH",
    "SIM",
    "TID",
]
extend-ignore = [
    "RUF005",
    "RUF012",
]
unfixable = ["F401"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
split-on-trailing-comma = false

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
