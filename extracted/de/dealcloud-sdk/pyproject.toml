[project]
name = "dealcloud-sdk"
version = "1.0.18"
description = "DealCloud SDK built on HTTPX via intapp-rest-client"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Intapp Support", email = "support@intapp.com"},{name = "Brian Michael", email = "brian.michael@intapp.com"}]
requires-python = ">=3.12"
keywords = [
    "dealcloud",
    "intapp",
    "api",
    "sdk",
    "crm",
    "deal-management",
    "private-equity",
    "investment-banking",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: Pydantic",
]

dependencies = [
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "numpy>=2.3.4; python_version < '3.13'",
    "numpy>=2.4.2; python_version >= '3.13'",
    "fsspec>=2026.3.0",
    "intapp-rest-client>=1.0.16",
]

[project.optional-dependencies]
yaml = [
    "pyyaml>=6.0",
    "python-benedict[yaml]>=0.33.0",
]
polars = [
    "polars>=1.0",
    "pyarrow>=14.0",
]
s3 = [
    "s3fs>=2026.3.0",
]
azure = [
    "adlfs>=2026.2.0",
]
gcs = [
    "gcsfs>=2026.3.0",
]
telemetry = [
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-instrumentation-httpx>=0.44.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.5",
    "respx>=0.21",
    "python-dotenv>=1.0.0",
    "mypy>=1.11.0",
    "isort>=5.13.0",
    "ruff>=0.4.0",
    "polars>=1.0",
    "pyarrow>=14.0",
    "openpyxl>=3.0",
    "pyyaml>=6.0",
]
all = [
    "dealcloud-sdk[yaml,polars,s3,azure,gcs,telemetry]",
]

[project.urls]
Homepage = "https://api.docs.dealcloud.com/sdk/python-1.X"
Documentation = "https://api.docs.dealcloud.com/sdk/python-1.X"
Changelog = "https://api.docs.dealcloud.com/sdk/python-1.X/reference/changelog"
Source = "https://pypi.org/project/dealcloud-sdk/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dealcloud_sdk"]
license-files = ["LICENSE"]

[tool.hatch.build.targets.sdist]
ignore-vcs = true
artifacts = [
    "examples",
]
only-include = [
    "/dealcloud_sdk",
    "/example_project",
    "/README.md",
    "/LICENSE",
    "/SOURCE_DISTRIBUTION.md",
    "/Makefile.example",
    "/.env.example",
    "/pyproject.toml",
    "/tests",
    "/docs",
    "/examples",
]
exclude = [
    "/Makefile",
    "sdkWriteRetryTests/**",
    "tests/integration/**",
    "tests/doc_examples/**",
    "tests/test_doc_examples*.py",
    "example_project/uv.lock",
    "example_project/uv.toml",
    "completedFeatures/**",
    "conda.recipe/**",
    "**/__pycache__/**",
    "**/*.pyc",
]

[tool.hatch.build.targets.sdist.force-include]
"example_project/uv.toml.public" = "example_project/uv.toml"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=dealcloud_sdk --cov-report=term-missing"
markers = [
    "regression: marks tests as regression tests from original SDK",
    "doc_example: documentation MDX fence tests (dealcloud-api-doc checkout)",
    "doc_example_corpus: committed doc examples under tests/doc_examples (manifest + corpus)",
    "legacy_doc_examples: legacy MDX-at-pytest-time doc tests (prefer doc_example_corpus)",
    "integration: marks tests as integration tests (require API access)",
    "integration_429: 429 / rate-limit integration tests (respx-mocked)",
    "integration_auth: authentication integration tests",
    "integration_token_refresh: OAuth2 proactive token refresh (live token endpoint; ~1 min)",
    "integration_token_refresh_long: manual-only ~40m+ OAuth2 refresh; excluded from test-integration and test-live",
    "integration_cells: cells API integration tests",
    "integration_data: data (rows, read/write/delete, pagination) integration tests",
    "integration_history: history API integration tests",
    "integration_schema: schema API integration tests",
    "integration_usermanagement: user management integration tests",
    "integration_relationshipintelligence: Relationship Intelligence (RI) integration tests",
    "integration_backups: site backups API integration tests",
    "integration_publications: publications API integration tests",
    "integration_publications_init_bootstrap: optional manual init_bootstrap matrix (6 entity types × 2 formats); not part of integration_publications",
    "integration_merge: merge API integration tests",
    "integration_polars: Polars output integration tests",
    "integration_excel: Excel utilities integration tests (API data + export/read)",
    "integration_files: files API integration tests (upload/download/delete, find file fields)",
    "slow: marks tests as slow running",
    "integration_negative: negative-path integration tests (errors, HttpError)",
    "integration_negative_http: Phase 1 negative tests (HTTP 4xx/5xx or client validation)",
    "integration_negative_body: Phase 2 negative tests (HTTP 2xx with body-level failures)",
    "row_error_contract: unit mock tests for caller-driven Rows row-error contract (no API)",
]

[tool.coverage.run]
source = ["dealcloud_sdk"]
omit = ["*/tests/*", "*/__pycache__/*"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
fail_under = 90

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

