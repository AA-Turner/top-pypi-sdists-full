[build-system]
requires = ["uv_build>=0.8"]
build-backend = "uv_build"

[project]
name = "devtools"
version = "0.13.0"
description = "Python's missing debug print command, and more."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Operating System :: Unix",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Framework :: Pydantic",
    "Framework :: Pydantic :: 2",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "executing>=1.1.1",
    "asttokens>=2.0.0,<3.0.0",
    "Pygments>=2.15.0",
]

[[project.authors]]
name = "Samuel Colvin"
email = "s@muelcolvin.com"

[project.optional-dependencies]
pygments = []

[project.urls]
Homepage = "https://github.com/samuelcolvin/python-devtools"
Documentation = "https://python-devtools.helpmanual.io"
Funding = "https://github.com/sponsors/samuelcolvin"
Source = "https://github.com/samuelcolvin/python-devtools"
Changelog = "https://github.com/samuelcolvin/python-devtools/releases"

[tool.uv]
default-groups = [
    "dev",
    "docs",
]

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = "tests"
filterwarnings = "error"

[tool.coverage.run]
source = ["devtools"]
branch = true
omit = ["devtools/__main__.py"]
relative_files = true
context = "${CONTEXT}"

[tool.coverage.report]
precision = 2
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "raise NotImplemented",
    "if TYPE_CHECKING:",
    "if MYPY:",
    "@overload",
]

[tool.coverage.paths]
source = [
    "devtools/",
    "/home/runner/work/python-devtools/python-devtools/devtools/",
    "/Users/runner/work/python-devtools/python-devtools/devtools/",
    'D:\a\python-devtools\python-devtools\devtools',
]

[tool.ruff]
line-length = 120
include = [
    "devtools/**/*.py",
    "tests/**/*.py",
    "docs/build.py",
]

[tool.ruff.lint]
extend-select = [
    "Q",
    "RUF100",
    "C90",
    "UP",
    "I",
    "FA",
]
ignore = ["BLE001"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "double"

[tool.ruff.lint.mccabe]
max-complexity = 14

[tool.ruff.lint.per-file-ignores]
"tests/test_expr_render.py" = [
    "PLR0133",
    "SIM222",
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["devtools"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "single"
exclude = ["tests/test_expr_render.py"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = true
venv = ".venv"
include = [
    "devtools",
    "tests",
    "docs/build.py",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "coverage[toml]",
    "pytest>=8",
    "pytest-mock",
    "pytest-pretty",
    "ruff>=0.17.0",
    "asyncpg",
    "multidict",
    "numpy",
    "pydantic",
    "sqlalchemy",
]
docs = [
    "ansi2html",
    "zensical",
]
