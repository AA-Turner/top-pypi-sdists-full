[project]
name = "descope"
version = "2.12.1"
description = "Descope Python SDK"
requires-python = ">=3.9,<4.0"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.28,<0.29",
    "certifi",
    "pyjwt[crypto]>=2.4.0",
    "email-validator>=2,<3",
]

[[project.authors]]
name = "Descope"
email = "info@descope.com"

[project.optional-dependencies]
Flask = ["Flask>=2"]

[project.urls]
Homepage = "https://descope.com/"
Repository = "https://github.com/descope/python-sdk"
Documentation = "https://docs.descope.com"
"Bug Tracker" = "https://github.com/descope/python-sdk/issues"

[dependency-groups]
dev = [
    "pre-commit==3.8.0",
    "python-dotenv>=1.2.1",
    "ruff==0.15.22",
]
types = [
    "mypy>=1.20.1; python_version >= '3.10'",
    "mypy>=1.11.2,<1.12; python_version < '3.10'",
]
tests = [
    "pytest>=9.0.3; python_version >= '3.10'",
    "pytest>=8.4,<9; python_version < '3.10'",
    "pytest-cov>=5",
    "pytest-asyncio==1.2.0; python_version < '3.10'",
    "pytest-asyncio==1.4.0; python_version >= '3.10'",
    "coverage[toml]>=7.3.1,<8",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-name = "descope"
module-root = ""

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["e2e: end-to-end tests against a real Descope backend (require DESCOPE_PROJECT_ID and DESCOPE_MANAGEMENT_KEY)"]

[tool.coverage.run]
relative_files = true
source = ["descope"]
omit = ["descope/flask/*"]

[tool.coverage.report]
fail_under = 98
skip_covered = true
skip_empty = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "N",
    "UP",
]
ignore = [
    "E501",
    "N818",
    "B904",
    "UP006",
    "UP007",
    "UP035",
    "UP045",
    "UP046",
    "UP047",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"descope/management/tenant.py" = ["N803"]
"descope/management/tenant_async.py" = ["N803"]
"descope/management/user.py" = [
    "N803",
    "N806",
]
"descope/management/user_async.py" = [
    "N803",
    "N806",
]
"tests/**" = [
    "B017",
    "B018",
]
"tests/e2e/**" = ["N801"]

[tool.pylic]
safe_licenses = [
    "MIT License",
    "MIT",
    "ISC License (ISCL)",
    "Apache-2.0",
    "BSD License",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Python Software Foundation License",
    "PSF-2.0",
]
unsafe_packages = [
    "certifi",
    "email-validator",
    "pathspec",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
