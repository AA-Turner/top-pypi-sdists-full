[package]
name = "scai-state-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core library for SCAI state management"
build = "build/main.rs"
autobenches = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
snafu.workspace = true
err_code.workspace = true
scai-error-derive = { path = "../scai-error-derive" }
scai-log = { path = "../scai-log" }
uuid.workspace = true
fs2.workspace = true
sqlparser.workspace = true
regress = "0.11"
chrono = { version = "0.4", features = ["serde"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rayon = "1.10"
jsonschema = "0.49"

[target.'cfg(windows)'.dependencies]
# Write-through rename (MoveFileExW) — Windows has no directory-fsync, so
# durable renames must flush to disk per-call. See `durable_rename`.
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[build-dependencies]
typify = "0.7"
schemars = "0.8"
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
test-case = "3"
