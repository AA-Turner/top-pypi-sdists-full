[workspace]
resolver = "2"
members = ["crates/scai-error-derive", "crates/scai-log", "crates/scai-state-core", "crates/scai-state-python"]

[workspace.package]
version = "0.9.10"
edition = "2021"
license = "SEE LICENSE IN LICENSE"
repository = "https://github.com/snowflake-eng/scai-state"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Maintained fork of the deprecated/unmaintained serde_yaml. Reads the
# `database-bindings.yml` SnowConvert generates; see `database_bindings`.
serde_norway = "0.9"
snafu = "0.9"
err_code = "0.1"
uuid = { version = "1.0", features = ["v4"] }
fs2 = "0.4"
sqlparser = "0.63"
criterion = { version = "0.8", features = ["html_reports"] }
# No default features: they add `resolve-http` (reqwest/rustls/aws-lc-rs) for
# remote `$ref`s, and the registry schema only uses local `#/definitions`.
# crates/scai-state-csharp/tests/no_network_deps.rs keeps them out.
jsonschema = { version = "0.59", default-features = false }

[profile.profiling]
inherits = "release"
debug = true
strip = false
