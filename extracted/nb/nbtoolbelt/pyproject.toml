[build-system]
requires = ["setuptools>=51.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nbtoolbelt"
version = "2026.4.1"
requires-python = ">=3.10,<3.14"
authors = [
    {name = "Tom Verhoeff (Eindhoven Univesity of Technology)", email = "T.Verhoeff@tue.nl"},
]
description = "Tools to work with Jupyter notebooks"
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE.txt"}
keywords = ["Jupyter notebooks", "software tools", "education"]
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Intended Audience :: Developers',
    'Intended Audience :: System Administrators',
    'Intended Audience :: Education',
    'Intended Audience :: Science/Research',
    'Topic :: Education',
    'Topic :: Scientific/Engineering',
    'Topic :: Software Development :: Libraries',
    'Topic :: Utilities',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Framework :: Jupyter',
    'Operating System :: OS Independent',
]
dependencies = [
    'nbformat~=5.10',
    'nbconvert~=7.17',
    'jupyter-client~=8.8',
    'numpy>=2.2,<2.3',
    'pandas~=2.3',
]

[project.optional-dependencies]
test = [
    "pytest~=9.0",
    "pytest-mock~=3.15",
    "pytest-cov~=7.1",
    "ipykernel~=7.2",
]
docs = [
    "sphinx~=8.2",
    "sphinx-rtd-theme~=3.1",
    "recommonmark~=0.7",
]

[project.scripts]
nbtb = 'nbtoolbelt.__main__:main_dispatch'

[project.urls]
Homepage = "https://gitlab.tue.nl/jupyter-projects/nbtoolbelt"
Documentation = "https://nbtoolbelt.readthedocs.io/"
Source = "https://gitlab.tue.nl/jupyter-projects/nbtoolbelt/"
Issues = "https://gitlab.tue.nl/jupyter-projects/nbtoolbelt/-/issues"
Changelog = "https://gitlab.tue.nl/jupyter-projects/nbtoolbelt/-/blob/master/CHANGELOG.rst"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["nbtoolbelt"]

[tool.setuptools.package-data]
nbtoolbelt = ["data/nbtoolbelt.json"]

[tool.pytest.ini_options]
minversion = "6.0"
norecursedirs = [".git", "files",]
pythonpath = "src"
addopts = "--cov=nbtoolbelt --cov-branch --cov-report term-missing --cov-report html"
testpaths = [
    "tests",
]
xfail_strict = true

[tool.coverage.run]
data_file = "/tmp/nbtoolbelt.coverage"

[tool.coverage.html]
directory = "/tmp/nbtoolbelt-htmlcov"

[tool.ruff]
target-version = "py310"
line-length = 120
cache-dir = "/tmp/nbtoolbelt-ruff-cache"
extend-exclude = ["tests/data"]

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
venvPath = ".."
venv = ".venv313-nbtoolbelt"
