[build-system]
requires = ["uv_build>=0.9.2,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."
module-name = "ag2"
source-exclude = [
    "test",
    "notebook",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.sources.torch]]
index = "pytorch-cpu"
marker = "sys_platform == 'linux'"

[tool.pytest.ini_options]
addopts = '-m "not conda"'
timeout = 45
testpaths = ["test"]
markers = [
    "conda: test related to conda forge distribution",
    "all",
    "openai",
    "openai_realtime",
    "gemini",
    "gemini_realtime",
    "anthropic",
    "zai",
    "mistral",
    "typesafe",
    "deepseek",
    "cosmosdb",
    "ollama",
    "bedrock",
    "cerebras",
    "cohere",
    "groq",
    "together",
    "integration",
    "aux_neg_flag",
    "redis",
    "docker",
    "docs",
    "rag",
    "jupyter_executor",
    "retrievechat",
    "retrievechat_pgvector",
    "retrievechat_mongodb",
    "retrievechat_qdrant",
    "graph_rag_falkor_db",
    "neo4j",
    "mcp",
    "interop",
    "browser_use",
    "crawl4ai",
    "google_api",
    "google_search",
    "websockets",
    "elevenlabs",
    "commsagent_discord",
    "commsagent_slack",
    "commsagent-telegram",
    "lmm",
    "tracing",
]

[tool.coverage.run]
branch = true
source = ["ag2"]
relative_files = true

[tool.ruff]
fix = true
line-length = 120
target-version = "py311"
exclude = [
    ".eggs",
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    "__pypackages__",
    "_build",
    "build",
    "dist",
    "docs",
    'math_utils\.py$',
    "setup_*.py",
]
preview = true

[tool.ruff.lint]
select = [
    "E",
    "W",
    "C90",
    "N",
    "I",
    "F",
    "ASYNC",
    "C4",
    "Q",
    "SIM",
    "RUF022",
    "UP",
    "D417",
]
ignore = [
    "E501",
    "F403",
    "C901",
    "E402",
    "E721",
    "E501",
    "C901",
    "ASYNC109",
    "ASYNC240",
    "UP042",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
case-sensitive = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
files = [
    "ag2/__init__.py",
    "ag2/_import_utils.py",
    "ag2/_model_input.py",
    "ag2/_replay.py",
    "ag2/_run_lifecycle.py",
    "ag2/_telemetry_consts.py",
    "ag2/a2a",
    "ag2/a2ui",
    "ag2/acp",
    "ag2/ag_ui",
    "ag2/agent.py",
    "ag2/aggregate.py",
    "ag2/annotations.py",
    "ag2/assembly.py",
    "ag2/compact.py",
    "ag2/config",
    "ag2/context.py",
    "ag2/eval",
    "ag2/events",
    "ag2/exceptions.py",
    "ag2/extensions",
    "ag2/files",
    "ag2/history.py",
    "ag2/hitl.py",
    "ag2/knowledge",
    "ag2/live",
    "ag2/mcp",
    "ag2/mcp_ui",
    "ag2/middleware",
    "ag2/mypy.py",
    "ag2/network/__init__.py",
    "ag2/network/adapters/__init__.py",
    "ag2/network/auth.py",
    "ag2/network/channel.py",
    "ag2/network/client/__init__.py",
    "ag2/network/client/agent_client.py",
    "ag2/network/client/channel.py",
    "ag2/network/client/checkpoint.py",
    "ag2/network/client/human_client.py",
    "ag2/network/client/inject.py",
    "ag2/network/client/network_client.py",
    "ag2/network/client/task.py",
    "ag2/network/client/tools/__init__.py",
    "ag2/network/client/tools/say.py",
    "ag2/network/envelope.py",
    "ag2/network/errors.py",
    "ag2/network/handoff.py",
    "ag2/network/hub/arbiter.py",
    "ag2/network/hub/expectations.py",
    "ag2/network/hub/layout.py",
    "ag2/network/hub/sweepers.py",
    "ag2/network/identity.py",
    "ag2/network/ids.py",
    "ag2/network/policies.py",
    "ag2/network/remote.py",
    "ag2/network/rule.py",
    "ag2/network/task_mirror.py",
    "ag2/network/testing.py",
    "ag2/network/transport",
    "ag2/network/views",
    "ag2/network/workflow_helpers.py",
    "ag2/observers",
    "ag2/plugin.py",
    "ag2/policies",
    "ag2/response",
    "ag2/scopes.py",
    "ag2/spec.py",
    "ag2/stream.py",
    "ag2/streams",
    "ag2/task.py",
    "ag2/testing.py",
    "ag2/textual.py",
    "ag2/tools",
    "ag2/types.py",
    "ag2/usage.py",
    "ag2/utils.py",
    "ag2/version.py",
    "ag2/watch.py",
]
strict = true
ignore_missing_imports = true
install_types = true
non_interactive = true
plugins = [
    "pydantic.mypy",
    "ag2.mypy",
]
follow_imports = "silent"
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
show_error_codes = true
warn_unused_ignores = false
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_any_unimported = true

[[tool.mypy.overrides]]
module = "perplexity.*"
implicit_reexport = true

[[tool.mypy.overrides]]
module = "xai_sdk.*"
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = "mcp_ui_server.*"
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = [
    "nlip_sdk.*",
    "nlip_server.*",
]
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = "ag2.extensions.mi4afa.*"
disallow_any_unimported = false

[[tool.mypy.overrides]]
module = "ag2.ag_ui.*"
disable_error_code = ["no-any-unimported"]

[[tool.mypy.overrides]]
module = "ag2.live.sound_device"
disable_error_code = ["no-any-unimported"]

[[tool.mypy.overrides]]
module = "numpy.*"
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.codespell]
skip = "*.js,*.map,*.pdf,*.po,*.ts,*.json,*.svg"
quiet-level = 3
ignore-words-list = "ans,crasher,fulfilment,iif"

[project]
name = "ag2"
description = "A programming framework for agentic AI"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "ai",
    "agent",
    "autogen",
    "ag2",
    "ag2.ai",
    "ag2ai",
    "agentic",
]
requires-python = ">=3.11"
version = "1.3.1"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Framework :: Pydantic",
    "Framework :: Pydantic :: 2",
]
dependencies = [
    "pydantic>=2.6.1,<3",
    "httpx>=0.28.1,<1",
    "anyio>=4.0.0,<5.0.0",
    "pyyaml>=6.0.2",
    "fast-depends[pydantic]>=3.0.8,<4.0.0",
]

[project.urls]
Homepage = "https://ag2.ai/"
Documentation = "https://docs.ag2.ai"
Tracker = "https://github.com/ag2ai/ag2/issues"
Source = "https://github.com/ag2ai/ag2"
Discord = "https://discord.gg/pAbnFJrkgZ"

[[project.authors]]
name = "Chi Wang & Qingyun Wu"
email = "support@ag2.ai"

[project.optional-dependencies]
a2a = ["a2a-sdk>=1.3.0,<2"]
a2ui = [
    "jsonschema>=4.18.0,<5",
    "starlette>=0.40,<2",
]
acp = [
    "agent-client-protocol>=0.12.1,<0.13",
    "ag2[mcp]",
