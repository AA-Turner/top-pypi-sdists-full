[build-system]
requires = ["uv_build>=0.9.2,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."
module-name = "ag2"
source-exclude = [
    "test",
    "notebook",
]

[tool.pytest.ini_options]
addopts = '-m "not conda"'
timeout = 45
testpaths = ["test"]
markers = [
    "conda: test related to conda forge distribution",
    "all",
    "openai",
    "openai_realtime",
    "gemini",
    "gemini_realtime",
    "anthropic",
    "zai",
    "mistral",
    "deepseek",
    "cosmosdb",
    "ollama",
    "bedrock",
    "cerebras",
    "cohere",
    "groq",
    "together",
    "integration",
    "aux_neg_flag",
    "redis",
    "docker",
    "docs",
    "rag",
    "jupyter_executor",
    "retrievechat",
    "retrievechat_pgvector",
    "retrievechat_mongodb",
    "retrievechat_qdrant",
    "graph_rag_falkor_db",
    "neo4j",
    "mcp",
    "interop",
    "browser_use",
    "crawl4ai",
    "google_api",
    "google_search",
    "websockets",
    "elevenlabs",
    "commsagent_discord",
    "commsagent_slack",
    "commsagent-telegram",
    "lmm",
    "tracing",
]

[tool.coverage.run]
branch = true
source = ["ag2"]
relative_files = true

[tool.ruff]
fix = true
line-length = 120
target-version = "py310"
exclude = [
    ".eggs",
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    "__pypackages__",
    "_build",
    "build",
    "dist",
    "docs",
    'math_utils\.py$',
    "setup_*.py",
]
preview = true

[tool.ruff.lint]
select = [
    "E",
    "W",
    "C90",
    "N",
    "I",
    "F",
    "ASYNC",
    "C4",
    "Q",
    "SIM",
    "RUF022",
    "UP",
    "D417",
]
ignore = [
    "E501",
    "F403",
    "C901",
    "E402",
    "E721",
    "E501",
    "C901",
    "ASYNC109",
    "ASYNC240",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
case-sensitive = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
files = ["ag2/_import_utils.py"]
strict = true
ignore_missing_imports = true
install_types = true
non_interactive = true
plugins = ["pydantic.mypy"]
follow_imports = "silent"
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
show_error_codes = true
warn_unused_ignores = false
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_any_unimported = true

[[tool.mypy.overrides]]
module = "numpy.*"
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.codespell]
skip = "*.js,*.map,*.pdf,*.po,*.ts,*.json,*.svg"
quiet-level = 3
ignore-words-list = "ans,crasher,fulfilment,iif"

[project]
name = "ag2"
description = "A programming framework for agentic AI"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "ai",
    "agent",
    "autogen",
    "ag2",
    "ag2.ai",
    "ag2ai",
    "agentic",
]
requires-python = ">=3.10"
version = "1.0.3"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Framework :: Pydantic",
    "Framework :: Pydantic :: 2",
]
dependencies = [
    "pydantic>=2.6.1,<3",
    "httpx>=0.28.1,<1",
    "anyio>=4.0.0,<5.0.0",
    "pyyaml>=6.0.2",
    "fast-depends[pydantic]>=3.0.8,<4.0.0",
]

[project.urls]
Homepage = "https://ag2.ai/"
Documentation = "https://docs.ag2.ai"
Tracker = "https://github.com/ag2ai/ag2/issues"
Source = "https://github.com/ag2ai/ag2"
Discord = "https://discord.gg/pAbnFJrkgZ"

[[project.authors]]
name = "Chi Wang & Qingyun Wu"
email = "support@ag2.ai"

[project.optional-dependencies]
a2a = ["a2a-sdk>=1.1.0,<2"]
a2ui = [
    "jsonschema>=4.18.0,<5",
    "starlette>=0.40,<2",
]
acp = [
    "agent-client-protocol>=0.12.1,<0.13",
    "ag2[mcp]",
    "starlette>=0.40,<2",
    "uvicorn>=0.51.0,<1",
]
ag-ui = ["ag-ui-protocol>=0.1.15,<0.2"]
openai = ["openai>=2.45.0,<3.0"]
anthropic = ["anthropic>=0.116.0,<1"]
gemini = [
    "google-genai>=1.68.0,<3.0",
    "google-auth",
]
elevenlabs = ["elevenlabs>=1.50.0,<3"]
xai = ["xai-sdk>=1.12.2,<2"]
zai = ["zai-sdk>=0.2.3,<1"]
mistral = ["mistralai>=2.8.0,<3"]
ollama = ["ollama>=0.4.7"]
bedrock = ["boto3>=1.34.149"]
dashscope = ["dashscope>=1.25.13"]
redis = ["redis>=5.0,<9"]
tracing = ["opentelemetry-sdk>=1.20"]
metrics = ["prometheus-client>=0.20.0,<0.30.0"]
tavily = ["tavily-python>=0.7.4,<0.8"]
ddgs = ["ddgs>=9.0.0,<10"]
perplexity = ["perplexityai>=0.30.0,<1"]
mcp = [
    "mcp>=2.0.0,<3",
    "mcp-types>=2.0.0,<3",
    "jsonschema>=4.20.0,<5",
]
mcp-ui = [
    "mcp-ui-server>=1.0.0",
    "mcp>=2.0.0,<3",
]

[dependency-groups]
test-core = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-timeout>=2.4.0,<3",
