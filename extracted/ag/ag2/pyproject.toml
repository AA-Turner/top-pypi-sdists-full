    "ag2[tracing]",
    "ag2[metrics]",
    "ag2[ag-ui]",
    "tinyfish>=0.5,<0.6; python_version>='3.11'",
    "daytona>=0.171.0,<1",
    "tenki>=0.5.4,<1",
    "exa-py>=2.12.1,<3",
    "docker>=6.0.0,<8",
    "nlip-sdk>=0.1.0,<1",
    "nlip-server>=0.1.3,<1",
    "ag2[openai]",
    "ag2[anthropic]",
    "ag2[gemini]",
    "ag2[ollama]",
    "ag2[dashscope]",
    "ag2[xai]",
    "ag2[mistral]",
    "ag2[redis]",
    "watchdog>=4.0,<7",
    "websockets>=14.0,<17",
    "ag2[tavily,ddgs,perplexity]",
    "mkdocs-material==9.7.7",
    "mkdocs-literate-nav==0.6.3",
    "mdx-include==1.4.2",
    "mkdocs-git-revision-date-localized-plugin==1.5.4",
