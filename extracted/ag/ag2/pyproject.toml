    "docker>=6.0.0,<8",
    "ag2[mcp]",
    "ag2[mcp-ui]",
    "pillow",
    "python-dotenv",
    "respx>=0.23.0,<0.24.0",
    "httpx2>=2.9.1,<3",
]
optionals = [
    "ag2[redis]",
    "ag2[ag-ui]",
    "ag2[a2a]",
    "ag2[a2ui]",
    "ag2[mcp]",
    "ag2[mcp-ui]",
    "ag2[acp]",
    "ag2[tracing]",
    "ag2[metrics]",
    "ag2[tavily,ddgs,perplexity]",
