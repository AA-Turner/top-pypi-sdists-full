    "daytona>=0.171.0,<1",
    "tenki>=0.5.4,<1",
    "tinyfish>=0.5,<0.6; python_version>='3.11'",
    "exa-py>=2.12.1,<3",
    "ag2[openai]",
    "ag2[anthropic]",
    "ag2[bedrock]",
    "ag2[gemini]",
    "ag2[ollama]",
    "ag2[dashscope]",
    "ag2[xai]",
    "ag2[zai]",
    "ag2[mistral]",
    "ag2[elevenlabs]",
