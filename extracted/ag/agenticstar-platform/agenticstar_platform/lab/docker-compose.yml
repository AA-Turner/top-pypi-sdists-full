# Local integration lab
#
# Starts PostgreSQL / Qdrant / S3-compatible storage (MinIO) at pinned versions for the
# credential-free SDK integration experience. The credentials written here are fixed,
# lab-only, non-production values and apply only to local containers bound to 127.0.0.1.
# lab_config.py is the source of truth for values (tests/lab/test_lab_contract.py detects drift).
#
# Start:     python -m agenticstar_platform.lab          (compose up runs in phase 2)
# Diagnose:  python -m agenticstar_platform.lab doctor
# Tear down: python -m agenticstar_platform.lab --reset  (also deletes volumes; lists targets and asks first)

services:
  lab-postgres:
    image: postgres:16.6-alpine
    container_name: agenticstar-lab-postgres
    environment:
      POSTGRES_USER: agenticstar_lab
      POSTGRES_PASSWORD: agenticstar-lab-local-only
      POSTGRES_DB: agenticstar_lab
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - lab-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenticstar_lab -d agenticstar_lab"]
      interval: 2s
      timeout: 3s
      retries: 30

  lab-qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: agenticstar-lab-qdrant
    ports:
      - "127.0.0.1:16333:6333"
      - "127.0.0.1:16334:6334"
    volumes:
      - lab-qdrant-data:/qdrant/storage
    healthcheck:
      # the qdrant image has no curl/wget, so check TCP reachability with bash's /dev/tcp
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  lab-minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: agenticstar-lab-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: agenticstar-lab
      MINIO_ROOT_PASSWORD: agenticstar-lab-local-only
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - lab-minio-data:/data
    healthcheck:
      # the minio image has no curl, but it ships mc (the 'local' alias is predefined)
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  lab-postgres-data:
  lab-qdrant-data:
  lab-minio-data:
