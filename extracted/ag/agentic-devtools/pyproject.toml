[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "agentic-devtools"
dynamic = ["version"]
description = "Agentic devtools integrate Jira, DevOps & more"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "ayaiayorg" }
]
dependencies = [
    "specify-cli==1.0.1",
    "requests>=2.28.0",
    "Jinja2>=3.0.0",
    "PyYAML>=6.0.0",
    "build>=1.2.2",
    "twine>=5.0.0",
    "azure-monitor-query>=1.0.0",
    "azure-identity>=1.0.0",
    "langchain-core>=1.4.7,<2",
    "langgraph>=0.2.0,<2",
    "langgraph-checkpoint-sqlite>=3.0.1",
    "mcp>=1.0.0,<2.0.0",
    "jsonschema>=4.20.0",
    "pydantic>=2.0,<3",
    "packaging>=21.0",
    "github-copilot-sdk>=1.0.0,<2.0.0",
    "openai>=1.30.0,<2",
    "tiktoken>=0.7.0,<1",
    "typing-extensions>=4.0",
    "atlassian-python-api>=4.0,<5",
    "tomli>=1.1.0; python_version < '3.11'",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40.0",
    "pyotp>=2.9.0",
]
dev = [
    "black>=24.0.0",
    "isort>=5.12.0",
    "mypy>=1.8.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "types-PyYAML>=6.0.0",
    "types-requests>=2.28.0",
    "vcrpy>=6.0.0",
    "pytest-recording>=0.13.0",
]

[project.scripts]
# All entry points route through runner.run_as_script, which derives the
# command name from sys.argv[0] and handles KeyboardInterrupt gracefully.
# Exception: agdt-mcp-server is wired directly to agentic_devtools.mcp.server:main
# because MCP stdio transport requires direct control of stdin/stdout.
agdt-set = "agentic_devtools.cli.runner:run_as_script"
agdt-get = "agentic_devtools.cli.runner:run_as_script"
agdt-delete = "agentic_devtools.cli.runner:run_as_script"
