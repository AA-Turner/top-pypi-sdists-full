[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "agentic_devtools/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["agentic_devtools"]

[tool.hatch.build.targets.wheel.force-include]
".github/agents" = "agentic_devtools/_bundled_skills/agents"
".github/prompts" = "agentic_devtools/_bundled_skills/prompts"
".agents/skills" = "agentic_devtools/_bundled_skills/skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--cov=agentic_devtools --cov-report=term-missing --cov-fail-under=100"
markers = [
    "windows_only: mark test to run only on Windows (msvcrt file locking)",
    "linux_only: mark test to run only on Linux/Unix (fcntl file locking)",
    "e2e: mark test as end-to-end smoke test",
]
filterwarnings = [
    "error",
    # urllib3 InsecureRequestWarning is suppressed at source in jira/helpers.py;
    # this entry is a belt-and-suspenders guard for any test that imports the
    # module before the suppression fires.
    "ignore::urllib3.exceptions.InsecureRequestWarning",
    # PytestUnraisableExceptionWarning fires when background file handles
    # (e.g. log files opened by the tee thread) are garbage-collected after
    # the test closes the temp directory.  These are test-environment artifacts
    # and not indicative of production resource leaks.
    "ignore::pytest.PytestUnraisableExceptionWarning",
    # langgraph imports trigger a LangChain pending-deprecation warning about
    # allowed_objects default value change.  This is a third-party internal
    # detail outside our control.  Filter by standard category + module to
    # avoid depending on the private _api.deprecation submodule path.
    "ignore::PendingDeprecationWarning:langchain_core",
    # Instantiating ``mcp.server.fastmcp.FastMCP`` triggers a pydantic-settings
    # IncompleteFieldDefinitionWarning about the FastMCP ``lifespan`` field's
    # unresolved forward reference.  This is a third-party interaction between
    # the ``mcp`` package and ``pydantic_settings`` (>=2.15) outside our control
    # and cannot be resolved without calling ``model_rebuild()`` on the library's
    # internal settings model.
    "ignore::pydantic_settings.exceptions.IncompleteFieldDefinitionWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes (unused imports F401, unused variables F841, etc.)
    "W",      # pycodestyle warnings
    "I",      # isort (import sorting)
    "UP",     # pyupgrade (modernize syntax)
]

[tool.ruff.lint.isort]
known-first-party = ["agentic_devtools"]

[tool.coverage.run]
source = ["agentic_devtools"]
branch = false

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
exclude_also = [
    "if sys.platform == .win32.:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["langgraph.*", "mcp.*", "azure.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "agentic_devtools.cli.azure_devops.vpn_toggle",
    "agentic_devtools.cli.azure_devops.mark_reviewed",
    "agentic_devtools.cli.azure_devops.helpers",
    "agentic_devtools.cli.azure_devops.pull_request_details_commands",
    "agentic_devtools.cli.azure_devops.run_details_commands",
    "agentic_devtools.cli.azure_context.commands",
]
ignore_errors = true
