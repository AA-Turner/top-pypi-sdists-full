# Applies review-feedback audit results synchronously (plain git + `gh pr create`
# via `agdt-audit-apply`) and opens the instruction-update PR.
#
# WHY pull_request_target (not push):
# The evaluation output is produced by the Copilot cloud coding agent on a
# `copilot/**` branch. Pushes and `pull_request` events generated by that agent
# (a GITHUB_TOKEN-class actor) do NOT start `on: push` / `on: pull_request` runs —
# GitHub suppresses them to prevent recursive workflows, so the previous `push`
# trigger never fired for the agent's branch. `pull_request_target` runs in the
# base-repo context and fires on the human `synchronize` emitted once the
# scheduled audit-takeover-eval-prs workflow reclaims the eval PR under a human
# identity (the same pull_request_target mechanism used by ai-pr-loop-dispatcher.yml).
#
# Data layout: the `copilot/**` PR head carries only `agent-output/**`, while
# `batch-meta.json` lives on the `audit/batch-<id8>` staging branch. Both are
# materialized as DATA (a pathspec checkout copies files without executing any
# PR-head code), and apply is never delegated to a coding agent, so this workflow
# cannot recursively re-trigger itself.
name: Audit Review Feedback Apply

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "audit-batches/**/agent-output/**"

permissions:
  contents: read

concurrency:
  group: audit-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-audit:
    # Only same-repo evaluation PRs whose head is a copilot/** or audit/batch-* branch.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.event.pull_request.head.ref, 'copilot/') ||
       startsWith(github.event.pull_request.head.ref, 'audit/batch-'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      # Trusted checkout of the base ref (default branch). Every command that runs
      # in this job (pip install, agdt-audit-apply) comes from the base, never the
      # PR head. Credentials are persisted so we can fetch same-repo data below.
      - uses: actions/checkout@v4
      - run: pip install -e .
      - name: Validate SPECKIT Token
        env:
          SPECKIT_PR_TOKEN: ${{ secrets.SPECKIT_PR_TOKEN }}
        run: |
          if [[ -z "$SPECKIT_PR_TOKEN" ]]; then
            echo "::error::SPECKIT_PR_TOKEN secret is not configured or empty. This PAT is required for pull request creation in audit apply (the branch push uses the ambient GITHUB_TOKEN)."
            exit 1
          fi
      - id: materialize
        name: Materialize agent-output (PR head) and batch-meta (staging branch)
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          # Guard: if the eval PR branch was already deleted (e.g., a previous
          # successful apply cleaned it up while this run was queued), treat as
          # an idempotent no-op rather than hard-failing under set -euo pipefail.
          if ! git ls-remote --exit-code --heads origin "$HEAD_REF" >/dev/null 2>&1; then
            echo "::notice::PR head branch $HEAD_REF not found (branch deleted or already applied); skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Copy the audit-batches/** tree from the (untrusted) PR head into the
          # working tree. A pathspec checkout never executes any PR-head code.
          # Defense-in-depth: if the branch was deleted in the window between the
          # ls-remote check above and the fetch (TOCTOU), skip gracefully.
          if ! git fetch --no-tags --depth=1 origin "$HEAD_REF" 2>/dev/null; then
            echo "::notice::Fetch of $HEAD_REF failed (branch likely deleted between check and fetch); skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout FETCH_HEAD -- audit-batches 2>/dev/null || true

          mapfile -t agent_dirs < <(find audit-batches -mindepth 2 -maxdepth 2 -type d -name agent-output 2>/dev/null)
          if [ "${#agent_dirs[@]}" -ne 1 ]; then
            echo "::notice::Expected exactly one agent-output batch directory, found ${#agent_dirs[@]}; nothing to apply."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          batch_id="$(basename "$(dirname "${agent_dirs[0]}")")"
          batch_branch="audit/batch-${batch_id:0:8}"

          # The staging branch holds batch-meta.json (pr_numbers, tracking_issue). apply
          # deletes it on success, so its absence means the batch was already applied.
          if ! git ls-remote --exit-code --heads origin "$batch_branch" >/dev/null 2>&1; then
            echo "::notice::Staging branch $batch_branch not found (already applied or reaped); skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$batch_branch"
          git checkout FETCH_HEAD -- "audit-batches/${batch_id}/batch-meta.json"
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - id: meta
        if: steps.materialize.outputs.skip != 'true'
        run: |
          (
            python3 - "$GITHUB_OUTPUT" <<'PY'
          import json
          import pathlib
          import sys

          meta_paths = sorted(pathlib.Path("audit-batches").glob("*/batch-meta.json"))
          if len(meta_paths) != 1:
              raise SystemExit(f"Expected exactly one batch-meta.json under audit-batches/, found {len(meta_paths)}")

          meta = json.loads(meta_paths[0].read_text(encoding="utf-8"))

          batch_id = str(meta.get("batch_id", "")).strip()
          if not batch_id:
              raise SystemExit("batch-meta.json is missing batch_id")

          expected_output_dir = f"audit-batches/{batch_id}"
          if meta.get("output_dir", "") != expected_output_dir:
              raise SystemExit(
                  f"batch-meta.json output_dir mismatch: expected '{expected_output_dir}', got '{meta.get('output_dir', '')}'"
              )

          with pathlib.Path(sys.argv[1]).open("a", encoding="utf-8") as fh:
              fh.write(f"batch_id={batch_id}\n")
              fh.write(f"pr_numbers={','.join(str(n) for n in meta.get('pr_numbers', []))}\n")

              tracking_issue_raw = str(meta.get("tracking_issue", "")).strip()
              if not tracking_issue_raw:
                  raise SystemExit("batch-meta.json is missing tracking_issue")
              try:
                  tracking_issue_int = int(tracking_issue_raw)
              except ValueError:
                  raise SystemExit(f"batch-meta.json tracking_issue is not a valid integer: {tracking_issue_raw!r}")
              fh.write(f"tracking_issue={tracking_issue_int}\n")

              base_sha = str(meta.get("base_sha", "")).replace("\r", "").replace("\n", "").strip()
              fh.write(f"output_dir={meta.get('output_dir', '')}\n")
              fh.write(f"base_sha={base_sha}\n")
          PY
          )
      - name: Apply audit results
        if: steps.materialize.outputs.skip != 'true'
        run: |
          agdt-audit-apply \
            --repo "${{ github.repository }}" \
            --batch-id "${{ steps.meta.outputs.batch_id }}" \
            --output-dir "${{ steps.meta.outputs.output_dir }}" \
            --pr-numbers "${{ steps.meta.outputs.pr_numbers }}" \
            --tracking-issue "${{ steps.meta.outputs.tracking_issue }}" \
            --base-sha "${{ steps.meta.outputs.base_sha }}" \
            --eval-pr-branch "${{ github.event.pull_request.head.ref }}"
        env:
          GH_TOKEN: ${{ secrets.SPECKIT_PR_TOKEN }}
          SPECKIT_PR_TOKEN: ${{ secrets.SPECKIT_PR_TOKEN }}