name: PR Targeted Checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  targeted-checks:
    name: Run Targeted Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Set up Node.js (for markdownlint)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2@0.17.2

      - name: Compute changed files
        id: changed
        run: |
          git fetch origin main
          git diff --name-only origin/main...HEAD > /tmp/changed-files.txt
          echo "count=$(wc -l < /tmp/changed-files.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          cat /tmp/changed-files.txt

      - name: Set up Go
        if: steps.changed.outputs.count != '0'
        uses: actions/setup-go@v5
        with:
          go-version: '1.18'
          cache: false

      - name: Install actionlint
        if: steps.changed.outputs.count != '0'
        run: bash scripts/install-actionlint.sh

      - name: Run targeted checks
        if: steps.changed.outputs.count != '0'
        run: |
          python -m agentic_devtools.cli.checks

      - name: No changes detected
        if: steps.changed.outputs.count == '0'
        run: echo "No changed files detected — skipping checks."

  targeted-checks-gate:
    name: Targeted Checks ✅
    needs: [targeted-checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        run: |
          if [[ "${{ needs.targeted-checks.result }}" == "failure" ]]; then
            echo "Targeted checks failed"
            exit 1
          fi
          echo "Targeted checks passed"

  pr-head-targeted-checks:
    name: Run PR Head Targeted Checks
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.verified.outputs.head_sha }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify PR head and exact changed files
        id: verified
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          actual_head=$(git rev-parse --verify HEAD)
          if [[ ! "$actual_head" =~ ^[0-9a-fA-F]{40}$ || "$actual_head" != "$EXPECTED_HEAD_SHA" ]]; then
            echo "::error::Checked-out HEAD is not the event PR head SHA"
            exit 1
          fi
          if [[ ! "$EXPECTED_BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Event PR base SHA is not a full commit SHA"
            exit 1
          fi
          git fetch --no-tags origin "$EXPECTED_BASE_SHA"
          git update-ref refs/remotes/origin/main "$EXPECTED_BASE_SHA"
          actual_base=$(git rev-parse --verify refs/remotes/origin/main)
          if [[ "$actual_base" != "$EXPECTED_BASE_SHA" ]]; then
            echo "::error::origin/main is not the event PR base SHA"
            exit 1
          fi
          git diff --name-only --diff-filter=d origin/main...HEAD -- > "$RUNNER_TEMP/pr-head-changed-files.txt"
          echo "head_sha=$actual_head" >> "$GITHUB_OUTPUT"
          echo "count=$(wc -l < "$RUNNER_TEMP/pr-head-changed-files.txt" | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
          echo "Verified PR head SHA: $actual_head" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/pr-head-changed-files.txt"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Set up Node.js (for markdownlint)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2@0.17.2

      - name: Set up Go
        if: steps.verified.outputs.count != '0'
        uses: actions/setup-go@v5
        with:
          go-version: '1.18'
          cache: false

      - name: Install actionlint
        if: steps.verified.outputs.count != '0'
        run: bash scripts/install-actionlint.sh

      - name: Run targeted checks
        if: steps.verified.outputs.count != '0'
        run: |
          python -m agentic_devtools.cli.checks

      - name: No changes detected
        if: steps.verified.outputs.count == '0'
        run: echo "No changed files detected — skipping checks."

  pr-head-targeted-checks-gate:
    name: PR Head Targeted Checks ✅
    needs: [pr-head-targeted-checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check PR head result
        env:
          HEAD_RESULT: ${{ needs.pr-head-targeted-checks.result }}
        run: |
          if [[ "$HEAD_RESULT" != "success" ]]; then
            echo "PR head targeted checks did not succeed"
            exit 1
          fi
          echo "PR head targeted checks passed"
