name: AI PR Loop
run-name: AI PR Loop (PR ${{ inputs.pr_number }})
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      head_sha:
        required: false
        type: string
      trigger_reason:
        required: false
      operation_id:
        required: false
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  checks: read
env:
  AGDT_USE_PYTHON_ORCHESTRATOR: "1"
  ENABLE_AUTO_APPLY_SUGGESTIONS: ${{ vars.ENABLE_AUTO_APPLY_SUGGESTIONS || 'false' }}
  ENABLE_SUPPRESSED_DEFERRAL: ${{ vars.ENABLE_SUPPRESSED_DEFERRAL || 'false' }}
concurrency:
  group: ai-pr-loop-${{ inputs.pr_number }}
  cancel-in-progress: false
jobs:
  ai-pr-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number != ''
    steps:
      - name: Checkout workflow sources
        uses: actions/checkout@v4
        with: {ref: '${{ github.event.repository.default_branch }}', fetch-depth: 0, token: '${{ secrets.DEFAULT_CLASSIC_REPO_WORKFLOW_PAT }}', persist-credentials: true}
      - name: Configure Git identity for mutations
        run: |
          git config user.name "AMARSNIK_swica"
          git config user.email "AMARSNIK_swica@users.noreply.github.com"
      - name: Set up Python for cooldown gate
        uses: actions/setup-python@v5
        with: {python-version: '3.14', cache: 'pip'}
      - name: Bootstrap package for cooldown gate
        id: cooldown-bootstrap
        run: python -m pip install --disable-pip-version-check -q .
      - name: Verify cooldown gate imports
        id: cooldown-import-smoke
        run: python -c "import agentic_devtools; assert isinstance(agentic_devtools.__version__, str) and agentic_devtools.__version__; from agentic_devtools.cli.ci.watchdog_command import ai_pr_loop_watchdog_command; assert callable(ai_pr_loop_watchdog_command)"
      - name: Check provider cooldown gate
        id: cooldown-gate
        env: {GH_TOKEN: '${{ secrets.DEFAULT_CLASSIC_REPO_WORKFLOW_PAT }}', DEFAULT_CLASSIC_REPO_WORKFLOW_PAT: '${{ secrets.DEFAULT_CLASSIC_REPO_WORKFLOW_PAT }}', AGDT_GITHUB_SECRETS_JSON: '${{ toJSON(secrets) }}', REPO_VARIABLE_WRITER_PAT: '${{ secrets.REPO_VARIABLE_WRITER_PAT }}', AI_PR_LOOP_CREDENTIAL_IDENTITY: DEFAULT_CLASSIC_REPO_WORKFLOW_PAT}
        run: |
          python -c 'import os, sys; from agentic_devtools.cli.ci.watchdog_command import ai_pr_loop_watchdog_command; sys.argv = ["watchdog", "--mode", "cooldown-gate", "--repo", os.environ["GITHUB_REPOSITORY"]]; ai_pr_loop_watchdog_command()'
      - name: Resolve PR head ref
        if: steps.cooldown-gate.outputs.cooldown_active != 'true'
        id: dispatch-pr
        env: {GH_TOKEN: '${{ secrets.DEFAULT_CLASSIC_REPO_WORKFLOW_PAT }}', DEFAULT_CLASSIC_REPO_WORKFLOW_PAT: '${{ secrets.DEFAULT_CLASSIC_REPO_WORKFLOW_PAT }}', AGDT_GITHUB_SECRETS_JSON: '${{ toJSON(secrets) }}', REPO_VARIABLE_WRITER_PAT: '${{ secrets.REPO_VARIABLE_WRITER_PAT }}', AI_PR_LOOP_CREDENTIAL_IDENTITY: DEFAULT_CLASSIC_REPO_WORKFLOW_PAT, PR_NUMBER_INPUT: '${{ github.event.inputs.pr_number }}', HEAD_SHA_INPUT: '${{ github.event.inputs.head_sha }}'}
        run: |
          set -euo pipefail
          pr_number="$PR_NUMBER_INPUT"
          [[ "$pr_number" =~ ^[0-9]+$ ]] || { echo "::error::workflow_dispatch input pr_number must be a numeric pull request number"; exit 1; }
          pr_json="$(python - "$pr_number" "${{ github.repository }}" <<'PY'
          import json
          import sys

          from agentic_devtools.cli.ci.github_provider import _gh_api

          number, repo = sys.argv[1:]
          pr = json.loads(_gh_api(f"/repos/{repo}/pulls/{number}"))
          print(json.dumps({
              "headRefName": pr["head"]["ref"],
              "headRefOid": pr["head"]["sha"],
              "state": pr["state"].upper(),
          }))
          PY
          )"
          pr_state="$(jq -r .state <<<"$pr_json")"
          if [[ "$pr_state" != "OPEN" ]]; then
            echo "::notice::PR #$pr_number is $pr_state; skipping loop execution."
            echo "pr_open=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pr_open=true" >> "$GITHUB_OUTPUT"
          live_head_sha="$(jq -r .headRefOid <<<"$pr_json")"
          if [[ -n "$HEAD_SHA_INPUT" && "$HEAD_SHA_INPUT" != "$live_head_sha" ]]; then
            echo "::warning::Dispatch head_sha $HEAD_SHA_INPUT is stale; using live PR head $live_head_sha"
          fi
          echo "head_sha=$live_head_sha" >> "$GITHUB_OUTPUT"
          read_token_secrets="$(jq -c 'with_entries(select(.key | endswith("_SWICA_CLASSIC_REPO_WORKFLOW_PAT")))' <<< "$AGDT_GITHUB_SECRETS_JSON")"
          echo "read_token_secrets=${read_token_secrets}" >> "$GITHUB_OUTPUT"
      - if: steps.cooldown-gate.outputs.cooldown_active != 'true' && steps.dispatch-pr.outputs.pr_open == 'true'
        id: run-loop
        env:
          GH_TOKEN: ${{ secrets.DEFAULT_CLASSIC_REPO_WORKFLOW_PAT }}
          DEFAULT_CLASSIC_REPO_WORKFLOW_PAT: ${{ secrets.DEFAULT_CLASSIC_REPO_WORKFLOW_PAT }}
          AGDT_GITHUB_SECRETS_JSON: ${{ steps.dispatch-pr.outputs.read_token_secrets }}
          AI_PR_LOOP_BOOKKEEPING_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          AGDT_PR_APPROVER_PAT: ${{ secrets.AGDT_PR_APPROVER_PAT }}
          REPO_VARIABLE_WRITER_PAT: ${{ secrets.REPO_VARIABLE_WRITER_PAT }}
          AI_PR_LOOP_CREDENTIAL_IDENTITY: DEFAULT_CLASSIC_REPO_WORKFLOW_PAT
          AGDT_ALLOW_PRIVILEGED_PATHS: "1"
          AGDT_USE_AGENT_TASKS_API: "1"
          COPILOT_AGENT_MODEL: ${{ vars.AI_PR_LOOP_REPAIR_MODEL || 'gpt-6-luna' }}
          AGDT_OPERATION_ID: ${{ inputs.operation_id }}
          TRIGGER_REASON: ${{ inputs.trigger_reason }}
          AI_PR_LOOP_ACTIONABLE_CHECKS: ${{ vars.AI_PR_LOOP_ACTIONABLE_CHECKS }}
          AI_PR_LOOP_EXPECT_CODEQL: ${{ vars.AI_PR_LOOP_EXPECT_CODEQL }}
          AI_PR_LOOP_AGENT_RETRY_LIMIT: ${{ vars.AI_PR_LOOP_AGENT_RETRY_LIMIT || '' }}
        run: |
          exit_code=0; set +e
          agdt-ai-pr-loop
          exit_code=$?; set -e
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          if [[ "$exit_code" -eq 1 || "$exit_code" -eq 3 || "$exit_code" -eq 5 || "$exit_code" -eq 6 ]]; then
            echo "::notice::ai-pr-loop exited with control-flow code ${exit_code}; treating as non-fatal."
            exit 0
          fi
          exit "$exit_code"
      - name: Dispatch AI PR Loop Redispatch
        if: always() && steps.run-loop.outputs.actions_executed == 'true'
        env: {GH_TOKEN: '${{ secrets.DEFAULT_CLASSIC_REPO_WORKFLOW_PAT }}', DEFAULT_CLASSIC_REPO_WORKFLOW_PAT: '${{ secrets.DEFAULT_CLASSIC_REPO_WORKFLOW_PAT }}', AGDT_GITHUB_SECRETS_JSON: '${{ steps.dispatch-pr.outputs.read_token_secrets }}', REPO_VARIABLE_WRITER_PAT: '${{ secrets.REPO_VARIABLE_WRITER_PAT }}', AI_PR_LOOP_CREDENTIAL_IDENTITY: DEFAULT_CLASSIC_REPO_WORKFLOW_PAT}
        run: |
          agdt-ai-pr-loop-watchdog \
            --mode redispatch-dispatch-redispatch \
            --repo "$GITHUB_REPOSITORY" \
            --default-branch "${{ github.event.repository.default_branch }}" ||
            echo "::warning::Failed to dispatch ai-pr-loop-redispatch.yml; continuing"
  scheduled-reconciliation:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.repository.default_branch }}', token: '${{ secrets.DEFAULT_CLASSIC_REPO_WORKFLOW_PAT }}', persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.14'}
      - run: python -m pip install .
      - run: agdt-ci-reconcile --workflow-id ai-pr-loop.yml --provider github --repo "${{ github.repository }}" --json-output
        env: {GH_TOKEN: '${{ secrets.DEFAULT_CLASSIC_REPO_WORKFLOW_PAT }}', DEFAULT_CLASSIC_REPO_WORKFLOW_PAT: '${{ secrets.DEFAULT_CLASSIC_REPO_WORKFLOW_PAT }}', AGDT_GITHUB_SECRETS_JSON: '${{ toJSON(secrets) }}', REPO_VARIABLE_WRITER_PAT: '${{ secrets.REPO_VARIABLE_WRITER_PAT }}', AI_PR_LOOP_BOOKKEEPING_TOKEN: '${{ github.token }}', AI_PR_LOOP_CREDENTIAL_IDENTITY: DEFAULT_CLASSIC_REPO_WORKFLOW_PAT}
