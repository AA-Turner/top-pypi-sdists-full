name: AI PR Loop Watchdog

on:
  workflow_dispatch: {}
  repository_dispatch:
    types:
      - ai-pr-loop-due-probe
  schedule:
    - cron: '*/20 * * * *'
    - cron: '*/5 * * * *'

concurrency:
  # Each scheduling workflow uses its own group to prevent cross-workflow
  # run displacement; cooldown writes are protected by persist_cooldown's
  # read/merge/verify/retry loop.
  group: ai-pr-loop-watchdog
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  pull-requests: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install agentic-devtools
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Restart stalled ai-pr-loop when eligible PRs exist
        run: |
          MODE="watchdog"
          if [ "${{ github.event_name }}" = "repository_dispatch" ] ||
            { [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "*/5 * * * *" ]; }; then
            MODE="due-probe-only"
          fi
          if [ "$MODE" = "due-probe-only" ] &&
             [ "${{ github.event_name }}" = "schedule" ] &&
             [ "${{ github.event.schedule }}" = "*/5 * * * *" ]; then
            for iteration in 1 2 3 4 5; do
              started_at=$(date +%s)
              agdt-ai-pr-loop-watchdog \
                --mode "$MODE" \
                --repo "${{ github.repository }}" \
                --default-branch "${{ github.event.repository.default_branch }}"
              elapsed=$(( $(date +%s) - started_at ))
              delay=$(( 60 - elapsed ))
              if [ "$iteration" -lt 5 ] && [ "$delay" -gt 0 ]; then
                sleep "$delay"
              fi
            done
          else
            agdt-ai-pr-loop-watchdog \
              --mode "$MODE" \
              --repo "${{ github.repository }}" \
              --default-branch "${{ github.event.repository.default_branch }}"
          fi
        env:
          GH_TOKEN: ${{ secrets.SPECKIT_PR_TOKEN }}
          SPECKIT_PR_TOKEN: ${{ secrets.SPECKIT_PR_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          AGDT_PR_APPROVER_PAT: ${{ secrets.AGDT_PR_APPROVER_PAT }}
          AI_PR_LOOP_CREDENTIAL_IDENTITY: SPECKIT_PR_TOKEN
          REPO_VARIABLE_WRITER_PAT: ${{ secrets.REPO_VARIABLE_WRITER_PAT }}
