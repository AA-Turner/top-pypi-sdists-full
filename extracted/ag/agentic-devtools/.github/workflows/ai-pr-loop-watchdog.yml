name: AI PR Loop Watchdog

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

concurrency:
  # Each scheduling workflow uses its own group to prevent cross-workflow
  # run displacement; cooldown writes are protected by persist_cooldown's
  # read/merge/verify/retry loop.
  group: ai-pr-loop-watchdog
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  pull-requests: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install agentic-devtools
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Restart stalled ai-pr-loop when eligible PRs exist
        run: |
          agdt-ai-pr-loop-watchdog \
            --repo "${{ github.repository }}" \
            --default-branch "${{ github.event.repository.default_branch }}"
        env:
          GH_TOKEN: ${{ secrets.SPECKIT_PR_TOKEN }}
          AI_PR_LOOP_CREDENTIAL_IDENTITY: SPECKIT_PR_TOKEN
          REPO_VARIABLE_WRITER_PAT: ${{ secrets.REPO_VARIABLE_WRITER_PAT }}
