# AI PR Loop Redispatch — Smart Continuous Scheduling
#
# Dispatched by ai-pr-loop.yml at the end of each run to keep the processing
# loop going without a cron scheduler.  Before sleeping and re-dispatching
# ai-pr-loop-throttler, it applies two stop conditions:
#
#   1. No eligible open PRs — exits cleanly (loop breaks; ai-pr-loop-dispatcher
#      will restart it when a new PR is opened or updated).
#   2. No merges to main in 24+ hours — exits cleanly (likely stuck PRs that
#      need human intervention).
#
# When both guards pass it waits for both the throttler cooldown and the
# provider cooldown (if present), then dispatches ai-pr-loop-throttler.yml.
#
# Cooldown writes use persist_cooldown's read/merge/verify/retry loop for
# cross-process safety. Each scheduling workflow uses its own concurrency
# group to prevent displacement of pending runs across workflow types.

name: AI PR Loop Redispatch

on:
  workflow_dispatch: {}

permissions:
  actions: write
  pull-requests: read
  contents: read

concurrency:
  group: ai-pr-loop-redispatch
  cancel-in-progress: false

jobs:
  smart-redispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install agentic-devtools
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Check stop conditions
        id: check
        env:
          SPECKIT_PR_TOKEN: ${{ secrets.SPECKIT_PR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          agdt-ai-pr-loop-watchdog \
            --mode redispatch-stop-conditions \
            --repo "$GITHUB_REPOSITORY" \
            --default-branch "${{ github.event.repository.default_branch }}"

      - name: Wait until safe to dispatch
        if: steps.check.outputs.should_dispatch == 'true'
        id: timing
        env:
          GH_TOKEN: ${{ secrets.SPECKIT_PR_TOKEN }}
          AI_PR_LOOP_CREDENTIAL_IDENTITY: SPECKIT_PR_TOKEN
          REPO_VARIABLE_WRITER_PAT: ${{ secrets.REPO_VARIABLE_WRITER_PAT }}
        run: |
          agdt-ai-pr-loop-watchdog \
            --mode redispatch-wait \
            --repo "$GITHUB_REPOSITORY" \
            --default-branch "${{ github.event.repository.default_branch }}"

      - name: Dispatch ai-pr-loop-throttler
        if: >-
          steps.check.outputs.should_dispatch == 'true' && steps.timing.outputs.should_dispatch == 'true'
        env:
          GH_TOKEN: ${{ secrets.SPECKIT_PR_TOKEN }}
          FALLBACK_GH_TOKEN: ${{ github.token }}
        run: |
          agdt-ai-pr-loop-watchdog \
            --mode redispatch-dispatch-throttler \
            --repo "$GITHUB_REPOSITORY" \
            --default-branch "${{ github.event.repository.default_branch }}"
