# PR Scheduler — manual round-robin dispatch; redispatch maintains the loop, dispatcher cold-starts on PR events.
# Selects the oldest eligible PRs up to the batch limit; WIP, failed, active, unknown, and escalated PRs are filtered, except failed PRs with unhandled retries.
# Variables: batch/eligible limits default to 1 (max 100); retry limit defaults to 2 (0-5); last-dispatched cursor is auto-managed. See ai-pr-loop.yml, ai-pr-loop-redispatch.yml, and ai-pr-loop-dispatcher.yml.
name: AI PR Loop Throttler
on: {workflow_dispatch: {}}

permissions:
  contents: read
  actions: read

jobs:
  schedule-next-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: ai-pr-loop-throttler
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: {token: '${{ secrets.DEFAULT_CLASSIC_REPO_WORKFLOW_PAT }}', persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.14', cache: 'pip'}
      - uses: astral-sh/setup-uv@v4
        continue-on-error: true
        with: {version: "0.7 - 0.11", enable-cache: true, cache-dependency-glob: 'pyproject.toml'}
      - name: Install agentic-devtools
        run: |
          if command -v uv >/dev/null 2>&1; then
            uv pip install --system .
          else
            python -m pip install --upgrade pip
            python -m pip install .
          fi
      - name: Select and dispatch next PR(s)
        id: schedule
        env:
          GH_TOKEN: ${{ secrets.DEFAULT_CLASSIC_REPO_WORKFLOW_PAT }}
          DEFAULT_CLASSIC_REPO_WORKFLOW_PAT: ${{ secrets.DEFAULT_CLASSIC_REPO_WORKFLOW_PAT }}
          AGDT_GITHUB_SECRETS_JSON: ${{ toJSON(secrets) }}
          AI_PR_LOOP_CREDENTIAL_IDENTITY: DEFAULT_CLASSIC_REPO_WORKFLOW_PAT
          REPO_VARIABLE_WRITER_PAT: ${{ secrets.REPO_VARIABLE_WRITER_PAT }}
          AGDT_ALLOW_PRIVILEGED_PATHS: "1"
          DRY_RUN: ${{ vars.AGENT_MONITOR_DRY_RUN || '' }}
        run: |
          agdt-ai-pr-loop-scheduler
          read_token_secrets="$(jq -c 'with_entries(select(.key | endswith("_SWICA_CLASSIC_REPO_WORKFLOW_PAT")))' <<< "$AGDT_GITHUB_SECRETS_JSON")"
          echo "read_token_secrets=${read_token_secrets}" >> "$GITHUB_OUTPUT"
      - name: Continue retry liveness polling
        if: steps.schedule.outputs.retry_liveness == 'true'
        env:
          GH_TOKEN: ${{ secrets.DEFAULT_CLASSIC_REPO_WORKFLOW_PAT }}
          DEFAULT_CLASSIC_REPO_WORKFLOW_PAT: ${{ secrets.DEFAULT_CLASSIC_REPO_WORKFLOW_PAT }}
          AGDT_GITHUB_SECRETS_JSON: ${{ steps.schedule.outputs.read_token_secrets }}
          REPO_VARIABLE_WRITER_PAT: ${{ secrets.REPO_VARIABLE_WRITER_PAT }}
          AI_PR_LOOP_CREDENTIAL_IDENTITY: DEFAULT_CLASSIC_REPO_WORKFLOW_PAT
        run: |
          agdt-ai-pr-loop-watchdog \
            --mode redispatch-dispatch-redispatch \
            --repo "$GITHUB_REPOSITORY" \
            --default-branch "${{ github.event.repository.default_branch }}"
