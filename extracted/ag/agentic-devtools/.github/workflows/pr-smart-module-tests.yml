name: PR Smart Module Tests

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read

jobs:
  smart-module-tests:
    name: Run Smart Module Tests
    runs-on: ubuntu-latest
    # For pull_request_review events, only run when Copilot (or trusted synthetic
    # reviewer) submits an approval. For pull_request events, always run.
    if: >
      github.event.pull_request.base.ref == 'main' &&
      (
        github.event_name == 'pull_request' ||
        (
          github.event_name == 'pull_request_review' &&
          github.event.review.state == 'approved' &&
          (github.event.review.user.login == 'copilot-pull-request-reviewer[bot]' ||
           github.event.review.user.login == 'AMARSNIK_swica')
        )
      )

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Detect changed modules
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.pull_request.base.sha }}
          ref: ${{ github.event.pull_request.head.sha }}
          filters: |
            git:
              - 'agentic_devtools/cli/git/**'
              - 'tests/unit/cli/git/**'
              - 'tests/test_git_*.py'
            azure_devops:
              - 'agentic_devtools/cli/azure_devops/**'
              - 'tests/unit/cli/azure_devops/**'
              - 'tests/azure_devops/**'
            azure_context:
              - 'agentic_devtools/cli/azure_context/**'
              - 'tests/unit/cli/azure_context/**'
              - 'tests/azure_context/**'
            jira:
              - 'agentic_devtools/cli/jira/**'
              - 'tests/unit/cli/jira/**'
            vpn:
              - 'agentic_devtools/cli/vpn/**'
              - 'tests/unit/cli/vpn/**'
              - 'tests/vpn/**'
            network:
              - 'agentic_devtools/cli/network/**'
              - 'tests/unit/cli/network/**'
              - 'tests/network/**'
            release:
              - 'agentic_devtools/cli/release/**'
              - 'tests/unit/cli/release/**'
              - 'tests/test_release_*.py'
            tasks:
              - 'agentic_devtools/cli/tasks/**'
              - 'tests/unit/cli/tasks/**'
            github_module:
              - 'agentic_devtools/cli/github/**'
              - 'tests/unit/cli/github/**'
            copilot:
              - 'agentic_devtools/cli/copilot/**'
              - 'tests/unit/cli/copilot/**'
            speckit:
              - 'agentic_devtools/cli/speckit/**'
              - 'tests/unit/cli/speckit/**'
            azure:
              - 'agentic_devtools/cli/azure/**'
              - 'tests/unit/cli/azure/**'
            issue_template:
              - 'agentic_devtools/cli/issue_template/**'
              - 'tests/unit/cli/issue_template/**'
            hierarchy:
              - 'agentic_devtools/hierarchy/**'
              - 'agentic_devtools/cli/hierarchy/**'
              - 'tests/unit/hierarchy/**'
              - 'tests/unit/cli/hierarchy/**'
            workflows:
              - 'agentic_devtools/cli/workflows/**'
              - 'tests/unit/cli/workflows/**'
            core:
              - 'agentic_devtools/*.py'
              - 'agentic_devtools/cli/runner.py'
              - 'agentic_devtools/cli/state.py'
              - 'agentic_devtools/cli/subprocess_utils.py'
              - 'agentic_devtools/cli/testing.py'
              - 'tests/unit/state/**'
              - 'tests/unit/background_tasks/**'
              - 'tests/unit/config/**'
              - 'tests/unit/file_locking/**'
              - 'tests/unit/task_state/**'
              - 'tests/unit/cli/runner/**'
              - 'tests/unit/cli/state/**'
              - 'tests/unit/cli/subprocess_utils/**'
              - 'tests/unit/cli/testing/**'
              - 'tests/test_validate_test_structure.py'
              - 'tests/test_scaffold_tests.py'
              - 'tests/test_version.py'
            orchestration:
              - 'agentic_devtools/orchestration/**'
              - 'tests/unit/orchestration/**'
            tools:
              - 'agentic_devtools/tools/**'
              - 'tests/unit/tools/**'
            config:
              - 'pyproject.toml'
              - 'scripts/validate_test_structure.py'
              - 'tests/conftest.py'
              - 'tests/helpers.py'
            e2e_smoke:
              - 'tests/e2e_smoke/**'
              - '.specify/extensions/**'
              - '.specify/presets/**'
              - '.specify/config.yml'
            skill_classification:
              - '.github/agents/agdt.*.agent.md'
              - '.github/prompts/agdt.*.prompt.md'
              # Canonical skills tree — a skills-only change must still run the
              # customization-content validation steps rather than no jobs at all.
              - '.agents/skills/**'
              - 'tests/fixtures/skill_classification_expected.json'
              - 'scripts/validate_skill_classification.py'
              - 'agentic_devtools/cli/checks/skill_classification.py'
              - 'agentic_devtools/skill_classification.py'
              - 'agentic_devtools/cli/checks/commands.py'
              - 'tests/unit/cli/checks/skill_classification/**'
              - 'tests/unit/cli/checks/commands/**'

      - name: Check if any module changed
        id: has-modules
        run: |
          if [[ "${{ steps.filter.outputs.git }}" == "true" || \
                "${{ steps.filter.outputs.azure_devops }}" == "true" || \
                "${{ steps.filter.outputs.azure_context }}" == "true" || \
                "${{ steps.filter.outputs.jira }}" == "true" || \
                "${{ steps.filter.outputs.vpn }}" == "true" || \
                "${{ steps.filter.outputs.network }}" == "true" || \
                "${{ steps.filter.outputs.release }}" == "true" || \
                "${{ steps.filter.outputs.tasks }}" == "true" || \
                "${{ steps.filter.outputs.github_module }}" == "true" || \
                "${{ steps.filter.outputs.copilot }}" == "true" || \
                "${{ steps.filter.outputs.speckit }}" == "true" || \
                "${{ steps.filter.outputs.azure }}" == "true" || \
                "${{ steps.filter.outputs.hierarchy }}" == "true" || \
                "${{ steps.filter.outputs.issue_template }}" == "true" || \
                "${{ steps.filter.outputs.workflows }}" == "true" || \
                "${{ steps.filter.outputs.core }}" == "true" || \
                "${{ steps.filter.outputs.orchestration }}" == "true" || \
                "${{ steps.filter.outputs.tools }}" == "true" || \
                "${{ steps.filter.outputs.e2e_smoke }}" == "true" ]]; then
            echo "result=true" >> "$GITHUB_OUTPUT"
          else
            echo "result=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.has-modules.outputs.result == 'true' || steps.filter.outputs.config == 'true' || steps.filter.outputs.skill_classification == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        if: steps.has-modules.outputs.result == 'true' || steps.filter.outputs.config == 'true' || steps.filter.outputs.skill_classification == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate 1:1:1 test structure
        if: steps.has-modules.outputs.result == 'true' || steps.filter.outputs.config == 'true' || steps.filter.outputs.skill_classification == 'true'
        run: |
          python scripts/validate_test_structure.py

      - name: Validate skill classification fixture
        if: steps.has-modules.outputs.result == 'true' || steps.filter.outputs.config == 'true' || steps.filter.outputs.skill_classification == 'true'
        run: |
          python scripts/validate_skill_classification.py

      - name: Run scoped tests with per-module coverage
        if: steps.has-modules.outputs.result == 'true' && steps.filter.outputs.config != 'true'
        run: |
          set -e

          # Standalone test files (e.g. tests/test_git_async.py) are collected
          # separately from test directories and appended *after* all
          # directories below. Interleaving a top-level file argument between
          # two directory arguments that share a `tests/unit` ancestor can
          # trigger a pytest Package-node caching quirk where the `tests/unit`
          # conftest fixtures become invisible to the second directory's tests
          # (see #1073 CI investigation). Keeping all directories contiguous
          # and files last avoids ever sandwiching a file between directories.
          TEST_DIRS=()
          TEST_FILES=()
          COV_FLAGS=()

          add_path() {
            if [ -d "$1" ]; then TEST_DIRS+=("$1");
            elif [ -f "$1" ]; then TEST_FILES+=("$1"); fi
          }
          add_glob() {
            shopt -s nullglob
            for pattern in "$@"; do
              for f in $pattern; do
                [ -f "$f" ] && TEST_FILES+=("$f")
              done
            done
            shopt -u nullglob
          }

          if [ "${{ steps.filter.outputs.git }}" = "true" ]; then
            add_path tests/unit/cli/git
            add_glob tests/test_git_*.py
            COV_FLAGS+=(--cov=agentic_devtools/cli/git)
          fi

          if [ "${{ steps.filter.outputs.azure_devops }}" = "true" ]; then
            add_path tests/unit/cli/azure_devops
            add_path tests/azure_devops
            COV_FLAGS+=(--cov=agentic_devtools/cli/azure_devops)
          fi

          if [ "${{ steps.filter.outputs.azure_context }}" = "true" ]; then
            add_path tests/unit/cli/azure_context
            add_path tests/azure_context
            COV_FLAGS+=(--cov=agentic_devtools/cli/azure_context)
          fi

          if [ "${{ steps.filter.outputs.jira }}" = "true" ]; then
            add_path tests/unit/cli/jira
            COV_FLAGS+=(--cov=agentic_devtools/cli/jira)
          fi

          if [ "${{ steps.filter.outputs.vpn }}" = "true" ]; then
            add_path tests/unit/cli/vpn
            add_path tests/vpn
            COV_FLAGS+=(--cov=agentic_devtools/cli/vpn)
          fi

          if [ "${{ steps.filter.outputs.network }}" = "true" ]; then
            add_path tests/unit/cli/network
            add_path tests/network
            COV_FLAGS+=(--cov=agentic_devtools/cli/network)
          fi

          if [ "${{ steps.filter.outputs.release }}" = "true" ]; then
            add_path tests/unit/cli/release
            add_glob tests/test_release_*.py
            COV_FLAGS+=(--cov=agentic_devtools/cli/release)
          fi

          if [ "${{ steps.filter.outputs.tasks }}" = "true" ]; then
            add_path tests/unit/cli/tasks
            COV_FLAGS+=(--cov=agentic_devtools/cli/tasks)
          fi

          if [ "${{ steps.filter.outputs.github_module }}" = "true" ]; then
            add_path tests/unit/cli/github
            COV_FLAGS+=(--cov=agentic_devtools/cli/github)
          fi

          if [ "${{ steps.filter.outputs.copilot }}" = "true" ]; then
            add_path tests/unit/cli/copilot
            COV_FLAGS+=(--cov=agentic_devtools/cli/copilot)
          fi

          if [ "${{ steps.filter.outputs.speckit }}" = "true" ]; then
            add_path tests/unit/cli/speckit
            COV_FLAGS+=(--cov=agentic_devtools/cli/speckit)
          fi

          if [ "${{ steps.filter.outputs.azure }}" = "true" ]; then
            add_path tests/unit/cli/azure
            COV_FLAGS+=(--cov=agentic_devtools/cli/azure)
          fi

          if [ "${{ steps.filter.outputs.hierarchy }}" = "true" ]; then
            add_path tests/unit/hierarchy
            add_path tests/unit/cli/hierarchy
            COV_FLAGS+=(--cov=agentic_devtools/hierarchy)
            COV_FLAGS+=(--cov=agentic_devtools/cli/hierarchy)
          fi

          if [ "${{ steps.filter.outputs.issue_template }}" = "true" ]; then
            add_path tests/unit/cli/issue_template
            COV_FLAGS+=(--cov=agentic_devtools/cli/issue_template)
          fi

          if [ "${{ steps.filter.outputs.workflows }}" = "true" ]; then
            add_path tests/unit/cli/workflows
            COV_FLAGS+=(--cov=agentic_devtools/cli/workflows)
          fi

          if [ "${{ steps.filter.outputs.core }}" = "true" ]; then
            add_path tests/unit/state
            add_path tests/unit/background_tasks
            add_path tests/unit/config
            add_path tests/unit/file_locking
            add_path tests/unit/task_state
            add_path tests/unit/cli/runner
            add_path tests/unit/cli/state
            add_path tests/unit/cli/subprocess_utils
            add_path tests/unit/cli/testing
            add_path tests/test_validate_test_structure.py
            add_path tests/test_scaffold_tests.py
            add_path tests/test_version.py
            COV_FLAGS+=(--cov=agentic_devtools.state)
            COV_FLAGS+=(--cov=agentic_devtools.background_tasks)
            COV_FLAGS+=(--cov=agentic_devtools.config)
            COV_FLAGS+=(--cov=agentic_devtools.file_locking)
            COV_FLAGS+=(--cov=agentic_devtools.task_state)
            COV_FLAGS+=(--cov=agentic_devtools.cli.runner)
            COV_FLAGS+=(--cov=agentic_devtools.cli.state)
            COV_FLAGS+=(--cov=agentic_devtools.cli.subprocess_utils)
            COV_FLAGS+=(--cov=agentic_devtools.cli.testing)
          fi

          if [ "${{ steps.filter.outputs.orchestration }}" = "true" ]; then
            add_path tests/unit/orchestration
            COV_FLAGS+=(--cov=agentic_devtools.orchestration)
          fi

          if [ "${{ steps.filter.outputs.tools }}" = "true" ]; then
            add_path tests/unit/tools
            COV_FLAGS+=(--cov=agentic_devtools.tools)
          fi

          # Directories first, then standalone files — see the add_path/add_glob
          # comment above for why this ordering must be preserved.
          TEST_PATHS=("${TEST_DIRS[@]}" "${TEST_FILES[@]}")

          echo "Test paths: ${TEST_PATHS[*]}"
          echo "Coverage flags: ${COV_FLAGS[*]}"

          if [ ${#TEST_PATHS[@]} -eq 0 ]; then
            echo "WARNING: No test paths found on disk for the detected changes — nothing to run."
            exit 0
          fi

          pytest "${TEST_PATHS[@]}" "${COV_FLAGS[@]}" \
            --cov-report=term-missing \
            --cov-fail-under=100 \
            '--override-ini=addopts='

      - name: Run full test suite (config changed)
        if: steps.filter.outputs.config == 'true'
        run: |
          pytest --cov=agentic_devtools --cov-report=term-missing --cov-fail-under=100 --ignore=tests/workflows

      - name: Run skill classification tests
        if: steps.filter.outputs.skill_classification == 'true' && steps.has-modules.outputs.result != 'true' && steps.filter.outputs.config != 'true'
        run: |
          pytest \
            tests/unit/cli/checks/skill_classification \
            tests/unit/cli/checks/commands \
            --cov=agentic_devtools.cli.checks.skill_classification \
            --cov=agentic_devtools.cli.checks.commands \
            --cov-report=term-missing \
            --cov-fail-under=100 \
            '--override-ini=addopts='

      - name: Run E2E smoke tests
        if: steps.filter.outputs.e2e_smoke == 'true'
        run: |
          pytest tests/e2e_smoke/ -v --no-cov

      - name: Run workflow integration tests
        if: steps.filter.outputs.workflows == 'true'
        run: |
          pytest tests/workflows/ -v --override-ini="addopts="

      - name: No modules changed
        if: steps.has-modules.outputs.result != 'true' && steps.filter.outputs.config != 'true'
        run: echo "No testable modules changed — skipping tests."

  smart-module-tests-gate:
    name: Smart Module Tests ✅
    needs: [smart-module-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        run: |
          if [[ "${{ needs.smart-module-tests.result }}" == "failure" ]]; then
            echo "Smart module tests failed"
            exit 1
          fi
          echo "Smart module tests passed or were skipped"
