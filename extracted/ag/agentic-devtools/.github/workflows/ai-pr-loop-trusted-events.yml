name: AI PR Loop Trusted Events

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  actions: write
  pull-requests: read

jobs:
  trusted-event-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install agentic-devtools
        run: python -m pip install .
      - name: Run live reconciliation preflight
        run: |
          agdt-ci-reconcile \
            --workflow-id ai-pr-loop.yml \
            --provider github \
            --repo "${{ github.repository }}" \
            --json-output \
            --invalidate-inventory \
            --trusted-pr-number "${{ github.event.pull_request.number }}" \
            --trusted-head-sha "${{ github.event.pull_request.head.sha }}"
        env:
          GH_TOKEN: ${{ secrets.SPECKIT_PR_TOKEN }}
