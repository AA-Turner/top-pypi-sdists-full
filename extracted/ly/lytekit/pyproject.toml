[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flytekit"]

[project]
name = "lytekit"
version = "0.16.1"
description = "Latch fork of Flyte SDK for Python"
readme = "README.md"
license = { file = "LICENSE" }

requires-python = ">=3.9"
dependencies = [
  "lyteidl==0.3.1",
  "wheel>=0.30.0,<1.0.0",
  "click>=6.6,<9.0",
  "croniter>=0.3.20,<4.0.0",
  "deprecated>=1.0,<2.0",
  "docker>=7.1.0",
  "python-dateutil>=2.1",
  "grpcio>=1.43.0,!=1.45.0,<2.0",
  "grpcio-status>=1.43,!=1.45.0",
  "protobuf>=3.20.3,<6",
  "python-json-logger>=2.0.0",
  "pytimeparse>=1.1.8,<2.0.0",
  "pytz",
  "keyring>=18.0.1",
  "requests>=2.18.4,<3.0.0",
  "responses>=0.10.7",
  "sortedcontainers>=1.5.9,<3.0.0",
  "statsd>=3.0.0,<4.0.0",
  "urllib3>=1.22,<2.0.0",
  "wrapt>=1.0.0,<2.0.0",
  "retry==0.9.2",
  "dataclasses-json>=0.5.2,<=0.5.6",
  "jsonschema>=4.5.1",
  "natsort>=7.0.1",
  "docker-image-py>=0.1.10",
  "typing_extensions>=4.7.1",
  "docstring-parser>=0.9.0",
  "diskcache>=5.2.1",
  "cloudpickle>=2.0.0",
  "cookiecutter>=1.7.3",
  "latch_persistence>=0.1.5",
  "memory_profiler==0.61.0",
]

classifiers = [
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
]


[project.scripts]
pyflyte-execute = "flytekit.bin.entrypoint:execute_task_cmd"
pyflyte-fast-execute = "flytekit.bin.entrypoint:fast_execute_task_cmd"
pyflyte-map-execute = "flytekit.bin.entrypoint:map_execute_task_cmd"
pyflyte = "flytekit.clis.sdk_in_container.pyflyte:main"
flyte-cli = "flytekit.clis.flyte_cli.main:_flyte_cli"
