[project]
name = "aerich"
dynamic = []
description = "A database migrations tool for Tortoise ORM."
authors = [
    { name = "long2ice", email = "long2ice@gmail.com>" },
]
readme = "README.md"
keywords = [
    "migrate",
    "Tortoise-ORM",
    "mysql",
    "postgresql",
]
requires-python = ">=3.9"
dependencies = [
    "tortoise-orm (>=0.21.0,!=1.0.0,<2.0.0)",
    "dictdiffer (>=0.9.0,<1.0.0)",
    "asyncclick (>=8.1.7,<9.0.0)",
    "anyio (>=3.6.2,<5.0.0)",
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: PL/SQL",
    "Framework :: AsyncIO",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
    "Typing :: Typed",
    "Operating System :: POSIX",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
]
version = "0.9.3"

[project.license]
text = "Apache-2.0"

[project.optional-dependencies]
toml = [
    "tomli-w (>=1.1.0,<2.0.0); python_version >= '3.11'",
    "tomlkit (>=0.11.4,<1.0.0); python_version < '3.11'",
]
asyncpg = [
    "asyncpg",
]
psycopg = [
    "psycopg[pool,binary] (>=3.0.12,<4.0.0)",
]
asyncmy = [
    "asyncmy>=0.2.9",
]
mysql = [
    "aiomysql>=0.2.0",
]

[project.urls]
homepage = "https://github.com/tortoise/aerich"
repository = "https://github.com/tortoise/aerich.git"
documentation = "https://github.com/tortoise/aerich"

[project.scripts]
aerich = "aerich.cli:main"

[dependency-groups]
dev = [
    "ruff >=0.9.0",
    "bandit >=1.7.0",
    "mypy >=1.10.0",
    "twine >=6.1.0",
]
test = [
    "pytest >=8.3.0",
    "pytest-mock >=3.14.0",
    "pytest-cov>=7.0.0",
    "async-timeout >=5.0.1; python_version <'3.11'",
    "pydantic-settings >=2.10.1",
    "cryptography; python_version >='3.9.0,!=3.9.1'",
]
vector = [
    "tortoise-vector >=0.2.0; python_version >='3.10'",
]

[tool.aerich]
tortoise_orm = "conftest.tortoise_orm"
location = "./migrations"
src_folder = "./."

[tool.pdm.version]
source = "file"
path = "aerich/version.py"

[tool.pdm.build]
excludes = [
    "./**/.git",
    "./**/.*_cache",
]
include = [
    "CHANGELOG.md",
    "LICENSE",
    "README.md",
]

[tool.pytest.ini_options]
anyio_mode = "auto"

[tool.coverage.run]
branch = true
source = [
    "aerich",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
]

[tool.mypy]
pretty = true
check_untyped_defs = true
disallow_incomplete_defs = false
exclude = [
    "tests/assets",
    "migrations",
]

[[tool.mypy.overrides]]
module = [
    "dictdiffer.*",
    "orjson",
    "tomlkit",
    "tomli_w",
    "tomli",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = [
    "I",
    "SIM",
    "FA",
    "UP",
    "RUF100",
]
ignore = [
    "UP031",
]

[tool.ruff.lint.isort]
extra-standard-library = [
    "tomllib",
]

[tool.bandit]
exclude_dirs = [
    "tests",
    "conftest.py",
]

[tool.codespell]
ignore-words-list = "Bu"

[build-system]
requires = [
    "pdm-backend",
]
build-backend = "pdm.backend"
