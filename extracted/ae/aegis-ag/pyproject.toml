[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-ag"
version = "1.0.0.dev20260420063247"
description = "Aegis CLI-first persistent agent runtime."
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Agentic Intelligence Lab"}]
keywords = ["aegis", "agent", "cli", "persistent-ai", "memory", "automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Utilities",
]
dependencies = [
  "discord.py>=2.6,<3",
  "prompt_toolkit>=3.0,<4",
  "rich>=13,<15",
  "lark-oapi>=1.5.3,<2",
  "playwright>=1.51,<2",
]

[project.scripts]
aegis = "apps.launcher:main"

[project.urls]
Homepage = "https://aegis.agentic-in.ai"
Documentation = "https://aegis.agentic-in.ai/docs/"
Repository = "https://github.com/agentic-in/aegis"
Issues = "https://github.com/agentic-in/aegis/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps", "apps.api*", "apps.cli*", "apps.dashboard*", "apps.gateway*", "packages*"]
exclude = ["tests*", ".worktrees*", "apps.site*"]
namespaces = true

[tool.setuptools.package-data]
"apps.dashboard" = ["dist/*", "dist/assets/*"]
"packages.state" = ["AEGIS.md"]
"packages.skills" = ["builtin_packages/*/*/SKILL.md"]
"packages.storage" = ["migrations/*.sql"]
