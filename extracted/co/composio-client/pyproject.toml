[project]
name = "composio-client"
version = "2.1.31"
description = "The official Python library for the Composio API, generated from the v3.1 OpenAPI spec with hey-api"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Composio" }]
keywords = ["composio", "api", "client", "tool_router"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.9,<3",
  "typing-extensions>=4.12",
]

[project.urls]
Homepage = "https://github.com/ComposioHQ/composio-client"
Repository = "https://github.com/ComposioHQ/composio-client"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/composio_client"]

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.7",
]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]
# Generated API models and compatibility types are checked against their
# generators. Everything else in the package is hand-written and linted.
extend-exclude = ["src/composio_client/_generated", "src/composio_client/types"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
# The generated models are alpha hey-api output; type-check the hand-written
# runtime against them but don't hold the generated file itself to strict mode.
exclude = ["src/composio_client/_generated/"]

[[tool.mypy.overrides]]
# Pull the generated models' types when the runtime imports them, but don't
# hold hey-api's alpha output to strict mode itself.
module = "composio_client._generated.*"
follow_imports = "silent"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The demo suite is part of the same gate as the library suite, mirroring the
# TypeScript repo where `pnpm test` includes the `demo` vitest project. Its
# live test self-skips without COMPOSIO_API_KEY.
testpaths = ["tests", "../demo/python"]
