[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cortex-code-agent-sdk"
version = "1.0.7"
description = "SDK for interacting with Cortex Code CLI programmatically"
requires-python = ">=3.10"
license = "LicenseRef-Snowflake-Proprietary"
license-files = ["LICENSE"]
dependencies = [
    "anyio>=4.0",
    "mcp>=1.0",
    "snowflake-connector-python>=4.7.1,<5",
    "typing_extensions>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.20.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/cortex_code_agent_sdk"]
only-include = ["src/cortex_code_agent_sdk"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/cortex_code_agent_sdk",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = [
    "--import-mode=importlib",
    "-p", "asyncio",
]
markers = [
    "e2e: end-to-end tests requiring local coco CLI and orchestrator",
]
timeout = 60

[tool.pytest-asyncio]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["cortex_code_agent_sdk"]
