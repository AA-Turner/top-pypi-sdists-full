[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[project]
name = "contree-client"
version = "0.3.0"
description = "Python client for the Contree API, generated from the OpenAPI specification"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[[project.authors]]
name = "Dmitry Orlov"
email = "mosquito@nebius.com"

[project.urls]
Homepage = "https://contree.dev/"
Documentation = "https://docs.tokenfactory.nebius.com/sandboxes/overview"

[project.optional-dependencies]
urllib3 = ["urllib3>=2.0"]
requests = ["requests>=2.28"]
aiohttp = ["aiohttp>=3.9"]
httpx = ["httpx>=0.27"]
dev = [
    "contree-client[urllib3,requests,aiohttp,httpx]",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.3",
    "markdown-pytest[async]>=0.3",
    "types-requests",
]

[tool.uv.build-backend]
module-root = ""
namespace = true
source-include = ["tests/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: live tests against the real Contree API; auto-skip without an active contree-cli profile"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
respect-ignore-files = false

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "A",
    "B",
    "C4",
    "E",
    "F",
    "FURB",
    "I",
    "ISC",
    "PERF",
    "PIE",
    "PLC",
    "PLE",
    "RET",
    "RSE",
    "RUF",
    "SIM",
    "T20",
    "UP",
    "W",
]
ignore = ["ISC001"]
