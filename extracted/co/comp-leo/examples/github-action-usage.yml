# Example: Using Comp-LEO GitHub Action in your repository

name: Compliance Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Option 1: Use as GitHub Action
      - name: Run Comp-LEO Check
        uses: compiledger/comp-leo-action@v1
        with:
          path: 'programs/'
          policy: 'nist-800-53'
          threshold: 80
          fail-on-critical: true
      
      # Option 2: Use CLI directly
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install Comp-LEO
        run: pip install comp-leo
      
      - name: Run checks
        run: |
          comp-leo check programs/ \
            --policy pci-dss \
            --threshold 75 \
            --output report.json
      
      - name: Upload report
        uses: actions/upload-artifact@v3
        with:
          name: compliance-report
          path: report.json
