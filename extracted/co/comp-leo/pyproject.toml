[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "comp-leo"
version = "0.3.1"
description = "Compliance & security SDK for Leo smart contracts with PCI-DSS support"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    {name = "CompliLedger", email = "dev@compiledger.com"},
]
keywords = ["aleo", "leo", "compliance", "security", "blockchain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.1.7",
    "rich>=13.7.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.1",
    "tree-sitter>=0.21.0",
    "jsonschema>=4.20.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "redis>=5.0.0",
    "stripe>=7.0.0",
]
watch = [
    "watchdog>=3.0.0",
]
interactive = [
    "questionary>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]
all = [
    "comp-leo[api,watch,interactive,dev]",
]

[project.scripts]
comp-leo = "comp_leo.cli.main:cli"

[project.urls]
Homepage = "https://github.com/Compliledger/comp-leo"
Documentation = "https://github.com/Compliledger/comp-leo#readme"
Repository = "https://github.com/Compliledger/comp-leo"
Issues = "https://github.com/Compliledger/comp-leo/issues"

[tool.hatch.build.targets.wheel]
packages = ["comp_leo"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=comp_leo --cov-report=html --cov-report=term-missing"
