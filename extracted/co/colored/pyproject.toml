[build-system]
requires = ["flit_core>=3.10.1,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "colored"
version = "2.3.2"
authors = [
    {name = "Dimitris Zlatanidis", email = "dslackw@gmail.com"},
]
description = "Simple python library for color and formatting to terminal"
readme = "README.md"
requires-python = ">=3.9"
keywords = [
    'xterm',
    'color',
    'colour',
    'vt100',
    'ansi',
    'terminal',
    'text',
    'rgb',
    'linux',
    'windows']

license = {text = "MIT License"}

classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Environment :: Console',
    'License :: OSI Approved :: MIT License',
    'Operating System :: POSIX :: Other',
    'Operating System :: POSIX :: Linux',
    'Operating System :: Microsoft :: Windows',
    'Operating System :: Microsoft :: Windows :: Windows 10',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3',
    'Typing :: Typed',
    'Topic :: Terminals'
]

[tool.mypy]
strict = true
warn_return_any = true
disallow_untyped_calls = true
ignore_missing_imports = true
exclude = ["^tests/", "^unittests/", "^tests_pytest/"]

[tool.pylint.MESSAGES_CONTROL]
disable = ["missing-module-docstring", "missing-class-docstring", "C0301", "duplicate-code"]

[tool.pytest.ini_options]
testpaths = ["tests_pytest"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["colored"]
omit = ["*/tests_pytest/*", "*/tests/*", "*/unittests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[project.urls]
homepage = "https://dslackw.gitlab.io/colored/"
