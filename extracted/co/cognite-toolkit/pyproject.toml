[project]
name = "cognite_toolkit"
version = "0.9.15"
description = "Official Cognite Data Fusion tool for project templates and configuration deployment"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
]
dependencies = [
    "python-dotenv >=1.0.0",
    "cognite-sdk>=8.8.0,<9.0.0",
    "httpx2>=2.12.0",
    "pyyaml >=6.0.1",
    "typer >=0.12.0, <1.0.0",
    "click>=8.2.0",
    "rich >=13.9.4",
    "questionary >=2.0.1",
    "packaging >=25",
    "typing-extensions >=4.13.0",
    "toml >=0.10.2",
    "sentry-sdk >=2.1.0",
    "mixpanel >=4.10.1",
    "pydantic >=2.12.0",
    "pydantic_core >=2.41.0",
    "python-dateutil>= 2.9.0",
    "pip>=25.0.1",
    "filelock>=3.18.0",
    "keyring>=25.0.0",
    "authlib>=1.3.0",
]

[[project.authors]]
name = "Cognite AS"
email = "support@cognite.com"

[project.urls]
Homepage = "https://docs.cognite.com/cdf/deploy/cdf_toolkit/"
Changelog = "https://github.com/cognitedata/toolkit/releases"
GitHub = "https://github.com/cognitedata/toolkit"
Documentation = "https://docs.cognite.com/cdf/deploy/cdf_toolkit/references/resource_library"

[project.optional-dependencies]
table = ["pyarrow>=26.0.0"]
sql = ["sqlparse >=0.5.3"]
run-function-app = ["cognite-function-apps[cli]>=0.15.0"]

[project.scripts]
cdf-tk = "cognite_toolkit._cdf:app"
cdf = "cognite_toolkit._cdf:app"

[dependency-groups]
dev = [
    "pre-commit >=4.0.0",
    "pytest >=8.0.0",
    "pytest-icdiff",
    "pytest-regressions >=2.4.2",
    "pytest-xdist >=3.6.1",
    "pytest-rerunfailures >=14.0",
    "pytest-cov >=6.0.0",
    "pytest-json-report>=1.5.0",
    "types-PyYAML >=6",
    "types-toml >=0.10.8.20240310",
    "types-python-dateutil>=2.9.0.20250708",
    "twine >=6.0.0",
    "marko >=2.1.2",
    "respx>=0.22.0",
]

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "cognite_toolkit"
module-root = ""

[tool.coverage.run]
source = ["cognite_toolkit"]
omit = [
    "cognite_toolkit/_cdf_tk/apps/*",
    "cognite_toolkit/_cdf.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "from typing_extensions import Self",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "tests",
    "cognite_toolkit",
]
addopts = ["-p tests.httpx2_alias_plugin"]
markers = ["toolkit: big smoke tests"]

[tool.ty.src]
include = [
    "cognite_toolkit",
    "tests_smoke",
    "tests",
]
exclude = [
    "tests/data/",
    "tests/test_unit/test_cdf_tk/approval_client",
    "tests/test_unit/test_cdf_tk/test_commands",
    "tests/test_unit/test_cdf_tk/test_utils",
]

[tool.ty.environment]
python-version = "3.14"
python = ".venv"
extra-paths = ["typings"]

[tool.ty.rules]
invalid-mutable-override = "ignore"

[tool.ruff]
line-length = 120

[tool.ruff.format]
exclude = ["cognite_toolkit/_cdf_tk/commands/_changes.py"]

[tool.ruff.lint]
exclude = []

[tool.deptry]
known_first_party = ["cognite_toolkit"]

[tool.deptry.package_module_name_map]
cognite-sdk = "cognite"
pyyaml = "yaml"
python-dotenv = "dotenv"
python-dateutil = "dateutil"

[tool.deptry.per_rule_ignores]
DEP001 = [
    "pyodide",
    "uvicorn",
]
DEP002 = ["pip"]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
