when:
  event: [ push, pull_request ]
  path: [ "**/*.py", "uv.lock", "Cargo.toml", ".woodpecker/test.yml", "**/*.rs"  ]

steps:
  unit_tests:
    image: codeberg.org/poezio/slixmpp:ci
    commands:
    - uv python pin ${TAG}
    - uv sync --frozen --all-extras
    - uv run --frozen --all-extras ./run_tests.py

matrix:
  TAG:
    - "3.13"
    - "3.14"
    - "3.15"
