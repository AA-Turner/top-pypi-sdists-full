[project]
name = "picsellia"
version = "6.33.0"
description = "Python SDK package for Picsellia MLOps platform"
authors = [
    { "name" = "Pierre-Nicolas Tiffreau", "email" = "<pierre-nicolas@picsellia.com>" },
    { "name" = "Thomas Darget", "email" = "<thomas.darget@picsellia.com>" },
    { "name" = "Lucien Haurat", "email" = "<lucien.haurat@picsellia.com>" },
    { "name" = "Sonia Garrouch", "email" = "<sonia.garrouch@picsellia.com>" },
]
readme = "README.md"
license = { file = "LICENSE" }
homepage = "https://www.picsellia.com/"
documentation = "https://documentation.picsellia.com/reference/client"
include = ["CHANGELOG.md"]
keywords = ["ai", "picsellia", "sdk", "cvops"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
requires-python = ">=3.10, <3.15"
dependencies = [
    "beartype>=0.16.0,<1",
    "deprecation>=2.1,<3",
    "orjson>=3.9,<4",
    "picsellia-annotations>=0.13.1,<1",
    "Pillow>=9.2",
    "pydantic>=2,<3",
    "pyyaml>=6.0.1,<7",
    "requests>=2.32,<3",
    "semantic-version>=2.10,<3",
    "tqdm>=4.66.5,<5",
]

[dependency-groups]
dev = [
    "coverage>=7.0.0,<8",
    "pre-commit>=4.0.0,<5",
    "ruff>=0.15.0,<1",
]
docs = [
    "astor>=0.8.1",
    "Mako>=1.3.5"
]


[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "C", # flake8-comprehensions
    "B", # flake8-bugbear
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long
    "B904", # within except clause
]
