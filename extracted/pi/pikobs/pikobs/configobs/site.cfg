# site.cfg -- everything about where Pikobs lives that may change.
#
# One line per setting, written for bash (scripts load it with `source`)
# and read by pikobs.configobs.site in Python. An environment variable of
# the same name always wins: PIKOBS_DOC_URL=... overrides the line below.
# ${NAME} uses a setting above, or an environment variable (USER, HOME).

# The web server where the pages under ~/sites8 are seen
PIKOBS_WEB_HOST="${PIKOBS_WEB_HOST:-https://goc-dx-u3.science.gc.ca}"

# Your own runs: the folder, and how the web server shows it
PIKOBS_SITES_DIR="${PIKOBS_SITES_DIR:-${HOME}/sites8}"
PIKOBS_SITES_URL="${PIKOBS_SITES_URL:-${PIKOBS_WEB_HOST}/~${USER}/sites8}"
# Your own web folder on u3, and how the web server shows it (the index
# pages of Pikobs Web go there): each user's, from HOME and USER
PIKOBS_HTML_DIR="${PIKOBS_HTML_DIR:-${HOME}/public_html}"
PIKOBS_HTML_URL="${PIKOBS_HTML_URL:-${PIKOBS_WEB_HOST}/~${USER}}"

# Who keeps the documentation and its reference runs (the live examples
# every page links to): the same for every reader, whoever builds the pages
PIKOBS_DOC_OWNER="${PIKOBS_DOC_OWNER:-dlo001}"
PIKOBS_DOC_URL="${PIKOBS_DOC_URL:-${PIKOBS_WEB_HOST}/~${PIKOBS_DOC_OWNER}/Pikobs/docs/build/html}"
PIKOBS_REFERENCES_DIR="${PIKOBS_REFERENCES_DIR:-${PIKOBS_SITES_DIR}/references}"
PIKOBS_REFERENCES_URL="${PIKOBS_REFERENCES_URL:-${PIKOBS_WEB_HOST}/~${PIKOBS_DOC_OWNER}/sites8/references}"

# Where the code comes from, and what users follow: "release" is the latest
# published version (the highest vX.Y.Z tag, made by release.sh); "master"
# is the code in progress; or a given tag
PIKOBS_GITLAB="${PIKOBS_GITLAB:-https://gitlab.science.gc.ca/dlo001/Pikobs}"
PIKOBS_REF="${PIKOBS_REF:-release}"

# The CMC web proxy, for downloads from outside
PIKOBS_PROXY="${PIKOBS_PROXY:-http://webproxy.science.gc.ca:8888/}"

# The reference runs of the documentation read a frozen copy of their inputs
# (pikobs/script/freeze_reference_inputs.sh makes it once): the same files
# and the same four cycles at every run, so a change of code is the only
# thing that can change a figure. The period frozen is in inputs/period.cfg.
PIKOBS_REFERENCE_INPUTS="${PIKOBS_REFERENCE_INPUTS:-${PIKOBS_REFERENCES_DIR}/inputs}"
PIKOBS_REFERENCE_CONTROL_LABEL="${PIKOBS_REFERENCE_CONTROL_LABEL:-G0}"
PIKOBS_REFERENCE_CONTROL_SOURCE="${PIKOBS_REFERENCE_CONTROL_SOURCE:-/home/smco500/.suites/gdps/g0/hub/ppp7/monitoring/banco/postalt}"
PIKOBS_REFERENCE_EXPERIENCE_LABEL="${PIKOBS_REFERENCE_EXPERIENCE_LABEL:-G2}"
PIKOBS_REFERENCE_EXPERIENCE_SOURCE="${PIKOBS_REFERENCE_EXPERIENCE_SOURCE:-/home/smco500/.suites/gdps/g2/hub/ppp7/monitoring/banco/postalt}"
