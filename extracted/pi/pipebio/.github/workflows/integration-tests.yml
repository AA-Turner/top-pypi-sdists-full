name: Integration tests
run-name: Integration tests

on:
  schedule:
    - cron: '0 5 * * *'  # every day at 5 AM UTC
  workflow_dispatch:      # allow manual triggering too

jobs:
  test-testpypi:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]
        PIPE_API_URL: [ "https://antibody-dev.com", "https://ablabs-dev-engteam1.pipebio.bnchdev.org" ]

    env:
      PIPE_API_URL: ${{ matrix.PIPE_API_URL }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
          version: latest
          python-version: ${{ matrix.python-version }}

      - name: Install pipebio from PyPi
        run: |
          uv pip install pipebio[dev] pytest

      - name: Set PIPE_API_KEY based on PIPE_API_URL (Unix)
        if: runner.os != 'Windows'
        run: |
          if [[ "${PIPE_API_URL}" == "https://antibody-dev.com" ]]; then
            echo "PIPE_API_KEY=${{ secrets.ANTIBODY_DEV_API_KEY }}" >> $GITHUB_ENV
          elif [[ "${PIPE_API_URL}" == "https://ablabs-dev-engteam1.pipebio.bnchdev.org" ]]; then
            echo "PIPE_API_KEY=${{ secrets.ENGTEAM1_API_KEY }}" >> $GITHUB_ENV
          else
            echo "Unknown PIPE_API_URL: ${PIPE_API_URL}" >&2
            exit 1
          fi

      - name: Set PIPE_API_KEY based on PIPE_API_URL (Windows)
        if: runner.os == 'Windows'
        run: |
          if ($env:PIPE_API_URL -eq "https://antibody-dev.com") {
            echo "PIPE_API_KEY=${{ secrets.ANTIBODY_DEV_API_KEY }}" >> $env:GITHUB_ENV
          } elseif ($env:PIPE_API_URL -eq "https://ablabs-dev-engteam1.pipebio.bnchdev.org") {
            echo "PIPE_API_KEY=${{ secrets.ENGTEAM1_API_KEY }}" >> $env:GITHUB_ENV
          } else {
            Write-Error "Unknown PIPE_API_URL: $env:PIPE_API_URL"
            exit 1
          }
        shell: pwsh

      - name: Run tests
        run: |
          pytest -v tests/integration/


  test-pypi:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]
        PIPE_API_URL: [ "https://antibody-dev.com", "https://ablabs-dev-engteam1.pipebio.bnchdev.org" ]

    env:
      PIPE_API_URL: ${{ matrix.PIPE_API_URL }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
          version: latest
          python-version: ${{ matrix.python-version }}

      - name: Install pipebio from PyPi
        run: |
          uv pip install pipebio[dev] pytest

      - name: Set PIPE_API_KEY based on PIPE_API_URL (Unix)
        if: runner.os != 'Windows'
        run: |
          if [[ "${PIPE_API_URL}" == "https://antibody-dev.com" ]]; then
            echo "PIPE_API_KEY=${{ secrets.ANTIBODY_DEV_API_KEY }}" >> $GITHUB_ENV
          elif [[ "${PIPE_API_URL}" == "https://ablabs-dev-engteam1.pipebio.bnchdev.org" ]]; then
            echo "PIPE_API_KEY=${{ secrets.ENGTEAM1_API_KEY }}" >> $GITHUB_ENV
          else
            echo "Unknown PIPE_API_URL: ${PIPE_API_URL}" >&2
            exit 1
          fi

      - name: Set PIPE_API_KEY based on PIPE_API_URL (Windows)
        if: runner.os == 'Windows'
        run: |
          if ($env:PIPE_API_URL -eq "https://antibody-dev.com") {
            echo "PIPE_API_KEY=${{ secrets.ANTIBODY_DEV_API_KEY }}" >> $env:GITHUB_ENV
          } elseif ($env:PIPE_API_URL -eq "https://ablabs-dev-engteam1.pipebio.bnchdev.org") {
            echo "PIPE_API_KEY=${{ secrets.ENGTEAM1_API_KEY }}" >> $env:GITHUB_ENV
          } else {
            Write-Error "Unknown PIPE_API_URL: $env:PIPE_API_URL"
            exit 1
          }
        shell: pwsh

      - name: Run tests
        run: |
          pytest -v tests/integration/