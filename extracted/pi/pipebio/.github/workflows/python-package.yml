# This workflow will install Python dependencies and run regression tests
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package
run-name: Python package

on:
  push:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
          version: latest
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          uv pip install .[dev,build]
      
      - name: Run tests
        run: |
          pytest -v tests/unit/

      # Endpoint drift against the vendored contract snapshot
      # (scripts/contract/swagger-spec.json). The everything checkout is not
      # available here, so enum drift is skipped; strict enum enforcement runs in
      # the cross-repo sync workflow (sync-from-everything.yml).
      - name: Check SDK/contract drift
        run: |
          python scripts/check_drift.py

      # The committed method docstrings must match the API reference generated
      # from the vendored contract snapshot.
      - name: Check SDK docstring drift
        run: |
          python scripts/generate_docstrings.py --check

      - name: Build package
        run: |
          ./build.sh