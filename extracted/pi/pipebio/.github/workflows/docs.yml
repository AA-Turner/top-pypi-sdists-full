name: Docs and AI artifacts
run-name: Docs and AI artifacts

# Builds the in-repo API reference (to catch docstring/signature breakage) and
# verifies the bundled AI-context artifacts (pipebio/llms.txt, llms-full.txt)
# are up to date. The reference itself is NOT published anywhere.

on:
  push:

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
          version: latest
          python-version: "3.13"

      - name: Install dependencies
        run: |
          uv pip install ".[dev,build,docs]"

      - name: Build API reference (breakage check only, not published)
        run: |
          make docs

      - name: Verify bundled AI-context artifacts are up to date
        run: |
          make llms-check
