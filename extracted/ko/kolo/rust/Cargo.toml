[package]
name = "_kolo"
version = "0.0.0"  # unversioned internal crate: the published package version lives in pyproject.toml
publish = false
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "_kolo"
crate-type = ["cdylib"]

[dependencies]
bstr = "1.9.1"
crc32fast = "1.4.2"
hashbrown = "0.14.5"
libc = "0.2.189"
once_cell = "1.19.0"
pyo3 = "0.29.3"
rmp = "0.8.14"
rmpv = "1.3.0"
testresult = "0.4.0"
thread_local = "1.1.8"
ulid = "1.1.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
stacker = "0.1.25"

[build-dependencies]
pyo3-build-config = { version = "0.29.3", features = ["resolve-config"] }

[dev-dependencies]
serde_json = "1.0"

[profile.release]

# Fat LTO with the default codegen-units and opt-level. codegen-units = 1,
# thin LTO and opt-level 2 were measured (python/bench/README.md, "Release
# builds"): none is faster beyond the few percent a hot path moves between two
# builds of the same source. The gain that holds is profile-guided
# optimisation, which wheels and benchmark builds get from `maturin --pgo`.
# panic = "abort" is not an option: the tracing callbacks rely on catch_unwind.
lto = true
# debug = true

# TODO: Add when `profile-rustflags` stabilises
# https://github.com/rust-lang/cargo/issues/10271
#[profile.dev]
#rustflags = ["-C", "instrument-coverage"]
