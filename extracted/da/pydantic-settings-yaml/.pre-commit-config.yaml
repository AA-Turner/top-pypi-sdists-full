repos:
  - repo: https://github.com/pycqa/isort
    rev: 9.0.2
    hooks:
      - id: isort
  - repo: https://github.com/ambv/black
    rev: 26.10.1
    hooks:
      - id: black
  - repo: https://github.com/pycqa/flake8
    rev: 7.5.0
    hooks:
      - id: flake8
        args: ['--config=setup.cfg', '--ignore=E203,W503']
