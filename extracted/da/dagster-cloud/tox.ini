[tox]
requires =
    tox-uv>=1
envlist=
  py312-default
  py312-batching
  py312-pex_tests
  py313-default
  py313-batching
  py313-pex_tests
  py314-default
  py314-batching
  py314-pex_tests

skipsdist = True

[testenv]
download = True
setenv =
  DD_DOGSTATSD_DISABLE = true
passenv =
    PYTEST_ADDOPTS
    PYTEST_PLUGINS
    CI_*
    BUILDKITE*
    DAGSTER_GIT_REPO_DIR
    DAGSTER_INTERNAL_GIT_REPO_DIR
    SNOWFLAKE*
    AWS_*
    DOCKER_CONFIG
deps =
  -e ../../../dagster-oss/python_modules/dagster[test]
  -e ../../../dagster-oss/python_modules/dagster-pipes
  -e ../../../dagster-oss/python_modules/libraries/dagster-shared
  -e ../../../dagster-oss/python_modules/dagster-test
  -e ../../../dagster-oss/python_modules/libraries/dagster-aws
  -e ../../../dagster-oss/python_modules/libraries/dagster-dbt
  -e ../../../dagster-oss/python_modules/libraries/dagster-k8s
  -e ../../../dagster-oss/python_modules/libraries/dagster-docker
  -e ../../../dagster-oss/python_modules/libraries/dagster-dg-cli
  -e ../../../dagster-oss/python_modules/libraries/dagster-cloud-cli
  -e ../../../dagster-oss/python_modules/libraries/dagster-rest-resources
  -e ../dagster-cloud-backend
  -e ../dagster-cloud-dagit
  -e ../../integration_tests/python_modules/dagster-cloud-test-infra
  -e .[tests]
allowlist_externals =
  /bin/bash
  uv
commands =
  /bin/bash -c '! uv pip list --exclude-editable | grep -e dagster'
  default: pytest -vv \
    --ignore ./dagster_cloud_tests/agent_tests/pex_tests \
    --ignore ./dagster_cloud_tests/cli_tests/pex_tests \
    --durations 10 {posargs}
  batching: pytest -vv ./dagster_cloud_tests/agent_tests/test_dagster_cloud_agent.py --agent-batching-enabled --durations 10 {posargs}
  pex_tests: pytest -vv ./dagster_cloud_tests/agent_tests/pex_tests ./dagster_cloud_tests/cli_tests/pex_tests --durations 10 {posargs} --timeout 900
