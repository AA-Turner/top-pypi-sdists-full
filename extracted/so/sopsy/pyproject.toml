[project]
name = "sopsy"
version = "1.3.0"
description = "SOPS Python wrapper library"
readme = "README.md"
requires-python = ">= 3.9"
keywords = ["sops"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["pyyaml>=6.0.3"]

[project.license]
text = "MIT"

[[project.authors]]
name = "Nicolas Karolak"
email = "nicolas@karolak.fr"

[project.urls]
Changelog = "https://sopsy.nikaro.net/changelog/"
Homepage = "https://sopsy.nikaro.net"
Issues = "https://todo.sr.ht/~nka/sopsy"
Repository = "https://git.sr.ht/~nka/sopsy"

[dependency-groups]
dev = [
    "commitizen>=3.31.0",
    "mkdocs-coverage>=1.2.0",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=0.26.2",
    "pytest>=7.4.4",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.9",
    "types-pyyaml>=6.0.12.20240808",
    "typing-extensions>=4.16.0",
    "zuban>=0.9.1",
]

[build-system]
requires = ["uv_build>=0.10.1,<0.11.0"]
build-backend = "uv_build"

[tool.commitizen]
version_provider = "pep621"
update_changelog_on_bump = true
annotated_tag = true
gpg_sign = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "ANN401",
    "INP001",
    "S101",
    "SLF001",
]
"docs/*" = [
    "A001",
    "INP001",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.pylint]
max-args = 15
