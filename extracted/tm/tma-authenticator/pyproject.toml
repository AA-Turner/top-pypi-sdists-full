[project]
name = "tma-authenticator"
version = "v2.2.1"
description = "Verifying telegram user token."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Pavel Mulin", email = "pavel@tg-shops.com" }]
dependencies = [
  "fastapi>=0.112.2",
  "aiocache>=0.12.3",
  "python-jose>=3.3.0",
  "httpx>=0.28.1",
  "eth-account>=0.13.7",
  "pytoniq-core>=0.1.0",
  "pynacl>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tma_authenticator"]

[tool.hatch.build.targets.sdist]
include = [
  "tma_authenticator/**",
  "README.md",
  "pyproject.toml",
]