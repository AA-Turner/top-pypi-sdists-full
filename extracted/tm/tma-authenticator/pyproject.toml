[project]
name = "tma-authenticator"
version = "v3.0.0"
description = "Verifying telegram user token."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Pavel Mulin", email = "pavel@tg-shops.com" }]
dependencies = [
  "fastapi>=0.112.2",
  "aiocache>=0.12.3",
  "python-jose>=3.3.0",
  "httpx>=0.28.1",
  "eth-account>=0.13.7",
  "pytoniq-core>=0.1.0",
  "pynacl>=1.5.0",
  "sqlalchemy>=2.0.0",
  "sqlmodel>=0.0.37",
  "PyJWT>=2.0.0",
  "cryptography>=42.0.0",
  "python-multipart>=0.0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["tma_authenticator"]

[tool.hatch.build.targets.sdist]
include = [
  "tma_authenticator/**",
  "README.md",
  "pyproject.toml",
]

[tool.ruff]
target-version = "py39"
line-length = 100
exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]
ignore = [
    "E501",
    "B008",
    "ARG001",
    "ARG002",
    "F403",
    "E402",
    "RUF012",
    "B009",
    "B904",
    "E721",
    "E722",
    "E701",
    "E741",
    "F405",
    "F601",
    "F821",
    "SIM102",
    "SIM103",
    "SIM108",
    "SIM113",
    "SIM117",
    "UP035",
    "W191",
    "RUF001",
    "RUF002",
    "RUF003",
    "E261",
    "E302",
    "E305",
    "Q000",
    "COM812",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"**/__pycache__/**" = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["tma_authenticator"]

[dependency-groups]
dev = [
    "ruff>=0.14.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"