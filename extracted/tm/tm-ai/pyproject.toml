[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tm-ai"
version = "3.4.23"
description = "Time Machine for AI Agents Cognitive Version Control for LLM context"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"    
authors = [{ name = "CVC Contributors" }]
keywords = ["ai", "agents", "context", "version-control", "merkle", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control",
    "Operating System :: OS Independent",
]

dependencies = [
    # --- CVC's unified agent runtime (v3.0 rewrite) ---
    # Every dep here is required at install time — the runtime is one
    # integrated system, not a kit of optional extras. If a user
    # installs CVC, they get the full chat loop, every provider
    # adapter, every platform integration, and every tool.
    "fastapi>=0.115.0",                # HTTP server
    "uvicorn[standard]>=0.30.0",       # ASGI runner
    "python-multipart>=0.0.9",         # form parsing
    "httpx[http2]>=0.27.0",            # async HTTP client
    "pydantic>=2.9.0",                 # structured config
    "openai>=1.50.0",                  # OpenAI / OpenAI-compatible API client
    "click>=8.1.0",                    # CLI framework
    "rich>=13.0.0",                    # terminal rendering
    "zstandard>=0.23.0",               # compression
    "aiosqlite>=0.20.0",               # async SQLite
    "GitPython>=3.1.0",                # git ops
    "langgraph>=0.2.0",                # graph runtime
    "langchain-core>=0.3.0",
    "prompt_toolkit>=3.0.0",           # interactive prompts
    "chromadb>=1.0.0",                 # vector store
    "Pillow>=10.0.0",                  # image handling
    "aiogram>=3.26.0",                 # Telegram adapter
    "python-dotenv>=1.0.0",            # .env loader
    "requests>=2.31.0",                # sync HTTP
    "PyYAML>=6.0",
    "cryptography>=42.0.0",            # crypto primitives
    "websockets>=12.0",                # WebSocket
    # --- v3.0 unified runtime core deps ---
    "croniter>=2.0.0",                 # scheduled task scheduler
    "psutil>=5.9.0",                   # cross-platform process introspection
    "tenacity>=8.2.0",                 # retry helpers
    "Markdown>=3.5.0",                 # markdown→HTML for rich message delivery
    "ruamel.yaml>=0.18.0",             # round-trippable YAML
    "pathspec>=0.12.0",                # .gitignore-style matching
    # --- v3.0 platform integrations (every channel ships in the box) ---
    "python-telegram-bot[webhooks]>=22.0",   # Telegram bot API
    "discord.py[voice]>=2.4.0",              # Discord
    "slack-bolt>=1.18.0",                    # Slack
    "slack-sdk>=3.21.0",                     # Slack SDK
    "qrcode>=7.4.2",                         # pairing-code QR generation
    "brotlicffi>=1.1.0",                     # compressed content encoding
    # --- v3.0 capability deps (formerly optional, now baseline) ---
    "playwright>=1.40.0",                   # browser_* tools
    "edge-tts>=6.1.0",                      # text-to-speech
    "faster-whisper>=1.0.0",                # local offline STT
    "anthropic>=0.39.0",                    # Anthropic provider
    "google-genai>=1.0.0",                  # Google provider
    "concurrent-log-handler>=0.9.20; sys_platform=='win32'",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.39.0"]
openai = ["openai>=1.50.0"]
google = ["google-genai>=1.0.0"]
vertex = ["google-auth>=2.0.0"]
ollama = []  # No extra deps Ollama uses httpx (already a core dep)
pageindex = ["pymupdf>=1.25.0"]  # PDF support for Tier 4 PageIndex

# Vendored tool capability extras  each unlocks a tool family
browser = ["playwright>=1.40.0"]                  # browser_* tools (10)
computer-use = ["pyobjc-framework-Quartz; sys_platform=='darwin'"]  # computer_use (macOS)
vision = ["Pillow>=10.0.0"]                       # vision_analyze, video_analyze
tts = ["edge-tts>=6.1.0"]                         # text_to_speech
voice = ["faster-whisper>=1.0.0"]                 # Local offline STT (no API key)

all = ["tm-ai[anthropic,openai,google,vertex,browser,vision,tts,voice]"]
sdk = []  # SDK has no extra deps uses core CVC (pydantic, sqlite, zstandard)
dev = ["pytest>=8.0", "pytest-asyncio>=0.24.0", "ruff>=0.7.0"]

[project.scripts]
cvc = "cvc.cli:main"

[project.urls]
Homepage = "https://jaimeena.com/cvc"
Documentation = "https://jaimeena.com/cvc/docs"
Repository = "https://github.com/mannuking/cvc"
Issues = "https://github.com/mannuking/cvc/issues"
Changelog = "https://github.com/mannuking/cvc/blob/main/docs/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["cvc"]
# Wheel excludes — the install footprint is what users download and unpack
# on their machine. Keep it tight. (The sdist already has its own exclude
# list — these are wheel-specific additions.)
exclude = [
    # Python build artefacts
    "/cvc/**/__pycache__/",
    "**/*.pyc",
    "**/*.pyd",
    "**/*.so",
    # npm artefacts (cvc/web/node_modules — devs only, never runtime)
    "/cvc/web/node_modules/",
    "/cvc/agent/_vendor/**/node_modules/",
    # Vendored tests — CVC doesn't ship or run the upstream runtime's tests
    "/cvc/agent/_vendor/**/tests/",
    "/cvc/agent/_vendor/**/test/",
    # Media — these are vendored-tree wallpaper/sample assets, not used at runtime
    "**/*.jpg",
    "**/*.jpeg",
    "**/*.png",
    "**/*.gif",
    "**/*.webp",
    "**/*.mp4",
    "**/*.mov",
    "**/*.mp3",
    "**/*.wav",
    # Source maps and editor cruft
    "**/*.map",
    "**/*.tsbuildinfo",
    "**/.DS_Store",
    # Lock files for tooling that doesn't run from the installed wheel
    "/cvc/web/package-lock.json",
    "/cvc/web/yarn.lock",
    "/cvc/web/pnpm-lock.yaml",
    # Docs and dev artefacts inside the vendored tree
    "/cvc/agent/_vendor/**/CHANGELOG*",
    "/cvc/agent/_vendor/**/README*",
    "/cvc/agent/_vendor/**/LICENSE*",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "/_openclaw_ref/",
    "/_claude_code_ref/",
    "/_context_hub_ref/",
    "/_pageindex_ref/",
    "/cvc-node/",
    "/images/",
    "/style/",
    "/views/",
    "/js/",
    "/docs/website/",
    "/uv.lock",
    "/tests/",
    "/.github/",
    "*.gif",
    "*.png",
    "*.jpg",
    "*.mp4",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]


[tool.hatch.build.targets.wheel.force-include]
"cvc/web_dist" = "cvc/web_dist"

[tool.hatch.build.targets.sdist.force-include]
"cvc/web_dist" = "cvc/web_dist"
