[build-system]
requires = ["uv_build>=0.9.4,<1.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
markers = ["""slow: marks tests as slow (deselect with '-m "not slow"')"""]

[tool.cruft]
skip = [
    "**/__init__.py",
    "tests/*",
]

[tool.mypy]
plugins = ["pydantic.mypy"]

[tool.doc8]
max-line-length = 120
ignore = ["D001"]

[tool.coverage.run]
branch = true
source = ["bioregistry"]
omit = [
    "tests/*",
    "docs/*",
    "src/bioregistry/cli.py",
    "src/bioregistry/__main__.py",
    "src/bioregistry/curation/*.py",
]

[tool.coverage.paths]
source = [
    "src/bioregistry",
    ".tox/*/lib/python*/site-packages/bioregistry",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
    "if TYPE_CHECKING:",
    "def __str__",
    "def __repr__",
]

[tool.ruff]
line-length = 100
extend-include = ["*.ipynb"]

[tool.ruff.lint]
extend-select = [
    "F",
    "E",
    "W",
    "C90",
    "I",
    "UP",
    "D",
    "DOC",
    "B",
    "S",
    "T20",
    "N",
    "ERA",
    "NPY",
    "RUF",
    "C4",
]
ignore = [
    "D105",
    "ERA001",
    "E501",
    "C901",
    "S704",
    "S314",
    "DTZ",
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
"src/bioregistry/version.py" = [
    "S603",
    "S607",
]
"docs/source/conf.py" = ["ERA001"]
"notebooks/**/*.ipynb" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
relative-imports-order = "closest-to-furthest"
known-third-party = ["tqdm"]
known-first-party = [
    "bioregistry",
    "tests",
]

[tool.ruff.format]
docstring-code-format = true

[tool.bumpversion]
current_version = "0.14.1"
parse = '(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)(?:-(?P<release>[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+(?P<build>[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?'
serialize = [
    "{major}.{minor}.{patch}-{release}+{build}",
    "{major}.{minor}.{patch}+{build}",
    "{major}.{minor}.{patch}-{release}",
    "{major}.{minor}.{patch}",
]
commit = true
tag = false

[tool.bumpversion.parts.release]
optional_value = "production"
first_value = "dev"
values = [
    "dev",
    "production",
]

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "docs/source/conf.py"
search = 'release = "{current_version}"'
replace = 'release = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/bioregistry/version.py"
search = 'VERSION = "{current_version}"'
replace = 'VERSION = "{new_version}"'

[project]
name = "bioregistry"
version = "0.14.1"
description = "Integrated registry of biological databases and nomenclatures"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Framework :: Pytest",
    "Framework :: tox",
    "Framework :: Sphinx",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]
keywords = [
    "snekpack",
    "cookiecutter",
    "databases",
    "biological databases",
    "biomedical databases",
    "persistent identifiers",
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "requests",
    "tqdm",
    "pystow>=0.9.0",
    "click",
    "more-click>=0.1.2",
    "pydantic[email]>=2.0",
    "curies>=0.15.0",
    "sssom-pydantic>=0.5.10",
    "urllib3>=2.7.0",
    "python-multipart>=0.0.27",
    "idna>=3.15",
]

[[project.authors]]
name = "Charles Tapley Hoyt"
email = "cthoyt@gmail.com"

[[project.maintainers]]
name = "Charles Tapley Hoyt"
email = "cthoyt@gmail.com"

[project.optional-dependencies]
docs = [
    "sphinx>=8",
    "sphinx-rtd-theme>=3.0",
    "sphinx-click",
    "sphinx-automodapi",
    "autodoc-pydantic",
]
gha = ["more-itertools"]
align = [
    "pyyaml",
    "beautifulsoup4",
    "tabulate",
    "defusedxml",
    "class-resolver",
    "fairsharing-client>=0.3.1",
    "pandas<3.0",
    "wikidata-client",
    "ontoportal-client>=0.0.9",
    "lxml",
]
export = [
    "pyyaml",
    "rdflib",
    "rdflib-jsonld",
    "ndex2",
]
charts = [
    "matplotlib",
    "matplotlib-venn",
    "seaborn",
    "pandas<3.0",
    "jinja2",
]
health = [
    "click-default-group",
    "pandas<3.0",
    "tabulate",
    "pyyaml",
    "jinja2",
]
web = [
    "pyyaml",
    "rdflib",
    "rdflib-jsonld",
    "rdflib-endpoint>=0.5.3",
    "flask>=3.0.0",
    "werkzeug>=3.0.0",
    "fastapi",
    "starlette>=1.0.1",
    "uvicorn",
    "bootstrap-flask",
    "markdown",
    "curies[fastapi]",
    "a2wsgi",
    "api-analytics[fastapi]",
]
paper-ranking = [
    "pandas<3.0",
    "scikit-learn",
    "tabulate",
    "pubmed-downloader>=0.0.12",
]
mapping-checking = [
    "pandas<3.0",
    "sentence-transformers",
]

[project.urls]
"Bug Tracker" = "https://github.com/biopragmatics/bioregistry/issues"
Homepage = "https://github.com/biopragmatics/bioregistry"
Repository = "https://github.com/biopragmatics/bioregistry.git"
Documentation = "https://bioregistry.readthedocs.io"

[project.scripts]
bioregistry = "bioregistry.cli:main"

[dependency-groups]
tests = [
    "pytest",
    "coverage",
    "more-itertools",
    "httpx2",
    "scikit-learn",
]
typing = [
    "mypy",
    "types-PyYAML",
    "types-Markdown",
    "types-tabulate",
    "types-requests",
    "types-python-dateutil",
    "types-Flask",
    "types-WTForms",
    "types-tqdm",
    "types-beautifulsoup4",
    "types-Markdown",
    "matplotlib-stubs",
    "pandas-stubs",
    "fastapi[all]",
    "pyobo>=0.13.4",
    "ror-downloader",
    "pandas",
    "manubot",
]
dev = [
    { include-group = "tests" },
    { include-group = "typing" },
    "pydantic",
]
