[project]
name = "pybiolib"
version = "1.4.551"
description = "BioLib Python Client"
readme = "PYPI_README.md"
license = "MIT"
keywords = ["biolib"]
authors = [
    { name = "biolib", email = "hello@biolib.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.6.3"
dependencies = [
    "importlib-metadata>=1.6.1; python_version < '3.8'",
    "typing-extensions>=4.1.0; python_version < '3.8'",
]

[project.urls]
Homepage = "https://github.com/biolib"

[project.scripts]
biolib = "biolib:call_cli"

[project.optional-dependencies]
sdk = []

[dependency-groups]
dev = [
    "jupyter==1.0.0; python_version >= '3.10'",
    "mypy==2.3.0; python_version >= '3.10'",
    "pandas==2.2.1; python_version >= '3.10'",
    "pylint==4.0.6; python_version >= '3.10'",
    "ruff==0.15.22; python_version >= '3.10'",
    "pytest==8.0.2; python_version >= '3.10'",
    "pytest-timeout==2.2.0; python_version >= '3.10'",
    "setuptools==69.1.1; python_version >= '3.10'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["biolib"]

[tool.hatch.build.targets.sdist]
include = [
    "biolib",
    "PYPI_README.md",
    "LICENSE",
]
