[tool.poetry]
name = "bitfab-py"
version = "0.74.1"
description = "Bitfab client for provider-based API calls with local BAML execution"
authors = ["Harvest Team"]
readme = "README.md"
packages = [{include = "bitfab"}]

[tool.poetry.dependencies]
python = ">=3.10"
requests = "^2.32.3"
opentelemetry-sdk = "^1.45.1"
baml-py = { version = "^0.226.2", optional = true }
pydantic = "^2.0.0"
jsonpickle = "^4.0.0"
typing-extensions = ">=4.0"
openai-agents = { version = ">=0.6.3", optional = true }
langchain-core = { version = ">=0.3.0", optional = true, python = ">=3.10,<4.0" }
langgraph = { version = ">=1.1.0,<2.0.0", optional = true, python = ">=3.10,<4.0" }
claude-agent-sdk = { version = ">=0.1.0", optional = true, python = ">=3.10" }
typesafe-sdk = { version = "^0.7.5", optional = true }
deepagents = { version = ">=0.7.29", optional = true, python = ">=3.11,<4.0" }
tomli = { version = "^2.0.1", python = "<3.11" }

[tool.poetry.extras]
baml = ["baml-py"]
openai-tracing = ["openai-agents"]
langgraph = ["langchain-core", "langgraph"]
claude-agent-sdk = ["claude-agent-sdk"]
jev = ["typesafe-sdk"]
deepagents = ["deepagents", "langchain-core", "langgraph"]

[tool.poetry.scripts]
dev = "dev:main"
bitfab-replay = "bitfab.replay_cli:main"
bitfab-seed = "bitfab.seed_cli:main"

[tool.poetry.group.dev.dependencies]
baml-py = "^0.226.2"
typesafe-sdk = "^0.7.5"
twine = ">=7.0.0,<8.0.0"
pytest = ">=9.1.1,<10.0.0"
pytest-cov = ">=7.1.0,<8.0.0"
pytest-mock = ">=3.17.0,<4.0.0"
openai-agents = { version = "^0.24.0", python = ">=3.10" }
langchain-core = { version = ">=0.3.0", python = ">=3.10,<4.0" }
langgraph = { version = ">=1.1.0,<2.0.0", python = ">=3.10,<4.0" }
bump-my-version = "^1.6.3"
typer = "^0.27.3"
ruff = ">=0.17.2,<1.0.0"
deepagents = {version = ">=0.7.30", python = ">=3.11,<4.0"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "UP007"]

[tool.ruff.lint.isort]
known-first-party = ["bitfab"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "perf: timing-sensitive; deselect with -m 'not perf'",
]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=bitfab",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-report=html",
]

[tool.bumpversion]
current_version = "0.8.0"
commit = true
tag = true
tag_name = "bitfab-python-sdk-v{new_version}"
message = "Bump version: {current_version} → {new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
