[project]
name = "kugelaudio"
version = "1.4.2"
description = "Official Python SDK for KugelAudio TTS API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "KugelAudio", email = "hello@kugelaudio.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
keywords = ["tts", "text-to-speech", "audio", "streaming", "websocket"]

dependencies = [
    "httpx>=0.24.0",
    "websockets>=11.0",
]

[project.optional-dependencies]
livekit = [
    "livekit-agents>=1.0.0",
    "aiohttp>=3.8.0",
]
pipecat = [
    # 1.x is required for the per-turn AudioContext API (run_tts(text, context_id)
    # + on_turn_context_created / on_audio_context_completed) that the wrapper
    # uses to close each turn's server-side context (KUG-1087). Verified against
    # 1.3.0; the pre-1.0 0.0.x line has a different, leak-prone TTS surface.
    "pipecat-ai>=1.3.0; python_version >= '3.11'",
    "aiohttp>=3.8.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
tools = [
    "flask>=3.0.0",
    "soundfile>=0.12.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://kugelaudio.com"
Documentation = "https://docs.kugelaudio.com"
Repository = "https://github.com/Kugelaudio/KugelAudio"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kugelaudio"]

[tool.hatch.build.targets.sdist]
include = [
    "kugelaudio/",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

