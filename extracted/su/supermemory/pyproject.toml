[project]
name = "supermemory"
version = "5.0.1"
description = "The official Python library for the Supermemory API"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Supermemory", email = "dhravya@supermemory.com" }]
requires-python = ">= 3.10"
dependencies = [
  "httpx>=0.21.2",
  "pydantic>=1.9.2",
  "pydantic-core>=2.18.2",
  "typing_extensions>=4.0.0",
]
classifiers = [
  "Typing :: Typed",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "License :: OSI Approved :: Apache Software License",
]

[project.urls]
Homepage = "https://supermemory.ai"
Documentation = "https://docs.supermemory.ai"
Repository = "https://github.com/supermemoryai/python-sdk"

[project.optional-dependencies]
aiohttp = ["httpx-aiohttp>=0.1.8"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "mypy>=1.13", "ruff==0.16.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supermemory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
# Generated code; checked for import-level and signature consistency only.
files = ["src/supermemory", "tests", "scripts", "examples"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py310"
# Generated; the hand-written parts live in custom/ and are linted there.
extend-exclude = ["src/supermemory"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Appended to the generated __init__.py, where __all__ is already defined.
"custom/__init__.tail.py" = ["F403", "F405"]

