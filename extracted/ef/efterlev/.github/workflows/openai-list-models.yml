name: openai-list-models

# Maintainer-internal diagnostic: lists every model ID the configured
# OPENAI_API_KEY can actually call. Useful when a model that appears
# enabled in the OpenAI dashboard returns 403/404 model_not_found at
# the API layer (e.g., per-project model access mismatches between
# the dashboard and the key's scope).
#
# workflow_dispatch only — never runs on PR/push.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list-models:
    name: List OpenAI models accessible to OPENAI_API_KEY
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies (need [openai] for the SDK)
        run: uv sync --extra openai

      - name: List models, filter for gpt-5*
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          uv run python -c "
          from openai import OpenAI
          c = OpenAI()
          models = list(c.models.list())
          gpt5 = sorted(m.id for m in models if m.id.startswith('gpt-5'))
          print(f'total models: {len(models)}')
          print(f'gpt-5* models accessible:')
          for mid in gpt5:
              print(f'  {mid}')
          print()
          print(f'all model ids ({len(models)}):')
          for m in sorted(models, key=lambda m: m.id):
              print(f'  {m.id}')
          "
