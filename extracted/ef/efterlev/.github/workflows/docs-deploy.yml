# Docs site build + deploy.
#
# - On every PR: builds the site with strict mode (broken links fail the build).
# - On push to main: builds + deploys to GitHub Pages at efterlev.com.
#
# See SPEC-38.1 for the design.

name: docs

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs-deploy.yml'
      - 'pyproject.toml'
      - 'install.sh'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs-deploy.yml'
      - 'install.sh'
  # Manual trigger — used at public-flip time. A visibility change is
  # a settings event, not a push, so without workflow_dispatch the
  # first post-flip deploy would require a no-op commit. See the
  # launch runbook (`docs/launch/runbook.md`) hour-0 step.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: '3.12'
      - name: Install docs deps
        run: uv sync --extra docs
      - name: Build with strict mode
        # --strict turns broken links into build failures, which is what
        # we want as a PR gate.
        run: uv run mkdocs build --strict --site-dir _site
      - name: Stage the install bootstrap at the site root
        # Serves the repo-root install.sh at https://docs.efterlev.org/install.sh
        # so the one-liner `curl -LsSf https://docs.efterlev.org/install.sh | sh`
        # works. Canonical source stays at the repo root; copied into the Pages
        # artifact at build time (single source of truth, no drift).
        run: cp install.sh _site/install.sh
      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
