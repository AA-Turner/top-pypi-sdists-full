name: Efterlev compliance scan

# Triggers on any PR — the `paths` filter below skips the expensive steps when
# the PR doesn't touch Terraform. The workflow itself still starts so required-
# status-check configurations see it.
on:
  pull_request:
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      - '.efterlev/manifests/**'
      - '.github/workflows/pr-compliance-scan.yml'
  # Allow manual runs against any branch (useful for one-off scans of non-PR work).
  workflow_dispatch:
    inputs:
      scan_target:
        description: "Directory (relative to repo root) containing .tf files to scan."
        required: false
        default: "."

# One run per PR — cancel in-flight runs when a new commit arrives so we don't
# waste CI minutes on superseded code.
concurrency:
  group: efterlev-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan + Gap Agent (if API key available)
    runs-on: ubuntu-latest
    # Generous timeout: scan is fast, but Gap Agent calls Anthropic with
    # max_tokens=32768 (post-v0.1.47 cap lift; was 20480 prior, was
    # 16384 before that). Gap Agent now uses ~7min wall time on a
    # 60-KSI baseline. The 10min job timeout left ~1min margin and
    # was reliably tripping after v0.1.47 — bump to 15min for headroom.
    timeout-minutes: 15
    permissions:
      # Required for `gh pr comment` to post the summary back.
      pull-requests: write
      # Checkout is a read — default contents:read is enough.
      contents: read

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v6
        with:
          # Manifest support: Evidence manifests under .efterlev/manifests/
          # live alongside the Terraform and contribute procedural evidence
          # to the scan. We fetch the full file tree so they're visible.
          # ConMon Lite v0 (DECISIONS PR #237 / Tier 4 #1): fetch-depth: 0
          # so we can `git worktree add` the base branch into a sibling
          # directory for PR-delta scanning.
          fetch-depth: 0

      - name: Set up uv + Python 3.12
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Efterlev
        run: |
          # Install Efterlev from the same SHA the Action source repo is
          # pinned to. When this workflow is copied into a consumer repo,
          # swap this line for `pipx install efterlev` (post-PyPI release)
          # or `pip install "git+https://github.com/efterlev/efterlev.git@main"`.
          uv sync --extra dev

      - name: Determine scan target
        id: target
        run: |
          # Default target is the repo root (scans every .tf file the
          # parser finds, recursively). Manual-dispatch input overrides.
          TARGET="${{ inputs.scan_target || '.' }}"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Scanning target: $TARGET"

      - name: Initialize Efterlev workspace
        run: |
          uv run efterlev init \
            --target "${{ steps.target.outputs.target }}" \
            --baseline fedramp-20x-moderate \
            --force

      - name: Run deterministic scan
        run: |
          uv run efterlev scan --target "${{ steps.target.outputs.target }}"

      - name: Scan base branch (ConMon Lite v0)
        # ConMon Lite v0 (DECISIONS 2026-05-11 PR #237 / Tier 4 #1):
        # check out the base branch into a sibling worktree, init +
        # scan it, so the next step can compute a per-detector
        # gap-emission delta. Soft-fail at the workflow level: any
        # error here is captured as a warning so the PR-branch scan +
        # comment posting still completes.
        if: github.event_name == 'pull_request'
        id: base_scan
        run: |
          set +e
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          BASE_DIR="/tmp/efterlev-conmon-base"
          git worktree add --detach "$BASE_DIR" "$BASE_SHA" || {
            echo "::warning::Failed to add base-branch worktree at $BASE_SHA; skipping ConMon Lite delta."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          (
            cd "$BASE_DIR"
            uv run efterlev init --target . --baseline fedramp-20x-moderate --force
            uv run efterlev scan --target .
          ) || {
            echo "::warning::Base-branch scan failed; skipping ConMon Lite delta."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          # Capture both sidecar paths for the next step.
          BASE_SIDECAR=$(ls -t "$BASE_DIR/.efterlev/reports/scan-"*.json 2>/dev/null | head -1)
          PR_SIDECAR=$(ls -t "${{ steps.target.outputs.target }}/.efterlev/reports/scan-"*.json 2>/dev/null | head -1)
          if [ -z "$BASE_SIDECAR" ] || [ -z "$PR_SIDECAR" ]; then
            echo "::warning::ConMon Lite sidecars missing (base=$BASE_SIDECAR pr=$PR_SIDECAR); skipping delta."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          echo "base_sidecar=$BASE_SIDECAR" >> "$GITHUB_OUTPUT"
          echo "pr_sidecar=$PR_SIDECAR" >> "$GITHUB_OUTPUT"

      - name: Compute ConMon Lite PR-delta
        # Per DECISIONS Decision #5, soft-fail: scan-diff exits 2 on
        # regressions, which IS the signal we want. The comment posting
        # below is the actual surface; this step's exit code is
        # informational only.
        if: github.event_name == 'pull_request' && steps.base_scan.outputs.skipped != 'true'
        id: conmon_delta
        run: |
          uv run efterlev scan-diff \
            "${{ steps.base_scan.outputs.base_sidecar }}" \
            "${{ steps.base_scan.outputs.pr_sidecar }}" \
            --base-branch "${{ github.base_ref }}" \
            --print-markdown \
            > /tmp/efterlev-conmon-delta-full.txt || true
          # The CLI prints stats + paths to stdout BEFORE the markdown.
          # Extract from the "### Efterlev posture delta" header onward
          # to keep the PR comment clean. If the marker isn't present
          # (older code path or malformed run), fall back to the full
          # captured stdout so we always post something useful.
          if grep -q '^### Efterlev posture delta' /tmp/efterlev-conmon-delta-full.txt; then
            sed -n '/^### Efterlev posture delta/,$p' /tmp/efterlev-conmon-delta-full.txt \
              > /tmp/efterlev-conmon-delta.md
          else
            cp /tmp/efterlev-conmon-delta-full.txt /tmp/efterlev-conmon-delta.md
          fi
          echo "comment_path=/tmp/efterlev-conmon-delta.md" >> "$GITHUB_OUTPUT"

      - name: Post / update ConMon Lite delta PR comment
        # Distinct sticky-comment marker from the existing posture
        # comment so the two coexist on the same PR. Edit-in-place
        # logic mirrors the existing comment poster but matches on
        # the `<!-- efterlev-conmon-lite -->` marker the markdown
        # renderer emits.
        if: github.event_name == 'pull_request' && steps.base_scan.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMENT_BODY=$(cat /tmp/efterlev-conmon-delta.md)
          EXISTING_ID=$(
            gh api \
              "/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
              --jq '[.[] | select(.body | contains("<!-- efterlev-conmon-lite -->"))][0].id'
          )
          if [ -n "$EXISTING_ID" ] && [ "$EXISTING_ID" != "null" ]; then
            echo "Updating existing ConMon Lite comment $EXISTING_ID"
            gh api --method PATCH \
              "/repos/${{ github.repository }}/issues/comments/$EXISTING_ID" \
              -f body="$COMMENT_BODY"
          else
            echo "Creating new ConMon Lite PR comment"
            gh pr comment "${{ github.event.pull_request.number }}" \
              --body "$COMMENT_BODY"
          fi

      - name: Run Gap Agent (if ANTHROPIC_API_KEY is available)
        # Gap Agent is gated on the secret being present. Consumer repos
        # that don't want LLM-backed classification leave the secret
        # unset; the workflow still produces a scanner-only summary.
        # ConMon Lite v1 (DECISIONS PR #241): when EFTERLEV_CONMON_LITE_V1
        # is "true", the PR-branch Gap Agent runs with --runs 3 (2-of-3
        # majority voting) so the v1 KSI-verdict diff has a stable input.
        # Default --runs 1 preserves single-run behavior.
        if: env.ANTHROPIC_API_KEY != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EFTERLEV_CONMON_LITE_V1: ${{ vars.EFTERLEV_CONMON_LITE_V1 }}
        run: |
          if [ "$EFTERLEV_CONMON_LITE_V1" = "true" ]; then
            RUNS_FLAG="--runs 3"
          else
            RUNS_FLAG=""
          fi
          uv run efterlev agent gap --target "${{ steps.target.outputs.target }}" $RUNS_FLAG || {
            echo "::warning::Gap Agent failed; continuing with scanner-only summary."
            exit 0
          }

      - name: Run Gap Agent on base branch (ConMon Lite v1)
        # ConMon Lite v1 (DECISIONS PR #241): opt-in via the
        # EFTERLEV_CONMON_LITE_V1 repo variable. Per-PR cost ~$0.90 on
        # Sonnet 4.6 (3 runs x 2 branches x ~$0.15/run); much lower on
        # Bedrock. Default OFF -- consumer repos opt in when the cost is
        # justified by the value of KSI-verdict regression detection.
        # Reuses the /tmp/efterlev-conmon-base worktree the v0 step
        # already set up.
        if: |
          github.event_name == 'pull_request'
          && env.ANTHROPIC_API_KEY != ''
          && vars.EFTERLEV_CONMON_LITE_V1 == 'true'
          && steps.base_scan.outputs.skipped != 'true'
        id: base_gap
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          BASE_DIR="/tmp/efterlev-conmon-base"
          (cd "$BASE_DIR" && uv run efterlev agent gap --target . --runs 3) || {
            echo "::warning::Base-branch Gap Agent failed; skipping ConMon Lite v1 KSI-verdict diff."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          BASE_GAP=$(ls -t "$BASE_DIR/.efterlev/reports/gap-"*.json 2>/dev/null | head -1)
          PR_GAP=$(ls -t "${{ steps.target.outputs.target }}/.efterlev/reports/gap-"*.json 2>/dev/null | head -1)
          if [ -z "$BASE_GAP" ] || [ -z "$PR_GAP" ]; then
            echo "::warning::ConMon Lite v1 gap-report sidecars missing (base=$BASE_GAP pr=$PR_GAP); skipping KSI-verdict diff."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          echo "base_gap=$BASE_GAP" >> "$GITHUB_OUTPUT"
          echo "pr_gap=$PR_GAP" >> "$GITHUB_OUTPUT"

      - name: Compute ConMon Lite v1 KSI-verdict diff
        # Soft-fail per Decision #5 carry-forward: report diff exits 2 on
        # regressions, which IS the signal we want to surface. The comment
        # IS the signal; the step's exit code is informational.
        if: |
          github.event_name == 'pull_request'
          && env.ANTHROPIC_API_KEY != ''
          && vars.EFTERLEV_CONMON_LITE_V1 == 'true'
          && steps.base_gap.outputs.skipped != 'true'
        id: conmon_v1_delta
        run: |
          uv run efterlev report diff \
            "${{ steps.base_gap.outputs.base_gap }}" \
            "${{ steps.base_gap.outputs.pr_gap }}" \
            --base-branch "${{ github.base_ref }}" \
            --print-markdown \
            > /tmp/efterlev-conmon-v1-full.txt || true
          # Extract from the v1 header onward to keep the PR comment clean.
          if grep -q '^### Efterlev KSI-verdict delta' /tmp/efterlev-conmon-v1-full.txt; then
            sed -n '/^### Efterlev KSI-verdict delta/,$p' /tmp/efterlev-conmon-v1-full.txt \
              > /tmp/efterlev-conmon-v1.md
          else
            cp /tmp/efterlev-conmon-v1-full.txt /tmp/efterlev-conmon-v1.md
          fi

      - name: Post / update ConMon Lite v1 PR comment
        # Distinct sticky-comment marker `<!-- efterlev-conmon-lite-v1 -->`
        # from the v0 marker so v0 and v1 comments coexist on the same PR.
        # Edit-in-place mirrors the v0 poster.
        if: |
          github.event_name == 'pull_request'
          && env.ANTHROPIC_API_KEY != ''
          && vars.EFTERLEV_CONMON_LITE_V1 == 'true'
          && steps.base_gap.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMENT_BODY=$(cat /tmp/efterlev-conmon-v1.md)
          EXISTING_ID=$(
            gh api \
              "/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
              --jq '[.[] | select(.body | contains("<!-- efterlev-conmon-lite-v1 -->"))][0].id'
          )
          if [ -n "$EXISTING_ID" ] && [ "$EXISTING_ID" != "null" ]; then
            echo "Updating existing ConMon Lite v1 comment $EXISTING_ID"
            gh api --method PATCH \
              "/repos/${{ github.repository }}/issues/comments/$EXISTING_ID" \
              -f body="$COMMENT_BODY"
          else
            echo "Creating new ConMon Lite v1 PR comment"
            gh pr comment "${{ github.event.pull_request.number }}" \
              --body "$COMMENT_BODY"
          fi

      - name: Format PR comment
        id: summary
        run: |
          uv run python scripts/ci_pr_summary.py \
            --efterlev-dir "${{ steps.target.outputs.target }}/.efterlev" \
            --output /tmp/efterlev-pr-comment.md
          echo "comment_path=/tmp/efterlev-pr-comment.md" >> "$GITHUB_OUTPUT"

      - name: Post / update PR comment
        # Only run on PRs (workflow_dispatch won't have github.event.pull_request).
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # If a prior Efterlev comment exists on the PR, edit it in place.
          # Otherwise create a new one. Identification marker: the
          # `## 🧪 Efterlev compliance scan` header the summarizer emits.
          COMMENT_BODY=$(cat /tmp/efterlev-pr-comment.md)
          EXISTING_ID=$(
            gh api \
              "/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
              --jq '[.[] | select(.body | startswith("## 🧪 Efterlev compliance scan"))][0].id'
          )
          if [ -n "$EXISTING_ID" ] && [ "$EXISTING_ID" != "null" ]; then
            echo "Updating existing comment $EXISTING_ID"
            gh api --method PATCH \
              "/repos/${{ github.repository }}/issues/comments/$EXISTING_ID" \
              -f body="$COMMENT_BODY"
          else
            echo "Creating new PR comment"
            gh pr comment "${{ github.event.pull_request.number }}" \
              --body "$COMMENT_BODY"
          fi

      - name: Upload reports as artifact
        # Always upload — useful for workflow_dispatch runs that don't
        # post a PR comment.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: efterlev-reports-${{ github.run_id }}
          path: |
            ${{ steps.target.outputs.target }}/.efterlev/reports/
            /tmp/efterlev-pr-comment.md
          if-no-files-found: ignore
          retention-days: 14
