# Fresh-install scan smoke — the lane that catches dependency-resolution
# regressions the locked CI lanes cannot see.
#
# Every other CI lane runs against the pinned `uv.lock`. A real
# `pip`/`uv`/`pipx install efterlev` resolves the LATEST versions allowed by
# the pyproject constraints — a resolution no locked lane exercises. So a new
# breaking release of an allowed transitive (v0.1.215: python-hcl2 8.1.2 broke
# detector parsing; the bundled-fixture scan dropped from ~21 evidence records
# to ~1) is invisible to the whole test suite and stays green in CI while real
# installs break. See DECISIONS 2026-06-01.
#
# This lane installs efterlev with plain `pip` (NO lockfile) so dependency
# resolution mirrors a real user, then runs the keyless quickstart scan and
# asserts it fired a healthy detector/evidence count.
#
# Triggers:
#   - schedule (daily): catches a NEW breaking release of an allowed dep, which
#     arrives with no code change and so triggers nothing else. This is the one
#     that would have caught the python-hcl2 bug.
#   - pull_request touching dependency declarations: catches a constraint that's
#     widened to admit a breaking version.
#   - manual dispatch.

name: fresh-install-scan

on:
  schedule:
    - cron: "0 15 * * *" # daily, 15:00 UTC
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/fresh_install_scan_check.py"
      - ".github/workflows/fresh-install-scan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-install-scan:
    name: Fresh-install scan (unpinned deps)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install efterlev with pip (fresh resolution, NO lockfile)
        # Deliberately pip, not `uv sync` — pip resolves the latest versions the
        # pyproject constraints allow, exactly like a real user's install. Using
        # the lockfile here would defeat the entire purpose of this lane.
        run: |
          python -m venv .venv-fresh
          .venv-fresh/bin/pip install --upgrade pip
          .venv-fresh/bin/pip install .
          echo "--- resolved IaC-parsing deps ---"
          .venv-fresh/bin/python -c "import importlib.metadata as m; print('python-hcl2', m.version('python-hcl2'))"

      - name: Assert the fresh-install scan is healthy
        run: .venv-fresh/bin/python scripts/fresh_install_scan_check.py
