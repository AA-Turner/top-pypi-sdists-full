name: benchmark-dispatch

# v0.1.112 M2 — time-to-FRMR benchmark.
# Mirrors eval-harness-cfn.yml: workflow_dispatch only (costs real
# LLM spend), uploads result artifacts for inclusion in
# `docs/benchmark-2026-05.md`.
#
# Why workflow_dispatch only:
# - Each run costs real LLM spend. On Anthropic API: ~$0.30 on Haiku
#   4.5, ~$1-3 on Sonnet 4.6, ~$60+ on Opus 4.7 depending on fixture
#   size. On Bedrock: ~$0.50-2 on NVIDIA Nemotron Super 120B (50x
#   cheaper than Opus). On local LLM: free.
# - Not a regression gate; the e2e_smoke workflow gates per-PR.
# - Maintainer-deliberate measurement, run on a release-arc cadence
#   (post-major-feature ships) so the published numbers track the
#   feature-set the version reflects.

on:
  workflow_dispatch:
    inputs:
      fixture:
        description: "Fixture path (relative to repo root)"
        required: false
        default: "evals/fixtures/csp-starter-cfn"
        type: string
      backend:
        description: "LLM backend"
        required: false
        default: "anthropic"
        type: choice
        options:
          - anthropic
          - bedrock
      llm_model:
        description: "Model ID (matches the chosen backend)"
        required: false
        default: "claude-haiku-4-5"
        type: string
      region:
        description: "AWS region (required when backend=bedrock; e.g., us-east-1)"
        required: false
        default: "us-east-1"
        type: string
      runs:
        description: "Number of runs (latency is bimodal; 3+ recommended)"
        required: false
        default: "3"
        type: string

permissions:
  contents: read
  id-token: write  # for AWS OIDC if AWS_ROLE_TO_ASSUME is configured

jobs:
  benchmark:
    name: Benchmark (${{ inputs.backend }} ${{ inputs.llm_model }}, ${{ inputs.runs }} run(s))
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Configure AWS credentials (for backend=bedrock)
        if: inputs.backend == 'bedrock'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_BEDROCK_ROLE_ARN }}
          aws-region: ${{ inputs.region }}

      - name: Run benchmark harness
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # ${RUNNER_TEMP} is OUTSIDE the efterlev repo. The per-run
          # workspace is a fixture COPY, and `efterlev scan` hard-errors
          # when --target sits below a `.github/workflows/` ancestor
          # (the v0.1.x funnel-killer guard). The efterlev repo itself
          # has `.github/workflows/`, so any subdir under it triggers
          # the guard. Output goes to ${RUNNER_TEMP}/ to sidestep this.
          OUTPUT_ROOT: ${{ runner.temp }}/efterlev-benchmark-results
        run: |
          set -euo pipefail
          ARGS=(
            --fixture "${{ inputs.fixture }}"
            --model "${{ inputs.llm_model }}"
            --backend "${{ inputs.backend }}"
            --runs "${{ inputs.runs }}"
            --output "${OUTPUT_ROOT}"
          )
          if [ "${{ inputs.backend }}" = "bedrock" ]; then
            ARGS+=(--region "${{ inputs.region }}")
          fi
          uv run python scripts/benchmark.py "${ARGS[@]}"

      - name: Print summary on success
        if: success()
        env:
          OUTPUT_ROOT: ${{ runner.temp }}/efterlev-benchmark-results
        run: |
          set -euo pipefail
          latest=$(ls -td "${OUTPUT_ROOT}"/*/ 2>/dev/null | head -1)
          if [ -z "$latest" ]; then
            echo "no benchmark run directory found"
            exit 0
          fi
          echo "=== summary: $latest/summary.json ==="
          cat "$latest/summary.json"

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ inputs.backend }}-${{ inputs.llm_model }}-${{ github.run_id }}
          # actions/upload-artifact@v7 supports absolute paths.
          path: ${{ runner.temp }}/efterlev-benchmark-results
          retention-days: 90
          if-no-files-found: warn
