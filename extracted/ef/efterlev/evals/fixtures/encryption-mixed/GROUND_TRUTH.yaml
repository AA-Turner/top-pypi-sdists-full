# Ground-truth labels for the encryption-mixed eval fixture.
#
# Originally an S3-only fixture (6 buckets with deliberately mixed
# encryption + public-access-block posture). 2026-05-09 rev 3 extends
# with network-side and backup-orchestration resources, parallel to
# govnotes-v1 rev 4, so the network-side and backup-orchestration KSIs
# can attach real evidence instead of falling through to ELI.
#
# Designed to exercise:
#
#   M1/M2 (status): the variance is real — `partial` is the only
#     honest verdict on the bucket-level KSIs; over-class to
#     `implemented` should be caught by M1; under-class to
#     `not_implemented` should be caught by M2.
#
#   M3 (resource-naming): the bug shape from v0.1.8 F1 was that the
#     agent classified `partial` (correct) but NEVER NAMED individual
#     buckets in the rationale, leaving reviewers unable to tell
#     which buckets were non-compliant. M3's expected_rationale_resources
#     demands at least ONE of the named resources appears in each
#     affected KSI's rationale. Rev 3 extends naming expectations to
#     the new SG / NACL / backup resources.
#
# Phase 1 doesn't ship M5 (POAM scope) — that lands in PR gamma.

fixture_id: encryption-mixed
description: |
  S3-mixed-posture fixture extended with network-side resources and
  AWS Backup orchestration (rev 3, 2026-05-09). 6 S3 buckets with
  mixed SSE posture (2 KMS CMK / 2 AES256 / 2 unencrypted) and
  matching mixed PAB coverage (3 covered / 3 not). Plus 2 security
  groups (1 HTTPS-only + 1 SSH-to-internet), 2 NACLs (1 restrictive
  + 1 wide-open egress), and a full AWS Backup stack covering 2
  buckets. Designed to surface bucket-by-bucket variance the v0.1.8
  fixtures showed the agent dropping in rationales, AND to exercise
  the network-side / backup-orchestration detector path that the
  S3-only original couldn't reach.

authored_by: maintainer@efterlev.com
authored_at: 2026-05-09
revision: 3
frmr_version: 0.9.43-beta

# 2026-05-09 rev 3 (this rev): adding aws_security_group +
# aws_network_acl + aws_backup_plan/_vault/_selection drops the ELI
# alternation on KSI-CNA-MAT (now has SG/NACL evidence in addition
# to the existing S3 PAB), adds KSI-CNA-RNT (gets the new SG/NACL
# evidence), and adds KSI-RPL-ARP (gets the backup orchestration
# evidence). KSI-SVC-VRI and KSI-SVC-PRR keep the ELI alternation:
# their detector mappings target TLS surfaces (SVC-VRI: tls_on_lb_
# listeners) and pure-procedural controls (SVC-PRR: CA/CM-class)
# that this fixture intentionally doesn't exercise — adding TLS
# resources here would dilute the encryption-mixed identity.
expected_classifications:
  # CNA: rev 3 lifts CNA-MAT off the ELI alternation; CNA-RNT is new.
  KSI-CNA-MAT: partial|not_implemented   # mixed: SG/NACL gap + PAB gap
  KSI-CNA-RNT: partial|not_implemented   # mixed: SG/NACL restrictive vs open

  # SVC: rev 3 keeps the ELI alternation. SVC-VRI's mapping targets
  # TLS resources (none here); SVC-PRR is procedural.
  KSI-SVC-VRI: partial|evidence_layer_inapplicable
  KSI-SVC-PRR: partial|evidence_layer_inapplicable

  # AFR-UCM (added v0.1.42): KMS CMK + at-rest encryption use.
  # This is where S3 evidence actually attaches on this fixture.
  KSI-AFR-UCM: partial                    # 2 buckets use CMK; rest don't

  # RPL-ARP (rev 3): AWS Backup orchestration evidence.
  KSI-RPL-ARP: partial                    # backup plan + vault + selection

# M3: at least ONE of the named resources must appear in each affected
# KSI's rationale. Catches the v0.1.8 F1 "partial verdict but no
# resource names" gap.
#
# 2026-05-09 rev 3: adds entries for the new CNA-MAT (now has real
# evidence to name), CNA-RNT, and RPL-ARP. KSI-AFR-UCM stays as the
# canonical bucket-naming check (where partial-with-bucket-naming is
# the honest call).
expected_rationale_resources:
  KSI-AFR-UCM:
    - app_uploads          # CMK-backed positive case
    - audit_logs_archive   # CMK-backed positive case
    - quarterly_reports    # AES256-only (intermediate posture)
    - customer_uploads     # AES256-only (intermediate posture)
    - legacy_export        # unencrypted gap
    - temp_data_pipeline   # unencrypted gap
  KSI-CNA-MAT:
    - app_lb               # restrictive SG
    - bastion_open         # open SG (the SSH gap)
    - private_subnet       # restrictive NACL
    - public_subnet_open   # wide-open NACL (the egress gap)
    - app_uploads          # bucket WITH PAB (positive)
    - legacy_export        # bucket WITHOUT PAB (gap)
  KSI-CNA-RNT:
    - app_lb               # restrictive SG
    - bastion_open         # open SG
    - private_subnet       # restrictive NACL with explicit deny
    - public_subnet_open   # wide-open NACL
  KSI-RPL-ARP:
    - daily_with_dr        # the aws_backup_plan with cross-region copy
    - primary_vault        # the aws_backup_vault
    - backup               # generic term covering plan/vault/selection

# No manifest fixtures in this fixture; M4 has nothing to check here.
expected_manifest_quoting: {}

# POAM scope expectations (M5 lands in PR gamma; schema-accept now).
expected_poam:
  excluded_count_min: 0
  excluded_count_max: 6
  must_not_mention: []
