# Ground-truth labels for the serverless-mixed eval fixture (Phase 2).
#
# 5th eval-harness fixture. Originally authored 2026-05-09 to complete
# Tier 2 #1 (DECISIONS 2026-05-09). Rev 2 (2026-05-10) extended to
# exercise Tier 2 #2 (DECISIONS 2026-05-10). Rev 3 (2026-05-10)
# extends again per Tier 2 #3 (DECISIONS 2026-05-10) Decision #6 to
# exercise the three new detectors:
#   - aws.lambda_vpc_isolation       (vpc_config on Lambda)
#   - aws.api_gateway_auth_required  (per-route auth mode)
#   - aws.api_gateway_waf_attached   (Web ACL associations on stages)
#
# Rev 4 (2026-05-10) extends per Tier 3 #1 (DECISIONS 2026-05-10) to
# exercise the three new aws.waf_* family detectors:
#   - aws.waf_rule_count             (rule blocks present vs absent)
#   - aws.waf_managed_rule_groups    (managed_rule_group_statement)
#   - aws.waf_rate_limiting          (rate_based_statement)
# The existing api_protection Web ACL was extended with a managed-
# rule-group rule (CommonRuleSet) and a rate-based-statement rule
# (limit=2000, IP) -- positive emission for all three detectors.
# A second Web ACL legacy_unprotected_waf was added with no rules at
# all -- negative emission for all three. KSI-CNA-RVP posture is now
# evidenced across 3 stages (waf_attached) PLUS 2 Web ACLs (3 detectors
# x 2 ACLs = 6 emissions) -- still `partial`, with the gap-driver mix
# being the bare Web ACL plus the two unassociated stages.
#
# After rev 4, the fixture exercises ALL SEVEN Tier 2 detectors PLUS
# the three Tier 3 #1 WAF detectors -- closing the original 5-detector
# deferred backlog from PR #196 and the WAF posture-quality backlog.
#
# Rev 5 (2026-05-10) extends per Tier 3 #3 (DECISIONS 2026-05-10) to
# exercise the two new aws.waf_* family v1 detectors:
#   - aws.waf_action_types           (rule action enforcing vs count)
#   - aws.waf_ip_set_blocking        (ip_set_reference_statement)
# The api_protection Web ACL gained two new rules: a count-action
# managed-group rule (KnownBadInputsRuleSet override_action.count)
# and an IP-set blocking rule referencing a new aws_wafv2_ip_set
# resource (bad_actors_blocklist). The legacy_unprotected_waf bare
# ACL continues to exercise the negative path: ip_set_blocking_absent
# (the action_types detector emits vacuously enforcing on the empty
# rule set per its DECISIONS Decision #3 -- the rules-absent gap is
# already flagged by waf_rule_count, so this isn't a new gap).
#
# After rev 5, KSI-CNA-RVP posture is evidenced across 3 stages
# (waf_attached) PLUS 2 Web ACLs x 5 detectors = 10 emissions across
# the 5-detector WAF family.
#
# Rev 6 (2026-05-10) extends per Tier 3 #4 (DECISIONS 2026-05-10) to
# exercise the new aws.waf_geo_blocking detector.
#
# Rev 7 (2026-05-10) extends per Tier 3 #5 (DECISIONS 2026-05-10) to
# exercise the new aws.waf_custom_rule_groups detector -- the FINAL
# WAF dimension. The api_protection Web ACL gained one new rule with
# statement.rule_group_reference_statement pointing at a new
# top-level aws_wafv2_rule_group resource (api_specific_rules,
# capacity 10, with a synthetic byte-match rule blocking the
# deprecated /api/v1/ path -- realistic shape for workload-specific
# signatures the AWS-managed rule groups don't cover). The bare
# legacy_unprotected_waf continues to exercise the negative path
# AND -- crucially for the new detector -- now sees a non-empty
# defined_rule_groups inventory in its absent-state evidence, so
# the Gap Agent can flag the "defined but unreferenced from THIS
# Web ACL" anti-pattern explicitly.
#
# After rev 7, the fixture exercises ALL SEVEN WAF detectors --
# the WAF family is now COMPLETE in both detector library AND
# fixture coverage. All seven verified locally against rev 7:
#   - waf_rule_count: api_protection rules_present(6), legacy absent(0)
#   - waf_managed_rule_groups: api_protection present (Common +
#     KnownBadInputs), legacy absent
#   - waf_rate_limiting: api_protection present (limit=2000, IP),
#     legacy absent
#   - waf_action_types: api_protection mixed (5 enforcing + 1 count),
#     legacy enforcing-vacuous (0/0)
#   - waf_ip_set_blocking: api_protection present (bad_actors_blocklist),
#     legacy absent
#   - waf_geo_blocking: api_protection present (KP, IR, CU, SY),
#     legacy absent
#   - waf_custom_rule_groups: api_protection present
#     (api_specific_rules), legacy absent (with non-empty
#     defined_rule_groups inventory)
#
# Designed to exercise:
#
#   M1/M2 (status): mixed posture across every Tier 2 detector
#     surface. Honest verdicts: KSI-MLA-LET, KSI-SVC-SNT, KSI-AFR-UCM,
#     KSI-CNA-MAT, KSI-CNA-EIS, KSI-CNA-DFP, KSI-CNA-RVP all `partial`.
#
#   M3 (resource-naming): the agent should name the actual resources
#     (Lambda function names, custom-domain names, stage names, route
#     resource names, the Web ACL + association names, the KMS key)
#     when classifying.
#
# All 7 KSIs are existing FRMR catalog entries; the new detectors
# widen resource-type coverage rather than introducing new mappings.

fixture_id: serverless-mixed
description: |
  5th eval-harness fixture. Originally authored 2026-05-09; rev 3
  (2026-05-10) extended to exercise the full Tier 2 detector batch
  (#1 + #2 + #3 = 7 detectors); rev 4 (2026-05-10) extended to
  exercise the Tier 3 #1 WAF detector family (waf_rule_count,
  waf_managed_rule_groups, waf_rate_limiting); rev 5 (2026-05-10)
  extended to exercise the Tier 3 #3 WAF detector family v1
  (waf_action_types, waf_ip_set_blocking); rev 6 (2026-05-10)
  extended to exercise the Tier 3 #4 WAF detector (waf_geo_blocking);
  rev 7 (2026-05-10) extends to exercise the FINAL Tier 3 #5 WAF
  detector (waf_custom_rule_groups), closing the WAF family at 7 of
  7 v0/v1 dimensions in both detector library AND fixture coverage.
  2 Lambda functions (api_handler with log
  group + KMS env-vars + vpc_config; background_worker without
  any of those three). 3 API Gateway custom domains, 3 stages
  (one with WAF + access logs, one without either, one with logs
  but no WAF), 3 routes (IAM auth, NONE auth, JWT auth), 2 Web
  ACLs + 1 association (api_protection has 6 rules exercising
  all 7 WAF detectors -- managed group, rate-based, count-action,
  IP-set, geo-block, custom rule group; legacy_unprotected_waf
  is bare for negative emission), 1 IP set (bad_actors_blocklist),
  1 custom rule group (api_specific_rules), 1 KMS key, 2
  CloudWatch log groups. Mixed posture across every Tier 2 +
  Tier 3 #1 + #3 + #4 + #5 detector surface so M3 has signal at
  every KSI.

authored_by: maintainer@efterlev.com
authored_at: 2026-05-10
revision: 7
frmr_version: 0.9.43-beta

# Mixed posture across every detector surface -> `partial` is the
# honest verdict on every KSI the new detectors evidence.
expected_classifications:
  # KSI-MLA-LET (Logging Event Types). Lambda logging mixed PLUS
  # API Gateway stage access logging mixed. Strong cross-resource-
  # type coverage; honest verdict is `partial`.
  KSI-MLA-LET: partial

  # KSI-SVC-SNT (Securing Network Traffic). API Gateway TLS posture
  # mixed: 2 of 3 custom domains on TLS_1_2; 1 of 3 defaults to
  # TLS_1_0 (the legacy gap).
  KSI-SVC-SNT: partial

  # KSI-AFR-UCM (Using Cryptographic Modules). Lambda env-var KMS
  # posture mixed (api_handler with explicit kms_key_arn,
  # background_worker without). KMS key has rotation enabled
  # (positive via aws.kms_key_rotation).
  KSI-AFR-UCM: partial

  # KSI-CNA-MAT (Minimizing Attack Surface). Rev 3: Lambda VPC
  # isolation mixed (api_handler with vpc_config, background_worker
  # without). Joins the existing SG / NACL / S3-PAB evidence on
  # this KSI in govnotes-v1.
  KSI-CNA-MAT: partial

  # KSI-CNA-EIS (Enforcing Intended State). Rev 3: API Gateway route
  # auth mixed (get_users with AWS_IAM, post_orders with JWT, get_health
  # with NONE). First fixture to evidence this KSI; the
  # api_gateway_auth_required detector is the library's first source.
  KSI-CNA-EIS: partial

  # KSI-CNA-DFP (Defining Functionality and Privileges). Rev 3:
  # same per-route auth-mode evidence as CNA-EIS (the privilege
  # boundary at the API edge IS the auth declaration). First fixture
  # to evidence this KSI.
  KSI-CNA-DFP: partial

  # KSI-CNA-RVP (Reviewing Protections). Rev 3: WAF Web ACL
  # association on public_api_v1_prod_stage (positive); no association
  # on public_api_v1_staging_stage or public_api_v2_default_stage
  # (negative). Joins the existing aws.cna_dos_protection evidence
  # on this KSI in govnotes-v1.
  KSI-CNA-RVP: partial

# M3: at least ONE of the named resources must appear in each
# affected KSI's rationale. Catches "partial verdict but no named
# resource" -- the v0.1.8 F1 bug shape.
expected_rationale_resources:
  KSI-MLA-LET:
    - api_handler                     # the function with a log group
    - background_worker               # the function without (the gap)
    - api_handler_logs                # the explicit log group resource
    - public_api_v1_prod_stage        # APIGW v1 stage WITH access logs
    - public_api_v1_staging_stage     # APIGW v1 stage WITHOUT (the gap)
    - public_api_v2_default_stage     # APIGW v2 stage with access logs
    - api_access_logs                 # the stage log destination
  KSI-SVC-SNT:
    - public_api_v1                   # REST v1 explicit TLS_1_2
    - legacy_api_v1                   # REST v1 default TLS_1_0 (the gap)
    - public_api_v2                   # HTTP v2 explicit TLS_1_2
    - TLS                             # paraphrase form (rationales often abbreviate)
  KSI-AFR-UCM:
    - api_handler                     # the function WITH kms_key_arn
    - background_worker               # the function WITHOUT (the gap)
    - lambda_env_secrets              # the KMS key
    - KMS                             # generic term
  KSI-CNA-MAT:
    - api_handler                     # the function WITH vpc_config
    - background_worker               # the function WITHOUT (the gap)
    - vpc_config                      # the block name
    - VPC                             # paraphrase form
  KSI-CNA-EIS:
    - get_users                       # IAM-auth method (positive)
    - get_health                      # NONE-auth method (gap)
    - post_orders                     # JWT-auth route (positive)
    - AWS_IAM                         # auth-mode literal
    - NONE                            # the gap auth-mode literal
    - JWT                             # auth-mode literal
  KSI-CNA-DFP:
    - get_users
    - get_health
    - post_orders
    - AWS_IAM
    - NONE
    - JWT
  KSI-CNA-RVP:
    - public_api_v1_prod_stage        # the stage WITH WAF
    - public_api_v1_staging_stage     # stage WITHOUT (gap)
    - public_api_v2_default_stage     # v2 stage WITHOUT (gap)
    - api_protection                  # the protected Web ACL (5-WAF-dimension positive)
    - legacy_unprotected_waf          # rev 4: the bare Web ACL (multi-dimension negative)
    - protect_prod                    # the association
    - WAF                             # generic term
    - managed-common-rules            # rev 4: the managed-rule-group rule name
    - rate-limit-ip                   # rev 4: the rate-based rule name
    - AWSManagedRulesCommonRuleSet    # rev 4: the managed-group AWS-side identifier
    - rate                            # rev 4: paraphrase form (rate limit / rate-based)
    - managed                         # rev 4: paraphrase form (managed groups / managed rules)
    - managed-known-bad-inputs-in-count   # rev 5: count-action rule name
    - block-bad-actor-ips             # rev 5: ip_set_reference_statement rule name
    - bad_actors_blocklist            # rev 5: the aws_wafv2_ip_set resource
    - AWSManagedRulesKnownBadInputsRuleSet  # rev 5: 2nd managed-group identifier
    - count                           # rev 5: paraphrase form (count action / dry-run)
    - IP set                          # rev 5: paraphrase form (IP-set / blocklist)
    - blocklist                       # rev 5: paraphrase form
    - block-embargoed-countries       # rev 6: geo_match_statement rule name
    - KP                              # rev 6: country code paraphrase
    - IR                              # rev 6: country code paraphrase
    - CU                              # rev 6: country code paraphrase
    - SY                              # rev 6: country code paraphrase
    - embargoed                       # rev 6: paraphrase form
    - geo                             # rev 6: paraphrase form (geo / geographic)
    - apply-api-specific-rules        # rev 7: rule_group_reference_statement rule name
    - api_specific_rules              # rev 7: the aws_wafv2_rule_group resource
    - rule group                      # rev 7: paraphrase form
    - custom group                    # rev 7: paraphrase form (custom rule group)
    - workload-specific               # rev 7: paraphrase form

# No manifest fixtures here -- M4 has nothing to check.
expected_manifest_quoting: {}

# POAM scope expectations (M5). Rev 7 raises the upper bound by ~1
# to accommodate the bare Web ACL's negative emission for the new
# waf_custom_rule_groups detector. The api_protection Web ACL now
# emits 7 positive records (one per WAF detector) that are NOT POAM
