# Ground-truth labels for the config-evaluations-extended eval fixture.
#
# Mirrors evals/fixtures/security-hub-asff-extended/GROUND_TRUTH.yaml
# but for AWS Config evaluations (the v0.1.114 ingest_config primitive).
#
# === What this validates ===
#
# 1. Parser handles all 20 evaluations without dropping any to soft
#    schema drift.
# 2. Mapping table covers exactly the 5 currently-shipped Config rule
#    names — no more, no less.
# 3. Ingest skips INSUFFICIENT_DATA compliance (no signal).
# 4. Skipped-unmapped path correctly reports the 5 unmapped rules.
# 5. Evidence records carry the right ksis_evidenced + content fields
#    per the mapping table.
#
# === Composition ===
#
# 20 evaluations total:
#   - 5 mapped Config rules × 3 evaluations = 15 mapped
#   - 5 unmapped rules × 1 evaluation each = 5 unmapped
#   - 1 of the 15 mapped (encrypted-volumes #3) has
#     ComplianceType=INSUFFICIENT_DATA → skipped, not emitted
#   - Net: 14 Evidence emitted, 1 INSUFFICIENT_DATA-skip,
#     5 unmapped-skip
#
# Mix of COMPLIANT + NON_COMPLIANT across the 14 emitted to exercise
# both evidence-of-implementation and evidence-of-gap flows.
#
# === Provenance ===
#
# Hand-crafted from AWS published Config Rules documentation
# (https://docs.aws.amazon.com/config/latest/developerguide/managed-rules-by-aws-config.html).
# Account IDs are placeholders. Resource IDs use canonical AWS naming
# conventions with 0-suffix hex IDs. Zero AWS sandbox spend.

fixture_id: config-evaluations-extended
description: |
  Extended labeled AWS Config evaluations fixture for the v0.1.114
  ingest_config primitive. Larger scope than the v0.1.114 sample
  (5 evaluations) to exercise mapping table coverage, multi-evaluation-
  per-rule behavior, and skip semantics under realistic Config
  evaluation volume.
authored_by: maintainer@efterlev.com
authored_at: 2026-05-15
revision: 1

expected_ingest:
  evaluations_total: 20
  evidence_emitted: 14
  skipped_insufficient_data: 1
  skipped_unmapped_count: 5
  skipped_unmapped_config_rule_names:
    - ec2-imdsv2-check
    - rds-storage-encrypted
    - lambda-function-public-access-prohibited
    - kms-cmk-not-scheduled-for-deletion
    - vpc-default-security-group-closed

expected_mappings:
  encrypted-volumes:
    evaluations_count: 2   # 3 in input, 1 INSUFFICIENT_DATA skipped
    ksis: [KSI-CNA-OFA]
    controls: [sc-28]
  s3-bucket-public-read-prohibited:
    evaluations_count: 3
    ksis: [KSI-CNA-RNT]
    controls: [ac-3, ac-4]
  s3-bucket-public-write-prohibited:
    evaluations_count: 3
    ksis: [KSI-CNA-RNT]
    controls: [ac-3, ac-4]
  iam-root-access-key-check:
    evaluations_count: 3
    ksis: [KSI-IAM-ELP]
    controls: [ac-6]
  cloudtrail-enabled:
    evaluations_count: 3
    ksis: [KSI-MLA-CMA]
    controls: [au-2, au-12]
