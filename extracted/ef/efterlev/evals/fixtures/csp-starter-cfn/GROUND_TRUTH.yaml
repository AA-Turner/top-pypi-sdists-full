# Ground-truth labels for the csp-starter-cfn eval fixture.
#
# This is the FIRST CFN Phase 2 lite fixture with maintainer labels.
# v0.1.78 ships fixture + draft labels (compressed v0.1.63→v0.1.67
# equivalent — scaffolding + first-pass labeling + second-pass review
# in one release). The maintainer-validation pass (v0.1.69-equivalent
# LLM-call run that ran the gap agent against the labeled fixtures
# with a real ANTHROPIC_API_KEY) is DEFERRED to a future release per
# DECISIONS 2026-05-12 amendment 6 — Anthropic spend cap + GitHub
# Actions minute cap at 90% argued for shipping the labels-only first.
#
# === Labeling discipline (mirrors the TF Phase 2 lite process) ===
#
# Status values: implemented | partial | not_implemented
#                | evidence_layer_inapplicable | not_applicable
# Alternation: `<a>|<b>` when more than one verdict is defensible.
#
# Conservative-by-default: when in doubt, leave a KSI unlabeled
# (skipped, not penalized) rather than guess. Overconfident labeling
# is worse than no label.
#
# === Why this fixture vs the existing aws-vpc-cfn ===
#
# `aws-vpc-cfn` (v0.1.72) is vendored from aws-quickstart but its
# resource mix is narrow (mostly EC2). `csp-starter-cfn` is synthetic
# but exercises 12+ detector firings across 7 namespaces (KMS, S3,
# CloudTrail, IAM, RDS, Lambda, Logs) — closer to what a real CSP's
# day-one CFN actually looks like. SOURCE.md explains the synthesis.
#
# The agent is EXPECTED to perform similarly here to the TF Phase 2
# lite fixtures (100/100 maintainer-validated when the harness
# eventually runs) — the property-mapping table makes the CFN body
# shapes detector-equivalent to TF inputs. If precision/recall comes
# in below TF's 100/100, that's a regression-instrument signal that
# the mapping table has divergence from what the detector actually
# reads. That signal IS the value of running this harness.

fixture_id: csp-starter-cfn
description: |
  Synthetic CFN template covering S3 + KMS + IAM + RDS + Lambda +
  CloudTrail + Logs in the canonical FedRAMP-20x-friendly day-one
  shape. ~10 logical resources expanding to 13 TF-shape resources
  via sub-resource synthesis (S3 PAB → aws_s3_bucket_public_access_block;
  IAM Role with ManagedPolicyArns → aws_iam_role_policy_attachment;
  IAM Role with inline Policies → aws_iam_role_policy).

  Intentional partial patterns: AuditorRole has AdministratorAccess
  attached (deliberate v0 scaffolding); AppHandler Lambda has env
  vars without KMS + no VpcConfig (deliberate v0 simplification).
  See SOURCE.md "Intentional partial patterns" section for rationale.

authored_by: maintainer@efterlev.com
authored_at: 2026-05-12
# revision: 1 → 2 in v0.1.81 — second-pass label review against
# the v0.1.81 Bedrock Haiku 4.5 first-pass validation run.
# Two typo KSI IDs removed (KSI-MLA-LRP, KSI-SVC-EAR — neither
# exists in FRMR 0.9.43-beta; my labeling-bug, not agent failure).
# Four labels alternation-expanded where the agent's verdict was
# defensible-but-more-conservative-than-my-first-pass-label
# (AFR-UCM, CNA-RNT, MLA-LET, SVC-EIS — mirrors the v0.1.67
# TF-side second-pass review discipline). See
# evals/PHASE_2_LITE_CFN_VALIDATION.md for the per-disagreement
# reasoning.
revision: 2
frmr_version: 0.9.43-beta

expected_classifications:
  # === KSIs WITH detector evidence in this fixture ===

  # KSI-AFR-UCM (cryptographic-module use; SC-28(1) maps via DataTierKey
  # + AuditLogsBucket SSE-KMS + AppDb StorageEncrypted+kms_key_id).
  # Three encryption surfaces using a single CMK, all with defensible
  # KMS algorithm.
  # v0.1.78 (revision 1): `implemented` — too tight, didn't account
  # for the FRMR-mapping audit (DECISIONS 2026-05-08 Tier 1 #4.1)
  # where AFR-UCM also wants cryptographic-module-attestation
  # evidence beyond just SSE-on-storage. v0.1.81 second-pass review:
  # alternation-expanded to `partial|implemented` — Haiku's `partial`
  # is defensible.
  KSI-AFR-UCM: partial|implemented

  # KSI-IAM-ELP (least privilege; AC-6).
  # AuditorRole has AdministratorAccess — anti-least-privilege.
  # LambdaExecRole is reasonably scoped.
  # Mixed signals → partial. Could be argued not_implemented (admin
  # is the worst offender) → alternation.
  KSI-IAM-ELP: partial|not_implemented

  # KSI-IAM-JIT (just-in-time auth; AC-2 + AC-6).
  # AdministratorAccess is a standing grant — anti-JIT signal.
  # Inline policy on LambdaExecRole is also standing.
  # Both are deliberate at v0; partial captures "no JIT mechanism in
  # place but the standing grants are minimal-and-purposeful."
  KSI-IAM-JIT: partial|not_implemented

  # KSI-MLA-LET (logging event types; AU-2 + AU-12).
  # CloudTrail with IsMultiRegionTrail + IncludeGlobalServiceEvents
  # + IsLogging. CloudWatch LogGroup. AppHandler Lambda implicitly
  # logs to LogGroup.
  # v0.1.78 (revision 1): `implemented` — too tight, didn't allow
  # the agent's "partial" hedge that there's still no formal audit-
  # log-coverage-policy evidence beyond the CloudTrail config alone.
  # v0.1.81 second-pass review: alternation-expanded to
  # `partial|implemented`.
  KSI-MLA-LET: partial|implemented

  # KSI-CNA-MAT (minimizing attack surface; SC-7 family).
  # AppDb PubliclyAccessible: false. AuditLogsBucket PAB fully blocked.
  # AppHandler Lambda has no VpcConfig (internet-reachable) → partial
  # signal. AuditorRole has admin → orthogonal signal.
  # Mixed; partial captures the honest verdict.
  KSI-CNA-MAT: partial

  # KSI-CNA-RNT (restricting network traffic; SC-7(5)).
  # No SecurityGroups in this fixture (deliberate scope choice — the
  # fixture exercises encryption + IAM + logging, not networking).
  # v0.1.78 (revision 1): `evidence_layer_inapplicable` — too
  # generous. Absence of network-control resources IS a finding;
  # `not_implemented` is the more honest verdict, which is what the
  # agent picked. v0.1.81 second-pass review: alternation-expanded
  # to `not_implemented|evidence_layer_inapplicable`.
  KSI-CNA-RNT: not_implemented|evidence_layer_inapplicable

  # KSI-SVC-EIS (encryption in transit; SC-8). No detector evidence
  # here (no LB listeners with TLS in this fixture; CloudTrail to S3
  # is implicit-AWS-managed).
  # v0.1.78 (revision 1): `evidence_layer_inapplicable` — too
  # generous. No in-transit-encryption-resource evidence IS a
  # finding; `not_implemented` is the more honest verdict, which is
  # what the agent picked. v0.1.81 second-pass review:
  # alternation-expanded to
  # `not_implemented|evidence_layer_inapplicable`.
  KSI-SVC-EIS: not_implemented|evidence_layer_inapplicable

  # === KSIs without IaC surface in this fixture (procedural-only) ===

  # AFR-* family (Authority for Risk - all procedural except UCM above).
  KSI-AFR-ADS: evidence_layer_inapplicable|not_applicable
  KSI-AFR-CCM: evidence_layer_inapplicable|not_applicable
  KSI-AFR-FSI: evidence_layer_inapplicable|not_applicable
  KSI-AFR-ICP: evidence_layer_inapplicable|not_applicable
  KSI-AFR-MAS: evidence_layer_inapplicable|not_applicable
  KSI-AFR-PVA: evidence_layer_inapplicable|not_applicable
  KSI-AFR-SCG: evidence_layer_inapplicable|not_applicable
  KSI-AFR-SCN: evidence_layer_inapplicable|not_applicable
  KSI-AFR-VDR: evidence_layer_inapplicable|not_applicable

  # CED-* family (Continuous Education — all procedural).
  KSI-CED-DET: evidence_layer_inapplicable|not_applicable
  KSI-CED-RGT: evidence_layer_inapplicable|not_applicable
  KSI-CED-RRT: evidence_layer_inapplicable|not_applicable
  KSI-CED-RST: evidence_layer_inapplicable|not_applicable

  # INR-* family (Incident Response — all procedural at this fixture's bounds).
  KSI-INR-AAR: evidence_layer_inapplicable|not_applicable
  KSI-INR-RIR: evidence_layer_inapplicable|not_applicable
  KSI-INR-RPI: evidence_layer_inapplicable|not_applicable

  # PIY-RSD (workflow surface deliberately out of scope for the
  # csp-starter fixture — this is infra-only, not the .github/workflows
  # surface that PIY-RSD reads via github.* detectors).
  KSI-PIY-RSD: evidence_layer_inapplicable|not_implemented

  # === KSIs intentionally left UNLABELED (will be skipped by harness) ===
  #
  # Phase 2 lite discipline: when in doubt, don't label. The harness
  # SKIPS unlabeled KSIs rather than treating them as wrong-verdict.
  # The remaining ~38 KSIs (most of CMT, MLA-* beyond LET/LRP, RPL,
  # SCR, SVC beyond EAR/EIS, the rest of CNA, IAM beyond ELP/JIT,
  # PIY beyond RSD) require labeling judgment that the maintainer
  # would do across multiple sessions per the v0.1.63→v0.1.69 TF
  # process. Future revision (revision: 2+) adds them as labeling
  # sessions land.
