AWSTemplateFormatVersion: '2010-09-09'
Description: |
  CSP-starter — synthetic CFN template for the Phase 2 lite CFN eval
  fixture. Mirrors a typical FedRAMP-20x-pursuing SaaS company's first-
  pass infrastructure boundary: KMS-encrypted state + audit logging +
  IAM least-privilege scaffold + an RDS data tier + a Lambda compute
  tier + the central log group. Intentionally partial in places (the
  Lambda function has env vars without KMS; the auditor role has
  AdministratorAccess attached) so that the per-KSI verdicts have
  defensible-but-not-uniform shapes for labeling.

  This is NOT vendored from a real upstream CFN template — see
  SOURCE.md for the synthesis rationale + how it relates to the TF
  Phase 2 lite fixtures.

Parameters:
  DataTierKmsKeyAlias:
    Type: String
    Default: alias/csp-starter/data-tier
    Description: KMS alias for data-tier encryption.

Resources:

  # --- KMS data-tier encryption ---------------------------------------------

  DataTierKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Customer-managed CMK for S3 + RDS encryption at rest
      EnableKeyRotation: true
      KeyUsage: ENCRYPT_DECRYPT
      KeySpec: SYMMETRIC_DEFAULT
      MultiRegion: false
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAccountRoot
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'

  # --- S3 audit-logs bucket -------------------------------------------------

  AuditLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'csp-starter-audit-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt DataTierKey.Arn
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  AuditLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AuditLogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: 's3:PutObject'
            Resource: !Sub '${AuditLogsBucket.Arn}/*'
            Condition:
              StringEquals:
                's3:x-amz-acl': 'bucket-owner-full-control'
          - Sid: AllowCloudTrailGetBucketAcl
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: 's3:GetBucketAcl'
            Resource: !GetAtt AuditLogsBucket.Arn

  # --- CloudTrail audit logging ---------------------------------------------

  AuditTrail:
    Type: AWS::CloudTrail::Trail
    DependsOn: AuditLogsBucketPolicy
    Properties:
      TrailName: csp-starter-audit
      S3BucketName: !Ref AuditLogsBucket
      EnableLogFileValidation: true
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      IsLogging: true

  # --- IAM scaffold ---------------------------------------------------------

  # Intentional "partial" pattern: an Auditor role with AdministratorAccess
  # attached. This is what a not-yet-hardened CSP boundary often looks like
  # at v0; the audit-role gets full read-everything and the maintainer is
  # supposed to come back later and scope it down. The aws.iam_admin_policy_usage
  # detector should fire here.
  AuditorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: csp-starter-auditor
      Description: Read-only auditor role (over-privileged — scope-down deferred)
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: 'sts:AssumeRole'

  LambdaExecRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: csp-starter-lambda-exec
      Description: Least-privilege Lambda execution role
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: ReadDataTierKms
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'kms:Decrypt'
                  - 'kms:GenerateDataKey'
                Resource: !GetAtt DataTierKey.Arn
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'

  # --- RDS data tier --------------------------------------------------------

  AppDb:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: csp-starter-app-db
      DBInstanceClass: db.t3.micro
      Engine: postgres
      EngineVersion: '16.3'
      AllocatedStorage: '20'
      StorageEncrypted: true
      KmsKeyId: !GetAtt DataTierKey.Arn
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 7
      DeletionProtection: true
      MasterUsername: cspstarter
      MasterUserPassword: '{{resolve:secretsmanager:csp-starter/app-db:SecretString:password}}'

  # --- Lambda compute tier --------------------------------------------------

  # Intentional partial: Environment has Variables but no KmsKeyArn — the
  # aws.lambda_env_kms_encryption detector should emit a record indicating
  # env-vars-without-KMS (defensible v0 partial; CSPs commonly defer KMS
  # encryption of env vars until first audit feedback).
  AppHandler:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: csp-starter-app-handler
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecRole.Arn
      Timeout: 30
      MemorySize: 512
      Code:
        ZipFile: |
          def handler(event, context):
              return {'statusCode': 200, 'body': 'ok'}
      Environment:
        Variables:
          LOG_LEVEL: INFO
          DB_HOST: !GetAtt AppDb.Endpoint.Address

  # --- Centralized log aggregation ------------------------------------------

  AppLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/csp-starter-app-handler
      RetentionInDays: 90
      KmsKeyId: !GetAtt DataTierKey.Arn

Outputs:
  DataTierKeyArn:
    Description: ARN of the data-tier KMS key
    Value: !GetAtt DataTierKey.Arn
  AuditLogsBucketName:
    Description: Name of the audit logs bucket
    Value: !Ref AuditLogsBucket
  AppDbEndpoint:
    Description: Endpoint of the application database
    Value: !GetAtt AppDb.Endpoint.Address
