# Ground-truth labels for the aws-lambda-tfm eval fixture.
#
# v0.1.66 (claude-drafted, evidence-based, awaits maintainer review):
# Authored by reading the deterministic `efterlev scan` output
# against this fixture; NO LLM agent verdict was inspected.
# Conservative discipline per GROUND_TRUTH_FORMAT.md.
#
# === KSIs WITH detector evidence (4) ===
#
# - KSI-CNA-MAT: 1 record from aws.lambda_vpc_isolation.
#   `isolation_state: internet_facing` (Lambda has no vpc_config;
#   runs in default VPC pool). Honest verdict: `not_implemented`
#   (Lambda is internet-facing, segmentation isn't evidenced).
#   Could defensibly be `partial` if the agent reasons "the module
#   supports vpc_config; just not enabled here" — alternation.
#
# - KSI-MLA-LET: 1 record from aws.lambda_logging_configured.
#   `logging_state: unverifiable` because function_name is
#   var-driven and parser can't link to log group. Honest:
#   `not_implemented|partial` (logging IS configured via
#   aws_cloudwatch_log_group elsewhere; just unparseable link).
#
# - KSI-MLA-OSM: 1 record from aws.centralized_log_aggregation.
#   `aggregation_state: producers_only` (2 log groups, 0
#   centralization primitives). Honest: `not_implemented`
#   (logs aren't centralized; gap message is explicit).
#
# - KSI-PIY-GIV: 1 record from aws.terraform_inventory.
#   `inventory_state: tracked`. Same as VPC + S3 fixtures.
#   Honest: `partial`.
#
# === Procedural-only KSIs (no IaC surface, no manifests) ===
#
# Same set as aws-vpc-tfm + aws-s3-bucket-tfm. 17 KSIs:
#   9 AFR-* (excl AFR-UCM which would need encryption resources
#     this fixture lacks)
#   4 CED-*
#   3 INR-*
#   1 PIY-RSD (workflow surface skipped via --allow-subdir-target)

fixture_id: aws-lambda-tfm
description: |
  terraform-aws-modules/terraform-aws-lambda v8.8.0 — vendored
  verbatim. Real-shape, variable-driven AWS Lambda function
  configuration from the canonical Lambda module in the
  Terraform Registry. ~15 raw aws_* and null_* resource types
  focused on Lambda function lifecycle: function declaration,
  layer version, permissions, event source mapping, function URL,
  invoke config, recursion config, log groups.

  Companion to aws-vpc-tfm (network/segmentation) and
  aws-s3-bucket-tfm (storage/encryption). Together they form
  the initial three-fixture Phase 2 lite corpus covering the
  three most-common AWS workload patterns.

authored_by: maintainer@efterlev.com
authored_at: 2026-05-11
# revision: 1 → 2 in v0.1.67 — second-pass label review surfaced
# CNA-MAT tightening (Lambda-no-vpc_config IS unambiguously
# not_implemented; the partial alternation was reading-into-the-
# future) and MLA-LET tightening (the fixture HAS 2 log groups,
# so logging IS configured; partial is honest, not_implemented
# would be wrong). Full reasoning in
# evals/PHASE_2_LITE_LABEL_REVIEW.md.
revision: 2
frmr_version: 0.9.43-beta

expected_classifications:
  # --- KSIs WITH detector evidence ---
  # v0.1.67 review: CNA-MAT revised not_implemented|partial →
  # not_implemented. A Lambda with no vpc_config is in the
  # default VPC pool with internet egress — that's literally
  # the opposite of "minimizing attack surface." The `partial`
  # alternation was reading-into-the-future ("the module
  # supports vpc_config"), not labeling-the-evidence.
  KSI-CNA-MAT: not_implemented
  # v0.1.67 review: MLA-LET revised not_implemented|partial →
  # partial. The fixture HAS 2 aws_cloudwatch_log_group resources
  # — logging IS configured, the parser just can't link them to
  # the var-driven function_name. `not_implemented` would be
  # missing real logging infrastructure.
  KSI-MLA-LET: partial
  KSI-MLA-OSM: not_implemented
  KSI-PIY-GIV: partial

  # --- AFR procedural-only ---
  KSI-AFR-ADS: evidence_layer_inapplicable|not_applicable
  KSI-AFR-CCM: evidence_layer_inapplicable|not_applicable
  KSI-AFR-FSI: evidence_layer_inapplicable|not_applicable
  KSI-AFR-ICP: evidence_layer_inapplicable|not_applicable
  KSI-AFR-MAS: evidence_layer_inapplicable|not_applicable
  KSI-AFR-PVA: evidence_layer_inapplicable|not_applicable
  KSI-AFR-SCG: evidence_layer_inapplicable|not_applicable
  KSI-AFR-SCN: evidence_layer_inapplicable|not_applicable
  KSI-AFR-VDR: evidence_layer_inapplicable|not_applicable
  # AFR-UCM unlabeled — would need encryption resources to be
  # detector-evidenceable; this fixture has none.

  # --- CED procedural-only ---
  KSI-CED-DET: evidence_layer_inapplicable|not_applicable
  KSI-CED-RGT: evidence_layer_inapplicable|not_applicable
  KSI-CED-RRT: evidence_layer_inapplicable|not_applicable
  KSI-CED-RST: evidence_layer_inapplicable|not_applicable

  # --- INR procedural-only ---
  KSI-INR-AAR: evidence_layer_inapplicable|not_applicable
  KSI-INR-RIR: evidence_layer_inapplicable|not_applicable
