# Ground-truth labels for the aws-vpc-tfm eval fixture.
#
# THIS IS A STUB. v0.1.63 ships the harness scaffolding (vendored
# upstream Terraform under infra/, attribution under SOURCE.md, this
# file as the labeling-review entry point). Per Phase 1 discipline
# (GROUND_TRUTH_FORMAT.md "loader SKIPS unlabeled KSIs"), an empty
# `expected_classifications` is valid and means M1 + M2 are
# uncomputable until labels land. M3 (resource_naming_rate),
# M4 (manifest_quoting_accuracy), and M5 (poam_scope_discipline) ARE
# computable against this fixture from day one because they don't
# depend on per-KSI labels.
#
# === Labeling workflow (the user's evening sessions) ===
#
# 1. Run the harness once to capture what the system says today:
#      python -m evals run --fixture evals/fixtures/aws-vpc-tfm
#    The output `metrics.json` carries the per-KSI verdicts the
#    Gap Agent emitted. Open `evals/results/aws-vpc-tfm/<ts>/`.
#
# 2. For each KSI verdict, decide:
#    - Was the verdict honest? → add the entry below with that status
#    - Was the verdict wrong? → add the entry with what SHOULD have
#      been the verdict (uses `<a>|<b>` alternation when more than
#      one verdict is defensible)
#    - Are you unsure? → leave the KSI unlabeled (it's skipped, not
#      penalized — overconfident labeling is worse than no label)
#
# 3. Bump `revision:` below by 1 and re-run the harness. The metrics
#    will now compute against your labels.
#
# 4. Iterate over evening sessions. As more KSIs get labels, M1 + M2
#    become more useful as regression instruments.
#
# === Why this fixture is unique vs the synthetic in-repo fixtures ===
#
# `govnotes-v1`, `encryption-mixed`, `iam-dynamic-policy`,
# `runtime-monitoring`, `serverless-mixed` all hit 1.000 / 0.000 on
# their respective metrics. That's a textbook overfit risk — the
# prompts were tuned against them. This fixture is real-shape AWS
# Terraform from the most-used VPC module in the ecosystem; it
# exercises the variable-conditional, parser-can't-resolve resource
# patterns that real customer scans hit.
#
# The agent is EXPECTED to perform worse here than on the synthetic
# fixtures. That delta IS the regression-instrument signal you wanted
# from the strategic-arc decision (CLAUDE.md, "quality scaffolding
# before market expansion").

fixture_id: aws-vpc-tfm
description: |
  terraform-aws-modules/terraform-aws-vpc v6.6.1 — vendored
  verbatim. Real-shape, variable-driven, conditional-resource
  AWS networking from the most-downloaded VPC module in the
  Terraform Registry. ~50 raw aws_* resource types across VPC,
  subnets (6 tiers), routing, NACLs, NAT gateways, VPN
  gateway, customer gateways, default-resource hardening.

  Contrast with the synthetic in-repo fixtures: those exercise
  one detector dimension at a time with hardcoded values; this
  exercises the messy variable-resolution path real customer
  scans actually hit.

authored_by: maintainer@efterlev.com
authored_at: 2026-05-11
# revision: 2 → 3 in v0.1.67 — second-pass label review surfaced
# CNA-MAT + CNA-RNT alternation expansions (see
# evals/PHASE_2_LITE_LABEL_REVIEW.md for full reasoning).
revision: 3
frmr_version: 0.9.43-beta

# v0.1.64 (claude-drafted, evidence-based, awaits maintainer review):
# These initial labels were authored by reading the deterministic
# `efterlev scan` output against this fixture (NO LLM agent verdict
# was inspected; this avoids the confirmation-bias risk of "label
# whatever the agent said as honest"). Labels are CONSERVATIVE
# per the GROUND_TRUTH_FORMAT.md discipline: only KSIs where
# evidence-vs-statement mapping is unambiguous get labeled; all
# others stay unlabeled (the harness skips them, no penalty).
#
# Maintainer review pass should: (a) run the harness against this
# fixture with an ANTHROPIC_API_KEY available, (b) compare each
# label below against the agent's actual verdict, (c) override any
# label where domain expertise disagrees with claude's evidence-
# based reasoning, (d) bump revision and re-run.
#
# KSIs WITH detector evidence in this fixture (4):
#   - KSI-CNA-MAT, KSI-CNA-RNT: 7 NACLs, all `posture_state =
#     partially_restrictive` per aws.nacl_restrictiveness (no
#     explicit deny rules). Honest verdict: `partial`.
#   - KSI-CNA-ULN: 1 record from aws.vpc_logical_segmentation;
#     `segmentation_state = undefined` (the variable-driven cidr
#     prevented subnet-vpc linkage at parse time). Agent could
#     honestly call this `partial` (VPC declared) or
#     `not_implemented` (segmentation not verifiable) — alternation
#     captures both.
#   - KSI-PIY-GIV: 1 record from aws.terraform_inventory;
#     `inventory_state = tracked`, 27 distinct resource types.
#     IaC layer evidences "we use Terraform"; full implementation
#     of "Governance / Inventory" requires policy/process which
#     is procedural. Honest verdict: `partial`.
#
# KSIs without IaC surface (procedural-only) — `evidence_layer_inapplicable
# |not_applicable` is honest because the fixture has no Evidence
# Manifests attesting to operational implementation:
#   - All 10 AFR-* KSIs except AFR-UCM (which is detector-evidenceable
#     via cryptographic-module mapping; this fixture has no encryption
#     resources so AFR-UCM gets `not_implemented`).
#   - All 4 CED-* KSIs (Continuous Education).
#   - All 3 INR-* KSIs (Incident Response — RIR has some IaC surface
#     via detection alarms, but this fixture has none).
#
# KSI-PIY-RSD specifically: detector-evidenceable via the
# github.piy_sdlc_security_gates + github.branch_protection
# detectors which require .github/workflows/ to fire. The harness
# scanned with --allow-subdir-target so those detectors were
# skipped entirely. Either `not_implemented` (no evidence) or
# `evidence_layer_inapplicable` (the github surface was deliberately
# out of scope for this fixture's bounds) is defensible. Alternation.
expected_classifications:
  # --- KSIs WITH detector evidence ---
  # v0.1.67 review revisions: CNA-MAT + CNA-RNT alternation expansions
  # (the missing-explicit-deny gap could honestly be weighted to
  # not_implemented; see evals/PHASE_2_LITE_LABEL_REVIEW.md).
  KSI-CNA-MAT: partial|not_implemented
  KSI-CNA-RNT: partial|not_implemented
  KSI-CNA-ULN: partial|not_implemented
  KSI-PIY-GIV: partial

  # --- AFR procedural-only (no IaC surface in this fixture) ---
  KSI-AFR-ADS: evidence_layer_inapplicable|not_applicable
  KSI-AFR-CCM: evidence_layer_inapplicable|not_applicable
  KSI-AFR-FSI: evidence_layer_inapplicable|not_applicable
  KSI-AFR-ICP: evidence_layer_inapplicable|not_applicable
  KSI-AFR-MAS: evidence_layer_inapplicable|not_applicable
  KSI-AFR-PVA: evidence_layer_inapplicable|not_applicable
  KSI-AFR-SCG: evidence_layer_inapplicable|not_applicable
  KSI-AFR-SCN: evidence_layer_inapplicable|not_applicable
  KSI-AFR-VDR: evidence_layer_inapplicable|not_applicable

  # --- CED procedural-only ---
  KSI-CED-DET: evidence_layer_inapplicable|not_applicable
  KSI-CED-RGT: evidence_layer_inapplicable|not_applicable
  KSI-CED-RRT: evidence_layer_inapplicable|not_applicable
  KSI-CED-RST: evidence_layer_inapplicable|not_applicable

  # --- INR procedural-only ---
  KSI-INR-AAR: evidence_layer_inapplicable|not_applicable
  KSI-INR-RIR: evidence_layer_inapplicable|not_applicable
  KSI-INR-RPI: evidence_layer_inapplicable|not_applicable

  # --- PIY-RSD (workflow surface skipped via --allow-subdir-target) ---
  KSI-PIY-RSD: not_implemented|evidence_layer_inapplicable
