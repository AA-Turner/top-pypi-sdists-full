# Ground-truth labels for the aws-s3-bucket-tfm eval fixture.
#
# v0.1.65 (claude-drafted, evidence-based, awaits maintainer review):
# Authored by reading the deterministic `efterlev scan` output
# against this fixture (NO LLM agent verdict was inspected; this
# avoids the confirmation-bias risk of "label whatever the agent
# said as honest"). Labels are CONSERVATIVE per the
# GROUND_TRUTH_FORMAT.md discipline: only KSIs where the
# evidence-vs-statement mapping is unambiguous get labeled.
# Maintainer review pass should override any label where domain
# expertise disagrees.
#
# === KSIs WITH detector evidence in this fixture (8) ===
#
# - KSI-AFR-UCM: 2 records from aws.encryption_s3_at_rest. The
#   canonical "split-resource" pattern — the bucket itself doesn't
#   inline encryption (`encryption_state: absent`), but the separate
#   aws_s3_bucket_server_side_encryption_configuration is present.
#   Honest verdict: `partial` (encryption configured via the
#   modern split pattern). Could also defensibly be
#   `not_implemented` if the agent weighs the bucket-level
#   absent case heavily.
#
# - KSI-CNA-MAT, KSI-CNA-RNT: 1 record each from
#   aws.s3_bucket_public_acl. Detector hit `exposure_state:
#   unparseable` (bucket policy built via jsonencode). Honest:
#   `not_implemented|partial` (couldn't verify exposure either way).
#
# - KSI-CNA-OFA: 1 record from aws.cna_optimizing_for_availability.
#   `availability_state: configured` (S3 replication present).
#   Honest: `partial` (single mechanism evidenced; full
#   implementation requires multi-AZ + multi-region patterns
#   across more resource families).
#
# - KSI-IAM-AAM: 1 record from aws.iam_managed_via_terraform.
#   13 aws_iam_policy_document data sources tracked.
#   Honest: `partial` (IaC-managed identity primitives present;
#   full IAM implementation needs organizational policy + IAM
#   roles+users which this fixture doesn't include).
#
# - KSI-PIY-GIV: 1 record from aws.terraform_inventory.
#   `inventory_state: tracked`, 26 distinct resource types.
#   Same as aws-vpc-tfm — IaC-layer evidences "we use Terraform";
#   full implementation = procedural. Honest: `partial`.
#
# - KSI-RPL-ABO: 1 record from aws.backup_retention_configured.
#   `backup_state: absent`, versioning_status is var-driven and
#   not resolvable at parse time. Honest:
#   `not_implemented|partial` (versioning resource exists but
#   parser can't confirm it's enabled).
#
# - KSI-SVC-RUD: 1 record from aws.s3_lifecycle_policies.
#   `lifecycle_state: placeholder`, 0 enabled rules. Honest:
#   `not_implemented` (lifecycle resource declared but has no
#   actual retention/transition actions; SI-12 not evidenced
#   beyond structural declaration).
#
# === Procedural-only KSIs (no IaC surface, no manifests) ===
#
# Same set as aws-vpc-tfm fixture; the S3-only fixture has the
# same procedural-coverage profile (no operational manifests
# in this corpus). 16 KSIs:
#   9 AFR-* (excl AFR-UCM which IS evidenced here)
#   4 CED-*
#   3 INR-*
#
# KSI-PIY-RSD (workflow surface skipped via --allow-subdir-target):
# same as VPC fixture, alternation captures both honest verdicts.

fixture_id: aws-s3-bucket-tfm
description: |
  terraform-aws-modules/terraform-aws-s3-bucket v5.13.0 — vendored
  verbatim. Real-shape, variable-driven AWS S3 bucket configuration
  from the canonical S3 module in the Terraform Registry.
  ~20 raw aws_* resource types focused on bucket lifecycle:
  encryption, public-access-block, ACL, lifecycle, replication,
  ownership controls, versioning, logging, object lock, intelligent
  tiering, inventory.

  Companion to aws-vpc-tfm: where VPC exercises the
  network/segmentation detector dimensions, this exercises the
  storage + encryption dimensions. Together they begin the
  per-detector-family Phase 2 lite coverage build-out.

authored_by: maintainer@efterlev.com
authored_at: 2026-05-11
# revision: 1 → 2 in v0.1.67 — second-pass label review surfaced
# AFR-UCM tightening (split-resource encryption pattern is honest
# `partial`, not `partial|not_implemented`) and SVC-RUD loosening
# (placeholder-lifecycle resource exists, agent could call partial).
# Full reasoning in evals/PHASE_2_LITE_LABEL_REVIEW.md.
revision: 2
frmr_version: 0.9.43-beta

expected_classifications:
  # --- KSIs WITH detector evidence ---
  # v0.1.67 review: AFR-UCM revised partial|not_implemented → partial.
  # The split-resource SSE pattern (separate
  # _server_side_encryption_configuration resource) IS the post-2022
  # AWS best practice; an agent calling this `not_implemented` would
  # be missing real encryption infrastructure.
  KSI-AFR-UCM: partial
  KSI-CNA-MAT: not_implemented|partial
  KSI-CNA-RNT: not_implemented|partial
  KSI-CNA-OFA: partial
  KSI-IAM-AAM: partial
  KSI-PIY-GIV: partial
  KSI-RPL-ABO: not_implemented|partial
  # v0.1.67 review: SVC-RUD revised not_implemented → not_implemented|partial.
  # Lifecycle resource exists (just empty); agent could honestly
  # weight either toward "placeholder = not_implemented" or
  # "the resource is here, structurally = partial".
  KSI-SVC-RUD: not_implemented|partial

  # --- AFR procedural-only (excl AFR-UCM, evidenced above) ---
  KSI-AFR-ADS: evidence_layer_inapplicable|not_applicable
  KSI-AFR-CCM: evidence_layer_inapplicable|not_applicable
  KSI-AFR-FSI: evidence_layer_inapplicable|not_applicable
  KSI-AFR-ICP: evidence_layer_inapplicable|not_applicable
  KSI-AFR-MAS: evidence_layer_inapplicable|not_applicable
  KSI-AFR-PVA: evidence_layer_inapplicable|not_applicable
  KSI-AFR-SCG: evidence_layer_inapplicable|not_applicable
  KSI-AFR-SCN: evidence_layer_inapplicable|not_applicable
  KSI-AFR-VDR: evidence_layer_inapplicable|not_applicable

  # --- CED procedural-only ---
  KSI-CED-DET: evidence_layer_inapplicable|not_applicable
  KSI-CED-RGT: evidence_layer_inapplicable|not_applicable
  KSI-CED-RRT: evidence_layer_inapplicable|not_applicable
  KSI-CED-RST: evidence_layer_inapplicable|not_applicable

  # --- INR procedural-only ---
  KSI-INR-AAR: evidence_layer_inapplicable|not_applicable
  KSI-INR-RIR: evidence_layer_inapplicable|not_applicable
  KSI-INR-RPI: evidence_layer_inapplicable|not_applicable

  # --- PIY-RSD (workflow surface skipped) ---
  KSI-PIY-RSD: not_implemented|evidence_layer_inapplicable
