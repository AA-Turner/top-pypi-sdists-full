# Ground-truth labels for the runtime-monitoring eval fixture (Phase 2).
#
# 4th eval-harness fixture. Targets the runtime-detection /
# continuous-monitoring detector cluster the original 3 fixtures
# (govnotes-v1, encryption-mixed, iam-dynamic-policy) didn't exercise:
# guardduty_enabled, config_enabled, access_analyzer_enabled,
# cloudwatch_alarms_critical, centralized_log_aggregation.
#
# Designed to exercise:
#
#   M1/M2 (status): mixed posture across the cluster — GuardDuty +
#     Config + alarms ON; Access Analyzer absent; CloudTrail and a
#     CloudWatch log group present BUT no Kinesis Firehose /
#     OpenSearch / log-subscription-filter (producers without
#     aggregator). The honest verdicts are mostly `partial` plus
#     one `not_implemented` for the missing Access Analyzer.
#
#   M3 (resource-naming): the agent should name the actual resources
#     (`aws_guardduty_detector.primary`, `aws_config_configuration_recorder.primary`,
#      etc.) when classifying.
#
#   Centralized-log-aggregation gap: the fixture intentionally has
#     log producers (`aws_cloudtrail.primary` + `aws_cloudwatch_log_group.app_logs`)
#     without an aggregator, so the `centralized_log_aggregation`
#     detector should report `aggregation_state = producers_only` —
#     the exact pattern an earlier agent rationale flagged on
#     iam-dynamic-policy. M2 should still pass because `partial` is
#     the honest call (CloudTrail produces logs; the centralization
#     slice is the gap).

fixture_id: runtime-monitoring
description: |
  4th eval-harness fixture, covering the runtime-detection /
  continuous-monitoring surface the original 3 fixtures didn't
  exercise: GuardDuty enabled, AWS Config enabled (recorder +
  delivery channel), CloudWatch alarms for critical security
  events, CloudTrail + a CloudWatch log group as log producers,
  and an SNS topic for alarm routing. Intentional gaps: no AWS
  Access Analyzer (KSI-CNA-EIS not_implemented) and no log
  aggregator (Kinesis Firehose / OpenSearch / subscription
  filter — exercises the `producers_only` finding from
  `aws.centralized_log_aggregation`).

authored_by: maintainer@efterlev.com
authored_at: 2026-05-09
revision: 1
frmr_version: 0.9.43-beta

# Mixed posture; partial dominates because every monitoring KSI
# has multiple sub-outcomes the scanner cannot fully evidence
# (alert routing destinations exist but actual response procedure
# is procedural; Config recorder is on but rule set is unverifiable
# from IaC alone, etc.). Alternation is conservative.
expected_classifications:
  # MLA-OSM (Operate SIEM/centralized monitoring) — GuardDuty +
  # alarms present, log producers present, but NO aggregator. The
  # "centralization slice" of the KSI outcome is the gap.
  KSI-MLA-OSM: partial

  # MLA-EVC (Event Conditions / continuous-monitoring config) —
  # AWS Config enabled with recorder + delivery channel.
  # Configuration management is the IaC slice; rule set + reaction
  # procedure is procedural.
  KSI-MLA-EVC: partial

  # MLA-LET (Logging Event Types) — CloudTrail multi-region +
  # log validation enabled, plus 2 critical CloudWatch alarms on
  # CloudTrail/root-account events. Procedural layer (log access
  # control, retention beyond 90 days) is unverifiable from IaC.
  KSI-MLA-LET: partial

  # CNA-EIS (External Information Systems) — NO aws_accessanalyzer_analyzer
  # in the fixture. Honest call is `not_implemented`. Alternation
  # accepts `partial` if the agent reads other CNA-related signals
  # as partial-positive evidence (unlikely on this fixture but
  # conservative).
  KSI-CNA-EIS: not_implemented|partial

  # SVC-ACM (Automated Configuration Management) — AWS Config
  # enabled is part of automated config management. `partial`
  # because the scanner can't verify the rule set or remediation
  # automation.
  KSI-SVC-ACM: partial

# M3: at least ONE of the named resources must appear in the
# rationale for each affected KSI. Names the IaC resources the
# agent should reference rather than just describing the service
# generically.
expected_rationale_resources:
  KSI-MLA-OSM:
    - guardduty             # the GuardDuty detector
    - root_account_used     # one of the critical alarms
    - cloudtrail_config_changes  # the other critical alarm
    - cloudtrail            # log producer
    - app_logs              # log producer
    - aggregator            # the agent should name the missing piece
  KSI-MLA-EVC:
    - config                # AWS Config (recorder/delivery channel)
    - primary               # the recorder/channel resource names
  KSI-MLA-LET:
    - cloudtrail            # the trail
    - root_account_used     # critical alarm
    - cloudtrail_config_changes
  # KSI-CNA-EIS deliberately omitted from M3: the fixture's "gap" for
  # this KSI is the ABSENCE of aws_accessanalyzer_analyzer. Rationales
  # describe what evidence shows, not what's absent — the agent
  # legitimately picks up adjacent Config-recorder evidence instead and
  # describes that. There's no positive resource the agent could name
  # for CNA-EIS on this fixture; M3 has nothing to enforce.
  KSI-SVC-ACM:
    - config                # AWS Config
    - primary               # the recorder name

# No manifest fixtures here — M4 has nothing to check.
expected_manifest_quoting: {}

# POAM scope expectations (M5).
expected_poam:
  excluded_count_min: 0
  excluded_count_max: 6
  must_not_mention: []
