# Ground-truth labels for the security-hub-asff-extended eval fixture.
#
# This is the v0.1.119 M1 Stage 4 labeled fixture for runtime-evidence
# ingestion (`efterlev import-security-hub`). Mirrors the CFN/TF
# eval-harness GROUND_TRUTH.yaml pattern but the validated unit is
# different: ingest is deterministic (parser + mapping table lookup,
# no LLM), so labels are PER-FINDING expected mappings rather than
# per-KSI Gap Agent verdicts.
#
# === What this validates ===
#
# 1. Parser handles all 20 findings without dropping any to soft schema
#    drift (the v0.1.113 parser tolerates malformed findings; this
#    fixture should not exercise that path).
# 2. Mapping table covers exactly the 5 currently-shipped generator-ids
#    (EC2.2, IAM.6, S3.1, CloudTrail.1, KMS.1) — no more, no less.
# 3. Ingest skips NOT_AVAILABLE compliance status (no signal).
# 4. Skipped-unmapped path correctly reports the 5 unmapped generator-
#    ids (Lambda.5, RDS.13, Inspector.1, GuardDuty.1, SSM.1).
# 5. Evidence records emitted carry the right ksis_evidenced + content
#    fields per the mapping table.
#
# === Composition ===
#
# 20 findings total:
#   - 5 mapped controls × 3 findings each = 15 mapped
#   - 5 unmapped controls × 1 finding each = 5 unmapped
#   - 1 of the 15 mapped (IAM.6 #3) has Compliance.Status=NOT_AVAILABLE
#     → skipped, not emitted
#   - Net: 14 Evidence records emitted, 1 NOT_AVAILABLE-skip, 5 unmapped-skip
#
# Mix of FAILED + PASSED across the 14 emitted to exercise both
# evidence-of-gap and evidence-of-implementation flows.
#
# === Provenance ===
#
# Hand-crafted from AWS published per-control example findings (see
# https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-controls-reference.html).
# Account IDs are placeholders (111111111111, 222222222222, 333333333333).
# Resource ARNs use canonical AWS naming with 0-suffix hex IDs.
# No real customer data; no real AWS sandbox spend.

fixture_id: security-hub-asff-extended
description: |
  Extended labeled ASFF fixture for the v0.1.113 ingest_security_hub
  primitive. Larger scope than the v0.1.113 sample (4 findings) to
  exercise mapping table coverage, multi-finding-per-control behavior,
  and skip semantics under realistic Security Hub output volume.
authored_by: maintainer@efterlev.com
authored_at: 2026-05-15
revision: 1

# Expected aggregate counts when running:
#   efterlev import-security-hub findings.json --target .
expected_ingest:
  findings_total: 20
  evidence_emitted: 14
  skipped_status_not_available: 1
  skipped_unmapped_count: 5
  skipped_unmapped_generator_ids:
    - aws-foundational-security-best-practices/v/1.0.0/Lambda.5
    - aws-foundational-security-best-practices/v/1.0.0/RDS.13
    - aws-foundational-security-best-practices/v/1.0.0/Inspector.1
    - aws-foundational-security-best-practices/v/1.0.0/GuardDuty.1
    - aws-foundational-security-best-practices/v/1.0.0/SSM.1

# Expected per-generator-id mapping (only mapped controls).
# ksis_evidenced + controls_evidenced are the deterministic outputs of
# the v0.1.113 mapping table; if the table changes, update both.
expected_mappings:
  "aws-foundational-security-best-practices/v/1.0.0/EC2.2":
    findings_count: 3   # all 3 emitted
    ksis: [KSI-CNA-RNT]
    controls: [sc-7, ac-4]
  "aws-foundational-security-best-practices/v/1.0.0/IAM.6":
    findings_count: 2   # 3 in input, 1 NOT_AVAILABLE skipped
    ksis: [KSI-IAM-MFA]
    controls: [ia-2]
  "aws-foundational-security-best-practices/v/1.0.0/S3.1":
    findings_count: 3
    ksis: [KSI-CNA-RNT]
    controls: [ac-3, ac-4]
  "aws-foundational-security-best-practices/v/1.0.0/CloudTrail.1":
    findings_count: 3
    ksis: [KSI-MLA-CMA]
    controls: [au-2, au-12]
  "aws-foundational-security-best-practices/v/1.0.0/KMS.1":
    findings_count: 3
    ksis: [KSI-IAM-ELP]
    controls: [ac-6]
