# Prowler CheckID → KSI + 800-53 control mapping table.
#
# Each entry maps a Prowler check ID (the CheckID field from native
# JSON output) to FRMR KSI(s) and 800-53 control(s).
#
# How to extend:
# 1. Run `prowler aws --list-checks` to enumerate available checks.
# 2. Match check semantics to FRMR KSIs (use efterlev.frmr.loader to
#    look up underlying 800-53 controls).
# 3. `evidence_strength` is "high" when the Prowler check is a strict
#    superset of what the KSI requires, "medium" for partial overlap.
#
# Initial v0.1.123 set: 8 high-impact checks across CNA + IAM + MLA +
# RPL themes. Mirrors the v0.1.121 ASFF batch's coverage where Prowler
# has equivalent checks (intentional cross-tool consistency: customers
# running both Security Hub + Prowler shouldn't get conflicting evidence).
#
# Source: Prowler v4 check catalog
# https://github.com/prowler-cloud/prowler/blob/master/prowler/providers/aws/services/

mappings:
  - check_id: "ec2_securitygroup_default_restrict_traffic"
    title: "VPC default security group should restrict all traffic"
    ksis: ["KSI-CNA-RNT"]
    controls: ["sc-7", "ac-4"]
    evidence_strength: high

  - check_id: "iam_root_hardware_mfa_enabled"
    title: "Hardware MFA should be enabled for the root user"
    ksis: ["KSI-IAM-MFA"]
    controls: ["ia-2"]
    evidence_strength: high

  - check_id: "s3_bucket_public_access"
    title: "S3 buckets should block public access"
    ksis: ["KSI-CNA-RNT"]
    controls: ["ac-3", "ac-4"]
    evidence_strength: high

  - check_id: "cloudtrail_multi_region_enabled"
    title: "Multi-region CloudTrail trail should be enabled"
    ksis: ["KSI-MLA-CMA"]
    controls: ["au-2", "au-12"]
    evidence_strength: high

  - check_id: "iam_customer_unattached_policy_no_administrative_privileges"
    title: "Customer-managed IAM policies should not grant full admin privileges"
    ksis: ["KSI-IAM-ELP"]
    controls: ["ac-6"]
    evidence_strength: medium

  - check_id: "ec2_securitygroup_allow_ingress_from_internet_to_any_port"
    title: "Security groups should not allow unrestricted inbound from 0.0.0.0/0"
    ksis: ["KSI-CNA-RNT"]
    controls: ["sc-7"]
    evidence_strength: high

  - check_id: "vpc_flow_logs_enabled"
    title: "VPC flow logs should be enabled"
    ksis: ["KSI-MLA-LET"]
    controls: ["au-12"]
    evidence_strength: high

  - check_id: "rds_instance_deletion_protection"
    title: "RDS DB instances should have deletion protection enabled"
    ksis: ["KSI-RPL-ABO"]
    controls: ["cp-9"]
    evidence_strength: high
