# AWS Config rule-name → KSI + 800-53 control mapping table.
#
# Each entry maps an AWS Config Rule name (the ConfigRuleName field
# from evaluation results) to FRMR KSI(s) and 800-53 control(s).
#
# How to extend:
# 1. Run `aws configservice describe-config-rules` to enumerate rules
#    in the account.
# 2. For AWS-managed rules, the rule name is a stable string (e.g.,
#    `encrypted-volumes`); for custom Lambda rules, the customer-given
#    name (no convention).
# 3. Match rule semantics to FRMR KSIs (use efterlev.frmr.loader to
#    look up underlying 800-53 controls).
# 4. `evidence_strength` is "high" when the Config rule is a strict
#    superset of what the KSI requires, "medium" for partial overlap.
#
# Initial v0.1.114 set: 5 high-impact AWS-managed Config rules across
# CNA + IAM + MLA themes. Expansion in batches as customer pull
# surfaces additional rule coverage needs.
#
# Source: AWS-managed Config Rules, identified by their canonical
# rule-name strings:
# https://docs.aws.amazon.com/config/latest/developerguide/managed-rules-by-aws-config.html

mappings:
  - config_rule_name: "encrypted-volumes"
    title: "EBS volumes that are in an attached state are encrypted"
    ksis: ["KSI-CNA-OFA"]  # Optimal-default protections
    controls: ["sc-28"]
    evidence_strength: high

  - config_rule_name: "s3-bucket-public-read-prohibited"
    title: "S3 buckets do not allow public read access"
    ksis: ["KSI-CNA-RNT"]
    controls: ["ac-3", "ac-4"]
    evidence_strength: high

  - config_rule_name: "s3-bucket-public-write-prohibited"
    title: "S3 buckets do not allow public write access"
    ksis: ["KSI-CNA-RNT"]
    controls: ["ac-3", "ac-4"]
    evidence_strength: high

  - config_rule_name: "iam-root-access-key-check"
    title: "Root account does not have active access keys"
    ksis: ["KSI-IAM-ELP"]
    controls: ["ac-6"]
    evidence_strength: high

  - config_rule_name: "cloudtrail-enabled"
    title: "CloudTrail is enabled in the account"
    ksis: ["KSI-MLA-CMA"]
    controls: ["au-2", "au-12"]
    evidence_strength: high

  # --- v0.1.122 batch: 8 high-confidence additions across CMT/CNA/IAM/MLA/RPL themes ---

  - config_rule_name: "vpc-flow-logs-enabled"
    title: "VPC flow logs are enabled on every VPC"
    ksis: ["KSI-MLA-LET"]
    controls: ["au-12"]
    evidence_strength: high

  - config_rule_name: "cloudtrail-encryption-enabled"
    title: "CloudTrail trails are encrypted at rest with a KMS key"
    ksis: ["KSI-MLA-CMA"]
    controls: ["au-9"]
    evidence_strength: high

  - config_rule_name: "cloudtrail-log-file-validation-enabled"
    title: "CloudTrail log file integrity validation is enabled"
    ksis: ["KSI-MLA-CMA"]
    controls: ["au-10"]
    evidence_strength: high

  - config_rule_name: "rds-instance-deletion-protection-enabled"
    title: "RDS DB instances have deletion protection enabled"
    ksis: ["KSI-RPL-ABO"]
    controls: ["cp-9"]
    evidence_strength: high

  - config_rule_name: "iam-password-policy"
    title: "Account-level IAM password policy meets the configured strength"
    ksis: ["KSI-IAM-APM"]
    controls: ["ia-5"]
    evidence_strength: high

  - config_rule_name: "iam-user-mfa-enabled"
    title: "MFA is enabled for IAM users"
    ksis: ["KSI-IAM-MFA"]
    controls: ["ia-2"]
    evidence_strength: high

  - config_rule_name: "mfa-enabled-for-iam-console-access"
    title: "MFA is enabled for IAM users with console-password access"
    ksis: ["KSI-IAM-MFA"]
    controls: ["ia-2"]
    evidence_strength: high

  - config_rule_name: "incoming-ssh-disabled"
    title: "Security groups do not permit unrestricted incoming SSH (0.0.0.0/0:22)"
    ksis: ["KSI-CNA-RNT"]
    controls: ["sc-7"]
    evidence_strength: high
