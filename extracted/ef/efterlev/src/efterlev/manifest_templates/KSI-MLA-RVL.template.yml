# KSI-MLA-RVL — Reviewing Logs
#
# DRAFT — this is a starter-pack template. Copy it to
# `.efterlev/manifests/<ksi-id>.yml` (drop the `.template` suffix) and
# fill in the DRAFT placeholders before letting it land in your
# attestation pipeline. The `_template_help` block carries the
# questions you should answer; remove that block once filled in.

ksi: KSI-MLA-RVL
name: "Reviewing Logs"

_template_help:
  description: >
    KSI-MLA-RVL is the procedural commitment to PERSISTENTLY review and audit logs. Detector evidence covers log retention (`aws.centralized_log_aggregation`) and least-privilege access on log data (`aws.mla_log_access_least_privilege`); this KSI is the human-process commitment that someone is actually reading the logs and acting on what they find. Per DECISIONS 2026-05-07 'Tier 1 #4 design', classified procedural-only despite mapping to technical control families (AC-*, AU-*, SI-*) — the requirement text is review-the-logs framing, not configure-the-logs framing.
  questions:
      - "Which log streams are reviewed (CloudWatch Log Groups, S3 access logs, VPC Flow, application logs)?"
      - "What's the review cadence (continuous via SIEM correlation, daily, weekly)?"
      - "Who reviews — automated tooling first, then humans on alert? Named role or rotation?"
      - "What review activity gets recorded as evidence (Splunk dashboard exports, ticket links, audit-log queries with timestamps)?"
      - "How are findings escalated (Sev rubric, on-call paging, ticket creation in which queue)?"
      - "Where is the review process documented?"

evidence:
  - type: attestation
    statement: >
      DRAFT — Example: Continuous correlation via Splunk Enterprise Security on all in-boundary log groups (CloudWatch + S3 access + VPC Flow + EKS audit + application). SOC analyst rotation reviews the SIEM queue 24/7; daily summary report at splunk-dashboards/daily-soc-review. Sev-1/2 findings page on-call within 15 min via PagerDuty; Sev-3+ tracked in Jira SEC-MLA-RVL. Review process documented at runbooks/log-review.md; reviewed semi-annually. Last process review: 2026-04-12.
