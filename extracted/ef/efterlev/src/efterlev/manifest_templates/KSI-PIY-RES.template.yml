    KSI-PIY-RES reviews executive support for security objectives. The attestation should name the forum (board meeting, leadership review), the cadence, and what evidence of executive support exists (signed policies, budget approvals).
  questions:
      - "What forum reviews executive support (board security committee, CEO-staff)?"
      - "What's the cadence?"
      - "What artifacts evidence executive support (signed security policy, approved budget, leadership-attended training)?"
      - "Who owns the executive-engagement program?"
      - "When was the last review?"

