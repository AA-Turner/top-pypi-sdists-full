ksi: KSI-AFR-UCM
name: "Using Cryptographic Modules"

_template_help:
  description: >
    KSI-AFR-UCM ensures cryptographic modules used to protect federal data are selected per FedRAMP 20x Using Cryptographic Modules guidance (FIPS 140-validated, etc.). The attestation should name where you've documented the cryptographic-module inventory.
  questions:
      - "Where is your cryptographic-module inventory documented?"
      - "Which FIPS 140-validated modules are in use (KMS, TLS libraries, etc.)?"
      - "How are non-validated modules identified and remediated?"
      - "Who reviews the inventory for completeness and currency?"
      - "What's the review cadence?"

