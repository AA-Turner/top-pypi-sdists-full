ksi: KSI-CMT-RVP
name: "Reviewing Change Procedures"

_template_help:
  description: >
    KSI-CMT-RVP reviews the effectiveness of documented change-management procedures. Detector evidence covers individual change-application (KSI-CMT-LMC, RMV, VTD); this KSI is the procedural commitment to review the procedures themselves.
  questions:
      - "Where is your change-management procedure documented?"
      - "What's the review cadence?"
      - "What metrics signal procedure effectiveness (MTTR, change-failure rate, rollback frequency)?"
      - "Who participates in the review?"
      - "When was the last review?"

evidence:
  - type: attestation
    statement: >
      DRAFT — Example: Change-management procedure at runbooks/change-management.md. Reviewed semi-annually by Platform Eng + SecOps leadership. Metrics: change-failure rate (DORA), MTTR for change-induced incidents, rollback frequency. Review incorporates AAR findings (KSI-INR-AAR). Last review: 2026-03-30.
    attested_by: "DRAFT — your-vp-security@example.com"
    attested_at: "DRAFT — YYYY-MM-DD"
    reviewed_at: "DRAFT — YYYY-MM-DD"
    next_review: "DRAFT — YYYY-MM-DD (recommend 6-month review cadence)"
    supporting_docs:
      - "DRAFT — ./policies/your-runbook.pdf"
      - "DRAFT — https://wiki.your-company.example/path-to-relevant-docs"
