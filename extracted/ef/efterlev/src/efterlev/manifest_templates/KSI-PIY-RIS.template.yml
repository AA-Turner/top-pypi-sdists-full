ksi: KSI-PIY-RIS
name: "Reviewing Investments in Security"

_template_help:
  description: >
    KSI-PIY-RIS reviews the effectiveness of investments in achieving security objectives. The attestation should name the budgeting + ROI-review process and how outcomes are tracked back to investments.
  questions:
      - "What's the security-investment review process (annual budget cycle, quarterly ROI review)?"
      - "How are outcomes measured (incident-rate trends, audit-finding trends, MTTR)?"
      - "Who reviews investment effectiveness?"
      - "How are findings used to adjust the next budget cycle?"
      - "Where is the process documented?"

