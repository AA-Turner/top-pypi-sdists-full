# KSI-CED-RRT — Reviewing Response and Recovery Training
#
# DRAFT — this is a starter-pack template. Copy it to
# `.efterlev/manifests/<ksi-id>.yml` (drop the `.template` suffix) and
# fill in the DRAFT placeholders before letting it land in your
# attestation pipeline. The `_template_help` block carries the
# questions you should answer; remove that block once filled in.

ksi: KSI-CED-RRT
name: "Reviewing Response and Recovery Training"

_template_help:
  description: >
    KSI-CED-RRT reviews role-specific training given to staff involved with incident response or disaster recovery. The attestation should name the IR/DR training program, who's enrolled, and how effectiveness is measured (typically tabletop exercises).
  questions:
      - "Which roles complete IR/DR-specific training?"
      - "What's the training format (course, tabletop, simulation)?"
      - "What's the cadence?"
      - "How is effectiveness measured (tabletop performance, time-to-recover in drills)?"
      - "Who owns the program?"

evidence:
  - type: attestation
    statement: >
      DRAFT — Example: SecOps + on-call SREs complete the in-house IR Runbook training annually + participate in quarterly tabletop exercises (one IR scenario, one DR scenario per year). Effectiveness measured via tabletop after-action reports — target time-to-acknowledge <5 min, time-to-mitigate <30 min for Sev-1. Director of Security Operations owns the program.
    attested_by: "DRAFT — your-vp-security@example.com"
    attested_at: "DRAFT — YYYY-MM-DD"
    reviewed_at: "DRAFT — YYYY-MM-DD"
    next_review: "DRAFT — YYYY-MM-DD (recommend 6-month review cadence)"
    supporting_docs:
      - "DRAFT — ./policies/your-runbook.pdf"
      - "DRAFT — https://wiki.your-company.example/path-to-relevant-docs"
