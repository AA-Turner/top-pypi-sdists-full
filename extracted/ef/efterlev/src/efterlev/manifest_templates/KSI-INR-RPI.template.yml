ksi: KSI-INR-RPI
name: "Reviewing Past Incidents"

_template_help:
  description: >
    KSI-INR-RPI reviews past incidents for patterns or vulnerabilities. The attestation should name the cadence of pattern review, who participates, and how patterns drive preventive work.
  questions:
      - "What's the cadence of past-incident pattern review (quarterly, annual)?"
      - "Who participates (SecOps, engineering, leadership)?"
      - "How are patterns translated into preventive work (architecture changes, training updates, runbook revisions)?"
      - "Where is the pattern-review output documented?"
      - "When was the last review?"

evidence:
  - type: attestation
    statement: >
      DRAFT — Example: Quarterly past-incident pattern review by the SecOps + Platform Eng leadership. Reviews all Sev-1/Sev-2 incidents from the prior quarter, looks for common roots (process gap, tooling gap, knowledge gap), and routes preventive actions to Jira SEC-PREVENT. Output documented in security/quarterly-reviews/. Last review: 2026-04-10.
    attested_by: "DRAFT — your-vp-security@example.com"
    attested_at: "DRAFT — YYYY-MM-DD"
    reviewed_at: "DRAFT — YYYY-MM-DD"
    next_review: "DRAFT — YYYY-MM-DD (recommend 6-month review cadence)"
    supporting_docs:
      - "DRAFT — ./policies/your-runbook.pdf"
      - "DRAFT — https://wiki.your-company.example/path-to-relevant-docs"
