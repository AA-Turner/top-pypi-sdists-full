ksi: KSI-AFR-SCN
name: "Significant Change Notifications"

_template_help:
  description: >
    KSI-AFR-SCN tracks significant changes to the cloud service offering and notifies FedRAMP per the SCN process. The attestation should name what counts as significant, how changes are tracked, and the notification channel.
  questions:
      - "What change categories count as 'significant' for FedRAMP SCN purposes?"
      - "Where are significant changes logged (change-management system, ticketing)?"
      - "Who reviews proposed changes for SCN-applicability?"
      - "What's the notification channel and timeline to FedRAMP?"
      - "Where is your SCN process documented internally?"

evidence:
  - type: attestation
    statement: >
      DRAFT — Example: Significant changes (defined in compliance/scn-categories.md) are tracked in our change-management system (Jira CR project). The Compliance Officer reviews each CR for SCN-applicability; FedRAMP-significant changes go to the FedRAMP PMO via the FedRAMP Secure Repository within 30 days of approval per SCN guidance.
