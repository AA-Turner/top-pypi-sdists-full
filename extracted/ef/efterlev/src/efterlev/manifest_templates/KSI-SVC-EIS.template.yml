# KSI-SVC-EIS — Evaluating and Improving Security
#
# DRAFT — this is a starter-pack template. Copy it to
# `.efterlev/manifests/<ksi-id>.yml` (drop the `.template` suffix) and
# fill in the DRAFT placeholders before letting it land in your
# attestation pipeline. The `_template_help` block carries the
# questions you should answer; remove that block once filled in.

ksi: KSI-SVC-EIS
name: "Evaluating and Improving Security"

_template_help:
  description: >
    KSI-SVC-EIS is the meta-procedural commitment to PERSISTENTLY evaluate information resources for security-improvement opportunities and IMPLEMENT improvements based on that evaluation. Distinct from KSI-SVC-PRR (post-change residual-risk review): this KSI is the proactive scan-the-environment-for-things-to-improve loop, not the react-to-a-change loop. Per DECISIONS 2026-05-07 'Tier 1 #4 design', classified procedural-only — the controls span technical families (CM-*, SC-*, SI-*, SR-*) but the KSI is fundamentally about HAVING an improvement program, not about any one configuration.
  questions:
      - "What ongoing evaluation surfaces feed the improvement queue (Security Hub findings, AWS Config drift, internal red-team output, dependency-vuln scans, customer-reported security findings, threat-model reviews)?"
      - "Who owns the improvement queue (named role or team)?"
      - "What's the cadence for triage + prioritization (sprint planning, monthly security review)?"
      - "How are improvements committed to and tracked (Jira epic, OKR, security-roadmap doc)?"
      - "What metrics signal the program's health (mean-time-to-remediate by severity, backlog age, % findings closed within SLA)?"
      - "Where is the program documented? When was it last reviewed?"

evidence:
  - type: attestation
    statement: >
      DRAFT — Example: Security improvement program owned by the Security Eng team lead. Inputs: AWS Security Hub (continuous), AWS Config drift (continuous), Snyk dep-vuln scans (per-PR + nightly), quarterly internal red-team, customer security-disclosure intake at security@example.com. Triage weekly in the Security stand-up; prioritized items become Jira SEC-EIS tickets with severity-based SLAs (Sev-1: 7d, Sev-2: 30d, Sev-3: 90d). Quarterly metrics review in the Security & Compliance steering committee. Program documented at runbooks/security-improvement-program.md; reviewed annually. Last metrics review: 2026-04-22.
