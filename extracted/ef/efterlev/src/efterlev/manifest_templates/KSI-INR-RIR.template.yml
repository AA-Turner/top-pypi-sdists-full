ksi: KSI-INR-RIR
name: "Reviewing Incident Response Procedures"

_template_help:
  description: >
    KSI-INR-RIR persistently reviews the effectiveness of documented incident-response procedures. The attestation should name the IR runbook, the review cadence, and what triggers an IR-procedure update.
  questions:
      - "Where is the IR runbook documented?"
      - "What's the regular review cadence (annual, semi-annual)?"
      - "What triggers an out-of-cycle IR-procedure update (new incident type, AAR finding, regulatory change)?"
      - "Who owns the runbook + reviews?"
      - "When was the last full review?"

evidence:
  - type: attestation
    statement: >
      DRAFT — Example: IR runbook at runbooks/incident-response.md. Reviewed semi-annually by the IR program owner (Director of Security Operations) + after every Sev-1 incident. Lessons-learned action items from AARs (KSI-INR-AAR) drive interim updates. Last full review: 2026-03-15.
    attested_by: "DRAFT — your-vp-security@example.com"
    attested_at: "DRAFT — YYYY-MM-DD"
    reviewed_at: "DRAFT — YYYY-MM-DD"
    next_review: "DRAFT — YYYY-MM-DD (recommend 6-month review cadence)"
    supporting_docs:
      - "DRAFT — ./policies/your-runbook.pdf"
      - "DRAFT — https://wiki.your-company.example/path-to-relevant-docs"
