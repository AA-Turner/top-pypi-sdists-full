ksi: KSI-AFR-PVA
name: "Persistent Validation and Assessment"

_template_help:
  description: >
    KSI-AFR-PVA persistently validates the effectiveness of security decisions and policies in alignment with the FedRAMP 20x Persistent Validation and Assessment process. The attestation should name your validation cadence, the tooling, and how findings are tracked.
  questions:
      - "What automated tooling persistently validates your security posture (this Efterlev pipeline, AWS Config, etc.)?"
      - "What's the cadence — every commit, daily, weekly?"
      - "Who reviews validation results and on what schedule?"
      - "How are findings tracked through to remediation?"
      - "Where is your PVA process documented internally?"

evidence:
  - type: attestation
    statement: >
      DRAFT — Example: Efterlev runs on every PR via .github/workflows/pr-compliance-scan.yml; AWS Config rules + Security Hub findings reviewed weekly by the SecOps team. All findings routed to Jira project SEC-PVA with SLAs by severity (Critical: 7 days, High: 30 days). Process documented at compliance/pva-procedure.md.
