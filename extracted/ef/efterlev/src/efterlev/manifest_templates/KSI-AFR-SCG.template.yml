ksi: KSI-AFR-SCG
name: "Secure Configuration Guide"

_template_help:
  description: >
    KSI-AFR-SCG develops Secure Configuration Guides for customer-facing configuration of the cloud service. The attestation should name where the guides live, what they cover, and how they're kept current.
  questions:
      - "Where are your customer-facing secure-configuration guides published?"
      - "What configuration areas do they cover (network, IAM, logging, encryption)?"
      - "Who owns the guides and reviews them for accuracy?"
      - "How are customers notified when guides update?"
      - "When was the last full review?"

