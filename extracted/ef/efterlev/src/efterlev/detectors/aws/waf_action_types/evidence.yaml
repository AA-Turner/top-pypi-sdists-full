detector_id: aws.waf_action_types

evidence_shape:
  resource_type: string         # always "aws_wafv2_web_acl"
  resource_name: string         # the Terraform logical name
  web_acl_name: string          # resolved or literal `name` attribute
  rule_state: enum              # "enforcing" | "observing_only" | "mixed"
  pattern: enum                 # "wafv2_web_acl_action_types"
  rule_count: int               # total rule blocks declared
  enforcing_rule_count: int     # count of rules with enforcing actions
  observing_rule_count: int     # count of rules with count-only actions
  enforcing_rule_names: list    # rule names classified as enforcing
  observing_rule_names: list    # rule names classified as observing
  detail: string?               # short description (enforcing/mixed only)
  gap: string?                  # present only on observing_only evidence
