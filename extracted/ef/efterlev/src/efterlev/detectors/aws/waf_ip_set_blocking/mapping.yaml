detector_id: aws.waf_ip_set_blocking

ksis:
  - id: KSI-CNA-RVP
    name: "Reviewing Protections"
    coverage: partial
    notes: >
      Evidences whether each `aws_wafv2_web_acl` references at least
      one IP-set blocklist via `statement.ip_set_reference_statement`.
      IP-set references typically point at an `aws_wafv2_ip_set`
      resource by ARN, giving the boundary an explicit network-layer
      access-enforcement primitive distinct from the bulk OWASP
      coverage managed groups provide. 7th detector evidencing
      KSI-CNA-RVP after Tier 3 #1 + Tier 3 #3 PR beta. Per the
      DECISIONS entry, per-Web-ACL emission (NOT per-rule). Does NOT
      evidence whether the underlying IP-set is current, whether the
      IP-set's scope is appropriate, or whether the rule's action
      enforces (a rule with override_action.count on an IP-set match
      logs without blocking -- aws.waf_action_types covers that
      dimension).

controls:
  - id: SC-5
    evidence_type: infrastructure
    coverage: partial
    notes: >
      Denial of Service Protection -- IP-set blocking complements
      rate-based statements at the source-IP layer. AWS-managed bad-IP
      feeds (AWSManagedRulesAmazonIpReputationList,
      AWSManagedRulesAnonymousIpList) and customer threat-intel lists
      give the boundary explicit blocklist coverage. Joins SC-5
      evidence from `aws.waf_rule_count`, `aws.waf_rate_limiting`,
      `aws.waf_action_types`, and `aws.cna_dos_protection`.
  - id: AC-3
    evidence_type: infrastructure
    coverage: partial
    notes: >
      Access Enforcement -- IP-set blocking IS access enforcement at
      the network layer. First WAF-family detector to evidence AC-3
      at the IaC layer. The mapping is honest: an
      ip_set_reference_statement with a block action is the
      AWS-native primitive that enforces access control by source IP,
      independent of any application-layer authentication or
      authorization. Does NOT prove the IP-set's contents are
      appropriate -- a stale or empty IP-set provides no
      enforcement.
