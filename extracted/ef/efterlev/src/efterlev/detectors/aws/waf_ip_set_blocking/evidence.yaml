detector_id: aws.waf_ip_set_blocking

evidence_shape:
  resource_type: string         # always "aws_wafv2_web_acl"
  resource_name: string         # the Terraform logical name
  web_acl_name: string          # resolved or literal `name` attribute
  rule_state: enum              # "ip_set_blocking_present" | "ip_set_blocking_absent"
  pattern: enum                 # "wafv2_web_acl_ip_set_blocking"
  ip_set_count: int             # number of ip_set_reference_statement references
  ip_set_arns: list             # list of arn strings (typically Terraform interpolations)
  detail: string?               # short description (ip_set_blocking_present only)
  gap: string?                  # present only on ip_set_blocking_absent evidence
