detector_id: aws.svc_at_rest_encryption_coverage

ksis:
  - id: KSI-SVC-PRR
    name: "Preventing Residual Risk"
    coverage: partial
    notes: >
      Evidences IaC-declared encryption-at-rest configuration on data
      stores NOT covered by the existing per-service encryption
      detectors: DynamoDB tables, EFS file systems, ElastiCache clusters
      and replication groups, Aurora / Neptune / DocumentDB clusters.
      KSI-SVC-PRR's "persistently review … the state of information
      resources after making changes" half is procedural — manifest
      territory; this detector covers the configured-state half.

controls:
  - id: SC-4
    evidence_type: infrastructure
    coverage: partial
    notes: >
      Information in Shared System Resources — encryption-at-rest is
      the canonical residual-data-protection mechanism on shared
      block storage and managed datastores.
