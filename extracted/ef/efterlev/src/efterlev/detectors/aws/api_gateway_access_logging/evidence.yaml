detector_id: aws.api_gateway_access_logging

evidence_shape:
  resource_type: string         # "aws_api_gateway_stage" | "aws_apigatewayv2_stage"
  resource_name: string         # the Terraform logical name
  stage_name: string            # resolved or literal stage_name
  logging_state: enum           # "configured" | "absent"
  pattern: enum                 # "rest_api_v1_stage_access_logs" | "http_api_v2_stage_access_logs"
  destination_arn: string?      # the declared log destination (configured only)
  format_present: bool?         # true when access_log_settings.format is set (configured only)
  detail: string?               # short description (configured only)
  gap: string?                  # present only on absent evidence
