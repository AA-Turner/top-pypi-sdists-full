detector_id: aws.api_gateway_waf_attached

evidence_shape:
  resource_type: string                # "aws_api_gateway_stage" | "aws_apigatewayv2_stage"
  resource_name: string                # the Terraform logical name
  stage_name: string                   # resolved or literal stage_name / name
  waf_state: enum                      # "waf_attached" | "waf_absent"
  pattern: enum                        # "rest_api_v1_stage_waf" | "http_api_v2_stage_waf"
  association_resource_name: string?   # waf_attached only -- the matching association's TF name
  web_acl_arn: string?                 # waf_attached only -- the declared web_acl_arn
  detail: string?                      # waf_attached only
  gap: string?                         # waf_absent only
