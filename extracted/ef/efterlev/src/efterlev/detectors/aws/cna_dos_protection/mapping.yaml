detector_id: aws.cna_dos_protection

ksis:
  - id: KSI-CNA-RVP
    name: "Reviewing Protections"
    coverage: partial
    notes: >
      Evidences IaC-declared DoS protections — WAFv2 web ACLs (with
      rate-based rule detection), classic WAF web ACLs, WAF attachments
      to load balancers / CloudFront / API Gateway, and AWS Shield
      Advanced subscriptions on specific resources. Does not evidence
      the procedural review cadence ("persistently review the
      effectiveness") — that's manifest territory; this detector covers
      the configured-state half of the partial mapping.

controls:
  - id: SC-5
    evidence_type: infrastructure
    coverage: partial
    notes: >
      Denial of Service Protection. WAF + Shield are the AWS-native
      surface for SC-5 at the application + edge layer.
  - id: SI-8
    evidence_type: infrastructure
    coverage: partial
    notes: >
      Spam Protection — WAF managed rule groups (e.g., AWS-AWSManagedRulesAnonymousIpList)
      contribute. Detector surfaces the WAF presence; rule-content
      analysis is left for downstream agents.
