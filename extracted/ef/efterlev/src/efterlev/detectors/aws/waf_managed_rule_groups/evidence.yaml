detector_id: aws.waf_managed_rule_groups

evidence_shape:
  resource_type: string         # always "aws_wafv2_web_acl"
  resource_name: string         # the Terraform logical name
  web_acl_name: string          # resolved or literal `name` attribute
  rule_state: enum              # "managed_groups_present" | "managed_groups_absent"
  pattern: enum                 # "wafv2_web_acl_managed_rule_groups"
  managed_group_count: int      # number of managed_rule_group_statement references
  managed_group_names: list     # list of group names (e.g. AWSManagedRulesCommonRuleSet)
  detail: string?               # short description (managed_groups_present only)
  gap: string?                  # present only on managed_groups_absent evidence
