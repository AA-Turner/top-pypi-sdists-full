detector_id: aws.lambda_vpc_isolation

ksis:
  - id: KSI-CNA-MAT
    name: "Minimizing Attack Surface"
    coverage: partial
    notes: >
      Evidences whether each `aws_lambda_function` declares a
      `vpc_config` block (network-isolated execution) or runs in the
      AWS-managed default VPC pool (internet-facing). The Lambda
      dimension joins the existing security_group_open_ingress,
      nacl_*, s3_public_access_block, rds_public_accessibility, and
      s3_bucket_public_acl detectors that evidence this KSI on other
      surfaces. Per the DECISIONS entry, the detector emits per-
      resource posture; the Gap Agent reasons about whether
      internet_facing is intentional (webhook handler, public health
      endpoint) or a gap. Does not evidence runtime traffic actually
      routing through the VPC, security-group egress rules, or
      whether the subnets are themselves private.

controls:
  - id: SC-7
    evidence_type: infrastructure
    coverage: partial
    notes: >
      Boundary Protection -- VPC isolation is the Lambda-side half
      of declaring a network boundary. A function in vpc_config
      executes in customer-controlled subnets with security-group
      egress rules; a function without vpc_config executes in the
      AWS-managed pool with internet egress.
  - id: SC-7(3)
    evidence_type: infrastructure
    coverage: partial
    notes: >
      Access Points -- the vpc_config declaration restricts the
      function's egress to subnets the customer controls, narrowing
      the access-point set the boundary expects.
