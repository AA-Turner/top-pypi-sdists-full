detector_id: aws.encryption_s3_at_rest

# DECISIONS 2026-04-21 (Option C): SC-28 has no FRMR KSI in 0.9.43-beta,
# so this detector declares ksis empty rather than fudging a mapping.
ksis:
  - id: KSI-AFR-UCM
    coverage: partial
    notes: >
      v0.1.42 mapping (DECISIONS 2026-05-08 Tier 1 #4.1): S3 bucket-
      default encryption evidences AT-REST cryptographic-module use
      (FIPS-validated AWS KMS by default in commercial regions).
      Pre-v0.1.42 this detector declared ksis=[] because SC-28 has no
      direct FRMR KSI mapping in 0.9.43-beta; UCM was correctly
      classified procedural-only at v0.1.34 but the 2026-05-08
      re-classification audit identified the IaC angle. Does not
      evidence key management practices, rotation, BYOK, or runtime
      enforcement on already-deployed objects.

controls:
  - id: SC-28
    enhancements: [SC-28(1)]
    evidence_type: infrastructure
    coverage: partial
    notes: >
      Infrastructure-layer evidence only. The detector confirms that S3
      bucket-default encryption is configured in Terraform; it does not
      evidence key management practices, rotation, BYOK, or runtime
      enforcement on already-deployed objects. Those belong to SC-12 / SC-13
      territory and require procedural evidence beyond what the source can
      show.
