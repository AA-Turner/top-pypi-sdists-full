detector_id: aws.rpl_backup_configured

ksis:
  - id: KSI-RPL-ARP
    name: "Aligning Recovery Plan"
    coverage: partial
    notes: >
      Evidences IaC-declared recovery-plan primitives — AWS Backup
      plans (with cross-region copy detection), backup vaults
      (preferring CMK-encrypted), backup selections, and RDS
      automated-backup cross-region replication. Distinct from
      `aws.backup_retention_configured` (KSI-RPL-ABO + CP-9, RDS
      retention + S3 versioning) — this detector covers the
      orchestration + alternate-site half of the recovery plan.
      Procedural review of objective alignment ("persistently review
      the alignment with defined recovery objectives") remains
      manifest territory.

controls:
  - id: CP-7
    evidence_type: infrastructure
    coverage: partial
    notes: >
      Alternate Processing Site — cross-region backup copies and
      RDS automated-backups replication signal a configured alt-
      site capability.
  - id: CP-10
    evidence_type: infrastructure
    coverage: partial
    notes: >
      System Recovery and Reconstitution — AWS Backup plans
      orchestrate the recovery primitives; their existence is the
      configured-state signal.
