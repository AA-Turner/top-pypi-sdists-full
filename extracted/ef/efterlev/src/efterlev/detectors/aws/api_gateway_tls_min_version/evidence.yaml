detector_id: aws.api_gateway_tls_min_version

evidence_shape:
  resource_type: string         # "aws_api_gateway_domain_name" | "aws_apigatewayv2_domain_name"
  resource_name: string         # the Terraform logical name
  tls_min_state: enum           # "configured" | "absent" | "unverifiable"
  pattern: enum                 # "rest_api_v1_custom_domain" | "http_api_v2_custom_domain"
  security_policy: string       # the resolved or declared policy (TLS_1_0, TLS_1_2, etc.)
  detail: string?               # short description (configured / unverifiable)
  gap: string?                  # present only on absent evidence
