detector_id: aws.api_gateway_tls_min_version

ksis:
  - id: KSI-SVC-SNT
    name: "Securing Network Traffic"
    coverage: partial
    notes: >
      Evidences whether each `aws_api_gateway_domain_name` (REST API
      v1) or `aws_apigatewayv2_domain_name` (HTTP/WebSocket API v2)
      enforces a TLS-1.2-or-higher security policy on its custom
      domain. v1 defaults to `TLS_1_0` when the attribute is omitted —
      that's the canonical legacy gap. v2 only supports `TLS_1_2`,
      so the detector treats absence within an existing
      `domain_name_configuration` block as configured. Does not
      evidence runtime cipher negotiation outcomes, the underlying
      CloudFront edge's adherence to the configured policy,
      certificate rotation, or backend-integration TLS posture.

controls:
  - id: SC-8
    evidence_type: infrastructure
    coverage: partial
    notes: >
      Transmission Confidentiality and Integrity at the IaC layer —
      the configured TLS-policy floor on the custom domain.
  - id: SC-13
    evidence_type: infrastructure
    coverage: partial
    notes: >
      Cryptographic Protection — TLS_1_2+ floor implies the negotiated
      ciphersuite excludes TLS 1.0 / 1.1's known-weak primitives.
  - id: SC-23
    evidence_type: infrastructure
    coverage: partial
    notes: >
      Session Authenticity — TLS_1_2+ provides session-level integrity
      protections that TLS 1.0 does not.
