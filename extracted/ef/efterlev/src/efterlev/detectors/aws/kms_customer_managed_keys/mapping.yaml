detector_id: aws.kms_customer_managed_keys

ksis:
  - KSI-SVC-ASM
  - id: KSI-AFR-UCM
    coverage: partial
    notes: >
      v0.1.42 mapping (DECISIONS 2026-05-08 Tier 1 #4.1): Customer-
      managed KMS keys evidence FIPS-validated cryptographic-module
      use (AWS KMS HSMs are FIPS 140-2 Level 3 validated). Does not
      prove BYOK provenance, cross-region replication of CMK state,
      or that all data is actually encrypted with the CMK (the
      encryption_* and kms_key_rotation detectors evidence those
      facets independently).

controls:
  - id: SC-12
    evidence_type: infrastructure
    coverage: partial
    notes: >
      Customer-managed-key inventory. Declares that CMKs are present
      and serve as the cryptographic primitives the workload uses.
      Pairs with `aws.kms_key_rotation` for the rotation-policy half
      of SC-12 evidence.
