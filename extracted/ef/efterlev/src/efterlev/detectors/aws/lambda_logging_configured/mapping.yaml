detector_id: aws.lambda_logging_configured

ksis:
  - id: KSI-MLA-LET
    name: "Logging Event Types"
    coverage: partial
    notes: >
      Evidences whether each `aws_lambda_function` has a corresponding
      `aws_cloudwatch_log_group` declared in IaC. Lambda auto-creates
      log groups on first invoke when the execution role has
      `logs:CreateLogGroup`, but auto-created groups have no
      retention policy and no KMS encryption — only an explicit
      resource declaration gates those properties. Does not evidence
      log retention duration, KMS-key configuration on the log group,
      runtime log flow, log access control, or shipping to a SIEM.

controls:
  - id: AU-2
    evidence_type: infrastructure
    coverage: partial
    notes: >
      Event Logging at the IaC layer — declares the log destination
      that holds Lambda invocation records. Per-function granularity
      across the boundary; does not enumerate which event types the
      function code emits.
  - id: AU-12
    evidence_type: infrastructure
    coverage: partial
    notes: >
      Audit Record Generation — gates the existence of a managed log
      group per function. Auto-created groups satisfy generation but
      not the durability/retention/access requirements compliance
      frameworks ask for.
