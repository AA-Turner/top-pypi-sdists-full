detector_id: aws.waf_rule_count

evidence_shape:
  resource_type: string         # always "aws_wafv2_web_acl"
  resource_name: string         # the Terraform logical name
  web_acl_name: string          # resolved or literal `name` attribute
  rule_state: enum              # "rules_present" | "rules_absent"
  pattern: enum                 # "wafv2_web_acl_rule_count"
  rule_count: int               # count of rule blocks declared
  detail: string?               # short description (rules_present only)
  gap: string?                  # present only on rules_absent evidence
