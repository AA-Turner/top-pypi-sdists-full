detector_id: aws.waf_geo_blocking

ksis:
  - id: KSI-CNA-RVP
    name: "Reviewing Protections"
    coverage: partial
    notes: >
      Evidences whether each `aws_wafv2_web_acl` references at least
      one `statement.geo_match_statement`. Geo-match rules block
      traffic from a list of country codes (ISO 3166-1 alpha-2),
      giving the boundary an explicit perimeter-side
      access-enforcement primitive distinct from the bulk OWASP
      coverage managed groups provide. 8th detector evidencing
      KSI-CNA-RVP after Tier 3 #1 + #3. Per the DECISIONS entry,
      per-Web-ACL emission (NOT per-rule). Two states (binary):
      the intentional-vs-unintentional axis is workload-context-
      dependent and belongs in the Gap Agent, not the detector.
      Does NOT evidence whether the country_codes list is
      appropriate (an empty list provides no protection; a list
      missing sanctioned regions provides only token coverage), or
      whether the rule action enforces (a geo_match with
      override_action.count is observability without enforcement
      -- aws.waf_action_types covers that).

controls:
  - id: SC-7
    evidence_type: infrastructure
    coverage: partial
    notes: >
      Boundary Protection -- geo-blocking IS the canonical
      perimeter-side boundary control at the country level. First
      WAF-family detector to evidence SC-7 at the IaC layer; the
      existing SC-7 evidence base (security_group_open_ingress,
      nacl_open_egress, nacl_restrictiveness, vpc_logical_segmentation,
      etc.) is heavily VPC-internal. Geo-blocking adds the
      public-internet-perimeter evidence.
  - id: AC-3
    evidence_type: infrastructure
    coverage: partial
    notes: >
      Access Enforcement at the geographic layer. Generalizes the
      IP-layer mapping that aws.waf_ip_set_blocking earned in
      Tier 3 #3, up one layer of the network stack: a
      geo_match_statement with a block action enforces access
      control by source country, independent of any
      application-layer authentication or authorization. Does NOT
      prove the country list is current or appropriate to the
      workload's customer geography.
