detector_id: aws.cna_optimizing_for_availability

evidence_shape:
  resource_type: string        # e.g. "aws_db_instance", "aws_autoscaling_group"
  resource_name: string        # the Terraform logical name
  availability_state: enum     # "configured" | "absent"
  pattern: enum                # "multi_az" | "read_replica" | "s3_replication"
                               # | "asg_multi_az" | "ecs_service_spread"
  detail: string?              # short human-readable detail (e.g. AZ count)
  gap: string?                 # present only on absent evidence
