detector_id: aws.cna_optimizing_for_availability

ksis:
  - id: KSI-CNA-OFA
    name: "Optimizing for Availability"
    coverage: partial
    notes: >
      Evidences the IaC-declared availability primitives — multi-AZ
      databases, multi-AZ autoscaling groups, RDS read replicas, S3
      cross-region replication, EFS mount targets across AZs — that
      contribute to KSI-CNA-OFA's "high availability and rapid
      recovery" outcome. Does not evidence runtime failover behavior,
      RTO/RPO measurement, or backup-restore validation (those are
      adjacent KSIs and procedural reviews).

# KSI-CNA-OFA has no mapped 800-53 controls in FRMR 0.9.43-beta;
# this detector therefore declares controls=[] explicitly. The KSI
# is the only mapping.
controls: []
