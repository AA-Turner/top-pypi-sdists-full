detector_id: aws.waf_rate_limiting

evidence_shape:
  resource_type: string         # always "aws_wafv2_web_acl"
  resource_name: string         # the Terraform logical name
  web_acl_name: string          # resolved or literal `name` attribute
  rule_state: enum              # "rate_limiting_present" | "rate_limiting_absent"
  pattern: enum                 # "wafv2_web_acl_rate_limiting"
  rate_limit_count: int         # number of rate_based_statement references
  rate_limits: list             # list of {limit: int, aggregate_key_type: string} dicts
  detail: string?               # short description (rate_limiting_present only)
  gap: string?                  # present only on rate_limiting_absent evidence
