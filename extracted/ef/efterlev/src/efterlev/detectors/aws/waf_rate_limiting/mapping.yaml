detector_id: aws.waf_rate_limiting

ksis:
  - id: KSI-CNA-RVP
    name: "Reviewing Protections"
    coverage: partial
    notes: >
      Evidences whether each `aws_wafv2_web_acl` declares at least one
      `rate_based_statement` rule. Rate-based statements cap the
      number of requests a single client (or custom-key bucket) can
      make in a 5-minute window, providing the primary L7 DOS defense
      the Web ACL has independent of upstream infrastructure
      (CloudFront, Shield, ALB). Joins `aws.waf_rule_count`,
      `aws.waf_managed_rule_groups`, `aws.cna_dos_protection`, and
      `aws.api_gateway_waf_attached` on this KSI. Per the DECISIONS
      entry, per-Web-ACL emission (NOT per-rule). Does NOT evidence
      whether the limit value is appropriate (a 1M req/5-min cap is
      observability without enforcement under realistic abuse), the
      aggregate-key type is right (IP can be bypassed by botnets;
      FORWARDED_IP is required behind a proxy), or scope-down
      statements aren't gating the cap to a tiny endpoint set --
      those dimensions are future `aws.waf_*` family detectors.

controls:
  - id: SC-5
    evidence_type: infrastructure
    coverage: partial
    notes: >
      Denial of Service Protection -- rate-based statements are the
      direct AWS-native rate-limit primitive at L7. Joins SC-5 evidence
      from `aws.cna_dos_protection` (Shield + CloudFront posture),
      `aws.waf_rule_count` (any rules at all), and SC-5(2) on this
      detector for capacity/redundancy semantics.
  - id: "SC-5(2)"
    evidence_type: infrastructure
    coverage: partial
    notes: >
      Capacity, Bandwidth, and Redundancy -- rate caps prevent a
      single client from exhausting the Web ACL's effective bandwidth
      allocation. The 5-minute window + per-key aggregation matches
      the "manage capacity in a way that limits the effects of DoS"
      objective. Does NOT prove the limit is tuned to the workload's
      actual capacity ceiling.
