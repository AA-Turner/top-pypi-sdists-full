detector_id: aws.waf_custom_rule_groups

evidence_shape:
  resource_type: string         # always "aws_wafv2_web_acl"
  resource_name: string         # the Terraform logical name
  web_acl_name: string          # resolved or literal `name` attribute
  rule_state: enum              # "custom_rule_groups_present" | "custom_rule_groups_absent"
  pattern: enum                 # "wafv2_web_acl_custom_rule_groups"
  referenced_arn_count: int     # number of distinct rule_group_reference_statement ARNs
  referenced_arns: list         # deduplicated list of referenced ARN strings (typically Terraform interpolations)
  defined_rule_groups: list     # sorted list of aws_wafv2_rule_group resource names found in scope (regardless of references)
  detail: string?               # short description (custom_rule_groups_present only)
  gap: string?                  # present only on custom_rule_groups_absent evidence
