detector_id: github.piy_sdlc_security_gates

ksis:
  - id: KSI-PIY-RSD
    name: "Reviewing Security in the SDLC"
    coverage: partial
    notes: >
      Evidences IaC-declared SDLC security gates in
      `.github/workflows/*.yml`: CodeQL static analysis, dependency
      review, secret scanning (TruffleHog, Gitleaks). Each workflow is
      reported per-gate so a customer can see which protections are
      configured. KSI-PIY-RSD's "persistently review the effectiveness"
      half is procedural — manifest territory; this detector covers
      the configured-gate half.

controls:
  - id: SA-3
    evidence_type: infrastructure
    coverage: partial
    notes: >
      System Development Life Cycle — security gates IN the SDLC are
      the canonical SA-3 evidence at the IaC layer.
  - id: SA-8
    evidence_type: infrastructure
    coverage: partial
    notes: >
      Security and Privacy Engineering Principles — running CodeQL +
      dependency review + secret scanning in CI is direct
      Secure-by-Design alignment.
