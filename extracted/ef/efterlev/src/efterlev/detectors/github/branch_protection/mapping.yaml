detector_id: github.branch_protection

ksis:
  - id: KSI-PIY-RSD
    name: "Reviewing Security in the SDLC"
    coverage: partial
    notes: >
      Evidences whether each `github_branch_protection` resource
      enforces a meaningful merge-time gate (required reviews,
      required status checks, or enforce_admins). Joins
      `github.piy_sdlc_security_gates` on this KSI -- workflow
      gates run on PRs; branch protection enforces that PRs
      require those gates to pass before merge. Together they
      cover the configured-gate half of KSI-PIY-RSD's `partial`
      classification at both the workflow layer and the merge-
      enforcement layer. Does NOT evidence whether review counts
      are appropriate (count=0 is meaningless), whether the
      contexts list covers the relevant CI workflows, or whether
      the rule's pattern matches the actually-protected branches.

controls:
  - id: SA-15
    evidence_type: infrastructure
    coverage: partial
    notes: >
      Development Process / Standards and Tools -- branch protection
      rules ARE the canonical "tooling-enforced standards" mechanism
      at the source-control layer. SA-15 evidence at the IaC layer
      benefits from the rule's IaC declaration; runtime SA-15
      (the actual review process) is procedural.
  - id: CM-2
    evidence_type: infrastructure
    coverage: partial
    notes: >
      Baseline Configuration -- the branch protection rule IS the
      baseline configuration for "what gates a PR-to-main must
      pass". An enforced branch protection rule with required
      reviews + required status checks is the canonical CM-2
      evidence at the source-control layer.
