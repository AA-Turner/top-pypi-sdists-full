detector_id: github.branch_protection

evidence_shape:
  resource_type: string                       # always "github_branch_protection"
  resource_name: string                       # the Terraform logical name
  protected_branch_pattern: string            # e.g. "main", "release/*"
  rule_state: enum                            # "protections_present" | "protections_absent"
  pattern: enum                               # "github_branch_protection"
  has_required_status_checks: bool
  has_required_pull_request_reviews: bool
  enforce_admins: bool
  required_review_count: int                  # max across review blocks (or 0)
  required_status_check_count: int            # total contexts across status_check blocks
  detail: string?                             # short description (protections_present only)
  gap: string?                                # present only on protections_absent evidence
