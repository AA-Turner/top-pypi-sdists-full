[build-system]
requires = [
    "setuptools>=67.6.1",
    "Cython==3.0.11",
    "wheel>=0.44.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "flowtask"
dynamic = ["version"]
description = "Framework for Task orchestration"
authors = [
    {name = "Jesus Lara", email = "jesuslarag@gmail.com"}
]
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11,<3.14"
keywords = ["Flowtask", "Data Integration", "Task Orchestration", "Task-Runner", "Pipelines"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Framework :: AsyncIO",
]

dependencies = [
    "borax==3.5.0",
    "PyDrive==1.3.1",
    "chardet==5.2.0",
    "aiohttp-jinja2==1.6",
    "asyncssh[bcrypt,fido2,pkcs11,pyopenssl]==2.23.0",
    "pyxlsb==1.0.10",
    "python-calamine==0.2.3",
    "pyecharts==2.0.8",
    "selenium>=4.35.0",
    "snapshot-selenium==0.0.2",
    "httpx[socks,http2]>=0.26.0",
    "urllib3[socks]>=2.3.0",
    "requests>=2.33.0,<2.34",
    "h2>=4.2.0",
    "blinker>=1.9.0",
    "webdriver-manager==4.0.2",
    "aioimaplib==1.1.0",
    "adal==1.2.7",
    "xlrd>=2.0.2",
    "xmltodict>=0.14.2,<1.0.0",
    "zeep[async]>=4.3.3",
    "nltk>=3.9.3",
    "jdcal==1.4.1",
    "html5lib==1.1",
    "shapely>=2.1.2",
    "tzwhere==3.0.3",
    "tabulate==0.9.0",
    "python-magic==0.4.27",
    "pytomlpp==1.0.13",
    "psutil==7.2.2",
    "networkx>=3.4.1",
    "watchdog>=6.0.0",
    "hachiko==0.4.0",
    "paramiko>=4.0.0",
    "jira==3.10.5",
    "datatable==1.1.0",
    "imageio==2.37.0",
    "decorator>=5.1.1",
    "emoji==2.14.1",
    "Wand==0.6.13",
    "pylibdmtx==0.1.10",
    "aiofiles>=24.1.0",
    "filetype==1.2.0",
    "proxylists>=0.14.0",
    "aioftp==0.23.1",
    "py7zr==0.22.0",
    "rarfile==4.2",
    "python-pptx==1.0.2",
    "google-auth>=2.35.0",
    "google-api-python-client>=2.198.0",
    "google-cloud-language>=2.15.0",
    "googlemaps==4.10.0",
    "fastavro==1.9.7",
    "pgpy==0.6.0",
    "dropbox==12.0.2",
    "dask-expr==1.1.13",
    "jsonpath_ng==1.7.0",
    "ortools>=9.11.4210,<=9.14.6206",
    "gmqtt==0.7.0",
    "selectorlib==0.16.0",
    "playwright==1.52.0",
    "fuzzywuzzy==0.18.0",
    "praw==7.8.1",
    "prawcore==2.4.0",
    "osmnx==2.0.1",
    "osmium==4.0.2",
    "python-Levenshtein==0.26.1",
    "undetected_chromedriver==3.5.5",
    "duckduckgo-search==8.1.1",
    "numba>=0.62.1",
    "APScheduler>=3.11.0,<3.12.0",
    "google-cloud-bigquery>=3.30.0",
    "pyheif==0.8.0",
    "filetype==1.2.0",
    "exif==1.6.1",
    "pillow-avif-plugin==1.5.2",
    "pillow-heif==0.22.0",
    "pgvector==0.4.1",
    # NAV libraries - using compatible versions
    "proxylists>=0.14.0",
    "async-notify[all]>=1.4.0",
    "querysource>=3.17.0",
    "asyncdb[all]>=2.11.7",
    "navconfig[uvloop,default]>=1.7.13",
    "navigator-auth>=0.15.8",
    "navigator-api[uvloop,locale]>=2.12.22",
    "ai-parrot[llms]>=0.17.4",
    "msal>=1.30.0,<2",
    "azure-core>=1.38.0,<2",
    "azure-identity>=1.20.0,<2",
    "microsoft-kiota-authentication-azure~=1.9",
    "msgraph-sdk~=1.22",
    "zendriver>=0.15.2",
    "pyarrow>=14.0",
    # FEAT-190: SweetSpot scoring interface (flowtask/interfaces/scoring/)
    # cKDTree/BallTree-based extractors (count.py, nearest.py, gravity.py).
    #
    # Resolves spec NQ2 ("add to [dependencies] or an optional [scoring]
    # extra?") in favor of a core dependency, NOT the optional `scoring`
    # extra (unlike h3, which IS optional below): scipy/scikit-learn are
    # already imported *eagerly, at module top level* by the pre-existing
    # `flowtask/components/MarketClustering.py` (lines 17-20), a currently
    # shipped component with no lazy-import discipline of its own. Since
    # that component has no opt-in extra, scipy/scikit-learn must already be
    # present in a base `pip install flowtask` for it to work — moving them
    # to an optional extra here would not reduce anyone's install footprint,
    # it would just newly break MarketClustering for anyone who skips the
    # `scoring` extra. flowtask.interfaces.scoring itself only needs these
    # lazily (inside extractor function bodies, never at import time).
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "polyline>=2.0.4",
]



[project.optional-dependencies]
docker = [
    "aiodocker>=0.21.0",
]

k8s = [
    "kr8s>=0.16.0",
]

git = [
    "gitpython>=3.1.50",
]

scoring = [
    # FEAT-190: SweetSpot scoring interface (flowtask/interfaces/scoring/).
    # h3 powers CandidateGrid.from_h3() tessellation (spatial.py, TASK-126);
    # imported lazily so the core contract types stay importable without it.
    "h3>=4.0",
]

ai = [
    # graphindex,retrieval extras required by ParrotKnowledgeBuilder (FEAT-028).
    # graphindex → rustworkx>=0.15, tree-sitter>=0.23 (GraphAssembler, LoaderExtractor).
    # retrieval  → rank_bm25==0.2.2 (PageIndex hybrid search).
    # pageindex module only exists in ai-parrot dev 0.25.7 — enable the editable-source
    # toggle in [tool.uv.sources] below and run `uv sync --extra ai` to activate.
    "ai-parrot[llms,agents,images,graphindex,retrieval]>=0.20.4",
    "ai-parrot-loaders[youtube,audio,pdf,web,ebook,video,document,scraping,ml]>=0.1.0",
    "ai-parrot-tools[jira,pdf,slack,aws,docker,git,analysis,excel,sandbox,codeinterpreter,pulumi,sitesearch,scraping,finance,db,flowtask,google,arxiv,wikipedia,weather,messaging]>=0.1.0",
    "ai-parrot-pipelines>=0.1.0",
    "ai-parrot-server[all]>=0.1.0",
    "ai-parrot-integrations[all]>=0.0.17",
]

dev = [
    "pytest>=5.4.0",
    "coverage",
    "pytest-asyncio==0.23.8",
    "pytest-xdist==3.3.1",
    "pytest-assume==2.4.3",
    "ruff",
    "aioresponses>=0.7.8",
]

[project.scripts]
di = "flowtask.__main__:main"
task = "flowtask.__main__:main"
flowtask-docs = "flowtask.documentation.cli:main"

[project.urls]
Homepage = "https://github.com/phenobarbital/flowtask"
Source = "https://github.com/phenobarbital/flowtask"
Funding = "https://paypal.me/phenobarbital"
"Say Thanks!" = "https://saythanks.io/to/phenobarbital"

[tool.setuptools.dynamic]
version = {attr = "flowtask.__version__"}

[tool.setuptools]
include-package-data = true

# Allowlist: only the `flowtask` package and its subpackages are part of the distribution.
# Everything else at the repo root (sdd/, agents/, examples/, tests/, etc.) is for
# development only and must NOT ship to PyPI.
[tool.setuptools.packages.find]
where = ["."]
include = ["flowtask*"]
namespaces = false

[tool.setuptools.package-data]
flowtask = [
    "py.typed",
    "**/py.typed",
    "**/*.pxd",
    "**/*.pxi",
    # Curated category map + generated component schemas/docs. Shipped with
    # the wheel so the informational API can serve them from the installed
    # package without needing a separate data drop.
    "documentation/categories.json",
    "documentation/generated/index.json",
    "documentation/generated/components/*.json",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = [
    "--strict-config",
    "--strict-markers",
]
markers = [
    "integration: marks tests that require a live Postgres instance (deselect with '-m not integration')",
    "routing: marks tests that require a live Valhalla routing service (deselect with '-m not routing')",
]
filterwarnings = [
    "error",
    'ignore:The loop argument is deprecated since Python 3\.8, and scheduled for removal in Python 3\.10:DeprecationWarning:asyncio',
]

[tool.uv]
override-dependencies = [
    "pgvector==0.4.1",
    "numba==0.62.1",
    "numpy>=2.0.0,<2.4",
    "pandas>=2.3,<3",
    "cython<3.0.0",
    "emoji==2.14.1",
    "babel>=2.16.0",
    # CVE: keep requests above 2.33.x; <2.34 stays compatible with arxiv's requests pin
    "arxiv>=4.0.0",
]

[tool.mypy]
files = ["flowtask", "tests"]
check_untyped_defs = false
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disable_error_code = "annotation-unchecked"

[dependency-groups]
dev = [
    "moto[s3]>=5.2.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.23.8",
]


[tool.uv.sources]
# ── Parrot-dev editable-source toggle (local-only, NOT committed active) ────────────────
# Purpose: activate dev ai-parrot 0.25.7 which adds parrot.knowledge.pageindex
#          (absent in published 0.24.55) required by ParrotKnowledgeBuilder (FEAT-028).
#
# To enable:  uncomment the four lines below, then run:
#               uv sync --extra ai
#             Verify with:
#               python -c "import parrot.knowledge.pageindex.builder, parrot.knowledge.graphindex.assemble"
#
# To revert:  comment the lines back and run:
#               uv sync --extra ai
#
# Paths are relative to the flowtask/ repo root (../AI-BOTS/... = sibling monorepo).
# DO NOT commit these lines uncommented — they break CI and other devs without the monorepo.
#ai-parrot = { path = "../AI-BOTS/ai-parrot/packages/ai-parrot", editable = true }
#ai-parrot-loaders = { path = "../AI-BOTS/ai-parrot/packages/ai-parrot-loaders", editable = true }
#ai-parrot-tools = { path = "../AI-BOTS/ai-parrot/packages/ai-parrot-tools", editable = true }
#ai-parrot-pipelines = { path = "../AI-BOTS/ai-parrot/packages/ai-parrot-pipelines", editable = true }
