[build-system]
requires = [
    "setuptools>=67.6.1",
    "Cython==3.0.11",
    "wheel>=0.44.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "flowtask"
dynamic = ["version"]
description = "Framework for Task orchestration"
authors = [
    {name = "Jesus Lara", email = "jesuslarag@gmail.com"}
]
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11,<3.14"
keywords = ["Flowtask", "Data Integration", "Task Orchestration", "Task-Runner", "Pipelines"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Framework :: AsyncIO",
]

dependencies = [
    "borax==3.5.0",
    "PyDrive==1.3.1",
    "chardet==5.2.0",
    "aiohttp-jinja2==1.6",
    "asyncssh[bcrypt,fido2,pkcs11,pyopenssl]==2.23.0",
