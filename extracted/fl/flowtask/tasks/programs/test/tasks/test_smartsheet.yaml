name: Test SmartSheet Component
description: Download an Excel File from SmartSheet
steps:
  - DownloadFromSmartSheet:
      file_id: 7138199113518980
      file_format: application/vnd.ms-excel
      destination:
        filename: "Pokemon Master Market List {today}.xlsx"
        directory: /home/ubuntu/symbits/pokemon/files/warehouses
      masks:
        today:
          - today
          - mask: "%m%d%Y"
            tz: America/New_York
  - FileExists:
      directory: /home/ubuntu/symbits/pokemon/files/warehouses
      filename: "Pokemon Master Market List {today}.xlsx"
      masks:
        today:
          - today
          - mask: "%m%d%Y"
            tz: America/New_York
  - OpenWithPandas:
      trim: True
      drop_empty: True
      mime: application/vnd.ms-excel
      file_engine: calamine
  - TransformRows:
      fields:
        current_timestamp: "{today}"
        random_value: "{random_seed}"
        "Region":
          value:
            - trim
          conditions:
            not_null: true
        region_name:
          value: "Region"
        release_date:
          value:
            - now
        company_id:
          value:
            - fill_column
            - value: 9200
        first_dow:
          value:
            - apply_function
            - fname: first_dow
              column: release_date
        last_dow:
          value:
            - apply_function
            - fname: last_dow
              column: release_date
        city:
          - "Market"
          - split:
              separator: ","
          - trim:
              remove_empty: true
      masks:
        today:
          - today
          - mask: "%Y-%m-%d"
            tz: America/New_York
        random_seed:
          - random.randint
          - a: 1
            b: 1000
