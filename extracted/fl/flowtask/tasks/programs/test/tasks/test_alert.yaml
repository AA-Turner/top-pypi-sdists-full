name: Test Alert Event
description: Test for Alert/Threshold functionality.
events:
  publish: true
  done:
    - Alert:
        result_checks:
          - lt:
              column: "num_rows"
              value: 6253
          - equal:
              column: "num_columns"
              value: 5
        column_checks:
          - equal:
              column: "visit_category"
              values: ["Monthly"]
          - column_size:
                column: "store_name"
                min_length: 10
                max_length: 40
        stat_checks:
          - equal:
              component: "DataInput_1"
              result: 6253
steps:
  - DataInput:
      query: "SELECT * FROM hisense.stores"
      as_string: True
