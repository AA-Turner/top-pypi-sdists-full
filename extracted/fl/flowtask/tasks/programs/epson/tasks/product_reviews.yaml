name: Extract BBY Reviews
description: Extract Product Reviews from Best Buy.
steps:
  - OpenWithPandas:
      mime: "application/vnd.ms-excel"
      trim: true
      filename: brand_info.xlsx
      directory: "/home/ubuntu/symbits/epson/files/"
  - BestBuy:
      type: reviews
      use_proxies: true
      paid_proxy: true
  - SentimentAnalysis:
      text_column: review
      sentiment_model: "MarieAngeA13/Sentiment-Analysis-BERT"
      sentiment_levels: 3
      emotions_model: "AdamCodd/distilbert-base-uncased-finetuned-emotion-balanced"
  - TransformRows:
      fields:
        review_timestamp:
          value:
            - fill_current_date_midnight
        inserted_at:
          value:
            - datetime_format
            - column: availability_timestamp
            - format: "%Y%m%d"
        review_info_key:
          value:
            - concat
            - columns:
                - modelNumber
                - brand
                - origin
                - inserted_at
              separator: "_"
  - TransformRows:
      fields:
        review_timestamp:
          value:
            - to_excel_date
  - PandasToFile:
      filename: /home/ubuntu/symbits/epson/products_reviews-epson-{today}.xlsx
      mime: application/vnd.ms-excel
      masks:
        today:
          - today
          - mask: "%m%d%Y"
