[metadata]
name = flake8-no-implicit-concat
description = Flake8 plugin that forbids implicit str/bytes literal concatenations
long_description = file: README.md
long_description_content_type = text/markdown
author = 10sr
author_email = 8.slashes@gmail.com
url = https://github.com/10sr/flake8-no-implicit-concat
keywords = flake8
license = MIT
project_urls = 
	Bug Tracker = https://github.com/10sr/flake8-no-implicit-concat/issues
	Changelog = https://github.com/10sr/flake8-no-implicit-concat/blob/master/CHANGELOG.md
classifiers = 
	License :: OSI Approved :: MIT License
	Environment :: Console
	Framework :: Flake8
	Intended Audience :: Developers
	License :: OSI Approved :: MIT License
	Operating System :: OS Independent
	Programming Language :: Python :: 3
	Programming Language :: Python :: 3 :: Only
	Programming Language :: Python :: 3.10
	Programming Language :: Python :: 3.11
	Programming Language :: Python :: 3.12
	Programming Language :: Python :: 3.13
	Programming Language :: Python :: 3.14
	Programming Language :: Python :: 3.15
	Programming Language :: Python :: Implementation :: CPython
	Topic :: Software Development :: Libraries :: Python Modules
	Topic :: Software Development :: Quality Assurance

[options]
python_requires = >=3.10
packages = find:
install_requires = 
	flake8
setup_requires = 
	wheel
	setuptools_scm>=6.0

[options.entry_points]
flake8.extension = 
	NIC = flake8_no_implicit_concat:Checker

[options.package_data]
flake8_no_implicit_concat = 
	py.typed

[options.packages.find]
exclude = 
	tests

[options.extras_require]
test = 
	coverage
	codecov
lint = 
	black
	isort
	flake8
	hacking>=4
	flake8-black
	flake8-isort
	pep8-naming
	flake8-broken-line
	flake8-builtins
	flake8-2020
	flake8-docstrings
	flake8-rst-docstrings
	pydoclint[flake8]
	mypy
publish = 
	twine
	build
	setuptools

[coverage:run]
branch = True
omit = 
	tests/*
	.venv/*

[coverage:report]
exclude_lines = 
	if self.debug:
	pragma: no cover
	raise NotImplementedError
	if __name__ == .__main__.:
ignore_errors = True

[flake8]
extend-ignore = 
	E203,
	E501,
exclude = 
	.git,
	__pycache__,
	.venv,
	.mypy_cache,
	docs,
	build,
	tests/run_flake8,
	flake8_no_implicit_concat/_version.py,
style = sphinx
arg_type_hints_in_docstring = False
check_return_types = False
check_yield_types = False
allow_init_docstring = True

[isort]
force_single_line = true
line_length = 88
lines_between_types = 1

[mypy]
python_version = 3.15
platform = linux
follow_imports = normal

[egg_info]
tag_build = 
tag_date = 0

