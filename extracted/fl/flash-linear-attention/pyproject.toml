[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flash-linear-attention"
version = "0.6.0"
description = "Fast linear attention models and layers"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["fla-core==0.6.0", "transformers>=5.6.2,<6"]

[project.urls]
Homepage = "https://github.com/fla-org/flash-linear-attention"
Repository = "https://github.com/fla-org/flash-linear-attention"

[project.optional-dependencies]
cuda = ["fla-core[cuda]==0.6.0"]
rocm = ["fla-core[rocm]==0.6.0"]
xpu = ["fla-core[xpu]==0.6.0"]
npu = ["fla-core[npu]==0.6.0"]
cpu = ["fla-core[cpu]==0.6.0"]
tilelang = ["tilelang>=0.1.9"]
conv1d = ["causal-conv1d>=1.7.0"]
benchmark = ["matplotlib", "pandas", "datasets>=3.3.0"]
test = ["pytest", "pytest-xdist"]


[tool.setuptools.packages.find]
include = ["fla*"]
namespaces = true
