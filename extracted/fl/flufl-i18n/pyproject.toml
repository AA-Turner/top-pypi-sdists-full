[project]
name = 'flufl.i18n'
authors = [
    {name = 'Barry Warsaw', email = 'barry@python.org'},
]
description = 'A high level API for internationalizing Python libraries and applications'
readme = 'README.rst'
requires-python = '>=3.10'
license = {text = 'Apache-2.0'}
keywords = [
    'i18n',
    'internationalization',
]
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Development Status :: 6 - Mature',
    'Intended Audience :: Developers',
    'License :: OSI Approved :: Apache Software License',
    'Operating System :: POSIX',
    'Operating System :: MacOS :: MacOS X',
    'Operating System :: Microsoft :: Windows',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Topic :: Software Development :: Internationalization',
    'Topic :: Software Development :: Libraries',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Topic :: Software Development :: Localization',
]
dependencies = [
    'atpublic',
]
dynamic = ['version']

[dependency-groups]
docs = [
    'furo',
    'sphinx',
    'sphinx-autobuild',
    'sphinx-copybutton',
]
tests = [
    'coverage[toml]',
    'diff-cover',
    'pytest',
    'sybil[pytest]',
]

[project.urls]
'Home Page' = 'https://flufli18n.readthedocs.io'
'Documentation' = 'https://flufli18n.readthedocs.io'
'Source Code' = 'https://gitlab.com/flufl/flufl.i18n.git'
'Bug Tracker' = 'https://gitlab.com/flufl/flufl.i18n/-/work_items'

[tool.hatch.version]
path = 'src/flufl/i18n/__init__.py'

[tool.hatch.build.targets.wheel]
packages = [
    'src/flufl',
]

[tool.hatch.build.targets.sdist]
include = [
    'src/flufl/',
    'docs/',
    'tests/',
    'tools/',
    'conftest.py',
]

[tool.hatch.envs.default]
installer = 'uv'

[tool.hatch.envs.default.scripts]
all = [
    'hatch run test:run',
    'hatch run qa:qa',
    'hatch run docs:docs',
]
# Create the release tag locally; pushing it is left to you.
tag = [
    'tools/tag.py {args}',
]

[tool.hatch.envs.test]
dependency-groups = [
    'tests',
]

[tool.hatch.envs.test.scripts]
run = [
    'coverage run -m pytest {args}',
    'coverage combine',
    'coverage report',
    'coverage xml',
    '- diff-cover coverage.xml',
]

[[tool.hatch.envs.test.matrix]]
python = ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']

[tool.hatch.envs.qa]
# No dependencies: each `hatch check` subcommand runs in its own internal environment with its own
# pinned tool, so ruff and pyrefly no longer have to be installed here.

[tool.hatch.envs.qa.scripts]
qa = [
    # Backed by ruff
    'hatch check code {args:src tools}',
    'hatch check fmt {args:src tools}',
    # Backed by pyrefly
    'hatch check types {args:src tools}',
]
fix = [
    # Lint fixes first; the formatter gets the last word on layout.
    'hatch check code --fix {args:src tools}',
    'hatch check fmt --fix {args:src tools}',
]

[tool.hatch.envs.docs]
dependency-groups = [
    'docs',
]

[tool.hatch.envs.docs.scripts]
docs = [
    'sphinx-build docs build/html',
]
serve = [
    'sphinx-autobuild docs build/html --port 9000 --open-browser',
]
# Verify that every external link in the docs still resolves, including the ones the :GL: role
# builds.  This one needs the network, so it is deliberately not part of the test run.
linkcheck = [
    'sphinx-build -b linkcheck docs build/linkcheck',
]

[tool.pytest.ini_options]
# The documentation is collected alongside the tests because Sybil turns the examples in it into
# real test cases.  Naming both here means a bare `pytest` run does the same thing the hatch
# scripts do, rather than walking the whole tree and picking up whatever it finds.
testpaths = [
    'tests',
    'docs',
]
# Sybil collects every doctest in this project, so pytest's own doctest plugin has nothing to
# contribute.  Left enabled it duplicates the work: naming a document explicitly, as in `pytest
# docs/using.rst`, makes the plugin collect the whole file as one extra doctest, because it takes
# any .rst named on the command line regardless of --doctest-glob.  That copy runs outside Sybil's
# scaffolding, so the namespace it needs isn't there, and it fails on the first line that uses it.
addopts = [
    '-p', 'no:doctest',
]

[tool.coverage.run]
source = ['flufl.i18n']
branch = true
parallel = true

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
line-length = 100
src = ['src']

[tool.ruff.lint]
# Hatch's curated set selects no pydocstyle rules, so docstring linting is an explicit choice.
# The `convention` setting below only takes effect once these are selected.
extend-select = ['D']

[tool.ruff.lint.extend-per-file-ignores]
# Essentially, ignore all lint warnings in these configuration files.
'conftest.py' = [
    'ARG002',
    'D',
    'I001',
    'S101',
]
'docs/conf.py' = [
    'A',
    'D',
    'DTZ',
    'E',
    'I',
    'UP',
]
'docs/_ext/**.py' = [
    'INP001',                   # Standalone Sphinx extension, not an importable package
]
'tools/**.py' = [
    'INP001',                   # Standalone scripts, not an importable package
    'S607',                     # Find git on PATH; its location isn't ours to assume
    'T201',                     # print() is how a command line script talks
]
'**/tests/**.py' = [
    'D100',                     # A test module's name and contents are the documentation
    'D103',                     # ...and so is a test function's name
    'D104',                     # ...and a tests package marker has nothing to say at all
]
'src/flufl/i18n/_strategy.py' = [
    'EM101',                    # Exception must not use a string literal, assign to variable first
    'TRY003',                   # Avoid specifying long messages outside the exception class
]
'src/flufl/i18n/_substitute.py' = [
    'N801',                     # Class name `attrdict` should use CapWords convention
    # The one type cast here names a builtin, so quoting the cast() target would only skip a name
    # lookup -- not worth spelling types as strings.  Note this is unrelated to PEP 563: the first
    # argument to cast() is a normal call argument, so it is evaluated whatever the floor is.
    'TC006',                    # Add quotes to type expression in typing.cast()
]
# https://gitlab.com/flufl/flufl.i18n/-/work_items/20
'src/flufl/i18n/_translator.py' = [
    'FBT001',                   # Boolean-typed positional argument in function definition
    'FBT002',                   # Boolean default positional argument in function definition
]

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint.pydocstyle]
convention = 'pep257'

[tool.ruff.lint.isort]
# tomllib joined the standard library in 3.11, so with a 3.10 floor ruff files it under
# third-party.  Only tools/ imports it, and that script declares its own >=3.11 floor in its
# PEP 723 metadata, which ruff does not read from here.
extra-standard-library = ['tomllib']
case-sensitive = true
forced-separate = ['docutils', 'sphinx']
known-first-party = ['flufl.i18n']
length-sort-straight = true
lines-after-imports = 2
lines-between-types = 1
order-by-type = true
# A custom section order has to name `future` itself.  Leave it out and isort files `from __future__
# import annotations` as third-party and sorts it below the stdlib imports, which is a SyntaxError.
section-order = ['future', 'standard-library', 'third-party', 'local-folder', 'first-party']

[tool.pyrefly]
project-includes = ['src']

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'
