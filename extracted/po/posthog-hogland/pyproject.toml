[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
# Dist name is `posthog-hogland` (org-scoped) so the bare `hogland` name
# stays free on public PyPI for a future open-source release if/when
# that ever happens. The importable Python package is still `hogland`
# (see [tool.hatch.build.targets.wheel].packages below) — same pattern
# as `pip install pillow` / `from PIL import Image`.
name = "posthog-hogland"
# Version is sourced from src/hogland/_version.py — see [tool.hatch.version]
# below. One file to bump per release; the release workflow's tag check
# also reads from that file so a tag/version mismatch fails CI before
# anything reaches PyPI.
dynamic = ["version"]
description = "Python client for hogland — Firecracker-backed sandboxes (hogboxes)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "PostHog" }]
keywords = ["hogland", "hogbox", "sandbox", "firecracker", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "httpx-sse>=0.4",
  "pydantic>=2.7",
]

[project.urls]
Homepage = "https://github.com/PostHog/hogland"
Repository = "https://github.com/PostHog/hogland"
Issues = "https://github.com/PostHog/hogland/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.8",
  "ty>=0.0.1a8",
]

[tool.hatch.version]
path = "src/hogland/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hogland"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "examples/", "README.md", "LICENSE", "pyproject.toml"]

# ---------------------------------------------------------------------------
# Ruff — lint and format. Aggressive defaults; ignore rules that conflict
# with the formatter or that don't earn their keep in an SDK codebase.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "examples"]
extend-exclude = [
  # Codegen output. We don't hand-edit it; we don't lint it either.
  # The drift gate ensures it stays in sync with openapi.yaml.
  "src/hogland/_generated/**",
  # The SandboxBase adapter imports from `products.tasks.backend.services.sandbox`
  # — PostHog's `SandboxBase` and friends. Those don't resolve in this
  # repo's env; the file is a vendored reference. The acceptance test
  # is "PostHog can copy it next to modal_sandbox.py and it imports".
  "examples/sandbox_base_adapter.py",
]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 80

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  # Conflict with `ruff format`. Astral's docs explicitly call these out.
  "COM812",
  "ISC001",
  # We don't require docstrings on every public symbol. Each class/method
  # owns its docstring decision; spamming "missing docstring" obscures the
  # real lints.
  "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
  # Google/Numpy/PEP-257 disagree on first-line content. The formatter
  # already handles whitespace; the prose rules add noise without value.
  "D203", "D213", "D212", "D200", "D205",
  # Raw-string docstrings only matter if you embed regex; we don't, and
  # forcing `r"""` on any docstring with a backslash is friction.
  "D301",
  # `from __future__ import annotations` is fine but not mandatory on 3.12+.
  "FA100", "FA102",
  # Boolean trap is real but reads worse than a positional bool here.
  "FBT001", "FBT002",
  # The SDK genuinely does need `Any` at HTTP boundaries (JSON bodies).
  "ANN401",
  # `assert` is fine inside tests.
  "S101",
  # We legitimately re-raise without `from` when wrapping httpx errors —
  # `from None` would lose the chain; `from e` is verbose for every call site.
  "TRY003", "EM101", "EM102",
  # Module-level constants live in private modules; uppercase isn't useful.
  "N806",
  # Magic numbers (response codes etc.) are clearer inline than as constants.
  "PLR2004",
  # The auto-fixer for these tends to make things worse.
  "RUF012",
  # Ambiguous unicode (en-dash, em-dash) in prose docstrings is intentional.
  "RUF001", "RUF002", "RUF003",
  # `print` is fine in scripts and examples; per-file ignore handles the rest.
  # Suppress here so we can run `ruff check` without per-call noqa.
]

[tool.ruff.lint.per-file-ignores]
# Tests can shout, monkey-patch, lazy-import, and skip annotations.
"tests/**/*.py" = [
  "D", "ANN", "PLR2004", "SLF001", "S105", "S106",
  "ARG001", "ARG002", "INP001", "PLC0415",
]
# Examples mirror the user's perspective: simple, no boilerplate.
"examples/**/*.py" = [
  "D", "ANN", "INP001", "T201", "S105", "S106", "SLF001",
]
# Maintenance scripts: shebangs, print, open() are all idiomatic.
"scripts/**/*.py" = ["T201", "PTH123", "EXE001", "INP001"]
# The sync/async clients have a wide create() constructor mirroring the
# server BoxSpec; arity follows the spec, not a lint heuristic.
"src/hogland/_client.py" = ["PLR0913"]
"src/hogland/_async.py" = ["PLR0913"]
# The box handle deliberately reaches into its parent client — they're
# a tight pair, not a public interface.
"src/hogland/_box.py" = ["SLF001"]

[tool.ruff.lint.flake8-tidy-imports]
# Allow relative imports within the package, ban parent-traversal
# (`from ..foo import x`) so we never accidentally reach across packages.
ban-relative-imports = "parents"

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.isort]
known-first-party = ["hogland"]
force-single-line = false

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
# ty — Astral's type checker. Strict where we can be, relaxed at the
# httpx/pydantic boundary where dynamic types are unavoidable.
# ---------------------------------------------------------------------------
[tool.ty.environment]
python-version = "3.12"
python = ".venv"
root = ["src", "tests"]

[tool.ty.src]
include = ["src", "tests"]
exclude = [
  "**/__pycache__",
  "**/.pytest_cache",
  "dist",
  "build",
  # datamodel-code-generator's output occasionally trips ty on defaults
  # for enum/AnyUrl fields. The drift gate keeps the file in sync with
  # openapi.yaml; type-checking it is the generator's problem, not ours.
  "src/hogland/_generated/**",
  # See [tool.ruff] extend-exclude — vendored adapter imports PostHog
  # types that don't exist in this repo's env.
  "examples/sandbox_base_adapter.py",
]

[tool.ty.rules]
# Default everything in `error` mode; lower individual rules only with cause.
possibly-unresolved-reference = "error"
unresolved-attribute = "error"
unresolved-import = "error"
invalid-argument-type = "error"
invalid-return-type = "error"
invalid-assignment = "error"
missing-argument = "error"
too-many-positional-arguments = "warn"
unused-ignore-comment = "warn"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]
