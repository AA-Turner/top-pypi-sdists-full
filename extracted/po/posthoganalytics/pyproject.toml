[build-system]
requires = [
    "setuptools>=83.0.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "posthoganalytics"
version = "7.38.0"
description = "Integrate PostHog into any python application."
authors = [
    { name = "PostHog", email = "engineering@posthog.com" },
]
maintainers = [
    { name = "PostHog", email = "engineering@posthog.com" },
]
license = "MIT"
readme = "README_ANALYTICS.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "requests>=2.7,<3.0",
    "backoff>=1.10.0",
    "distro>=1.5.0",
    "typing-extensions>=4.2.0",
]

[project.urls]
Homepage = "https://github.com/posthog/posthog-python"
Repository = "https://github.com/posthog/posthog-python"

[project.optional-dependencies]
langchain = [
    "langchain>=1.3.9",
]
zstd = [
    "zstandard>=0.23.0",
]
otel = [
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
]
dev = [
    "django-stubs",
    "griffe",
    "lxml",
    "mypy",
    "mypy-baseline",
    "types-requests",
    "types-setuptools",
    "pre-commit",
    "pydantic>=2.12.0",
    "ruff",
    "setuptools",
    "packaging",
    "wheel",
    "twine",
    "tomli",
    "tomli_w",
]
test = [
    "freezegun==1.5.1",
    "python-dateutil>=2.9.0.post0",
    "tzdata",
    "coverage",
    "pytest",
    "pytest-timeout",
    "pytest-asyncio",
    "django>=5.2.15,<6.0",
    "openai-agents>=0.18",
    "anthropic>=0.72",
    "langgraph>=1.0",
    "langgraph-checkpoint>=4.1.1",
    "tiktoken>=0.12.0",
    "langchain-core>=1.0",
    "langchain-community>=0.4",
    "langchain-openai>=1.1.14",
    "langchain-anthropic>=1.0",
    "google-genai",
    "pydantic>=2.12.0",
    "parameterized>=0.8.1",
    "claude-agent-sdk",
    "mcp>=1.28.1",
    "fastmcp>=2.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "pytest-bdd>=8.1.0",
    "zstandard>=0.23.0",
]

[tool.setuptools]
packages = [
    "posthoganalytics",
    "posthoganalytics.ai",
    "posthoganalytics.ai.langchain",
    "posthoganalytics.ai.openai",
    "posthoganalytics.ai.openai_agents",
    "posthoganalytics.ai.anthropic",
    "posthoganalytics.ai.gemini",
    "posthoganalytics.ai.claude_agent_sdk",
    "posthoganalytics.ai.otel",
    "posthoganalytics.mcp",
    "posthoganalytics.test",
    "posthoganalytics.test.ai",
    "posthoganalytics.test.ai.openai_agents",
    "posthoganalytics.test.ai.claude_agent_sdk",
    "posthoganalytics.test.ai.otel",
    "posthoganalytics.test.mcp",
    "posthoganalytics.integrations",
]

[tool.uv]
exclude-newer = "7 days"
required-version = ">=0.8.0"

[tool.uv.workspace]
members = [
    "openfeature-provider",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = [
    "posthog/test",
]
norecursedirs = [
    "integration_tests",
]

[tool.mutmut]
paths_to_mutate = [
    "posthog/utils.py",
]
do_not_mutate = [
    "posthog/test/*",
]
tests_dir = [
    "posthog/test/test_utils.py",
    "posthog/test/test_size_limited_dict.py",
]
also_copy = [
    "posthog",
]
pytest_add_cli_args = [
    "--timeout=30",
]

[dependency-groups]
dev = [
    "claude-agent-sdk>=0.1.50",
]
