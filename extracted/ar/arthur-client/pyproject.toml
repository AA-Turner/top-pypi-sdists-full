[project]
name = "arthur-client"
version = "1.4.2292"
description = "Arthur Python API Client Library"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Arthur", email = "info@arthur.ai" }]
keywords = ["api", "arthur", "client", "ArthurAI", "sdk", "ml", "model", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12"
dependencies = [
    "urllib3>=2.7.0,<3.0.0",
    "python-dateutil>=2.9.0.post0,<3.0.0",
    "pydantic>=2",
    "typing-extensions>=4.7.1",
    "simple-settings>=1.2.0",
    "authlib>=1.3.2,<2",
    "click>=8.1,<9",
    "requests>=2,<3",
]

[project.urls]
"Arthur Homepage" = "https://arthur.ai"
"Documentation" = "https://docs.arthur.ai"

[dependency-groups]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "responses>=0.26.0,<0.27.0",
]

[tool.uv]
exclude-newer = "3 days"

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "arthur_client/**/*",
]

[tool.hatch.build.targets.sdist]
include = [
    "arthur_client/**/*",
]
