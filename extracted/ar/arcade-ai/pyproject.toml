[project]
name = "arcade-ai"
version = "2.3.0"
description = "DEPRECATED — This package has been renamed to arcade-mcp. Please uninstall arcade-ai and install arcade-mcp instead."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Arcade", email = "dev@arcade.dev" }]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    "arcade-mcp>=1.12.0",
]

[project.urls]
Homepage = "https://docs.arcade.dev"
Repository = "https://github.com/ArcadeAI/arcade-ai"
"Bug Tracker" = "https://github.com/ArcadeAI/arcade-ai/issues"

[project.scripts]
arcade-ai = "arcade_ai._deprecated:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arcade_ai"]
