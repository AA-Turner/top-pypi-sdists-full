[project]
name = "archivebox"
version = "0.9.51"
requires-python = ">=3.13"
description = "Self-hosted internet archiving solution."
authors = [
    { name = "Nick Sweeting", email = "pyproject.toml@archivebox.io" },
]
readme = "README.md"
keywords = [
    "internet archiving",
    "web archiving",
    "digipres",
    "warc",
    "preservation",
    "backups",
    "archiving",
    "web",
    "bookmarks",
    "puppeteer",
    "browser",
    "download",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
    "Topic :: Sociology :: History",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Archiving",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: System :: Recovery Tools",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "setuptools>=74.1.0",
    "django>=6.1",
    "psycopg[binary]>=3.2",
    "daphne>=4.2.1",
    "django-ninja>=1.5.1",
    "django-extensions>=3.2.3",
    "django-signal-webhooks>=0.3.0",
    "django-admin-data-views>=0.4.1",
    "django-object-actions>=4.3.0",
    "bleach>=6.2.0",
    "click>=8.3.1",
    "rich>=14.2.0",
    "rich-click>=1.9.5",
    "ipython>=8.27.0",
    "toml>=0.10.2",
    "supervisor>=4.2.5",
    "psutil>=6.0.0",
    "platformdirs>=4.3.6",
    "py-machineid>=0.6.0",
    "atomicwrites==1.4.1",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.5.2",
    "base32-crockford>=0.3.0",
    "django-stubs>=5.0.4",
    "requests>=2.32.3",
    "sonic-client>=1.0.0",
    "dateparser>=1.2.0",
    "croniter>=6.0.0",
    "tzdata>=2024.2",
    "w3lib>=2.2.1",
    "abxbus==2.5.65",
    "abxpkg==1.13.10",
    "abx-plugins[opencode]==1.13.34",
    "abx-dl==1.13.28",
    "uuid7>=0.1.0; python_version < '3.14'",
    "browser-cookie3>=0.20.1",
]

[project.license]
text = "MIT"

[project.optional-dependencies]
sonic = []
ldap = [
    "python-ldap>=3.4.3",
    "django-auth-ldap>=4.1.0",
]
debug = [
    "django-debug-toolbar>=4.4.6",
    "djdt_flamegraph>=0.2.13",
    "ipdb>=0.13.13",
    "requests-tracker>=0.3.3",
    "django-autotyping>=0.5.1",
]
all = [
    "archivebox[sonic,ldap,debug]",
]

[project.scripts]
archivebox = "archivebox.cli:main"

[project.urls]
Homepage = "https://github.com/ArchiveBox/ArchiveBox"
Source = "https://github.com/ArchiveBox/ArchiveBox"
Documentation = "https://github.com/ArchiveBox/ArchiveBox/wiki"
"Bug Tracker" = "https://github.com/ArchiveBox/ArchiveBox/issues"
Changelog = "https://github.com/ArchiveBox/ArchiveBox/releases"
Roadmap = "https://github.com/ArchiveBox/ArchiveBox/wiki/Roadmap"
Community = "https://github.com/ArchiveBox/ArchiveBox/wiki/Web-Archiving-Community"
Demo = "https://demo.archivebox.io"
Donate = "https://github.com/ArchiveBox/ArchiveBox/wiki/Donations"

[dependency-groups]
dev = [
    "uv>=0.11.3",
    "bumpver>=2023.1129",
    "recommonmark>=0.7.1",
    "sphinx>=8.1.3",
    "sphinx-rtd-theme>=2.0.0",
    "sphinxcontrib-mermaid>=1.0.0",
    "myst-parser>=4.0.0",
    "sphinx-autodoc2>=0.5.0",
    "linkify-it-py>=2.0.3",
    "django-debug-toolbar>=4.4.6",
    "requests-tracker>=0.3.3",
    "djdt_flamegraph>=0.2.13",
    "ipdb>=0.13.13",
    "logfire[django]>=0.51.0",
    "opentelemetry-instrumentation-django>=0.47b0",
    "opentelemetry-instrumentation-sqlite3>=0.47b0",
    "viztracer>=0.17.0",
    "pytest-django>=4.11.1",
    "pytest>=8.3.3",
    "pytest-cov>=6.0.0",
    "pytest-github-actions-annotate-failures>=0.4.0",
    "pytest-httpserver>=1.1.0",
    "pytest-sugar>=1.0.0",
    "pytest-timeout>=2.3.1",
    "playwright==1.63.0",
    "coverage[toml]>=7.6.0",
    "bottle>=0.13.1",
    "prek>=0.3.6",
    "ruff>=0.6.6",
    "pyright>=1.1.406",
    "ty>=0.0.1a19",
]

[tool.uv]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]
package = true
exclude-newer = "5 days"

[tool.uv.exclude-newer-package]
abx-plugins = "2100-01-01T00:00:00Z"
abx-dl = "2100-01-01T00:00:00Z"
abxpkg = "2100-01-01T00:00:00Z"
abxbus = "1 second"

[tool.pdm.build]
includes = [
    "archivebox/",
]
excludes = [
    ".cache",
    ".mypy_cache",
    ".pdm-build",
    ".pytest_cache",
    ".ruff_cache",
    ".tmp",
    ".uv-cache",
    ".venv",
    "ArchiveBox.conf",
    "archive",
    "archivebox/.DS_Store",
    "archivebox/*/.DS_Store",
    "archivebox/.flake8",
    "archivebox/__pycache__",
    "archivebox/index.sqlite3",
    "archivebox/index.sqlite3-*",
    "archivebox/machine/tests",
    "archivebox/mcp/README.md",
    "archivebox/tests/",
    "archivebox/workers/tests",
    "build",
    "cache",
    "caches",
    "chrome_profile",
    "chromeprofile",
    "crawls",
    "data",
    "data*",
    "deb_dist",
    "dist",
    "index.sqlite3",
    "index.sqlite3-*",
    "lib",
    "logs",
    "node_modules",
    "out",
    "output",
    "personas",
    "pip_dist",
    "queue.sqlite3",
    "queue.sqlite3-*",
    "snapshots",
    "sources",
    "tests",
    "tmp",
    "users",
    "venv",
]

[tool.setuptools]
packages = [
    "archivebox",
]

[tool.setuptools.package-dir]
archivebox = "archivebox"

[tool.ruff]
line-length = 140
target-version = "py313"
src = [
    "archivebox",
]
force-exclude = true
exclude = [
    "*.pyi",
    "*.html",
    "**/*.html",
    "typings/",
    "migrations/",
    "archivebox/tests/data/",
]

[tool.ruff.lint]
ignore = [
    "E731",
    "E303",
    "E266",
    "E241",
    "E222",
]

[tool.codespell]
ignore-words-list = "abx,archivebox,adminsnapshots,bu,wit,dont,cant,wont,havent,thats,shouldnt,doesnt,doenst,succeded,re-use,re-used,re-using,re-usable,generat,te"
skip = "*.json,*.min.js,*.min.css,uv.lock,old/*,publicsite/*,docs/apidocs/*"

[tool.pytest.ini_options]
testpaths = [
    "archivebox/tests",
]
timeout = 600
timeout_method = "thread"

[tool.coverage.run]
branch = true
source = [
    "archivebox",
]
parallel = true
data_file = ".coverage"
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/migrations/*",
    "*/typings/*",
    "*/__pycache__/*",
    "*/node_modules/*",
    "*/.venv/*",
    "*/manage.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 0
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if False:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.json]
output = "coverage.json"
show_contexts = true

[tool.pyright]
include = [
    "archivebox",
]
exclude = [
    ".venv",
    "**/*.pyi",
    "**/__init__.pyi",
    "**/node_modules",
    "**/__pycache__",
    "**/migrations",
    "archivebox/tests/data",
    "archivebox/tests/data/**",
]
stubPath = "./typings"
venvPath = "."
venv = ".venv"
reportMissingImports = true
reportMissingTypeStubs = false
pythonVersion = "3.13"
pythonPlatform = "Linux"

[tool.ty.environment]
python-version = "3.13"
python-platform = "linux"

[tool.ty.src]
include = [
    "archivebox",
]
exclude = [
    ".venv",
    "**/*.pyi",
    "**/__init__.pyi",
    "**/node_modules",
    "**/__pycache__",
    "**/migrations",
    "archivebox/tests/data",
    "archivebox/tests/data/**",
]

[tool.bumpver]
current_version = "v0.9.51"
version_pattern = "vMAJOR.MINOR.PATCH[PYTAGNUM]"
commit_message = "bump version {old_version} -> {new_version}"
tag_message = "{new_version}"
tag_scope = "default"
pre_commit_hook = "bin/bumpver_update_lock.sh"
post_commit_hook = ""
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    "current_version = \"{version}\"",
    "version = \"{pep440_version}\"",
]
"etc/package.json" = [
    "\"version\": \"{pep440_version}\"",
]

[build-system]
requires = [
    "pdm-backend",
]
build-backend = "pdm.backend"
