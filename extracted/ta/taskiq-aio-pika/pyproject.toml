[project]
name = "taskiq-aio-pika"
version = "0.6.1"
description = "RabbitMQ broker for taskiq"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Typing :: Typed",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: System :: Networking",
    "Development Status :: 3 - Alpha",
]
homepage = "https://github.com/taskiq-python/taskiq-aio-pika"
repository = "https://github.com/taskiq-python/taskiq-aio-pika"
keywords = [
    "taskiq",
    "tasks",
    "distributed",
    "async",
    "aio-pika",
]
requires-python = ">=3.10,<4"
dependencies = [
    "taskiq>=0.12.0,<1",
    "aio-pika>=9.0.0",
    "typing-extensions>=4.14.0",
]

[[project.authors]]
name = "Pavel Kirilin"
email = "win10@list.ru"

[[project.maintainers]]
name = "Pavel Kirilin"
email = "win10@list.ru"

[dependency-groups]
dev = [
    "prek>=0.3.0",
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "typecheck" },
    { include-group = "examples" },
]
lint = [
    "ruff>=0.14.5",
    "black>=25.11.0",
]
test = [
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "coverage>=7.11.3",
    "pytest-xdist[psutil]>=3.8.0",
    "anyio>=4.11.0",
]
typecheck = ["ty>=0.0.13"]
examples = ["taskiq-redis>=1.1.2"]

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "taskiq_aio_pika"
module-root = ""

[tool.pytest.ini_options]
log_level = "INFO"
anyio_mode = "auto"

[tool.ruff]
target-version = "py310"
exclude = [".venv/"]
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "C90",
    "I",
    "N",
    "D",
    "ANN",
    "S",
    "B",
    "COM",
    "C4",
    "ISC",
    "PIE",
    "T20",
    "PYI",
    "Q",
    "RSE",
    "RET",
    "SLF",
    "SIM",
    "PTH",
    "ERA",
    "PL",
    "RUF",
    "UP",
]
ignore = [
    "D105",
    "D107",
    "D212",
    "D401",
    "D104",
    "D100",
    "ANN401",
    "PLR0913",
    "D106",
    "SLF001",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",
    "S301",
    "D103",
    "SLF001",
    "S311",
    "D101",
    "D102",
    "E501",
]
"examples/*" = [
    "D",
    "T201",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
ignore-decorators = ["typing.overload"]

[tool.ruff.lint.pylint]
allow-magic-value-types = [
    "int",
    "str",
    "float",
    "bytes",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "taskiq_dependencies.Depends",
    "taskiq.TaskiqDepends",
]
