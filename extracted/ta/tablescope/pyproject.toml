[project]
name = "tablescope"
version = "0.2.3"
description = "A lazy table viewer with narwhals-backed query pushdown, for Marimo or Juptyer"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["marimo", "dataframe", "table", "widget", "narwhals"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
authors = [
    { name = "Samuel S. Watson", email = "samuel.s.watson@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anywidget>=0.9.18",
    "marimo>=0.20.4",
    "narwhals>=2.18.0",
    "polars>=1.39.0",
    "traitlets>=5.14.3",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
databricks = [
    "databricks-connect>=14.0",
]

[project.scripts]
tablescope = "tablescope:main"

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tablescope"

[dependency-groups]
dev = [
    "hvplot>=0.12.2",
    "marimo[mcp]>=0.20.4",
    "pytest>=8.4.2",
    "twine>=6.2.0",
]
