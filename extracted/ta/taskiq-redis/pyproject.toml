[project]
name = "taskiq-redis"
version = "1.2.4"
description = "Redis integration for taskiq"
readme = "README.md"
requires-python = ">=3.10,<4"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "async",
    "distributed",
    "redis",
    "result_backend",
    "taskiq",
    "tasks",
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "redis>=8.0.0,<9",
    "taskiq>=0.13.0",
]

[[project.authors]]
name = "Taskiq team"
email = "taskiq@no-reply.com"

[[project.maintainers]]
name = "Taskiq team"
email = "taskiq@no-reply.com"

[project.urls]
homepage = "https://github.com/taskiq-python/taskiq-redis"
repository = "https://github.com/taskiq-python/taskiq-redis"

[dependency-groups]
dev = [
    "prek>=0.5.4",
    { include-group = "lint" },
    { include-group = "test" },
]
lint = [
    "black>=25.11.0",
    "mypy>=2.3.1",
    "ruff>=0.16.9",
    "zizmor>=1.30.1",
]
test = [
    "fakeredis>=2.32.1",
    "freezegun>=1.5.5",
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "pytest-env>=1.2.0",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[tool.mypy]
strict = true
ignore_missing_imports = true
allow_subclassing_any = true
allow_untyped_calls = true
pretty = true
show_error_codes = true
implicit_reexport = true
allow_untyped_decorators = true
warn_return_any = false

[[tool.mypy.overrides]]
module = ["redis"]
ignore_missing_imports = true
ignore_errors = true
strict = false

[tool.pytest.ini_options]
filterwarnings = ["ignore:RedisScheduleSource is deprecated:DeprecationWarning"]

[tool.ruff]
exclude = [".venv/"]
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "C90",
    "I",
    "N",
    "D",
    "ANN",
    "S",
    "B",
    "COM",
    "C4",
    "ISC",
    "PIE",
    "T20",
    "PYI",
    "Q",
    "RSE",
    "RET",
    "SLF",
    "SIM",
    "PTH",
    "ERA",
    "PL",
    "RUF",
    "FA102",
    "UP",
    "LOG",
]
ignore = [
    "D105",
    "D107",
    "D212",
    "D401",
    "D104",
    "D100",
    "ANN401",
    "PLR0913",
    "D106",
    "PLR0917",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",
    "S301",
    "D103",
    "SLF001",
    "S311",
    "D101",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
ignore-decorators = ["typing.overload"]

[tool.ruff.lint.pylint]
allow-magic-value-types = [
    "int",
    "str",
    "float",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "taskiq_dependencies.Depends",
    "taskiq.TaskiqDepends",
]

[tool.uv.build-backend]
module-root = ""
module-name = "taskiq_redis"
