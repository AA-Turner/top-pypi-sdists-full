# roles used for nesting in other roles
org_member/org_id:
    - r:organization/org_id
    - r:runtime_artifacts/org_id
    - r:organization_name/org_id
org_admin/org_id:
    - org_member/org_id
    - d_api_key/org_id
    - w:organization/org_id
access_requester_org/org_id:
    - r+w+d:access_request/org_id
    - r:organization_name/org_id
access_approver_org/org_id:
    - r:access_request/org_id
    - r+w+d:access_request_decision/org_id
    - r:organization_name/org_id
