# Taktile staff roles, assignable via the admin panel.
oncall_group:
    - fwd_viewer/*
    - taktile_aws_account_viewer_org/*
oncall_write:
    - taktile_admin
    - taktile_d_admin
taktile_d_admin:
    - d_admin/*
    - d_owner/*
    - taktile_d_admin_org/*
# Carries taktile_d_admin's own grants on an org_id, so they survive scoping a token to an org.
taktile_d_admin_org/org_id:
    - r:internal_resources/org_id
    - r:aws_account/org_id
    - w+d:workspace_management/org_id,*,{env=*,type=*}
    - r+w:workspace_feature_query/org_id,*,{env=*,component=*,current_status_live=*}
    - r+w+d:workspace_prebuilt_agent_management/org_id,*
taktile_aws_account_viewer_org/org_id:
    - r:aws_account/org_id
fwd_d/org_id:
    - d_admin/org_id
    - fwd_viewer/org_id
    - w+d:infrastructure/org_id
    - w+d:workspace_management/org_id,{ws_id=*, env=*,type=*}
    - r+w:workspace_feature_query/org_id,*,{env=*,component=*,current_status_live=*}
    - r+w+d:workspace_prebuilt_agent_management/org_id,*
access_requester:
    - access_requester_org/*
access_approver:
    - access_approver_org/*
fwd_viewer/org_id:
    - d_member/org_id
    - ws_viewer/org_id,*
    - session_viewer_live/org_id,*
    - chart_viewer_live/org_id,*
    - dh_viewer_live/org_id,*
    - r:internal_resources/org_id
    - r:workspace_analytics_dashboard/org_id,ws_id
    - r:workspace_api_keys/org_id,ws_id
    - r:workspace_connection_resource/org_id,ws_id
    - r:workspace_connection_tenant/org_id,ws_id
    - r:workspace_connection_secret/org_id,ws_id
    - r:workspace_decision_history/org_id,ws_id
    - r:workspace_decision_history_api/org_id,ws_id
    - r:workspace_endpoint/org_id,ws_id
    - r:workspace_live_job_trigger/org_id,ws_id
    - r:workspace_review_case/org_id,ws_id,{env=*}
    - r:workspace_sandbox_job_trigger/org_id,ws_id
    - r:workspace_test_job_trigger/org_id,ws_id
    - r:workspace_agent_execution/org_id,ws_id,{env=*,type=*}
    - r:workspace_case_queue/org_id,ws_id
    - r:workspace_case/org_id,ws_id
    - r:workspace_case_template/org_id,ws_id
    - r:audit_logs/org_id
