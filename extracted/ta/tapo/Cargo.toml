[workspace]
resolver = "3"

members = ["tapo", "tapo-py"]

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.23"
chrono = { version = "0.4.34", default-features = false }
chrono-tz = { version = "0.10" }
log = "0.4"
pyo3 = { version = "0.30" }
rand = "0.10"
schemars = { version = "1.2" }
serde = { version = "1.0" }
serde_json = { version = "1.0" }
thiserror = "2.0"
tokio = { version = "1.52", default-features = false }
