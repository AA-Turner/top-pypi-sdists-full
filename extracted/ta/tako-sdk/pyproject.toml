[project]
name = "tako-sdk"
version = "2.2.20"
description = "The official Python library for the tako API"
readme = "README.md"
license = "MIT"
authors = [
{ name = "Tako", email = "support@tako.com" },
]

# Runtime deps for the openapi-generator output:
#   urllib3 + python-dateutil + pydantic + typing-extensions  -> sync (tako/) client
#   httpx                                                      -> async (tako/aio/) client
#   httpx-sse                                                  -> hand-written SSE layer (tako/lib)
dependencies = [
  "urllib3>=2.7.0,<3",
  "python-dateutil>=2.8.2",
  "pydantic>=2,<3",
  "typing-extensions>=4.7.1",
  "httpx>=0.27,<1",
  "httpx-sse>=0.4",
]

requires-python = ">= 3.10"
classifiers = [
  "Typing :: Typed",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "License :: OSI Approved :: MIT License"
]

# Optional: `pip install tako-sdk[pandas]` enables TakoDatasetView.to_dataframe().
# pandas is a lazy import in tako/lib/dataset.py; the records view needs no extra.
[project.optional-dependencies]
pandas = ["pandas>=1.5"]

[project.urls]
Homepage = "https://tako.com"
Documentation = "https://docs.tako.com"

[tool.uv]
managed = true
required-version = ">=0.9"

[dependency-groups]
dev = [
    "pyright==1.1.399",
    "mypy==1.17",
    "respx",
    "pytest",
    "pytest-asyncio",
    "ruff",
]
examples = [
    "openai>=1.0",
    "anthropic>=0.40",
]

[build-system]
requires = ["hatchling==1.26.3"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tako"]

[tool.hatch.build.targets.sdist]
include = [
  "/tako",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -m 'not integration'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: makes real network calls against a live API; excluded from the default run (opt in with -m integration)",
]

# Type-checking targets our hand-written code only. The generated clients
# (tako/api, tako/models, tako/aio, tako/*.py) are machine-produced and
# reproducible; they are exercised by the import check and tests, not pyright.
[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.10"
include = ["tako/lib"]
exclude = [".venv", ".nox", ".git"]
reportImplicitOverride = true
reportImportCycles = false
reportPrivateUsage = false

[tool.mypy]
pretty = true
show_error_codes = true
files = ["tako/lib"]
strict_equality = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.ruff]
line-length = 120
output-format = "grouped"
target-version = "py310"
# Lint only hand-written code; generated clients are produced by openapi-generator.
extend-exclude = [
  "tako/api",
  "tako/aio",
  "tako/models",
  "tako/api_client.py",
  "tako/api_response.py",
  "tako/configuration.py",
  "tako/exceptions.py",
  "tako/rest.py",
  "tako/__init__.py",
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
  # isort
  "I",
  # bugbear rules
  "B",
  # remove unused imports
  "F401",
  # bare except statements
  "E722",
  # unused arguments
  "ARG",
  # print statements
  "T201",
  "T203",
]
ignore = [
  # mutable defaults
  "B006",
]
unfixable = [
  # disable auto fix for print statements
  "T201",
  "T203",
]

[tool.ruff.lint.isort]
combine-as-imports = true
extra-standard-library = ["typing_extensions"]
known-first-party = ["tako", "tests"]

[tool.ruff.lint.per-file-ignores]
"bin/**.py" = ["T201", "T203"]
"scripts/**.py" = ["T201", "T203"]
"tests/**.py" = ["T201", "T203"]
"examples/**.py" = ["T201", "T203"]
