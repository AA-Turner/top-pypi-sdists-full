[project]
name = "taskiq-nats"
version = "0.7.0"
description = "NATS integration for taskiq"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: System :: Networking",
    "Development Status :: 3 - Alpha",
]
homepage = "https://github.com/taskiq-python/taskiq-nats"
repository = "https://github.com/taskiq-python/taskiq-nats"
keywords = [
    "taskiq",
    "tasks",
    "distributed",
    "async",
    "nats",
    "result_backend",
]
requires-python = ">=3.10,<4"
dependencies = [
    "taskiq>=0.13.0",
    "nats-py>=2.2.0",
]

[[project.authors]]
name = "Taskiq team"
email = "taskiq@no-reply.com"

[[project.maintainers]]
name = "Taskiq team"
email = "taskiq@no-reply.com"

[dependency-groups]
dev = [
    "prek>=0.5.4",
    "ruff>=0.16.9",
    "black>=26.5.1",
    "mypy>=2.3.1",
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "coverage>=7.11.3",
    "pytest-xdist[psutil]>=3.8.0",
    "anyio>=4.11.0",
    "zizmor>=1.30.1",
]

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "taskiq_nats"
module-root = ""

[tool.pytest.ini_options]
log_level = "INFO"
anyio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
allow_subclassing_any = true
allow_untyped_calls = true
packages = ["taskiq_nats"]
pretty = true
show_error_codes = true
implicit_reexport = true
allow_untyped_decorators = true
warn_return_any = false

[tool.ruff]
target-version = "py310"
exclude = [".venv/"]
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "C90",
    "I",
    "N",
    "D",
    "ANN",
    "S",
    "B",
    "COM",
    "C4",
    "ISC",
    "PIE",
    "T20",
    "PYI",
    "Q",
    "RSE",
    "RET",
    "SLF",
    "SIM",
    "PTH",
    "ERA",
    "PL",
    "RUF",
    "UP",
]
ignore = [
    "D105",
    "D107",
    "D212",
    "D401",
    "D104",
    "D100",
    "ANN401",
    "PLR0913",
    "D106",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",
    "S301",
    "D103",
    "SLF001",
    "S311",
    "D101",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
ignore-decorators = ["typing.overload"]

[tool.ruff.lint.pylint]
allow-magic-value-types = [
    "int",
    "str",
    "float",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "taskiq_dependencies.Depends",
    "taskiq.TaskiqDepends",
]
