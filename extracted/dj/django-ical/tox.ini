[tox]
min_version = 4.4
envlist =
    py311-djqa
    py{311,312,313,314}-dj52
    pypy311-dj52
    py{312,313,314}-dj60
    py{312,313,314,315}-dj61
    py314-djmain

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
    3.15: py315
    pypy-3.11: pypy311

[gh-actions:env]
DJANGO =
    5.2: dj52
    6.0: dj60
    6.1: dj61
    main: djmain
    qa: djqa

[testenv]
usedevelop = true
constrain_package_deps = true
setenv =
    PYTHONDONTWRITEBYTECODE=1
deps =
    coverage==7.16.2
    dj52: django>=5.2,<5.3
    dj60: django>=6.0,<6.1
    dj61: django>=6.1,<6.2
    djmain: django @ https://github.com/django/django/archive/main.tar.gz
commands =
    python -m django --version
    coverage run -m django test django_ical --settings=test_settings
    coverage report -m

[testenv:py311-djqa]
ignore_errors = true
skip_install = true
setenv =
    DJANGO_SETTINGS_MODULE=test_settings
deps =
    django>=5.2,<5.3
    black==23.10.1
    prospector==1.19.1
commands =
    prospector
    black --check --diff django_ical
