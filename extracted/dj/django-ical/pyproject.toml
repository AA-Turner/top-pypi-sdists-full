[build-system]
requires = ["setuptools>=77", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "django-ical"
dynamic = ["version", "readme"]
description = "iCal feeds for Django based on Django's syndication feed framework."
authors = [
    {name = "Ian Lewis"},
]
keywords = ["ical", "calendar", "django", "syndication", "feed"]
dependencies = [
    "django>=5.2",
    "icalendar>=4.0.3",
    "django-recurrence>=1.11.1",
]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Environment :: Plugins",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/django-commons/django-ical"

[tool.setuptools.packages.find]
include = ["django_ical*"]

[tool.setuptools.dynamic]
# The changelog is shown after the README on PyPI
readme = {file = ["README.rst", "CHANGES.rst"], content-type = "text/x-rst"}

[tool.setuptools_scm]

[tool.black]
line-length = 88
target_version = ['py311']
