[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.9.6,<0.13.0"]

[project]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = ["Django>=5.2"]
description = "Bootstrap 3 for Django"
keywords = [
    "django",
    "bootstrap",
    "bootstrap3",
]
license = "BSD-3-Clause"
license-files = [
    "LICENSE",
    "AUTHORS",
]
name = "django-bootstrap3"
readme = "README.md"
requires-python = ">=3.10"
version = "26.2"

[[project.authors]]
name = "Dylan Verheul"
email = "dylan@dyve.net"

[project.urls]
Changelog = "https://github.com/zostera/django-bootstrap3/blob/main/CHANGELOG.md"
Documentation = "https://django-bootstrap3.readthedocs.io/"
Homepage = "https://github.com/zostera/django-bootstrap3"
Issues = "https://github.com/zostera/django-bootstrap3/issues"
Source = "https://github.com/zostera/django-bootstrap3"

[tool.ruff]
fix = false
line-length = 120
src = ["src"]

[tool.ruff.lint]
fixable = [
    "I001",
    "F",
    "D",
    "UP",
]
ignore = [
    "D1",
    "D203",
    "D212",
    "D301",
]
select = [
    "D",
    "E",
    "F",
    "I",
    "UP",
]
unfixable = ["F8"]

[tool.ruff.lint.isort]
known-first-party = [
    "bootstrap3",
    "app",
]
known-third-party = ["django"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.paths]
package = [
    "src/bootstrap3",
    "*/django_bootstrap3/src/bootstrap3",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.uv.build-backend]
module-name = "bootstrap3"
source-exclude = [
    "**/.DS_Store",
    "docs/_build",
    "example/db.sqlite3",
    "uv.lock",
]
source-include = [
    ".editorconfig",
    ".readthedocs.yaml",
    "FUNDING.yml",
    "manage.py",
    "justfile",
    "*.md",
    "example/**",
    "tests/**",
    "tox.ini",
    "docs/**",
]

[tool.check-manifest]
ignore = [
    "uv.lock",
    "pyproject.toml.orig",
]

[dependency-groups]
docs = [
    "furo>=2024.8.6",
    "myst-parser>=3.0.1",
    "sphinx>=7.1.2",
]
test = ["coverage[toml]>=7.6.1"]

[[dependency-groups.dev]]
include-group = "test"

[[dependency-groups.dev]]
include-group = "docs"
