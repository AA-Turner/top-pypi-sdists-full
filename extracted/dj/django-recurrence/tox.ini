[tox]
envlist =
  py312-djdocs
  py312-djqa
  py{311,312,313,314}-dj52
  pypy311-dj52
  py{312,313,314}-dj60
  py{312,313,314,315}-dj61
  py{312,313}-djmain

[gh-actions]
python =
  3.11: py311
  3.12: py312
  3.13: py313
  3.14: py314
  3.15: py315
  pypy-3.11: pypy311

[gh-actions:env]
DJANGO =
  docs: djdocs
  qa: djqa
  5.2: dj52
  6.0: dj60
  6.1: dj61
  main: djmain

[testenv]
usedevelop = true
setenv =
  PYTHONDONTWRITEBYTECODE=1
deps =
  -r requirements.txt
  dj52: django>=5.2,<5.3
  dj60: django>=6.0,<6.1
  dj61: django>=6.1,<6.2
  djmain: https://github.com/django/django/archive/main.tar.gz
commands =
  !pypy311: pytest
  # The test run fails on PyPy when coverage is measured
  pypy311: pytest --no-cov
# Django development version is allowed to fail the test matrix
ignore_outcome =
  djmain: True

[testenv:py312-djqa]
basepython = python3.12
ignore_errors = true
deps =
  -r requirements.txt
commands =
  flake8 recurrence
  flake8 tests

[testenv:py312-djdocs]
basepython = python3.12
changedir = docs
deps =
  -r requirements.txt
commands =
  sphinx-build -W -b html -d {envtmpdir}/doctrees . {envtmpdir}/html

[flake8]
ignore = E122,E125,E129,E501,W503,W504
