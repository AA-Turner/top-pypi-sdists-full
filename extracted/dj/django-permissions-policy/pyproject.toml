[build-system]
build-backend = "uv_build"
requires = ["uv-build>=0.12.1,<0.13"]

[project]
name = "django-permissions-policy"
version = "4.33.0"
description = "Set the Permissions-Policy HTTP header on your Django app."
readme = "README.rst"
keywords = ["Django"]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
]
dependencies = [
    "asgiref>=3.6",
    "django>=5.2",
]

[[project.authors]]
name = "Adam Johnson"
email = "me@adamj.eu"

[project.urls]
Changelog = "https://github.com/adamchainz/django-permissions-policy/blob/main/CHANGELOG.rst"
Funding = "https://adamj.eu/books/"
Repository = "https://github.com/adamchainz/django-permissions-policy"

[dependency-groups]
test = [
    "coverage[toml]",
    "pytest>=9",
    "pytest-django",
    "pytest-randomly",
]
django52 = ["django>=5.2a1,<6; python_version>='3.10'"]
django60 = ["django>=6a1,<6.1; python_version>='3.12'"]
django61 = ["django>=6.1a1,<6.2; python_version>='3.12'"]

[tool.uv]
conflicts = [[
    { group = "django52" },
    { group = "django60" },
    { group = "django61" },
]]

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "E",
    "F",
    "I",
    "SIM",
    "TID",
    "UP",
    "W",
]
ignore = [
    "B9",
    "E501",
    "SIM105",
    "SIM108",
]
extend-safe-fixes = ["UP006"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.pyproject-fmt]
max_supported_python = "3.15"

[tool.mypy]
mypy_path = "src/"
namespace_packages = false
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
]
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
allow_untyped_defs = true

[tool.pytest]
django_find_project = false
DJANGO_SETTINGS_MODULE = "tests.settings"
strict = true

[tool.coverage.run]
branch = true
data_file = ".coverage/cov"
parallel = true
source = [
    "django_permissions_policy",
    "tests",
]

[tool.coverage.paths]
source = [
    "src",
    ".tox/**/site-packages",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
skip_empty = true

[tool.rstcheck]
report_level = "ERROR"
