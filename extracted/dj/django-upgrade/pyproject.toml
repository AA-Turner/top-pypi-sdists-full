[build-system]
build-backend = "uv_build"
requires = ["uv-build>=0.12.1,<0.13"]

[project]
name = "django-upgrade"
version = "1.32.0"
description = "Automatically upgrade your Django project code."
readme = "README.rst"
keywords = ["Django"]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django :: 2.2",
    "Framework :: Django :: 3.0",
    "Framework :: Django :: 3.1",
    "Framework :: Django :: 3.2",
    "Framework :: Django :: 4.0",
    "Framework :: Django :: 4.1",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = ["tokenize-rt>=4.1"]

[[project.authors]]
name = "Adam Johnson"
email = "me@adamj.eu"

[project.urls]
Changelog = "https://django-upgrade.readthedocs.io/en/latest/changelog.html"
Documentation = "https://django-upgrade.readthedocs.io/"
Funding = "https://adamj.eu/books/"
Repository = "https://github.com/adamchainz/django-upgrade"

[project.scripts]
django-upgrade = "django_upgrade.main:main"

[dependency-groups]
test = [
    "coverage[toml]>=7.10",
    "pytest>=9",
    "pytest-randomly",
]
docs = [
    "furo>=2024.8.6",
    "sphinx>=7.4.7",
    "sphinx-copybutton>=0.5.2",
]

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "E",
    "F",
    "I",
    "SIM",
    "TID",
    "UP",
    "W",
]
ignore = [
    "B9",
    "E501",
    "SIM105",
    "SIM108",
]
extend-safe-fixes = ["UP006"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.pyproject-fmt]
max_supported_python = "3.15"

[tool.mypy]
mypy_path = "src/"
namespace_packages = false
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
]
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
allow_untyped_defs = true

[tool.pytest]
strict = true

[tool.coverage.run]
branch = true
data_file = ".coverage/cov"
parallel = true
source = [
    "django_upgrade",
    "tests",
]

[tool.coverage.paths]
source = [
    "src",
    ".tox/**/site-packages",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
skip_empty = true

[tool.rstcheck]
report_level = "ERROR"
