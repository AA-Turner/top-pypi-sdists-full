[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.9.10"]

[project]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mdformat >= 1.0.0",
    "mdformat-gfm >= 1.0.0",
    "mdit-py-plugins >= 0.6.1",
    "more-itertools >= 11.1.0",
]
description = "An mdformat plugin for mkdocs and Material for MkDocs"
keywords = [
    "markdown",
    "markdown-it",
    "mdformat",
    "mdformat_plugin_template",
]
license = "MIT"
license-files = ["LICENSE"]
name = "mdformat_mkdocs"
readme = "README.md"
requires-python = ">=3.10.0"
version = "5.3.0"

[[project.authors]]
email = "dev.act.kyle@gmail.com"
name = "kyleking"

[project.entry-points."mdformat.parser_extension"]
mkdocs = "mdformat_mkdocs"

[project.optional-dependencies]
recommended = [
    "mdformat-beautysh >= 1.0.0",
    "mdformat-config >= 0.2.1",
    "mdformat-footnote >= 0.1.3",
    "mdformat-front-matters >= 2.0.0",
    "mdformat-gfm >=1.0.0",
    "mdformat-ruff >= 0.1.3",
    "mdformat-simple-breaks >= 0.1.0",
    "mdformat-web >= 0.2.0",
    "mdformat-wikilink >= 0.3.0",
    "setuptools",
]
recommended-mdsf = [
    "mdformat-footnote >= 0.1.3",
    "mdformat-front-matters >= 2.0.0",
    "mdformat-gfm >=1.0.0",
    "mdformat-hooks >= 0.1.0",
    "mdformat-simple-breaks >= 0.1.0",
    "mdformat-wikilink >= 0.3.0",
]
test = [
    "beartype >= 0.22.9",
    "hypothesis >= 6.100.0",
    "pytest >= 9.1.1",
    "pytest-beartype >= 0.2.0",
    "pytest-cov >= 7.1.0",
    "pytest-timeout >= 2.4.0",
    "syrupy >= 5.5.3",
]

[project.urls]
"Bug Tracker" = "https://github.com/kyleking/mdformat-mkdocs/issues"
Changelog = "https://github.com/kyleking/mdformat-mkdocs/releases"
homepage = "https://github.com/kyleking/mdformat-mkdocs"

[tool.commitizen]
tag_format = "v${version}"
version = "5.3.0"
version_files = [
    "mdformat_mkdocs/__init__.py",
    "pyproject.toml:^version",
]

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
enable_error_code = [
    "ignore-without-code",
    "possibly-undefined",
    "redundant-expr",
    "truthy-bool",
]
extra_checks = true
files = [
    "mdformat_mkdocs",
    "tests",
]
no_implicit_reexport = true
python_version = "3.10"
show_column_numbers = true
show_error_codes = true
strict_equality = true
warn_no_return = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pyright]
include = [
    "mdformat_mkdocs",
    "tests",
]
pythonVersion = "3.10"

[tool.pytest-watcher]
ignore_patterns = []
now = true
patterns = [
    "*.ambr",
    "*.md",
    "*.py",
]
runner = "tox"
runner_args = [
    "-e",
    "test",
    "--",
    "--exitfirst",
    "--failed-first",
    "--new-first",
    "-vv",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
ignore = [
    "assert",
    "blind-except",
    "boolean-type-hint-positional-argument",
    "docstring-missing-returns",
    "docstring-missing-yields",
    "incorrect-blank-line-before-class",
    "invalid-argument-name",
    "invalid-todo-tag",
    "line-contains-fixme",
    "line-contains-hack",
    "line-contains-todo",
    "line-too-long",
    "missing-copyright-notice",
    "missing-todo-author",
    "missing-todo-link",
    "missing-trailing-comma",
    "missing-type-args",
    "missing-type-kwargs",
    "mixed-case-variable-in-class-scope",
    "multi-line-summary-second-line",
    "raise-vanilla-args",
    "raw-string-in-exception",
    "too-many-arguments",
    "typing-only-standard-library-import",
    "typing-only-third-party-import",
]
preview = true
select = ["ALL"]
unfixable = ["commented-out-code"]

[tool.ruff.lint.isort]
known-first-party = [
    "mdformat_mkdocs",
    "tests",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["undocumented-public-package"]
"tests/*.py" = [
    "assert",
    "import-private-name",
    "missing-return-type-private-function",
    "missing-return-type-undocumented-public-function",
    "missing-type-function-argument",
    "pytest-missing-fixture-name-underscore",
    "undocumented-public-function",
    "undocumented-public-module",
    "unused-function-argument",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.tomlsort]
all = true
in_place = true
trailing_comma_inline_array = true

[tool.tomlsort.overrides."tool.pytest-watcher.*"]
inline_arrays = false

[tool.tomlsort.overrides."tool.tox.env.*"]
inline_arrays = false

[tool.tox]
basepython = [
    "py310",
    "py314",
]
env_list = [
    "hook-min",
    "prek",
    "ruff",
    "test-min",
    "type",
]
isolated_build = true
requires = ["tox>=4.32.0"]
skip_missing_interpreters = false

[tool.tox.env.canary]
basepython = ["py314"]
changedir = "{tox_root}"
commands = [[
    "python",
    "scripts/canary.py",
    { default = [], extend = true, replace = "posargs" },
]]
description = "Run mdformat idempotency checks against real downstream repos configured in scripts/canary_repos.json. Optionally specify: '-- some-repo another-repo' to test a subset."
skip_install = false

[tool.tox.env.cz]
basepython = ["py314"]
commands = [[
    "cz",
    "bump",
    { default = [], extend = true, replace = "posargs" },
]]
commands_pre = [[
    "tox",
    "-e",
    "canary",
]]
deps = "commitizen>=4.10.0"
description = "Bump version using commitizen. Optionally specify: '-- --increment MAJOR|MINOR|PATCH' or '-- --dry-run'"
skip_install = true

[tool.tox.env.hook-min]
basepython = ["py310"]
commands = [[
    "prek",
    "run",
    "--config=.pre-commit-test.yaml",
    "--all-files",
    { default = [
    "--show-diff-on-failure",
    "--verbose",
], extend = true, replace = "posargs" },
]]
deps = "prek>=0.2.17"

[tool.tox.env.prek]
basepython = ["py314"]
commands = [[
    "prek",
    "run",
    "--all-files",
    { default = [], extend = true, replace = "posargs" },
]]
deps = "prek>=0.2.17"
skip_install = true

[tool.tox.env.ruff]
basepython = ["py314"]
commands = [
    [
    "ruff",
    "check",
    ".",
    "--fix",
    { default = [], extend = true, replace = "posargs" },
],
    [
    "ruff",
    "format",
    ".",
],
]
deps = "ruff>=0.14.5"
description = "Optionally, specify: '-- --unsafe-fixes'"
skip_install = true

[tool.tox.env.test]
basepython = ["py314"]
commands = [[
    "pytest",
    "--cov=mdformat_mkdocs",
    { default = [], extend = true, replace = "posargs" },
]]
description = "Optionally, specify: '-- --exitfirst --failed-first --new-first -vv"
extras = ["test"]

[tool.tox.env.test-min]
basepython = ["py310"]
commands = [[
    "pytest",
    "--cov=mdformat_mkdocs",
]]
extras = ["test"]

[tool.tox.env.type]
basepython = ["py314"]
commands = [[
    "mypy",
    "./mdformat_mkdocs",
    { default = [], extend = true, replace = "posargs" },
]]
deps = ["mypy>=1.18.2"]

[tool.tox.env_run_base]
commands = [["error-commands-are-not-set"]]

[tool.uv.build-backend]
module-root = ""
