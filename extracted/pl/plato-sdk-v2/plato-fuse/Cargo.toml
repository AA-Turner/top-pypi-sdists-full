[package]
name = "plato-fuse"
version = "0.1.0"
edition = "2021"

[dependencies]
fuser = { version = "0.15", features = ["abi-7-23"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
log = "0.4"
env_logger = "0.11"
nix = { version = "0.29", features = ["signal", "fs"] }

# S3 downloads
aws-sdk-s3 = "1"
aws-config = "1"
aws-credential-types = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }

[dev-dependencies]
serial_test = "3"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
