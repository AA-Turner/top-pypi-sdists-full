[project]
name = "plato-world-fuse-correctness"
version = "0.0.1"
description = "Integration correctness test for Rust plato-fuse + NFS"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["plato-sdk-v2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"__init__.py" = "plato_fuse_correctness_world/__init__.py"
"world.py" = "plato_fuse_correctness_world/world.py"
"workload.py" = "plato_fuse_correctness_world/workload.py"

[project.entry-points."plato.worlds"]
plato-world-fuse-correctness = "plato_fuse_correctness_world:FuseCorrectnessWorld"
