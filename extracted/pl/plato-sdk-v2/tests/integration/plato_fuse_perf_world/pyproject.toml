[project]
name = "plato-world-plato-fuse-perf-test"
version = "0.0.1"
description = "Integration perf world for Rust plato-fuse comparisons"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["plato-sdk-v2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"__init__.py" = "plato_fuse_perf_world/__init__.py"
"world.py" = "plato_fuse_perf_world/world.py"

[project.entry-points."plato.worlds"]
plato-world-plato-fuse-perf-test = "plato_fuse_perf_world:PlatoFusePerfWorld"
