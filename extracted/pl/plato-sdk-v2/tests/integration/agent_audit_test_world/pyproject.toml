[project]
name = "plato-world-agent-audit-test"
version = "0.0.1"
description = "Integration test world for tool-attributed filesystem audit"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["plato-sdk-v2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"__init__.py" = "agent_audit_test_world/__init__.py"
"world.py" = "agent_audit_test_world/world.py"

[project.entry-points."plato.worlds"]
plato-world-agent-audit-test = "agent_audit_test_world:AgentAuditTestWorld"
