[project]
name = "plato-world-minimal-test"
version = "0.0.1"
description = "Minimal integration test world for runner exit path debugging"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["plato-sdk-v2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"__init__.py" = "minimal_test_world/__init__.py"
"world.py" = "minimal_test_world/world.py"

[project.entry-points."plato.worlds"]
plato-world-minimal-test = "minimal_test_world:MinimalTestWorld"
