[project]
name = "plato-world-durable-slack-test"
version = "0.0.4.dev20260401155308"
description = "Test world for durable stage Slack notifications"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["plato-sdk-v2"]

[build-system]
requires = ["hatchling", "plato-sdk-v2"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel.force-include]
"__init__.py" = "durable_slack_test_world/__init__.py"
"world.py" = "durable_slack_test_world/world.py"

[project.entry-points."plato.worlds"]
plato-world-durable-slack-test = "durable_slack_test_world:DurableSlackTestWorld"
