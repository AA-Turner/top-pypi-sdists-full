[project]
name = "plato-world-webclone-setup-test"
version = "0.0.1"
description = "Integration test for webclone workspace setup on FUSE"
requires-python = ">=3.12"
dependencies = ["plato-sdk-v2", "plato-world-webclone"]

[tool.hatch.build.targets.wheel.force-include]
"__init__.py" = "webclone_setup_test_world/__init__.py"
"world.py" = "webclone_setup_test_world/world.py"

[project.entry-points."plato.worlds"]
plato-world-webclone-setup-test = "webclone_setup_test_world:WebcloneSetupTestWorld"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
