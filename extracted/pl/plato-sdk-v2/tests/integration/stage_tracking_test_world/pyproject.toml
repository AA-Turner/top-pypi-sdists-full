[project]
name = "plato-world-stage-tracking-test"
version = "0.0.1"
description = "Test world for durable stage tracking"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["plato-sdk-v2"]

[build-system]
requires = ["hatchling", "plato-sdk-v2"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel.force-include]
"__init__.py" = "stage_tracking_test_world/__init__.py"
"world.py" = "stage_tracking_test_world/world.py"

[project.entry-points."plato.worlds"]
plato-world-stage-tracking-test = "stage_tracking_test_world:StageTrackingTestWorld"
