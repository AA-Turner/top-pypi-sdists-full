[project]
name = "plato-world-agent-test"
version = "0.0.1"
description = "Integration test world for agent MCP + ATIF validation"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["plato-sdk-v2", "fastmcp>=2.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"__init__.py" = "agent_test_world/__init__.py"
"world.py" = "agent_test_world/world.py"

[project.entry-points."plato.worlds"]
plato-world-agent-test = "agent_test_world:AgentTestWorld"
