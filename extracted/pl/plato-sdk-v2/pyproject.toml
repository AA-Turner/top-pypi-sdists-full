[project]
name = "plato-sdk-v2"
dynamic = ["version"]
description = "Python SDK for the Plato API"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "Plato", email = "support@plato.so" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "gitpython==3.1.50",
    "httpx==0.28.1",
    "pydantic==2.12.5",
    "python-dotenv==1.2.2",
    "tenacity==9.1.2",
    "typer==0.21.1",
    "rich==14.2.0",
    "pyyaml==6.0.3",
    "tomli==2.4.0",
    "aiohttp==3.14.1",
    "pydantic-settings==2.14.2",
    "requests==2.33.0",
    # For sims/generator
    "jinja2==3.1.6",
    "openapi-pydantic==0.5.1",
    "datamodel-code-generator==0.53.0",
    "email-validator==2.3.0",
    # For agents (Gemini)
    "google-genai==1.59.0",
    "cryptography==46.0.7",
    # For LLM calls (multi-provider)
    "litellm==1.90.0",
    "blake3==1.0.8",
    "cloudpickle==3.1.2",
    # For tracing/telemetry
    "opentelemetry-api==1.39.1",
    "opentelemetry-sdk==1.39.1",
    "opentelemetry-exporter-otlp-proto-http==1.39.1",
    "opentelemetry-instrumentation-system-metrics==0.60b1",
    "boto3==1.42.52",
    "fastmcp==3.2.0",
    "pathspec==1.0.4",
    "jsonschema==4.23.0",
]

[project.scripts]
plato = "plato.cli:main"
plato-git-ops-server = "plato.git_ops.server:main"
plato-apple-container-server = "plato.utils.apple_container_server:main"
plato-world-runner = "plato.worlds.runner:main"
plato-agent-runner = "plato.agents.runner:main"
plato-agent-daemon = "plato.agents.daemon.main:main"

[project.entry-points."plato.worlds"]
plato-world-test-harness = "plato.worlds.testing.harness_world:WorldTestHarnessWorld"

[project.entry-points."plato.agents"]
test-harness-agent = "plato.agents.testing.harness_agent:TestHarnessAgent"

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-asyncio>=0.21", "ruff>=0.1", "basedpyright>=1.18"]
segmentation = ["numpy>=1.24.0", "Pillow>=10.0.0"]
worlds = ["dvc", "dvc-s3"]
db-cleanup = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "aiomysql>=0.2",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build]
exclude = ["plato-fuse/", "tests/"]

[tool.hatch.build.targets.wheel]
packages = ["plato"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["plato/_generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingImports = false
reportMissingTypeStubs = false
include = ["plato"]
exclude = ["plato/v1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 10
testpaths = ["tests/unit", "tests/integration"]
markers = [
    "integration: marks tests that require real Chronos VMs and API keys (PLATO_API_KEY, ANTHROPIC_API_KEY, OPENAI_API_KEY)",
    "timeout: override the default 10s unit test timeout (e.g. @pytest.mark.timeout(60))",
]

[dependency-groups]
dev = [
    "basedpyright>=1.37.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.11",
    "ty",
    # For type checking - these are optional runtime deps but needed for ty to resolve imports
    "playwright",
    "streamlit",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg2-binary",
    "pymysql",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",
]

[tool.ty.rules]
# Ignore unresolved imports for deps that can't be in dev group:
# - harbor: requires Python 3.12+, project supports 3.11+
# - hatchling: build-time only dependency
unresolved-import = "ignore"
# Ignore unresolved attributes - ty bug with httpx module structure (httpx.Request/Response/Client)
unresolved-attribute = "ignore"

[tool.uv]
prerelease = "allow"
