[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-containerapps-sandbox"
version = "0.1.0b4"
description = "Azure Container Apps Sandbox SDK for Python — data plane + sandbox group management. Community preview."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Microsoft", email = "acasupport@microsoft.com"}]
keywords = ["azure", "azure.containerapps", "azure sdk", "sandbox", "container apps"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["azure-core>=1.30", "azure-mgmt-core>=1.4", "azure-identity>=1.15", "aiohttp>=3.0,<4", "certifi>=2023.7.22"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "build", "azure-mgmt-authorization>=4.0", "azure-mgmt-resource>=23.0", "azure-mgmt-subscription>=3.0"]

[project.urls]
Homepage = "https://github.com/microsoft/azure-container-apps"
Repository = "https://github.com/microsoft/azure-container-apps"
"Bug Tracker" = "https://github.com/microsoft/azure-container-apps/issues"

[tool.setuptools.packages.find]
include = ["azure*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]


