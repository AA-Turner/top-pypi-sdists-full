[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.12.0,<0.13.0"]

[project]
name = "cucumber-tag-expressions"
description = "Provides a tag-expression parser and evaluation logic for cucumber/behave"
version = "11.0.1"
keywords = [
    "BDD",
    "testing",
    "cucumber",
    "tag-expressions",
    "behave",
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[[project.authors]]
name = "Jens Engel"
email = "jenisys@noreply.github.com"

[project.urls]
Homepage = "https://github.com/cucumber/tag-expressions"
Download = "https://pypi.org/project/cucumber-tag-expressions"
Repository = "https://github.com/cucumber/tag-expressions"
Issues = "https://github.com/cucumber/tag-expressions/issues/"
Changelog = "https://github.com/cucumber/tag-expressions/releases"

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "coverage>=7.10.7",
    "pytest>=6.0.1",
    "pyyaml>=6.0.3",
]

[tool.ruff.lint]
extend-select = [
    "B",
    "C4",
    "FURB",
    "I",
    "ISC",
    "N",
    "PERF",
    "PIE",
    "RET",
    "S",
    "TID",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
addopts = "--doctest-glob=README.md"
testpaths = [
    "README.md",
    "src",
    "tests",
]

[tool.coverage.run]
source = ["cucumber_tag_expressions"]
branch = true

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    'if self\.debug',
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    '@(abc\.)?abstractmethod',
]
ignore_errors = true
show_missing = true

[tool.coverage.html]
directory = "build/coverage.html"

[tool.coverage.xml]
output = "build/coverage.xml"
