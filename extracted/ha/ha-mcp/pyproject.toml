[build-system]
requires = ["uv_build>=0.12.17,<0.14"]
build-backend = "uv_build"

[project]
name = "ha-mcp"
version = "9.2.0"
description = "Configure and automate Home Assistant with Claude, ChatGPT, and other AI assistants."
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "mcp",
    "home-assistant",
    "ai",
    "automation",
    "smart-home",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "anyio>=4.10; python_version >= '3.14'",
    "anyio>=4.9; python_version < '3.14'",
    "authlib>=1.6.11",
    "certifi>=2026.10.19",
    "cyclopts>=4.0.0",
    "exceptiongroup>=1.2.2",
    "griffelib>=2.0.0",
    "httpx2>=2.10.0",
    "joserfc>=1.5.0",
    "jsonref>=1.1.0",
    "jsonschema>=4.20.0",
    "jsonschema-path>=0.3.4",
    "openapi-pydantic>=0.6.0",
    "opentelemetry-api>=1.28.0",
    "platformdirs>=4.0.0",
    "psutil>=7.0.0",
    "py-key-value-aio[filetree,keyring,memory]>=0.4.4,<0.5.0",
    "pydantic-settings>=2.0.0",
    "pyjwt[crypto]>=2.10.1",
    "pyperclip>=1.9.0",
    "python-multipart>=0.0.26",
    "pywin32>=311; sys_platform == 'win32'",
    "pyyaml>=6.0,<7.0",
    "rich>=13.9.4",
    "sse-starlette>=3.0.0",
    "starlette>=1.0.1",
    "typing-extensions>=4.13.0",
    "typing-inspection>=0.4.1",
    "uncalled-for>=0.4.0",
    "uvicorn>=0.35; sys_platform != 'emscripten'",
    "watchfiles>=1.0.0",
    "httpx[socks]>=0.28.1,<0.29",
    "pydantic[email]>=2.13.4,<3",
    "python-dotenv>=1.2.4,<2",
    "truststore>=0.10.4,<0.11",
    "cryptography>=48.0.0,<51",
    "pydantic-monty==0.0.18",
    "tzdata>=2024.1",
    "packaging>=24.0",
]

[[project.authors]]
name = "Julien"
email = "github@qc-h.net"

[project.urls]
Homepage = "https://github.com/homeassistant-ai/ha-mcp"
"Bug Tracker" = "https://github.com/homeassistant-ai/ha-mcp/issues"
Repository = "https://github.com/homeassistant-ai/ha-mcp"

[project.scripts]
ha-mcp = "ha_mcp.__main__:main"
ha-mcp-smoke-test = "ha_mcp.smoke_test:main"
ha-mcp-web = "ha_mcp.__main__:main_web"
ha-mcp-oauth = "ha_mcp.__main__:main_oauth"
ha-mcp-oidc = "ha_mcp.__main__:main_oidc"

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
cache_dir = "/tmp/.mypy_cache"
exclude = ["^src/ha_mcp/resources/skills-vendor/"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["ha_mcp._vendor.*"]
follow_imports = "skip"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "voluptuous",
    "voluptuous.*",
]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
warn_return_any = false
disable_error_code = [
    "import-not-found",
    "import-untyped",
]

