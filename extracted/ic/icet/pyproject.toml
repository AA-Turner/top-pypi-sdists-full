[build-system]
requires = [
    "setuptools>=77.0",
    "pybind11>=3.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "icet"
description = "A Pythonic approach to cluster expansions"
dynamic = ["version"]
dependencies = [
    "ase",
    "numba>=0.59",
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "spglib>=2.5",
    "trainstation>=1.1",
]
authors = [
  {name = "The icet developer team"}
]
maintainers = [
  {name = "The icet developer team"}
]
license = "MPL-2.0"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
readme = "README.rst"
requires-python = ">=3.10"
keywords = ["chemistry", "physics", "scientific"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
test = [
    "coverage",
    "flake8",
    "nbmake",
    "pytest",
    "xdoctest",
]
documentation = [
    "pydata-sphinx-theme",
    "nbsphinx",
    "sphinx-autodoc-typehints",
    "sphinx-design",
    "sphinx-sitemap",
]
optional = [
    "highspy",
]

[project.urls]
Documentation = "https://icet.materialsmodeling.org"
Repository = "https://gitlab.com/materials-modeling/icet/"

[tool.setuptools.packages.find]
where = ["."]
include = ["icet*", "mchammer*"]
exclude = ["tests*"]

[tool.setuptools.dynamic]
version = { attr = "icet.__version__" }
