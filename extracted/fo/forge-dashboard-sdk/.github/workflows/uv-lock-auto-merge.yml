# release.yml's fixup-lockfile job opens a pull request syncing uv.lock's
# own version entry after a release-please release, but never merges it
# (#18's own race: sync-lockfile can't run before the release PR merges,
# so fixup-lockfile runs after instead, on its own branch). Ryan granted a
# durable, account-wide standing exception for this class of PR (#46):
# merge once CI is green, the same way regenerate-auto-merge.yml and
# release-auto-merge.yml already do for this repo's other two
# repo-generated PR classes.
#
# Gated on the branch name fixup-lockfile opens its pull request from and
# the label it applies, the same shape regenerate-auto-merge.yml uses.
#
# pull_request, not pull_request_target: fixup-lockfile's pull request
# comes from a branch on this repo, never a fork.
name: uv-lock-auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: |
      startsWith(github.event.pull_request.head.ref, 'fix/uv-lock-post-release-') &&
      contains(github.event.pull_request.labels.*.name, 'bug')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # RELEASE_TOKEN, not the default GITHUB_TOKEN: a GITHUB_TOKEN merge
      # produces a commit GitHub won't re-trigger workflows on, which
      # would leave this repo's own release.yml never firing after an
      # auto-merged sync lands on main.
      - name: Merge the PR
        run: |
          set -euo pipefail
          if out=$(gh pr merge --auto --squash "$PR_URL" 2>&1); then
            echo "$out"; exit 0
          fi
          echo "$out" >&2
          case "$out" in
            *"is in unstable status"* | *"is in clean status"*)
              state=$(gh pr view "$PR_URL" --json mergeStateStatus --jq .mergeStateStatus)
              case "$state" in
                UNSTABLE | CLEAN) gh pr merge --squash "$PR_URL" ;;
                *) echo "Not merging directly: merge state is $state" >&2; exit 1 ;;
              esac ;;
            *) exit 1 ;;
          esac
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
