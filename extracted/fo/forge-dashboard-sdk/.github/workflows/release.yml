name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      # A GITHUB_TOKEN-authored PR needs a human approval GitHub itself
      # injects (rules/releases.md's "RELEASE_TOKEN PAT is not automatically
      # droppable"), and even with that approved, its squash-merge commit is
      # GITHUB_TOKEN-authored too -- no workflow fires on it, so this job
      # never re-runs to cut the actual tag. RELEASE_TOKEN (a real-identity
      # PAT) sidesteps both. See release-auto-merge.yml for the other half.
      #
      # Not wrapped in nick-fields/retry (rules/releases.md's "Retry a
      # release job through GitHub's transient rate limit") -- that action
      # only retries a shell `command:`, not another `uses:` step, so it
      # can't wrap a marketplace action directly. A rate-limited run here
      # still needs a manual re-run until release-please-action grows its
      # own retry or this gets rearchitected around a CLI invocation.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          release-type: python
          token: ${{ secrets.RELEASE_TOKEN }}

  sync-lockfile:
    needs: release-please
    if: ${{ needs.release-please.outputs.prs_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # release-please bumps the `version` key in pyproject.toml but has no
      # idea uv.lock also records that same version for the package's own
      # self-entry -- left alone, every release PR fails `uv sync --locked`
      # in CI for a reason that has nothing to do with the release itself
      # -- confirmed live on a sibling SDK repo built the same way.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.15"
      - run: uv lock
      - run: |
          if ! git diff --quiet -- uv.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "chore: sync uv.lock with release-please's version bump"
            git push
          fi

  fixup-lockfile:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # sync-lockfile (above) already fixes this before merge, but
      # release.yml fires on every push to main -- a Dependabot merge
      # landing while the release PR is still open re-triggers
      # release-please, which force-resets its own PR branch from its
      # own computed state, silently wiping sync-lockfile's commit
      # before anyone merges it (confirmed live, #18). Running here
      # instead, after the release has actually landed, has no branch
      # left for release-please to reset out from under it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.15"
      - run: uv lock
      - env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if git diff --quiet -- uv.lock; then
            exit 0
          fi
          branch="fix/uv-lock-post-release-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add uv.lock
          git commit -m "fix(deps): sync uv.lock with the release just cut"
          git push origin "$branch"
          gh pr create --title "fix(deps): sync uv.lock with the release just cut" \
            --label bug \
            --body "Opened automatically right after a release: uv.lock's self-version drifted from pyproject.toml's, same race #18 describes."

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC) -- no token to manage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.15"
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
