site_name: forge-dashboard-sdk-python
site_url: https://alrayyes.github.io/forge-dashboard-sdk-python/
repo_url: https://github.com/alrayyes/forge-dashboard-sdk-python

theme:
  name: material

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            docstring_style: google
            show_signature_annotations: true

nav:
  - Home: index.md
  - API reference: reference.md
