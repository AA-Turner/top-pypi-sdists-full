[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling==1.33.0" ]

[project]
name = "forge-dashboard-sdk"
version = "15.0.18"
description = "Python client for forge-dashboard's REST API"
readme = "README.md"
license = "MIT"
authors = [ { name = "Ryan Kes", email = "ryan@andthensome.nl" } ]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [ "attrs==26.1.0", "httpx==0.28.1" ]
urls.Homepage = "https://github.com/alrayyes/forge-dashboard-sdk-python"
urls.Issues = "https://github.com/alrayyes/forge-dashboard-sdk-python/issues"

[dependency-groups]
dev = [
  "bandit==1.9.4",
  "mutmut==3.8.1",
  "mypy==2.4.1",
  "openapi-python-client==0.29.1",
  "pip-audit==2.10.1",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "ruff==0.17.3",
]
docs = [
  "mkdocs==1.6.1",
  "mkdocs-material==9.8.0",
  "mkdocstrings[python]==1.0.8",
]

[tool.hatch]
build.targets.wheel.packages = [ "src/forge_dashboard" ]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [ "mutants", "src/forge_dashboard/_generated" ]
# Otherwise ruff only skips excluded paths while walking a directory --
# lefthook and CI both pass staged/changed files explicitly, and without
# this the exclude list is silently ignored for those invocations.
force-exclude = true
lint.select = [ "B", "E", "F", "I", "RUF", "S", "SIM", "UP" ]
lint.per-file-ignores."tests/*" = [ "S101" ]

[tool.bandit]
exclude_dirs = [ "src/forge_dashboard/_generated", "tests" ]

[tool.mypy]
exclude = [ "mutants", "src/forge_dashboard/_generated" ]
strict = true
overrides = [ { module = "forge_dashboard._generated.*", ignore_errors = true } ]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.addopts = "-m 'not contract'"
ini_options.markers = [
  "contract: runs against a local Prism mock, needs FORGE_DASHBOARD_BASE_URL",
]

[tool.coverage]
run.source = [ "src/forge_dashboard" ]
run.omit = [ "src/forge_dashboard/_generated/*" ]

[tool.mutmut]
# Only the hand-written layer -- mutating the generated client tests the
# generator, not the SDK (rules/sdk-generation.md's "Testing against the
# spec, not a hand-written stub").
source_paths = [
  "src/forge_dashboard/client.py",
  "src/forge_dashboard/errors.py",
  "src/forge_dashboard/retry.py",
]
# The rest of the package the mutated files import from -- not mutated,
# but needed unmodified in the sandbox for the tests to even import.
also_copy = [
  "src/forge_dashboard/__init__.py",
  "src/forge_dashboard/py.typed",
  "src/forge_dashboard/_generated/",
  # tests/test_reports.py loads hack/reports.py from here.
  "hack/",
  # tests/test_auto_merge_workflows.py runs the merge steps from here.
  ".github/workflows/",
  "pyproject.toml",
  "uv.lock",
]
