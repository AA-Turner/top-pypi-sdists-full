[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scipy-stubs"
module-root = ""
source-include = [".mypyignore"]

[tool.uv.sources.stubdefaulter]
git = "https://github.com/JelleZijlstra/stubdefaulter.git"
rev = "866ecca"

[tool.typos.files]
extend-exclude = [
    "*.pyi",
    ".mypyignore",
]

[tool.typos.default]
extend-ignore-identifiers-re = ["ND|Nd|Theis|ttest|TtestResult|SeQUeNCe|whos"]

[tool.mypy]
strict = true
strict_equality_for_none = true
allow_redefinition = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
]
warn_unreachable = false

[tool.pyright]
exclude = [
    "**/__pycache__",
    "**/.mypy_cache",
    "**/.ruff_cache",
    "**/.tox",
    "**/.venv",
]
ignore = [".venv"]
stubPath = "."
pythonPlatform = "All"
typeCheckingMode = "strict"
deprecateTypingAliases = true
enableReachabilityAnalysis = false
enableTypeIgnoreComments = false
reportCallInDefaultInitializer = true
reportImplicitOverride = true
reportImportCycles = true
reportMissingSuperCall = true
reportPropertyTypeMismatch = false
reportUninitializedInstanceVariable = true
reportUnnecessaryTypeIgnoreComment = true
reportUnusedCallResult = true
reportImplicitStringConcatenation = false
reportPrivateImportUsage = false
reportPrivateUsage = false
failOnWarnings = true
reportIgnoreCommentWithoutRule = true
reportImplicitAbstractClass = false
reportImplicitRelativeImport = true
reportInvalidCast = true
reportPrivateLocalImportUsage = true
reportUnannotatedClassAttribute = false
strictGenericNarrowing = false

[[tool.pyright.executionEnvironments]]
root = "tests"
reportInvalidStubStatement = false
reportUnusedCallResult = false
reportUnusedExpression = false

[tool.pyrefly]
project-includes = [
    "scipy-stubs",
    "scripts",
    "tests",
]
enabled-ignores = ["pyrefly"]

[tool.pyrefly.errors]
implicit-abstract-class = "error"
implicit-any = "error"
implicitly-defined-attribute = "error"
missing-override-decorator = "error"
missing-source = "ignore"
not-required-key-access = "error"
open-unpacking = "error"
unannotated-attribute = "error"
unannotated-parameter = "error"
unannotated-return = "error"
untyped-import = "error"
unused-ignore = "error"
variance-mismatch = "error"

[[tool.pyrefly.sub-config]]
matches = "scipy-stubs/*/__init__.pyi"

[tool.pyrefly.sub-config.errors]
deprecated = "ignore"

[[tool.pyrefly.sub-config]]
matches = "scipy-stubs/odr/*.pyi"

[tool.pyrefly.sub-config.errors]
deprecated = "ignore"

[[tool.pyrefly.sub-config]]
matches = "scipy-stubs/special/_ufuncs.pyi"

[tool.pyrefly.sub-config.errors]
bad-override = "ignore"

[[tool.pyrefly.sub-config]]
matches = "scipy-stubs/special/orthogonal.pyi"

[tool.pyrefly.sub-config.errors]
deprecated = "ignore"

[[tool.pyrefly.sub-config]]
matches = "scipy-stubs/stats/_distn_infrastructure.pyi"

[tool.pyrefly.sub-config.errors]
bad-override = "ignore"

[[tool.pyrefly.sub-config]]
matches = "tests/integrate/test_quadrature.pyi"

[tool.pyrefly.sub-config.errors]
unused-ignore = "ignore"

[tool.ty.src]
include = [
    "scipy-stubs",
    "scripts",
    "tests",
]

[tool.ty.environment]
python-platform = "all"

[tool.ty.terminal]
error-on-warning = true

[tool.ty.analysis]
respect-type-ignore-comments = false

[tool.ty.rules]
division-by-zero = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"
unsupported-dynamic-base = "error"
unused-ignore-comment = "error"

[[tool.ty.overrides]]
include = [
    "scipy-stubs/*/__init__.pyi",
    "scipy-stubs/odr/*.pyi",
    "scipy-stubs/special/orthogonal.pyi",
]

[tool.ty.overrides.rules]
deprecated = "ignore"

[[tool.ty.overrides]]
include = [
    "scipy-stubs/stats/_distn_infrastructure.pyi",
    "scipy-stubs/special/_ufuncs.pyi",
]

[tool.ty.overrides.rules]
invalid-method-override = "ignore"

[tool.repo-review]
ignore = [
    "PY004",
    "PY006",
    "PY007",
    "PP301",
    "PC111",
    "PC170",
    "RTD",
]

[tool.ruff]
src = [
    "scipy-stubs",
    "scripts",
]
extend-exclude = [
    ".git",
    ".mypy_cache",
    ".tox",
    ".venv",
]
force-exclude = true
line-length = 130
preview = true

[tool.ruff.format]
line-ending = "lf"
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",
    "FBT",
    "CPY",
    "EM",
    "TD",
    "FIX",
    "DOC",
    "any-type",
    "missing-trailing-comma",
]

[tool.ruff.lint.per-file-ignores]
"*.pyi" = [
    "F",
    "N",
    "A",
    "PLR",
    "FURB",
    "ambiguous-variable-name",
    "numeric-literal-too-long",
    "import-private-name",
    "bad-dunder-method-name",
]

[tool.ruff.lint.flake8-import-conventions]
banned-from = [
    "numpy",
    "numpy.typing",
    "optype",
    "optype.numpy",
    "optype.typing",
]

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
ctypes = "ct"
datetime = "dt"
numpy = "np"
"numpy.typing" = "npt"
optype = "op"
"optype.numpy" = "onp"
"optype.numpy.compat" = "npc"
"optype.typing" = "opt"

[tool.ruff.lint.isort]
case-sensitive = true
combine-as-imports = true
extra-standard-library = [
    "_typeshed",
    "typing_extensions",
]
known-local-folder = ["scipy"]
split-on-trailing-comma = false

[tool.tox]
min_version = "4"
requires = ["tox-uv>=1"]
env_list = [
    "lint",
    "ty",
    "zuban",
    "pyrefly",
    "pyright",
    "mypy",
    "3.12",
    "3.13",
    "3.14",
]

[tool.tox.env_run_base]
description = "stubtest with {base_python}"
runner = "uv-venv-lock-runner"
dependency_groups = ["type"]
uv_sync_flags = [
    "--no-editable",
    "--reinstall-package=scipy-stubs",
]
commands = [
    [
    "stubtest",
    "--allowlist=.mypyignore",
    "scipy",
],
    [
    "stubdefaulter",
    "--packages=.",
    "--exit-zero",
    "--check",
],
]

[tool.tox.env.lint]
description = "lint"
runner = "uv-venv-lock-runner"
dependency_groups = ["lint"]
commands = [
    [
    "ruff",
    "check",
    "--show-fixes",
],
    [
    "ruff",
    "format",
    "--check",
],
    [
    "dprint",
    "check",
    "--incremental=false",
],
    [
    "repo-review",
    "--show=err",
    ".",
],
]

[tool.tox.env.ty]
description = "ty"
runner = "uv-venv-lock-runner"
dependency_groups = ["type"]
commands = [[
    "ty",
    "check",
    "--error-on-warning",
    "--output-format=concise",
    { replace = "posargs", default = [
    "scipy-stubs",
    "scripts",
], extend = true },
]]

[tool.tox.env.zuban]
description = "zuban"
runner = "uv-venv-lock-runner"
dependency_groups = ["type"]
commands = [[
    "zuban",
    "check",
    { replace = "posargs", default = [
    "scipy-stubs",
    "scripts",
], extend = true },
]]

[tool.tox.env.pyrefly]
description = "pyrefly"
runner = "uv-venv-lock-runner"
dependency_groups = ["type"]
commands = [[
    "pyrefly",
    "check",
    { replace = "posargs", default = [], extend = true },
]]

[tool.tox.env.pyright]
description = "basedpyright"
runner = "uv-venv-lock-runner"
dependency_groups = ["type"]
commands = [[
    "basedpyright",
    { replace = "posargs", default = [], extend = true },
]]

[tool.tox.env.mypy]
description = "mypy"
runner = "uv-venv-lock-runner"
dependency_groups = ["type"]
commands = [[
    "mypy",
    "--no-incremental",
    { replace = "posargs", default = ["."], extend = true },
]]

[project]
name = "scipy-stubs"
version = "1.18.1.0"
description = "The official type stubs for SciPy"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = [
    "scipy",
    "typing",
    "stubs",
    "type-stubs",
    "type-hints",
    "type-checking",
    "static-typing",
    "shape-typing",
    "pep561",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Stubs Only",
]
requires-python = ">=3.12"
dependencies = ["optype[numpy]>=0.15.0,<0.20"]

[[project.authors]]
name = "Joren Hammudoglu"
email = "jhammudoglu@gmail.com"

[[project.maintainers]]
name = "Joren Hammudoglu"
email = "jhammudoglu@gmail.com"

[[project.maintainers]]
name = "SciPy Developers"
email = "scipy-dev@python.org"

[project.optional-dependencies]
scipy = ["scipy>=1.18.1,<1.19"]

[project.urls]
Homepage = "https://scipy.org/"
Repository = "https://github.com/scipy/scipy-stubs"
Issues = "https://github.com/scipy/scipy-stubs/issues"
Changelog = "https://github.com/scipy/scipy-stubs/releases"

[dependency-groups]
extras = ["scipy-stubs[scipy]"]
ci = ["packaging>=26.3"]
lint = [
    { include-group = "extras" },
    "dprint-py==0.56.1.0",
    "ruff==0.16.4",
    "sp-repo-review[cli]==2026.8.14",
]
type = [
    { include-group = "extras" },
    { include-group = "ci" },
    "array-api-compat==1.14.0, !=1.15.0",
    "pytest==9.1.1",
    "matplotlib==3.11.1",
    "basedpyright==1.39.10",
    "mypy[faster-cache]==2.3.1",
    "pyrefly==1.2.0",
    "stubdefaulter>=0.1.0",
    "ty==0.0.73",
    "zuban==0.9.1",
]

[[dependency-groups.dev]]
include-group = "lint"

[[dependency-groups.dev]]
include-group = "type"
