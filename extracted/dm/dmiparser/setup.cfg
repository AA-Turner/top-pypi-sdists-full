[metadata]
author = Qin Fandong
author_email = shell_way@foxmail.com
classifiers = 
	Operating System :: OS Independent
	Programming Language :: Python
	Programming Language :: Python :: 3
	Programming Language :: Python :: 3 :: Only
description = This parses dmidecode output to Python objects. The Python module supports multiple output formats (JSON, JSONC, YAML, XML) via the format parameter, and provides CLI tools with the same capabilities
download_url = https://github.com/Arondight/python-dmiparser/tags
license = MIT
license_files = LICENSE
long_description = file: README.md
long_description_content_type = text/markdown
name = dmiparser
platforms = Any
url = https://github.com/Arondight/python-dmiparser
version = attr: dmiparser.__version__

[options]
include_package_data = True
install_requires = 
	pyyaml
packages = find:
python_requires = >=3.6
zip_safe = True

[options.packages.find]
exclude = 
	tests*

[options.entry_points]
console_scripts = 
	dmidecoder = dmiparser.dmidecoder:main
	dmiparser = dmiparser:main

[egg_info]
tag_build = 
tag_date = 0

