[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true

# Keep native symbols in Python wheels so production profiles can resolve Rust
# frames while retaining the optimization settings used by release builds.
[profile.python-release]
inherits = "release"
debug = 1
strip = "none"

[workspace]
members = ["statsig-rust", "statsig-grpc", "statsig-pyo3"]
resolver = "2"
exclude = [
    "examples/rust/sample-usage",
    "examples/rust/perf-monitor",
    "examples/rust/mem-bench",
    "examples/rust/perf-bench",
    "examples/rust/verify-package",
    "benchmarking/bench-cluster",
]

[workspace.package]
edition = "2021"
license = "ISC"
version = "0.25.0"
homepage = "https://statsig.com/"
authors = ["Statsig", "Daniel Loomb <daniel@statsig.com>"]
readme = "README.md"
repository = "https://github.com/statsig-io/statsig-server-core"
description = "Statsig Rust SDK for usage in multi-user server environments."
