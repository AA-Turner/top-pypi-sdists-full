[package]
name = "oai-statsig-rust"
description = "Statsig Rust SDK for usage in multi-user server environments."
edition.workspace = true
license.workspace = true
version.workspace = true
homepage.workspace = true
repository.workspace = true

[lib]
name = "statsig_rust"

[dependencies]
arc-swap = "1.9.2"
ahash = "0.8.12"
async-trait = "0.1.92"
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
chrono = "0.4.45"
dashmap = "6.2.1"
file-guard = "0.2.0"
fs4 = "1.1.0"
flate2 = "1.1.10"
futures = "0.3.34"
indexmap = { version = "2.14.2", features = ["serde"], optional = true }
lazy_static = "1.5.0"
log = "0.4.34"
memchr = "2.8.3"
parking_lot = "0.12.5"
pin-project-lite = "0.2.17"
percent-encoding = "2.3.2"
rand = "0.8.8"
fancy-regex = "0.17.0"
reqwest = { version = "0.12.28", features = [
    "json",
    "gzip",
    "zstd",
    "rustls-tls",
    "brotli",
    "http2"
], optional = true, default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_derive = { version = "1.0.229", features = ["deserialize_in_place"] }
serde_json = { version = "1.0.151", features = [
    "float_roundtrip",
    "raw_value",
    "preserve_order",
] }
serde_with = "3.23.0"
sha2 = "0.10.9"
oai-statsig-grpc = { path = "../statsig-grpc", version = "0.31.0", optional = true }
simple_logger = { version = "5.2.0" }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }
url = "2.5.8"
uaparser = "0.6.4"
uuid = { version = "1.26.1", features = ["v4", "fast-rng"] }
zstd = { version = "0.13.3", features = ["zdict_builder"] }
tonic = "0.14.6"
brotli = "8.0.4"
bytes = "1.12.1"
prost = { version = "0.14.4", features = ["derive"] }
memmap2 = "0.9.11"
rkyv = { version = "0.8.18", features = ["aligned", "little_endian", "pointer_width_32"] }
ouroboros = "0.18.5"

[target.'cfg(target_env = "gnu")'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
# Preserve Windows system proxy discovery after reqwest made it opt-in.
reqwest = { version = "0.12.28", features = ["system-proxy"], optional = true, default-features = false }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[build-dependencies]
tonic-prost-build = "0.14.6"

[dev-dependencies]
mockito = "1.7.2"
assert-json-diff = "2.0.2"
wiremock = "0.6.5"
more-asserts = "0.3.1"
libc = "0.2.189"
serial_test = "4.0.1"
rusty-fork = "0.3.1"
# Downstream workspaces can unify this feature into the shared serde_json package.
# Exercise that production-equivalent decode path in mmap regression tests.
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }

[features]
default = ["reqwest"]
custom_network_provider = []
with_grpc = ["oai-statsig-grpc"]
testing = []
gcir-bench-timings = []
with_zstd = []
pyo3_event_zstd = []
ffi-support = []
ordered_user_data_maps = ["dep:indexmap"]
