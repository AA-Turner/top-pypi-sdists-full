[package]
name = "oai-statsig-rust"
description = "Statsig Rust SDK for usage in multi-user server environments."
edition.workspace = true
license.workspace = true
version.workspace = true
homepage.workspace = true
repository.workspace = true

[lib]
name = "statsig_rust"

[dependencies]
arc-swap = "1.7.1"
ahash = "0.8.11"
async-trait = "0.1.81"
base64 = "0.22.1"
chrono = "0.4.40"
dashmap = "6.1.0"
file-guard = "0.2.0"
fs4 = "1.1.0"
flate2 = "1.0.35"
futures = "0.3.30"
indexmap = { version = "2.13.0", features = ["serde"], optional = true }
lazy_static = "1.5.0"
log = "0.4.22"
memchr = "2.7.4"
parking_lot = "0.12.1"
percent-encoding = "2.3.1"
rand = "0.8.4"
fancy-regex = "0.17"
reqwest = { version = "0.12.14", features = [
    "json",
    "gzip",
    "zstd",
    "rustls-tls",
    "brotli",
    "http2"
], optional = true, default-features = false }
serde = { version = "1.0.204", features = ["derive"] }
serde_derive = { version = "1.0.204", features = ["deserialize_in_place"] }
serde_json = { version = "1.0.143", features = [
    "float_roundtrip",
    "raw_value",
    "preserve_order",
] }
serde_with = "3.4.0"
sha2 = "0.10.8"
oai-statsig-grpc = { path = "../statsig-grpc", version = "0.30.0", optional = true }
simple_logger = { version = "5.0.0" }
tempfile = "3.8.1"
tokio = { version = "1.39.1", features = ["full"] }
url = "2.5.4"
uaparser = "0.6.4"
uuid = { version = "1.10.0", features = ["v4", "fast-rng"] }
zstd = { version = "0.13.2", features = ["zdict_builder"] }
tonic = "0.14"
brotli = "8.0.2"
bytes = "1.7.0"
prost = { version = "0.14", features = ["derive"] }
memmap2 = "0.9"
rkyv = { version = "0.8", features = ["aligned", "little_endian", "pointer_width_32"] }
ouroboros = "0.18.0"

[target.'cfg(target_env = "gnu")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
mockito = "1.5.0"
assert-json-diff = "2.0.2"
wiremock = "0.6.2"
more-asserts = "0.3.1"
libc = "0.2"
serial_test = "3.2.0"
rusty-fork = "0.3.0"
# Downstream workspaces can unify this feature into the shared serde_json package.
# Exercise that production-equivalent decode path in mmap regression tests.
serde_json = { version = "1.0.143", features = ["arbitrary_precision"] }

[features]
default = ["reqwest"]
custom_network_provider = []
with_grpc = ["oai-statsig-grpc"]
testing = []
gcir-bench-timings = []
with_zstd = []
pyo3_event_zstd = []
ffi-support = []
ordered_user_data_maps = ["dep:indexmap"]
