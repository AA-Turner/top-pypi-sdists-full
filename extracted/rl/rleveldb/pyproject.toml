[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "rleveldb"
version = "1.0.0"
description = "LevelDB reader for Python — Rust core with PyO3 bindings"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["leveldb", "forensics", "database", "snappy", "ldb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Database",
    "Topic :: System :: Filesystems",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/DedInc/rleveldb"
Issues = "https://github.com/DedInc/rleveldb/issues"

[tool.maturin]
features = ["pyo3/extension-module", "pyo3/abi3-py38"]
python-source = "python"
module-name = "rleveldb._rleveldb"
sdist-include = ["LICENSE", "README.md"]