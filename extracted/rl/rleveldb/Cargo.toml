[package]
name = "rleveldb"
version = "1.0.0"
edition = "2021"
description = "High-performance LevelDB reader with Python bindings (Rust/PyO3)"
license = "MIT"
readme = "README.md"

[lib]
name = "rleveldb"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py38"] }
memmap2 = "0.9"
crc32c = "0.6"
snap = "1"
