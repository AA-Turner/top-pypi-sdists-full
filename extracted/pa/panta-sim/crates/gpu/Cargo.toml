[package]
name = "qsim-gpu"
version = "0.1.0"
edition = "2021"

[dependencies]
qsim-core = { path = "../core" }
num-complex = "0.4"
num-traits = "0.2"
wgpu = "29"
pollster = "0.4"
bytemuck = { version = "1.16", features = ["derive"] }
log = "0.4"
cudarc = { version = "0.16", default-features = false, features = ["std", "cuda-12060", "dynamic-loading", "driver", "runtime"], optional = true }

[dev-dependencies]
nalgebra = "0.33"

[features]
default = []
# NVIDIA cuStateVec backend (Tier-2).  사용자 PC NVIDIA + cuQuantum SDK 환경에서
# `--features gpu-cuda` 빌드.  sandbox / non-NVIDIA 환경은 default off.
gpu-cuda = ["dep:cudarc"]

