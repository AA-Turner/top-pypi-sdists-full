[package]
name = "qsim-python"
version = "0.1.0"
edition = "2021"

[lib]
name = "qsim_python"
crate-type = ["cdylib"]

[dependencies]
qsim-core = { path = "../core" }
qsim-simulator = { path = "../simulator" }
qsim-qasm = { path = "../qasm" }
qsim-transpiler = { path = "../transpiler" }
pyo3 = { version = "0.23", features = ["extension-module", "generate-import-lib"] }
numpy = "0.23"
num-complex = "0.4"

[features]
default = []
# NVIDIA cuStateVec backend pass-through.
gpu-cuda = ["qsim-simulator/gpu-cuda"]
