[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "panta-sim"
version = "1.4.1"
description = "Full Rust core quantum circuit simulator with Python bindings"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "quantumfia" }]
keywords = ["quantum", "simulator", "quantum-computing", "rust", "pyo3"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
viz = ["matplotlib>=3.5"]
qiskit = ["qiskit>=1.0"]
pennylane = ["pennylane>=0.35"]
cirq = ["cirq-core>=1.3"]
braket = ["amazon-braket-sdk>=1.80"]
# NOTE: 이 목록은 CI(.github/workflows/ci.yml) 가 설치하는 테스트 의존성과
# 일치해야 한다 — 누락 시 해당 어댑터 테스트가 skip 되어 CI 가드가 fail 한다
# (v0.8.22 의 braket 누락 사고).  `pip install panta-sim[dev]` 로 CI 환경 재현.
dev = [
    "pytest>=7",
    "matplotlib>=3.5",
    "qiskit>=1.0",
    "qiskit-aer>=0.13",
    "qiskit_qasm3_import",
    "pennylane>=0.35",
    "cirq-core>=1.3",
    "amazon-braket-sdk>=1.80",
    "maturin>=1.0",
]

[project.entry-points."pennylane.plugins"]
"panta-sim" = "panta_sim.pennylane_device:PantaDevice"

[project.urls]
Repository = "https://github.com/quantumfia/quantum-sim"
Issues = "https://github.com/quantumfia/quantum-sim/issues"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "panta_sim.qsim_python"
manifest-path = "crates/python-binding/Cargo.toml"
include = [{ path = "LICENSE", format = "sdist" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
