[project]
name = "fivetran_connector_sdk"
dynamic = ["version"]
authors = [
  { name="Fivetran", email="developers@fivetran.com" },
]
description = "Build custom connectors on Fivetran platform"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
  "requests==2.34.2",
  "pipreqs-fivetran==1.1.2",
  "prompt-toolkit==3.0.53",
  "pathspec==1.1.1",
  "cryptography==49.0.0",
  "tqdm==4.70.0",
  "fivetran-connector-sdk-core>=0.1,<1",  # runs the connector locally; the latest of this major version (a new major version breaks this package). While it is 0.x, every release must stay compatible with this package
  "typing-extensions>=4.7"
]

[project.scripts]
fivetran = "fivetran_connector_sdk_cli.fivetran_shim:main"

[project.entry-points."fivetran_cli.plugins"]
connector_sdk = "fivetran_connector_sdk_cli.plugin:PLUGIN"

[project.urls]
Homepage = "https://fivetran.com/docs/connectors/connector-sdk"
Github = "https://github.com/fivetran/connector_sdk"
Changelog = "https://fivetran.com/docs/connectors/connector-sdk/changelog"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# The open-source package: the in-process SDK (`fivetran_connector_sdk_cli`; its runner is the separate fivetran-connector-sdk-core), the code it shares with production
# (`fivetran_connector_sdk_common`), the shared telemetry (`fivetran_cli_telemetry`), and a module that gives the SDK its public name (`fivetran_connector_sdk`). It has no gRPC
# or protobuf. `build_package.sh` copies these directories and `../README.md` next to this file and builds there, so the
# package needs nothing outside its own directory. The wheel that runs on the platform (with gRPC) is built from
# `../production` and is not published to PyPI.
[tool.setuptools]
packages = [
  "fivetran_connector_sdk",
  "fivetran_connector_sdk_cli",
  "fivetran_connector_sdk_common",
  "fivetran_cli_telemetry",
]

[tool.setuptools.dynamic]
version = {attr = "fivetran_connector_sdk_common.__version__"}
