name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm meson ninja-build
        pip install vapoursynth numpy

    # -Davisynth=true so the AviSynth+ frontend is compiled here too; the
    # end-to-end test that drives it needs a libavisynth to link, which no
    # runner has, so it stays out of `meson test` (see meson.build).
    - name: Build and run checkasm
      run: |
        meson setup build -Davisynth=true
        ninja -C build
        meson test -C build -v

    - name: Run filter tests
      run: |
        python3 test/test_weave.py build/interlace.so
        python3 test/test_vt_filter.py build/interlace.so

  build-non-windows-wheel:
    strategy:
      matrix:
        include:
        - arch: linux_x86_64
          runs-on: ubuntu-latest
        - arch: linux_aarch64
          runs-on: ubuntu-24.04-arm
        - arch: macosx_x86_64
          runs-on: macos-26-intel
        - arch: macosx_arm64
          runs-on: macos-26
      fail-fast: false

    runs-on: ${{ matrix.runs-on }}

    steps:
    - uses: actions/checkout@v6

    - uses: pypa/cibuildwheel@v3.4.0
      env:
        CIBW_BUILD: cp314-*
        CIBW_BUILD_FRONTEND: uv
        CIBW_BEFORE_ALL_LINUX: yum install -y nasm || dnf install -y nasm || apk add --no-cache nasm || true
        CIBW_BEFORE_ALL_MACOS: brew untap aws/tap || true; brew install nasm
      with:
        output-dir: dist
        extras: uv

    - name: Fix tag
      run: |
        pipx run wheel tags --remove --python-tag py3 --abi-tag none dist/*.whl

    - uses: actions/upload-artifact@v7
      with:
        name: interlace-${{ matrix.arch }}
        path: dist

  build-windows-wheel:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - uses: actions/checkout@v6

    - uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-git
          mingw-w64-ucrt-x86_64-nasm
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-python-wheel
          mingw-w64-ucrt-x86_64-toolchain
          mingw-w64-ucrt-x86_64-uv

    # The AviSynth C API is __declspec(dllimport) on Windows, so the module
    # needs an import library to link. MSYS2 has no AviSynth package, so
    # synthesize one: every AVSC_API entry point in the vendored header
    # becomes a .def export, which dlltool turns into a library. Deriving
    # the list from the header keeps it from going stale.
    #
    # It must be a DELAY-import library (-y). A normal one puts AviSynth.dll
    # in the PE import table, which the Windows loader binds eagerly, so the
    # module would fail to load for VapourSynth users who have no AviSynth
    # installed. Delay-loading binds on the first avs_* call instead — which
    # only ever happens when AviSynth itself is the host.
    - name: Generate the AviSynth delay-import library
      run: |
        mkdir -p avisynth-implib
        { echo "LIBRARY AviSynth.dll"; echo "EXPORTS";
          grep -oE 'AVSC_API\([^,]+, *([a-z_0-9]+)\)' third_party/avisynth/avisynth_c.h |
            sed -E 's/.*, *([a-z_0-9]+)\)/    \1/' | sort -u
        } > avisynth-implib/avisynth.def
        dlltool -d avisynth-implib/avisynth.def -y avisynth-implib/libavisynth_delay.a
        wc -l < avisynth-implib/avisynth.def

    # The import library is named by full path rather than -L/-l, because
    # -static makes the linker reject one found that way, and it goes
    # through LDFLAGS (which meson folds into c_link_args at configure)
    # because a -Csetup-args value containing spaces is not reliably
    # re-split into separate meson arguments. cygpath converts it: ld.exe
    # is a native Windows binary and cannot read an MSYS path.
    - name: Build
      run: |
        implib=$(cygpath -m "$(pwd)/avisynth-implib/libavisynth_delay.a")
        LDFLAGS="-static $implib -ldelayimp" uv build

    - name: Fix tag and strip dll
      run: |
        cd dist
        wheel tags --remove --python-tag py3 --abi-tag none *.whl
        wheel unpack --dest unpacked *.whl
        rm *.whl
        strip $(find . -name '*.dll')
        wheel pack unpacked/*

    # AviSynth users get the very same binary the wheel ships -- one
    # module serves both hosts -- just lifted out as a drop-in file,
    # since AviSynth has no package manager.
    - name: Extract the standalone plugin DLL
      run: |
        mkdir -p dist-dll
        cp "$(find dist/unpacked -name 'interlace*.dll' | head -1)" dist-dll/interlace.dll
        ls -la dist-dll/

    # AviSynth.dll must not appear as a load-time import, or the module
    # fails to load for VapourSynth users without AviSynth installed.
    - name: Check that AviSynth.dll is not a load-time dependency
      run: |
        objdump -p dist-dll/interlace.dll |
          sed -n '/The Import Tables/,/^There is/p' > imports.txt
        cat imports.txt
        if grep -qi 'AviSynth.dll' imports.txt; then
          echo "ERROR: AviSynth.dll is a load-time import; delay-loading is broken"
          exit 1
        fi

    - uses: actions/upload-artifact@v7
      with:
        name: interlace-avisynth-win64
        path: dist-dll/interlace.dll

    - uses: actions/upload-artifact@v7
      with:
        name: interlace-sdist
        path: dist/*.tar.gz

    - uses: actions/upload-artifact@v7
      with:
        name: interlace-win_amd64
        path: dist/*.whl

  publish:
    permissions:
      id-token: write
    needs: [test, build-non-windows-wheel, build-windows-wheel]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest

    steps:
    # Wheels and the sdist only: twine check globs the whole directory and
    # errors on anything that is not a distribution, so the standalone
    # AviSynth DLL artifact must not land here.
    - uses: actions/download-artifact@v8
      with:
        path: dist
        pattern: interlace-!(avisynth-*)
        merge-multiple: true

    - uses: pypa/gh-action-pypi-publish@release/v1
