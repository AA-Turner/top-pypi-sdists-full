[build-system]
requires = ["meson-python", "VapourSynth>=66"]
build-backend = "mesonpy"

[project]
name = "vapoursynth-interlace"
description = "Progressive to interlaced converter for VapourSynth using the BBC WHP 315 optimal vertical-temporal prefilter"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
keywords = ["vapoursynth", "interlace", "interlacing", "broadcast"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Plugins",
  "Natural Language :: English",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Operating System :: Unix",
  "Programming Language :: C",
  "Programming Language :: Assembly",
  "Topic :: Multimedia :: Video",
]
dependencies = ["VapourSynth>=66"]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/ifb/vapoursynth-interlace"

[tool.meson-python.args]
setup = ["-Dcheckasm=disabled", "-Davisynth=true"]

[tool.meson-python.wheel]
exclude = ["*.dll.a"]
