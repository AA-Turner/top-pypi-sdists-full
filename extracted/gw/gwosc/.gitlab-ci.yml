workflow:
  rules:
    # run for merge requests
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # don't run on branches if there's an open merge request
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    # run on branches and tags
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

include:
  # -- Python -------------------------

  # https://computing.docs.ligo.org/guide/gitlab/components/python/all/
  - component: $CI_SERVER_FQDN/computing/gitlab/components/python/all@2
    inputs:
      merge_request_pipelines: true
      code_quality_analyzer: ruff
      install_extra: "test"
      python_versions:
        - "3.10"
        - "3.11"
        - "3.12"
        - "3.13"
      run_advanced_sast: true
      uv: true

  # -- Documentation ------------------

  # https://computing.docs.ligo.org/guide/gitlab/components/sphinx/build/
  - component: $CI_SERVER_FQDN/computing/gitlab/components/sphinx/build@~latest
    inputs:
      requirements: ".[docs]"

# -- customisations

ruff_check:
  stage: test
  allow_failure: true
  image: pipelinecomponents/ruff
  script:
    - ruff check .
