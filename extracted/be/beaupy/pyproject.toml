[project]
name = "beaupy"
version = "4.0.1"
description = "A library of elements for interactive TUIs in Python"
license = "MIT"
readme = "README.md"
keywords = [
    "cli",
    "interactive",
    "console",
    "terminal",
    "interface",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Development Status :: 5 - Production/Stable",
    "Topic :: Terminals",
    "Environment :: Console",
    "Intended Audience :: Developers",
]
requires-python = ">=3.8,<4.0.0"
dependencies = [
    "rich>=14.3.0",
    "python-yakh>=0.4.2,<0.5.0",
    "questo>=0.4.1,<0.5.0",
]

[[project.authors]]
name = "Peter Vyboch"
email = "pvyboch1@gmail.com"

[project.urls]
Repository = "https://github.com/petereon/beaupy"

[tool.uv]
conflicts = [[
    { group = "dev" },
    { group = "docs" },
]]

[tool.uv.build-backend]
module-root = ""

[tool.poe]
verbosity = -1

[tool.poe.tasks.add]
shell = "uv add"

[tool.poe.tasks.install]
shell = "uv sync"

[tool.poe.tasks.build]
shell = "uv build"

[tool.poe.tasks.clean]
shell = "rm -R ./dist .pytest_cache .mypy_cache &> /dev/null"

[tool.poe.tasks.format]
shell = "uv run ruff format ./beaupy"

[tool.poe.tasks.lint]
shell = "uv run ruff check ./beaupy"

[tool.poe.tasks.mypy]
shell = "uv run mypy ./beaupy/"

[tool.poe.tasks.check]
shell = 'echo "Running ruff format..." ; uv run poe format ; echo "Running ruff check..." ; uv run poe lint ; echo "Running mypy..." ; uv run poe mypy ; echo Done!'

[tool.poe.tasks."check:watch"]
shell = "uv run poe check ; uv run watchmedo shell-command --patterns='*.py;*.feature;*.toml' --recursive --drop --command='uv run poe check'"

[tool.poe.tasks.test]
shell = "uv run pytest --cov=beaupy --cov-report xml:coverage.xml --cov-report term"

[tool.poe.tasks."test:watch"]
shell = "uv run poe test; uv run watchmedo shell-command --patterns='*.py;*.feature;*.toml' --recursive --drop --command='uv run poe test'"

[tool.mypy]
files = ["beaupy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true
show_column_numbers = true
ignore_missing_imports = true

[tool.ruff]
line-length = 140
target-version = "py38"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "B",
    "C4",
    "C90",
    "SIM",
    "PIE",
    "S",
    "T20",
    "ERA",
    "PERF",
    "UP",
]

[tool.ruff.lint.mccabe]
max-complexity = 19

[[tool.pydoc-markdown.loaders]]
type = "python"
search_path = ["./beaupy"]

[tool.pydoc-markdown.renderer]
type = "markdown"
render_toc = true

[dependency-groups]
dev = [
    "poethepoet==0.31.1; python_version >= '3.10'",
    "pytest==9.1.1; python_version >= '3.10'",
    "pytest-cov==7.1.0; python_version >= '3.10'",
    "mypy==2.2.0; python_version >= '3.10'",
    "ruff==0.14.5; python_version >= '3.10'",
    "watchdog==6.0.0; python_version >= '3.10'",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.6",
    "novella==0.2.6",
    "pydoc-markdown==4.8.2",
    "setuptools>=75.8,<81; python_version >= '3.9'",
    "setuptools<81; python_version < '3.9'",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"
