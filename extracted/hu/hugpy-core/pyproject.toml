[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hugpy-core"
version = "0.5.0"
description = "Hugpy Core: the coordinator of the wrappers of many hosts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["abstract-flask>=0.0.0.1079", "flask>=3,<4", "hugpy-resources>=0.1.18.2,<0.2"]

[project.scripts]
hugpy-core = "hugpy_core.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# the built console (ui/, placed by scripts/console-into-package.sh of the bundle): served at the door
"hugpy_core.console" = ["README.md", "site/*", "site/assets/*"]
# what a grading query shows or plays to a model: three drawn images and a short clip (grading/queries.py)
"hugpy_core.grading" = ["media/*"]
