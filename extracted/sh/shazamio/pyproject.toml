[project]
name = "shazamio"
version = "0.9.0"
description = "An asynchronous framework for the reverse engineered Shazam API, written in Python with asyncio and aiohttp."
license = "MIT"
license-files = ["LICENSE.txt"]
keywords = [
    "python",
    "shazam",
    "music",
    "recognize",
    "api",
    "async",
    "asyncio",
    "aiohttp",
    "identification",
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "aiohttp>=3.8.0",
    "aiohttp-retry>=2.3",
    "pydantic>=2.2.0",
    "shazamio-core==2.0.0",
]

[[project.authors]]
name = "dotX12"

[project.urls]
Homepage = "https://github.com/shazamio/ShazamIO"
Repository = "https://github.com/shazamio/ShazamIO"
Issues = "https://github.com/shazamio/ShazamIO/issues"

[dependency-groups]
hooks = ["pre-commit>=3.2.0"]
tests = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.3",
    "pytest-recording>=0.14.0",
    "vcrpy>=8.3.0",
]
lint = ["ruff>=0.16.10"]

[[dependency-groups.dev]]
include-group = "tests"

[[dependency-groups.dev]]
include-group = "lint"

[[dependency-groups.dev]]
include-group = "hooks"

[tool.uv]
exclude-newer = "7 days"

[tool.uv.exclude-newer-package]
shazamio-core = false

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--block-network",
    "--allowed-hosts=127.0.0.1",
]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "ISC001",
    "D203",
    "D213",
    "CPY001",
    "D1",
    "D205",
    "D401",
    "ANN401",
    "N818",
    "TRY003",
]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "shazamio.schemas.base.BaseHrefNext",
]

[tool.ruff.lint.per-file-ignores]
"examples/*" = [
    "T20",
    "INP001",
    "E501",
]
"scripts/*" = [
    "T20",
    "INP001",
]
"tests/*" = [
    "S101",
    "PLR2004",
    "S311",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"
