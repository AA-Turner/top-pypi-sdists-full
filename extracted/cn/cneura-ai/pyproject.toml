[project.scripts]
cneura = "cneura_ai.cli:main"


[tool.setuptools]
packages = { find = { include = ["cneura_ai*"] } }
include-package-data = true

[tool.setuptools.package-data]
"cneura_ai.configs" = ["*.json"]
"cneura_ai" = ["*.Dockerfile"]

