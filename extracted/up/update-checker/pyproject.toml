[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.8.0,<1.0"]

[dependency-groups]
lint = [
    "pre-commit",
    "ruff",
]
test = [
    "aiohttp",
    "pytest",
    "pytest-asyncio",
]
typecheck = [
    "aiohttp",
    "pyright",
]

[[dependency-groups.dev]]
include-group = "lint"

[[dependency-groups.dev]]
include-group = "test"

[[dependency-groups.dev]]
include-group = "typecheck"

[project]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Typing :: Typed",
]
dependencies = []
description = "A python module that will check for package updates."
license = "BSD-2-Clause"
license-files = ["LICENSE.txt"]
name = "update_checker"
readme = "README.md"
requires-python = ">=3.9"
version = "1.0.1"

[[project.authors]]
name = "Bryce Boe"
email = "bbzbryce@gmail.com"

[project.optional-dependencies]
async = ["aiohttp"]

[project.urls]
Changelog = "https://github.com/bboe/update_checker/blob/main/CHANGELOG.md"
Homepage = "https://github.com/bboe/update_checker"
Issues = "https://github.com/bboe/update_checker/issues"
Source = "https://github.com/bboe/update_checker"

[tool.pyright]
include = ["src"]
pythonVersion = "3.9"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
preview = true

[tool.ruff.lint]
ignore = [
    "COM812",
    "CPY001",
    "D203",
    "D213",
]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "D103",
    "INP001",
    "PLC2701",
    "PLR2004",
    "S101",
    "S404",
    "S603",
]
