[project]
name = "geocif"
version = "0.4.963"

description = "Models to visualize and forecast crop conditions and yields"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Ritvik Sahajpal", email = "ritvik@umd.edu"}
]
keywords = ["geocif"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "boruta>=0.4.3",
    "catboost>=1.2.8",
    "fiona",
    # gdal binary now comes from conda-forge (pixi); loose pin so the conda
    # libgdal build satisfies the editable self-dep. Was pinned to the cgohlke
    # wheel 3.10.2 (win) / system libgdal 3.11.0 (HPC) — both obsolete under pixi.
    "gdal>=3.10",
    # NOTE: pyeogpr was removed as a dependency (2026-08-22). It was never
    # imported anywhere in geocif, AND it was deleted from PyPI (404), which
    # made every fresh resolve of geocif fail ("pyeogpr was not found in the
    # package registry") and silently backtrack installs to geocif 0.2.77.
    "pyproj",
    "rasterio",
    "rtree",
    "shap>=0.48.0",
    # Pin numba >=0.59 (first version to officially support Python
    # 3.12). Without this, uv's resolver can pick numba==0.53.1
    # through shap's unconstrained numba dep — and 0.53.1 only
    # supports Python <3.10, so the install fails with
    # "RuntimeError: Cannot install on Python version 3.12.x".
    "numba>=0.59",
    "shapiq>=1.0",            # TabPFN-native explainer + k-SII interactions + PDP
    "shapely",
    "optuna",
    "xarray>=2026.2.0",
    "pooch>=1.8.0",
    "arrow>=1.4.0",
    "icclim>=7.0.4",
    "geoprepare>=0.6.275",   # 0.6.275 wires cell_optimizer's mask into the daily-EO geom_extract path (NDVI etc.)
    "logzero>=1.7.0",
    "geopandas>=1.1.2",
    "tabpfn>=6.4.1",
    "tabicl>=2.0.2",
    "statsmodels>=0.14.6",
    "palettable>=3.3.3",
    "seaborn>=0.13.2",
    "scikit-misc>=0.5.2",
    "setuptools<81",
    "choix>=0.3.4",
    "scienceplots>=2.0.0",
    # Production-path imports previously relying on transitive resolution:
    "cartopy>=0.22",          # geocif/viz/plot.py (imported via yield_outlook)
    "Rbeast>=0.1.20",         # geocif/production_analysis/_common.py (BEAST pipeline)
    "scikit-learn>=1.4",      # geocif.py top-level + ml/cluster_analysis.py, ml/feature_selection.py
    "bottleneck>=1.3",        # geocif/agmet/plot.py
    # Core production imports (added after install-time audit of import graph):
    "mapclassify>=2.5",       # geocif/viz/plot.py
    "pymannkendall>=1.4",     # geocif/utils.py
    "pangres>=4.0",           # geocif/utils.py (DB upsert)
    "kneed>=0.8",             # geocif/ml/feature_engineering.py
    "lifelines>=0.27",        # geocif/ml/gomp.py (survival analysis)
    # Spatial production imports (production_analysis/beast_spatial.py):
    "esda>=2.5",              # spatial autocorrelation (Moran's I, etc.)
    "libpysal>=4.10",         # spatial weights / lattice
    # ML pipeline alternative model backends (geocif/ml/trainers.py):
    "crepes>=0.6",            # conformal prediction wrappers
    "cubist>=1.0",            # Cubist regression (1.0+ — 0.0.x is a separate pre-1.0 line)
    "mapie>=0.8",             # prediction intervals
    "merf>=1.0",              # mixed-effects random forests
    "ngboost>=0.5",           # probabilistic gradient boosting
    "PyGRF>=0.0.12",          # Geographical Random Forest (pure-Python sdist;
                              # deps pandas/sklearn/scipy/libpysal/esda all already core)
    "tabpfn-extensions>=0.4",  # TabPFN extras (0.4+ — stable line; 0.0.x was placeholder releases)
    # NOTE: ydf + treeple were removed — compiled backends with no aarch64 wheels
    # (ydf needs Bazel, unbuildable on ARM). Their model branches in
    # ml/trainers.py ('ydf', 'oblique', 'desreg') raise a clear error if selected.
    # ML feature selection (geocif/ml/feature_selection.py):
    "BorutaShap>=1.0",        # Boruta with SHAP-based importance
    "arfs>=2.0",              # All Relevant Feature Selection
    "feature-engine>=1.6",    # categorical / numerical transformers
    "mrmr-selection>=0.2",    # mRMR feature selection
    "sklearn-genetic-opt>=0.10",  # genetic hyperparameter / feature opt
    "stabl>=0.0.1",           # stability selection (only release on PyPI is 0.0.1; >=1.0 would fail to install)
    # Transitive deps of pygeoutil (which has broken setup.py and is git-installed by the installer):
    "cachetools>=5.0",        # pygeoutil/rgeo.py
    "geopy>=2.0",             # pygeoutil/rgeo.py
    "scikit-image>=0.21",     # pygeoutil/*
    # Defensive ceiling: matplotlib 3.11.0 removed several deprecated kwargs
    # (e.g. Axes.boxplot's `labels=`). 0.4.744 patched the known sites to
    # `tick_labels=`, but other 3.11 removals may still surface on HPC.
    # Drop this pin once we've fully audited the plot paths against 3.11.
    "matplotlib<3.11",
    # Defensive ceiling: pandas 3.0 hard-raises TypeError when a non-float
    # object is assigned into a float64 column (previously silently upcast to
    # object). The detrend / check_yield_trend path stores a statsmodels
    # RegressionResultsWrapper into a per-region column, which 3.0 rejects and
    # 2.x tolerated — under pandas 3.0.5 EVERY LOOCV model task failed
    # ("Invalid value '<...RegressionResultsWrapper>' for dtype 'float64'").
    # First hit on the gsapp18 pixi env 2026-07-31 when a re-solve pulled
    # pandas 3.0.5. Drop this pin once the object-into-float assignment sites
    # are refactored to hold the wrapper outside the numeric frame.
    "pandas<3",
    "openpyxl",               # pandas .xlsx engine - crop calendars, AMIS workbooks
]

[project.optional-dependencies]
dashboard = [
    "panel>=1.4.0",
    "hvplot>=0.10.0",
    "holoviews>=1.18",       # geocif/dashboard/tabs/*.py
]
aquacrop = [
    "aquacrop>=3.0",         # geocif/aquacrop/aquacrop_runner.py + others
]
aquacrop_calibration = [
    "aquacrop>=3.0",         # transitive base
    "pygmo>=2.19",           # PSO + CMA-ES backbone for crop-param tuning
    "SALib>=1.5",            # Sobol / eFAST / Morris sensitivity analysis
]
spatial = [
    "pysal>=2.6",            # full pysal meta-package (esda + libpysal already in core)
]
gee = [
    "earthengine-api>=1.0",  # geocif/playground/gee_access.py and wolayita_*.py
    "geemap>=0.30",
]
narrative = [
    "pymupdf>=1.23",         # imported as `fitz` in geocif/narrative.py
    "pdfplumber>=0.10",      # geocif/narrative.py
    "reportlab>=4.0",        # geocif/report.py
    "anthropic>=0.30",       # geocif/narrative.py (LLM-based report generation)
]
shap_fast = [
    # Used by ml/feature_selection.py only when [ML] feature_selection = "SHAP".
    # Cannot ship as a core dep because fasttreeshap pins slicer==0.0.7, which
    # conflicts with shap>=0.48.0 (pins slicer==0.0.8). Users who pick the
    # SHAP selector install this extras group explicitly:
    #     pip install geocif[shap_fast]
    # (This will downgrade shap to <0.48 in their env — accepted tradeoff
    # for that selector.)
    "fasttreeshap>=0.1",
]
powershap = [
    # Used by ml/feature_selection.py only when
    # [ML] feature_selection = "PowerShap". Cannot ship as a core dep
    # because powershap>=0.0.10 pins shap>=0.45,<0.46 AND
    # statsmodels>=0.13.2,<0.14.0 — both upper bounds conflict with
    # geocif's core requirements (shap>=0.48, statsmodels>=0.14.6).
    # Users who pick the PowerShap selector install this group explicitly:
    #     pip install geocif[powershap]
    # (This will downgrade shap to <0.46 AND statsmodels to <0.14 —
    # bigger env tradeoff than shap_fast, hence its own group.)
    "powershap>=0.0.10",
]
geospann = [
    # Used by ml/trainers.py only when [DEFAULT] models contains
    # "geospaNN". Cannot ship as a core dep because geospaNN>=0.1
    # transitively depends on torch-scatter>=2.1.2, which has a
    # broken build system (imports torch in setup.py without declaring
    # it as a build-system requirement, so PEP-517 isolated builds
    # fail with `ModuleNotFoundError: No module named 'torch'`).
    # Users who want the geospaNN model install this group explicitly:
    #     pip install torch                # install torch first
    #     pip install geocif[geospann] --no-build-isolation
    # (The --no-build-isolation lets torch-scatter find the just-
    # installed torch at build time.)
    "geospaNN>=0.1",
]
george = [
    # Used by ml/trainers.py only when [DEFAULT] models contains "george"
    # (GP regression via dfm/george). Optional because PyPI ships wheels for
    # linux x86_64 / win_amd64 / macOS arm64 only — NO linux-aarch64 wheel,
    # so a core dep would force an sdist C++ build on ARM hosts (the same
    # failure mode that got ydf/treeple removed). conda-forge has binaries
    # for all our platforms:
    #     pip install geocif[george]        # x86_64 / win
    #     pixi add george                    # conda-forge, any platform
    "george>=0.4.4",
]
desreg = [
    # Used by ml/trainers.py only when [DEFAULT] models contains
    # "desreg". Held in its own group because desReg is an obscure
    # package on PyPI (DESRegression / Distributional Ensemble
    # Synthetic Regression) with only one published version and
    # historically install quirks on some Python combos.
    #     pip install geocif[desreg]
    "desReg>=0.1",
]

[project.urls]
Homepage = "https://ritviksahajpal.github.io/yield_forecasting/"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["geocif", "geocif.*"]

[tool.setuptools]
include-package-data = true

# ---------------------------------------------------------------------------
# pixi (conda-forge) environment management — migrated off uv/PyPI.
#
# Replaces THREE uv hacks that only existed to fight geospatial-on-PyPI:
#   * [tool.uv.sources] cgohlke win_amd64 wheels  -> conda-forge native win-64
#   * gdal==3.11.0 "match HPC system libgdal"      -> conda-forge bundles libgdal
#   * [tool.uv] nvidia-* override (force CPU torch) -> conda `pytorch-cpu`
#
# [project.dependencies] above stays the source of truth for `pip install
# geocif`. The heavy compiled deps below come from conda-forge; the editable
# self-dep then pulls the remaining pure-Python / PyPI-only packages
# (tabpfn, tabicl, cubist, treeple, ydf, geoprepare, ...) from PyPI, reusing
# the conda binaries instead of rebuilding them.
#
#   pixi install                                    # default env
#   pixi run python -c "from osgeo import gdal; import geocif"
#   pixi run -e dev pytest ; pixi install -e full   # extras
#
# The 4 intentionally-conflicting extras (shap_fast, powershap, geospaNN,
# desreg) are NOT pixi features — they pin shap<0.46 / statsmodels<0.14 /
# broken torch-scatter and need an isolated env. Keep installing those via
# `pip install geocif[<extra>]` into a throwaway venv.
# ---------------------------------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge"]
# linux-aarch64 covers ARM hosts (e.g. AWS Graviton / terrahub jupyter nodes).
platforms = ["linux-64", "linux-aarch64", "win-64"]

[tool.pixi.dependencies]
python = "3.11.*"
# geospatial binaries (conda-forge libgdal/geos/proj)
gdal = ">=3.10"
rasterio = "*"
fiona = "*"
pyproj = "*"
shapely = "*"
rtree = "*"
cartopy = "*"
geopandas = "*"
pyhdf = "*"                # octvi MOD09CMG HDF4 reader (via geoprepare NDVI/GCVI)
# GMT + PyGMT so viz/plot.py's pygmt backend renders IN-PROCESS (no conda
# `pygmt_env` subprocess bridge). conda-forge gmt ships an ABI-consistent
# libgmt on all three lock platforms; pygmt is noarch.
gmt = ">=6.5"
pygmt = ">=0.14"
# compiled numerics / ML (avoid PyPI source builds; pins mirror [project])
numpy = "*"
pandas = "<3"             # mirror [project]: a conda-pinned pandas 3.x breaks the pypi solve
openpyxl = "*"
scipy = "*"
matplotlib = "<3.11"
numba = ">=0.59"
scikit-learn = ">=1.4"
scikit-image = "*"
scikit-misc = ">=0.5.2"    # Fortran/C ext — no aarch64 PyPI wheel, so take from conda
bottleneck = ">=1.3"
catboost = ">=1.2.8"
statsmodels = ">=0.14.6"
shap = ">=0.48.0"
xarray = ">=2026.2.0"
seaborn = "*"
pooch = "*"
esda = "*"
libpysal = "*"
pytorch-cpu = "*"          # CPU torch for tabpfn/tabicl/treeple; no CUDA wheels
setuptools = "<81"

[tool.pixi.pypi-dependencies]
geocif = { path = ".", editable = true }
# pygeoutil has a broken setup.py and is not on PyPI — install from git.
pygeoutil = { git = "https://github.com/ritviksahajpal/pygeoutil.git" }
# octvi (geoprepare NDVI/GCVI download) — local sibling checkout w/ GCVI Int32 fix.
octvi = { path = "../octvi", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
full = { features = ["dashboard", "gee", "narrative", "aquacrop", "spatial", "dev"], solve-group = "full" }

[tool.pixi.feature.dev.dependencies]
pytest = "*"
twine = "*"
black = "*"
isort = "*"

[tool.pixi.feature.dashboard.dependencies]
panel = ">=1.4.0"
hvplot = ">=0.10.0"
holoviews = ">=1.18"

[tool.pixi.feature.gee.dependencies]
earthengine-api = ">=1.0"
geemap = ">=0.30"

[tool.pixi.feature.spatial.dependencies]
pysal = ">=2.6"

[tool.pixi.feature.aquacrop.pypi-dependencies]
aquacrop = ">=3.0"

[tool.pixi.feature.narrative.dependencies]
reportlab = ">=4.0"
anthropic = ">=0.30"

[tool.pixi.feature.narrative.pypi-dependencies]
pymupdf = ">=1.23"        # no conda-forge aarch64 build; PyPI ships aarch64 wheels
pdfplumber = ">=0.10"
