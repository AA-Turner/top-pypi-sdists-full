[project]
name = "geocif"
version = "0.4.716"

description = "Models to visualize and forecast crop conditions and yields"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Ritvik Sahajpal", email = "ritvik@umd.edu"}
]
keywords = ["geocif"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "boruta>=0.4.3",
    "catboost>=1.2.8",
    "fiona",
    "gdal==3.10.2; sys_platform == 'win32'",   # Windows: matched by uv.sources wheel
    "gdal==3.11.0; sys_platform != 'win32'",  # HPC Linux: must match system libgdal 3.11.0
    "pyeogpr>=2.4.7",
    "pyproj",
    "rasterio",
    "rtree",
    "shap>=0.48.0",
    "shapiq>=1.0",            # TabPFN-native explainer + k-SII interactions + PDP
    "shapely",
    "optuna",
    "xarray>=2026.2.0",
    "pooch>=1.8.0",
    "arrow>=1.4.0",
    "icclim>=7.0.4",
    "geoprepare>=0.6.129",
    "logzero>=1.7.0",
    "geopandas>=1.1.2",
    "tabpfn>=6.4.1",
    "tabicl>=2.0.2",
    "statsmodels>=0.14.6",
    "palettable>=3.3.3",
    "seaborn>=0.13.2",
    "scikit-misc>=0.5.2",
    "setuptools<81",
    "choix>=0.3.4",
    "scienceplots>=2.0.0",
    # Production-path imports previously relying on transitive resolution:
    "cartopy>=0.22",          # geocif/viz/plot.py (imported via yield_outlook)
    "Rbeast>=0.1.20",         # geocif/production_analysis/_common.py (BEAST pipeline)
    "scikit-learn>=1.4",      # geocif.py top-level + ml/cluster_analysis.py, ml/feature_selection.py
    "bottleneck>=1.3",        # geocif/agmet/plot.py
    # Core production imports (added after install-time audit of import graph):
    "mapclassify>=2.5",       # geocif/viz/plot.py
    "pymannkendall>=1.4",     # geocif/utils.py
    "pangres>=4.0",           # geocif/utils.py (DB upsert)
    "kneed>=0.8",             # geocif/ml/feature_engineering.py
    "lifelines>=0.27",        # geocif/ml/gomp.py (survival analysis)
    # Spatial production imports (production_analysis/beast_spatial.py):
    "esda>=2.5",              # spatial autocorrelation (Moran's I, etc.)
    "libpysal>=4.10",         # spatial weights / lattice
    # ML pipeline alternative model backends (geocif/ml/trainers.py):
    "crepes>=0.6",            # conformal prediction wrappers
    "cubist>=1.0",            # Cubist regression (1.0+ — 0.0.x is a separate pre-1.0 line)
    "mapie>=0.8",             # prediction intervals
    "desReg>=0.1",            # Distributional Ensemble Synthetic Regression (geocif/ml/trainers.py)
    "geospaNN>=0.1",          # spatially-aware neural networks (geocif/ml/trainers.py)
    "merf>=1.0",              # mixed-effects random forests
    "ngboost>=0.5",           # probabilistic gradient boosting
    "tabpfn-extensions>=0.4",  # TabPFN extras (0.4+ — stable line; 0.0.x was placeholder releases)
    "treeple>=0.10",          # honest tree ensembles
    "ydf>=0.6",               # Yggdrasil Decision Forests
    # ML feature selection (geocif/ml/feature_selection.py):
    "BorutaShap>=1.0",        # Boruta with SHAP-based importance
    "arfs>=2.0",              # All Relevant Feature Selection
    "fasttreeshap>=0.1",      # fast SHAP for tree models
    "feature-engine>=1.6",    # categorical / numerical transformers
    "mrmr-selection>=0.2",    # mRMR feature selection
    "powershap>=0.0.10",      # SHAP-based feature selection
    "sklearn-genetic-opt>=0.10",  # genetic hyperparameter / feature opt
    "stabl>=0.0.1",           # stability selection (only release on PyPI is 0.0.1; >=1.0 would fail to install)
    # Transitive deps of pygeoutil (which has broken setup.py and is git-installed by the installer):
    "cachetools>=5.0",        # pygeoutil/rgeo.py
    "geopy>=2.0",             # pygeoutil/rgeo.py
    "scikit-image>=0.21",     # pygeoutil/*
]

[project.optional-dependencies]
dashboard = [
    "panel>=1.4.0",
    "hvplot>=0.10.0",
    "holoviews>=1.18",       # geocif/dashboard/tabs/*.py
]
aquacrop = [
    "aquacrop>=3.0",         # geocif/aquacrop/aquacrop_runner.py + others
]
aquacrop_calibration = [
    "aquacrop>=3.0",         # transitive base
    "pygmo>=2.19",           # PSO + CMA-ES backbone for crop-param tuning
    "SALib>=1.5",            # Sobol / eFAST / Morris sensitivity analysis
]
spatial = [
    "pysal>=2.6",            # full pysal meta-package (esda + libpysal already in core)
]
gee = [
    "earthengine-api>=1.0",  # geocif/playground/gee_access.py and wolayita_*.py
    "geemap>=0.30",
]
narrative = [
    "pymupdf>=1.23",         # imported as `fitz` in geocif/narrative.py
    "pdfplumber>=0.10",      # geocif/narrative.py
    "reportlab>=4.0",        # geocif/report.py
    "anthropic>=0.30",       # geocif/narrative.py (LLM-based report generation)
]

[project.urls]
Homepage = "https://ritviksahajpal.github.io/yield_forecasting/"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["geocif", "geocif.*"]

[tool.setuptools]
include-package-data = true

[tool.uv.sources]
gdal = { url = "https://github.com/cgohlke/geospatial-wheels/releases/download/v2025.3.30/gdal-3.10.2-cp311-cp311-win_amd64.whl", marker = "sys_platform == 'win32'" }
rasterio = { url = "https://github.com/cgohlke/geospatial-wheels/releases/download/v2025.3.30/rasterio-1.4.3-cp311-cp311-win_amd64.whl", marker = "sys_platform == 'win32'" }
shapely = { url = "https://github.com/cgohlke/geospatial-wheels/releases/download/v2025.3.30/shapely-2.0.7-cp311-cp311-win_amd64.whl", marker = "sys_platform == 'win32'" }
pyproj = { url = "https://github.com/cgohlke/geospatial-wheels/releases/download/v2025.3.30/pyproj-3.7.1-cp311-cp311-win_amd64.whl", marker = "sys_platform == 'win32'" }
rtree = { url = "https://github.com/cgohlke/geospatial-wheels/releases/download/v2025.3.30/rtree-1.4.0-cp311-cp311-win_amd64.whl", marker = "sys_platform == 'win32'" }
fiona = { url = "https://github.com/cgohlke/geospatial-wheels/releases/download/v2025.3.30/fiona-1.10.1-cp311-cp311-win_amd64.whl", marker = "sys_platform == 'win32'" }

[tool.uv]
override-dependencies = [
    "cuda-bindings; python_version < '0'",
    "cuda-pathfinder; python_version < '0'",
    "nvidia-cublas-cu12; python_version < '0'",
    "nvidia-cuda-cupti-cu12; python_version < '0'",
    "nvidia-cuda-nvrtc-cu12; python_version < '0'",
    "nvidia-cuda-runtime-cu12; python_version < '0'",
    "nvidia-cudnn-cu12; python_version < '0'",
    "nvidia-cufft-cu12; python_version < '0'",
    "nvidia-cufile-cu12; python_version < '0'",
    "nvidia-curand-cu12; python_version < '0'",
    "nvidia-cusolver-cu12; python_version < '0'",
    "nvidia-cusparse-cu12; python_version < '0'",
    "nvidia-cusparselt-cu12; python_version < '0'",
    "nvidia-nccl-cu12; python_version < '0'",
    "nvidia-nvjitlink-cu12; python_version < '0'",
    "nvidia-nvshmem-cu12; python_version < '0'",
    "nvidia-nvtx-cu12; python_version < '0'",
]
