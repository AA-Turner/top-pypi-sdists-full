[project]
name = "muffuletta"
version = "0.1.0"
description = "Geneva CLI - A beautiful CLI for managing Geneva clusters and jobs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "kubernetes>=31.0.0",
    "pydantic>=2.0.0",
    "python-dateutil>=2.9.0",
]

[project.scripts]
muffuletta = "muffuletta.cli:app"
mf = "muffuletta.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["muffuletta"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
