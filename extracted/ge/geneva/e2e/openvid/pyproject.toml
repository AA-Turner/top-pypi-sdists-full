# E2E Test Suite: OpenVid Pipeline
#
# This package contains e2e tests for the OpenVid video processing pipeline.
# It has different dependency requirements from the main geneva package.

[project]
name = "geneva-e2e-openvid"
version = "0.1.0"
description = "E2E tests for Geneva OpenVid pipeline"
requires-python = ">=3.10,<3.14"
dependencies = [
    "geneva",

    # Suite-specific deps
    "pillow>=12.1.1",

    # Cloud and data deps (optional extras of geneva, but needed directly
    # because workspace-member `uv sync` prunes root-level extras)
    "pandas",
    "google-cloud-storage",
    "boto3",
    "awscli",
    "azure-storage-blob",
    "azure-identity",

    # Test deps
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "pytest-timeout",
    "pytest-cov",
    "pytest-order",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
geneva = { workspace = true }

[[tool.uv.index]]
name = "fury"
url = "https://pypi.fury.io/lancedb/"

[[tool.uv.index]]
name = "lance-format"
url = "https://pypi.fury.io/lance-format/"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["test_drivers"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
