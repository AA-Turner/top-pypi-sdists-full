# Simple CPU-only UDFs for Oxford Pets dataset
# No ML dependencies - just Pillow for image processing

[project]
name = "geneva-udf-simple"
version = "0.1.0"
description = "Simple CPU-only UDFs for image processing"
requires-python = ">=3.10,<3.14"
dependencies = [
    "geneva",
    "pillow>=12.1.1",
    "tomli>=2.0; python_version<'3.11'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
geneva = { path = "../../../..", editable = true }

[[tool.uv.index]]
name = "fury"
url = "https://pypi.fury.io/lancedb/"

[[tool.uv.index]]
name = "lance-format"
url = "https://pypi.fury.io/lance-format/"
