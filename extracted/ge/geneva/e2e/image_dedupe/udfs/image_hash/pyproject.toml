# Image hash UDFs for image dedup pipeline
# Dependencies for pHash computation on Ray workers

[project]
name = "geneva-udf-image-hash"
version = "0.1.0"
description = "Image hash UDFs for dedup pipeline"
requires-python = ">=3.10,<3.14"
dependencies = [
    "geneva",
    "imagehash>=4.3",
    "pillow>=12.1.1",
    "tomli>=2.0; python_version<'3.11'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
geneva = { path = "../../../..", editable = true }

[[tool.uv.index]]
name = "fury"
url = "https://pypi.fury.io/lancedb/"

[[tool.uv.index]]
name = "lance-format"
url = "https://pypi.fury.io/lance-format/"
