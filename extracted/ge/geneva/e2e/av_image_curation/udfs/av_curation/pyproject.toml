# GPU UDFs for AV image curation: OWLv2 vehicle detection + SigLIP2 scene classification

[project]
name = "geneva-udf-av-curation"
version = "0.1.0"
description = "Vision UDFs for autonomous vehicle image curation"
requires-python = ">=3.10,<3.14"
dependencies = [
    "geneva",
    "pillow>=12.1.1",
    "torch>=2.0",
    "transformers>=4.49.0",
    "tomli>=2.0; python_version<'3.11'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
geneva = { path = "../../../..", editable = true }

[[tool.uv.index]]
name = "fury"
url = "https://pypi.fury.io/lancedb/"

[[tool.uv.index]]
name = "lance-format"
url = "https://pypi.fury.io/lance-format/"
