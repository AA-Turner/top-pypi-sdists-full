# UDF package for the Whisper transcription pipeline.

[project]
name = "geneva-udf-whisper-transcription"
version = "0.1.0"
description = "UDFs for Whisper transcription and Qwen embeddings"
requires-python = ">=3.10,<3.14"
dependencies = [
    "geneva",
    "tomli>=2.0; python_version<'3.11'",
    "numpy>=1.26,<2.0",
    "soundfile>=0.12.1",
    "scipy>=1.11.0",
    "torch>=2.6.0",
    "transformers>=4.51.0",
    "sentence-transformers>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
geneva = { path = "../../../..", editable = true }

[[tool.uv.index]]
name = "fury"
url = "https://pypi.fury.io/lancedb/"

[[tool.uv.index]]
name = "lance-format"
url = "https://pypi.fury.io/lance-format/"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = true
