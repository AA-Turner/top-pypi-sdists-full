name: Memray Stateful UDF Memory Profile

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/stress_tests/_memray_probe.py"
      - "src/stress_tests/test_memray_stateful_udf.py"
      - "src/geneva/apply/**"
      - "src/geneva/transformer.py"
      - "src/geneva/runners/ray/**"
      - ".github/workflows/memray-stateful-udf-profile.yml"
      - "pyproject.toml"
      - "uv.lock"

jobs:
  memray-stateful-udf-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_CACHE_DIR: /tmp/.uv-cache
      RAY_ENABLE_UV_RUN_RUNTIME_ENV: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        run: uv sync --locked
      - name: Run memray stateful UDF profile test
        run: uv run -m pytest src/stress_tests/test_memray_stateful_udf.py -v -s
      - name: Upload memray artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memray-stateful-udf-profile-${{ github.run_number }}
          path: /tmp/test-results/memray-stateful-udf/
          retention-days: 90
          if-no-files-found: warn
