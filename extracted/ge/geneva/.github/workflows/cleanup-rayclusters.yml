name: Daily RayCluster Cleanup

on:
  schedule:
    - cron: "0 9 * * *"  # daily at 09:00 UTC
  workflow_dispatch:
    inputs:
      raycluster_name:
        description: "Optional RayCluster name to delete"
        required: false
        type: string

permissions:
  contents: read

env:
  NAMESPACE: lancedb
  RAYCLUSTER_NAME: ${{ github.event.inputs.raycluster_name }}

jobs:
  gke-cleanup:
    runs-on: warp-ubuntu-latest-x64-8x
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'
      - uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: ${{ secrets.GCP_GENEVA_CLIENT_SA_KEY }}
      # Configure kubectl with a non-expiring static token for the
      # geneva-service-account in the lancedb GKE cluster.
      - name: Configure kubectl with static token
        run: |
          CLUSTER_ENDPOINT=$(gcloud container clusters describe lancedb \
            --region=us-central1 \
            --project=lancedb-dev-enterprise-1 \
            --format='value(endpoint)')
          echo "${{ secrets.GKE_CA_CERT }}" | base64 --decode > /tmp/gke-ca.crt
          kubectl config set-cluster lancedb \
            --server=https://${CLUSTER_ENDPOINT} \
            --certificate-authority=/tmp/gke-ca.crt \
            --embed-certs=true
          kubectl config set-credentials gha-sa \
            --token=${{ secrets.GKE_STATIC_TOKEN }}
          kubectl config set-context default \
            --cluster=lancedb \
            --user=gha-sa \
            --namespace=lancedb
          kubectl config use-context default
          rm /tmp/gke-ca.crt
      - name: Install kubectl & jq
        run: |
          sudo apt-get update
          sudo apt-get install -y kubectl jq
      - name: Delete rayclusters named {name}-{date}-{slug} older than 1d (GKE)
        run: |
          if [ -n "${RAYCLUSTER_NAME}" ]; then
            echo "Deleting raycluster ${RAYCLUSTER_NAME} in ${NAMESPACE}"
            kubectl delete raycluster -n "${NAMESPACE}" "${RAYCLUSTER_NAME}" --ignore-not-found --timeout=300s --wait
            exit 0
          fi
          CUTOFF=$(date -u -d "24 hours ago" '+%Y-%m-%dT%H:%M:%SZ')
          echo "Looking for rayclusters in ${NAMESPACE} matching {name}-YYYY-MM-DD-HH-mm-{5digit} and created before $CUTOFF"
          MATCHES=$(kubectl get raycluster -n "${NAMESPACE}" -o json | jq -r --arg cutoff "$CUTOFF" '.items[] | select(.metadata.name | test("^[a-z0-9-]+-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{5}$")) | select(.metadata.creationTimestamp < $cutoff) | .metadata.name')
          if [ -z "$MATCHES" ]; then
            echo "No matching rayclusters found"
          else
            echo "Deleting:" && echo "$MATCHES"
            echo "$MATCHES" | xargs -r -n1 kubectl delete raycluster -n "${NAMESPACE}" --timeout=300s --wait
          fi

  aws-cleanup:
    runs-on: warp-ubuntu-latest-x64-8x
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::054483968661:role/github_actions_role
      - name: Install kubectl & jq
        run: |
          sudo apt-get update
          sudo apt-get install -y kubectl jq
      # Configure kubectl with a non-expiring static token for the
      # geneva-service-account in the lancedb EKS cluster.
      - name: Configure kubectl with static token
        run: |
          CLUSTER_ENDPOINT=$(aws eks describe-cluster \
            --name lancedb \
            --region us-east-1 \
            --query 'cluster.endpoint' \
            --output text)
          echo "${{ secrets.EKS_CA_CERT }}" | base64 --decode > /tmp/eks-ca.crt
          kubectl config set-cluster lancedb \
            --server=${CLUSTER_ENDPOINT} \
            --certificate-authority=/tmp/eks-ca.crt \
            --embed-certs=true
          kubectl config set-credentials gha-sa \
            --token=${{ secrets.EKS_STATIC_TOKEN }}
          kubectl config set-context default \
            --cluster=lancedb \
            --user=gha-sa \
            --namespace=lancedb
          kubectl config use-context default
          rm /tmp/eks-ca.crt
      - name: Delete rayclusters named {name}-{date}-{slug} older than 1d (AWS)
        run: |
          if [ -n "${RAYCLUSTER_NAME}" ]; then
            echo "Deleting raycluster ${RAYCLUSTER_NAME} in ${NAMESPACE}"
            kubectl delete raycluster -n "${NAMESPACE}" "${RAYCLUSTER_NAME}" --ignore-not-found --timeout=300s --wait
            exit 0
          fi
          CUTOFF=$(date -u -d "24 hours ago" '+%Y-%m-%dT%H:%M:%SZ')
          echo "Looking for rayclusters in ${NAMESPACE} matching {name}-YYYY-MM-DD-HH-mm-{5digit} and created before $CUTOFF"
          MATCHES=$(kubectl get raycluster -n "${NAMESPACE}" -o json | jq -r --arg cutoff "$CUTOFF" '.items[] | select(.metadata.name | test("^[a-z0-9-]+-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{5}$")) | select(.metadata.creationTimestamp < $cutoff) | .metadata.name')
          if [ -z "$MATCHES" ]; then
            echo "No matching rayclusters found"
          else
            echo "Deleting:" && echo "$MATCHES"
            echo "$MATCHES" | xargs -r -n1 kubectl delete raycluster -n "${NAMESPACE}" --timeout=300s --wait
          fi

  azure-cleanup:
    runs-on: warp-ubuntu-latest-x64-8x
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: 8671ea50-af15-49cd-a234-0077c1e20c43
          tenant-id: 4d0b3e97-e90c-4c8f-9b18-1146dd5f22f6
          subscription-id: 2251a256-3e12-4197-b94f-e847b55dd69e
      - name: Install kubectl & jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      - name: Configure kubectl with static token
        run: |
          CLUSTER_ENDPOINT=$(az aks show \
            --resource-group lancedb-dev-lancedb-eastus-rg \
            --name lancedb \
            --query 'fqdn' \
            --output tsv)
          echo "${{ secrets.AKS_CA_CERT }}" | base64 --decode > /tmp/aks-ca.crt
          kubectl config set-cluster lancedb \
            --server=https://${CLUSTER_ENDPOINT} \
            --certificate-authority=/tmp/aks-ca.crt \
            --embed-certs=true
          kubectl config set-credentials gha-sa \
            --token=${{ secrets.AKS_STATIC_TOKEN }}
          kubectl config set-context default \
            --cluster=lancedb \
            --user=gha-sa \
            --namespace=lancedb
          kubectl config use-context default
          rm /tmp/aks-ca.crt
      - name: Delete rayclusters named {name}-{date}-{slug} older than 1d (Azure)
        run: |
          if [ -n "${RAYCLUSTER_NAME}" ]; then
            echo "Deleting raycluster ${RAYCLUSTER_NAME} in ${NAMESPACE}"
            kubectl delete raycluster -n "${NAMESPACE}" "${RAYCLUSTER_NAME}" --ignore-not-found --timeout=300s --wait
            exit 0
          fi
          CUTOFF=$(date -u -d "24 hours ago" '+%Y-%m-%dT%H:%M:%SZ')
          echo "Looking for rayclusters in ${NAMESPACE} matching {name}-YYYY-MM-DD-HH-mm-{5digit} and created before $CUTOFF"
          MATCHES=$(kubectl get raycluster -n "${NAMESPACE}" -o json | jq -r --arg cutoff "$CUTOFF" '.items[] | select(.metadata.name | test("^[a-z0-9-]+-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{5}$")) | select(.metadata.creationTimestamp < $cutoff) | .metadata.name')
          if [ -z "$MATCHES" ]; then
            echo "No matching rayclusters found"
          else
            echo "Deleting:" && echo "$MATCHES"
            echo "$MATCHES" | xargs -r -n1 kubectl delete raycluster -n "${NAMESPACE}" --timeout=300s --wait
          fi
