name: Fault-injection nightly (differential durability sweep)
on:
  schedule:
    - cron: "30 7 * * *" # 07:30 UTC daily
  workflow_dispatch:

jobs:
  fault-sweep:
    permissions:
      contents: read
    runs-on: warp-ubuntu-latest-x64-32x
    timeout-minutes: 240
    env:
      UV_CACHE_DIR: /tmp/.uv-cache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        run: make pydeps
      - name: Differential fault sweep (L=3)
        run: make test-fault-sweep
        env:
          GENEVA_FAULTSWEEP_MAXLEN: "3"
          SWEEP_WORKERS: "24"
          GENEVA_FAULTSWEEP_VERDICTS_OUT: "/tmp/faultsweep-verdicts-srid-on.json"
      # srid-off leg: non-stable-row-id sources over the _rowaddr write paths
      # (backfill/sparse/repair/backfill-skip auto-selected). Verdict parity with
      # the srid-on leg is MEASURED, not assumed: this leg loads the srid-on
      # leg's per-case verdicts and fails on any drift among passing verdicts
      # (srid-off going NOFIRE where srid-on HEALs = silently lost coverage).
      # The (4 flavors x L=2) matrix here is a subset of the srid-on
      # (all flavors x L=3) matrix above, so every case has a baseline verdict.
      #
      # Runs even when the srid-on leg exits non-zero: that leg is red by design
      # until the write-completeness fixes land (see the Makefile
      # test-fault-sweep comment), and the default first-failure job abort would
      # skip this leg on every nightly until then. The srid-on leg still fails
      # the job -- it is not marked continue-on-error -- and it writes its
      # verdicts file before exiting, so the parity baseline is available here.
      - name: Differential fault sweep, srid-off leg (L=2, verdict parity)
        if: ${{ !cancelled() }}
        run: make test-fault-sweep
        env:
          GENEVA_FAULTSWEEP_SRID: "off"
          GENEVA_FAULTSWEEP_MAXLEN: "2"
          SWEEP_WORKERS: "24"
          GENEVA_FAULTSWEEP_COMPARE: "/tmp/faultsweep-verdicts-srid-on.json"
