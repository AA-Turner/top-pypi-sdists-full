name: E2E Tests - Whisper Transcription

on:
  # Manual trigger - can be run on any branch
  workflow_dispatch:
    inputs:
      csp:
        description: 'Cloud provider'
        required: false
        type: choice
        options:
          - gcp
          - aws
          - azure
        default: 'gcp'
      row_limit:
        description: "Number of dataset rows to process"
        required: false
        default: "256"
      num_clips:
        description: "Number of clips (30s chunks) to process per audio file"
        required: false
        default: "5"
      checkpoint_size:
        description: "Checkpoint size for backfill operations"
        required: false
        default: "10"
      skip_gpu:
        description: "Skip GPU tests"
        required: false
        type: boolean
        default: false
      run_table_creation:
        description: "Run table creation tests"
        required: false
        type: boolean
        default: true
      run_pipeline:
        description: "Run whisper transcription pipeline tests"
        required: false
        type: boolean
        default: true
  # Weekly schedule: Monday 3am Pacific = Tuesday 11am UTC (runs on main only)
  schedule:
    - cron: "0 11 * * 2"

jobs:
  e2e-test-whisper-transcription:
    name: e2e-test-whisper-transcription-${{ (github.event_name == 'workflow_dispatch' && (inputs.csp || 'gcp')) || 'azure' }}
    # Scheduled runs are always on main, manual runs can be on any branch
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.ref == 'refs/heads/main')
    uses: ./.github/workflows/e2e-shared.yml
    with:
      # Scheduled runs target Azure for GPU availability (always-on GPU nodes).
      # Manual dispatch defaults to GCP but can be overridden.  See GEN-439.
      csp: ${{ github.event_name == 'schedule' && 'azure' || inputs.csp || 'gcp' }}
      e2e_dir: e2e/whisper_transcription
      checkout_ref: ${{ github.event_name == 'schedule' && 'main' || github.ref }}
      prepare_command: |
        test -f e2e/whisper_transcription/upload_manifests.py
        TEST_FILES=""
        ${{ inputs.run_table_creation == true || github.event_name == 'schedule' }} && TEST_FILES="$TEST_FILES test_drivers/test_table_creation.py"
        ${{ inputs.run_pipeline == true || github.event_name == 'schedule' }} && TEST_FILES="$TEST_FILES test_drivers/test_whisper_transcription_pipeline.py"
        echo "TEST_FILES=$TEST_FILES" >> $GITHUB_ENV
        echo "Selected tests: $TEST_FILES"
      run_command: |
        make -f e2e/Makefile test-e2e-whisper-transcription-${{ github.event_name == 'schedule' && 'azure' || inputs.csp || 'gcp' }} SLUG=$SLUG ROW_LIMIT=${{ inputs.row_limit || '256' }} NUM_CLIPS=${{ inputs.num_clips || '5' }} CHECKPOINT_SIZE=${{ inputs.checkpoint_size || '10' }} SKIP_GPU=${{ inputs.skip_gpu && '1' || '' }} TEST_FILES="${TEST_FILES}"
      cleanup_command: |
        echo "Deleting rayclusters matching slug $SLUG"
        kubectl get raycluster -n lancedb --no-headers -o custom-columns=":metadata.name" | grep $SLUG | xargs -r -n1 kubectl delete raycluster -n lancedb --wait
    secrets: inherit
