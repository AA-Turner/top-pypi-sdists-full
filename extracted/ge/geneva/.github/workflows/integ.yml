name: Python Integration Tests
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    paths:
      - src/**
      - .github/workflows/integ.yml
      - uv.lock
      - pyproject.toml

env:
  # Keep Phalanx aligned with the lance-namespace wire contract used by Geneva.
  PHALANX_IMAGE: 948856271544.dkr.ecr.us-east-1.amazonaws.com/lancedb:phalanx_release-2026-07-02.a8a6480a12.x64
  LANCE_AGENT_IMAGE: 948856271544.dkr.ecr.us-east-1.amazonaws.com/lancedb:lance_agent_release-2026-06-26.03d8aca0cf.x64
  GENEVA_DRIVER_IMAGE: 948856271544.dkr.ecr.us-east-1.amazonaws.com/lancedb:geneva_driver_release-2026-06-19.340acc6932.arm64

jobs:
  integ-test-gcp:
    permissions:
      contents: read
    runs-on: warp-ubuntu-latest-x64-8x
    strategy:
      # prevent GHA from cancelling jobs to avoid orphaned k8s resources
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            test-type: integration
            timeout: 120
          # Pipeline tests run as their own job so they execute in parallel
          # with the rest of the integration suite instead of extending the
          # integration job's wall-clock budget.
          - python-version: "3.12"
            test-type: pipeline
            timeout: 90
          - python-version: "3.12"
            test-type: direct-connect
            timeout: 60
    timeout-minutes: ${{ matrix.timeout }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      UV_CACHE_DIR: /tmp/.uv-cache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'
      - uses: 'google-github-actions/auth@v2'
        with:
          # use credentials for automatically deployed geneva service
          # geneva-client-sa@lancedb-dev-enterprise-1.iam.gserviceaccount.com
          credentials_json: ${{ secrets.GCP_GENEVA_CLIENT_SA_KEY }}
      # Configure kubectl with a non-expiring static token for the
      # geneva-service-account in the lancedb GKE cluster. This avoids
      # credential expiry issues during long-running integration tests.
      # The cluster endpoint is fetched via gcloud; the token and CA cert
      # are stored as GHA secrets from the geneva-service-account-ci-token
      # K8s Secret.
      - name: Configure kubectl with static token
        run: |
          CLUSTER_ENDPOINT=$(gcloud container clusters describe lancedb \
            --region=us-central1 \
            --project=lancedb-dev-enterprise-1 \
            --format='value(endpoint)')
          echo "${{ secrets.GKE_CA_CERT }}" | base64 --decode > /tmp/gke-ca.crt
          kubectl config set-cluster lancedb \
            --server=https://${CLUSTER_ENDPOINT} \
            --certificate-authority=/tmp/gke-ca.crt \
            --embed-certs=true
          kubectl config set-credentials gha-sa \
            --token=${{ secrets.GKE_STATIC_TOKEN }}
          kubectl config set-context default \
            --cluster=lancedb \
            --user=gha-sa \
            --namespace=lancedb
          kubectl config use-context default
          rm /tmp/gke-ca.crt
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y kubectl
          uv sync --extra k8s --extra gcp --extra embedding --locked
      - name: Generate test slug
        run: |
          # SLUG is per-leg: it lands in RayCluster names (conftest.py) and the
          # cleanup step greps by it, so legs of one run must not share a slug.
          # 6 hex chars keep the longest integration RayCluster name at 52,
          # below KubeRay 1.4's 53-character limit, with 24 bits of entropy.
          SLUG=$(python3 -c "import uuid; print(uuid.uuid4().hex[:6])")
          echo "SLUG=$SLUG" >> $GITHUB_ENV
          # CI_PREFIX is per-run: carries the run id so bucket data is traceable
          # to the run that made it, under one `ci/` prefix and never the root.
          echo "CI_PREFIX=ci/${{ github.run_id }}-${{ github.run_attempt }}-$SLUG" >> $GITHUB_ENV
      - name: Set bucket path
        run: |
          # Keep system tables isolated per run. Reusing a global path causes
          # the Geneva job history table to accumulate thousands of versions,
          # making job-status updates slow enough to trip test timeouts.
          echo "BUCKET_PATH=gs://lancedb-lancedb-dev-us-central1/$CI_PREFIX/data" >> $GITHUB_ENV
      - name: Auth check
        run: |
          kubectl config current-context
          kubectl auth whoami
          kubectl auth can-i get pods -n lancedb
      - name: Run tests
        if: matrix.test-type != 'pipeline'
        run: |
          if [ "${{ matrix.test-type }}" = "integration" ]; then
            # Run all tests except test_pipeline.py; those run in the parallel
            # pipeline job. GPU-marked tests are excluded from GCP (and AWS) to
            # avoid GPU node spin-up contention; they run on Azure instead.
            # See GEN-439 for the cross-cloud GPU routing strategy.
            uv run -m pytest src/integ_tests --ignore=src/integ_tests/direct_connect --ignore=src/integ_tests/test_pipeline.py -m "not phalanx and not gpu" --csp=gcp --test-slug=$SLUG $(if [ -n "$BUCKET_PATH" ]; then echo "--bucket-path=$BUCKET_PATH"; fi) --cov=src/geneva --cov-append -v -s --cov-report=term-missing --durations=0
          else
            make test-${{ matrix.test-type }}-gcp SLUG=$SLUG BUCKET_PATH="$BUCKET_PATH"
          fi
      - name: Run pipeline tests
        if: matrix.test-type == 'pipeline'
        run: |
          uv run -m pytest src/integ_tests/test_pipeline.py -m "not phalanx" --csp=gcp --test-slug=$SLUG $(if [ -n "$BUCKET_PATH" ]; then echo "--bucket-path=$BUCKET_PATH"; fi) --cov=src/geneva --cov-append -v -s --cov-report=term-missing --durations=0
      - name: Cleanup Ray Clusters
        if: always()
        run: |
          # Unset SLUG makes this `grep ""` -- it would match every cluster in
          # the shared namespace, including other runs' live ones.
          if [ -z "${SLUG:-}" ]; then
            echo "SLUG unset -- refusing to delete (would match every cluster)"
            exit 0
          fi
          echo "Deleting rayclusters matching slug $SLUG"
          kubectl get raycluster -n lancedb --no-headers -o custom-columns=":metadata.name" | grep "$SLUG" | xargs -r -n1 kubectl delete raycluster -n lancedb --wait
      - name: Cleanup bucket data
        # always(), not success(): data a failed run keeps is what a later run
        # inherits (GEN-833). The env guard is the other half of the fix.
        if: always() && env.CI_PREFIX != ''
        run: |
          # Unset CI_PREFIX would make the path below the bucket root -- always()
          # reaches here even when "Generate test slug" never ran.
          if [ -z "${CI_PREFIX:-}" ]; then
            echo "CI_PREFIX unset -- refusing to delete (would target the bucket root)"
            exit 0
          fi
          echo "Cleaning up bucket data for $CI_PREFIX"
          gcloud storage rm -r "gs://lancedb-lancedb-dev-us-central1/$CI_PREFIX" || echo "Bucket cleanup failed or path doesn't exist"
      - name: Generate coverage report
        run: |
          make coverage-report
      - name: Minimize uv cache
        run: uv cache prune --ci
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@main
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          flags: ${{ matrix.test-type }}-gcp-${{ matrix.python-version }}

  integ-test-aws:
    permissions:
      contents: read
      id-token: write
    runs-on: warp-ubuntu-latest-x64-8x
    strategy:
      # prevent GHA from cancelling jobs to avoid orphaned k8s resources
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            test-type: integration
            timeout: 120
          # Pipeline tests run as their own job, in parallel with integration.
          # Dispatched via `make test-pipeline-aws`; the enterprise-services
          # step below runs for this job too (kafka/lance_agent are needed).
          - python-version: "3.12"
            test-type: pipeline
            timeout: 90
          - python-version: "3.12"
            test-type: direct-connect
            timeout: 60
          - python-version: "3.12"
            test-type: phalanx
            timeout: 60
    timeout-minutes: ${{ matrix.timeout }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      UV_CACHE_DIR: /tmp/.uv-cache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          # devland aws account
          role-to-assume: arn:aws:iam::054483968661:role/github_actions_role
          role-duration-seconds: 7200
      # Configure kubectl with a non-expiring static token for the
      # geneva-service-account in the lancedb EKS cluster. This avoids
      # credential expiry issues during long-running integration tests.
      # aws eks update-kubeconfig uses an exec plugin that issues tokens
      # valid for only 15 minutes, causing kubectl failures mid-test.
      - name: Configure kubectl with static token
        run: |
          CLUSTER_ENDPOINT=$(aws eks describe-cluster \
            --name lancedb \
            --region us-east-1 \
            --query 'cluster.endpoint' \
            --output text)
          echo "${{ secrets.EKS_CA_CERT }}" | base64 --decode > /tmp/eks-ca.crt
          kubectl config set-cluster lancedb \
            --server=${CLUSTER_ENDPOINT} \
            --certificate-authority=/tmp/eks-ca.crt \
            --embed-certs=true
          kubectl config set-credentials gha-sa \
            --token=${{ secrets.EKS_STATIC_TOKEN }}
          kubectl config set-context default \
            --cluster=lancedb \
            --user=gha-sa \
            --namespace=lancedb
          kubectl config use-context default
          rm /tmp/eks-ca.crt
      - name: Check k8s auth
        run: |
          kubectl auth whoami
          kubectl get pods -n lancedb
      # don't install large deps like torch for this test
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y kubectl
          uv sync --extra k8s --extra aws --extra embedding --locked -v
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 948856271544.dkr.ecr.us-east-1.amazonaws.com
      - name: Generate test slug
        run: |
          # SLUG is per-leg: it lands in RayCluster names (conftest.py) and the
          # cleanup step greps by it, so legs of one run must not share a slug.
          # 6 hex chars keep the longest integration RayCluster name at 52,
          # below KubeRay 1.4's 53-character limit, with 24 bits of entropy.
          SLUG=$(python3 -c "import uuid; print(uuid.uuid4().hex[:6])")
          echo "SLUG=$SLUG" >> $GITHUB_ENV
          # CI_PREFIX is per-run: carries the run id so bucket data is traceable
          # to the run that made it, under one `ci/` prefix and never the root.
          echo "CI_PREFIX=ci/${{ github.run_id }}-${{ github.run_attempt }}-$SLUG" >> $GITHUB_ENV
      - name: Set bucket path
        run: |
          # Keep system tables isolated per run. Reusing a global path causes
          # the Geneva job history table to accumulate thousands of versions,
          # making job-status updates slow enough to trip test timeouts.
          echo "BUCKET_PATH=s3://geneva-integ-test-devland-us-east-1/$CI_PREFIX/data" >> $GITHUB_ENV
      - name: Start enterprise services (kafka, phalanx, lance_agent)
        working-directory: .
        run: |
          envsubst < .github/workflows/phalanx-integ.toml > /tmp/phalanx-integ-expanded.toml
          PHALANX_CONFIG_PATH=/tmp/phalanx-integ-expanded.toml \
            docker compose -f .github/compose/docker-compose-integ.yml up -d --wait --wait-timeout 120
      - name: Run tests
        if: matrix.test-type != 'phalanx'
        run: |
          make test-${{ matrix.test-type }}-aws SLUG=$SLUG BUCKET_PATH="$BUCKET_PATH"
      - name: Run enterprise v2 api tests
        if: matrix.test-type == 'phalanx'
        env:
         GENEVA_HOST_OVERRIDE: http://localhost:10024
         GENEVA_API_KEY: sk_localtest
         AWS_ACCESS_KEY_ID: "invalid-access-key" # these tests should pass without AWS creds
        run: |
         make test-phalanx SLUG=$SLUG BUCKET_PATH="$BUCKET_PATH"
      - name: Capture service logs
        run: |
          ARTIFACT_DIR=/tmp/enterprise-services-logs
          mkdir -p "$ARTIFACT_DIR"

          docker compose -f .github/compose/docker-compose-integ.yml ps -a > "$ARTIFACT_DIR/compose-ps.txt" 2>&1 || true
          docker compose -f .github/compose/docker-compose-integ.yml config > "$ARTIFACT_DIR/compose-config.yml" 2>&1 || true
          docker ps -a --no-trunc > "$ARTIFACT_DIR/docker-ps.txt" 2>&1 || true

          docker compose -f .github/compose/docker-compose-integ.yml logs --timestamps > "$ARTIFACT_DIR/all-services.log" 2>&1 || true

          for service in kafka phalanx lance_agent; do
            docker compose -f .github/compose/docker-compose-integ.yml logs --timestamps "$service" > "$ARTIFACT_DIR/${service}.log" 2>&1 || true

            container_id=$(docker compose -f .github/compose/docker-compose-integ.yml ps -q "$service")
            if [ -n "$container_id" ]; then
              docker inspect "$container_id" > "$ARTIFACT_DIR/${service}.inspect.json" 2>&1 || true
            fi
          done
      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: phalanx-enterprise-logs
          path: /tmp/enterprise-services-logs
          retention-days: 7
      - name: Stop enterprise services
        run: |
          docker compose -f .github/compose/docker-compose-integ.yml down || true
      - name: Refresh AWS Credentials for Cleanup
        if: always()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::054483968661:role/github_actions_role
          role-duration-seconds: 7200
      - name: Cleanup Ray Clusters
        if: always()
        run: |
          # Unset SLUG makes this `grep ""` -- it would match every cluster in
          # the shared namespace, including other runs' live ones.
          if [ -z "${SLUG:-}" ]; then
            echo "SLUG unset -- refusing to delete (would match every cluster)"
            exit 0
          fi
          echo "Deleting rayclusters matching slug $SLUG"
          kubectl get raycluster -n lancedb --no-headers -o custom-columns=":metadata.name" | grep "$SLUG" | xargs -r -n1 kubectl delete raycluster -n lancedb --timeout=300s
      - name: Cleanup bucket data
        # always(), not success(): data a failed run keeps is what a later run
        # inherits (GEN-833). The env guard is the other half of the fix.
        if: always() && env.CI_PREFIX != ''
        run: |
          # Unset CI_PREFIX would make the path below the bucket root -- always()
          # reaches here even when "Generate test slug" never ran.
          if [ -z "${CI_PREFIX:-}" ]; then
            echo "CI_PREFIX unset -- refusing to delete (would target the bucket root)"
            exit 0
          fi
          echo "Cleaning up bucket data for $CI_PREFIX"
          aws s3 rm "s3://geneva-integ-test-devland-us-east-1/$CI_PREFIX" --recursive || echo "Bucket cleanup failed or path doesn't exist"
      - name: Generate coverage report
        run: |
          make coverage-report
      - name: Minimize uv cache
        run: uv cache prune --ci
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@main
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          flags: ${{ matrix.test-type }}-aws-${{ matrix.python-version }}

  integ-test-azure:
    permissions:
      contents: read
      id-token: write
    runs-on: warp-ubuntu-latest-x64-8x
    strategy:
      # prevent GHA from cancelling jobs to avoid orphaned k8s resources
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            test-type: integration
            timeout: 120
          # Pipeline tests run as their own job so they execute in parallel
          # with the rest of the integration suite instead of extending the
          # integration job's wall-clock budget.
          - python-version: "3.12"
            test-type: pipeline
            timeout: 90
          - python-version: "3.12"
            test-type: direct-connect
            timeout: 60
    timeout-minutes: ${{ matrix.timeout }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      UV_CACHE_DIR: /tmp/.uv-cache
      # Azure storage account name for the azure-dev-eastus stack
      # Required for az:// URIs - Lance/object_store needs to know which storage account
      # Set both variants as different libraries expect different env var names
      AZURE_STORAGE_ACCOUNT: lancedbdevlancedb
      AZURE_STORAGE_ACCOUNT_NAME: lancedbdevlancedb
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y kubectl
          uv sync --extra k8s --extra azure --extra embedding --locked
      - name: Azure Login
        uses: azure/login@v2
        with:
          # github-actions-geneva-integ app and azure-dev-eastus stack
          # https://app.terraform.io/app/lancedb/workspaces/lancedb-azure-dev-eastus-lancedb/variables
          client-id: 8671ea50-af15-49cd-a234-0077c1e20c43
          tenant-id: 4d0b3e97-e90c-4c8f-9b18-1146dd5f22f6
          subscription-id: 2251a256-3e12-4197-b94f-e847b55dd69e
      - name: Configure kubectl with static token
        run: |
          CLUSTER_ENDPOINT=$(az aks show \
            --resource-group lancedb-dev-lancedb-eastus-rg \
            --name lancedb \
            --query 'fqdn' \
            --output tsv)
          echo "${{ secrets.AKS_CA_CERT }}" | base64 --decode > /tmp/aks-ca.crt
          kubectl config set-cluster lancedb \
            --server=https://${CLUSTER_ENDPOINT} \
            --certificate-authority=/tmp/aks-ca.crt \
            --embed-certs=true
          kubectl config set-credentials gha-sa \
            --token=${{ secrets.AKS_STATIC_TOKEN }}
          kubectl config set-context default \
            --cluster=lancedb \
            --user=gha-sa \
            --namespace=lancedb
          kubectl config use-context default
          rm /tmp/aks-ca.crt
      - name: Check k8s auth
        run: |
          kubectl auth whoami
          kubectl get pods -n lancedb
      - name: Generate test slug
        run: |
          # SLUG is per-leg: it lands in RayCluster names (conftest.py) and the
          # cleanup step greps by it, so legs of one run must not share a slug.
          # 6 hex chars keep the longest integration RayCluster name at 52,
          # below KubeRay 1.4's 53-character limit, with 24 bits of entropy.
          SLUG=$(python3 -c "import uuid; print(uuid.uuid4().hex[:6])")
          echo "SLUG=$SLUG" >> $GITHUB_ENV
          # CI_PREFIX is per-run: carries the run id so bucket data is traceable
          # to the run that made it, under one `ci/` prefix and never the root.
          echo "CI_PREFIX=ci/${{ github.run_id }}-${{ github.run_attempt }}-$SLUG" >> $GITHUB_ENV
      - name: Set bucket path
        run: |
          # Azure URI: az://container/path (account via AZURE_STORAGE_ACCOUNT env var)
          # Keep system tables isolated per run. Reusing a global path causes
          # the Geneva job history table to accumulate thousands of versions,
          # making job-status updates slow enough to trip test timeouts.
          echo "BUCKET_PATH=az://lancedbdatasets/$CI_PREFIX/data" >> $GITHUB_ENV
      - name: Configure Azure workload identity
        uses: ./.github/actions/setup-azure-storage-workload-identity
        with:
          storage-account-name: lancedbdevlancedb
          client-id: 8671ea50-af15-49cd-a234-0077c1e20c43
          tenant-id: 4d0b3e97-e90c-4c8f-9b18-1146dd5f22f6
      - name: Run tests
        if: matrix.test-type != 'pipeline'
        run: |
          set -euo pipefail

          "$AZURE_OIDC_REFRESH_SCRIPT"
          (
            while sleep "$AZURE_OIDC_REFRESH_INTERVAL_SECONDS"; do
              "$AZURE_OIDC_REFRESH_SCRIPT"
            done
          ) &
          azure_oidc_refresher=$!
          trap 'kill "$azure_oidc_refresher" 2>/dev/null || true' EXIT

          if [ "${{ matrix.test-type }}" = "integration" ]; then
            # Run all tests except test_pipeline.py first.
            # Azure is the GPU target — GPU-marked tests run here (not
            # excluded), since Azure has always-on GPU nodes without the
            # spin-up contention that plagues GCP.  See GEN-439.
            AZURE_STORAGE_ACCOUNT_NAME=lancedbdevlancedb uv run -m pytest src/integ_tests --ignore=src/integ_tests/direct_connect --ignore=src/integ_tests/test_pipeline.py --ignore=src/integ_tests/test_namespace.py -m "not phalanx" --csp=azure --test-slug=$SLUG $(if [ -n "$BUCKET_PATH" ]; then echo "--bucket-path=$BUCKET_PATH"; fi) --cov=src/geneva --cov-append -v -s --cov-report=term-missing --durations=0
          else
            make test-${{ matrix.test-type }}-azure SLUG=$SLUG BUCKET_PATH="$BUCKET_PATH"
          fi
      - name: Run pipeline tests
        if: matrix.test-type == 'pipeline'
        run: |
          set -euo pipefail

          "$AZURE_OIDC_REFRESH_SCRIPT"
          (
            while sleep "$AZURE_OIDC_REFRESH_INTERVAL_SECONDS"; do
              "$AZURE_OIDC_REFRESH_SCRIPT"
            done
          ) &
          azure_oidc_refresher=$!
          trap 'kill "$azure_oidc_refresher" 2>/dev/null || true' EXIT

          AZURE_STORAGE_ACCOUNT_NAME=lancedbdevlancedb uv run -m pytest src/integ_tests/test_pipeline.py -m "not phalanx" --csp=azure --test-slug=$SLUG $(if [ -n "$BUCKET_PATH" ]; then echo "--bucket-path=$BUCKET_PATH"; fi) --cov=src/geneva --cov-append -v -s --cov-report=term-missing --durations=0
      # Rebuild Azure CLI auth immediately before cleanup because the earlier
      # CLI session can expire during long integration runs, and cleanup uses
      # `az storage ... --auth-mode login`.
      - name: Clear Azure CLI cache before cleanup
        if: always()
        run: |
          az account clear || true
          rm -rf ~/.azure/msal_token_cache.* ~/.azure/service_principal_entries.* 2>/dev/null || true
      - name: Re-authenticate with Azure before cleanup
        if: always()
        uses: azure/login@v2
        with:
          client-id: 8671ea50-af15-49cd-a234-0077c1e20c43
          tenant-id: 4d0b3e97-e90c-4c8f-9b18-1146dd5f22f6
          subscription-id: 2251a256-3e12-4197-b94f-e847b55dd69e
      - name: Cleanup Ray Clusters
        if: always()
        run: |
          # Unset SLUG makes this `grep ""` -- it would match every cluster in
          # the shared namespace, including other runs' live ones.
          if [ -z "${SLUG:-}" ]; then
            echo "SLUG unset -- refusing to delete (would match every cluster)"
            exit 0
          fi
          echo "Deleting rayclusters matching slug $SLUG"
          kubectl get raycluster -n lancedb --no-headers -o custom-columns=":metadata.name" | grep "$SLUG" | xargs -r -n1 kubectl delete raycluster -n lancedb --wait
      - name: Cleanup bucket data
        # always(), not success(): data a failed run keeps is what a later run
        # inherits (GEN-833). The env guard is the other half of the fix.
        if: always() && env.CI_PREFIX != ''
        run: |
          # Unset CI_PREFIX would make the path below the bucket root -- always()
          # reaches here even when "Generate test slug" never ran.
          if [ -z "${CI_PREFIX:-}" ]; then
            echo "CI_PREFIX unset -- refusing to delete (would target the bucket root)"
            exit 0
          fi
          echo "Cleaning up bucket data for $CI_PREFIX"
          az storage blob delete-batch --account-name "$AZURE_STORAGE_ACCOUNT" --source lancedbdatasets --pattern "$CI_PREFIX/*" --auth-mode login || echo "Bucket cleanup failed or path doesn't exist"
      - name: Generate coverage report
        run: |
          make coverage-report
      - name: Minimize uv cache
        run: uv cache prune --ci
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@main
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          flags: ${{ matrix.test-type }}-azure-${{ matrix.python-version }}

  # GEN-645 regression guard: prove geneva needs only the Azure blob endpoint by
  # running the checkpoint sidecar test against the real dev account with the
  # dfs/HNS endpoint blackholed via /etc/hosts. Runs directly on the runner (not
  # a container) so object_store + PyArrow authenticate through the same
  # workload identity token file as the other Azure job — a bare container has
  # no token file and hangs on the managed-identity (IMDS) probe.
  # The failure only reproduces when dfs is unreachable, so the normal
  # integ-test-azure job (reachable dfs) can't catch it.
  # EXPERIMENT: also verifies that sudo can edit /etc/hosts on this runner.
  integ-test-azure-fns:
    permissions:
      contents: read
      id-token: write
    runs-on: warp-ubuntu-latest-x64-8x
    timeout-minutes: 30
    env:
      AZURE_STORAGE_ACCOUNT: lancedbdevlancedb
      AZURE_STORAGE_ACCOUNT_NAME: lancedbdevlancedb
      # Already unique per run/attempt. This job writes at the bucket root
      # because it takes no --bucket-path, so it stays outside the ci/ prefix
      # the other jobs use.
      SLUG: fns-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        run: uv sync --extra k8s --extra azure --locked
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: 8671ea50-af15-49cd-a234-0077c1e20c43
          tenant-id: 4d0b3e97-e90c-4c8f-9b18-1146dd5f22f6
          subscription-id: 2251a256-3e12-4197-b94f-e847b55dd69e
      - name: Configure Azure workload identity
        uses: ./.github/actions/setup-azure-storage-workload-identity
        with:
          storage-account-name: lancedbdevlancedb
          client-id: 8671ea50-af15-49cd-a234-0077c1e20c43
          tenant-id: 4d0b3e97-e90c-4c8f-9b18-1146dd5f22f6
      - name: Blackhole the dfs endpoint via /etc/hosts
        run: |
          echo "=== /etc/hosts before ==="; tail -3 /etc/hosts || true
          echo "127.0.0.1 ${AZURE_STORAGE_ACCOUNT_NAME}.dfs.core.windows.net" | sudo tee -a /etc/hosts
          echo "=== /etc/hosts after ==="; tail -3 /etc/hosts
          echo "=== resolves to ==="
          getent hosts "${AZURE_STORAGE_ACCOUNT_NAME}.dfs.core.windows.net" || echo "(no resolution)"
      - name: Run dfs-blocked (FNS) checkpoint test
        env:
          GENEVA_AZURE_ASSERT_DFS_BLOCKED: "1"
        run: |
          set -euo pipefail

          "$AZURE_OIDC_REFRESH_SCRIPT"
          (
            while sleep "$AZURE_OIDC_REFRESH_INTERVAL_SECONDS"; do
              "$AZURE_OIDC_REFRESH_SCRIPT"
            done
          ) &
          azure_oidc_refresher=$!
          trap 'kill "$azure_oidc_refresher" 2>/dev/null || true' EXIT

          RAY_ENABLE_UV_RUN_RUNTIME_ENV=0 uv run -m pytest \
            src/integ_tests/test_checkpoint_store_azure_hns.py --csp=azure \
            --test-slug=$SLUG -v -s --durations=0
      - name: Cleanup bucket data
        if: always()
        run: |
          # Job-level env, so always populated -- guarded anyway so this cannot
          # regress into a container-wide delete if it is ever moved.
          if [ -z "${SLUG:-}" ]; then
            echo "SLUG unset -- refusing to delete"
            exit 0
          fi
          # in-test delete no-ops while dfs is blocked (purge needs GEN-658);
          # clean up via the blob endpoint, which is not blocked.
          az storage blob delete-batch --account-name "$AZURE_STORAGE_ACCOUNT" \
            --source lancedbdatasets --pattern "$SLUG/*" --auth-mode login \
            || echo "cleanup skipped"
