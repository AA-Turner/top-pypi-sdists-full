# Local Prometheus scrape config. It scrapes the NATIVE otelcol-contrib's
# Prometheus exporter (:9464 on the host) -- which re-exposes everything geneva
# pushes over OTLP. Prometheus UI: http://localhost:9090
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      # The collector runs on the host (not in Docker); reach it via the gateway.
      - targets: ['host.docker.internal:9464']
