[project]
name = "csrd-delegate"
version = "0.5.28"
description = "HTTP delegate base class with retry support"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "yarl>=1.20,<2",
    "tenacity>=9.1,<10",
    "fastapi>=0.115,<1",
    "csrd-context",
    "csrd-models",
]
readme = "README.md"

[tool.uv.sources]
csrd-context = { workspace = true }
csrd-models = { workspace = true }

[project.urls]
Repository = "https://github.com/csrd-api/fastapi-common"
Documentation = "https://github.com/csrd-api/fastapi-common/tree/main/packages/delegate"
Changelog = "https://github.com/csrd-api/fastapi-common/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/csrd"]
