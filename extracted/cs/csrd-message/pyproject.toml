[project]
name = "csrd-message"
version = "0.5.28"
description = "Messaging abstractions for publisher/consumer workflows with optional RabbitMQ and Kafka extras"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = []
readme = "README.md"

[project.optional-dependencies]
rabbit = ["aio-pika>=9,<10"]
kafka = ["aiokafka>=0.11,<1"]
all = ["aio-pika>=9,<10", "aiokafka>=0.11,<1"]

[project.urls]
Repository = "https://github.com/csrd-api/fastapi-common"
Documentation = "https://github.com/csrd-api/fastapi-common/tree/main/packages/message"
Changelog = "https://github.com/csrd-api/fastapi-common/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/csrd"]
