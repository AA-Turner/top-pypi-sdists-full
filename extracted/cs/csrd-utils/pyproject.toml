[project]
name = "csrd-utils"
version = "0.5.28"
description = "CLI utilities for csrd service generation and feature augmentation"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "cookiecutter>=2.6,<3",
    "PyYAML>=6,<7",
    "pydantic>=2.6,<3",
    "ruamel.yaml>=0.18,<1",
]
readme = "README.md"

[project.scripts]
csrd = "csrd_utils.__main__:main"
csrd-utils = "csrd_utils.__main__:main"

[project.urls]
Repository = "https://github.com/csrd-api/fastapi-common"
Documentation = "https://github.com/csrd-api/fastapi-common/tree/main/packages/utils"
Changelog = "https://github.com/csrd-api/fastapi-common/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/csrd_utils", "src/tui_wizard"]

[tool.hatch.build.targets.sdist]
include = [
    "src/csrd_utils/**",
    "src/tui_wizard/**",
    "README.md",
    "pyproject.toml",
]
