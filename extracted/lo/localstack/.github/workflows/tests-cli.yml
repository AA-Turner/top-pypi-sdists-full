name: CLI Tests

on:
  workflow_dispatch:
    inputs:
      PYTEST_LOGLEVEL:
        type: choice
        description: Loglevel for PyTest
        options:
          - DEBUG
          - INFO
          - WARNING
        default: WARNING
      publish_to_pypi:
        type: boolean
        description: Publish to PyPI after tests pass
        default: false
  pull_request:
    paths:
      - '**'
      - '!README.md'
      - '!.gitignore'
  push:
    branches:
      - main
      - release/*
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  PYTEST_LOGLEVEL: "${{ inputs.PYTEST_LOGLEVEL || 'WARNING' }}"

permissions:
  contents: read

jobs:
  cli-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_PULL_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PULL_TOKEN }}

      - name: Pull Docker images
        run: |
          docker pull localstack/localstack-pro || true
          docker pull localstack/localstack

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[test]"

      - name: Run CLI smoke tests
        run: |
          # Sanity check CLI invocation
          exit_code=0; DEBUG=0 localstack || exit_code=$?; [ "$exit_code" -eq "2" ]
          exit_code=0; DEBUG=1 localstack || exit_code=$?; [ "$exit_code" -eq "2" ]
          # Check Pro CLI plugin is loaded
          DEBUG=1 localstack 2>&1 | grep "Advanced:" || echo "Pro commands not available (expected without auth)"

      - name: Run CLI tests
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.TEST_LOCALSTACK_AUTH_TOKEN }}
        run: |
          python -m pytest tests/cli/ \
            --log-cli-level=${{ env.PYTEST_LOGLEVEL }} \
            -v -s

      - name: Run unit tests
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.TEST_LOCALSTACK_AUTH_TOKEN }}
        run: |
          python -m pytest tests/unit/ \
            --log-cli-level=${{ env.PYTEST_LOGLEVEL }} \
            -v -s

  publish:
    if: >-
      (github.event.inputs.publish_to_pypi == 'true' && github.ref == 'refs/heads/main') ||
      startsWith(github.ref, 'refs/tags/v')
    needs: cli-tests
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
