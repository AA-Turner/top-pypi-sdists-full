[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[project]
name = "apify_shared"
version = "2.3.0"
description = "DEPRECATED - Tools and constants shared across Apify projects."
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 7 - Inactive",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
keywords = [
    "apify",
    "automation",
    "chrome",
    "crawlee",
    "crawler",
    "headless",
    "scraper",
    "scraping",
]
dependencies = []

[[project.authors]]
name = "Apify Technologies s.r.o."
email = "support@apify.com"

[project.urls]
"Apify Homepage" = "https://apify.com"
Changelog = "https://github.com/apify/apify-shared-python/blob/master/CHANGELOG.md"
Discord = "https://discord.com/invite/jyEM2PRvMU"
"Issue Tracker" = "https://github.com/apify/apify-shared-python/issues"
"Source Code" = "https://github.com/apify/apify-shared-python"

[dependency-groups]
dev = [
    "poethepoet<1.0.0",
    "pre-commit<5.0.0",
    "pytest-asyncio<2.0.0",
    "pytest-cov<8.0.0",
    "pytest-timeout<3.0.0",
    "pytest-xdist<4.0.0",
    "pytest<10.0.0",
    "ruff~=0.16.0",
    "setuptools",
    "ty~=0.0.0",
]

[tool.ruff]
line-length = 120
include = [
    "**/*.py",
    "**/*.md",
    "**/*.mdx",
]

[tool.ruff.extension]
mdx = "markdown"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
    "D100",
    "D104",
    "D107",
    "D203",
    "D213",
    "D413",
    "EM",
    "ISC001",
    "S105",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"**/{tests}/*" = [
    "D",
    "INP001",
    "S101",
]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "-r a --verbose"
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
timeout = 1800

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = [
    "src",
    "tests",
    "scripts",
    "docs",
    "website",
]

[tool.uv]
exclude-newer = "24 hours"

[tool.uv.build-backend]
source-include = [
    "CHANGELOG.md",
    "CONTRIBUTING.md",
]

[tool.uv.exclude-newer-package]
apify-client = false
apify_fingerprint_datapoints = false
crawlee = false

[tool.poe.tasks]
clean = "rm -rf .coverage .pytest_cache .ruff_cache .ty_cache build dist htmlcov"
install-sync = "uv sync --all-extras"
install-dev = "uv sync --all-extras"
build = "uv build"
publish-to-pypi = "uv publish --token ${APIFY_PYPI_TOKEN_CRAWLEE}"
type-check = "uv run ty check"
unit-tests = "uv run pytest --numprocesses=${TESTS_CONCURRENCY:-auto} --cov=src/apify_shared tests/unit"
unit-tests-cov = "uv run pytest --numprocesses=${TESTS_CONCURRENCY:-auto} --cov=src/apify_shared --cov-report=html tests/unit"
check-code = [
    "lint",
    "type-check",
    "unit-tests",
]

[tool.poe.tasks.lint]
shell = "uv run ruff format --check && uv run ruff check"

[tool.poe.tasks.format]
shell = "uv run ruff check --fix && uv run ruff format"
