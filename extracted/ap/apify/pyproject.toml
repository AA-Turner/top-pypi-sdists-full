[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[project]
name = "apify"
version = "4.2.0"
description = "Apify SDK for Python"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
keywords = [
    "apify",
    "sdk",
    "automation",
    "chrome",
    "crawlee",
    "crawler",
    "headless",
    "scraper",
    "scraping",
]
dependencies = [
    "apify-client[brotli]>=3.3.0,<4.0.0",
    "crawlee>=1.9.1,<2.0.0,!=1.10.1",
    "cachetools>=5.5.0",
    "cryptography>=42.0.0",
    "impit>=0.8.0",
    "lazy-object-proxy>=1.11.0",
    "more_itertools>=10.2.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.12.0",
    "typing-extensions>=4.4.0",
    "websockets>=14.0",
    "yarl>=1.18.0",
]

[[project.authors]]
name = "Apify Technologies s.r.o."
email = "support@apify.com"

[project.optional-dependencies]
scrapy = ["scrapy>=2.14.0"]

[project.urls]
"Apify Homepage" = "https://apify.com"
Changelog = "https://docs.apify.com/sdk/python/docs/changelog"
Discord = "https://discord.com/invite/jyEM2PRvMU"
Documentation = "https://docs.apify.com/sdk/python/docs/overview"
Homepage = "https://docs.apify.com/sdk/python/"
"Issue Tracker" = "https://github.com/apify/apify-sdk-python/issues"
"Release Notes" = "https://docs.apify.com/sdk/python/docs/upgrading/upgrading-to-v4"
"Source Code" = "https://github.com/apify/apify-sdk-python"

[dependency-groups]
dev = [
    "black>=24.3.0",
    "build<2.0.0",
    "crawlee[parsel]",
    "griffe",
    "poethepoet<1.0.0",
    "pre-commit<5.0.0",
    "pydoc-markdown<5.0.0",
    "pytest-asyncio<2.0.0",
    "pytest-cov<8.0.0",
    "pytest-httpserver<2.0.0",
    "pytest-timeout<3.0.0",
    "pytest-xdist<4.0.0",
    "pytest<10.0.0",
    "ruff~=0.17.0",
    "setuptools",
    "ty~=0.0.0",
    "types-cachetools<7.0.1",
    "uvicorn[standard]",
    "werkzeug<4.0.0",
]

[tool.ruff]
line-length = 120
include = [
    "**/*.py",
    "**/*.md",
    "**/*.mdx",
]
exclude = ["website/versioned_docs/**"]

[tool.ruff.extension]
mdx = "markdown"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",
    "ASYNC109",
    "BLE001",
    "C901",
    "COM812",
    "CPY001",
    "D100",
    "D104",
    "D107",
    "D203",
    "D213",
    "D413",
    "EM",
    "G004",
    "ISC001",
    "FIX",
    "PLR0911",
    "PLR0913",
    "PLR0915",
    "PTH",
    "PYI034",
    "PYI036",
    "S102",
    "S105",
    "S106",
    "S301",
    "S303",
    "S311",
    "TD002",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"**/{tests}/*" = [
    "D",
    "INP001",
    "PLC0415",
    "PLR2004",
    "S101",
    "SLF001",
    "T20",
    "TID252",
    "TRY301",
]
"**/{docs,website}/**" = [
    "D",
    "INP001",
    "F841",
    "TRY301",
    "PLR2004",
    "PLW0603",
]
"**/docs/**/scrapy_project/**" = [
    "I001",
    "RUF012",
    "TID252",
]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "crawlee.configuration.Configuration",
]

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["id"]

[tool.ruff.lint.isort]
known-local-folder = ["apify"]
known-first-party = [
    "apify_client",
    "crawlee",
]

[tool.ruff.lint.pylint]
max-branches = 18

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "-r a --verbose --dist worksteal"
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
timeout = 1800

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = [
    "src",
    "tests",
    "scripts",
    "docs",
    "website",
]
exclude = ["website/versioned_docs"]

[tool.ty.rules]
unused-ignore-comment = "error"

[[tool.ty.overrides]]
include = [
    "docs/**/*.py",
    "website/**/*.py",
]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

[[tool.ty.overrides]]
include = [
    "docs/**/scrapy_project/src/spiders/*.py",
    "tests/e2e/test_scrapy/actor_source/spider_*.py",
]

[tool.ty.overrides.rules]
invalid-mutable-override = "ignore"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "assert_never()",
]

[tool.ipdb]
context = 7

[tool.uv]
exclude-newer = "24 hours"

[tool.uv.build-backend]
source-include = [
    "CHANGELOG.md",
    "CONTRIBUTING.md",
]

[tool.uv.exclude-newer-package]
apify-client = false
apify_fingerprint_datapoints = false
crawlee = false

[tool.poe.tasks.clean]
cmd = "rm -rf .coverage .pytest_cache .ruff_cache .ty_cache build dist htmlcov"
help = "Remove build artifacts and clean caches"

[tool.poe.tasks.install-sync]
cmd = "uv sync --all-extras"
help = "Sync dependencies with all extras"

[tool.poe.tasks.build]
cmd = "uv build"
help = "Build the package"

[tool.poe.tasks.publish-to-pypi]
cmd = "uv publish --token ${APIFY_PYPI_TOKEN_CRAWLEE}"
help = "Publish the package to PyPI"

[tool.poe.tasks.type-check]
cmd = "uv run ty check"
help = "Run the type checker"

[tool.poe.tasks.unit-tests]
cmd = "uv run pytest --numprocesses=${TESTS_CONCURRENCY:-auto} tests/unit"
help = "Run unit tests"

[tool.poe.tasks.unit-tests-cov]
cmd = "uv run pytest --numprocesses=${TESTS_CONCURRENCY:-auto} --cov=src/apify --cov-report=xml:coverage-unit.xml tests/unit"
help = "Run unit tests with an XML coverage report"

[tool.poe.tasks.integration-tests]
cmd = "uv run pytest --numprocesses=${TESTS_CONCURRENCY:-auto} tests/integration"
help = "Run integration tests"

[tool.poe.tasks.integration-tests-cov]
cmd = "uv run pytest --numprocesses=${TESTS_CONCURRENCY:-auto} --cov=src/apify --cov-report=xml:coverage-integration.xml tests/integration"
help = "Run integration tests with an XML coverage report"

[tool.poe.tasks.e2e-tests]
cmd = "uv run pytest --numprocesses=${TESTS_CONCURRENCY:-auto} tests/e2e"
help = "Run E2E tests"

[tool.poe.tasks.e2e-tests-cov]
cmd = "uv run pytest --numprocesses=${TESTS_CONCURRENCY:-auto} --cov=src/apify --cov-report=xml:coverage-e2e.xml tests/e2e"
help = "Run E2E tests with an XML coverage report"

[tool.poe.tasks.check-code]
sequence = [
    "lint",
    "type-check",
    "unit-tests",
]
help = "Run lint, type check, and unit tests"

[tool.poe.tasks.install-dev]
shell = "uv sync --all-extras && uv run pre-commit install"
help = "Install development dependencies and pre-commit hooks"

[tool.poe.tasks.lint]
shell = "uv run ruff format --check && uv run ruff check"
help = "Run the linter and check formatting"

[tool.poe.tasks.format]
shell = "uv run ruff check --fix && uv run ruff format"
help = "Fix lint issues and format code"

[tool.poe.tasks.update-docs-theme]
shell = "pnpm update @apify/docs-theme"
cwd = "website"
help = "Update the documentation website theme"

[tool.poe.tasks.build-docs]
shell = "./build_api_reference.sh && pnpm install && uv run pnpm build"
cwd = "website"
help = "Build the documentation website"

[tool.poe.tasks.run-docs]
shell = "./build_api_reference.sh && pnpm install && uv run pnpm start"
cwd = "website"
help = "Run the documentation website locally"
