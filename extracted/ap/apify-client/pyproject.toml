[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[project]
name = "apify_client"
version = "3.1.1"
description = "Apify API client for Python"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
keywords = [
    "apify",
    "api",
    "client",
    "automation",
    "crawling",
    "scraping",
]
dependencies = [
    "colorama>=0.4.0",
    "impit~=0.13.0",
    "more_itertools>=10.0.0",
    "pydantic[email]>=2.11.0",
]

[[project.authors]]
name = "Apify Technologies s.r.o."
email = "support@apify.com"

[project.optional-dependencies]
brotli = ["brotli>=1.0.9"]

[project.urls]
"Apify Homepage" = "https://apify.com"
Homepage = "https://docs.apify.com/api/client/python/"
Changelog = "https://docs.apify.com/api/client/python/docs/changelog"
Discord = "https://discord.com/invite/jyEM2PRvMU"
Documentation = "https://docs.apify.com/api/client/python/docs/overview/introduction"
"Issue Tracker" = "https://github.com/apify/apify-client-python/issues"
"Source Code" = "https://github.com/apify/apify-client-python"

[dependency-groups]
dev = [
    "black>=24.3.0",
    "datamodel-code-generator[http,ruff]>=0.64.1,<1.0.0",
    "griffe<3.0.0",
    "poethepoet<1.0.0",
    "pre-commit<5.0.0",
    "pydoc-markdown<5.0.0",
    "pytest-asyncio<2.0.0",
    "pytest-cov<8.0.0",
    "pytest-httpserver<2.0.0",
    "pytest-timeout<3.0.0",
    "pytest-xdist<4.0.0",
    "pytest<10.0.0",
    "ruff~=0.16.0",
    "setuptools",
    "types-colorama<0.5.0",
    "ty~=0.0.0",
    "werkzeug<4.0.0",
]

[tool.ruff]
line-length = 120
include = [
    "**/*.py",
    "**/*.md",
    "**/*.mdx",
]
exclude = ["website/versioned_docs/**"]

[tool.ruff.extension]
mdx = "markdown"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",
    "ASYNC109",
    "BLE001",
    "C901",
    "COM812",
    "CPY001",
    "D100",
    "D104",
    "D107",
    "D203",
    "D213",
    "D413",
    "EM",
    "G004",
    "ISC001",
    "FIX",
    "PLR0911",
    "PLR0913",
    "PLR0915",
    "PTH",
    "PYI034",
    "PYI036",
    "S102",
    "S105",
    "S106",
    "S301",
    "S303",
    "S311",
    "TD002",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"**/_models.py" = ["TC001"]
"**/{scripts}/*" = [
    "D",
    "INP001",
    "PLR2004",
    "T20",
]
"**/{tests}/*" = [
    "D",
    "INP001",
    "PLR2004",
    "S101",
    "SLF001",
    "T20",
    "TRY301",
    "TID252",
]
"**/{docs,website}/**" = [
    "D",
    "INP001",
    "F841",
    "N999",
    "T201",
]
"**/docs/02_concepts/code/10_architecture_imports.py" = ["F401"]
"**/docs/03_guides/code/05_custom_http_client_{async,sync}.py" = ["ARG002"]
"src/apify_client/_{models,typeddicts}.py" = [
    "D",
    "E501",
    "ERA001",
    "TC003",
]
"src/apify_client/_literals.py" = ["PYI051"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["id"]

[tool.ruff.lint.isort]
known-local-folder = ["apify_client"]

[tool.ruff.lint.pylint]
max-branches = 18

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "-r a --verbose"
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
pythonpath = ["."]
timeout = 1800

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = [
    "src",
    "tests",
    "scripts",
    "docs",
    "website",
]
exclude = ["website/versioned_docs"]

[tool.ty.rules]
unused-ignore-comment = "error"

[[tool.ty.overrides]]
include = [
    "docs/**/*.py",
    "website/**/*.py",
]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

[[tool.ty.overrides]]
include = [
    "docs/**/10_plugging_in_async.py",
    "docs/**/10_plugging_in_sync.py",
]

[tool.ty.overrides.rules]
empty-body = "ignore"

[[tool.ty.overrides]]
include = [
    "docs/**/05_custom_http_client_async.py",
    "docs/**/05_custom_http_client_sync.py",
]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "assert_never()",
]

[tool.ipdb]
context = 7

[tool.datamodel-codegen]
input_file_type = "openapi"
output = "src/apify_client/_models.py"
target_python_version = "3.11"
output_model_type = "pydantic_v2.BaseModel"
use_schema_description = true
use_field_description = true
use_union_operator = true
capitalise_enum_members = true
collapse_root_models = true
set_default_enum_member = true
use_annotated = true
wrap_string_literal = true
snake_case_field = true
use_subclass_enum = true
reuse_model = true
extra_fields = "allow"
allow_population_by_field_name = true
aliases = "datamodel_codegen_aliases.json"
formatters = [
    "ruff-check",
    "ruff-format",
]
custom_file_header = "# generated by datamodel-codegen"
disable_timestamp = true
keep_model_order = true

[tool.uv]
exclude-newer = "24 hours"

[tool.uv.build-backend]
source-include = [
    "CHANGELOG.md",
    "CONTRIBUTING.md",
]

[tool.uv.exclude-newer-package]
apify-client = false
apify-shared = false
apify_fingerprint_datapoints = false
crawlee = false

[tool.poe.tasks]
clean = "rm -rf .coverage .pytest_cache .ruff_cache .ty_cache build dist htmlcov"
install-sync = "uv sync --all-extras"
build = "uv build"
publish-to-pypi = "uv publish --token ${APIFY_PYPI_TOKEN_CRAWLEE}"
type-check = "uv run ty check"
unit-tests = "uv run pytest --numprocesses=${TESTS_CONCURRENCY:-auto} tests/unit"
unit-tests-cov = "uv run pytest --numprocesses=${TESTS_CONCURRENCY:-auto} --cov=src/apify_client --cov-report=xml:coverage-unit.xml tests/unit"
integration-tests = "uv run pytest --numprocesses=${TESTS_CONCURRENCY:-auto} tests/integration"
integration-tests-cov = "uv run pytest --numprocesses=${TESTS_CONCURRENCY:-auto} --cov=src/apify_client --cov-report=xml:coverage-integration.xml tests/integration"
check-docstrings = "uv run python -m scripts.check_docstrings"
fix-docstrings = "uv run python -m scripts.fix_docstrings"
check-code = [
    "lint",
    "type-check",
    "check-docstrings",
    "unit-tests",
]

[tool.poe.tasks.install-dev]
shell = "uv sync --all-extras && uv run pre-commit install"

[tool.poe.tasks.lint]
shell = "uv run ruff format --check && uv run ruff check"

[tool.poe.tasks.format]
shell = "uv run ruff check --fix && uv run ruff format"

[tool.poe.tasks.update-docs-theme]
shell = "pnpm update @apify/docs-theme"
cwd = "website"

[tool.poe.tasks.build-docs]
shell = "./build_api_reference.sh && pnpm install && uv run pnpm build"
cwd = "website"

[tool.poe.tasks.run-docs]
shell = "./build_api_reference.sh && pnpm install && uv run pnpm start"
cwd = "website"

[tool.poe.tasks.generate-models]
shell = """
uv run datamodel-codegen --url https://docs.apify.com/api/openapi.json --alias-generator to_camel && uv run datamodel-codegen --url https://docs.apify.com/api/openapi.json --output src/apify_client/_typeddicts.py --output-model-type typing.TypedDict --no-use-closed-typed-dict && python scripts/postprocess_generated_models.py
"""

[tool.poe.tasks.generate-models-from-file]
shell = """
uv run datamodel-codegen --input $input_file --alias-generator to_camel && uv run datamodel-codegen --input $input_file --output src/apify_client/_typeddicts.py --output-model-type typing.TypedDict --no-use-closed-typed-dict && python scripts/postprocess_generated_models.py
"""

[[tool.poe.tasks.generate-models-from-file.args]]
name = "input-file"
positional = true
required = true
