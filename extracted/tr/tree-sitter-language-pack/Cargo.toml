[workspace]
resolver = "2"
members = ["crates/ts-pack-core-py"]

[workspace.package]
version = "1.13.5"
edition = "2024"
license = "MIT"
repository = "https://github.com/xberg-io/tree-sitter-language-pack"
homepage = "https://xberg.io"
authors = ["Na'aman Hirschfeld <naaman@xberg.io>"]
description = "A comprehensive tree-sitter language pack with polyglot bindings"
keywords = ["tree-sitter", "parser", "syntax", "language-pack", "xberg"]

[workspace.dependencies]
ahash = { version = "0.8", default-features = false, features = ["std", "compile-time-rng", "serde"] }
axum = { version = "0.8", features = ["macros"] }
cbindgen = "0.29"
cc = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
criterion = { version = "0.8", features = ["html_reports"] }
dirs = "6"
fd-lock = "4"
js-sys = "0.3"
libloading = "0.9"
magnus = "0.8"
memchr = "2"
napi = { version = "3", features = ["napi4", "serde-json"] }
napi-build = "2"
napi-derive = "3"
pyo3 = { version = "0.29", features = ["abi3-py310"] }
rayon = "1"
rb-sys = "0.9"
regex = "1"
rmcp = { version = "2.2", features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
    "server-side-http",
] }
rustler = "0.38"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
toml = "1.1"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.26"
tree-sitter-language-pack = { }
ureq = { version = "3", features = ["platform-verifier", "socks-proxy"] }
walkdir = "2.5"
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"
zstd = "0.13"

