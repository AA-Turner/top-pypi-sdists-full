[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trajectory-sdk"
version = "0.9.17"
description = "Generated Trajectory API client and high-level workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx2>=2.13.1",
  "pathspec>=0.12",
  "pydantic>=2.0",
  "tqdm>=4.67",
]

[project.urls]
Documentation = "https://docs.trajectory.ai"
Cookbook = "https://github.com/Trajectorylabs/trajectory-cookbook"

[dependency-groups]
dev = [
  "h2",
  "pytest>=8",
  "pytest-asyncio>=0.25",
  "ruff>=0.14",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["trajectory", "trajectory.*"]

[tool.setuptools.data-files]
"share/doc/trajectory-sdk" = ["docs/*.mdx", "docs/*.json"]
"share/doc/trajectory-sdk/guides" = ["docs/guides/*.mdx"]
"share/doc/trajectory-sdk/reference" = ["docs/reference/*.mdx"]
"share/doc/trajectory-sdk/images" = ["docs/images/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
