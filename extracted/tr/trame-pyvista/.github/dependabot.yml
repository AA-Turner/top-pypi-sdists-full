version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      # Daily so a new trame release is allowed (or its breakage found) within a day.
      interval: daily
    # `pyvista-docs` runs the PyVista docs build on the bump PR.
    labels: [maintenance, dependencies, pyvista-docs]
    open-pull-requests-limit: 20
    groups:
      trame:
        patterns: ["trame*", "wslink"]
  - package-ecosystem: github-actions
    directory: "/.github/workflows"
    schedule:
      interval: weekly
    labels: [maintenance, dependencies]
    groups:
      artifacts:
        patterns: ["actions/upload-artifact", "actions/download-artifact"]
