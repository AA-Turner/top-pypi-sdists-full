[build-system]
build-backend = "uv_build"
requires = ["uv-build>=0.12.1,<0.13"]

[project]
name = "treepoem"
version = "3.29.0"
description = "Barcode rendering for Python supporting QRcode, Aztec, PDF417, I25, Code128, Code39 and many more types."
readme = "README.rst"
keywords = ["barcode bwipp postscript ghostscript qr qrcode aztec azteccode pdf417 interleaved2of5 i25 code128 code39"]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = ["pillow"]

[[project.maintainers]]
name = "Adam Johnson"
email = "me@adamj.eu"

[[project.authors]]
name = "Christian Muirhead"
email = "xtian@babbageclunk.com"

[project.urls]
Changelog = "https://github.com/adamchainz/treepoem/blob/main/CHANGELOG.rst"
Funding = "https://adamj.eu/books/"
Repository = "https://github.com/adamchainz/treepoem"

[project.scripts]
treepoem = "treepoem.__main__:main"

[dependency-groups]
test = [
    "pillow",
    "pytest>=9",
    "pytest-randomly",
]

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "E",
    "F",
    "I",
    "SIM",
    "TID",
    "UP",
    "W",
]
ignore = [
    "B9",
    "E501",
    "SIM105",
    "SIM108",
]
extend-safe-fixes = ["UP006"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.pyproject-fmt]
max_supported_python = "3.15"

[tool.mypy]
mypy_path = "src/"
namespace_packages = false
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
]
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
allow_untyped_defs = true

[tool.pytest]
strict = true

[tool.rstcheck]
report_level = "ERROR"
