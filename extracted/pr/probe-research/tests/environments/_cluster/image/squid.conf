# The site proxy of a cluster whose compute nodes have no route out: it is the ONLY
# thing on the private network that can reach the API. Test-only: allows everyone on
# that network, caches nothing.
http_port 3128
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny CONNECT !SSL_ports
http_access allow all
cache deny all
access_log stdio:/var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
pid_filename /run/squid-envtest.pid
coredump_dir /var/spool/squid
shutdown_lifetime 1 seconds
