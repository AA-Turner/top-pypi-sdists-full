# A two-node Slurm cluster in containers: controller `slurmctl`, compute `c1` and `c2`.
#
# proctrack/linuxproc instead of proctrack/cgroup: cgroup tracking needs a delegated
# cgroup tree the test containers do not get. The difference that matters for Probe:
# linuxproc tracks a job by its process tree, so a process that detaches (a new
# session, reparented to init) outlives the job, where cgroup tracking would kill it.
# The tests model the cgroup behaviour explicitly by killing the researcher's
# leftover processes on each node after the job ends (`node_cleanup`).
ClusterName=envtest
SlurmctldHost=slurmctl
SlurmUser=root
SlurmdUser=root
AuthType=auth/munge
CredType=cred/munge
MpiDefault=none
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
JobAcctGatherType=jobacct_gather/none
AccountingStorageType=accounting_storage/none
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core
SlurmdParameters=config_overrides
ReturnToService=2
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid
SlurmdSpoolDir=/var/spool/slurmd
StateSaveLocation=/var/spool/slurmctld
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
# scancel: SIGCONT + SIGTERM, then SIGKILL after KillWait seconds (default 30).
KillWait=10
MinJobAge=600
JobRequeue=1
InactiveLimit=0
Waittime=0
SlurmctldTimeout=30
SlurmdTimeout=60
NodeName=c[1-2] CPUs=2 RealMemory=2000 State=UNKNOWN
PartitionName=main Nodes=c[1-2] Default=YES MaxTime=INFINITE State=UP OverSubscribe=NO
