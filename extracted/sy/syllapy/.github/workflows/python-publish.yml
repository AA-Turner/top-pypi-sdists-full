# This workflow builds the package and publishes it to PyPI using Trusted
# Publishing (OIDC) when a release is created. No stored credentials needed —
# configure a Trusted Publisher for the syllapy project on PyPI pointing at
# this repo, this workflow file, and the "pypi" environment.

name: Upload Python Package

on:
  release:
    types: [published]

jobs:
  publish:

    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/syllapy
    permissions:
      id-token: write

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    - name: Verify release version
      run: |
        python - <<'PY'
        import os
        import tomllib

        with open("pyproject.toml", "rb") as file:
            version = tomllib.load(file)["project"]["version"]

        tag = os.environ["GITHUB_REF_NAME"]
        if tag != f"v{version}":
            raise SystemExit(
                f"Release tag {tag!r} does not match package version {version!r}"
            )
        PY
    - name: Build package
      run: |
        python -m pip install --upgrade pip build
        python -m build
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
