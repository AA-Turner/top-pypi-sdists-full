[project]
name = "labelbox-recursion-sdk"
version = "0.1.0"
description = "Typed Python SDK for the Recursion API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1,<0.29",
    "pydantic>=2.12,<3",
    "jsonschema>=4.23,<5",
    "rfc3339-validator>=0.1.4,<0.2",
]

[project.urls]
Repository = "https://github.com/Labelbox/recursion-platform/tree/main/packages/recursion-python-sdk"

[dependency-groups]
dev = [
    "datamodel-code-generator==0.83.0",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.0",
    "types-jsonschema>=4.23,<5",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "recursion_sdk"
source-include = [
    "tools/**",
    "tests/**",
]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_explicit = true
files = [
    "src",
    "tools",
    "tests",
]

[[tool.mypy.overrides]]
module = [
    "recursion_sdk._generated.models",
    "recursion_sdk._transport",
]
disallow_any_explicit = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["src/recursion_sdk/_generated"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "ANN",
    "RUF",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
