[project]
name = "labric"
version = "0.9.6"
description = "The official Python library for the Labric API"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Labric" }]
dependencies = [
    "httpx>=0.21.2",
    "pydantic>=1.9.2",
    "typing_extensions>=4.0.0",
]

[project.urls]
Homepage = "https://labric.co"
Platform = "https://platform.labric.co"
Documentation = "https://docs.labric.co"
Repository = "https://github.com/Labric-Platforms/py-sdk"

[dependency-groups]
dev = ["pytest>=7.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labric"]
exclude = ["src/labric/tests", "src/labric/**/*.md"]
