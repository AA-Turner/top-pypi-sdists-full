[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lazr.uri"
version = "4.0.0"
description = "A self-contained, easily reusable library for parsing, manipulating, and generating URIs."
readme = "README.rst"
requires-python = ">=3.8"
license = { text = "LGPL v3" }
maintainers = [
    { name = "LAZR Developers" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Library or Lesser General Public License (LGPL)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.optional-dependencies]
docs = ["Sphinx"]
test = [
    "zope.testing>=4.6.0",
    "zope.testrunner>=6.6.1",
]

[project.urls]
Homepage = "https://launchpad.net/lazr.uri"
Source = "https://code.launchpad.net/lazr.uri"
"Issue Tracker" = "https://bugs.launchpad.net/lazr.uri"
Documentation = "https://lazruri.readthedocs.io/en/latest/"
Download = "https://launchpad.net/lazr.uri/+download"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.black]
line-length = 79
target-version = ["py38"]

[tool.isort]
known_first_party = "lazr.uri"
line_length = 79
profile = "black"
