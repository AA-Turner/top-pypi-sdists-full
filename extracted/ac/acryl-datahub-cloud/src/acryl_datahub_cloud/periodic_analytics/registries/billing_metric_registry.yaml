# Commercial api_usage registry overlay (paired with usage_operations.yaml).
#
# Two purposes in one file:
#
# 1) Kafka / Tier B flush
#    Everything under metric_registry is aggregated in GMS and landed on API_USAGE
#    BillingEvent batches (Kafka → S3 events/). Overlay replaces OSS defs for the
#    same name (see BillingUsageMetricContributor).
#
# 2) Metronome / billing-sync
#    - metronome_batch: true  — almost-direct: period MTD of this flush metric
#      (additive SUM→MAX gauge; distinct → period cardinality). DP-25 applies.
#    - publish_cadence / finalize_grain — when billing-sync may emit and when
#      a scope seals (schedule is wake-up only; these are state predicates).
#      finalize_grain supports hour, day, or month. Monthly publish cadence is
#      valid only with month finalization.
#    - metronome_aggregation — sum (signed delta → Metronome SUM), latest
#      (absolute MTD → LATEST), or max (absolute MTD → MAX). Use sum for
#      event counters; latest/max for gauges (distinct MAU or additive
#      snapshots such as asset counts). monthly_active_* use max.
#    - derived_metrics        — not flushed by GMS; billing-sync (or lander) computes
#      the Metronome quantity from landed raw metrics + usage_operations.
#    - billable_actor_classes — per-metric actor_class allowlist for Metronome
#      additive/distinct paths (recipe may override via metric_registry_override).
#
# system_usage family: inventory gauges (entity counts). Landed by GMS
# EntityCountMetricsPublisher (not request-path aggregation). Soft-deleted
# kept separate in S3; Metronome uses derived data_assets_stored
# (allowlist × active+soft_deleted) with MAX. Do not put derived names in
# metric_registry — they are not GMS counters.

metric_registry:
  api_usage:
    # Rest.li + OpenAPI + GraphQL. billing-sync publishes one Metronome stream
    # per request_api value (dimension on API_CALLS) so billable metrics can
    # filter openapi/restli vs graphql.
    api_calls:
      merge_kind: additive
      value_unit: count
      metronome_batch: true
      emit_when: always
      metronome_dimensions: [request_api]
      publish_cadence: hourly
      finalize_grain: hour
      # Human traffic only — system (__datahub_system) is excluded from call
      # counts. Embedded-ingestion bytes are metered on billed_bytes instead.
      billable_actor_classes:
        - regular
    # Still land in S3 / Tier C; Metronome remains on Tier A for now.
    mcp_query:
      merge_kind: additive
      value_unit: count
      metronome_batch: false
      emit_when: reported
      publish_cadence: hourly
      finalize_grain: hour

    # Land raw flush-window distincts for S3 / Tier C. Metronome MAU family is
    # derived (period cardinality) — see derived_metrics.monthly_active_*.
    active_users:
      merge_kind: distinct
      distinct_key: usage_identity
      value_unit: count
      metronome_batch: false
      emit_when: activity_allowlist
    active_readers:
      merge_kind: distinct
      distinct_key: usage_identity
      value_unit: count
      metronome_batch: false
      emit_when: reader_activity_allowlist
    active_writers:
      merge_kind: distinct
      distinct_key: usage_identity
      value_unit: count
      metronome_batch: false
      emit_when: writer_activity_allowlist

    # Archive / analytics only; Metronome uses derived billed_bytes / cost units
    input_bytes:
      merge_kind: additive
      value_unit: input_bytes
      metronome_batch: false
      emit_when: always
    output_bytes:
      merge_kind: additive
      value_unit: output_bytes
      metronome_batch: false
      emit_when: always

  system_usage:
    entity_count_active:
      merge_kind: latest
      value_unit: count
      metronome_batch: false
      required_dimensions: [entity_type]
      emit_when: reported
    entity_count_soft_deleted:
      merge_kind: latest
      value_unit: count
      metronome_batch: false
      required_dimensions: [entity_type]
      emit_when: reported

# Metronome (and billing_close/) quantities that are not GMS flush metrics.
# Ignored by BillingUsageMetricContributor / UsageMetricRegistry for request path
# (system_usage gauges still merge into the registry for schema validation).
derived_metrics:
  api_usage:
    billed_bytes:
      derived_from: [input_bytes]
      rule: filter_ingestion_endpoint
      merge_kind: additive
      value_unit: bytes
      metronome_batch: true
      publish_cadence: hourly
      finalize_grain: hour
      # Includes system: embedded ingestion authenticates to GMS as __datahub_system.
      billable_actor_classes:
        - regular
        - system
      notes: "Sum input_bytes where usage_operation has ingestion_endpoint: true"
    api_cost_units:
      derived_from: [api_calls]
      rule: multiply_default_cost_units
      merge_kind: additive
      value_unit: cost_units
      metronome_batch: false
      # Same allowlist as api_calls (regular-only).
      billable_actor_classes:
        - regular
      notes: "api_calls * usage_operations.default_cost_units (fallback 1); not sent to Metronome today"
    monthly_active_users:
      derived_from: [active_users]
      rule: period_distinct
      merge_kind: distinct
      distinct_key: usage_identity
      value_unit: count
      metronome_batch: true
      publish_cadence: hourly
      finalize_grain: month
      metronome_aggregation: max
      billable_actor_classes:
        - regular
      notes: "UTC calendar-period cardinality of active_users identities (TG-7); DP-25 at billing-sync"
    monthly_active_readers:
      derived_from: [active_readers]
      rule: period_distinct
      merge_kind: distinct
      distinct_key: usage_identity
      value_unit: count
      metronome_batch: true
      publish_cadence: hourly
      finalize_grain: month
      metronome_aggregation: max
      billable_actor_classes:
        - regular
      notes: "UTC calendar-period cardinality of active_readers"
    monthly_active_writers:
      derived_from: [active_writers]
      rule: period_distinct
      merge_kind: distinct
      distinct_key: usage_identity
      value_unit: count
      metronome_batch: true
      publish_cadence: hourly
      finalize_grain: month
      metronome_aggregation: max
      billable_actor_classes:
        - regular
      notes: "UTC calendar-period cardinality of active_writers"

  system_usage:
    data_assets_stored:
      derived_from: [entity_count_active, entity_count_soft_deleted]
      rule: sum_billable_entity_types
      rule_config:
        # Default billable catalog types. Recipe/bootstrap omit billable_entity_types
        # to use these; override via recipe or BILLING_SYNC_BOOTSTRAP_VALUES JSON array.
        entity_types:
          - document
          - dashboard
          - dataFlow
          - dataJob
          - dataProduct
          - dataset
          - chart
          - metric
          - mlFeatureTable
          - mlModel
          - notebook
      merge_kind: latest
      value_unit: count
      metronome_batch: true
      metronome_aggregation: max
      publish_cadence: hourly
      # Matches billing-sync's dedicated system_usage gauge path: each wake that
      # sees an absolute increase emits with properties.finalized=true (hour seal).
      # Day/month bucket averages are analytics-only and are not Metronome inputs.
      finalize_grain: hour
      notes: >
        Allowlist sum of active+soft_deleted per entity_type. Rollup:
        events→hour=latest, hours→day=average, days→month=average.
        Metronome publishes max of hourly-derived absolute (not day/month avg)
        via the dedicated gauge path (hour-final; not api_usage MTD predicates).
        S3 keeps active/soft_deleted separate. Default types: document,
        dashboard, dataFlow, dataJob, dataProduct, dataset, chart, metric,
        mlFeatureTable, mlModel, notebook.
    data_assets_stored_soft_deleted:
      derived_from: [entity_count_soft_deleted]
      rule: sum_billable_entity_types
      rule_config:
        # Same allowlist as data_assets_stored (ops companion metric; not the
        # primary contract quantity). Recipe billable_entity_types overrides both.
        entity_types:
          - document
          - dashboard
          - dataFlow
          - dataJob
          - dataProduct
          - dataset
          - chart
          - metric
          - mlFeatureTable
          - mlModel
          - notebook
      merge_kind: latest
      value_unit: count
      metronome_batch: true
      metronome_aggregation: max
      publish_cadence: hourly
      finalize_grain: hour
      notes: >
        Allowlist sum of soft_deleted only (companion to data_assets_stored).
        Same sealed-hour gauge path and MAX publish policy.
