[project]
name = "roombapy"
version = "2.0.0"
description = "Python program and library to control Wi-Fi enabled iRobot Roombas"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
]
dependencies = [
    "orjson>=3.9.13",
    "aiomqtt>=2.5,<3.0",
    "mashumaro>=3.12,<4.0",
    "typing-extensions>=4.12.0",
]

[[project.authors]]
name = "Philipp Schmitt"
email = "philipp@schmitt.co"

[project.optional-dependencies]
cli = [
    "click>=8.1,<9.0",
    "tabulate>=0.9,<0.11",
]

[project.urls]
Repository = "https://github.com/pschmitt/roombapy"

[project.scripts]
roombapy = "roombapy.cli:cli"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.0,<2.0",
    "ruff>=0.5.0,<0.17",
    "pre-commit>=3.6.2,<5.0.0",
    "pre-commit-hooks>=4.5,<7.0",
    "codespell>=2.2.6,<3.0.0",
    "mypy>=1.8,<3.0",
    "types-tabulate>=0.9,<0.11",
]

[tool.codespell]
skip = "roombapy/vendor_errors.py,uv.lock"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 79

[tool.ruff.lint]
ignore = [
    "ANN401",
    "B007",
    "C901",
    "CPY001",
    "D203",
    "D213",
    "DTZ005",
    "FBT002",
    "COM812",
    "ISC001",
    "PLR2004",
    "PLR0912",
]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"roombapy/vendor_errors.py" = [
    "E501",
    "RUF001",
]
"tests/*" = [
    "ASYNC110",
    "B017",
    "PT011",
    "S603",
    "SLF001",
    "D401",
    "D210",
]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
follow_imports = "normal"
strict_optional = true
strict = true
packages = [
    "roombapy",
    "tests",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
