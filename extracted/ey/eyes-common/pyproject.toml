[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eyes-common"
version = "6.5.25.post1"
description = "Applitools Python SDK. Common code package"
readme = "README.rst"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [
    {name = "Applitools Team", email = "team@applitools.com"}
]
keywords = ["applitools", "eyes", "eyes_images", "eyes_selenium", "eyes_playwright"]
classifiers = [
    "Programming Language :: Python",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.7, <4"
dependencies = [
    "attrs>=23,<26",
    "core-universal4>=4.43.0",
    "marshmallow>=3.15,<4",
    "websocket-client>=1.2,<2; python_version>='3.4'",
]

[project.urls]
Homepage = "https://applitools.com"

[tool.setuptools.packages.find]
where = ["."]
include = ["applitools*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]
