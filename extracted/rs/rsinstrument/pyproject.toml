[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "RsInstrument"
version = "1.126.0"
license="MIT"
description="VISA or Socket Communication Module for Rohde & Schwarz Instruments"
readme = {file = "README.rst", content-type = "text/x-rst"}
keywords = ["RsInstrument", "VISA", "RohdeSchwarz"]
authors = [{name = "Rohde & Schwarz GmbH & Co. KG"}]
maintainers = [{name = "Rohde & Schwarz GmbH & Co. KG"}]

requires-python = ">= 3.10"
dependencies = [
		"pyvisa>=1.13.0",
		"typing-extensions>=4.0.0"
	]

classifiers = [
	  # How mature is this project? Common values are
	  #   4 - Beta
	  #   5 - Production/Stable
	  "Development Status :: 5 - Production/Stable",

	  # Indicate who your project is intended for
	  "Intended Audience :: Developers",

	  # IVI Trove Classifier(s)
	  "Topic :: Scientific/Engineering :: Instrument Drivers",

	  # Specify the Python versions you support here.
	  "Programming Language :: Python :: 3",
	  "Programming Language :: Python :: 3.10",
	  "Programming Language :: Python :: 3.11",
	  "Programming Language :: Python :: 3.12",
	  "Programming Language :: Python :: 3.13",
	  "Programming Language :: Python :: 3.14",
	]

[tool.setuptools]
# ...
package-dir = {"RsInstrument" = "RsInstrument"}

[tool.setuptools.packages.find]
where = ["."]
include = ["RsInstrument*"]

[project.optional-dependencies]
mcp = ["fastmcp>=2.14.0"]
otel = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]
# Optional extras for pip / setuptools (``pip install RsInstrument[dev]``). Pip does not read
# ``[dependency-groups]`` (PEP 735) yet, so uv users should prefer ``uv sync --group dev`` instead.
# Remove these mirrored extras once pip natively supports ``[dependency-groups]``.
# This ``dev`` extra mirrors the combined ``dependency-groups`` dev toolchain as a flat list.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9.0",
    "ty>=0.0.1",
]
# Same toolchain as ``dependency-groups.dev-mcp-otel`` for ``pip install RsInstrument[dev-mcp-otel]``.
dev-mcp-otel = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9.0",
    "ty>=0.0.1",
    "pyvisa-py>=0.7.0",
    "fastmcp>=2.14.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]

# Toolchains: ``uv sync --group dev`` (pytest, ruff, ty, coverage).
# For MCP and OpenTelemetry tests: ``uv sync --group dev-mcp-otel`` (includes ``dev``).
[dependency-groups]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "types" },
]
dev-mcp-otel = [
    { include-group = "dev" },
    "pyvisa-py>=0.7.0",
    "fastmcp>=2.14.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
lint = [
    "ruff>=0.9.0",
]
types = [
    "ty>=0.0.1",
]

[project.scripts]
RsInstrument-mcp = "RsInstrument.mcp:main"

[project.urls]
Documentation = "https://rsinstrument.readthedocs.io/"
Examples = "https://github.com/Rohde-Schwarz/Examples/"
Repository = "https://github.com/Rohde-Schwarz/RsInstrument"

[tool.pytest.ini_options]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "hardware: requires a lab instrument or specific VISA resource on the network",
]

[tool.coverage.run]
branch = true
source = ["RsInstrument/mcp"]

[tool.coverage.report]
precision = 2
include = [
    "RsInstrument/mcp/__init__.py",
]
fail_under = 100