[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rs-data"
version = "v1.5.0"
description = "RegScale gRPC contract library — assets, issues, and vulnerabilities"
authors = [{ name = "RegScale" }]
requires-python = ">=3.9"
keywords = ["regscale", "grpc", "protobuf", "assets", "compliance"]
dependencies = [
    "grpcio>=1.80.0",
    "protobuf>=4.25.0",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.80.0",
    "mypy-protobuf>=3.6.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["rs_data*"]

[tool.setuptools.package-data]
"rs_data" = ["py.typed", "**/*.pyi"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
