[project]
name = "rsconnect_python"
description = "The Posit Connect command-line interface."
requires-python = ">=3.11"
version = "1.34.1"
dependencies = [
    "pip>=20.3",
    "uv>=0.9.0",
    "semver>=2.0.0,<4.0.0",
    "pyjwt>=2.15.0",
    "click>=8.0.0",
    "packaging>=20.0",
]

[[project.authors]]
name = "Posit, PBC"
email = "rsconnect@posit.co"

[project.license]
file = "LICENSE.md"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.scripts]
rsconnect = "rsconnect.main:cli"

[project.optional-dependencies]
keyring = ["keyring>=23.0.0"]
snowflake = ["snowflake-cli>=3.23.0"]

[project.urls]
Repository = "http://github.com/posit-dev/rsconnect-python"
Documentation = "https://docs.posit.co/rsconnect-python"

[dependency-groups]
test = [
    "coverage",
    "httpretty",
    "ipykernel",
    "nbconvert",
    "pytest",
    "pytest-cov",
    "twine",
    "types-Flask",
    "ruff",
    "pyright",
]
docs = [
    "mkdocs-material",
    "mkdocs-click",
    "pymdown-extensions",
    "mkdocs-macros-plugin",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
environments = ["python_full_version >= '3.11.5'"]

[tool.uv.build-backend]
module-name = "rsconnect"
module-root = ""

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    "rsconnect-build",
    "rsconnect-build-test",
    "tests/testdata",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "UP",
]
ignore = [
    "E203",
    "E231",
    "E302",
    "UP031",
]

[tool.ruff.lint.per-file-ignores]
"tests/test_metadata.py" = ["E501"]

[tool.pyright]
typeCheckingMode = "strict"
reportPrivateUsage = "none"
reportUnnecessaryIsInstance = "none"
reportUnnecessaryComparison = "none"

[tool.coverage.run]
omit = ["tests/*"]

[tool.pytest.ini_options]
markers = []
addopts = """
    --ignore=tests/testdata
"""
