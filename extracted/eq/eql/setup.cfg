[wheel]
universal = 1

[flake8]
max-line-length = 120
max-complexity = 23
ignore = F405, D401, D300, F403, E721, W504, E241

[pep257]
ignore = D203

[tool:pytest]
addopts = --cov=eql --cov-report term-missing --cov-report=xml --cov-report=html --junitxml=junit.xml -v

[egg_info]
tag_build = 
tag_date = 0

