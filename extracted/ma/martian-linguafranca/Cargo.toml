[workspace]
resolver = "2"
members = ["crates/linguafranca", "crates/python"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/withmartian/linguafranca"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_ignored = "0.1"
schemars = "1"
thiserror = "2"
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py310"] }
linguafranca = { path = "crates/linguafranca" }
pretty_assertions = "1"
rstest = "0.25"
