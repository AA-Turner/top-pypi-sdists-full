[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/{tests}/*" = [
    "ANN201",
    "ANN202",
    "T201",
    "D",
    "F841",
    "PLW1514",
]
"dagger/*" = ["TID252"]
"tests/_ast/test_codegen.py" = ["FLY002"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]
combine-as-imports = true

[tool.ruff.lint.flake8-type-checking]
exempt-modules = [
    "typing",
    "typing_extensions",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
banned-module-level-imports = [
    "altair",
    "anywidget",
    "chdb",
    "clickhouse_connect",
    "duckdb",
    "ipython",
    "numpy",
    "packaging",
    "pandas",
    "polars",
    "psutil",
    "pyarrow",
    "redis",
    "sqlalchemy",
    "obstore",
    "fsspec",
    "sqlglot",
    "tomlkit",
    "typing_extensions",
    "pyiceberg",
    "redshift_connector",
    "starrocks",
    "pydantic_ai",
    "zmq",
]

[tool.ruff.lint.flake8-pytest-style]
mark-parentheses = false
fixture-parentheses = false

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
strict = true
exclude = [
    "examples",
    "tests/_ast/app_data",
    "tests/_ast/codegen_data",
    "tests/_ast/cell_data",
    "tests/_cli/cli_data",
    "tests/_runtime/runtime_data",
    "marimo/_snippets/data/",
    "marimo/_smoke_tests/",
]
warn_unused_ignores = false

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q -v --ignore tests/_cli/fixtures --ignore tests/_ast/codegen_data --ignore tests/_ast/app_data"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
faulthandler_timeout = 120
markers = [
    """slow: marks tests as slow (deselect with '-m "not slow"')""",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "flaky: marks tests that are known to be flaky",
    "requires(dep1, dep2, ...): requires one or more dependencies to be installed",
]

[tool.coverage.run]
omit = ["marimo/_tutorials/*"]

[tool.typos.default]
extend-ignore-re = ["[0-9a-zA-Z_-]{43}"]

[tool.typos.default.extend-words]
wheres = "wheres"
Ue = "Ue"
Nd = "Nd"
pn = "pn"
caf = "caf"
ser = "ser"
oint = "oint"

[tool.typos.files]
extend-exclude = [
    "MultiSelectPlugin.test.ts",
    "module_name_to_pypi_name.py",
    "**/pnpm-lock.yaml",
    "**/snapshots/*",
    "**/__demo__/*",
    "base64.test.ts",
    "SECURITY.md",
    "patches/*",
    "frontend/dist/assets/*",
    "tests/_sql/test_sql_parse.py",
]

[tool.marimo.ai]
rules = """
- prefer polars over pandas
- make charts using altair"""

[tool.marimo.save]
autosave_delay = 1000
autosave = "after_delay"
format_on_save = true

[tool.marimo.experimental]
multi_column = true
cache_panel = true
isolate_apps = true

[tool.marimo.display]
dataframes = "rich"

[tool.marimo.runtime]
auto_instantiate = false
watcher_on_save = "autorun"
output_max_bytes = 10000000
std_stream_max_bytes = 2000000
dotenv = [".env"]

[tool.marimo.package_management]
manager = "uv"

[tool.marimo.keymap]
vimrc = "configs/.vimrc"

[tool.basedpyright]
reportUnusedCallResult = false

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [
    "osx-arm64",
    "linux-64",
    "linux-aarch64",
]

[tool.pixi.dependencies]
nodejs = "22.*"
pnpm = "10.*"
make = ">=4.4.1,<5"
pre_commit = ">=4.2.0,<5"
uv = ">=0.6.12,<0.7"
python = "3.12.*"
pip = ">=25.0.1,<26"

[tool.pixi.pypi-dependencies.marimo]
path = "."
editable = true
