[build-system]
requires = ["uv_build>=0.8.3,<0.12.0"]
build-backend = "uv_build"

[project]
name = "marimo"
version = "0.23.16"
description = "A library for making reactive notebooks and apps"
dependencies = [
    "click>=8.0,<9; sys_platform != 'emscripten'",
    "jedi>=0.18.0,<0.20.0",
    "markdown>=3.6,<4",
    "pymdown-extensions>=10.21.2,<12",
    "pygments>=2.19,<3",
    "tomlkit>=0.12.0",
    "pyyaml>=6.0.1",
    "uvicorn>=0.22.0; sys_platform != 'emscripten'",
    "starlette>=0.37.2; sys_platform != 'emscripten'",
    "python-multipart>=0.0.18",
    "websockets >= 14.2.0; sys_platform != 'emscripten'",
    "loro>=1.10.0; sys_platform != 'emscripten' and sys_platform != 'android'",
    "typing_extensions>=4.4.0; python_version < '3.12'",
    "docutils>=0.16.0",
    "psutil>=5.0; sys_platform != 'emscripten' and sys_platform != 'android'",
    "itsdangerous>=2.0.0",
    "narwhals>=2.0.0",
    "packaging",
    "msgspec>=0.20.0",
    "pyzmq>=27.1.0; python_version < '3.15' and sys_platform != 'emscripten'",
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
marimo = "marimo._cli.cli:main"

[project.urls]
homepage = "https://github.com/marimo-team/marimo"

[project.entry-points.docstring_to_markdown]
marimo_converter = "marimo._utils.docs:MarimoConverter"

[project.optional-dependencies]
sql = [
    "duckdb>=1.0.0",
    "polars[pyarrow]>=1.9.0",
    "sqlglot[c]>=26.8.0",
]
sandbox = [
    "pyzmq>=27.1.0",
    "uv>=0.9.21",
]
recommended = [
    "marimo[sql]",
    "marimo[sandbox]",
    "cryptography>=42.0.0",
    "altair>=5.4.0",
    "pydantic-ai-slim[openai]>=1.107.0,<3.0.0",
    "ruff",
    "nbformat>=5.7.0",
]
lsp = [
    "python-lsp-server>=1.13.0",
    "python-lsp-ruff>=2.0.0",
]
mcp = [
    "mcp>=1.0.0,<2",
    "pydantic>2",
]
otel = [
    "opentelemetry-api~=1.28.0",
    "opentelemetry-sdk~=1.28.0",
    "opentelemetry-exporter-otlp-proto-http~=1.28.0",
    "opentelemetry-exporter-otlp-proto-grpc~=1.28.0",
]

[dependency-groups]
dev = [
    "typos~=1.23.6",
    "opentelemetry-api~=1.28.0",
    "opentelemetry-sdk~=1.28.0",
    "opentelemetry-exporter-otlp-proto-http~=1.28.0",
    "opentelemetry-exporter-otlp-proto-grpc~=1.28.0",
    "duckdb>=1.0.0",
