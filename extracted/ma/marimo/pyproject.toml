test = [
    "httpx~=0.28.0",
    "urllib3~=2.5.0",
    "pytest~=9.0.2",
    "pytest-timeout~=2.4.0",
    "pytest-codecov~=0.7.0",
    "pytest-rerunfailures~=16.1",
    "pytest-asyncio~=1.3.0",
    "pytest-picked>=0.5.1",
    "pytest-sugar~=1.1.1",
    "pytest-xdist~=3.5",
    "inline-snapshot~=0.29.0",
    "hypothesis~=6.102.1",
    "dirty-equals~=0.9.0",
    "matplotlib~=3.10.7",
    "pillow>=9",
    "zstandard>=0.21.0",
    "cffi>=1.16.0",
]
test-optional = [
    { include-group = "test" },
    "adbc_driver_manager",
    "adbc_driver_sqlite",
    "python-lsp-server>=1.10.0",
    "vl-convert-python",
    "vegafusion",
    "pyarrow>=19.0.1",
    "pyarrow_hotfix",
    "altair>=5.4.0",
    "plotly>=5.14.0",
    "polars>=1.32.2",
    "sqlglot[c]>=26.8.0",
    "sqlalchemy>=2.0.40",
    "obstore>=0.8.2",
    "fsspec>=2026.2.0",
    "pyiceberg>=0.9.0",
    "cloudpathlib>=0.23.0",
    "chdb>=3; platform_system != 'Windows'",
    "clickhouse-connect>=0.8.18",
    "redshift-connector[full]>=2.1.7",
    "starrocks>=1.3.0",
    "pandas>=1.5.3",
    "hvplot~=0.11.3",
    "geopandas>=1.1.0",
    "duckdb>=1.0.0",
    "ibis-framework[duckdb]>=10.3.0",
    "pillow~=12.0.0",
    "anywidget~=0.9.21",
    "ipython~=8.12.3",
    "pydantic-ai-slim[google,anthropic,bedrock,openai]>=1.107.0,<3.0.0",
    "cachetools>=5.0.0",
    "boto3>=1.38.46",
    "nbformat>=5.10.4",
    "nbconvert>=7.17.0",
    "sympy>=1.13.3",
    "jupytext>=1.17.2",
    "jax>=0.4.27; python_version == '3.12'",
    "flax>=0.10.0; python_version == '3.12'",
    "torch>=2.4.0; python_version == '3.12'",
    "scikit-bio>=0.6.3; python_version == '3.12'",
    "mcp>=1.0.0,<2",
    "pyzmq>=27.1.0",
    "weave>=0.51.0",
    "basedpyright>=1.28.0",
]
typecheck = [
    "mypy~=1.15.0",
    "altair>=5.4.0",
    "leafmap~=0.39.2",
    "panel>=1.5.3",
    "polars>=1.9.0",
    "pytest>=9.0.2",
    "duckdb>=1.0.0",
    "narwhals>=2.0.0",
    "matplotlib>=3.8.0",
    "sqlglot[c]>=26.8.0",
    "sqlalchemy>=2.0.40",
    "obstore>=0.8.2",
    "fsspec>=2026.2.0",
    "pydantic-ai-slim[google,anthropic,bedrock,openai]>=1.107.0,<3.0.0",
    "loro>=1.5.0",
    "boto3-stubs>=1.38.46",
    "pandas-stubs>=1.5.3.230321",
    "pyiceberg>=0.9.0",
    "python-dotenv>=1.0.1",
    "jupytext>=1.17.2",
    "types-Pillow>=10.2.0.20240520",
    "types-Pygments>=2.18.0.20240506",
    "types-psutil>=5.9.5.20240516",
    "types-redis>=4.6.0.20241004",
    "types-Markdown>=3.6.0.20240316",
    "types-PyYAML>=6.0.12.20240808",
    "mcp>=1.0.0,<2",
    "pyzmq>=27.1.0",
    "pyarrow-stubs",
]
docs = [
    "marimo_docs",
    "ruff>=0.15.18",
    "mkdocs>=1.6.1",
    "click>=8.4",
    "mkdocs-material>=9.7.5",
    "mkdocstrings[python]>=0.27.0",
    "mkdocs-material-extensions>=1.3.1",
    "mkdocs-autorefs>=1.2.2",
    "mkdocs-git-revision-date-localized-plugin>=1.3.0",
    "mkdocs-minify-plugin>=0.8.0",
    "mkdocs-glightbox>=0.4.0",
    "mkdocs-macros-plugin>=1.3.7",
    "mkdocs-redirects>=1.2.2",
    "mkdocs-click>=0.8.1",
    "mike>=2.0.0",
    "pillow>=10.2.0,!=11.3.0",
    "cairosvg>=2.7.1",
    "mdx-include>=1.4.2",
    "pymdown-extensions>=10.21.2",
    "lzstring>=1.0.4",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.13.0",
]

[tool.uv]
exclude-newer = "7 days"

[tool.uv.sources.marimo_docs]
path = "./docs"
editable = true

[tool.uv.build-backend]
module-name = "marimo"
module-root = ""
source-include = [
    "third_party.txt",
    "third_party_licenses.txt",
]
wheel-exclude = ["marimo/_smoke_tests/**"]

[tool.ruff]
line-length = 79
target-version = "py310"
include = [
    "marimo/**/*.py",
    "tests/**/*.py",
    "dagger/**/*.py",
]
exclude = [
    "build",
    "docs",
    "examples",
    "frontend",
    "marimo/_smoke_tests",
    "marimo/_snippets/data",
    "marimo/_static/export_demos/wasm-intro.py",
    "marimo/_test_utils/_tutorials",
    "marimo/_test_utils/codegen_data",
    "marimo/_tutorials",
    "scripts",
    "tests/_ast/app_data",
    "tests/_ast/cell_data",
    "tests/_ast/codegen_data",
    "tests/_ast/test_app.py",
    "tests/_cli/cli_data",
    "tests/**/fixtures",
    "tests/_lint/test_files",
    "tests/_runtime/runtime_data",
]

