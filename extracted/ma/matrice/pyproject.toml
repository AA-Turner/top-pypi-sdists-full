[build-system]
requires = [
    "setuptools>=65.0.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "matrice"
dynamic = ["version"]
description = "Common server utilities for Matrice.ai services"
readme = "README.md"
authors = [{ name = "Matrice.ai", email = "dipendra@matrice.ai" }]
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = ["matrice", "common", "utilities", "mypyc", "compiled"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-cov==6.0.0",
    "pytest-mock>=3.0",
    "pytest-asyncio>=0.21",
    "pytest-timeout>=2.0",
    "ruff==0.11.12",
    "bandit[toml]==1.9.4",
    "mypy==1.13.0",
    "pre-commit==4.2.0",
    "pip-audit==2.7.3",
    "safety==3.2.11",
    "matrice_common>=0.1.0",
    "torch",
    "torchvision",
    "numpy",
    "scikit-learn",
    "structlog",
    "sentry-sdk",
    "requests",
    "Pillow",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["matrice"]
omit = [
    "src/matrice/__init__.py",
    "src/matrice/__init__.pyi",
    "src/matrice/metrics_calculator_oop.py",
    "src/matrice/local_testing.py",
    "src/matrice/testing.py",
    "src/matrice/pipeline.py",
    "src/matrice/checkpoint.py",
    "src/matrice/actionTracker.py",
    "src/matrice/app_store.py",
    "src/matrice/inference_orchestrator.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 0
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "pass",
]

[tool.mypy]
follow_imports = "skip"
ignore_missing_imports = true
warn_unused_ignores = false
show_error_codes = true

[[tool.mypy.overrides]]
module = [
  "torchvision",
  "torchvision.*",
  "sklearn",
  "sklearn.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "matrice_data_processing",
  "matrice_data_processing.*",
  "matrice_streaming",
  "matrice_streaming.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "pycocotools",
  "pycocotools.*",
  "pydantic",
  "pydantic.*",
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "examples"]
skips = ["B101", "B110", "B404", "B603", "B607"]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.black]
line-length = 120
target-version = ["py38"]
