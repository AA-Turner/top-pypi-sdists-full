[mypy]
# Type-checking configuration for the optional compiled build (see setup.py).
# Third-party dependencies are out of scope here: treat unstubbed imports as
# opaque (Any) instead of erroring, since only our own package is checked.
ignore_missing_imports = True
disable_error_code =
    abstract, annotation-unchecked, arg-type, assignment, attr-defined, call-arg,
    call-overload, dict-item, empty-body, func-returns-value, has-type, import-not-found,
    import-untyped, index, list-item, misc, name-defined, no-any-return, no-redef,
    no-untyped-call, no-untyped-def, operator, override, return, return-value,
    str-bytes-safe, str-format, truthy-function, type-arg, type-var, typeddict-item,
    typeddict-unknown-key, union-attr, unreachable, used-before-def, valid-type, var-annotated
# Report type errors ONLY for the modules mypyc is actually compiling (setup.py
# passes those explicitly on the command line). Modules that are merely pulled
# in as imports -- the excluded pure-Python modules (see MYPYC_EXCLUDE_MODULES)
# and the auto-generated flat stub src/matrice/__init__.pyi -- are still fully
# analysed so mypyc has the type info it needs, but their pre-existing type
# errors must not abort the compiled build: they are not compiled, so they
# cannot break the generated C. `silent` (not `skip`) keeps the analysis.
follow_imports = silent
# ...including the .pyi stubs of those merely-imported modules. stub_generation.py
# emits a single flat src/matrice/__init__.pyi that re-exports every symbol, so it
# legitimately contains duplicate definitions (`no-redef`) and unresolved names.
# It is a distribution artifact for IDEs, never compiled, and must not gate the build.
follow_imports_for_stubs = True

# Some third-party packages ship type stubs that are problematic for the build
# tooling; analyze them shallowly rather than following their internals.
[mypy-polars.*]
follow_imports = skip
follow_imports_for_stubs = True

# matrice_common ships py.typed + .pyi stubs but is installed as PURE PYTHON.
# If mypyc reads those stubs it emits unboxing/coercion at the call boundary to
# matrice_common functions (e.g. handle_response) as if the callee were
# compiled, which fails at runtime with the pure-Python callee (ABI mismatch,
# surfacing as "dict or None object expected; got str"). Treat it opaquely so
# calls go through the fully-boxed PyObject path.
[mypy-matrice_common.*]
follow_imports = skip
follow_imports_for_stubs = True

# Same treatment for the sibling matrice_streaming SDK: it is installed as pure
# Python, and the .pyi stubs it ships are auto-generated and lossy (they even
# contain syntactically invalid constructs, e.g. a docstring after `...` in
# matrice_streaming/__init__.pyi, which aborts the compiled build). It is
# imported lazily inside functions here (projects.py) and via the generated
# flat stub src/matrice/__init__.pyi, so keep it opaque.
[mypy-matrice_streaming.*]
follow_imports = skip
follow_imports_for_stubs = True
