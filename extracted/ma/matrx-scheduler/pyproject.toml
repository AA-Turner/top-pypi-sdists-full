[project]
name = "matrx-scheduler"
version = "0.3.308"
description = "Server-side execution engine for the matrx scheduling spine (sch_* tables): scanner, claim, runner, cron parser, HTTP API."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Matrx", email = "admin@aimatrx.com" }]
requires-python = ">=3.13"
keywords = ["matrx", "scheduler", "cron", "supabase", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "matrx-utils>=2.0.63",
    "pydantic>=2.12",
    "croniter>=2.0",
    "supabase>=2.0",
]

[project.optional-dependencies]
host = [
    "matrx-connect>=0.1.178",
    "matrx-ai>=0.5.463",
    "matrx-orm>=3.1.215",
]
api = [
    "fastapi>=0.115",
    "matrx-connect>=0.1.178",
    "httpx>=0.27",
    "PyJWT>=2.8",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "freezegun>=1.4",
    "fastapi>=0.115",
    "httpx>=0.27",
    "matrx-connect>=0.1.178",
]

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["matrx_scheduler"]
