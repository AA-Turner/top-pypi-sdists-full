# AI Matrx's own PR & media skills — one per imported outside PR skill and doctrine document
# (Arman, 2026-09-27: "for any actual skill that they have, in addition to using it to build
# agents, we also need to take the text of the skill and create our own skill as well for our
# skills library"). Each keeps the experts' method whole and is rewritten for how AI Matrx works:
# our tools by their real names, the news monitor, the brand context that arrives with the
# conversation, the CRM and Press Room, and our doctrine (offers, never blocks; nothing hidden;
# agents never send or schedule). Each is linked to the imported original as its parent.
# Loader + rules: matrx_ai/skills/library.py.
# Run: uv run python scripts/ingest_skills.py --library packages/matrx-ai/matrx_ai/skills/library/pr [--dry-run]
#
# Tool names follow what is live on 2026-09-27 plus the news engine spec and the approved mandate
# briefs (common-docs projects/outside-skill-packs/NEWS-ENGINE-SPEC.md and BRIEFS-*.md). Every tool,
# step, mandate or screen that is not built yet is marked "(not live yet)" in the body and listed in
# each skill's opening "Not live yet" note. When one ships, edit those lines and re-run.

set_id: ai-matrx-pr
title: "PR & media skills (AI Matrx)"
published_to_web: true
skill_type: workflow
parent_pack: elvisun-pr-skills

category:
  slug: public-relations
  name: "PR & Media"
  icon: Newspaper
  position: 64
  description: >-
    AI Matrx's own public relations and media skills — news opportunity detection and triage,
    story angles and newsworthiness, journalist fit and media lists, pitching, headlines, fact
    checks and brand voice, reactive comment and crisis holding statements, coverage tracking,
    PR strategy and calendars, and AI-visibility measurement — each following PR practitioners'
    proven method with AI Matrx's own tools, your brand context, and your monitor.

