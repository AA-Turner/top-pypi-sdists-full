  They do not exist in AI Matrx under these names. Use the AI Matrx tool listed where there
  is one (other tools that fit this work: `topical_map`, `keyword_meaning_suggest`,
  `records`, `workflow_run`).

tooling_notices:
  - label: "the source product's own connection and credit balance (its MCP connection, credits)"
    pattern: '\bMCP\b|\bcredits\b'
  - label: "the source product's own app screens and assistant (its Reports and Context pages, SAM)"
    pattern: '\bSAM\b|Reports page|Context page'
  - label: "a fixed credit line linking the source product's skill docs"
    pattern: '`https://openseo\.so/docs/skills/|Generated by the <a href="https://openseo\.so'
  - label: "the source product's plugin commands (`/openseo:…`)"
    pattern: '/openseo:'
  - label: "local folders on the person's own computer"
    pattern: '~/SEO|\blocal folder\b'
  - label: "quirks of one outside coding agent (Codex)"
    pattern: '\bCodex\b'
  - label: "helper agents the harness spawns (sub-agents)"
    pattern: '(?i)\bsub-?agents?\b'

# A playbook mostly narrates; only its how-to-run sections and ready-made prompts instruct
# the agent. Tooling mentioned elsewhere in it (in passing) does not mark it not-runnable.
# Skills are instructions end to end and are always scanned whole.
document_instruction_scope:
  headings: '^(?:Run this|Do it with|How to run)\b'
  fenced_blocks: true

tooling_note: >-
  Those belong to the source product and do not exist in AI Matrx. Treat those steps as the
  specification for our native version, not as actions you can take here: when a step
  depends on one, say plainly that it is not available yet, and do the judgment work the
  text describes with the tools you actually have.
