# Outside skill pack manifest — reviewed, owner-ordered import (Arman, 2026-09-27:
# "take their skills and put them into our skills library").
# Driven by: uv run python scripts/ingest_skills.py --pack <this file> <clone root>
# Loader + rules: matrx_ai/skills/packs.py. The source's product name is theirs, never ours:
# no skill id or label may contain it (source.product_name makes the loader refuse one).
# Provenance (the repo URL, the banner) still names the source — that is attribution.
#
# When AI Matrx ships a tool that covers one of the source's tools, change its line under
# tool_equivalents and re-run: every affected banner is rebuilt. Never hand-edit a body.

pack_id: every-app-seo-skills
title: "SEO skills and strategy playbooks"
imported_on: "2026-09-27"
visibility: public          # platform-provided library entries every organization can use
skill_type: reference

source:
  repo_url: https://github.com/every-app/open-seo
  commit: 0ffff93
  license: MIT
  authors: ["Ben Senescu"]
  skills_dir: .agents/skills
  product_name: OpenSEO

category:
  slug: seo-imported
  name: "SEO (imported)"
  icon: Search
  position: 71
  description: >-
    Imported outside skills and strategy playbooks for search engine optimization — site
    audits, keyword research and clustering, competitor and market analysis, link
    prospecting, local SEO, project setup, reporting and coaching — written by Ben Senescu
    for his open-source SEO product (MIT). Bodies are verbatim; each carries a provenance
    banner that names which of its tools AI Matrx has today.

# Ids stay the upstream folder names; only the displayed name changes (their H1s carry
# the product name).
