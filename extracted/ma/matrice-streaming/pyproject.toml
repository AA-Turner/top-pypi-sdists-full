[build-system]
requires = [
    "setuptools>=65.0.0",
    "wheel",
    # mypyc lives in the mypy distribution; required when ENABLE_MYPYC=true.
    # Pinned to match the version used by the other mypyc-compiled SDKs.
    "mypy==1.13.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "matrice_streaming"
dynamic = ["version"]
description = "Common server utilities for Matrice.ai services"
readme = "README.md"
authors = [{ name = "Matrice.ai", email = "dipendra@matrice.ai" }]
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = ["matrice", "streaming", "utilities", "mypyc", "compiled"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==6.0.0",
    # Version floors below are pinned to the exact strings allowed by the
    # central matrice-ai/.github APPROVED_DEPS-python.toml (dependency-approval
    # gate matches the literal after the operator). pip/uv still resolve to the
    # newest compatible release at install time, so runtime behaviour is
    # unchanged. `coverage` is provided transitively by pytest-cov and is not
    # declared explicitly (it is absent from the central approved list).
    "pytest-mock>=3.0",
    "pytest-asyncio>=0.21",
    "pytest-timeout>=2.3.1",
    # In-process fakes for the fast test suite (no live Redis/HTTP).
    "fakeredis>=2.20",
    "respx>=0.20",
    "numpy>=1.20.0",
    # Headless OpenCV (cv2) is imported at collection time by the streaming_gateway
    # camera-streamer tests; approved for CI/prod use in APPROVED_DEPS-python.toml.
    "opencv-python-headless>=4.13.0.92",
    # psutil backs the per-process resource sampling in the opencv
    # async_camera_worker (psutil.Process(os.getpid())); floor pinned to the
    # literal approved in APPROVED_DEPS-python.toml.
    "psutil>=7.2.2",
    "ruff==0.11.12",
    "bandit[toml]==1.9.4",
    "mypy==1.13.0",
    "pre-commit==4.2.0",
    "pip-audit==2.7.3",
    "matrice-common",
]

[tool.pytest.ini_options]
# Defensive timeout so a leaked thread/subprocess/asyncio task in a test
# cannot keep the CI runner alive indefinitely. Active config lives in
# pytest.ini; this mirrors it so tooling that reads pyproject sees the same.
timeout = 60
timeout_method = "signal"

[tool.coverage.run]
# Fast-suite coverage is scoped to the pure-Python product package. The
# denominator deliberately excludes hardware/GPU-only decode paths (NVDEC /
# GStreamer / local CUDA decoder), package/typing scaffolding, and the tests
# themselves so the percentage reflects code the mocked suite can actually
# exercise.
source = ["matrice_streaming"]
branch = false
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/__main__.py",
    "*.pyi",
    # Hardware / GPU / GStreamer decode paths — out of the fast-suite scope.
    "*/camera_streamer/nvdec/*",
    "*/local_decoder.py",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B404"]

[tool.mypy]
follow_imports = "skip"
ignore_missing_imports = true
warn_unused_ignores = false
show_error_codes = true
ignore_errors = true
# Auto-generated .pyi stubs contain malformed syntax (docstrings after
# `...` bodies) and are regenerated by stub_generation.py on release.
exclude = ['\.pyi$']

[tool.ruff]
line-length = 120
target-version = "py38"
extend-exclude = ["build", "dist", "*.egg-info", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402", "E731", "E741", "F401", "F403", "F405", "F811", "F821", "F841", "W605"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/**/*.py" = ["F401", "F811", "F841", "E402"]
"**/*.pyi" = ["F401", "F403", "F405", "E501"]

[tool.ruff.format]
line-ending = "lf"
