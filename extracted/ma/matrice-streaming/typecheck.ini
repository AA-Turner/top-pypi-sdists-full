[mypy]
exclude = (?x)(\.pyi$)
# Type-checking configuration for the optional compiled build (see setup.py).
#
# Third-party dependencies are out of scope here: treat unstubbed imports as
# opaque (Any) instead of erroring, since only our own package is checked.
ignore_missing_imports = True

# Pre-3.10-style implicit Optional (`def f(codec: str = None)`) is used widely in
# this package. Without this, mypy 1.13 rejects those defaults and mypyc would
# compile the parameter as a non-optional `str`, raising TypeError when a caller
# passes None. Enabling it makes mypyc infer the (correct) Optional type instead.
implicit_optional = True

# This package predates type checking (the repo's own mypy run sets
# `ignore_errors = true` in pyproject.toml), so the source carries a backlog of
# strictness diagnostics: untyped third-party attributes (`Session.rpc`),
# Optional-narrowing gaps, **kwargs against opaque C-extension APIs, etc. mypyc
# only needs the inferred *types* for codegen; the diagnostics themselves must
# not fail the build, or no module in the package could be compiled at all.
# Compiled behaviour is instead validated empirically: every module is
# import-smoked from the built wheel and the full test suite runs against it.
# NOTE: mypyc aborts the build on *any* mypy message, including notes, so the
# informational `annotation-unchecked` note must be disabled as well.
disable_error_code =
    abstract, annotation-unchecked, arg-type, assignment, attr-defined, call-arg,
    call-overload, dict-item, empty-body, func-returns-value, has-type, import-not-found,
    import-untyped, index, list-item, misc, name-defined, no-any-return, no-redef,
    no-untyped-call, no-untyped-def, operator, override, return, return-value,
    str-bytes-safe, str-format, truthy-function, type-arg, type-var, typeddict-item,
    typeddict-unknown-key, union-attr, unreachable, used-before-def, valid-type, var-annotated

# Sibling matrice_* wheels are installed as pure Python and ship lossy/invalid
# .pyi stubs; following them makes mypy choke (syntax/ABI). Treat opaquely.
[mypy-matrice.*]
follow_imports = skip
follow_imports_for_stubs = True
[mypy-matrice_common.*]
follow_imports = skip
follow_imports_for_stubs = True
[mypy-matrice_compute.*]
follow_imports = skip
follow_imports_for_stubs = True
[mypy-matrice_inference.*]
follow_imports = skip
follow_imports_for_stubs = True
[mypy-matrice_streaming.*]
follow_imports = skip
follow_imports_for_stubs = True
[mypy-matrice_analytics.*]
follow_imports = skip
follow_imports_for_stubs = True

[mypy-matrice_streaming]
ignore_errors = True
