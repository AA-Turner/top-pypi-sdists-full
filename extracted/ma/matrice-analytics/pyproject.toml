[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "S105", "S108", "T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.bandit]
# Vendored third-party tracker submodules (BoT-SORT, deep_sort, OC_SORT) --
# upstream code, not ours to remediate; 251 of the 255 findings bandit
# reports without this exclude live here.
exclude_dirs = ["tests", ".venv", "venv", "build", "dist", "Trackers"]
# B311 added: non-cryptographic random use for display-only incident ids
# (car_damage_detection.py, incident_manager_utils.py, engine/manifest/loader.py's
# retry jitter) -- already reviewed and accepted by each file's own `# noqa: S311`
# comment, which suppresses ruff's bandit-alias rule but not this standalone
# bandit run, which needs `# nosec`/a project-level skip instead.
skips = ["B101", "B105", "B107", "B110", "B112", "B310", "B311", "B404", "B603", "B607", "B608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-v --tb=short --cov=src/matrice_analytics --cov-report=term-missing --cov-report=xml"

[tool.mypy]
# 3.12, matching the CI runner image and the org toolchain pin. It must not be
# lower: the central `mypy-changed` hook passes `--follow-imports=silent`, which
# overrides the `follow_imports = "skip"` below, so mypy *parses* the installed
# numpy stubs. numpy 2.x's `__init__.pyi` uses PEP 695 `type X = ...` statements,
# which are a hard syntax error under any python_version < 3.12 -- mypy then exits
# 2 with "errors prevented further checking" before looking at a single line of
# this repo's code, blocking every commit that touches a .py file.
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = false
follow_imports = "skip"
ignore_missing_imports = true
warn_unused_ignores = false
show_error_codes = true
# `src/` contains an __init__.py, so without these mypy treats it as a package
# root too and resolves every file under BOTH "src.matrice_analytics.*" and
# "matrice_analytics.*" -- which it reports as "Source file found twice under
# different module names" and hard-fails on before checking anything. Pinning the
# package base to src/ gives each file exactly one module name (the installed
# one). `exclude` alone cannot fix this: it filters what is *checked*, not how
# module names are *resolved*.
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
disable_error_code = ["import-untyped", "list-item", "arg-type", "no-redef", "misc", "assignment", "attr-defined", "call-arg", "call-overload", "index", "operator", "return-value", "union-attr", "var-annotated", "name-defined", "no-untyped-def", "no-untyped-call", "annotation-unchecked", "dict-item", "has-type", "override", "return", "str-format", "valid-type", "type-arg", "type-var", "typeddict-item", "typeddict-unknown-key", "used-before-def", "import-not-found", "abstract", "empty-body", "func-returns-value", "has-type", "unreachable"]
exclude = [
    "^src/matrice_analytics/.*\\.pyi$",
    # Benchmark/tooling scripts, not part of the type-checked package surface.
    # Its subfolders (1_vms-frame-extraction, 2_gt-annotations, 3_benchmarking)
    # are digit-prefixed -- not valid Python package names -- which makes mypy
    # hard-fail before analyzing anything else in the tree, blocking every
    # commit regardless of what actually changed.
    "^src/matrice_analytics/extract-gt-bench/",
    # Vendored third-party tracker submodules (BoT-SORT, deep_sort, OC_SORT),
    # not this package's own code. Their upstream folder names contain
    # hyphens -- also not valid Python package names, and the same class of
    # mypy hard-failure as extract-gt-bench above.
    "^src/matrice_analytics/post_processing/Trackers/",
]

[[tool.mypy.overrides]]
module = ["kafka", "kafka.*", "kubernetes", "kubernetes.*", "cv2", "cv2.*", "ultralytics", "ultralytics.*", "sklearn", "sklearn.*", "matrice_common", "matrice_common.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "**/__pycache__/*"]

[tool.coverage.report]
fail_under = 0
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]
