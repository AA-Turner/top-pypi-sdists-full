# Production template; replace placeholders before installing. Never commit secrets.
# The public address must be assigned to a host interface (no NAT mapping here).
listening-port=3478
listening-ip=<turn_public_ip>
relay-ip=<turn_public_ip>
# 400 allocations provide headroom for 50 browsers with separate audio/video peers.
# Admission still requires measured browser/relay capacity, not this range alone.
min-port=49160
max-port=49559
total-quota=400
use-auth-secret
static-auth-secret=<turn_shared_secret>
realm=aimatrx.com
no-cli
no-multicast-peers
no-tcp-relay
# Only turn:3478 UDP/TCP is advertised; turns: requires a separate TLS provision.
no-tls
no-dtls
stale-nonce=600
fingerprint
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
