# coTURN configuration for the Cloud Browser streaming plane (WS-4).
# Authority: contracts/S4-stream-tickets.md §8, PLAN.md §Recommended stack.
#
# This is a TEMPLATE. Values in <angle brackets> are per-deployment and are set
# by the operator / infra manifest, NOT committed. The shared secret lives ONLY
# here and on the gateway (StreamingConfig.turn_shared_secret) — never in a
# ticket, a client bundle, or the worker.

# --- listening -------------------------------------------------------------
listening-port=3478
tls-listening-port=5349
# Bind to the interfaces the gateway/relay reach; never a management interface.
listening-ip=<turn_public_ip>
relay-ip=<turn_relay_ip>
external-ip=<turn_public_ip>

# --- REST API (short-lived credentials) -----------------------------------
# The gateway mints  username = "<unix_expiry>:<stream_session_id>",
#                    credential = base64(HMAC-SHA1(static-auth-secret, username)).
# TTL is 120s (TURN_CREDENTIAL_TTL_SECONDS) — it gates OBTAINING a relay, not
# keeping one. TURN expiry is NOT a revocation surface (S4 §8).
use-auth-secret
static-auth-secret=<turn_shared_secret>
realm=aimatrx.com

# OPEN(turn-rest-hash): classic REST is HMAC-SHA1. If this coTURN build supports
# a stronger digest for the REST mechanism, enable it here AND set
# StreamingConfig.turn_rest_digest to match. WS-4 pins the deployed answer in the
# runbook.

# --- lock it down ----------------------------------------------------------
# Relay only to the media path; never let a client relay to private topology.
no-cli
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
# Re-allow only the specific worker media subnet if relays to it are required:
# allowed-peer-ip=<worker_media_subnet>
no-tcp-relay
stale-nonce=600
fingerprint

# --- TLS (turns:) ----------------------------------------------------------
cert=<tls_cert_pem>
pkey=<tls_key_pem>
cipher-list="DEFAULT@SECLEVEL=2"

# --- do NOT ----------------------------------------------------------------
# no lt-cred-mech with static users; no long-lived credentials; no default
# accounts. The REST short-lived mechanism above is the only auth path.
