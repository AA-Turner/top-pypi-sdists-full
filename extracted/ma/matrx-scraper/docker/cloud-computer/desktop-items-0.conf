# pcmanfm --desktop --profile=cloud-computer: the Cloud Computer desktop.
# A person's own changes land in ~/.config/pcmanfm/cloud-computer/ and win.
[*]
wallpaper_mode=crop
wallpaper_common=1
wallpaper=/usr/local/share/cloud-computer/wallpaper.png
desktop_bg=#0f172a
desktop_fg=#ffffff
desktop_shadow=#000000
desktop_font=Sans 11
show_wm_menu=0
sort=mtime;ascending;
show_documents=0
show_trash=0
show_mounts=0
