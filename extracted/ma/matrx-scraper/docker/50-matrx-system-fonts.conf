<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Exact-render capture (rendered-output standard): pages authored on a Mac or
  Windows ask for -apple-system / Segoe UI / system-ui. A bare container answers
  with DejaVu, which is wider and makes every captured layout wrong. Each platform
  UI family is REWRITTEN (strong prepend, before the stock 60-* defaults) to Inter,
  Roboto behind it; Noto Color Emoji is the emoji fallback for every family.
-->
<fontconfig>
  <match target="pattern"><test qual="any" name="family"><string>-apple-system</string></test><edit name="family" mode="prepend" binding="strong"><string>Inter</string><string>Roboto</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>BlinkMacSystemFont</string></test><edit name="family" mode="prepend" binding="strong"><string>Inter</string><string>Roboto</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>system-ui</string></test><edit name="family" mode="prepend" binding="strong"><string>Inter</string><string>Roboto</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>ui-sans-serif</string></test><edit name="family" mode="prepend" binding="strong"><string>Inter</string><string>Roboto</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>SF Pro Text</string></test><edit name="family" mode="prepend" binding="strong"><string>Inter</string><string>Roboto</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>SF Pro Display</string></test><edit name="family" mode="prepend" binding="strong"><string>Inter</string><string>Roboto</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>Segoe UI</string></test><edit name="family" mode="prepend" binding="strong"><string>Inter</string><string>Roboto</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>Helvetica Neue</string></test><edit name="family" mode="prepend" binding="strong"><string>Inter</string><string>Roboto</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>Helvetica</string></test><edit name="family" mode="prepend" binding="strong"><string>Liberation Sans</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>Arial</string></test><edit name="family" mode="prepend" binding="strong"><string>Liberation Sans</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>Menlo</string></test><edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans Mono</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>SF Mono</string></test><edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans Mono</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>Consolas</string></test><edit name="family" mode="prepend" binding="strong"><string>Liberation Mono</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>ui-monospace</string></test><edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans Mono</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>Apple Color Emoji</string></test><edit name="family" mode="prepend" binding="strong"><string>Noto Color Emoji</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>Segoe UI Emoji</string></test><edit name="family" mode="prepend" binding="strong"><string>Noto Color Emoji</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>emoji</string></test><edit name="family" mode="prepend" binding="strong"><string>Noto Color Emoji</string></edit></match>
  <match target="pattern"><test qual="any" name="family"><string>sans-serif</string></test><edit name="family" mode="prepend" binding="strong"><string>Inter</string><string>Roboto</string><string>Noto Sans</string></edit></match>
  <alias><family>sans-serif</family><prefer><family>Noto Color Emoji</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Noto Serif</family><family>Liberation Serif</family><family>Noto Color Emoji</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>DejaVu Sans Mono</family><family>Noto Color Emoji</family></prefer></alias>
</fontconfig>
