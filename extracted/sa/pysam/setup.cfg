[bdist_wheel]
universal = 0

[tool:pytest]
addopts = -s -v
testpaths = pysam tests

[flake8]
max-line-length = 120
max-complexity = 23
extend-ignore = E124, E128, E203, E221, E272, E701, E741, F405
per-file-ignores = 
	__init__.py:F401,F403
	tests/typechecking_test.py:F821,F841
	tests/*.py:B007,F841

[egg_info]
tag_build = 
tag_date = 0

