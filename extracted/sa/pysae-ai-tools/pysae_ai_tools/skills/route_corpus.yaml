# Routing eval corpus — natural-language phrasing → the skill it should trigger.
#
# Used by `pysae-ai-tools skills route-eval` to measure recall@1 and collisions.
# Grow it freely: add entries for any phrasing that should (or did not) trigger a skill.
# Fields: text (the utterance), expected (skill name), lang (fr|en), register (canonical|casual).

