[project]
name = "pysae-ai-tools"
version = "0.1.1706"
description = "Shared Python tools for Pysae Claude Code skills"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.0",
    "uvicorn>=0.34",
    "httpx>=0.28.1,<0.29",
    "typer>=0.24.1,<0.25",
    "pymongo>=4.16.0,<5",
    "dnspython>=2.7.0,<3",
    "commitizen>=4.0,<5",
    "pyyaml>=6.0,<7",
    "platformdirs>=4.0,<5",
    "tomlkit>=0.13,<0.14",
    "anthropic>=0.85.0,<0.86",
    "desktop-notifier>=6.2.0,<7",
]

[project.urls]
repository = "https://gitlab.com/pysae/tools/ai-tools"

[project.scripts]
pysae-ai-tools = "pysae_ai_tools.__main__:main"

[dependency-groups]
dev = [
    "black>=26.3.1",
    "mypy>=2.0.0",
    "pre-commit>=3.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "freezegun>=1.5.5,<2.0.0",
    "types-pyyaml>=6.0.12.20250915",
    "tach>=0.35",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pysae_ai_tools"]

[tool.hatch.build.targets.sdist]
only-include = [
    "pysae_ai_tools",
    "README.md",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["pysae_ai_tools", "pysae_ai_tools_tests"]

[tool.ruff.lint]
ignore = [
    "C901",
    "DTZ011",
    "B008",  # do not perform function calls in argument defaults
]
select = [
    "B",     # flake8-bugbear
    "C",     # flake8-comprehensions
    "DTZ",   # Timezone
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "UP006", # typing.List/Dict/Set/Tuple → builtin equivalents (PEP 585)
    "UP007", # Optional[X] → X | None, Union[X,Y] → X | Y (PEP 604)
    "UP035", # deprecated typing imports → collections.abc/contextlib (PEP 585)
    "W",     # pycodestyle warnings
]
unfixable = []

# ---------------------------------------------------------------------------
# Black
# ---------------------------------------------------------------------------

[tool.black]
line-length = 120
target-version = ["py311"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------

[tool.mypy]
packages = ["pysae_ai_tools", "pysae_ai_tools_tests"]
python_version = "3.11"
strict = true
implicit_reexport = true
ignore_missing_imports = true
follow_imports = "silent"
plugins = ["pydantic.mypy"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["pysae_ai_tools_tests"]
pythonpath = ["."]
markers = [
    "integration: tests that require external services (Atlas API, Slack, etc.)",
]
