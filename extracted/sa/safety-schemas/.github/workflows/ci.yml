name: CI

on:
    push:
      branches:
        - 'main'
    pull_request:
      types: [opened, synchronize, reopened]
    workflow_dispatch:

env:
    BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:
    test:
        name: Python ${{ matrix.python-version }} on ${{ startsWith(matrix.os, 'macos-') && 'macOS' || startsWith(matrix.os, 'windows-') && 'Windows' || 'Linux' }}
        runs-on: ${{ matrix.os }}
        strategy:
          fail-fast: false
          matrix:
            python-version: [ "3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
            os: [ubuntu-latest, windows-latest, macos-latest]
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v5
              with:
                python-version: ${{ matrix.python-version }}

            - name: Install Hatch
              # On 3.8/3.9, pip resolves the last hatch that still supports them (1.14.x),
              # which is incompatible with virtualenv 21.x (the 21.0 refactor dropped
              # `propose_interpreters`), so `hatch run` fails to build the test env. Pin
              # virtualenv<21 there; 3.10+ get a newer hatch that works with 21.x.
              shell: bash
              run: |
                if [[ "${{ matrix.python-version }}" == "3.8" || "${{ matrix.python-version }}" == "3.9" ]]; then
                  pip install --upgrade hatch "virtualenv<21"
                else
                  pip install --upgrade hatch
                fi

            - name: Run tests
              run: hatch run test:cov
