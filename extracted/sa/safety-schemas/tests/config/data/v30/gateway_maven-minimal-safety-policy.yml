version: '3.0'

installation:
  default-action: allow
  audit-logging:
    enabled: true
  allow:
    packages:
      - ecosystem: maven
        specifications:
          - "commons-io:commons-io@2.8.0"
          - "com.google.guava:guava@33.4.0-jre"
  deny:
    packages:
      warning-on-any-of:
        age-below: "3 months"
        packages:
          - ecosystem: maven
            specifications:
              - "commons-io:commons-io"
      block-on-any-of:
        age-below: "1 month"
        packages:
          - ecosystem: maven
            specifications:
              - "commons-io:commons-io"
    vulnerabilities:
      warning-on-any-of:
        cvss-severity:
          - critical
          - high
      block-on-any-of:
        cvss-severity:
          - critical
