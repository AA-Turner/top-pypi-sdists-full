[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-ai-cli"
version = "1.21.9"
description = "Sage — a local-first AI coding CLI (like Claude Code, using free/open models)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Layne Faler" }]
keywords = ["ai", "cli", "llm", "coding", "local", "gemini", "gguf", "llama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "prompt-toolkit>=3.0.43",
    "tomli>=2.0.0; python_version < '3.11'",
    "websocket-client>=1.6.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
local = ["llama-cpp-python>=0.2.90"]
server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.6",
    "firebase-admin>=6.0.0",
    "google-cloud-firestore>=2.16.0",
    "google-cloud-storage>=2.14.0",
    "pyjwt>=2.8.0",
    "requests>=2.31.0",
]
# Carrier-free WebRTC voice with DTMF. Separate from `server` because
# backend/routes_voice.py works without it (browser-to-browser signalling only
# needs the WebSocket); backend/services/webrtc_call.py, which makes this
# process a real peer on the call, does not.
voice = [
    "aiortc>=1.9.0,<2.0.0",
    "av>=12.0.0,<13.0.0",
]
all = [
    "llama-cpp-python>=0.2.90",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.6",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.3.0",
    "pytest-xdist>=3.5.0",
    "respx>=0.21.0",
    "anyio>=4.0",
]

[project.scripts]
sage = "sage.main:app"
sage-cli = "sage.main:app"

[project.urls]
"Homepage" = "https://sageworksai.com"
"Repository" = "https://github.com/laynef/claude-ai-clone"

[tool.setuptools]
packages = { find = { where = ["."], include = ["sage", "sage.*"], exclude = ["tests*", "frontend*", "backend*", "node_modules*", "venv*", "deploy*", "docs*", "scripts*", "core*", "config*", "data*", "assets*", "models*", "model_servers*", "integrations*", "prompts*", "shared*", "secrets*", "scratch*", "debug_tmp*", "htmlcov*", "omniprobe-ui*", "pygame-sage*", "Python*", "a*", "sage_ai_cli*"] } }

[tool.setuptools.package-data]
"*" = ["*.json", "*.md", "*.txt", "*.yaml", "*.yml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["sage/tests", "backend/tests"]
pythonpath = ["."]
python_files = "test_*.py"
addopts = "--timeout=1800"
markers = [
    # NOTE: none of these are deselected by default. addopts below contains no
    # -m filter, so every marked test RUNS unless a filter is passed explicitly.
    # The previous description of `integration` claimed it was "deselected by
    # default", which was simply untrue and would have led someone to believe
    # cloud-calling tests were being skipped when they were not.
    "integration: slow tests that call real cloud APIs (runs by default; use -m 'not integration' to exclude)",
    "smoke: quick smoke tests",
    "cloud: tests requiring cloud model endpoints",
    "ollama: tests requiring a local Ollama instance",
    "slow: tests that take a long time to run",
    # `functional` was used by backend/tests/functional/* but never registered,
    # which produced PytestUnknownMarkWarning on every run. An unregistered mark
    # is a quiet trap: `-m functinoal` (typo) selects nothing and reports success.
    "functional: end-to-end tests against real local services (Firestore/Auth emulator, Redis)",
    # Opts a test out of backend/tests/conftest.py's autouse fake-Firestore
    # patching, so the database-unavailable code path can actually be reached.
    "no_fake_db: do not patch _get_db to the in-memory Firestore double",
    "real_firestore: needs a real (emulated) Firestore; refuses to run unless FIRESTORE_EMULATOR_HOST is set",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
omit = ["sage/games/tests/*"]

