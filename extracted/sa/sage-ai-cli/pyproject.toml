[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-ai-cli"
version = "1.20.94"
description = "Sage — a local-first AI coding CLI (like Claude Code, using free/open models)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Layne Faler" }]
keywords = ["ai", "cli", "llm", "coding", "local", "gemini", "gguf", "llama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "prompt-toolkit>=3.0.43",
    "tomli>=2.0.0; python_version < '3.11'",
    "websocket-client>=1.6.0",
]

[project.optional-dependencies]
local = ["llama-cpp-python>=0.2.90"]
server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.6",
    "firebase-admin>=6.0.0",
    "google-cloud-firestore>=2.16.0",
]
all = [
    "llama-cpp-python>=0.2.90",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.6",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.3.0",
    "pytest-xdist>=3.5.0",
    "respx>=0.21.0",
    "anyio>=4.0",
]

[project.scripts]
sage = "sage.main:app"
sage-cli = "sage.main:app"

[project.urls]
"Homepage" = "https://sageworksai.com"
"Repository" = "https://github.com/laynef/claude-ai-clone"

[tool.setuptools]
packages = { find = { include = ["sage*"], exclude = ["tests*"] } }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["sage/tests", "backend/tests"]
pythonpath = ["."]
python_files = "test_*.py"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
