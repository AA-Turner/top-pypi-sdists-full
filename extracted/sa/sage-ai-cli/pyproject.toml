[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-ai-cli"
version = "1.18.18"
description = "Sage — a local-first AI coding CLI (like Claude Code, using free/open models)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Layne Faler" }]
keywords = ["ai", "cli", "llm", "coding", "local", "gemini", "gguf", "llama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "prompt-toolkit>=3.0.43",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
local = ["llama-cpp-python>=0.2.90"]
server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.6",
    "firebase-admin>=6.0.0",
    "google-cloud-firestore>=2.16.0",
]
all = [
    "llama-cpp-python>=0.2.90",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.6",
]
dev = [
    # Testing
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.5",
    "pytest-timeout>=2.2",
    "pytest-benchmark>=4.0",
    "httpx>=0.27.0",
    "respx>=0.20",
    # Type checking
    "mypy>=1.8",
    "types-requests>=2.31",
    "types-PyYAML>=6.0",
    # Linting & formatting
    "ruff>=0.3.0",
    "black>=24.0",
    "isort>=5.13",
    # Security
    "bandit>=1.7",
    "pip-audit>=2.7",
    "safety>=3.0",
    # Pre-commit
    "pre-commit>=3.6",
    # Documentation
    "pydocstyle>=6.3",
]

[project.scripts]
sage = "sage.main:app"

[project.urls]
Repository = "https://github.com/laynef/claude-ai-clone"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["sage", "sage.*", "backend", "backend.*"]
exclude = ["tests", "tests.*"]

[tool.setuptools.data-files]
# Install sage.bat to sys.prefix (the Python root, e.g. C:\Python312\).
# That directory IS already in PATH on every Windows Python install.
# sage.bat calls `py -m sage` — py.exe is in C:\Windows\ so always works.
# On macOS/Linux the file is harmless and the 'sage' console_script takes over.
"" = ["sage.bat"]

[tool.pytest.ini_options]
testpaths = ["tests", "sage/tests"]
addopts = [
    # Stale tests: imports no longer match implementation (see git history to restore).
    "--ignore=tests/sage/test_self_improvement.py",
    "--ignore=sage/tests/test_code_modification_comprehensive.py",
    "--ignore=sage/tests/test_reasoning_engine_comprehensive.py",
    "--ignore=sage/tests/test_self_improvement_comprehensive.py",
    "--cov=sage",
    "--cov=backend",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    # TDD Enforcement: 100% coverage required for new code
    # Use --cov-fail-under=59 for CI, --cov-fail-under=100 for TDD mode
    "--cov-fail-under=59",
    "-v",
    "--tb=short",
]
asyncio_mode = "auto"
timeout = 300
markers = [
    "smoke: critical path tests run on every commit",
    "unit: isolated unit tests (default CI)",
    "integration: tests requiring external services",
    "slow: long-running tests (excluded from default CI)",
    "security: security-related tests",
    "roadmap: TDD roadmap validation tests (opt-in)",
    "benchmark: performance benchmark tests",
    "tdd: TDD-mode tests (requires 100% coverage)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ============================================================================
# P0-2: Ruff Configuration (Linting)
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    "htmlcov",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate (commented-out code)
    "PL",   # Pylint
    "PERF", # Perflint
    "RUF",  # Ruff-specific rules
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print
    "LOG",  # flake8-logging
]
ignore = [
    "E501",    # line too long (handled by black)
    "PLR0911", # too many return statements
    "PLR0913", # too many arguments
    "PLR2004", # magic value comparison
    "PERF401", # use list comprehension (stylistic preference)
    "SIM102",  # combine if statements (readability preference)
    "S101",    # assert used (ok in tests)
    "S603",    # subprocess call (we have safety checks)
    "S607",    # partial executable path
    "T201",    # print found (we use print intentionally)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG", "PLR2004"]
"sage/tests/**/*.py" = ["S101", "ARG", "PLR2004"]
# DevOps modules are stubs - unused args expected
"sage/devops/**/*.py" = ["ARG002", "TCH003"]

[tool.ruff.lint.isort]
known-first-party = ["sage", "backend"]
force-single-line = false
combine-as-imports = true

# ============================================================================
# P0-2: Black Configuration (Formatting)
# ============================================================================
[tool.black]
line-length = 100
target-version = ["py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | __pycache__
  | build
  | dist
  | \.egg-info
  | htmlcov
)/
'''

# ============================================================================
# P0-3: MyPy Configuration (Type Checking)
# ============================================================================
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
extra_checks = true
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
no_implicit_optional = true
show_error_codes = true
show_column_numbers = true
pretty = true
exclude = ["build/", "dist/", ".venv/", "htmlcov/"]

[[tool.mypy.overrides]]
module = ["llama_cpp.*", "transformers.*", "vllm.*", "onnxruntime.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sage.devops.*"]
# DevOps stubs - be lenient with type checking
warn_return_any = false
disallow_untyped_defs = false

# ============================================================================
# P0-7: Bandit Configuration (Security Scanning)
# ============================================================================
[tool.bandit]
exclude_dirs = ["tests", "sage/tests", ".venv", "build"]
skips = ["B101", "B603", "B607"]                         # assert, subprocess, partial path
targets = ["sage", "backend"]

# ============================================================================
# Additional Tool Configurations
# ============================================================================
[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["sage", "backend"]
skip_gitignore = true

[tool.coverage.run]
branch = true
source = ["sage", "backend"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/conftest.py",
    "sage/plugins/import_legacy_plugins.py",
    # Optional local/embedded runtime backends (not exercised in default test env)
    "backend/runtimes/*.py",
    # REPL entrypoint: enormous surface; covered indirectly via sage modules
    "sage/main.py",
    # WebSocket terminal path (not exercised in default pytest env)
    "backend/terminal_ws.py",
    # Large static language tables / optional codegen (covered by spot checks)
    "sage/core/languages.py",
    "sage/codegen.py",
    # Dependency graph / resolver helpers (optional tooling path)
    "sage/core/dependencies.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"

[tool.pydocstyle]
convention = "google"
match = "(?!test_).*\\.py"
match_dir = "^(?!tests).*"
