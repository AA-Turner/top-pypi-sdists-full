- domain: file
  command: create
  description: "Create any file with any extension and optional content"
  flags:
    - name: --extension
      values:
        valid: [".txt", ".py", ".js", ".pdf", ".docx", ".png", ".mp4", ".go", ".rs", ".java", ".md", ".json", ".xml", ".yaml", ".ini", ".csv", ".svg", ".webp", ".mp3", ".wav", ".exe", ".apk", ".ipa", ".unity", ".blend", ".obj", ".fbx", ".c", ".h", ".cpp", ".hpp", ".cs", ".swift", ".kt", ".rb", ".php", ".pl", ".sql", ".lua", ".r", ".sh", ".bat", ".ps1", ".lock", ".log", ".tmp", ".bak", ".old"]
    - name: --content
      values:
        valid: ["Hello World", "def foo(): pass", "", "<html><body>test</body></html>", "01010101", "こんにちは", "{\"key\": \"value\"}", "Multiple\nlines\nof\ncontent"]
  success_criteria:
    exists: true
    extension_match: true

- domain: asset
  command: generate
  description: "Generate image / video / audio / document assets"
  flags:
    - name: --type
      values:
        valid: ["image", "video", "audio", "document", "animation", "3d_model", "music_video", "diagram", "chart", "map"]
    - name: --format
      values:
        valid: ["png", "jpg", "mp4", "mp3", "pdf", "gif", "wav", "flac", "svg", "webp", "ico", "bmp", "tiff", "mov", "avi", "webm"]
  success_criteria:
    exists: true
    extension_match: true

- domain: web
  command: build
  description: "Full responsive website (HTML/CSS/JS)"
  flags:
    - name: --type
      values:
        valid: ["portfolio", "dashboard", "landing_page", "e-commerce", "blog", "social_network", "forum", "wiki", "docs", "gallery"]
    - name: --theme
      values:
        valid: ["minimal", "dark", "colorful", "corporate", "retro", "neon", "pastel", "brutalist", "glassmorphism", "material"]
  success_criteria:
    exists: true
    valid_html: true

- domain: backend
  command: build
  description: "REST API + DB (Postgres, Mongo, etc.)"
  flags:
    - name: --db
      values:
        valid: ["postgres", "mongo", "sqlite", "mysql", "redis", "cassandra"]
    - name: --framework
      values:
        valid: ["fastapi", "express", "django", "spring", "gin", "actix"]
  success_criteria:
    exists: true
    type: "code"

- domain: programming
  command: write
  description: "Code in any language (Python, Go, Rust, Java, etc.)"
  flags:
    - name: --lang
      values:
        valid: ["python", "go", "rust", "java", "javascript", "typescript", "c++", "c#", "swift", "kotlin", "ruby", "php", "perl", "dart", "scala", "elixir", "haskell", "clojure", "r", "lua", "fortran", "cobol", "pascal", "ada", "lisp"]
    - name: --task
      values:
        valid: ["http-server", "cli-tool", "data-parser", "web-scraper", "game-loop", "jwt-auth", "binary-search", "fibonacci", "rest-api", "websocket-client", "sorting-algorithm", "encryption-tool", "file-watcher", "cron-job", "unit-test"]
  success_criteria:
    exists: true
    type: "code"
    compiles: true

- domain: mobile
  command: build
  description: "Cross-platform mobile app"
  flags:
    - name: --framework
      values:
        valid: ["react-native", "flutter", "swift", "kotlin", "ionic", "xamarin", "maui", "unity"]
    - name: --type
      values:
        valid: ["fitness-tracker", "todo-app", "social-media", "expense-tracker", "weather-app", "news-reader", "calculator", "notes"]
  success_criteria:
    exists: true

- domain: game
  command: create
  description: "Video game"
  flags:
    - name: --engine
      values:
        valid: ["unity", "godot", "unreal", "pygame", "phaser", "love2d", "raylib", "cryengine"]
    - name: --genre
      values:
        valid: ["platformer", "rpg", "fps", "puzzle", "racing", "adventure", "simulation", "strategy"]
  success_criteria:
    exists: true
