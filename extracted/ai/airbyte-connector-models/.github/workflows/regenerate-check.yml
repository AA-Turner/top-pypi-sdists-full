name: Regenerate Schemas Check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  regenerate-zero-diff:
    name: Regenerate produces zero diff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm dependencies
        run: npm ci

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: uv sync --all-extras

      - name: Regenerate all artifacts (canonical pipeline)
        run: uv run poe regenerate-all

      - name: Assert no uncommitted changes
        run: |
          STATUS=$(git status --porcelain)
          if [ -n "$STATUS" ]; then
            echo "::error::Regeneration produced uncommitted changes (modified or untracked files)."
            echo "$STATUS"
            echo "Run the following locally and commit the result:"
            echo "  uv run poe regenerate-all"
            git diff
            exit 1
          fi
