---
"$schema": http://json-schema.org/draft-07/schema#
"$id": https://github.com/airbytehq/airbyte-connector-models/src/metadata/v0/SmokeTestScenario.yaml
title: SmokeTestScenario
description: A single smoke test scenario configuration for a connector.
type: object
required:
  - name
additionalProperties: false
properties:
  name:
    description: "Name of the test scenario (e.g., 'default', 'invalid_config', 'oauth_config')"
    type: string
  configFile:
    description: "Relative path to the config file to use for this scenario"
    type: string
  configSettings:
    description: |
      Optional dictionary of config settings to override or supplement configFile settings.

      String values may contain interpolation placeholders, resolved by the
      connector test runner before the config is written to disk:

      - `${secret-ref:<item>/<section>/<field>}` — a provider-agnostic
        credential reference. All three segments are required. The runner
        reads provider and vault from `AIRBYTE_TEST_CREDS_PROVIDER` (only
        `1pass` is supported today) and `AIRBYTE_TEST_CREDS_1PASS_VAULT_NAME`,
        so metadata stays portable across forks. These env vars are only
        required when a `${secret-ref:...}` placeholder is actually present.
      - `${relative-date:-P<duration>}` — a date relative to today at 00:00:00 UTC,
        expressed as a negative ISO 8601 duration (e.g. `-P30D`, `-P1Y`, `-P1Y6M`).
        Renders as a full RFC 3339 timestamp with `Z` (e.g. `2025-01-01T00:00:00Z`)
        for `start_date` fields that reject date-only values.

      Literal strings that do not match a placeholder are passed through unchanged.
    type: object
    additionalProperties: true
  expectFailure:
    description: "Whether the scenario is expected to fail"
    type: boolean
    default: false
  onlyStreams:
    description: "List of stream names to include in the scenario (if specified, only these streams will be tested)"
    type: array
    items:
      type: string
  excludeStreams:
    description: "List of stream names to exclude from the scenario"
    type: array
    items:
      type: string
  suggestedStreamsOnly:
    description: "Whether to limit testing to the connector's suggested streams list (from data.suggestedStreams)"
    type: boolean
    default: false
  configuredCatalogPath:
    description: "Path to a pre-configured catalog file for the scenario"
    type: string
