---
"$schema": http://json-schema.org/draft-07/schema#
# yamllint disable-line rule:line-length
"$id": https://github.com/airbytehq/airbyte/airbyte-ci/connectors/metadata_service/lib/metadata_service/models/src/ConnectorReleases.yaml
title: ConnectorReleases
description: Contains information about different types of releases for a connector.
type: object
additionalProperties: false
properties:
  rolloutConfiguration:
    $ref: RolloutConfiguration.yaml
  breakingChanges:
    $ref: ConnectorBreakingChanges.yaml
  unsafeDowngrades:
    $ref: "#/definitions/UnsafeDowngrades"
  migrationDocumentationUrl:
    # yamllint disable-line rule:line-length
    description: URL to documentation on how to migrate from the previous version to the current version. Defaults to ${documentationUrl}-migrations
    type: string
    format: uri
definitions:
  UnsafeDowngrades:
    description: >-
      Map of connector versions that are unsafe to downgrade past. Each
      entry contains a message explaining why downgrading past that
      version is unsafe. This can be declared directly by connector
      authors, or compiled from breakingChanges entries where
      safeToDowngrade is false.
    type: object
    additionalProperties: false
    patternProperties:
      "^\\d+\\.\\d+\\.\\d+$":
        $ref: "#/definitions/UnsafeDowngradeEntry"
  UnsafeDowngradeEntry:
    description: Information about why downgrading past a specific version is unsafe.
    type: object
    additionalProperties: false
    required:
      - message
    properties:
      message:
        description: Explanation of why downgrading past this version is unsafe.
        type: string
