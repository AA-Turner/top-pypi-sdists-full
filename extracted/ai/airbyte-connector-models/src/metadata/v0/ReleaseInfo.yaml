---
"$schema": http://json-schema.org/draft-07/schema#
"$id": https://github.com/airbytehq/airbyte-connector-models/src/metadata/v0/ReleaseInfo.yaml
title: ReleaseInfo
description: >-
  Attribution for the pull request and author that released this connector
  version. DO NOT DEFINE THIS FIELD MANUALLY. It will be overwritten by the CI.
type: object
additionalProperties: false
required:
  - source
properties:
  pr_number:
    type: [integer, "null"]
    description: The number of the pull request that released this version.
  pr_url:
    type: [string, "null"]
    description: The URL of the pull request that released this version.
  pr_author_id:
    type: [integer, "null"]
    description: The GitHub account ID of the pull request author.
  pr_author_login:
    type: [string, "null"]
    description: The GitHub login of the pull request author.
  pr_author_type:
    oneOf:
      - type: string
        enum:
          - User
          - Bot
          - Unknown
      - type: "null"
    description: >-
      Whether the pull request author is a human user, a bot, or unknown, as
      reported by GitHub. This is raw author metadata, not an ownership verdict:
      read attributed_to_kind to learn who is accountable for the release. Unknown
      means that the author could not be determined.
  pr_author_association:
    type: [string, "null"]
    description: >-
      The GitHub author association of the pull request author, such as MEMBER,
      OWNER, COLLABORATOR, or CONTRIBUTOR. MEMBER, OWNER, and COLLABORATOR
      identify an Airbyte maintainer; CONTRIBUTOR identifies a community author
      who is not accountable for the release.
  pr_merged_by_login:
    type: [string, "null"]
    description: >-
      The GitHub login of the account that merged the releasing pull request.
      Null for prereleases, which are published from an unmerged branch.
  pr_merged_by_type:
    oneOf:
      - type: string
        enum:
          - User
          - Bot
          - Unknown
      - type: "null"
    description: >-
      Whether the account that merged the pull request is a human user, a bot, or
      unknown, as reported by GitHub. A human merger is a maintainer by
      construction, since merging into airbytehq/airbyte requires write access.
  attributed_to:
    type: [string, "null"]
    description: >-
      The identity accountable for this release, which may differ from the pull
      request author. Never a community contributor: a community-authored release
      is attributed to the maintainer who merged it, or to nobody. Null whenever
      attributed_to_kind is `other`, and non-null for `maintainer` and `bot` --
      `other` is precisely the case where no identity may be named, so the two
      fields always agree.
  attributed_to_kind:
    oneOf:
      - type: string
        enum:
          - maintainer
          - bot
          - other
      - type: "null"
    description: >-
      What kind of identity attributed_to holds, and the field to route
      escalations on. `maintainer` is a human with write access to
      airbytehq/airbyte and is the only kind that may be contacted as the owner
      of the release. `bot` names an automated account for the record but must
      never be contacted. `other` covers community-authored and unattributable
      releases, which have no named owner and belong to the oncall rotation, and
      always carries a null attributed_to.
  merge_commit_sha:
    type: [string, "null"]
    description: >-
      The sha of the commit that merged the releasing pull request. Null for
      prereleases, which are published from an unmerged branch.
  merged_at:
    type: [string, "null"]
    format: date-time
    description: >-
      The timestamp at which the releasing pull request was merged. Null for
      prereleases, which are published from an unmerged branch.
  released_at:
    type: [string, "null"]
    format: date-time
    description: The best available timestamp for when this version was released.
  source:
    type: string
    description: How the attribution was determined.
    enum:
      - publish
      - git-backfill
      - prerelease
      - changelog
