[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

# NOTE: no [project] table on purpose — setup.py owns all build metadata
# (name, version, deps, extras_require) for PyPI publishing. Adding [project]
# here triggers setuptools' PEP 621 merge path and conflicts with setup.py.
# uv will emit a "No requires-python" warning and default to >=3.11; that's
# fine for local dev (pytest 9 supports 3.10+ anyway). CI's python-lint and
# typecheck jobs pin Python explicitly via setup-python.

# uv layered on top of setup.py: setup.py owns the build + integration extras
# (PyPI release path); uv handles the dev workflow + lockfile. See
# docs/python-standards.md.
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov",
    "ruff>=0.16.3",
    "mypy>=1.10.0",
    "pre-commit>=4.6.2",
    # Autonomous v2 build/lint tooling — ADR 0001
    "grpcio-tools>=1.83.0",
    "import-linter>=2.13",
]

[tool.uv]
package = false  # build is owned by setup.py; uv must not try to build the project

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "e2e: end-to-end tests (require real API)",
    "performance: performance benchmark tests",
    "slow: slow running tests",
    "integration: integration tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["sdk/aigie"]
branch = true
omit = [
    "sdk/aigie/__init__.py",
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# Ruff config lives in ruff.toml at the repo root (shared with kytte-platfrom).
[tool.ruff]
extend = "ruff.toml"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# Legacy monolith pre-dating the changed-files mypy gate — 60+ pre-existing
# violations. Touched here only to wire the V2 ingest dispatcher; full
# cleanup is a separate ticket.
[[tool.mypy.overrides]]
module = "aigie.client"
ignore_errors = true

# Pre-existing arg-type violations on Optional[str] → int/float in env-var
# defaults. Removal/replacement is its own ticket.
[[tool.mypy.overrides]]
module = "aigie.config"
ignore_errors = true

# Import-linter: the framework-adapter substrate must never import the
# concrete framework integrations.
[tool.importlinter]
root_package = "aigie"

[[tool.importlinter.contracts]]
name = "substrate never imports concrete integrations"
type = "forbidden"
source_modules = ["aigie.integrations._base"]
forbidden_modules = [
    "aigie.integrations.langchain",
    "aigie.integrations.langgraph",
    "aigie.integrations.claude_agent_sdk",
    "aigie.integrations.install",
    "aigie.integrations.registry",
]
