name: agent-chat-internal
runtime:
  name: python
  options:
    virtualenv: venv
description: |
  Pulumi Infrastructure as Code for the Airbyte AG-UI chat services.

  This project manages:
  - The agui-server runtime service account (images, publisher identity, and secret IAM are bootstrap-owned)
  - Cloud Run services for agui-server and agui-playground
  - External HTTPS load balancer with managed certificate and IAP
  - DNS A records for chat.internal.airbyte.ai and preview.chat.internal.airbyte.ai in the internal.airbyte.ai Cloud DNS zone

config:
  gcp:project:
    description: GCP project ID for the AG-UI chat runtime infrastructure
    value: internal-airbyte-ai-infra
  gcp:region:
    description: GCP region
    value: us-west3
