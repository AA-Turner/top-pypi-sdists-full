# Production stack configuration for the Airbyte AG-UI chat services.
#
# Runtime project: internal-airbyte-ai-infra
# Runtime region: us-west3
# DNS zone project: airbyte-intranet
# DNS zone: internal-airbyte-ai
config:
  gcp:project: internal-airbyte-ai-infra
  gcp:region: us-west3
  agent-chat-internal:domain: chat.internal.airbyte.ai
  agent-chat-internal:dns-zone-project: airbyte-intranet
  agent-chat-internal:dns-zone-name: internal-airbyte-ai
  # Required. `apply` fails until an immutable tag is pinned after bootstrap
  # (see BOOTSTRAP.md). `latest` tracks the newest stable GitHub release;
  # prod should pin an immutable `<version>` or `main-<sha>` tag.
  agent-chat-internal:server-image-tag: "main-ed119b6"
  agent-chat-internal:playground-image-tag: "main-7f22187"
  agent-chat-internal:mcp-url: https://mcp.internal.airbyte.ai/ops-mcp
  agent-chat-internal:agent-model: ""
  agent-chat-internal:chat-enabled: "true"
  agent-chat-internal:mcp-ui: "true"
  # Expected IAP JWT audience for the agui-server backend; copy the
  # `server_iap_audience` stack output here after the first apply.
  agent-chat-internal:server-iap-audience: ""
  agent-chat-internal:min-instances: "0"
  agent-chat-internal:max-instances: "5"
  # Secret container IDs (pre-existing; empty = env var omitted).
  agent-chat-internal:anthropic-secret-id: ""
  agent-chat-internal:mcp-client-id-secret-id: ""
  agent-chat-internal:mcp-client-secret-id: ""
  agent-chat-internal:oauth-secret-id: ops-webapp-oauth-client-secret
  agent-chat-internal:logfire-secret-id: ""
