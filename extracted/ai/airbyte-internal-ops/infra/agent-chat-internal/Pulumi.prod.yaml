# Production stack configuration for the Airbyte AG-UI chat services.
#
# Runtime project: internal-airbyte-ai-infra
# Runtime region: us-west3
# DNS zone project: airbyte-intranet
# DNS zone: internal-airbyte-ai
config:
  gcp:project: internal-airbyte-ai-infra
  gcp:region: us-west3
  agent-chat-internal:domain: chat.internal.airbyte.ai
  agent-chat-internal:dns-zone-project: airbyte-intranet
  agent-chat-internal:dns-zone-name: internal-airbyte-ai
  # Required. `apply` fails until an immutable tag is pinned after bootstrap
  # (see BOOTSTRAP.md). `latest` tracks the newest stable GitHub release;
  # prod should pin an immutable `<version>` or `main-<sha>` tag.
  agent-chat-internal:server-image-tag: "main-607c26d"
  agent-chat-internal:playground-image-tag: "main-3d11889"
  agent-chat-internal:mcp-url: https://mcp.internal.airbyte.ai/ops-mcp
  agent-chat-internal:agent-model: claude-sonnet-4-5
  agent-chat-internal:chat-enabled: "true"
  agent-chat-internal:mcp-ui: "true"
  # URL path prefix when mounted under the Ops Webapp host
  # (`ops.internal.airbyte.ai/chat`). Empty = standalone host only.
  agent-chat-internal:path-prefix: chat
  # `user_session` forwards the caller's Ops Webapp session token to MCP
  # servers; `bearer` uses the shared service-client credentials.
  agent-chat-internal:mcp-auth-mode: user_session
  # Expected IAP JWT audience for the agui-server backend; set from
  # `gcloud compute backend-services describe agui-server-backend --global` after
  # the first apply (BOOTSTRAP.md step 7).
  agent-chat-internal:server-iap-audience: /projects/351139268520/global/backendServices/8466316661624362398
  # Same for the `agui-server-preview` backend; set from
  # `gcloud compute backend-services describe agui-server-preview-backend
  # --global` after the first apply (BOOTSTRAP.md step 7).
  agent-chat-internal:preview-server-iap-audience: /projects/351139268520/global/backendServices/5096825134700190392
  agent-chat-internal:min-instances: "1"
  agent-chat-internal:max-instances: "5"
  # Anthropic-compatible endpoint (empty = api.anthropic.com); `preview-*`
  # overrides apply to agui-server-preview only (unset = same as prod).
  agent-chat-internal:anthropic-base-url: ""
  agent-chat-internal:preview-anthropic-base-url: https://app.airmux.ai/inf
  # Airmux requires provider-prefixed, dated model IDs (see GET /inf/v1/models).
  agent-chat-internal:preview-agent-model: anthropic/claude-sonnet-4-5-20250929
  # Secret container IDs (pre-existing; empty = env var omitted).
  agent-chat-internal:anthropic-secret-id: agui-server-anthropic-api-key
  agent-chat-internal:preview-anthropic-secret-id: agui-server-preview-airmux-api-key
  agent-chat-internal:mcp-client-id-secret-id: ""
  agent-chat-internal:mcp-client-secret-id: ""
  agent-chat-internal:oauth-secret-id: ops-webapp-oauth-client-secret
  agent-chat-internal:logfire-secret-id: ""
