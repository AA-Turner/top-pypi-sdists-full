# Production configuration for the Airmux control plane stack.
config:
  gcp:project: internal-airbyte-ai-infra
  gcp:region: us-west3
  airmux-control-plane:console-domain: airmux.internal.airbyte.ai
  airmux-control-plane:gateway-domain: airmux-cp.internal.airbyte.ai
  airmux-control-plane:preview-console-domain: preview.airmux.internal.airbyte.ai
  airmux-control-plane:preview-gateway-domain: airmux-cp-preview.internal.airbyte.ai
  airmux-control-plane:dns-zone-project: airbyte-intranet
  airmux-control-plane:dns-zone-name: internal-airbyte-ai
  # Image tag is read from AIRMUX_VERSION (repo file), not stack config.
  airmux-control-plane:psc-consumer-projects:
    - airbyte-agent-plane-dev
  # All secrets are Pulumi-owned (generated values); these keys only name the
  # secret ids. `airmux-config` is shared by both variants (fully env-driven).
  airmux-control-plane:config-secret-id: airmux-config
  airmux-control-plane:database-url-secret-id: airmux-database-url
  airmux-control-plane:management-key-secret-id: airmux-dataplane-management-key
  airmux-control-plane:preview-database-url-secret-id: airmux-preview-database-url
  airmux-control-plane:preview-management-key-secret-id: airmux-preview-dataplane-management-key
  # Provider vendor keys, sourced cross-project from the agent-plane project
  # (its stack must grant secretAccessor to the airmux runtime SAs; BOOTSTRAP §5).
  # Cloud Run resolves cross-project secrets by project number only
  # (84854744111 = airbyte-agent-plane-dev).
  airmux-control-plane:provider-key-secrets:
    OPENAI_API_KEY: projects/84854744111/secrets/agent-plane-default-openai-api-key
    ANTHROPIC_API_KEY: projects/84854744111/secrets/agent-plane-default-anthropic-api-key
  # Optional: cross-project handoff of the prod management key into the
  # agent-plane project (requires secretVersionAdder there; see BOOTSTRAP §7).
  # airmux-control-plane:agent-plane-management-key-secret: projects/airbyte-agent-plane-dev/secrets/agent-plane-default-airmux-management-key
