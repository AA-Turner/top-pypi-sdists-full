# Word lists for deterministic friendly-name generation.
#
# These lists pair steadfast adjectives with heroic, noble, or professional
# nouns, producing names that stay dignified in serious contexts such as
# incidents and customer escalations: "Resolute Sentinel", "Iron Paladin".
#
# Keep both lists free of childish, gross, or villainous words, and free of
# whimsical color/material/tech flavor words. A name here is attached to an
# agent working real incidents, so it must not undercut the seriousness of the
# work.
#
# Note on YAML: quote any word the YAML 1.1 spec reads as a boolean
# ("true", "yes", "no", "on", "off"), or it loads as a bool instead of a string.

