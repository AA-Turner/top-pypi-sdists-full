[tool:pytest]
# Pytest configuration
# https://docs.pytest.org/en/latest/reference/reference.html#ini-options-ref

minversion = 7.0
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --cov=airbyte_ops_mcp
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=80
testpaths = tests
norecursedirs = 
    .git
    .venv
    __pycache__
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    gcs_integration: allows the narrowly scoped dev-bucket GCS integration test
    unit: marks tests as unit tests
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:airbyte\.cloud.*
    ignore::DeprecationWarning:airbyte\.sources.*
    ignore::DeprecationWarning:airbyte\.secrets.*
    ignore::DeprecationWarning:pyasn1.*
    ignore::DeprecationWarning:crypt:
