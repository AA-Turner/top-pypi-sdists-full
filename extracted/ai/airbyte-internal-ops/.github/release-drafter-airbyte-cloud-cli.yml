name-template: airbyte-cloud-cli v$RESOLVED_VERSION
tag-template: airbyte-cloud-cli/v$RESOLVED_VERSION
tag-prefix: airbyte-cloud-cli/v
latest: 'false'
change-template: '* $SCOPE$TITLE ($URL) $SHA'
scope-template: '$SCOPE: '
template: |
  $CHANGES

  ---

  _See also: [Full Release Notes ($RESOLVED_MAJOR_TAG.x family)](https://github.com/$OWNER/$REPOSITORY/releases?q=tag:$RESOLVED_MAJOR_TAG) | [Full Changelog ($PREVIOUS_TAG...$RESOLVED_TAG)](https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...$RESOLVED_TAG)_
include-paths:
  - airbyte-cloud-cli
  - pyproject.toml
  - uv.lock
  - .github/release-drafter-airbyte-cloud-cli.yml
  - .github/workflows/release-drafter.yml
categories:
  - title: '🚀 New Capabilities'
    commit-types:
      - feat
  - title: '🐛 Bug Fixes'
    commit-types:
      - fix
  - title: '⚙️ Under the Hood'
    commit-types:
      - chore
      - ci
      - build
      - refactor
      - test
      - perf
      - docs
    collapse-after: 3
