name-template: airbyte-internal-ops v$RESOLVED_VERSION
tag-template: v$RESOLVED_VERSION
tag-prefix: v
change-template: '* $SCOPE$TITLE ($URL) $SHA'
scope-template: '$SCOPE: '
template: |
  $CHANGES

  ---

  _See also: [Full Release Notes ($RESOLVED_MAJOR_TAG.x family)](https://github.com/$OWNER/$REPOSITORY/releases?q=tag:$RESOLVED_MAJOR_TAG) | [Full Changelog ($PREVIOUS_TAG...$RESOLVED_TAG)](https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...$RESOLVED_TAG)_
include-paths:
  - src
  - tests
  - pyproject.toml
  - uv.lock
  - .github/release-drafter-airbyte-internal-ops.yml
  - .github/workflows/release-drafter.yml
categories:
  - title: '🛡️ Sentry Updates'
    commit-scopes:
      - sentry
    display-order: 200
  - title: '❇️ MCP Features'
    commit-scopes:
      - mcp
    commit-types:
      - feat
    display-order: 100
  - title: '💻 CLI Features'
    commit-scopes:
      - cli
    commit-types:
      - feat
    display-order: 101
  - title: '🚀 New Capabilities'
    commit-types:
      - feat
    display-order: 102
  - title: '🐛 Bug Fixes'
    commit-types:
      - fix
    display-order: 103
  - title: '⚙️ Under the Hood'
    commit-types:
      - chore
      - ci
      - build
      - refactor
      - test
      - perf
      - docs
    collapse-after: 3
    display-order: 999
