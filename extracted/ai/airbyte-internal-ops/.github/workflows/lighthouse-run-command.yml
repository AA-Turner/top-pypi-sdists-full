name: Project Lighthouse Daily

on:
  schedule:
    # Run daily at 14:00 UTC
    - cron: "0 14 * * *"
      timezone: "Etc/UTC"
  workflow_dispatch:
    inputs:
      run_date:
        description: "Run date. UTC fire date in YYYY-MM-DD format (defaults to yesterday)."
        required: false
        type: string
      dry_run:
        description: "Dry run. Do not write to Zendesk or Slack."
        required: false
        default: true
        type: boolean
      pr:
        description: "PR Number (for slash command)"
        required: false
        type: string
      comment-id:
        description: "Comment ID (for slash command)"
        required: false
        type: string

permissions:
  contents: read
  issues: write
  id-token: write
  pull-requests: write

env:
  LIGHTHOUSE_PR: ${{ github.event.inputs.pr || '' }}
  LIGHTHOUSE_COMMENT_ID: ${{ github.event.inputs.comment-id || '' }}

jobs:
  lighthouse:
    name: Run Project Lighthouse
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Variables
        id: resolve-vars
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_DATE: ${{ inputs.run_date }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          LIVE_VAR: ${{ vars.LIGHTHOUSE_LIVE }}
        run: |
          set -euo pipefail
          ref="$GITHUB_SHA"
          short_sha="${GITHUB_SHA:0:7}"
          source="main"
          is_pr="false"
          live="false"
          run_date="$(date -u -d yesterday +%F)"

          [[ -n "$LIGHTHOUSE_PR" ]] && ! [[ "$LIGHTHOUSE_PR" =~ ^[1-9][0-9]*$ ]] && echo "::error::Invalid PR number." && exit 1
          [[ -n "$LIGHTHOUSE_COMMENT_ID" ]] && [[ -z "$LIGHTHOUSE_PR" ]] && echo "::error::Comment ID requires a PR number." && exit 1
          [[ -n "$INPUT_RUN_DATE" ]] && ! [[ "$INPUT_RUN_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] && echo "::error::Invalid run date; expected YYYY-MM-DD." && exit 1

          if [[ -n "$INPUT_RUN_DATE" ]]; then
            run_date="$INPUT_RUN_DATE"
          fi

          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$LIVE_VAR" == "true" ]] || \
            [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$INPUT_DRY_RUN" == "false" && -z "$LIGHTHOUSE_PR" ]]; then
            live="true"
          fi

          if [[ -n "$LIGHTHOUSE_PR" ]]; then
            ref="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${LIGHTHOUSE_PR}" --jq '.head.sha')"
            short_sha="${ref:0:7}"
            source="pr-${LIGHTHOUSE_PR}"
            is_pr="true"
          fi

          if [[ "$live" == "true" ]]; then
            live_flag="--live"
          else
            live_flag="--no-live"
          fi

          {
            printf "ref=%s\n" "$ref"
            printf "short_sha=%s\n" "$short_sha"
            printf "source=%s\n" "$source"
            printf "is_pr=%s\n" "$is_pr"
            printf "live=%s\n" "$live"
            printf "live_flag=%s\n" "$live_flag"
            printf "run_date=%s\n" "$run_date"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Append comment with Lighthouse job link
        id: post-start-comment
        if: env.LIGHTHOUSE_PR != ''
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ env.LIGHTHOUSE_PR }}
          comment-id: ${{ env.LIGHTHOUSE_COMMENT_ID }}
          edit-mode: append
          body: |
            > 🔦 Lighthouse dry run on PR head `${{ steps.resolve-vars.outputs.short_sha }}` … [Check job output](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.resolve-vars.outputs.ref }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Authenticate to GCP
        id: auth-bigquery
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/351139268520/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-ci@internal-airbyte-ai-infra.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      # TODO: Temporary until github-actions-ci has roles/cloudsql.client on prod-ab-cloud-proj; then drop this step and GCP_PROD_DB_ACCESS_CREDENTIALS.
      - name: Authenticate to GCP for prod DB
        id: auth-prod-db
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/351139268520/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: internal-mcp-sa@internal-airbyte-ai-infra.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: false

      - name: Export split GCP credentials
        env:
          BIGQUERY_CREDENTIALS_FILE: ${{ steps.auth-bigquery.outputs.credentials_file_path }}
          PROD_DB_CREDENTIALS_FILE: ${{ steps.auth-prod-db.outputs.credentials_file_path }}
        run: |
          bigquery_delimiter="GCP_BIGQUERY_CREDENTIALS_EOF"
          prod_db_delimiter="GCP_PROD_DB_ACCESS_CREDENTIALS_EOF"
          {
            printf 'GCP_BIGQUERY_CREDENTIALS<<%s\n' "$bigquery_delimiter"
            cat "$BIGQUERY_CREDENTIALS_FILE"
            printf '\n'
            printf '%s\n' "$bigquery_delimiter"
            printf 'GCP_PROD_DB_ACCESS_CREDENTIALS<<%s\n' "$prod_db_delimiter"
            cat "$PROD_DB_CREDENTIALS_FILE"
            printf '\n'
            printf '%s\n' "$prod_db_delimiter"
          } >> "$GITHUB_ENV"

      - name: 'Run Lighthouse Command: `airbyte-ops lighthouse run --date "${{ steps.resolve-vars.outputs.run_date }}" "${{ steps.resolve-vars.outputs.live_flag }}"`'
        env:
          ZENDESK_SUBDOMAIN: ${{ secrets.ZENDESK_SUBDOMAIN }}
          ZENDESK_EMAIL: ${{ secrets.ZENDESK_EMAIL }}
          ZENDESK_API_TOKEN: ${{ secrets.ZENDESK_API_TOKEN }}
          SLACK_HYDRA_BOT_TOKEN: ${{ secrets.SLACK_HYDRA_BOT_TOKEN }}
        run: uv run airbyte-ops lighthouse run --date "${{ steps.resolve-vars.outputs.run_date }}" "${{ steps.resolve-vars.outputs.live_flag }}"

      - name: Upload Lighthouse plan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-plan
          path: lighthouse_plan.json
          if-no-files-found: warn
          retention-days: 7

      - name: Append success comment
        if: >
          success() &&
          env.LIGHTHOUSE_PR != '' &&
          steps.post-start-comment.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ env.LIGHTHOUSE_PR }}
          comment-id: ${{ steps.post-start-comment.outputs.comment-id }}
          edit-mode: append
          reactions: hooray
          body: |
            > ✅ Lighthouse dry run completed successfully. [Check job output](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Append failure comment
        if: >
          failure() &&
          env.LIGHTHOUSE_PR != '' &&
          steps.post-start-comment.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ env.LIGHTHOUSE_PR }}
          comment-id: ${{ steps.post-start-comment.outputs.comment-id }}
          edit-mode: append
          reactions: confused
          body: |
            > ❌ Lighthouse dry run failed. [Check job output](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
