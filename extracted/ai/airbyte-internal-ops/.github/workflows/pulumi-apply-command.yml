name: Pulumi Apply

on:
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/pulumi-apply-command.yml'
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR Number (for slash command)'
        type: string
        required: false
      comment-id:
        description: 'Comment ID (for slash command)'
        type: string
        required: false

permissions:
  contents: read
  actions: read
  pull-requests: write
  deployments: write
  id-token: write  # For GCP Workload Identity Federation

jobs:
  detect-changes:
    name: Detect Changed Stacks
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.build-matrix.outputs.stacks }}
      ref: ${{ steps.resolve-ref.outputs.ref }}
    steps:
      - name: Authenticate as GitHub App
        uses: actions/create-github-app-token@v2
        id: get-app-token
        with:
          app-id: ${{ secrets.OCTAVIA_BOT_APP_ID }}
          private-key: ${{ secrets.OCTAVIA_BOT_PRIVATE_KEY }}

      # --- Resolve the ref to checkout (step-level if conditions) ---

      - name: Resolve ref (push to main)
        if: github.event_name == 'push'
        id: ref-push
        run: echo "ref=${{ github.ref }}" | tee -a $GITHUB_OUTPUT

      - name: Resolve ref (slash command from PR)
        if: github.event_name != 'push' && github.event.inputs.pr != ''
        id: ref-pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.get-app-token.outputs.token }}
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ github.event.inputs.pr || 0 }}
            });
            if (pr.head.repo.full_name !== pr.base.repo.full_name) {
              core.setFailed('Security: /pulumi-apply is not allowed on PRs from forks');
              return;
            }
            core.setOutput('ref', pr.head.ref);
            core.info(`PR #${{ github.event.inputs.pr }} from branch: ${pr.head.ref}`);

      - name: Resolve ref (manual dispatch)
        if: github.event_name != 'push' && github.event.inputs.pr == ''
        id: ref-manual
        run: echo "ref=${{ github.ref }}" | tee -a $GITHUB_OUTPUT

      - name: Set resolved ref
        id: resolve-ref
        run: echo "ref=${{ steps.ref-push.outputs.ref || steps.ref-pr.outputs.ref || steps.ref-manual.outputs.ref }}" | tee -a $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.resolve-ref.outputs.ref }}
          token: ${{ steps.get-app-token.outputs.token }}
          fetch-depth: 0

      # --- Change detection using dorny/paths-filter ---

      - name: Detect changed paths (push to main)
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        id: changes-push
        with:
          filters: |
            sentry:
              - 'infra/sentry/**'
            agent-message-bus:
              - 'infra/agent-message-bus/**'
            ops-webapp:
              - 'infra/ops-webapp/**'
            internal-mcp-servers:
              - 'infra/internal-mcp-servers/**'
            workflow:
              - '.github/workflows/pulumi-apply-command.yml'

      - name: Detect changed paths (slash command)
        if: github.event_name != 'push' && github.event.inputs.pr != ''
        uses: dorny/paths-filter@v3
        id: changes-pr
        with:
          base: main
          filters: |
            sentry:
              - 'infra/sentry/**'
            agent-message-bus:
              - 'infra/agent-message-bus/**'
            ops-webapp:
              - 'infra/ops-webapp/**'
            internal-mcp-servers:
              - 'infra/internal-mcp-servers/**'
            workflow:
              - '.github/workflows/pulumi-apply-command.yml'

      - name: Build stack matrix
        id: build-matrix
        uses: actions/github-script@v7
        with:
          script: |
            const isManual = '${{ github.event_name }}' !== 'push' && '${{ github.event.inputs.pr }}' === '';
            const stacks = [];
            if (isManual) {
              // Manual dispatch: run all stacks with a Pulumi.yaml
              const fs = require('fs');
              const path = require('path');
              for (const entry of fs.readdirSync('infra', { withFileTypes: true })) {
                if (entry.isDirectory() && fs.existsSync(path.join('infra', entry.name, 'Pulumi.yaml'))) {
                  stacks.push({ name: entry.name, dir: `infra/${entry.name}` });
                }
              }
            } else {
              const sentry = ${{ steps['changes-push'].outputs.sentry || steps['changes-pr'].outputs.sentry || false }};
              const amb = ${{ steps['changes-push'].outputs['agent-message-bus'] || steps['changes-pr'].outputs['agent-message-bus'] || false }};
              const opsWebapp = ${{ steps['changes-push'].outputs['ops-webapp'] || steps['changes-pr'].outputs['ops-webapp'] || false }};
              const workflow = ${{ steps['changes-push'].outputs.workflow || steps['changes-pr'].outputs.workflow || false }};
              if (sentry || workflow) stacks.push({ name: 'sentry', dir: 'infra/sentry' });
              if (amb || workflow) stacks.push({ name: 'agent-message-bus', dir: 'infra/agent-message-bus' });
              if (opsWebapp || workflow) stacks.push({ name: 'ops-webapp', dir: 'infra/ops-webapp' });
              const internalMcp = ${{ steps['changes-push'].outputs['internal-mcp-servers'] || steps['changes-pr'].outputs['internal-mcp-servers'] || false }};
              if (internalMcp || workflow) stacks.push({ name: 'internal-mcp-servers', dir: 'infra/internal-mcp-servers' });
            }
            const result = JSON.stringify(stacks);
            core.setOutput('stacks', result);
            core.info(`Detected stacks: ${result}`);

      - name: Append comment with job run link
        if: github.event.inputs.comment-id
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ github.event.inputs.comment-id }}
          body: |
            > 🚀 **Pulumi Apply Job Info**
            >
            > Running `pulumi up` for changed infra stacks.
            > Detected stacks: `${{ steps.build-matrix.outputs.stacks }}`

            > ⏳ Job started... [Check job output.](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

  apply:
    name: "Apply: ${{ matrix.stack.name }}"
    needs: detect-changes
    if: needs.detect-changes.outputs.stacks != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJson(needs.detect-changes.outputs.stacks) }}
    # Ensure only one apply per stack runs at a time
    concurrency:
      group: pulumi-apply-${{ matrix.stack.name }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ matrix.stack.dir }}
    env:
      PULUMI_REFRESH_EXCLUDE: ${{ matrix.stack.name == 'sentry' && '--exclude urn:pulumi:prod::airbyte-sentry::sentry:index/issueAlert:IssueAlert::alert-api-connectors-p0' || '' }}
    steps:
      - name: Authenticate as GitHub App
        uses: actions/create-github-app-token@v2
        id: get-app-token
        with:
          app-id: ${{ secrets.OCTAVIA_BOT_APP_ID }}
          private-key: ${{ secrets.OCTAVIA_BOT_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.detect-changes.outputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Pulumi CLI
        uses: pulumi/setup-pulumi@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      # ---------- Stack-specific setup ----------

      # Sentry: generate the Terraform-bridged provider SDK
      - name: Generate Sentry provider SDK
        if: matrix.stack.name == 'sentry'
        env:
          GITHUB_TOKEN: ${{ steps.get-app-token.outputs.token }}
        run: pulumi package add terraform-provider jianyuan/sentry 0.14.13

      # GCP stacks: authenticate via Workload Identity Federation
      - name: Authenticate to GCP (WIF)
        if: matrix.stack.name != 'sentry'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/351139268520/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-ci@internal-airbyte-ai-infra.iam.gserviceaccount.com

      # ---------- Install dependencies into the Pulumi venv ----------
      # Pulumi.yaml sets 'virtualenv: venv', so Pulumi runs code from venv/.
      # We pre-install deps here; for sentry the venv may already exist
      # (created by 'pulumi package add'), so we tolerate that.
      - name: Install Python dependencies
        run: |
          uv venv venv 2>/dev/null || true
          VIRTUAL_ENV=venv uv pip install -r requirements.txt

      # ---------- State backend: artifact-based (Sentry) ----------

      - name: Download state artifact
        if: matrix.stack.name == 'sentry'
        id: download-state
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v13
        with:
          name: pulumi-${{ matrix.stack.name }}-state
          path: ${{ github.workspace }}/${{ matrix.stack.dir }}/.pulumi-state
          workflow: pulumi-apply-command.yml
          branch: main
          workflow_conclusion: success
          search_artifacts: true
          if_no_artifact_found: warn

      - name: Initialize artifact backend
        if: matrix.stack.name == 'sentry'
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: |
          BACKEND_DIR="${{ github.workspace }}/${{ matrix.stack.dir }}/.pulumi-state"
          mkdir -p "$BACKEND_DIR"
          pulumi login "file://$BACKEND_DIR"
          [ -d "$BACKEND_DIR/.pulumi/stacks" ] && echo "State restored from artifact" || echo "No existing state found, starting fresh"

      # ---------- State backend: GCS (GCP stacks) ----------

      - name: Initialize GCS backend
        if: matrix.stack.name != 'sentry'
        run: pulumi login gs://internal-airbyte-ai-infra-pulumi-state

      # ---------- Select stack, preview, and apply ----------

      - name: Select stack
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: pulumi stack select prod --create

      - name: Pulumi Refresh
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN_READWRITE }}
        run: pulumi refresh --stack prod --yes $PULUMI_REFRESH_EXCLUDE

      - name: Pulumi Preview
        id: preview
        continue-on-error: true
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN_READWRITE }}
        run: pulumi preview --stack prod --diff --expect-no-changes

      - name: Pulumi Up (Apply)
        id: pulumi-up
        if: steps.preview.outcome == 'failure'
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN_READWRITE }}
        run: pulumi up --stack prod --yes

      - name: Post-apply Convergence Check
        id: convergence-check
        if: steps.preview.outcome == 'failure'
        continue-on-error: true
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN_READWRITE }}
        run: pulumi preview --stack prod --refresh --diff --expect-no-changes $PULUMI_REFRESH_EXCLUDE

      # ---------- State upload: artifact-based (Sentry) ----------

      - name: Upload state artifact
        if: always() && matrix.stack.name == 'sentry'
        uses: actions/upload-artifact@v6
        with:
          name: pulumi-${{ matrix.stack.name }}-state
          path: ${{ github.workspace }}/${{ matrix.stack.dir }}/.pulumi-state
          retention-days: 90
          overwrite: true
          include-hidden-files: true

  # ---------- Slash command result comment ----------
  comment-result:
    name: Report Result
    needs: [detect-changes, apply]
    if: always() && github.event.inputs.comment-id
    runs-on: ubuntu-latest
    steps:
      - name: Append success comment
        if: needs.apply.result == 'success'
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ github.event.inputs.comment-id }}
          reactions: hooray
          body: |
            > ✅ Pulumi apply completed successfully for all stacks.

      - name: Append failure comment
        if: needs.apply.result == 'failure' || needs.detect-changes.result == 'failure'
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ github.event.inputs.comment-id }}
          reactions: confused
          body: |
            > ❌ Pulumi apply failed for one or more stacks. Check the [job output](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.

      - name: Append skipped comment
        if: needs.detect-changes.result == 'success' && needs.detect-changes.outputs.stacks == '[]'
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ github.event.inputs.comment-id }}
          body: |
            > ⏭️ No infra changes detected — Pulumi apply was skipped.
