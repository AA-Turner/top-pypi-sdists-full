name: Pulumi Apply

on:
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/pulumi-apply-command.yml'
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR Number (for slash command)'
        type: string
        required: false
      comment-id:
        description: 'Comment ID (for slash command)'
        type: string
        required: false

permissions:
  contents: read
  actions: read
  pull-requests: write
  deployments: write
  id-token: write  # For GCP Workload Identity Federation

jobs:
  detect-changes:
    name: Detect Changed Stacks
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.build-matrix.outputs.stacks }}
      ref: ${{ steps.resolve-ref.outputs.ref }}
    steps:
      - name: Authenticate as GitHub App
        uses: actions/create-github-app-token@v2
        id: get-app-token
        with:
          app-id: ${{ secrets.OCTAVIA_BOT_APP_ID }}
          private-key: ${{ secrets.OCTAVIA_BOT_PRIVATE_KEY }}

      # --- Resolve the ref to checkout (step-level if conditions) ---

      - name: Resolve ref (push to main)
        if: github.event_name == 'push'
        id: ref-push
        run: echo "ref=${{ github.ref }}" | tee -a "$GITHUB_OUTPUT"

      - name: Resolve ref (slash command from PR)
        if: github.event_name != 'push' && github.event.inputs.pr != ''
        id: ref-pr
        env:
          GH_TOKEN: ${{ steps.get-app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.inputs.pr }}
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] \
            || { echo "::error::PR number must be a positive integer."; exit 1; }
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          error="$(
            jq -r --arg pr_number "$PR_NUMBER" '
              if .head.repo.full_name != .base.repo.full_name then
                "Security: /pulumi-apply is not allowed on PRs from forks"
              elif .mergeable != true or (.merge_commit_sha // "") == "" then
                "PR #\($pr_number) is not mergeable (mergeable=\(.mergeable), merge_commit_sha=\(.merge_commit_sha // "none")). Resolve conflicts before applying."
              else
                ""
              end
            ' <<< "$pr_json"
          )"
          echo "error=$error" | tee -a "$GITHUB_OUTPUT"
          [ -z "$error" ] \
            || { echo "::error::$error"; exit 1; }
          echo "ref=refs/pull/${PR_NUMBER}/merge" | tee -a "$GITHUB_OUTPUT"

      - name: Report invalid PR apply ref
        if: always() && github.event_name != 'push' && github.event.inputs.pr != '' && steps['ref-pr'].outputs.error && github.event.inputs.comment-id
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ github.event.inputs.comment-id }}
          reactions: confused
          body: |
            > ❌ Pulumi apply stopped: ${{ steps['ref-pr'].outputs.error }}

      - name: Resolve ref (manual dispatch)
        if: github.event_name != 'push' && github.event.inputs.pr == ''
        id: ref-manual
        run: echo "ref=${{ github.ref }}" | tee -a "$GITHUB_OUTPUT"

      - name: Set resolved ref
        id: resolve-ref
        env:
          REF_PUSH: ${{ steps.ref-push.outputs.ref }}
          REF_PR: ${{ steps.ref-pr.outputs.ref }}
          REF_MANUAL: ${{ steps.ref-manual.outputs.ref }}
        run: |
          resolved_ref="${REF_PUSH:-${REF_PR:-$REF_MANUAL}}"
          echo "ref=$resolved_ref" | tee -a "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.resolve-ref.outputs.ref }}
          token: ${{ steps.get-app-token.outputs.token }}
          fetch-depth: 0

      # --- Change detection using dorny/paths-filter ---

      - name: Detect changed paths (push to main)
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        id: changes-push
        with:
          filters: |
            sentry:
              - 'infra/sentry/**'
            agent-message-bus:
              - 'infra/agent-message-bus/**'
            ops-webapp:
              - 'infra/ops-webapp/**'
            internal-mcp-servers:
              - 'infra/internal-mcp-servers/**'
            workflow:
              - '.github/workflows/pulumi-apply-command.yml'

      - name: Detect changed paths (slash command)
        if: github.event_name != 'push' && github.event.inputs.pr != ''
        uses: dorny/paths-filter@v3
        id: changes-pr
        with:
          base: main
          filters: |
            sentry:
              - 'infra/sentry/**'
            agent-message-bus:
              - 'infra/agent-message-bus/**'
            ops-webapp:
              - 'infra/ops-webapp/**'
            internal-mcp-servers:
              - 'infra/internal-mcp-servers/**'
            workflow:
              - '.github/workflows/pulumi-apply-command.yml'

      - name: Resolve Variables
        id: build-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.inputs.pr }}
          SENTRY_CHANGED: ${{ steps['changes-push'].outputs.sentry || steps['changes-pr'].outputs.sentry || 'false' }}
          AGENT_MESSAGE_BUS_CHANGED: ${{ steps['changes-push'].outputs['agent-message-bus'] || steps['changes-pr'].outputs['agent-message-bus'] || 'false' }}
          OPS_WEBAPP_CHANGED: ${{ steps['changes-push'].outputs['ops-webapp'] || steps['changes-pr'].outputs['ops-webapp'] || 'false' }}
          INTERNAL_MCP_SERVERS_CHANGED: ${{ steps['changes-push'].outputs['internal-mcp-servers'] || steps['changes-pr'].outputs['internal-mcp-servers'] || 'false' }}
          WORKFLOW_CHANGED: ${{ steps['changes-push'].outputs.workflow || steps['changes-pr'].outputs.workflow || 'false' }}
        run: |
          all_stacks="$(
            find infra -mindepth 2 -maxdepth 2 -type f -name 'Pulumi.yaml' -print \
              | sort \
              | jq -c -R -s 'split("\n") | map(select(length > 0) | capture("^infra/(?<name>[^/]+)/Pulumi\\.yaml$") | {name: .name, dir: ("infra/" + .name)})'
          )"
          changed_stacks="$(
            jq -c -n \
              --arg sentry "$SENTRY_CHANGED" \
              --arg agent_message_bus "$AGENT_MESSAGE_BUS_CHANGED" \
              --arg ops_webapp "$OPS_WEBAPP_CHANGED" \
              --arg internal_mcp_servers "$INTERNAL_MCP_SERVERS_CHANGED" \
              --arg workflow "$WORKFLOW_CHANGED" \
              '[
                {name: "sentry", dir: "infra/sentry", changed: ($sentry == "true" or $workflow == "true")},
                {name: "agent-message-bus", dir: "infra/agent-message-bus", changed: ($agent_message_bus == "true" or $workflow == "true")},
                {name: "ops-webapp", dir: "infra/ops-webapp", changed: ($ops_webapp == "true" or $workflow == "true")},
                {name: "internal-mcp-servers", dir: "infra/internal-mcp-servers", changed: ($internal_mcp_servers == "true" or $workflow == "true")}
              ] | map(select(.changed)) | map(del(.changed))'
          )"
          json="$(jq -c -n --arg event "$EVENT_NAME" --arg pr "$PR_NUMBER" --argjson all "$all_stacks" --argjson changed "$changed_stacks" 'if $event == "workflow_dispatch" and $pr == "" then $all else $changed end')"
          if [ -z "${json//[[:space:]]/}" ]; then
            echo "::error::Resolved Pulumi stack matrix is blank; refusing to continue because stack detection produced no JSON output."
            exit 1
          fi
          echo "stacks=$json" | tee -a "$GITHUB_OUTPUT"

      - name: Append comment with job run link
        if: github.event.inputs.comment-id
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ github.event.inputs.comment-id }}
          body: |
            > 🚀 **Pulumi Apply Job Info**
            >
            > Running `pulumi up` for changed infra stacks.
            > Detected stacks: `${{ steps.build-matrix.outputs.stacks }}`

            > ⏳ Job started... [Check job output.](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

  apply:
    name: "Apply: ${{ matrix.stack.name }}"
    needs: detect-changes
    if: needs.detect-changes.outputs.stacks != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJson(needs.detect-changes.outputs.stacks) }}
    # Ensure only one apply per stack runs at a time
    concurrency:
      group: pulumi-apply-${{ matrix.stack.name }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ matrix.stack.dir }}
    env:
      PULUMI_REFRESH_EXCLUDE: ${{ matrix.stack.name == 'sentry' && 'urn:pulumi:prod::airbyte-sentry::sentry:index/issueAlert:IssueAlert::alert-api-connectors-p0' || '' }}
    steps:
      - name: Authenticate as GitHub App
        uses: actions/create-github-app-token@v2
        id: get-app-token
        with:
          app-id: ${{ secrets.OCTAVIA_BOT_APP_ID }}
          private-key: ${{ secrets.OCTAVIA_BOT_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.detect-changes.outputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Pulumi CLI
        uses: pulumi/setup-pulumi@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      # ---------- Stack-specific setup ----------

      # Sentry: generate the Terraform-bridged provider SDK
      - name: Generate Sentry provider SDK
        if: matrix.stack.name == 'sentry'
        env:
          GITHUB_TOKEN: ${{ steps.get-app-token.outputs.token }}
        run: pulumi package add terraform-provider jianyuan/sentry 0.14.13

      # GCP stacks: authenticate via Workload Identity Federation
      - name: Authenticate to GCP (WIF)
        if: matrix.stack.name != 'sentry'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/351139268520/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-ci@internal-airbyte-ai-infra.iam.gserviceaccount.com

      # ---------- Install dependencies into the Pulumi venv ----------
      # Pulumi.yaml sets 'virtualenv: venv', so Pulumi runs code from venv/.
      # We pre-install deps here; for sentry the venv may already exist
      # (created by 'pulumi package add'), so we tolerate that.
      - name: Install Python dependencies
        run: |
          uv venv venv 2>/dev/null || true
          VIRTUAL_ENV=venv uv pip install -r requirements.txt

      # ---------- State backend: artifact-based (Sentry) ----------

      - name: Download state artifact
        if: matrix.stack.name == 'sentry'
        id: download-state
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v13
        with:
          name: pulumi-${{ matrix.stack.name }}-state
          path: ${{ github.workspace }}/${{ matrix.stack.dir }}/.pulumi-state
          workflow: pulumi-apply-command.yml
          branch: main
          workflow_conclusion: success
          search_artifacts: true
          if_no_artifact_found: warn

      - name: Initialize artifact backend
        if: matrix.stack.name == 'sentry'
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: |
          BACKEND_DIR="${{ github.workspace }}/${{ matrix.stack.dir }}/.pulumi-state"
          mkdir -p "$BACKEND_DIR"
          pulumi login "file://$BACKEND_DIR"
          [ -d "$BACKEND_DIR/.pulumi/stacks" ] && echo "State restored from artifact" || echo "No existing state found, starting fresh"

      # ---------- State backend: GCS (GCP stacks) ----------

      - name: Initialize GCS backend
        if: matrix.stack.name != 'sentry'
        run: pulumi login gs://internal-airbyte-ai-infra-pulumi-state

      # ---------- Select stack, preview, and apply ----------

      - name: Select stack
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: pulumi stack select prod --create

      - name: Pulumi Refresh
        id: refresh
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN_READWRITE }}
        run: |
          set -o pipefail
          refresh_args=(--stack prod --yes)
          [ -z "$PULUMI_REFRESH_EXCLUDE" ] || refresh_args+=(--exclude "$PULUMI_REFRESH_EXCLUDE")
          pulumi refresh "${refresh_args[@]}" 2>&1 | tee /tmp/pulumi-refresh.txt

      - name: Capture bounded refresh output
        id: refresh-output
        env:
          MAX_CHARS: '28000'
          OUTPUT_CHARS: '27800'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          refresh_output="$(head -c "$OUTPUT_CHARS" /tmp/pulumi-refresh.txt)"
          truncation_note="$( \
            [ "$(wc -c < /tmp/pulumi-refresh.txt)" -gt "$MAX_CHARS" ] \
            && printf '\n\n[Output truncated; see workflow logs: %s]' "$RUN_URL" \
            || true
          )"
          refresh_output="${refresh_output}${truncation_note}"
          {
            echo 'refresh_output<<EOF'
            printf '%s\n' "$refresh_output"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Pulumi Preview
        id: preview
        continue-on-error: true
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN_READWRITE }}
        run: |
          set -o pipefail
          rc=0
          pulumi preview --stack prod --diff --expect-no-changes 2>&1 | tee /tmp/pulumi-preview-diff.txt || rc=$?
          exit "$rc"

      - name: Capture bounded preview output
        id: preview-output
        env:
          MAX_CHARS: '28000'
          OUTPUT_CHARS: '27800'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          preview_diff_output="$(head -c "$OUTPUT_CHARS" /tmp/pulumi-preview-diff.txt)"
          truncation_note="$( \
            [ "$(wc -c < /tmp/pulumi-preview-diff.txt)" -gt "$MAX_CHARS" ] \
            && printf '\n\n[Output truncated; see workflow logs: %s]' "$RUN_URL" \
            || true
          )"
          preview_diff_output="${preview_diff_output}${truncation_note}"
          {
            echo 'preview_diff_output<<EOF'
            printf '%s\n' "$preview_diff_output"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Post fresh apply diff
        if: github.event.inputs.comment-id
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ github.event.inputs.comment-id }}
          body: |
            > 🔄 **Fresh Pulumi diff before apply** (`${{ matrix.stack.name }}`)
            >
            > This refresh and diff were generated from the PR merge ref immediately before apply.

            <details><summary>Refresh output</summary>

            ```
            ${{ steps['refresh-output'].outputs.refresh_output }}
            ```

            </details>

            <details><summary>Detailed diff</summary>

            ```diff
            ${{ steps['preview-output'].outputs.preview_diff_output }}
            ```

            </details>

            [View the full workflow logs.](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Pulumi Up (Apply)
        id: pulumi-up
        if: steps.preview.outcome == 'failure'
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN_READWRITE }}
        run: pulumi up --stack prod --yes

      - name: Post-apply Convergence Check
        id: convergence-check
        if: steps.preview.outcome == 'failure'
        continue-on-error: true
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN_READWRITE }}
        run: |
          preview_args=(--stack prod --refresh --diff --expect-no-changes)
          [ -z "$PULUMI_REFRESH_EXCLUDE" ] || preview_args+=(--exclude "$PULUMI_REFRESH_EXCLUDE")
          pulumi preview "${preview_args[@]}"

      # ---------- State upload: artifact-based (Sentry) ----------

      - name: Upload state artifact
        if: always() && matrix.stack.name == 'sentry'
        uses: actions/upload-artifact@v7
        with:
          name: pulumi-${{ matrix.stack.name }}-state
          path: ${{ github.workspace }}/${{ matrix.stack.dir }}/.pulumi-state
          retention-days: 90
          overwrite: true
          include-hidden-files: true

  # ---------- Slash command result comment ----------
  comment-result:
    name: Report Result
    needs: [detect-changes, apply]
    if: always() && github.event.inputs.comment-id
    runs-on: ubuntu-latest
    steps:
      - name: Append success comment
        if: needs.apply.result == 'success'
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ github.event.inputs.comment-id }}
          reactions: hooray
          body: |
            > ✅ Pulumi apply completed successfully for all stacks.

      - name: Append failure comment
        if: needs.apply.result == 'failure' || needs.detect-changes.result == 'failure'
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ github.event.inputs.comment-id }}
          reactions: confused
          body: |
            > ❌ Pulumi apply failed for one or more stacks. Check the [job output](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.

      - name: Append skipped comment
        if: needs.detect-changes.result == 'success' && needs.detect-changes.outputs.stacks == '[]'
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ github.event.inputs.comment-id }}
          body: |
            > ⏭️ No infra changes detected — Pulumi apply was skipped.
