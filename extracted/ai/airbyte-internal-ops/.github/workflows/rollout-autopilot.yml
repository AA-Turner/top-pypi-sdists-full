name: Rollout AutoPilot
run-name: "Rollout AutoPilot (${{ github.event_name == 'workflow_dispatch' && 'manual' || 'scheduled' }})"

on:
  workflow_call:
    inputs:
      dry_run:
        description: "Run in dry-run mode (preview only, no mutations)."
        type: boolean
        default: true
      auto_supersede:
        description: "Enable auto-supersede of older rollouts when a newer RC exists."
        type: boolean
        default: false
      auto_start:
        description: "Enable auto-start of INITIALIZED rollouts."
        type: boolean
        default: false
      auto_advance:
        description: "Enable auto-advance of IN_PROGRESS rollouts within their current tier."
        type: boolean
        default: false
      auto_promote:
        description: "Enable auto-promote across tiers when at 100% and healthy."
        type: boolean
        default: false
      auto_triage_failed:
        description: "Enable auto-triage of failed/paused rollouts (log + unpin if safe)."
        type: boolean
        default: false
      auto_rollback_failed:
        description: "Enable full rollback of errored rollouts when safe to downgrade."
        type: boolean
        default: false
      connector:
        description: "Optional: filter to a specific connector (e.g., 'source-github')."
        type: string
        default: ""

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (preview only, no mutations)."
        type: boolean
        default: true
      auto_supersede:
        description: "Enable auto-supersede of older rollouts when a newer RC exists."
        type: boolean
        default: false
      auto_start:
        description: "Enable auto-start of INITIALIZED rollouts."
        type: boolean
        default: false
      auto_advance:
        description: "Enable auto-advance of IN_PROGRESS rollouts within their current tier."
        type: boolean
        default: false
      auto_promote:
        description: "Enable auto-promote across tiers when at 100% and healthy."
        type: boolean
        default: false
      auto_triage_failed:
        description: "Enable auto-triage of failed/paused rollouts (log + unpin if safe)."
        type: boolean
        default: false
      auto_rollback_failed:
        description: "Enable full rollback of errored rollouts when safe to downgrade."
        type: boolean
        default: false
      connector:
        description: "Optional: filter to a specific connector (e.g., 'source-github')."
        type: string
        default: ""

permissions:
  contents: read

env:
  DRY_RUN_FLAG: ${{ inputs.dry_run && '--dry-run' || '' }}
  CONNECTOR_FLAG: ${{ inputs.connector != '' && format('--connector {0}', inputs.connector) || '' }}

jobs:
  autopilot:
    name: Rollout AutoPilot
    runs-on: ubuntu-latest
    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install airbyte-ops CLI
        run: uv tool install airbyte-internal-ops

      # ---- Debug: print current state for observability ----

      - name: "Debug: Print All Active Rollouts"
        continue-on-error: true
        env:
          GCP_GSM_CREDENTIALS: ${{ secrets.GCP_GSM_CREDENTIALS_FOR_TESTING_TOOL }}
          GCP_PROD_DB_ACCESS_CREDENTIALS: ${{ secrets.GCP_GSM_CREDENTIALS_FOR_TESTING_TOOL }}
        run: |
          echo ""
          echo "========================================"
          echo "  Rollouts Advertised in Registry"
          echo "========================================"
          echo ""
          airbyte-ops registry progressive-rollout list
          echo ""
          echo ""
          echo "========================================"
          echo "  Active Rollouts in Production"
          echo "========================================"
          echo ""
          airbyte-ops cloud connector rollout list
          echo ""

      # ---- Phase 1: Handle failures on existing rollouts ----

      - name: Auto-Triage Failed Rollouts
        # Logs all failed/paused rollouts. For each, unpins individual failing
        # actors if the version is safe to downgrade (per unsafeDowngrades spec).
        # Escalates via HITL if not.
        if: ${{ !cancelled() && inputs.auto_triage_failed }}
        env:
          AIRBYTE_CLOUD_CLIENT_ID: ${{ secrets.AIRBYTE_CLOUD_CLIENT_ID }}
          AIRBYTE_CLOUD_CLIENT_SECRET: ${{ secrets.AIRBYTE_CLOUD_CLIENT_SECRET }}
          AIRBYTE_INTERNAL_ADMIN_FLAG: airbyte.io
          AIRBYTE_INTERNAL_ADMIN_USER: airbyte-support-bot@airbyte.io
          GCP_PROD_DB_ACCESS_CREDENTIALS: ${{ secrets.GCP_GSM_CREDENTIALS_FOR_TESTING_TOOL }}
          GITHUB_TOKEN: ${{ github.token }}
          SLACK_BOT_TOKEN_HITL: ${{ secrets.SLACK_HYDRA_BOT_TOKEN || secrets.SLACK_BOT_TOKEN_HITL || secrets.SLACK_BOT_TOKEN_AIRBYTE_TEAM }}
        run: >
          airbyte-ops cloud connector rollout autopilot auto-triage-failed
          ${{ env.DRY_RUN_FLAG }} ${{ env.CONNECTOR_FLAG }}

      - name: Auto-Rollback Failed Rollouts
        # Full rollout-level rollback: cancels the entire rollout and reverts
        # all pinned actors to GA. Gate: version must NOT appear in
        # unsafeDowngrades (otherwise escalates to HITL).
        if: ${{ !cancelled() && inputs.auto_rollback_failed }}
        env:
          AIRBYTE_CLOUD_CLIENT_ID: ${{ secrets.AIRBYTE_CLOUD_CLIENT_ID }}
          AIRBYTE_CLOUD_CLIENT_SECRET: ${{ secrets.AIRBYTE_CLOUD_CLIENT_SECRET }}
          AIRBYTE_INTERNAL_ADMIN_FLAG: airbyte.io
          AIRBYTE_INTERNAL_ADMIN_USER: airbyte-support-bot@airbyte.io
          GCP_PROD_DB_ACCESS_CREDENTIALS: ${{ secrets.GCP_GSM_CREDENTIALS_FOR_TESTING_TOOL }}
        run: >
          airbyte-ops cloud connector rollout autopilot auto-rollback-failed
          ${{ env.DRY_RUN_FLAG }} ${{ env.CONNECTOR_FLAG }}

      # ---- Phase 2: Supersede stale rollouts, then start/advance/promote ----

      - name: Auto-Supersede Older Rollouts
        # Cancels older rollouts when a newer RC exists for the same connector.
        # Retains pins so actors stay on the old version until the new rollout
        # progressively advances to include them.
        if: ${{ !cancelled() && inputs.auto_supersede }}
        env:
          AIRBYTE_CLOUD_CLIENT_ID: ${{ secrets.AIRBYTE_CLOUD_CLIENT_ID }}
          AIRBYTE_CLOUD_CLIENT_SECRET: ${{ secrets.AIRBYTE_CLOUD_CLIENT_SECRET }}
          AIRBYTE_INTERNAL_ADMIN_FLAG: airbyte.io
          AIRBYTE_INTERNAL_ADMIN_USER: airbyte-support-bot@airbyte.io
          GCP_PROD_DB_ACCESS_CREDENTIALS: ${{ secrets.GCP_GSM_CREDENTIALS_FOR_TESTING_TOOL }}
        run: >
          airbyte-ops cloud connector rollout autopilot auto-supersede
          ${{ env.DRY_RUN_FLAG }} ${{ env.CONNECTOR_FLAG }}

      - name: Auto-Start INITIALIZED Rollouts
        # Finds INITIALIZED rollouts and starts them at TIER_2.
        # Gate: only starts rollouts whose metadata has autopilotConfig.autoStart=true.
        if: ${{ !cancelled() && inputs.auto_start }}
        env:
          AIRBYTE_CLOUD_CLIENT_ID: ${{ secrets.AIRBYTE_CLOUD_CLIENT_ID }}
          AIRBYTE_CLOUD_CLIENT_SECRET: ${{ secrets.AIRBYTE_CLOUD_CLIENT_SECRET }}
          AIRBYTE_INTERNAL_ADMIN_FLAG: airbyte.io
          AIRBYTE_INTERNAL_ADMIN_USER: airbyte-support-bot@airbyte.io
          GCP_PROD_DB_ACCESS_CREDENTIALS: ${{ secrets.GCP_GSM_CREDENTIALS_FOR_TESTING_TOOL }}
        run: >
          airbyte-ops cloud connector rollout autopilot auto-start
          ${{ env.DRY_RUN_FLAG }} ${{ env.CONNECTOR_FLAG }}

      - name: Auto-Advance IN_PROGRESS Rollouts
        # Advances IN_PROGRESS rollouts within their current tier based on sync
        # health signals and the connector's autopilotConfig.strategy pacing.
        if: ${{ !cancelled() && inputs.auto_advance }}
        env:
          AIRBYTE_CLOUD_CLIENT_ID: ${{ secrets.AIRBYTE_CLOUD_CLIENT_ID }}
          AIRBYTE_CLOUD_CLIENT_SECRET: ${{ secrets.AIRBYTE_CLOUD_CLIENT_SECRET }}
          AIRBYTE_INTERNAL_ADMIN_FLAG: airbyte.io
          AIRBYTE_INTERNAL_ADMIN_USER: airbyte-support-bot@airbyte.io
          GCP_PROD_DB_ACCESS_CREDENTIALS: ${{ secrets.GCP_GSM_CREDENTIALS_FOR_TESTING_TOOL }}
        run: >
          airbyte-ops cloud connector rollout autopilot auto-advance
          ${{ env.DRY_RUN_FLAG }} ${{ env.CONNECTOR_FLAG }}

      - name: Auto-Promote Across Tiers
        # Promotes rollouts at 100% of current tier to the next tier
        # (TIER_2 -> TIER_1 -> ALL). Gate: autopilotConfig.autoAdvanceTiers
        # must be true. Final promotion finalizes the rollout.
        if: ${{ !cancelled() && inputs.auto_promote }}
        env:
          AIRBYTE_CLOUD_CLIENT_ID: ${{ secrets.AIRBYTE_CLOUD_CLIENT_ID }}
          AIRBYTE_CLOUD_CLIENT_SECRET: ${{ secrets.AIRBYTE_CLOUD_CLIENT_SECRET }}
          AIRBYTE_INTERNAL_ADMIN_FLAG: airbyte.io
          AIRBYTE_INTERNAL_ADMIN_USER: airbyte-support-bot@airbyte.io
          GCP_PROD_DB_ACCESS_CREDENTIALS: ${{ secrets.GCP_GSM_CREDENTIALS_FOR_TESTING_TOOL }}
        run: >
          airbyte-ops cloud connector rollout autopilot auto-promote
          ${{ env.DRY_RUN_FLAG }} ${{ env.CONNECTOR_FLAG }}
