name: Deploy Ops Webapp

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-ops-webapp-command.yml"
      - "airbyte-ops-webapp/**"
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number. When provided, deploys to the preview service instead of production."
        required: false
        type: string
      comment-id:
        description: "Slash-command comment ID. Presence of either pr or comment-id triggers a preview deploy."
        required: false
        type: string
permissions:
  contents: read
  issues: write
  id-token: write
  pull-requests: write

env:
  GCP_PROJECT: internal-airbyte-ai-infra
  GCP_REGION: us-west3
  IMAGE_REPOSITORY: ops-webapp
  IMAGE_NAME: ops-webapp
  OPS_WEBAPP_OAUTH_ISSUER: https://cloud.airbyte.com/auth/realms/airbyte
  OPS_WEBAPP_OAUTH_CLIENT_ID: airbyte-ops-webapp-client
  OPS_WEBAPP_PR: ${{ github.event.inputs.pr || '' }}
  OPS_WEBAPP_COMMENT_ID: ${{ github.event.inputs.comment-id || '' }}
  PREVIEW_COMMENT_TAG: "<!-- ops-webapp-preview -->"

jobs:
  deploy-ops-webapp:
    name: Deploy Ops Webapp
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.event.inputs.pr || github.event.inputs.comment-id) && 'Cloud Run (ops-webapp-preview)' || 'Cloud Run (ops-webapp)' }}
      url: ${{ (github.event.inputs.pr || github.event.inputs.comment-id) && 'https://preview.ops.internal.airbyte.ai' || 'https://ops.internal.airbyte.ai' }}
    steps:
      - name: Resolve deployment variables
        id: resolve-vars
        env:
          GH_TOKEN: ${{ github.token }}
          GCP_REGION: ${{ env.GCP_REGION }}
          GCP_PROJECT: ${{ env.GCP_PROJECT }}
          IMAGE_REPOSITORY: ${{ env.IMAGE_REPOSITORY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          ref="$GITHUB_SHA"
          short_sha="${GITHUB_SHA:0:7}"
          source="manual"
          is_preview="false"

          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" = "main" ]; then
            source="main"
          fi

          # Presence of either pr or comment-id means this is a slash-command
          # preview deploy rather than a production deploy.
          if [ -n "$OPS_WEBAPP_PR" ] || [ -n "$OPS_WEBAPP_COMMENT_ID" ]; then
            is_preview="true"
          fi

          if [ -n "$OPS_WEBAPP_PR" ]; then
            if ! [[ "$OPS_WEBAPP_PR" =~ ^[1-9][0-9]*$ ]]; then
              echo "Invalid PR number: $OPS_WEBAPP_PR" >&2
              exit 1
            fi
            ref="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${OPS_WEBAPP_PR}" --jq '.head.sha')"
            short_sha="${ref:0:7}"
            source="pr-${OPS_WEBAPP_PR}"
          fi

          if [ "$is_preview" = "true" ]; then
            service="ops-webapp-preview"
            public_url="https://preview.ops.internal.airbyte.ai"
            image="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${IMAGE_REPOSITORY}/${IMAGE_NAME}:preview-${short_sha}"
          else
            service="ops-webapp"
            public_url="https://ops.internal.airbyte.ai"
            image="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${IMAGE_REPOSITORY}/${IMAGE_NAME}:${source}-${short_sha}"
          fi

          {
            printf "ref=%s\n" "$ref"
            printf "short_sha=%s\n" "$short_sha"
            printf "source=%s\n" "$source"
            printf "image=%s\n" "$image"
            printf "service=%s\n" "$service"
            printf "public_url=%s\n" "$public_url"
            printf "is_preview=%s\n" "$is_preview"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Append comment with deployment job link
        id: post-start-comment
        if: env.OPS_WEBAPP_PR != ''
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ env.OPS_WEBAPP_COMMENT_ID }}
          issue-number: ${{ env.OPS_WEBAPP_PR }}
          edit-mode: append
          body: |
            > 🚀 **Ops Webapp Deploy Job Info**
            >
            > Deploying `${{ steps.resolve-vars.outputs.source }}` to `${{ steps.resolve-vars.outputs.public_url }}`.
            > Image: `${{ steps.resolve-vars.outputs.image }}`
            >
            > ⏳ Job started... [Check job output.](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Checkout deployment target
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.resolve-vars.outputs.ref }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/351139268520/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-ci@internal-airbyte-ai-infra.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify Artifact Registry repository
        run: >
          gcloud artifacts repositories describe "${{ env.IMAGE_REPOSITORY }}"
          --project="${{ env.GCP_PROJECT }}"
          --location="${{ env.GCP_REGION }}"

      - name: Verify Cloud Run service
        run: >
          gcloud run services describe "${{ steps.resolve-vars.outputs.service }}"
          --project="${{ env.GCP_PROJECT }}"
          --region="${{ env.GCP_REGION }}"
          --format="value(metadata.name)"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build image
        run: >
          docker build
          --file airbyte-ops-webapp/Dockerfile
          --tag "${{ steps.resolve-vars.outputs.image }}"
          .

      - name: Push image
        run: docker push "${{ steps.resolve-vars.outputs.image }}"

      - name: Update Cloud Run service image
        run: >
          gcloud run services update "${{ steps.resolve-vars.outputs.service }}"
          --project="${{ env.GCP_PROJECT }}"
          --region="${{ env.GCP_REGION }}"
          --image="${{ steps.resolve-vars.outputs.image }}"
          --quiet

      - name: Route traffic to latest revision (production only)
        if: steps.resolve-vars.outputs.is_preview != 'true'
        run: >
          gcloud run services update-traffic "${{ steps.resolve-vars.outputs.service }}"
          --project="${{ env.GCP_PROJECT }}"
          --region="${{ env.GCP_REGION }}"
          --to-latest
          --quiet

      - name: Post or update preview comment
        if: steps.resolve-vars.outputs.is_preview == 'true' && env.OPS_WEBAPP_PR != ''
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ env.OPS_WEBAPP_PR }}
          body: |
            ${{ env.PREVIEW_COMMENT_TAG }}
            ### 🔍 Ops Webapp Preview

            **Preview URL:** ${{ steps.resolve-vars.outputs.public_url }}
            **Commit:** `${{ steps.resolve-vars.outputs.short_sha }}`
            **Mode:** Live (full OAuth + real API calls)

            > This preview deploys to a dedicated preview service at `preview.ops.internal.airbyte.ai`. It shares the same OAuth config and secrets as production. Only one preview is active at a time — subsequent deploys replace the previous one.

      - name: Summarize deployment
        run: |
          {
            echo "Ops Webapp deployed."
            printf "Source: %s\n" "${{ steps.resolve-vars.outputs.source }}"
            printf "Commit: %s\n" "${{ steps.resolve-vars.outputs.ref }}"
            printf "Image: %s\n" "${{ steps.resolve-vars.outputs.image }}"
            printf "Service: %s\n" "${{ steps.resolve-vars.outputs.service }}"
            printf "URL: %s\n" "${{ steps.resolve-vars.outputs.public_url }}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Append success comment
        if: >
          success() &&
          env.OPS_WEBAPP_PR != '' &&
          steps.post-start-comment.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.post-start-comment.outputs.comment-id }}
          issue-number: ${{ env.OPS_WEBAPP_PR }}
          edit-mode: append
          reactions: hooray
          body: |
            > ✅ Ops Webapp deploy completed successfully: ${{ steps.resolve-vars.outputs.public_url }}

      - name: Append failure comment
        if: >
          failure() &&
          env.OPS_WEBAPP_PR != '' &&
          steps.post-start-comment.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.post-start-comment.outputs.comment-id }}
          issue-number: ${{ env.OPS_WEBAPP_PR }}
          edit-mode: append
          reactions: confused
          body: |
            > ❌ Ops Webapp deploy failed. Check the [job output](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.
