name: Pytest (Matrix)

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

jobs:
  pytest-matrix:
    name: Pytest (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    strategy:
      matrix:
        python-version: [
          "3.11",
          "3.12",
          "3.13",
        ]
        os: [ubuntu]
      fail-fast: false
    runs-on: ${{ matrix.os }}-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Detect package changes
        id: package-changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            airbyte-internal-ops:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'pytest.ini'
              - '.github/workflows/pytest-matrix.yml'
            airbyte-cloud-cli:
              - 'airbyte-cloud-cli/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'pytest.ini'
              - '.github/workflows/pytest-matrix.yml'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # `live-tests` carries mitmproxy, which `tests/test_http_metrics.py`
        # needs: without it the whole module skips and the HTTP replay tests
        # are green by absence.
        # `--all-packages` selects workspace packages, not dependency groups.
        run: uv sync --group dev --group live-tests --all-packages

      - name: Run Pytest
        timeout-minutes: 30
        env:
          AIRBYTE_INTERNAL_OPS_CHANGED: ${{ steps.package-changes.outputs.airbyte-internal-ops }}
          AIRBYTE_CLOUD_CLI_CHANGED: ${{ steps.package-changes.outputs.airbyte-cloud-cli }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$AIRBYTE_INTERNAL_OPS_CHANGED" == "true" ]]; then
            uv run pytest --cov=airbyte_ops_mcp --cov-report=xml --cov-report=term tests
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$AIRBYTE_CLOUD_CLI_CHANGED" == "true" ]]; then
            uv run pytest airbyte-cloud-cli/tests
          fi
          if [[ "$GITHUB_EVENT_NAME" != "push" && "$GITHUB_EVENT_NAME" != "workflow_dispatch" && "$AIRBYTE_INTERNAL_OPS_CHANGED" != "true" && "$AIRBYTE_CLOUD_CLI_CHANGED" != "true" ]]; then
            echo "No Python package changes detected."
          fi

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu'
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload coverage to GitHub Code Quality
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu' && hashFiles('./coverage.xml') != ''
        uses: actions/upload-code-coverage@b51da2c3c1b23e04d2d6477cfc34350b1f5cd3e9 # v1
        with:
          file: ./coverage.xml
          language: Python
          label: code-coverage/pytest-matrix
          fail-on-error: false
