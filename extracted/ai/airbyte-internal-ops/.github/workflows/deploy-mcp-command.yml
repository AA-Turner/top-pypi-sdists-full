name: Deploy MCP Server

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-mcp-command.yml"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile.ops-mcp"
      - "Dockerfile.ops-mcp.dockerignore"
      - "infra/internal-mcp-servers/docker/cloud-mcp/**"
  repository_dispatch:
    types: [deploy-cloud-mcp, deploy-agent-mcp]
  workflow_dispatch:
    inputs:
      mcp-server:
        description: "MCP server to deploy."
        required: true
        type: choice
        options:
          - ops-mcp
          - cloud-mcp
          - agent-mcp
        default: ops-mcp
      pr:
        description: "PR number. When provided (and preview is not set to false), deploys to the preview service instead of production."
        required: false
        type: string
      comment-id:
        description: "Slash-command comment ID. Presence of either pr or comment-id triggers a preview deploy unless preview is set to false."
        required: false
        type: string
      preview:
        description: "Preview override. 'auto' (default) infers preview from pr/comment-id presence; 'true' forces a preview deploy (even from main, no PR needed); 'false' forces a production deploy."
        required: false
        type: choice
        options:
          - auto
          - "true"
          - "false"
        default: auto
      cloud-mcp-pyairbyte-requirement:
        description: "Pinned PyAirbyte release, published .dev preview wheel with its build-source SHA, or immutable git SHA for previews. Empty uses the latest PyPI release."
        required: false
        type: string
        default: ""
      cloud-mcp-pyairbyte-source-sha:
        description: "Exact 40-character PyAirbyte build checkout SHA for a published .dev preview wheel. Required for those wheels; forbidden for releases and stable deployments."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  issues: write
  id-token: write
  pull-requests: write

env:
  GCP_PROJECT: internal-airbyte-ai-infra
  GCP_REGION: us-west3
  MCP_SERVER: ${{ github.event.client_payload.mcp-server || github.event.inputs.mcp-server || 'ops-mcp' }}
  MCP_PR: ${{ github.event.inputs.pr || '' }}
  MCP_COMMENT_ID: ${{ github.event.inputs.comment-id || '' }}
  MCP_PREVIEW: ${{ github.event.client_payload.preview || '' }}
  MCP_PREVIEW_INPUT: ${{ github.event.inputs.preview || '' }}
  MCP_CLOUD_MCP_PYAIRBYTE_REQUIREMENT: ${{ github.event.client_payload.cloud-mcp-pyairbyte-requirement || github.event.inputs.cloud-mcp-pyairbyte-requirement || '' }}
  MCP_CLOUD_MCP_PYAIRBYTE_SOURCE_SHA: ${{ github.event.client_payload.cloud-mcp-pyairbyte-source-sha || github.event.inputs.cloud-mcp-pyairbyte-source-sha || '' }}

jobs:
  # ---------- Resolve which service(s) to deploy and how ----------
  resolve-targets:
    name: "Resolve deployment targets"
    runs-on: ubuntu-latest
    outputs:
      # JSON array of fully-resolved deploy specs (one object per deployable
      # server). The `deploy-mcp` job fans out over it, so a single push that
      # touches both the ops-mcp package and the cloud-mcp image files deploys
      # both services in one run.
      targets: ${{ steps.resolve-vars.outputs.targets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # On a push, deploy only the server(s) whose files actually changed. The
      # push trigger's `paths` guarantees at least one of these matches. Non-push
      # events (workflow_dispatch / repository_dispatch) ignore this and use the
      # single server named by the event.
      - name: Detect changed servers (push only)
        id: changes
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ops_mcp:
              - '.github/workflows/deploy-mcp-command.yml'
              - 'src/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Dockerfile.ops-mcp'
              - 'Dockerfile.ops-mcp.dockerignore'
            cloud_mcp:
              - 'infra/internal-mcp-servers/docker/cloud-mcp/**'

      - name: Resolve Variables
        id: resolve-vars
        env:
          GH_TOKEN: ${{ github.token }}
          GCP_REGION: ${{ env.GCP_REGION }}
          GCP_PROJECT: ${{ env.GCP_PROJECT }}
          MCP_SERVER: ${{ env.MCP_SERVER }}
          MCP_PR: ${{ env.MCP_PR }}
          MCP_COMMENT_ID: ${{ env.MCP_COMMENT_ID }}
          MCP_PREVIEW: ${{ env.MCP_PREVIEW }}
          MCP_PREVIEW_INPUT: ${{ env.MCP_PREVIEW_INPUT }}
          OPS_MCP_CHANGED: ${{ steps.changes.outputs.ops_mcp }}
          CLOUD_MCP_CHANGED: ${{ steps.changes.outputs.cloud_mcp }}
        run: |
          set -euo pipefail
          CLOUD_MCP_DIR="infra/internal-mcp-servers/docker/cloud-mcp"

          # ---------- Which server(s) does this run deploy? ----------
          # push: path-based selection (a change to the ops-mcp package deploys
          # ops-mcp; a change to the cloud-mcp image dir deploys cloud-mcp).
          # dispatch: the single server named by the event.
          servers=()
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            [ "$OPS_MCP_CHANGED" = "true" ] && servers+=("ops-mcp")
            [ "$CLOUD_MCP_CHANGED" = "true" ] && servers+=("cloud-mcp")
          else
            servers+=("$MCP_SERVER")
          fi

          # ---------- Validate inputs (guard statements) ----------
          # Reject anything outside the known set so an unexpected value can't
          # build arbitrary paths or silently deploy ops-mcp.
          [ "$GITHUB_EVENT_NAME" = "push" ] \
            || printf '%s\n' ops-mcp cloud-mcp agent-mcp | grep -qxF "$MCP_SERVER" \
            || { echo "::error::Unsupported mcp-server: '$MCP_SERVER' (allowed: ops-mcp, cloud-mcp, agent-mcp)"; exit 1; }
          # repository_dispatch only carries cloud-mcp/agent-mcp; an empty
          # client_payload.mcp-server falls back to 'ops-mcp', so reject that
          # rather than silently deploying ops-mcp to prod.
          [ "$GITHUB_EVENT_NAME" != "repository_dispatch" ] || [ "$MCP_SERVER" != "ops-mcp" ] \
            || { echo "::error::repository_dispatch must set client_payload.mcp-server to cloud-mcp or agent-mcp (resolved to 'ops-mcp')"; exit 1; }
          [ -z "$MCP_COMMENT_ID" ] || [ -n "$MCP_PR" ] \
            || { echo "::error::comment-id requires pr to be set"; exit 1; }
          [ -z "$MCP_PR" ] || [[ "$MCP_PR" =~ ^[1-9][0-9]*$ ]] \
            || { echo "::error::Invalid PR number: $MCP_PR"; exit 1; }
          [ "${#servers[@]}" -gt 0 ] \
            || { echo "::error::No deployment targets resolved for this event."; exit 1; }

          # ---------- Preview vs production ----------
          # 'auto'/empty infers from pr/comment-id; an explicit 'true'/'false'
          # override wins (checked last so 'false' can force production).
          is_preview="false"
          { [ -n "$MCP_PR" ] || [ -n "$MCP_COMMENT_ID" ]; } && is_preview="true"
          { [ "$MCP_PREVIEW_INPUT" = "true" ] || [ "$MCP_PREVIEW" = "true" ]; } && is_preview="true"
          { [ "$MCP_PREVIEW_INPUT" = "false" ] || [ "$MCP_PREVIEW" = "false" ]; } && is_preview="false"

          # ---------- Deploy source + ref ----------
          ref="$GITHUB_SHA"
          source="manual"
          { [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" = "main" ]; } && source="main"
          if [ -n "$MCP_PR" ]; then
            ref="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${MCP_PR}" --jq '.head.sha')"
            source="pr-${MCP_PR}"
          fi
          short_sha="${ref:0:7}"

          # ---------- Per-server deploy specs ----------
          # agent-mcp (mcp.airbyte.ai) is built from airbytehq/sonar, not this
          # repo, so it is inert here: it never enters the deploy matrix, and a
          # request for it just resolves to an empty target list (no-op run).
          targets="[]"
          for server in "${servers[@]}"; do
            if [ "$server" = "agent-mcp" ]; then continue; fi

            # Most images build from a root Dockerfile.<server> with the repo
            # root as context (ops-mcp needs `COPY src/`). cloud-mcp's Dockerfile
            # + requirements live beside the infra files, built from that dir.
            if [ "$server" = "cloud-mcp" ]; then
              dockerfile="${CLOUD_MCP_DIR}/Dockerfile"
              build_context="$CLOUD_MCP_DIR"
            else
              dockerfile="Dockerfile.${server}"
              build_context="."
            fi

            if [ "$is_preview" = "true" ]; then
              service="${server}-preview"
              tag="preview-${short_sha}"
            else
              service="$server"
              tag="${source}-${short_sha}"
            fi

            targets="$(jq -c \
              --arg server "$server" \
              --arg service "$service" \
              --arg image "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${server}/${server}:${tag}" \
              --arg image_repo "$server" \
              --arg public_url "https://mcp.internal.airbyte.ai/${service}" \
              --arg is_preview "$is_preview" \
              --arg dockerfile "$dockerfile" \
              --arg build_context "$build_context" \
              --arg source "$source" \
              --arg short_sha "$short_sha" \
              --arg ref "$ref" \
              '. += [{server:$server, service:$service, image:$image, image_repo:$image_repo, public_url:$public_url, is_preview:$is_preview, dockerfile:$dockerfile, build_context:$build_context, source:$source, short_sha:$short_sha, ref:$ref}]' \
              <<<"$targets")"
          done

          # ---------- Emit outputs (logged via tee for debugging) ----------
          echo "targets=$targets" | tee -a "$GITHUB_OUTPUT"
          echo "Resolved deployment targets:"
          jq . <<<"$targets"

  # ---------- Build + deploy each resolved service ----------
  deploy-mcp:
    name: "Deploy ${{ matrix.target.service }}"
    needs: resolve-targets
    if: needs.resolve-targets.outputs.targets != '[]'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.resolve-targets.outputs.targets) }}
    runs-on: ubuntu-latest
    environment:
      name: "Cloud Run (${{ matrix.target.service }})"
      url: ${{ matrix.target.public_url }}
    steps:
      - name: Append comment with deployment job link
        id: post-start-comment
        if: env.MCP_PR != ''
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ env.MCP_COMMENT_ID }}
          issue-number: ${{ env.MCP_PR }}
          edit-mode: append
          body: |
            > 🚀 **${{ matrix.target.server }} Deploy Job Info**
            >
            > Deploying `${{ matrix.target.source }}` to `${{ matrix.target.public_url }}`.
            > Image: `${{ matrix.target.image }}`
            >
            > ⏳ Job started... [Check job output.](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Checkout deployment target
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.target.ref }}
          # Full history + tags so the package version can be derived from git.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      # The image build context excludes `.git`, so the version is resolved here
      # and passed into the build; otherwise the wheel gets `fallback-version`.
      - name: Resolve package version
        id: package-version
        if: matrix.target.server == 'ops-mcp'
        run: |
          set -euo pipefail
          # A `dunamai` failure yields an empty version, so one guard covers both.
          version="$(uvx dunamai from git --style pep440 || true)"
          [ -n "$version" ] \
            || { echo "::error::Could not resolve the package version from git; the image would be stamped with the fallback version."; exit 1; }
          echo "version=$version" | tee -a "$GITHUB_OUTPUT"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/351139268520/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-ci@internal-airbyte-ai-infra.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify Artifact Registry repository
        run: >
          gcloud artifacts repositories describe "${{ matrix.target.image_repo }}"
          --project="${{ env.GCP_PROJECT }}"
          --location="${{ env.GCP_REGION }}"

      - name: Verify Cloud Run service
        run: >
          gcloud run services describe "${{ matrix.target.service }}"
          --project="${{ env.GCP_PROJECT }}"
          --region="${{ env.GCP_REGION }}"
          --format="value(metadata.name)"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Resolve PyAirbyte requirement
        id: pyairbyte-requirement
        if: matrix.target.server == 'cloud-mcp'
        env:
          REQUESTED_REQUIREMENT: ${{ env.MCP_CLOUD_MCP_PYAIRBYTE_REQUIREMENT }}
          REQUESTED_SOURCE_SHA: ${{ env.MCP_CLOUD_MCP_PYAIRBYTE_SOURCE_SHA }}
          IS_PREVIEW: ${{ matrix.target.is_preview }}
        run: |
          set -euo pipefail
          requirement="$REQUESTED_REQUIREMENT"
          source_sha="${REQUESTED_SOURCE_SHA:-}"
          if [ -n "$source_sha" ]; then
            [ "$IS_PREVIEW" = "true" ] && [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] \
              || { echo "::error::Cloud MCP build-source SHA must be 40 lowercase hexadecimal characters and is preview-only."; exit 1; }
          fi
          if [ -z "$requirement" ]; then
            version="$(curl -fsSL --retry 5 --retry-all-errors https://pypi.org/pypi/airbyte/json | jq -r '.info.version // empty')"
            [ -n "$version" ] \
              || { echo "::error::Could not resolve the latest PyAirbyte version from PyPI."; exit 1; }
            requirement="airbyte==$version"
          fi
          if [[ "$requirement" =~ ^airbyte==([0-9][0-9A-Za-z.+!-]*)$ ]]; then
            version="${BASH_REMATCH[1]}"
            if [[ "$version" =~ \.dev[0-9]+(\+[0-9A-Za-z.]+)?$ ]]; then
              [ "$IS_PREVIEW" = "true" ] && [ -n "$source_sha" ] \
                || { echo "::error::Published Cloud MCP development wheels require preview mode and their exact build checkout SHA."; exit 1; }
              echo "git_sha=$source_sha" >> "$GITHUB_OUTPUT"
            else
              [ -z "$source_sha" ] \
                || { echo "::error::Cloud MCP build-source SHA is only valid with a pinned development wheel; releases require their published lock asset."; exit 1; }
              # PyPI normalizes 1.0.0-rc.44 to 1.0.0rc44; release tags do not.
              tag_version="$(printf '%s' "$version" | sed -E 's/^([0-9]+(\.[0-9]+)*)rc([0-9]+)$/\1-rc.\3/')"
              echo "release_tag=v$tag_version" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$IS_PREVIEW" = "true" ] && [[ "$requirement" =~ ^airbyte\ @\ git\+https://github\.com/airbytehq/PyAirbyte@([0-9a-f]{40})$ ]]; then
            [ -z "$source_sha" ] \
              || { echo "::error::Cloud MCP git requirements already identify their source; do not supply a separate build-source SHA."; exit 1; }
            echo "git_sha=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Cloud MCP requires airbyte==<version> with a release pylock.toml, or an immutable upstream git SHA for previews only. Got: $requirement"
            exit 1
          fi
          echo "requirement=$requirement" | tee -a "$GITHUB_OUTPUT"

      - name: Download PyAirbyte release lock
        if: matrix.target.server == 'cloud-mcp' && steps.pyairbyte-requirement.outputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ steps.pyairbyte-requirement.outputs.release_tag }}
          BUILD_CONTEXT: ${{ matrix.target.build_context }}
        run: >
          curl -fsSL --retry 5 --retry-max-time 60 --max-time 30
          --output "$BUILD_CONTEXT/pylock.toml"
          "https://github.com/airbytehq/PyAirbyte/releases/download/${RELEASE_TAG}/pylock.toml"

      # Branch pushes and published dev wheels have no release asset; export
      # their immutable build source's runtime lock, without resolving dependencies.
      - name: Check out PyAirbyte preview lock source
        if: matrix.target.server == 'cloud-mcp' && steps.pyairbyte-requirement.outputs.git_sha != ''
        uses: actions/checkout@v6
        with:
          repository: airbytehq/PyAirbyte
          ref: ${{ steps.pyairbyte-requirement.outputs.git_sha }}
          path: .pyairbyte-lock-source
          persist-credentials: false

      - name: Export PyAirbyte preview lock
        if: matrix.target.server == 'cloud-mcp' && steps.pyairbyte-requirement.outputs.git_sha != ''
        env:
          BUILD_CONTEXT: ${{ matrix.target.build_context }}
        run: >
          uv export --project .pyairbyte-lock-source --locked --format pylock.toml
          --no-dev --no-emit-project --extra datadog
          --output-file "$GITHUB_WORKSPACE/$BUILD_CONTEXT/pylock.toml"

      - name: Build image
        if: matrix.target.server != 'cloud-mcp'
        env:
          DOCKER_BUILDKIT: "1"
        run: >
          docker build
          --build-arg "PACKAGE_VERSION=${{ steps.package-version.outputs.version }}"
          --file "${{ matrix.target.dockerfile }}"
          --tag "${{ matrix.target.image }}"
          "${{ matrix.target.build_context }}"

      # Retried because this build usually runs seconds after a PyAirbyte
      # release: PyPI's index is CDN-cached per POP, so `uv` inside the build
      # can still resolve a stale index that lacks the requested version.
      - name: Build cloud-mcp image with PyAirbyte requirement
        if: matrix.target.server == 'cloud-mcp'
        uses: nick-fields/retry@v3
        env:
          PYAIRBYTE_REQUIREMENT: ${{ steps.pyairbyte-requirement.outputs.requirement }}
          DOCKER_BUILDKIT: "1"
        with:
          timeout_minutes: 15
          max_attempts: 5
          retry_wait_seconds: 60
          command: >
            docker build
            --build-arg "PYAIRBYTE_REQUIREMENT=${PYAIRBYTE_REQUIREMENT}"
            --file "${{ matrix.target.dockerfile }}"
            --tag "${{ matrix.target.image }}"
            "${{ matrix.target.build_context }}"

      - name: Push image
        run: docker push "${{ matrix.target.image }}"

      - name: Update Cloud Run service image
        run: >
          gcloud run services update "${{ matrix.target.service }}"
          --project="${{ env.GCP_PROJECT }}"
          --region="${{ env.GCP_REGION }}"
          --image="${{ matrix.target.image }}"
          --quiet

      - name: Route traffic to latest revision (production only)
        if: matrix.target.is_preview != 'true'
        run: >
          gcloud run services update-traffic "${{ matrix.target.service }}"
          --project="${{ env.GCP_PROJECT }}"
          --region="${{ env.GCP_REGION }}"
          --to-latest
          --quiet

      - name: Find existing preview comment
        id: find-preview-comment
        if: matrix.target.is_preview == 'true' && env.MCP_PR != ''
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ env.MCP_PR }}
          body-includes: "<!-- ${{ matrix.target.server }}-preview -->"

      - name: Post or update preview comment
        if: matrix.target.is_preview == 'true' && env.MCP_PR != ''
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find-preview-comment.outputs.comment-id }}
          issue-number: ${{ env.MCP_PR }}
          edit-mode: replace
          body: |
            <!-- ${{ matrix.target.server }}-preview -->
            ### 🔍 ${{ matrix.target.server }} Preview

            **Preview URL:** ${{ matrix.target.public_url }}
            **Commit:** `${{ matrix.target.short_sha }}`

            > This preview deploys to a dedicated preview service at `${{ matrix.target.public_url }}`. It shares the same OIDC config and secrets as production. Only one preview is active per service — subsequent deploys to this preview service replace the previous revision.

      - name: Summarize deployment
        env:
          PYAIRBYTE_REQUIREMENT: ${{ steps.pyairbyte-requirement.outputs.requirement }}
        run: |
          {
            printf "%s deployed.\n" "${{ matrix.target.server }}"
            printf "Source: %s\n" "${{ matrix.target.source }}"
            printf "Commit: %s\n" "${{ matrix.target.ref }}"
            printf "Image: %s\n" "${{ matrix.target.image }}"
            printf "Service: %s\n" "${{ matrix.target.service }}"
            printf "URL: %s\n" "${{ matrix.target.public_url }}"
            [ -z "${PYAIRBYTE_REQUIREMENT:-}" ] \
              || printf "PyAirbyte: %s\n" "$PYAIRBYTE_REQUIREMENT"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Append success comment
        if: >
          success() &&
          env.MCP_PR != '' &&
          steps.post-start-comment.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.post-start-comment.outputs.comment-id }}
          issue-number: ${{ env.MCP_PR }}
          edit-mode: append
          reactions: hooray
          body: |
            > ✅ ${{ matrix.target.server }} deploy completed successfully: ${{ matrix.target.public_url }}

      - name: Append failure comment
        if: >
          failure() &&
          env.MCP_PR != '' &&
          steps.post-start-comment.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.post-start-comment.outputs.comment-id }}
          issue-number: ${{ env.MCP_PR }}
          edit-mode: append
          reactions: confused
          body: |
            > ❌ ${{ matrix.target.server }} deploy failed. Check the [job output](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.
