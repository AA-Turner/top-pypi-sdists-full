name: Pytest (Fast)

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

jobs:
  test-build:
    name: Build and Inspect Python Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Detect package changes
        id: package-changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            airbyte-internal-ops:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/pytest-fast.yml'
            airbyte-cloud-cli:
              - 'airbyte-cloud-cli/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/pytest-fast.yml'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Check uv lock file is current
        run: uv lock --check

      - name: Build changed packages
        env:
          AIRBYTE_INTERNAL_OPS_CHANGED: ${{ steps.package-changes.outputs.airbyte-internal-ops }}
          AIRBYTE_CLOUD_CLI_CHANGED: ${{ steps.package-changes.outputs.airbyte-cloud-cli }}
        run: |
          set -euo pipefail
          packages=()
          if [[ "$GITHUB_EVENT_NAME" == "push" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$AIRBYTE_INTERNAL_OPS_CHANGED" == "true" ]]; then
            packages+=("airbyte-internal-ops")
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$AIRBYTE_CLOUD_CLI_CHANGED" == "true" ]]; then
            packages+=("airbyte-cloud-cli")
          fi
          if [[ ${#packages[@]} -eq 0 ]]; then
            echo "No package changes detected."
            exit 0
          fi
          for package in "${packages[@]}"; do
            echo "Building ${package}"
            uv build --package "${package}"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: Packages-${{ github.run_id }}
          path: |
            dist/*.whl
            dist/*.tar.gz

  pytest-fast:
    name: Pytest (Fast)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect package changes
        id: package-changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            airbyte-internal-ops:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'pytest.ini'
              - '.github/workflows/pytest-fast.yml'
            airbyte-cloud-cli:
              - 'airbyte-cloud-cli/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'pytest.ini'
              - '.github/workflows/pytest-fast.yml'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        # `live-tests` carries mitmproxy, which `tests/test_http_metrics.py`
        # needs: without it the whole module skips and the HTTP replay tests
        # are green by absence.
        # `--all-packages` selects workspace packages, not dependency groups.
        run: uv sync --group dev --group live-tests --all-packages

      - name: Run Pytest with Coverage (Fast Tests Only)
        timeout-minutes: 20
        env:
          AIRBYTE_INTERNAL_OPS_CHANGED: ${{ steps.package-changes.outputs.airbyte-internal-ops }}
          AIRBYTE_CLOUD_CLI_CHANGED: ${{ steps.package-changes.outputs.airbyte-cloud-cli }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$AIRBYTE_INTERNAL_OPS_CHANGED" == "true" ]]; then
            uv run pytest --exitfirst --cov=airbyte_ops_mcp --cov-report=xml --cov-report=term -m "not gcs_integration" tests
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$AIRBYTE_CLOUD_CLI_CHANGED" == "true" ]]; then
            uv run pytest --exitfirst airbyte-cloud-cli/tests
          fi
          if [[ "$GITHUB_EVENT_NAME" != "push" && "$GITHUB_EVENT_NAME" != "workflow_dispatch" && "$AIRBYTE_INTERNAL_OPS_CHANGED" != "true" && "$AIRBYTE_CLOUD_CLI_CHANGED" != "true" ]]; then
            echo "No Python package changes detected."
          fi

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload coverage to GitHub Code Quality
        if: always() && hashFiles('./coverage.xml') != ''
        uses: actions/upload-code-coverage@b51da2c3c1b23e04d2d6477cfc34350b1f5cd3e9 # v1
        with:
          file: ./coverage.xml
          language: Python
          label: code-coverage/pytest-fast
          fail-on-error: false
