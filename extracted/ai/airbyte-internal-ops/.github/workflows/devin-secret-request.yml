name: Devin Secret Request

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      action:
        description: >
          The action to perform: 'request' to send an approval request,
          'deliver' to validate approval and deliver the secret, or
          'list' to list available secret names.
        required: true
        type: string
      secret_alias:
        description: >
          The secret to request or deliver. Must exactly match an item
          title in the "devin-on-demand-secrets" 1Password vault.
          Required when action is 'request' or 'deliver'.
        required: false
        type: string
      session_id:
        description: >
          Devin session ID (32-character hex string).
          Required when action is 'request' or 'deliver'.
        required: false
        type: string
      approval_evidence_url:
        description: >
          Slack approval record URL (e.g.
          https://<workspace>.slack.com/archives/...).
          Required when action is 'deliver'.
        required: false
        type: string
      target_approver:
        description: >
          Person to notify for approval (GitHub handle, email, or
          Slack user ID). Required when action is 'request'.
        required: false
        type: string
      expected_request_id:
        description: >
          Request ID from Phase 1. When provided, the approval
          record is validated against this ID for replay protection.
        required: false
        type: string

jobs:
  # ── List action ─────────────────────────────────────────────
  list-secrets:
    name: List Vault Secrets
    if: inputs.action == 'list'
    runs-on: ubuntu-latest
    steps:
      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v1

      - name: List vault secrets
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.DEVIN_ON_DEMAND_SECRETS_BACKEND_OP_AUTH_TOKEN }}
        run: |
          op item list --vault=devin-on-demand-secrets --format=json \
            | jq -c '{available_secrets: [.[].title] | sort, available_count: ([.[].title] | length)}'

  # ── Request action: validate secret name ────────────────────
  validate-secret:
    name: Validate Secret Name
    if: inputs.action == 'request'
    runs-on: ubuntu-latest
    outputs:
      approval_metadata: ${{ steps.prepare.outputs.approval_metadata }}
    steps:
      - name: Validate inputs
        env:
          INPUT_SECRET_ALIAS: ${{ inputs.secret_alias }}
          INPUT_TARGET_APPROVER: ${{ inputs.target_approver }}
          INPUT_SESSION_ID: ${{ inputs.session_id }}
        run: |
          [[ -z "$INPUT_SECRET_ALIAS" ]] \
            && echo "::error::secret_alias is required for 'request' action." \
            && exit 1
          [[ -z "$INPUT_TARGET_APPROVER" ]] \
            && echo "::error::target_approver is required for 'request' action." \
            && exit 1
          [[ -z "$INPUT_SESSION_ID" ]] \
            && echo "::error::session_id is required for 'request' action." \
            && exit 1
          echo "Inputs validated."

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v1

      - name: Validate secret name and prepare request
        id: prepare
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.DEVIN_ON_DEMAND_SECRETS_BACKEND_OP_AUTH_TOKEN }}
          INPUT_SECRET_ALIAS: ${{ inputs.secret_alias }}
        run: |
          set -euo pipefail
          AVAILABLE=$(op item list --vault=devin-on-demand-secrets --format=json | jq -c '[.[].title] | sort')
          if ! echo "$AVAILABLE" | jq -e --arg name "$INPUT_SECRET_ALIAS" 'index($name) != null' > /dev/null 2>&1; then
            jq -cn --arg alias "$INPUT_SECRET_ALIAS" --argjson available "$AVAILABLE" \
              '{phase: "validation_failed", secret_alias: $alias, available_secrets: $available}'
            echo "::error::Secret '$INPUT_SECRET_ALIAS' not found in vault."
            exit 1
          fi
          REQUEST_ID=$(uuidgen)
          METADATA=$(jq -nc --arg alias "$INPUT_SECRET_ALIAS" --arg rid "$REQUEST_ID" '{secret_alias: $alias, request_id: $rid}')
          echo "approval_metadata=$METADATA" >> "$GITHUB_OUTPUT"
          jq -cn --arg rid "$REQUEST_ID" --arg alias "$INPUT_SECRET_ALIAS" \
            '{phase: "approval_requested", request_id: $rid, secret_alias: $alias}'

  # ── Request action: send approval via HITL workflow ─────────
  send-approval:
    name: Send Approval Request
    needs: validate-secret
    if: inputs.action == 'request'
    uses: ./.github/workflows/human-in-the-loop.yml
    with:
      target_person: ${{ inputs.target_approver }}
      message: |
        *Secret access requested:* `${{ inputs.secret_alias }}`
        *Requesting session:* `${{ inputs.session_id }}`

        A Devin session is requesting access to the `${{ inputs.secret_alias }}` secret. If approved, a time-limited 1Password share link will be sent to the requesting session.

        Please review and approve or reject this request.
      agent_session_url: https://app.devin.ai/sessions/${{ inputs.session_id }}
      approval_requested: 'true'
      approval_request_summary: >-
        Grant access to secret `${{ inputs.secret_alias }}`
      approval_metadata: ${{ needs.validate-secret.outputs.approval_metadata }}
      channel_override: human-in-the-loop
      header_emoji: ':key:'
      header_label: Secret Access Request
    secrets:
      SLACK_HYDRA_BOT_TOKEN: ${{ secrets.SLACK_HYDRA_BOT_TOKEN }}
      SLACK_BOT_TOKEN_HITL: ${{ secrets.SLACK_BOT_TOKEN_HITL }}
      SLACK_BOT_TOKEN_AIRBYTE_TEAM: ${{ secrets.SLACK_BOT_TOKEN_AIRBYTE_TEAM }}

  # ── Deliver action ──────────────────────────────────────────
  deliver-secret:
    name: Deliver Secret
    if: inputs.action == 'deliver'
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        env:
          INPUT_SECRET_ALIAS: ${{ inputs.secret_alias }}
          INPUT_SESSION_ID: ${{ inputs.session_id }}
          INPUT_APPROVAL_EVIDENCE_URL: ${{ inputs.approval_evidence_url }}
        run: |
          [[ -z "$INPUT_SECRET_ALIAS" ]] \
            && echo "::error::secret_alias is required for 'deliver' action." \
            && exit 1
          [[ -z "$INPUT_SESSION_ID" ]] \
            && echo "::error::session_id is required for 'deliver' action." \
            && exit 1
          [[ -z "$INPUT_APPROVAL_EVIDENCE_URL" ]] \
            && echo "::error::approval_evidence_url is required for 'deliver' action." \
            && exit 1
          echo "Inputs validated."

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v1

      - name: Validate approval and deliver secret
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_HYDRA_BOT_TOKEN || secrets.SLACK_BOT_TOKEN_HITL || secrets.SLACK_BOT_TOKEN_AIRBYTE_TEAM }}
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.DEVIN_ON_DEMAND_SECRETS_BACKEND_OP_AUTH_TOKEN }}
          DEVIN_API_KEY: ${{ secrets.DEVIN_AI_ADMIN_SERVICE_TOKEN }}
          DEVIN_ORG_ID: ${{ vars.DEVIN_AI_ORG_ID }}
          INPUT_SESSION_ID: ${{ inputs.session_id }}
          INPUT_SECRET_ALIAS: ${{ inputs.secret_alias }}
          INPUT_APPROVAL_EVIDENCE_URL: ${{ inputs.approval_evidence_url }}
          INPUT_EXPECTED_REQUEST_ID: ${{ inputs.expected_request_id }}
        run: |
          uv run airbyte-ops devin secret-request \
            --session "$INPUT_SESSION_ID" \
            --secret-alias "$INPUT_SECRET_ALIAS" \
            --approval-evidence-url "$INPUT_APPROVAL_EVIDENCE_URL" \
            ${INPUT_EXPECTED_REQUEST_ID:+--expected-request-id "$INPUT_EXPECTED_REQUEST_ID"}
