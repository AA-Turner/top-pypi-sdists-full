name: Lint Check

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read
  pull-requests: read

jobs:
  ruff-lint-check:
    name: Ruff Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect package changes
        id: package-changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            airbyte-internal-ops:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'ruff.toml'
              - '.github/workflows/lint-check.yml'
            airbyte-cloud-cli:
              - 'airbyte-cloud-cli/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'ruff.toml'
              - '.github/workflows/lint-check.yml'
            airbyte-ops-webapp:
              - 'airbyte-ops-webapp/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'ruff.toml'
              - '.github/workflows/lint-check.yml'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --group dev --all-packages

      - name: Run lint check
        env:
          AIRBYTE_INTERNAL_OPS_CHANGED: ${{ steps.package-changes.outputs.airbyte-internal-ops }}
          AIRBYTE_CLOUD_CLI_CHANGED: ${{ steps.package-changes.outputs.airbyte-cloud-cli }}
          AIRBYTE_OPS_WEBAPP_CHANGED: ${{ steps.package-changes.outputs.airbyte-ops-webapp }}
        run: |
          set -euo pipefail
          targets=()
          if [[ "$GITHUB_EVENT_NAME" == "push" || "$AIRBYTE_INTERNAL_OPS_CHANGED" == "true" ]]; then
            targets+=("src" "tests")
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" || "$AIRBYTE_CLOUD_CLI_CHANGED" == "true" ]]; then
            targets+=("airbyte-cloud-cli")
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" || "$AIRBYTE_OPS_WEBAPP_CHANGED" == "true" ]]; then
            targets+=("airbyte-ops-webapp")
          fi
          if [[ ${#targets[@]} -eq 0 ]]; then
            echo "No Python package changes detected."
            exit 0
          fi
          uv run ruff check "${targets[@]}"

  deptry-check:
    name: Dependency Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect package changes
        id: package-changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            airbyte-internal-ops:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/lint-check.yml'
            airbyte-cloud-cli:
              - 'airbyte-cloud-cli/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/lint-check.yml'
            airbyte-ops-webapp:
              - 'airbyte-ops-webapp/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/lint-check.yml'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --group dev --all-packages

      - name: Run dependency analysis
        env:
          AIRBYTE_INTERNAL_OPS_CHANGED: ${{ steps.package-changes.outputs.airbyte-internal-ops }}
          AIRBYTE_CLOUD_CLI_CHANGED: ${{ steps.package-changes.outputs.airbyte-cloud-cli }}
          AIRBYTE_OPS_WEBAPP_CHANGED: ${{ steps.package-changes.outputs.airbyte-ops-webapp }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" || "$AIRBYTE_INTERNAL_OPS_CHANGED" == "true" ]]; then
            uv run deptry .
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" || "$AIRBYTE_CLOUD_CLI_CHANGED" == "true" ]]; then
            uv run deptry airbyte-cloud-cli --config airbyte-cloud-cli/pyproject.toml
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" || "$AIRBYTE_OPS_WEBAPP_CHANGED" == "true" ]]; then
            uv run deptry airbyte-ops-webapp --config airbyte-ops-webapp/pyproject.toml
          fi
          if [[ "$GITHUB_EVENT_NAME" != "push" && "$AIRBYTE_INTERNAL_OPS_CHANGED" != "true" && "$AIRBYTE_CLOUD_CLI_CHANGED" != "true" && "$AIRBYTE_OPS_WEBAPP_CHANGED" != "true" ]]; then
            echo "No Python package changes detected."
          fi

  pyrefly-check:
    name: Type Checking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect package changes
        id: package-changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            airbyte-internal-ops:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'pyrefly.toml'
              - '.github/workflows/lint-check.yml'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --group dev --all-packages

      - name: Run type check
        env:
          AIRBYTE_INTERNAL_OPS_CHANGED: ${{ steps.package-changes.outputs.airbyte-internal-ops }}
        run: |
          set -euo pipefail
          targets=()
          if [[ "$GITHUB_EVENT_NAME" == "push" || "$AIRBYTE_INTERNAL_OPS_CHANGED" == "true" ]]; then
            targets+=("src/airbyte_ops_mcp/mcp")
          fi
          if [[ ${#targets[@]} -eq 0 ]]; then
            echo "No Python package changes detected."
            exit 0
          fi
          uv run pyrefly check "${targets[@]}"
