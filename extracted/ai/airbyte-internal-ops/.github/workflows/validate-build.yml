name: Validate Build

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read
  pull-requests: read

jobs:
  build-check:
    name: Build and Inspect Python Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Detect package changes
        id: package-changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            airbyte-internal-ops:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/validate-build.yml'
            airbyte-cloud-cli:
              - 'airbyte-cloud-cli/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/validate-build.yml'

      - name: Disable direct references for build check
        run: |
          echo "Before:" && grep allow-direct-references pyproject.toml
          sed -i 's/allow-direct-references *= *true/allow-direct-references = false/' pyproject.toml
          echo "After:" && grep allow-direct-references pyproject.toml

      - name: Build changed packages
        env:
          AIRBYTE_INTERNAL_OPS_CHANGED: ${{ steps.package-changes.outputs.airbyte-internal-ops }}
          AIRBYTE_CLOUD_CLI_CHANGED: ${{ steps.package-changes.outputs.airbyte-cloud-cli }}
        run: |
          set -euo pipefail
          packages=()
          if [[ "$GITHUB_EVENT_NAME" == "push" || "$AIRBYTE_INTERNAL_OPS_CHANGED" == "true" ]]; then
            packages+=("airbyte-internal-ops")
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" || "$AIRBYTE_CLOUD_CLI_CHANGED" == "true" ]]; then
            packages+=("airbyte-cloud-cli")
          fi
          if [[ ${#packages[@]} -eq 0 ]]; then
            echo "No package changes detected."
            exit 0
          fi
          for package in "${packages[@]}"; do
            echo "Building ${package}"
            uv build --package "${package}"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Packages-${{ github.run_id }}
          path: |
            dist/*.whl
            dist/*.tar.gz
