name: Release Drafter

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

concurrency:
  group: release-drafter
  cancel-in-progress: false

jobs:
  draft_release:
    name: Draft Release (${{ matrix.package.name }})
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: airbyte-internal-ops
            tag-prefix: v
            config-name: release-drafter-airbyte-internal-ops.yml
            dist-dir: dist/airbyte-internal-ops
            # Main package auto-publishes on push to main; the CLI stays draft-only.
            auto-publish: true
          - name: airbyte-cloud-cli
            tag-prefix: airbyte-cloud-cli/v
            config-name: release-drafter-airbyte-cloud-cli.yml
            dist-dir: dist/airbyte-cloud-cli
            auto-publish: false
    steps:
      # Stage 1: create/update the draft release with a "NOT READY" banner
      # (creating it if missing) before any artifacts exist. The banner links
      # to this workflow run so admins know a build is in flight, and the
      # release id is captured to finalize the exact same draft in stage 2.
      - name: Create draft release (not ready)
        uses: aaronsteers/semantic-pr-release-drafter@bf6b3e79da46f4e5414adc520269b16e05f91d41 # v2.4.4
        id: release-drafter
        with:
          config-name: ${{ matrix.package.config-name }}
          not-ready: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build package
        env:
          VERSION: ${{ steps.release-drafter.outputs.resolved-version }}
          PACKAGE: ${{ matrix.package.name }}
          DIST_DIR: ${{ matrix.package.dist-dir }}
        run: |
          echo "Building ${PACKAGE} with resolved version: ${VERSION}"
          UV_DYNAMIC_VERSIONING_BYPASS="${VERSION}" uv build --package "${PACKAGE}" --out-dir "${DIST_DIR}"

      # Stage 2: finalize the exact draft created in stage 1 (point-read by id),
      # attaching the built artifacts and removing the "NOT READY" banner.
      - name: Finalize draft release with artifacts
        uses: aaronsteers/semantic-pr-release-drafter@bf6b3e79da46f4e5414adc520269b16e05f91d41 # v2.4.4
        with:
          config-name: ${{ matrix.package.config-name }}
          prepared-release-id: ${{ steps.release-drafter.outputs.id }}
          attach-files: |
            ${{ matrix.package.dist-dir }}/*.whl
            ${{ matrix.package.dist-dir }}/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate as GitHub App
        if: github.event_name == 'push' && matrix.package.auto-publish
        id: get-app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.OCTAVIA_BOT_APP_ID }}
          private-key: ${{ secrets.OCTAVIA_BOT_PRIVATE_KEY }}

      - name: Publish release
        if: github.event_name == 'push' && matrix.package.auto-publish
        uses: aaronsteers/semantic-pr-release-drafter@bf6b3e79da46f4e5414adc520269b16e05f91d41 # v2.4.4
        with:
          config-name: ${{ matrix.package.config-name }}
          # Publish only after all assets are attached; manual dispatches leave the draft in place.
          prepared-release-id: ${{ steps.release-drafter.outputs.id }}
          publish: true
        env:
          # App token so the published release triggers publish.yml (GITHUB_TOKEN-created events don't spawn workflow runs).
          GITHUB_TOKEN: ${{ steps.get-app-token.outputs.token }}
