# CI smoke test for regression tests code changes
# Runs a lightweight regression test to validate regression tests code works correctly
#
# This workflow does NOT reuse connector-regression-test.yml because that
# workflow is designed for PR-based builds (requires connector_name + pr).
# Instead, we invoke the CLI directly with a pre-built public image so
# no credentials, PR checkout, or image build step is needed.
name: Regression Tests CI

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'src/airbyte_ops_mcp/regression_tests/**'
      - 'src/airbyte_ops_mcp/mcp/regression_tests.py'
      - '.github/workflows/regression-tests-ci.yml'
      - '.github/workflows/connector-regression-test.yml'

  # Allow manual triggering for testing
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Regression Tests Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev --all-packages

      - name: Run spec smoke test
        run: |
          # Use source-pokeapi as a stable, public connector for smoke testing.
          # spec is the fastest command and doesn't require credentials.
          uv run airbyte-ops cloud connector regression-test \
            --skip-compare \
            --test-image "airbyte/source-pokeapi:0.3.0" \
            --command spec \
            --output-dir /tmp/regression_test_artifacts
