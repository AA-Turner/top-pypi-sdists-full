# CI smoke test for regression tests code changes
# Runs a lightweight regression test to validate regression tests code works correctly
#
# This workflow does NOT reuse connector-regression-test.yml because that
# workflow is designed for PR-based builds (requires connector_name + pr).
# Instead, we invoke the CLI directly with a pre-built public image so
# no credentials, PR checkout, or image build step is needed.
name: Regression Tests CI

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'src/airbyte_ops_mcp/regression_tests/**'
      - 'src/airbyte_ops_mcp/mcp/connector_qa.py'
      - '.github/workflows/regression-tests-ci.yml'
      - '.github/workflows/connector-regression-test.yml'

  # Allow manual triggering for testing
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Regression Tests Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        # `live-tests` carries mitmproxy. This job runs `--skip-compare`, so it
        # never records or replays; the group is here so the smoke test exercises
        # the same capture path a real comparison takes rather than the
        # mitmdump-missing fallback.
        # `--all-packages` selects workspace packages, not dependency groups.
        run: uv sync --group dev --group live-tests --all-packages

      - name: Run spec smoke test
        run: |
          # Use source-pokeapi as a stable, public connector for smoke testing.
          # spec is the fastest command and doesn't require credentials.
          uv run airbyte-ops cloud connector regression-test \
            --skip-compare \
            --test-image "airbyte/source-pokeapi:0.3.0" \
            --command spec \
            --output-dir /tmp/regression_test_artifacts

      - name: Assert the HTML report is self-contained
        run: |
          # The report is read from a downloaded artifact over file://, so it
          # must load no scripts and no remote assets.
          REPORT=/tmp/regression_test_artifacts/report.html
          test -s "$REPORT"
          grep -q '<!DOCTYPE html>' "$REPORT"
          # Hyperlinks to the workflow run are fine; loading an asset is not.
          if grep -qE '<(script|link|img|iframe|object|embed)\b' "$REPORT"; then
            echo "::error::report.html references an external asset or script"
            exit 1
          fi
          # The same rule for CSS, which can fetch over the network too.
          if grep -qE '@import|url\(\s*["'"'"']?https?:' "$REPORT"; then
            echo "::error::report.html loads a remote stylesheet or resource from CSS"
            exit 1
          fi

      # Named to match `ci_output.github_artifact_name("spec")`, which is the name
      # the report it contains tells the reader to look for.
      - name: Upload smoke test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-test-artifacts-spec-${{ github.run_id }}
          # Recorded HTTP dumps are deliberately excluded: they hold full
          # upstream response bodies (i.e. real customer data) and grow with
          # everything the connector downloaded. They are consumed during the
          # run -- metrics, and the target's replay corpus -- and have no value
          # in the zip.
          path: |
            /tmp/regression_test_artifacts/
            !/tmp/regression_test_artifacts/**/*.mitm
            !/tmp/regression_test_artifacts/**/*.har
          retention-days: 2
