[project]
name = "dlthub-client"
version = "0.28.4"
description = "CLI tool for accessing dltHub runtime"
authors = [{ name = "dltHub Inc.", email = "services@dlthub.com" }]
requires-python = ">=3.10, <3.15"
readme = "README.md"
license = "Apache-2.0"
maintainers = [
    { name = "Marcin Rudolf", email = "marcin@dlthub.com" },
    { name = "David Sharf", email = "dave@dlthub.com" },
]
keywords = ["etl"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "httpx>=0.26.0",
    "pyjwt>=2.13.0",
    "cron-descriptor>=1.2.32",
    "croniter>=6.0.0",
    "tabulate>=0.9.0",
    "attrs>=23.2.0",
    "pathspec>=0.11.2",
    # For its `timeout`: `re` cannot be interrupted off the main thread, so an
    # agent-written backtracking pattern would wedge the MCP server.
    "regex>=2024.4.16",
    "typing-extensions>=4.9",
]

[dependency-groups]
dev = [
    # dlt is a dev dependency. set the minimal supported version
    # tests should run on minimal, lockfile and maximal versions
    "dlt>=1.27.1",
    "pytest>=9.0.3,<10",
    "ruff>=0.2.1",
    "mypy>=1.8.0",
    "isort>=6.1.0",
    "pyyaml>=6",
    "types-PyYAML>=5.4.1",
    "pytest-console-scripts>=1.4.1,<2",
    "pytest-timeout>=2.3.1,<3",
    "types-tabulate>=0.9.0",
    "types-python-dateutil>=2.9.0.20251115",
    "marimo>=0.23.9",
    # Only so tests can register and call the tools; it shadows the
    # docstring_parser pydoclint needs, hence the out-of-tree lint-sdk-docs.
    "fastmcp>=4.0.3,<5",
    "types-regex>=2024.4.16",
]
# Its own group, not `dev`: fastmcp's docstring-parser shadows the
# docstring_parser_fork pydoclint needs, so the two cannot share an
# environment. A group still resolves through uv.lock, unlike `--with`.
docs-lint = [
    "flake8>=7.1.0,<8",
    "pydoclint>=0.9.1,<0.10",
]

[tool.uv]
# Add constraints for transitory dependencies, usually a result of a dependabot alert
constraint-dependencies = [
    "urllib3>=2.7.0",
    "aiohttp>=3.14.1",
    "pyasn1>=0.6.4",
    "pygments>=2.20.0",
    "gitpython>=3.1.58",
    "idna>=3.15",
    "pymdown-extensions>=11.0.1",
    "requests>=2.33.0",
    "starlette>=1.3.1",
]

[tool.uv.sources]
# dlt = { path = "../../dlt/.worktrees/feat-3913-split-dlthub/", editable = true }
# dlt = { git = "https://github.com/dlt-hub/dlt.git", rev = "feat/workspace-manifest-concept" }
# dlt = { url="https://github.com/dlt-hub/dlt/archive/refs/heads/chore/cli-patches.zip?v=4"}

# mark as OSS dlt extension
[project.entry-points.dlt]
# must belong to dlt-plugins
dlthub_client = "dlt_runtime.__plugin__"


[tool.pytest.ini_options]
pythonpath = ["."]
norecursedirs = [".direnv", ".eggs", "build", "dist"]
addopts = "--showlocals --durations 10 --strict-markers"
xfail_strict = true
timeout = 1800
faulthandler_timeout = 1500
log_cli_level = "INFO"
console_output_style = "count"
python_files = ["test_*.py", "*_test.py"]
python_functions = ["*_test", "test_*"]
filterwarnings = ["ignore::DeprecationWarning"]
# Registered so a typo in the marker name fails loudly instead of silently
# leaving the autouse storage fixture in place.
markers = [
    "skip_autouse_test_storage: opt out of the workspace-storage fixture that chdirs",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
packages = ["dlt_runtime", "dlthub_mcp", "dlthub_sdk"]
# hatchling follows .gitignore and will include all files in gitindex under `dlt`
include = [
    "LICENSE.txt",
    "README.md",
]

[tool.hatch.build.targets.wheel]
packages = ["dlt_runtime", "dlthub_mcp", "dlthub_sdk"]
include = [
    "LICENSE.txt",
    "README.md",
]


[tool.mypy]
python_version="3.10"
ignore_missing_imports=false
strict_optional=true
warn_redundant_casts=true
disallow_any_generics=true
disallow_untyped_defs=true
check_untyped_defs=true
warn_return_any=true
namespace_packages=true
warn_unused_ignores=true
show_error_codes=true
# Keep this the only mypy config: a mypy.ini alongside it shadows the whole block,
# silently disabling warn_unused_ignores, which tests/sdk/test_mode_typing.py needs.
exclude="dlthub_sdk/_gen/|tests/cases/"

[[tool.mypy.overrides]]
module = "mcp.*,ruamel.*"
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "cron_descriptor.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
warn_return_any = false

[tool.ruff]
extend-exclude = [
    "dlthub_sdk/_gen",
]

[tool.ruff.lint]
# D* is deliberately on only for dlthub_sdk (see per-file-ignores): there the
# docstrings are the reference docs IDEs render, unlike the rest of the repo.
# D202 is also what keeps the generated tree stable across regeneration.
extend-select = ["TID251", "D", "RUF022"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# RUF022: the client generator invokes ruff on the paths it writes, which bypasses
#         extend-exclude, so the generated __all__ needs ignoring by path or every
#         regeneration reorders it.
"dlthub_sdk/_gen/**" = ["RUF022"]
# D105: a dunder's docstring is not what an IDE shows on hover.
# D107: constructor args belong in the class docstring (Google convention,
#       enforced the other way by pydoclint DOC301).
"dlthub_sdk/**" = ["D105", "D107"]
"dlt_runtime/**" = ["D"]
"tests/**" = ["D"]
"tools/**" = ["D"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.TypedDict".msg = "Use dlt.common.typing.TypedDict instead"
"typing.NotRequired".msg = "Use dlt.common.typing.NotRequired instead"
"typing.ParamSpec".msg = "Use dlt.common.typing.ParamSpec instead"
"typing.Concatenate".msg = "Use dlt.common.typing.Concatenate instead"
"typing.TypeAlias".msg = "Use dlt.common.typing.TypeAlias instead"
"typing.Self".msg = "Use dlt.common.typing.Self instead"
"typing.Never".msg = "Use dlt.common.typing.Never instead"
"typing.Unpack".msg = "Use dlt.common.typing.Unpack instead"
"typing.Annotated".msg = "Use dlt.common.typing.Annotated instead"
"typing.get_original_bases".msg = "Use dlt.common.typing.get_original_bases instead"
"typing_extensions.NotRequired".msg = "Use dlt.common.typing.NotRequired instead"

[tool.isort]
extend_skip = [
    "dlthub_sdk/_gen",
]
known_first_party = ["dlt_runtime", "dlthub_mcp", "dlthub_sdk"]
known_dlt_runtime_common = ["dlt_runtime_common"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "DLT_RUNTIME_COMMON", "FIRSTPARTY", "LOCALFOLDER"]
default_section = "THIRDPARTY"
line_length = 88
combine_as_imports = true
lines_between_sections = 1
multi_line_output = 3
include_trailing_comma = true
use_parentheses = true
ensure_newline_before_comments = true
import_heading_stdlib = "Python internals"
import_heading_thirdparty = "Other libraries"
import_heading_dlt_runtime_common = "dltHub runtime common package"
import_heading_firstparty = "Current package"

