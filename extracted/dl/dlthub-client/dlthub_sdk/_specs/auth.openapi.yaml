components:
  schemas:
    ErrorResponse:
      properties:
        code:
          description: Machine-readable error code, when the error has one
          type: string
        detail:
          description: Human-readable description of the error
          type: string
        extra:
          description: Additional error details (free-form)
        status_code:
          description: The HTTP status code
          type: integer
      title: ErrorResponse
      type: object
    IssueAuthorizationUrlSessionRequest:
      properties:
        code_challenge:
          type: string
        redirect_uri:
          type: string
        state:
          type: string
      required:
      - code_challenge
      - redirect_uri
      - state
      title: IssueAuthorizationUrlSessionRequest
      type: object
    IssueAuthorizationUrlSessionResponse:
      properties:
        authorization_url:
          type: string
      required:
      - authorization_url
      title: IssueAuthorizationUrlSessionResponse
      type: object
    IssueDeviceCodeSessionResponse:
      properties:
        device_code:
          type: string
        interval:
          type: integer
        user_code:
          type: string
        verification_uri:
          type: string
        verification_uri_complete:
          type: string
      required:
      - device_code
      - interval
      - user_code
      - verification_uri
      - verification_uri_complete
      title: IssueDeviceCodeSessionResponse
      type: object
    IssueSwapCodeSessionRequest:
      properties:
        refresh_token:
          type: string
      required:
      - refresh_token
      title: IssueSwapCodeSessionRequest
      type: object
    IssueSwapCodeSessionResponse:
      properties:
        expires_in:
          type: integer
        swap_code:
          type: string
      required:
      - expires_in
      - swap_code
      title: IssueSwapCodeSessionResponse
      type: object
    RedeemAuthorizationCodeSessionRequest:
      properties:
        code:
          type: string
        code_verifier:
          type: string
      required:
      - code
      - code_verifier
      title: RedeemAuthorizationCodeSessionRequest
      type: object
    RedeemDeviceCodeSessionRequest:
      properties:
        device_code:
          type: string
      required:
      - device_code
      title: RedeemDeviceCodeSessionRequest
      type: object
    RefreshSessionRequest:
      properties:
        refresh_token:
          type: string
      required:
      - refresh_token
      title: RefreshSessionRequest
      type: object
    RefreshSessionResponse:
      properties:
        jwt:
          type: string
        refresh_token:
          type: string
      required:
      - jwt
      - refresh_token
      title: RefreshSessionResponse
      type: object
    RevokeSessionRequest:
      properties:
        refresh_token:
          type: string
      required:
      - refresh_token
      title: RevokeSessionRequest
      type: object
    UserSessionResponse:
      properties:
        email:
          type: string
        id:
          format: uuid
          type: string
        jwt:
          type: string
        refresh_token:
          type: string
      required:
      - email
      - id
      - jwt
      - refresh_token
      title: UserSessionResponse
      type: object
  securitySchemes:
    BearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  description: Internal API for our auth service
  title: Auth
  version: 1.0.0
openapi: 3.1.0
paths:
  /auth/v1/sessions/-issue-authorization-url:
    post:
      deprecated: false
      operationId: issue_authorization_url_session
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueAuthorizationUrlSessionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueAuthorizationUrlSessionResponse'
          description: OK
          headers: {}
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      summary: IssueAuthorizationUrlSession
  /auth/v1/sessions/-issue-device-code:
    post:
      deprecated: false
      operationId: issue_device_code_session
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueDeviceCodeSessionResponse'
          description: OK
          headers: {}
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      summary: IssueDeviceCodeSession
  /auth/v1/sessions/-issue-swap-code:
    post:
      deprecated: false
      operationId: issue_swap_code_session
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueSwapCodeSessionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueSwapCodeSessionResponse'
          description: OK
          headers: {}
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      summary: Mint a short-lived, single-use code to swap a CLI session into the
        web app
  /auth/v1/sessions/-redeem-authorization-code:
    post:
      deprecated: false
      operationId: redeem_authorization_code_session
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemAuthorizationCodeSessionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSessionResponse'
          description: OK
          headers: {}
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      summary: RedeemAuthorizationCodeSession
  /auth/v1/sessions/-redeem-device-code:
    post:
      deprecated: false
      operationId: redeem_device_code_session
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemDeviceCodeSessionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSessionResponse'
          description: OK
          headers: {}
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      summary: RedeemDeviceCodeSession
  /auth/v1/sessions/-refresh:
    post:
      deprecated: false
      operationId: refresh_session
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshSessionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshSessionResponse'
          description: OK
          headers: {}
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      summary: Exchange a refresh token for a new JWT and refresh token pair
  /auth/v1/sessions/-revoke:
    post:
      deprecated: false
      operationId: revoke_session
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeSessionRequest'
        required: true
      responses:
        '204':
          description: No Content
          headers: {}
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      summary: RevokeSession
servers:
- url: https://api.dlthub.com
