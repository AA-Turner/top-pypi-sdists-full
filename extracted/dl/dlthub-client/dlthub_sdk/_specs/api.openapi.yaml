  /api/v1/workspaces/{workspace_id}/jobs/-trigger:
    post:
      deprecated: false
      description: '

        Triggers jobs by `job_ids` and/or by `selectors`. A job named in `job_ids`
        fires its

        `default_trigger`, or `manual:<job_ref>` if it has none. A selector is matched
        against each

        job''s triggers with shell-style wildcards, e.g. `tag:backfill`, `schedule:*`,

        `manual:jobs.my_module.*`; a bare trigger type like `schedule` means `schedule:*`,
        and `batch`

        (or `job`), `interactive` and `stream` select every trigger of jobs of that
        type. A job

        matched by a selector fires the trigger it matched. When a job is matched
        both by id and by

        selector, it fires its `default_trigger` if that is among the matched triggers,
        otherwise

        one of the matched triggers. Archived jobs are never matched.


        Jobs start upstream first, and each must pass the freshness check: a job whose
        upstream is

        also triggered in this request is skipped with `skipped_upstream_pending`,
        and a job whose

        upstream is not fresh is skipped with `skipped_fresh`. To start a single job
        regardless of

        its upstreams, use `create_job_run` with `skip_freshness=true`.


        Runs start one by one; a failure part-way through leaves the runs created
        before it.


        Answers a receipt: `succeeded` jobs started a run, `skipped` jobs did not
        (their `status` and

        `reasons` say why), and `failed` lists requested ids that name no job or an
        archived job.

        `dry_run` previews which jobs match and pass the freshness check, without
        creating runs.


        Requires the viewer role (or higher) in the workspace. Viewers may only run
        jobs that use the

        read-only `access` profile (by default interactive and agent jobs); any other
        profile needs

        the developer role, and a single such job rejects the whole request with 403.

