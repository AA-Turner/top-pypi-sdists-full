components:
  schemas:
    AttentionReason:
      description: Why a job run needs an operator's look. A run lists every one that
        applies, in this order.
      enum:
      - failed
      - empty_run
      - long_running
      title: AttentionReason
      type: string
    BulkItemFailure:
      properties:
        detail:
          description: Why it failed.
          type: string
        ref:
          description: The item that failed, by its id or natural key.
          type: string
      required:
      - detail
      - ref
      title: BulkItemFailure
      type: object
    CancelJobRunsRequest:
      properties:
        dry_run:
          default: false
          description: Preview which runs would be cancelled, without cancelling them.
          type: boolean
        job_run_ids:
          description: Runs to cancel; a run that is already finished or being cancelled
            is skipped.
          items:
            format: uuid
            type: string
          minItems: 1
          type: array
      required:
      - job_run_ids
      title: CancelJobRunsRequest
      type: object
    CancelJobRunsResponse:
      properties:
        failed:
          description: Requested runs that do not exist in the workspace.
          items:
            $ref: '#/components/schemas/BulkItemFailure'
          type: array
        skipped:
          description: Runs already finished or already being cancelled.
          items:
            $ref: '#/components/schemas/CancelledJobRun'
          type: array
        succeeded:
          description: Runs moved to `cancelling` (or that would be, in dry-run).
          items:
            $ref: '#/components/schemas/CancelledJobRun'
          type: array
      required:
      - failed
      - skipped
      - succeeded
      title: CancelJobRunsResponse
      type: object
    CancelledJobRun:
      properties:
        job_ref:
          description: Job reference of the cancelled run.
          type: string
        job_run_id:
          description: ID of the cancelled run.
          format: uuid
          type: string
        job_run_number:
          description: Number of the run within its job; numbers repeat across jobs.
          type: integer
        previous_status:
          anyOf:
          - $ref: '#/components/schemas/RunStatus'
          - type: string
          description: Status of the run when the cancel request arrived.
      required:
      - job_ref
      - job_run_id
      - job_run_number
      - previous_status
      title: CancelledJobRun
      type: object
    ConfigurationResponse:
      properties:
        content_hash:
          description: 'Hash of the package contents: base64 SHA3-256 over each file''s
            path and digest, as dlt computes when building the package; identical
            file sets give identical hashes.'
          type: string
        created_at:
          description: When it was created.
          format: date-time
          type: string
        created_by:
          description: The `organization_membership_id` of the member who uploaded
            it.
          format: uuid
          type: string
        file_count:
          description: Number of files in the package.
          type: integer
        id:
          description: Unique ID (a UUID).
          format: uuid
          type: string
        profiles:
          description: Profile names found in `<profile>.config.toml` / `<profile>.secrets.toml`
            file names, sorted.
          items:
            type: string
          type: array
        size_bytes:
          description: Size of the uploaded package in bytes.
          type: integer
        updated_at:
          description: When it was last changed.
          format: date-time
          type: string
        version:
          description: Version number within the workspace, starting at 1 and incremented
            by each upload.
          type: integer
        workspace_id:
          description: The ID of the workspace it belongs to.
          format: uuid
          type: string
      required:
      - content_hash
      - created_at
      - created_by
      - file_count
      - id
      - profiles
      - size_bytes
      - updated_at
      - version
      - workspace_id
      title: ConfigurationResponse
      type: object
    CreateJobRunRequest:
      properties:
        job_id:
          description: The ID of the job to run.
          format: uuid
          type: string
        mode:
          $ref: '#/components/schemas/RunMode'
          default: always
          description: 'How to create a run: `always` creates a new run; `when_not_running`
            returns the job''s pending, starting or running run if it has one, otherwise
            creates a new one.'
        profile:
          description: The profile to run under; defaults to the job's own profile.
          oneOf:
          - type: string
          - type: 'null'
        refresh:
          default: false
          description: 'Start the run as a refresh: the job''s progress goes back
            to its interval start and the run receives `refresh: true` in its run
            context, leaving what to reload to the job''s code. The progress of the
            jobs downstream of it is reset too. Ignored when the job''s `refresh_propagation`
            is `block`.'
          type: boolean
        skip_freshness:
          default: false
          description: Start the run even if its upstream jobs are not fresh. When
            false and an upstream is stale, no run is created and the call answers
            409 `upstream_not_fresh`.
          type: boolean
        trigger:
          description: The trigger recorded on the run, e.g. `manual:jobs.my_job`,
            `schedule:0 8 * * *`. Must be a valid trigger string.
          type: string
      required:
      - job_id
      - trigger
      title: CreateJobRunRequest
      type: object
    CreateWorkspaceRequest:
      properties:
        description:
          description: Free-text description of the workspace; `null` when none is
            set.
          oneOf:
          - type: string
          - type: 'null'
        name:
          description: The name of the workspace
          type: string
      required:
      - description
      - name
      title: CreateWorkspaceRequest
      type: object
    DataplaneCatalog:
      properties:
        items:
          description: The available data planes.
          items:
            $ref: '#/components/schemas/DataplaneResponse'
          type: array
      required:
      - items
      title: DataplaneCatalog
      type: object
    DataplaneResponse:
      properties:
        description:
          description: Optional note about the data plane; `null` when there is none.
          oneOf:
          - type: string
          - type: 'null'
        id:
          description: Data plane id, e.g. `eu1`; also the subdomain of its URL.
          type: string
        name:
          description: Human-readable data plane name.
          type: string
        region:
          description: Cloud region the data plane runs in, e.g. `europe-west4`.
          type: string
      required:
      - id
      - name
      - region
      title: DataplaneResponse
      type: object
    DeployWorkspaceRequest:
      properties:
        deployment_module:
          description: Deployment module the jobs come from, e.g. `__deployment__`
            for a standard deploy. `null` makes an ad-hoc deploy, which never archives
            jobs.
          oneOf:
          - type: string
          - type: 'null'
        description:
          description: Workspace description, e.g. from the `__deployment__` module
            docstring. Applied only when `deployment_module` is `__deployment__`.
          oneOf:
          - type: string
          - type: 'null'
        dry_run:
          default: false
          description: Preview the changes without saving them. Created and updated
            jobs then carry the zero UUID as `id` and version 0.
          type: boolean
        job_definition_engine_version:
          description: Not used; send the value `dlt` produces.
          type: integer
        job_definition_hash:
          description: Not used; send the value `dlt` produces.
          type: string
        jobs:
          description: Job definitions from the deployment manifest.
          items:
            additionalProperties: {}
            type: object
          type: array
      required:
      - job_definition_engine_version
      - job_definition_hash
      - jobs
      title: DeployWorkspaceRequest
      type: object
    DeployWorkspaceResponse:
      properties:
        deployment_module:
          description: The deployment module the deploy was scoped to.
          oneOf:
          - type: string
          - type: 'null'
        job_receipt:
          $ref: '#/components/schemas/JobsDeployReceipt'
          description: What a deploy did to the workspace's jobs.
        warnings:
          description: Always empty at present.
          items:
            type: string
          type: array
      required:
      - job_receipt
      - warnings
      title: DeployWorkspaceResponse
      type: object
    DeployedJob:
      properties:
        job:
          $ref: '#/components/schemas/JobResponse'
          description: The job as it stands after the deploy.
        outcome:
          anyOf:
          - $ref: '#/components/schemas/JobDeployOutcome'
          - type: string
          description: What the deploy did to the job.
        previous_version:
          description: The version an updated job had before the deploy.
          oneOf:
          - $ref: '#/components/schemas/JobVersionResponse'
          - type: 'null'
      required:
      - job
      - outcome
      title: DeployedJob
      type: object
    DeploymentResponse:
      properties:
        content_hash:
          description: 'Hash of the package contents: base64 SHA3-256 over each file''s
            path and digest, as dlt computes when building the package; identical
            file sets give identical hashes.'
          type: string
        created_at:
          description: When it was created.
          format: date-time
          type: string
        created_by:
          description: The `organization_membership_id` of the member who uploaded
            it.
          format: uuid
          type: string
        file_count:
          description: Number of files in the package.
          type: integer
        id:
          description: Unique ID (a UUID).
          format: uuid
          type: string
        requirements_size_bytes:
          description: Size of the uploaded requirements file in bytes.
          type: integer
        size_bytes:
          description: Size of the uploaded package in bytes.
          type: integer
        updated_at:
          description: When it was last changed.
          format: date-time
          type: string
        version:
          description: Version number within the workspace, starting at 1 and incremented
            by each upload.
          type: integer
        workspace_id:
          description: The ID of the workspace it belongs to.
          format: uuid
          type: string
      required:
      - content_hash
      - created_at
      - created_by
      - file_count
      - id
      - requirements_size_bytes
      - size_bytes
      - updated_at
      - version
      - workspace_id
      title: DeploymentResponse
      type: object
    DetailedJobResponse:
      properties:
        created_at:
          description: When it was created.
          format: date-time
          type: string
        created_by:
          description: The `organization_membership_id` of the member who created
            the job.
          format: uuid
          type: string
        current_version:
          description: The active job version, carrying its provider, instance size,
            and resolved hardware.
          oneOf:
          - $ref: '#/components/schemas/JobVersionResponse'
          - type: 'null'
        default_trigger:
          description: The trigger fired when a run is started without naming one,
            computed from the job definition.
          oneOf:
          - type: string
          - type: 'null'
        deployment_module:
          description: Deployment module the job was deployed from, e.g. `__deployment__`;
            `null` for a job deployed outside a module.
          oneOf:
          - type: string
          - type: 'null'
        description:
          description: The description of the job
          oneOf:
          - type: string
          - type: 'null'
        downstream_job_runs:
          description: Runs the job's last run triggered, newest first. Included only
            when `downstream_job_runs_limit` is requested; null otherwise. Empty when
            the last run triggered nothing, since a chained job fires only once its
            upstream run reaches a terminal state.
          oneOf:
          - items:
              $ref: '#/components/schemas/DownstreamJobRunResponse'
            type: array
          - type: 'null'
        freshness:
          description: Freshness constraint strings (computed from job_definition)
          oneOf:
          - items:
              type: string
            type: array
          - type: 'null'
        id:
          description: Unique ID (a UUID).
          format: uuid
          type: string
        interval_end:
          description: Upper bound of the job's work window, from `interval.end` in
            its definition; `null` when there is no upper bound. The schedule stops
            once the next run would pass it.
          oneOf:
          - format: date-time
            type: string
          - type: 'null'
        interval_start:
          description: Lower bound of the job's work window, from `interval.start`
            in its definition; `null` when the job has no bounded window.
          oneOf:
          - format: date-time
            type: string
          - type: 'null'
        is_archived:
          default: false
          description: Whether the job is archived. Archived jobs cannot be run and
            their public URL stops working.
          type: boolean
        is_paused:
          default: false
          description: Whether the job's scheduled runs are paused. The scheduler
            does not start it, including a scheduled run that was waiting for its
            upstream jobs; manual runs, runs started by a trigger request, and runs
            started by another job's success or failure still run. Only a job with
            `next_scheduled_run_at` can be paused, and a deploy that removes the schedule
            clears the pause.
          type: boolean
        job_definition:
          $ref: '#/components/schemas/TJobDefinition'
          description: Job definition from the dlt deployment manifest.
        job_definition_engine_version:
          description: Version of the job definition format.
          type: integer
        job_definition_hash:
          description: Hash of the job definition; a deploy compares it to detect
            changes.
          type: string
        job_ref:
          description: Canonical job reference, unique per workspace
          type: string
        job_type:
          anyOf:
          - $ref: '#/components/schemas/JobType'
          - type: string
          description: 'The type of the job: batch, interactive, or stream'
        job_url:
          description: The URL of the job in the web app for an interactive job; `null`
            otherwise.
          oneOf:
          - type: string
          - type: 'null'
          readOnly: true
        latest_job_run:
          description: The latest run of the job; `null` if it has never run.
          oneOf:
          - $ref: '#/components/schemas/JobRunResponse'
          - type: 'null'
        name:
          description: Display name for the job
          oneOf:
          - type: string
          - type: 'null'
        next_scheduled_run_at:
          description: When the job is next scheduled to run; `null` if it has no
            schedule.
          oneOf:
          - format: date-time
            type: string
          - type: 'null'
        pipeline_name:
          description: Pipeline name this job operates on (computed from job_definition)
          oneOf:
          - type: string
          - type: 'null'
        profile:
          description: The profile the job runs under
          type: string
        public_secret:
          description: The secret in the job's public URL; `null` when the job is
            not published.
          oneOf:
          - format: uuid
            type: string
          - type: 'null'
        public_url:
          description: The public URL where the job can be accessed without authentication;
            `null` when the job is not published. It does not work while the job is
            archived.
          oneOf:
          - type: string
          - type: 'null'
          readOnly: true
        recent_job_runs:
          description: The job's most recent runs, newest first. Included only when
            `recent_job_runs_limit` is requested; null otherwise.
          oneOf:
          - items:
              $ref: '#/components/schemas/RecentJobRunResponse'
            type: array
          - type: 'null'
        triggers:
          description: Every trigger the job answers to, computed from its definition;
            selectors match against these.
          oneOf:
          - items:
              type: string
            type: array
          - type: 'null'
        updated_at:
          description: When it was last changed.
          format: date-time
          type: string
        version:
          description: 'Version number, starting at 1 and incremented by each update
            to the job: a job''s current version, or a job version''s own number.'
          type: integer
        workspace_id:
          description: The ID of the workspace the job belongs to
          format: uuid
          type: string
      required:
      - created_at
      - created_by
      - id
      - job_definition
      - job_definition_engine_version
      - job_definition_hash
      - job_ref
      - job_type
      - job_url
      - profile
      - public_url
      - updated_at
      - version
      - workspace_id
      title: DetailedJobResponse
      type: object
    DetailedJobRunResponse:
      properties:
        attention_reasons:
          description: 'Why the run needs an operator''s look, every reason that applies
            in a fixed order: it failed, it completed but loaded no rows, it completed
            after more than 5 hours. A run still in progress is never flagged. Empty
            when nothing applies.'
          items:
            anyOf:
            - $ref: '#/components/schemas/AttentionReason'
            - type: string
          type: array
        configuration_id:
          description: The ID of the configuration the run uses.
          format: uuid
          type: string
        created_at:
          description: When it was created.
          format: date-time
          type: string
        deployment_id:
          description: The ID of the deployment the run uses.
          format: uuid
          type: string
        downstream_job_runs:
          description: Runs this run triggered, newest first. Included only when `downstream_job_runs_limit`
            is requested; null otherwise. Only runs started by this run's outcome
            are linked, so a manually started one is absent.
          oneOf:
          - items:
              $ref: '#/components/schemas/DownstreamJobRunResponse'
            type: array
          - type: 'null'
        duration_seconds:
          description: Duration of the run in seconds, possibly fractional; `null`
            until it has finished.
          oneOf:
          - type: number
          - type: 'null'
        finished_at:
          description: When the run finished; `null` until it has.
          oneOf:
          - format: date-time
            type: string
          - type: 'null'
        id:
          description: Unique ID (a UUID).
          format: uuid
          type: string
        interval_end:
          description: End of the interval the run processes; `null` for a job without
            intervals.
          oneOf:
          - format: date-time
            type: string
          - type: 'null'
        interval_start:
          description: Start of the interval the run processes; `null` for a job without
            intervals.
          oneOf:
          - format: date-time
            type: string
          - type: 'null'
        job:
          $ref: '#/components/schemas/JobResponse'
          description: The run's job as it is now; it may have been redeployed since
            the run.
        job_version:
          $ref: '#/components/schemas/JobVersionResponse'
          description: "Job version that this run was dispatched with \u2014 carries\
            \ the exact job_definition, provider and max_run_time_seconds used."
        job_version_id:
          description: The ID of the job version the run uses.
          format: uuid
          type: string
        logs_url:
          description: A link to the logs of the run
          oneOf:
          - type: string
          - type: 'null'
        number:
          description: Number of the run within its job, counting up from 1; numbers
            repeat across jobs.
          type: integer
        pipeline_run_summaries:
          description: One entry per dlt pipeline name the run reported; a pipeline
            that ran more than once shows its latest report. In no particular order,
            and empty until telemetry has received the reports.
          items:
            $ref: '#/components/schemas/PipelineRunSummaryResponse'
          type: array
        previous_job_run_id:
          description: The upstream run whose completion started this one, through
            a `job.success:` / `job.fail:` trigger or a freshness dependency; `null`
            for a run started manually, by its own schedule, or by a trigger request.
          oneOf:
          - format: uuid
            type: string
          - type: 'null'
        profile:
          description: The name of the profile that was used for the run
          type: string
        started_at:
          description: When the run started; `null` until it has.
          oneOf:
          - format: date-time
            type: string
          - type: 'null'
        status:
          anyOf:
          - $ref: '#/components/schemas/RunStatus'
          - type: string
          description: The status of the run
        trigger:
          description: The trigger the run fired with, e.g. `schedule:0 8 * * *`,
            `manual:jobs.my_job`, `job.success:jobs.upstream`.
          type: string
        triggered_by:
          description: The `organization_membership_id` of the member who started
            the run; set for any run started through the API, `null` for runs the
            scheduler, another job or a public URL started.
          oneOf:
          - format: uuid
            type: string
          - type: 'null'
        updated_at:
          description: When it was last changed.
          format: date-time
          type: string
        workspace_id:
          description: The ID of the workspace the run belongs to
          format: uuid
          type: string
      required:
      - attention_reasons
      - configuration_id
      - created_at
      - deployment_id
      - duration_seconds
      - finished_at
      - id
      - job
      - job_version
      - job_version_id
      - logs_url
      - number
      - profile
      - started_at
      - status
      - trigger
      - triggered_by
      - updated_at
      - workspace_id
      title: DetailedJobRunResponse
      type: object
    DownstreamJobRunResponse:
      properties:
        category:
          anyOf:
          - $ref: '#/components/schemas/JobCategory'
          - type: string
          - type: 'null'
          description: The category the job declares in `expose.category`, null when
            it declares none. Callers that want one kind of downstream run, such as
            agents, filter on this.
        duration_seconds:
          description: Duration of the run in seconds, possibly fractional; `null`
            until it has finished.
          oneOf:
          - type: number
          - type: 'null'
        id:
          description: The run ID
          format: uuid
          type: string
        job_id:
          description: The ID of the job that ran
          format: uuid
          type: string
        job_ref:
          description: The job's canonical reference
          type: string
        name:
          description: The job's display name
          type: string
        number:
          description: The run number within the job
          type: integer
        started_at:
          description: When the run started, null if not yet started
          oneOf:
          - format: date-time
            type: string
          - type: 'null'
        status:
          anyOf:
          - $ref: '#/components/schemas/RunStatus'
          - type: string
          description: The status of the run
        trigger:
          description: The trigger that started the downstream run
          type: string
      required:
      - id
      - job_id
      - job_ref
      - name
      - number
      - status
      - trigger
      title: DownstreamJobRunResponse
      type: object
    ErrorResponse:
      properties:
        code:
          description: Machine-readable error code, when the error has one
          type: string
        detail:
          description: Human-readable description of the error
          type: string
        extra:
          description: Additional error details (free-form)
        status_code:
          description: The HTTP status code
          type: integer
      title: ErrorResponse
      type: object
    InstanceSize:
      description: Compute size a job runs on, from `small` to `xlarge`; `vcpu` and
        `memory_mib` give what it resolved to.
      enum:
      - small
      - medium
      - large
      - xlarge
      title: InstanceSize
      type: string
    IssueDataplaneTokenWorkspaceResponse:
      properties:
        expires_at:
          description: Unix timestamp (seconds) when the token expires. Clients should
            refresh before this moment.
          type: integer
        token:
          description: 'Data plane token; send it as `Authorization: Bearer <token>`.'
          type: string
      required:
      - expires_at
      - token
      title: IssueDataplaneTokenWorkspaceResponse
      type: object
    IssueUploadConfigurationResponse:
      properties:
        configuration_id:
          description: ID the uploaded configuration will be created under
          format: uuid
          type: string
        upload_token:
          description: 'Token for the upload; send it as `Authorization: Bearer <upload_token>`.
            Valid for 10 minutes.'
          type: string
        upload_url:
          description: Data plane URL to send the multipart upload POST to.
          type: string
      required:
      - configuration_id
      - upload_token
      - upload_url
      title: IssueUploadConfigurationResponse
      type: object
    IssueUploadDeploymentResponse:
      properties:
        deployment_id:
          description: ID the uploaded deployment will be created under
          format: uuid
          type: string
        upload_token:
          description: 'Token for the upload; send it as `Authorization: Bearer <upload_token>`.
            Valid for 10 minutes.'
          type: string
        upload_url:
          description: Data plane URL to send the multipart upload POST to.
          type: string
      required:
      - deployment_id
      - upload_token
      - upload_url
      title: IssueUploadDeploymentResponse
      type: object
    JobCategory:
      description: The kind of job a manifest declares in `expose.category`. A job
        declares at most one, and most jobs declare none.
      enum:
      - pipeline
      - mcp
      - dashboard
      - notebook
      - background_agent
      title: JobCategory
      type: string
    JobDeployOutcome:
      enum:
      - created
      - updated
      - archived
      - unchanged
      title: JobDeployOutcome
      type: string
    JobResponse:
      properties:
        created_at:
          description: When it was created.
          format: date-time
          type: string
        created_by:
          description: The `organization_membership_id` of the member who created
            the job.
          format: uuid
          type: string
        default_trigger:
          description: The trigger fired when a run is started without naming one,
            computed from the job definition.
          oneOf:
          - type: string
          - type: 'null'
        deployment_module:
          description: Deployment module the job was deployed from, e.g. `__deployment__`;
            `null` for a job deployed outside a module.
          oneOf:
          - type: string
          - type: 'null'
        description:
          description: The description of the job
          oneOf:
          - type: string
          - type: 'null'
        freshness:
          description: Freshness constraint strings (computed from job_definition)
          oneOf:
          - items:
              type: string
            type: array
          - type: 'null'
        id:
          description: Unique ID (a UUID).
          format: uuid
          type: string
        interval_end:
          description: Upper bound of the job's work window, from `interval.end` in
            its definition; `null` when there is no upper bound. The schedule stops
            once the next run would pass it.
          oneOf:
          - format: date-time
            type: string
          - type: 'null'
        interval_start:
          description: Lower bound of the job's work window, from `interval.start`
            in its definition; `null` when the job has no bounded window.
          oneOf:
          - format: date-time
            type: string
          - type: 'null'
        is_archived:
          default: false
          description: Whether the job is archived. Archived jobs cannot be run and
            their public URL stops working.
          type: boolean
        is_paused:
          default: false
          description: Whether the job's scheduled runs are paused. The scheduler
            does not start it, including a scheduled run that was waiting for its
            upstream jobs; manual runs, runs started by a trigger request, and runs
            started by another job's success or failure still run. Only a job with
            `next_scheduled_run_at` can be paused, and a deploy that removes the schedule
            clears the pause.
          type: boolean
        job_definition:
          $ref: '#/components/schemas/TJobDefinition'
          description: Job definition from the dlt deployment manifest.
        job_definition_engine_version:
          description: Version of the job definition format.
          type: integer
        job_definition_hash:
          description: Hash of the job definition; a deploy compares it to detect
            changes.
          type: string
        job_ref:
          description: Canonical job reference, unique per workspace
          type: string
        job_type:
          anyOf:
          - $ref: '#/components/schemas/JobType'
          - type: string
          description: 'The type of the job: batch, interactive, or stream'
        job_url:
          description: The URL of the job in the web app for an interactive job; `null`
            otherwise.
          oneOf:
          - type: string
          - type: 'null'
          readOnly: true
        name:
          description: Display name for the job
          oneOf:
          - type: string
          - type: 'null'
        next_scheduled_run_at:
          description: When the job is next scheduled to run; `null` if it has no
            schedule.
          oneOf:
          - format: date-time
            type: string
          - type: 'null'
        pipeline_name:
          description: Pipeline name this job operates on (computed from job_definition)
          oneOf:
          - type: string
          - type: 'null'
        profile:
          description: The profile the job runs under
          type: string
        public_secret:
          description: The secret in the job's public URL; `null` when the job is
            not published.
          oneOf:
          - format: uuid
            type: string
          - type: 'null'
        public_url:
          description: The public URL where the job can be accessed without authentication;
            `null` when the job is not published. It does not work while the job is
            archived.
          oneOf:
          - type: string
          - type: 'null'
          readOnly: true
        triggers:
          description: Every trigger the job answers to, computed from its definition;
            selectors match against these.
          oneOf:
          - items:
              type: string
            type: array
          - type: 'null'
        updated_at:
          description: When it was last changed.
          format: date-time
          type: string
        version:
          description: 'Version number, starting at 1 and incremented by each update
            to the job: a job''s current version, or a job version''s own number.'
          type: integer
        workspace_id:
          description: The ID of the workspace the job belongs to
          format: uuid
          type: string
      required:
