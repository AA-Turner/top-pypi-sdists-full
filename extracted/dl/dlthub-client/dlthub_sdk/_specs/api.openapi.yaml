        auto_refresh_pipeline_mode:
          anyOf:
          - enum:
            - drop_sources
            - drop_resources
            - drop_data
            type: string
          - type: string
        config_keys:
          items:
            type: string
          type: array
        default_trigger:
          type: string
        deliver:
          $ref: '#/components/schemas/TDeliverSpec'
        description:
          type: string
        engine_version:
          type: integer
        entry_point:
          $ref: '#/components/schemas/TEntryPoint'
        execute:
          $ref: '#/components/schemas/TExecuteSpec'
        expose:
          $ref: '#/components/schemas/TExposeSpec'
        freshness:
