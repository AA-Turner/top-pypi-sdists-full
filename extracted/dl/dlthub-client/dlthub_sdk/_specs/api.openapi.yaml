          oneOf:
          - type: integer
          - type: 'null'
        transaction_id:
          description: Transaction ID of the pipeline run
          oneOf:
          - type: string
          - type: 'null'
      required:
      - pipeline_name
      title: PipelineRunSummaryResponse
      type: object
    PrincipalKind:
      description: 'Kind of member: `human` is a person; `service_account` is a workspace
        API key; `managed` is the platform''s own principal that runs jobs in the
        workspace and has no key.'
      enum:
      - human
      - service_account
      - managed
      title: PrincipalKind
      type: string
    RecentJobRunResponse:
      properties:
        duration_seconds:
          description: Duration of the run in seconds, possibly fractional; `null`
            until it has finished.
          oneOf:
          - type: number
          - type: 'null'
        id:
          description: The run ID
          format: uuid
          type: string
        rows_loaded:
          description: Total rows loaded across the run's pipeline runs; null when
            not reported.
          oneOf:
          - type: integer
          - type: 'null'
        started_at:
          description: When the run started, null if not yet started
          oneOf:
          - format: date-time
            type: string
          - type: 'null'
        status:
          anyOf:
          - $ref: '#/components/schemas/RunStatus'
          - type: string
          description: The status of the run
      required:
      - id
      - status
      title: RecentJobRunResponse
      type: object
    RunMode:
      description: 'How to create a run: `always` creates a new run; `when_not_running`
        returns the job''s pending, starting or running run if it has one, otherwise
        creates a new one.'
      enum:
      - always
      - when_not_running
      title: RunMode
      type: string
    RunProvider:
      description: 'Compute backend that runs a job: `modal`, `tower`, or `local`
        in local development.'
      enum:
      - tower
      - modal
      - local
      title: RunProvider
      type: string
    RunStatus:
      description: 'Status of a job run: `pending` (queued), `starting`, `running`,
        `cancelling` (cancel requested), and the terminal states `completed`, `failed`,
        `cancelled`, `skipped`.'
      enum:
      - pending
      - starting
      - running
      - completed
      - failed
      - cancelled
      - skipped
      - cancelling
      title: RunStatus
      type: string
    SetRegionOrganizationRequest:
      properties:
        dataplane_id:
          description: Data plane id for the organization's region. Cannot be changed
            once set.
          type: string
      required:
      - dataplane_id
      title: SetRegionOrganizationRequest
      type: object
    TAgentDefinition:
      properties:
        agent_file:
          type: string
        description:
          type: string
        engine_version:
          type: integer
        instructions:
          type: string
        model:
          type: string
        name:
