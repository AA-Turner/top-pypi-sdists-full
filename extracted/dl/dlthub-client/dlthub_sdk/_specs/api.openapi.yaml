            - type: string
          type: array
        data:
          items:
            anyOf:
            - enum:
              - read
              - write
              - all
              type: string
            - type: string
          type: array
        local:
          items:
            anyOf:
            - enum:
              - read
              - write
              - execute
              - network
              - all
              type: string
            - type: string
          type: array
      required: []
      title: TWorkspaceAccess
      type: object
    TriggerJobsRequest:
      properties:
        dry_run:
          default: false
          description: Preview which jobs match and pass the freshness check, without
            creating runs. Limits checked only when a run starts (concurrency, trial,
            compute minutes, interval bounds) are not evaluated.
          type: boolean
        job_ids:
          description: Jobs to trigger, each fired via its `default_trigger` (or `manual:<ref>`
            when it has none). At least one of `job_ids` or `selectors` must be non-empty.
          oneOf:
          - items:
              format: uuid
              type: string
            type: array
          - type: 'null'
        profile:
          description: Profile override for all triggered runs.
          oneOf:
          - type: string
          - type: 'null'
        refresh:
          default: false
          description: Start each triggered job as a refresh, as `refresh` does for
            `create_job_run`; the progress of the jobs downstream of them is reset
            too. Ignored for a job whose `refresh_propagation` is `block`. Skipped
            jobs are not refreshed.
          type: boolean
        selectors:
          description: 'Selectors matched against each job''s triggers with shell-style
            wildcards; a matching job fires the trigger it matched. A bare trigger
            type like `schedule` means `schedule:*`; `batch` (or `job`), `interactive`
            and `stream` select every trigger of jobs of that type. Examples: `tag:backfill`,
            `schedule:*`, `batch`, `manual:jobs.my_module.*`. At least one of `job_ids`
            or `selectors` must be non-empty.'
          oneOf:
          - items:
              type: string
            type: array
          - type: 'null'
      required: []
      title: TriggerJobsRequest
      type: object
    TriggerJobsResponse:
      properties:
        failed:
          description: Requested job ids that name no job in the workspace, or an
            archived job.
          items:
            $ref: '#/components/schemas/BulkItemFailure'
          type: array
        skipped:
          description: Jobs that did not start; their `status` and `reasons` say why.
          items:
            $ref: '#/components/schemas/TriggeredJob'
          type: array
        succeeded:
          description: Jobs that started a run, or in dry-run mode would pass the
            freshness check.
          items:
            $ref: '#/components/schemas/TriggeredJob'
          type: array
      required:
      - failed
      - skipped
      - succeeded
      title: TriggerJobsResponse
      type: object
    TriggerKind:
      description: A kind of trigger a job declares. A job may declare several kinds
        at once; `manual` mirrors the manifest's `expose.manual`, which is on by default.
      enum:
      - schedule
      - every
      - once
      - webhook
      - http
      - job.success
      - job.fail
      - manual
      title: TriggerKind
      type: string
    TriggeredJob:
      properties:
        job_id:
          description: The ID of the matched job.
          format: uuid
          type: string
        job_ref:
          description: The job reference of the matched job.
          type: string
        job_run:
          description: The created run; `null` in dry-run mode or when skipped.
          oneOf:
          - $ref: '#/components/schemas/JobRunResponse'
          - type: 'null'
        job_run_id:
          description: The ID of the created run; `null` in dry-run mode or when skipped.
          oneOf:
          - format: uuid
            type: string
          - type: 'null'
        matched_triggers:
          description: 'Every trigger that selected this job: its default trigger
            when named in `job_ids`, plus any selector matches.'
          items:
            type: string
          type: array
        reasons:
          description: Human-readable reasons for a skip, e.g. which upstream jobs
            are not fresh; `null` when the job was triggered or no reasons were recorded.
          oneOf:
          - items:
              type: string
            type: array
          - type: 'null'
        status:
          anyOf:
          - enum:
            - triggered
            - skipped_fresh
            - skipped_upstream_pending
            - skipped_out_of_interval
            - skipped_concurrency_limit
            - skipped_already_covered
            - skipped_trial_expired
            - skipped_minutes_limit
            - skipped_org_concurrency_limit
            - skipped_paused
            - skipped_workspace_archived
            type: string
          - type: string
          default: triggered
          description: 'Whether the job started a run: `triggered` if it did; otherwise
            why not. `skipped_fresh`: an upstream job is not fresh (see `reasons`).
            `skipped_upstream_pending`: an upstream job is triggered in the same request.
            `skipped_out_of_interval`: the run would fall outside the job''s `interval_start`
            / `interval_end`. `skipped_concurrency_limit`: the job is already running
            as many runs as it allows. `skipped_org_concurrency_limit`: the organization
            has reached its limit of concurrent runs. `skipped_trial_expired`: the
            organization''s trial has ended. `skipped_minutes_limit`: the organization
            has used up its compute minutes. `skipped_workspace_archived`: the workspace
            is archived.'
        trigger:
          description: The trigger the job fires with.
          type: string
      required:
      - job_id
      - job_ref
      - matched_triggers
      - trigger
      title: TriggeredJob
      type: object
    UpdateWorkspaceRequest:
      properties:
        credit_threshold:
          description: Monthly credit consumption threshold that triggers an email
            alert; pass null to disable.
          maximum: 2147483647
          minimum: 1
          oneOf:
          - type: integer
          - type: 'null'
        description:
          description: The description of the workspace
          oneOf:
          - type: string
          - type: 'null'
        name:
          description: The name of the workspace
          oneOf:
          - type: string
          - type: 'null'
      required: []
      title: UpdateWorkspaceRequest
      type: object
    WorkspaceMeResponse:
      properties:
        email:
          description: The email of the current user
          type: string
        organization:
          $ref: '#/components/schemas/OrganizationResponse'
          description: The workspace's organization.
        organization_membership_id:
          description: The ID of the organization member in the parent organization
          format: uuid
          type: string
        organization_role:
          anyOf:
          - $ref: '#/components/schemas/OrganizationMembershipRole'
          - type: string
          description: The role of the user in the parent organization
        user_id:
          description: The ID of the current user
          format: uuid
          type: string
        workspace:
          $ref: '#/components/schemas/WorkspaceResponse'
          description: The workspace
        workspace_role:
          anyOf:
          - $ref: '#/components/schemas/WorkspaceMembershipRole'
          - type: string
          description: The role of the user in this workspace
      required:
      - email
      - organization
      - organization_membership_id
      - organization_role
      - user_id
      - workspace
      - workspace_role
      title: WorkspaceMeResponse
      type: object
    WorkspaceMemberResponse:
      properties:
        email:
          description: The email of the user
          type: string
        id:
          description: The ID of the workspace membership
          format: uuid
          type: string
        name:
          description: Display name; `null` when the user has no name set.
          oneOf:
          - type: string
          - type: 'null'
        organization_membership_id:
          description: The ID of the member's organization membership, which `created_by`
            and `triggered_by` hold
          format: uuid
          type: string
        role:
          anyOf:
          - $ref: '#/components/schemas/WorkspaceMembershipRole'
          - type: string
          description: The role of the user in the workspace
        user_id:
          description: The ID of the user
          format: uuid
          type: string
      required:
      - email
      - id
      - organization_membership_id
      - role
      - user_id
      title: WorkspaceMemberResponse
      type: object
    WorkspaceMembershipResponse:
      properties:
        role:
          anyOf:
          - $ref: '#/components/schemas/WorkspaceMembershipRole'
          - type: string
          description: The role of the user in the workspace
        workspace:
          $ref: '#/components/schemas/WorkspaceResponse'
          description: The workspace
      required:
      - role
      - workspace
      title: WorkspaceMembershipResponse
      type: object
    WorkspaceMembershipRole:
      description: A role in a workspace.
      enum:
      - owner
      - developer
      - viewer
      title: WorkspaceMembershipRole
      type: string
    WorkspaceResponse:
      properties:
        archived_at:
          description: When the workspace was archived; `null` when live. An archived
            workspace rejects all changes except unarchiving, though owners can still
            manage its workspace variables.
          oneOf:
          - format: date-time
            type: string
          - type: 'null'
        created_at:
          description: When it was created.
          format: date-time
          type: string
        credit_threshold:
          description: Monthly credit consumption threshold that triggers an email
            alert; null when disabled.
          oneOf:
          - type: integer
          - type: 'null'
        dataplane_id:
          description: Identifier of the data plane that holds this workspace's user
            data. Matches the subdomain of the plane's public entrypoint.
          type: string
        dataplane_url:
          description: Base URL of the workspace's data plane, `https://<dataplane_id>.dlthub.com`,
            where the Dataplane, Logs and Telemetry APIs are served. Call them with
            a token from `POST /api/v1/workspaces/{workspace_id}/-issue-dataplane-token`.
          type: string
        description:
          description: Free-text description of the workspace; `null` when none is
            set.
          oneOf:
          - type: string
          - type: 'null'
        id:
          description: Unique ID (a UUID).
          format: uuid
          type: string
        is_playground:
          default: false
          description: Whether this is the user's auto-created personal playground
            workspace. A playground has a single member and cannot be updated, archived,
            shared, or given API keys.
          type: boolean
        name:
          description: The name of the workspace
          type: string
        organization_id:
          description: The ID of the parent organization
          format: uuid
          type: string
        predefined_profiles:
          additionalProperties:
            type: string
          description: "Built-in profiles by data access: `DATA_WRITE` \u2192 `prod`\
            \ (runs need developer or owner), `DATA_READ` \u2192 `access` (viewers\
            \ may run)."
          type: object
        updated_at:
          description: When it was last changed.
          format: date-time
          type: string
      required:
      - created_at
      - dataplane_id
      - dataplane_url
      - description
      - id
      - name
      - organization_id
      - updated_at
      title: WorkspaceResponse
      type: object
  securitySchemes:
    BearerAuth:
      description: "An API key sent as `Authorization: Bearer <api key>`. Create keys\
        \ in the\n[dltHub web app](https://app.dlthub.com): a personal key (`dlt_u_\u2026\
        `) acts as you, with\nyour roles in every organization and workspace you belong\
        \ to; a workspace key (`dlt_sa_\u2026`)\nacts for one workspace with a fixed\
        \ DEVELOPER or VIEWER role. Keys expire after 90 days\nunless set otherwise\
        \ when created (at most 365)."
      scheme: bearer
      type: http
info:
  description: "REST API of the dltHub Runtime control plane: organizations, workspaces,\
    \ deployments, configurations, jobs and job runs. The `dlthub` CLI, the Python\
    \ SDK and the [dltHub web app](https://app.dlthub.com) are built on it.\n\n##\
    \ Base URL\n\n`https://api.dlthub.com`\n\n## Authentication\n\nSend an API key\
    \ as a bearer token:\n\n```text\nAuthorization: Bearer <api key>\n```\n\nCreate\
    \ keys in the [dltHub web app](https://app.dlthub.com). The plaintext key is shown\
    \ once,\nand deleting a key revokes it immediately. Keys expire after 90 days\
    \ unless set otherwise when\ncreated (at most 365).\n\n- **Personal keys** (`dlt_u_\u2026\
    `), under account settings, act as you, with your roles in every\n  organization\
    \ and workspace you belong to.\n- **Workspace keys** (`dlt_sa_\u2026`), under\
    \ workspace settings, act for one workspace with a fixed\n  role: DEVELOPER (deploy\
    \ and run jobs) or VIEWER (read, and run jobs that use the read-only\n  `access`\
    \ profile, such as interactive jobs). Use them for CI and other automation. Workspace\n\
    \  keys cannot call `GET /api/v1/me`.\n\n## Data plane\n\nWorkspace variables,\
    \ deployment and configuration files, run logs and telemetry are kept on the data\
    \ plane of the workspace's region and served by the Dataplane, Logs and Telemetry\
    \ APIs. `GET /api/v1/workspaces/{workspace_id}` returns its address as `dataplane_url`,\
    \ and `POST /api/v1/workspaces/{workspace_id}/-issue-dataplane-token` the token\
    \ to call it with.\n\n## Versioning\n\nThe API version is part of the path. Endpoints\
    \ under `/v1` are stable: breaking changes ship\nonly under a new version prefix.\
    \ New endpoints, optional parameters and response fields can\nbe added to `/v1`\
    \ at any time, so ignore fields and enum values you do not know."
  title: dltHub Runtime API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/dataplanes:
    get:
      deprecated: false
      description: Lists the regions (data planes) an organization can choose with
        `set_region_organization`.
      operationId: list_dataplanes
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataplaneCatalog'
          description: OK
          headers:
            cache-control:
              deprecated: false
              required: false
              schema:
                type: string
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      summary: ListDataplanes
      tags:
      - dataplanes
  /api/v1/me:
    get:
      deprecated: false
      description: '

        Gets your user profile and organization memberships. `primary_organization`
        is where new

        workspaces are created by default; `latest_organization` and `latest_workspace`
        are the ones

        you used last. Workspaces are listed per organization by `get_organization_me`.


        Each call also accepts your pending invites and creates your playground workspace
        in any

        organization that lacks one. On the first call for a user who has no organization
        yet, it

        creates a personal organization and a playground workspace, so a freshly authenticated
        user

        always gets a 200.


        Requires a personal API key or a user login; a workspace API key answers 403.

        '
      operationId: get_me
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
          description: OK
          headers:
            cache-control:
              deprecated: false
              required: false
              schema:
                type: string
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      summary: GetMe
      tags:
      - me
  /api/v1/organizations:
    get:
      deprecated: false
      description: '

        Lists all organizations the current user is a member of, as a paginated list.


        Requires any valid credential; no particular role is needed.

        '
      operationId: list_organizations
      parameters:
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Maximum number of items to return. At most 1000.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          description: Maximum number of items to return. At most 1000.
          maximum: 1000.0
          minimum: 1.0
          type: integer
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Number of items to skip. At most 10000; a list reports its total
          up to 10001, so narrow with filters instead of paging deeper.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: Number of items to skip. At most 10000; a list reports its
            total up to 10001, so narrow with filters instead of paging deeper.
          maximum: 10000.0
          minimum: 0.0
          type: integer
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Keys to sort by, applied in the order given. Pairs positionally
          with `order`, which must have the same number of entries.
        in: query
        name: sort
