name: CI

# Re-enabled 2026-05-18 after the meta-failure: stress harness ran
# clean for hours while real users hit show-stopping bugs every 15
# minutes. Pyright would have caught _tool_stop_injected (NameError),
# has_complexity (NameError), cwd-possibly-unbound, last_message-
# possibly-unbound, ToolCallEvent-undefined, _verify_and_fix_imports-
# undefined, children-possibly-unbound — all caught the user, none
# caught by the harness.
#
# Static analysis on every push + PR. Tests are the floor; pyright
# is the ceiling.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  static-analysis:
    name: Static analysis (pyright + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (no tests, just types)
        run: |
          python -m pip install --upgrade pip
          # Install drydock + dev deps for type info.
          pip install -e .
          pip install pyright ruff
      - name: Ruff (lint — catches undefined names, unused imports, etc.)
        run: |
          # F821: undefined name. F823: local variable referenced before
          # assignment. F401: imported but unused.
          # These are the bug classes the stress harness missed.
          ruff check --select F,E,UP --output-format=github drydock/ tests/
      - name: Pyright (catches NameError, AttributeError, type mismatches)
        # We don't (yet) make pyright a hard gate because the codebase
        # has ~178 type-issue errors that aren't bug-bombs (they're
        # type-system noise from MessageList vs dict overload usage).
        # Instead, fail on the SUBSET that historically bites users:
        # undefined variables, possibly-unbound, attribute-access on None.
        run: |
          pyright drydock/ --outputjson > /tmp/pyright.json || true
          python - <<'PY'
          import json, sys
          # The three rules that historically caused NameError /
          # AttributeError on real user code paths. AttributeAccessIssue
          # is intentionally NOT in this set yet — it false-positives on
          # cross-platform stdlib (winreg on Linux, ctypes.windll, etc.)
          # and on Pydantic-validated dynamic attributes. Add it back
          # once the false-positive sources are excluded.
          rules_that_bite = {
              "reportUndefinedVariable",       # like _tool_stop_injected
              "reportPossiblyUnboundVariable", # like cwd, last_message
              "reportOptionalMemberAccess",    # like .split on None
          }
          # Files we don't lint on Linux runners (platform-specific code).
          SKIP_FILES = ("fix_windows_path.py",)
          with open("/tmp/pyright.json") as f:
              data = json.load(f)
          fails = [
              d for d in data.get("generalDiagnostics", [])
              if d.get("rule") in rules_that_bite
              and not any(s in d.get("file", "") for s in SKIP_FILES)
          ]
          if fails:
              print(f"::error::pyright found {len(fails)} bug-bomb errors:")
              for d in fails:
                  r = d.get("range", {}).get("start", {})
                  print(f"::error file={d.get('file')},line={r.get('line', 0)+1},col={r.get('character', 0)+1}::"
                        f"{d.get('rule')}: {d.get('message', '').splitlines()[0]}")
              sys.exit(1)
          print("✓ no NameError / unbound / NoneAccess / bad-attribute time-bombs")
          PY

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio pytest-timeout pytest-xdist
      - name: pytest (smoke + recovery + regression)
        run: |
          pytest tests/test_smoke.py \
                 tests/test_tool_stop_injected_scope.py \
                 tests/test_api_error_recovery.py \
                 tests/test_session_log_event.py \
                 tests/test_approval_modal_stray_keys.py \
                 tests/test_solve_tool.py \
                 tests/test_constraint_extract.py \
                 tests/test_constraint_hint.py \
                 -q --timeout=60 -n auto
