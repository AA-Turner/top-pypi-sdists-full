# Gemma 4 + llama.cpp via Docker Compose.
#
# Prerequisite: download the GGUF once. Either let setup-llm.sh do it
# (it just exits after the download), or grab it manually:
#
#   mkdir -p ~/.cache/drydock/models
#   curl -fL -o ~/.cache/drydock/models/gemma-4-26B-A4B-it-UD-Q3_K_M.gguf \
#     https://huggingface.co/unsloth/gemma-4-26B-A4B-it-GGUF/resolve/main/gemma-4-26B-A4B-it-UD-Q3_K_M.gguf
#
# Then start:
#   docker compose up -d
#
# Override defaults via .env or environment:
#   MODEL_DIR=/path/to/models docker compose up -d
#   PORT=8001 docker compose up -d

services:
  gemma4:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llamacpp-gemma4
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - "${MODEL_DIR:-$HOME/.cache/drydock/models}:/models:ro"
    command:
      - "-m"
      - "/models/gemma-4-26B-A4B-it-UD-Q3_K_M.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "-ngl"
      - "99"
      - "-c"
      - "32768"
      - "-np"
      - "1"
      - "--jinja"
      - "-ctk"
      - "q8_0"
      - "-ctv"
      - "q8_0"
      - "--alias"
      - "gemma4"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/v1/models || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
