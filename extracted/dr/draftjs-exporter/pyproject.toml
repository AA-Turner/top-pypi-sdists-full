[project]
name = "draftjs_exporter"
version = "7.3.1"
description = "Library to convert rich text from Draft.js raw ContentState to HTML"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Editors :: Word Processors",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://wagtail.github.io/draftjs_exporter/"
Source = "https://github.com/wagtail/draftjs_exporter"
Tracker = "https://github.com/wagtail/draftjs_exporter/issues"
Changelog = "https://github.com/wagtail/draftjs_exporter/blob/main/CHANGELOG.md"
"llms.txt" = "https://wagtail.github.io/draftjs_exporter/llms.txt"

[project.optional-dependencies]
lxml = ["lxml>=4.9.4,<7"]
html5lib = [
    "beautifulsoup4>=4.4.1,<5",
    "html5lib>=0.999,<2",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100.0",
    "import-linter>=2.0",
    "mypy==2.3.1",
    "pyrefly>=1.3.0,<2",
    "pyright>=1.1.414,<2",
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "pytest-memray>=1.7.0",
    "ruff>=0.1.9",
    "ty>=0.0.25",
    "markov_draftjs>=2.0.0",
    "memray>=1.15.0",
    "psutil>=5.9.7",
    "lxml>=4.9.4,<7",
    "types-lxml>=2026.2.16",
    "beautifulsoup4>=4.4.1,<5",
    "types-beautifulsoup4>=4.12.0",
    "html5lib>=0.999,<2",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.27.0",
    "mkdocs-llmstxt>=0.5.0",
    "mkdocs-simple-hooks>=0.1.5",
    "mkdocs-git-revision-date-localized-plugin>=1.4.0",
    "types-pyyaml>=6.0.12.20260518",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "draftjs_exporter"
module-root = ""

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "S",
    "T20",
    "BLE",
    "C4",
    "B006",
    "B904",
    "D",
    "UP",
]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"docs/prompts/graders/*" = [
    "T20",
    "D103",
]
"tests/*" = [
    "S101",
    "S105",
    "S106",
    "S301",
    "S308",
    "S324",
    "D",
]
"test_*" = [
    "S101",
    "S105",
    "S106",
    "S301",
    "S308",
    "S324",
    "D",
]

[tool.importlinter]
root_packages = [
    "draftjs_exporter",
    "tests",
]

[[tool.importlinter.contracts]]
name = "Importer modules do not import exporter modules"
type = "forbidden"
source_modules = [
    "draftjs_exporter.contentstate_filter",
    "draftjs_exporter.markdown_importer",
    "draftjs_exporter.markdown_parser",
]
forbidden_modules = [
    "draftjs_exporter.composite_decorators",
    "draftjs_exporter.defaults",
    "draftjs_exporter.dom",
    "draftjs_exporter.entity_state",
    "draftjs_exporter.html",
    "draftjs_exporter.markdown",
    "draftjs_exporter.options",
    "draftjs_exporter.style_state",
    "draftjs_exporter.wrapper_state",
]

[[tool.importlinter.contracts]]
name = "Full-output integration tests use only the public root API"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "tests.test_output",
    "tests.test_exports",
    "tests.test_imports",
    "tests.test_properties",
]
forbidden_modules = ["draftjs_exporter.*"]

[tool.mypy]
python_version = "3.11"
exclude_gitignore = true
disallow_any_unimported = true
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_explicit = false
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_redundant_casts = false
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true
warn_unreachable = true
strict_equality = true
strict_equality_for_none = true
extra_checks = true
no_implicit_reexport = true
warn_unused_configs = true
enable_error_code = [
    "ignore-without-code",
    "deprecated",
    "possibly-undefined",
    "truthy-bool",
    "redundant-expr",
    "redundant-self",
    "mutable-override",
    "unimported-reveal",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.ty.rules]
disjoint-cast = "error"
unsound-assignment = "error"
unsound-return-statement = "error"
unsound-yield = "error"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
exclude = ["site"]

[[tool.pyright.executionEnvironments]]
root = "tests"
reportTypedDictNotRequiredAccess = "none"

[tool.pyrefly]
python-version = "3.11"
treat-all-caps-as-final = true

[tool.pyrefly.errors]
implicit-any = true
unannotated-return = true
not-required-key-access = true
unused-ignore = true
direct-abstract-base-instantiation = true

[[tool.pyrefly.sub-config]]
matches = "tests/**"

[tool.pyrefly.sub-config.errors]
implicit-any = false
unannotated-return = false
not-required-key-access = false
