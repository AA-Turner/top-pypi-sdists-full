[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
# ── WHY THE LIVE E2E SUITES ARE OPT-IN ──────────────────────────────────────────────────────
# tests/test_e2e_all_skills.py and tests/test_e2e_skills.py make REAL model calls. The first one
# says so in its own docstring ("No skips. Every skill must return a real response > 30 chars.")
# and its _load_keychain_keys() copies real NVIDIA keys out of the macOS Keychain into
# os.environ — permanently, for the whole process.
#
# That last part is why they cannot sit in the default run. Once those keys are in the
# environment, test_e2e_skills' module-level HAS_KEYS guard flips truthy, so a module that skips
# cleanly on its own starts making live calls, and unrelated modules downstream inherit the
# polluted environment too. `pytest tests/` was therefore never green offline, and the failures
# looked like product bugs rather than what they were: a live-network suite bleeding into a unit
# suite through shared process state.
#
# They are kept, not deleted — they are real coverage. They now run only when asked for:
#     pytest -m e2e            (or: pytest tests/test_e2e_all_skills.py)
markers = [
    "e2e: makes real network calls to live models; needs credentials. Excluded by default.",
]
addopts = "-m 'not e2e'"
