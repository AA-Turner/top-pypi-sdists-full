[project]
name = "cube-common"
version = "0.1.0"
description = "Shared library for cube-mcp: Apollo client, GraphQL queries, models"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cube_common"]
