# AI Reactor catalog: the gateway and the models the console may deploy
# (docs/ai-reactor-deploy-spec.md §3). A model that is not listed here cannot be
# deployed from the console.
#
# Factual fields (product_id, entity_name, service, served_model, port, storage_gb,
# config_block_version) come from the sovereign-ai charts, as rendered with this
# file's overrides; check them with
#   uv run python scripts/check-reactor-catalog.py --sovereign-ai ../sovereign-ai
# Descriptive fields (display_name, description, task, platform, gpu) are written by hand.
#
# Every model chart listed here MUST use `strategy: Recreate` (a single-GPU cube
# deadlocks on a rolling update) and `openshift.createSCC: true`; the check script
# refuses a chart that does not.
version: 1

gateway:
  product_id: com.edgescaleai-cube:esai-sovereign-ai-litellm
  entity_name: esai-sovereign-ai-litellm
  # Every live Reactor runs here, and the model entities go to the same namespace.
  namespace: esai-sovereign-ai
  # The chart's Service (templates/service.yaml), port 4000.
  service: litellm
  port: 4000
  # Override block version for a NEW gateway. An existing gateway keeps its own.
  config_block_version: "0.3.4"
  # Unset: Apollo's default channel, as an install_entity without one gets.
  release_channel: null
  # Overrides for a gateway the console installs. Config mode (no Postgres) and the
  # master key in the Apollo secret `gateway`, so this block carries no credential.
  # `localModels` is always written explicitly: the chart's own default lists two
  # placeholder models.
  base_overrides:
    database:
      enabled: false
    networkPolicy:
      enabled: false
    openshift:
      anyuid: false
    cloudModels:
      enabled: false
    apolloSecrets:
      enabled: true
      salt: false
      dbPassword: false
    localModels: []

# Applied to EVERY model install, with a model's own `install_overrides` merged over
# it. Tailscale exposure is on by default in most model charts, with another cube's
# hostname: on a cube running the Tailscale operator it would advertise an
# unauthenticated vLLM on the tailnet. A chart without the key ignores it.
# Overrides may not move the gateway's wiring (Service, port, served name) or carry a
# credential; catalog.py refuses both. Chart defaults that need these overrides are
# tracked for a proper fix in sovereign-ai.
model_overrides:
  tailscale:
    expose: false

models:
