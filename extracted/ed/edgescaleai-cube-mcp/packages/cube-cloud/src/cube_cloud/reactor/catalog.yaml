    product_id: com.edgescaleai-cube:esai-sovereign-ai-nemotron-3-nano-4b
    entity_name: esai-sovereign-ai-nemotron-3-nano-4b
    config_block_version: "0.1.2"
    service: nemotron-3-nano-4b
    port: 8000
    served_model: nvidia/NVIDIA-Nemotron-3-Nano-4B-BF16
    storage_gb: 30

