    storage_gb: 70

  # The three below install only with overrides: their published chart defaults
  # assume a cube they were built on (a Hugging Face secret, a gateway in the same
  # namespace, a storage class, an older vLLM). Each override mirrors one already
  # proven by hand; the source is noted per entry.
  - id: gemma-4-12b
    display_name: Gemma 4 12B
    description: Multimodal chat model from Google, quantized to 4-bit; reads images as well as text.
    task: chat
    platform: x86
    gpu: {count: 1, min_vram_gb: 24}
    product_id: com.edgescaleai-cube:esai-sovereign-ai-gemma-4-12b
    entity_name: esai-sovereign-ai-gemma-4-12b
    config_block_version: "0.1.1"
    service: gemma-4-12b
    port: 8000
    served_model: google/gemma-4-12B-it-qat-w4a16-ct
    storage_gb: 40
    # As run on cube-o2e87m9a (hitachi-innovation-lab): Google's 4-bit QAT build on
    # vLLM v0.28.0, which has the per-layer head_dim fix the chart's v0.27.1 lacks
    # (the BF16 default crash-loops there). The chart pins a storage class only one
    # cube has; empty means the cube's default.
    install_overrides:
      image: {tag: "v0.28.0"}
      model:
        name: google/gemma-4-12B-it-qat-w4a16-ct
        quantization: ""
        dtype: auto
        maxModelLen: 16384
        gpuMemoryUtilization: 0.9
        maxNumSeqs: 2
        maxNumBatchedTokens: 8192
      kvCache: {dtype: auto}
      huggingface: {enabled: false}
      storage: {size: 40Gi, storageClass: ""}
      openshift: {createSCC: true}

  - id: gpt-oss-20b
    display_name: gpt-oss 20B
    description: Open-weight reasoning model from OpenAI with tool calling and a 32K-token context window.
    task: chat
    platform: x86
    gpu: {count: 1, min_vram_gb: 24}
    product_id: com.edgescaleai-cube:esai-sovereign-ai-openai-oss-20b
    entity_name: esai-sovereign-ai-openai-oss-20b
    config_block_version: "0.5.0"
    service: gpt-oss-20b-svc
    port: 8000
    served_model: openai/gpt-oss-20b
    storage_gb: 100
    # Published 0.5.0 defaults createSCC to false (fixed in the repo's unpublished
    # 0.5.1), requires a huggingface-secret for a public model, and enables a
    # NetworkPolicy that admits only its own namespace.
    install_overrides:
      huggingface: {enabled: false}
      networkPolicy: {enabled: false}
      openshift: {createSCC: true}

  - id: qwen3-14b
    display_name: Qwen3 14B
    description: Mid-size general chat model from Qwen, quantized to 4-bit, with a 64K-token context window.
    task: chat
    platform: x86
    gpu: {count: 1, min_vram_gb: 24}
    product_id: com.edgescaleai-cube:esai-sovereign-ai-qwen3-14b-turboquant
    entity_name: esai-sovereign-ai-qwen3-14b-turboquant
    config_block_version: "0.5.1"
    service: qwen3-14b-turboquant
    port: 8000
    served_model: Qwen/Qwen3-14B-AWQ
    storage_gb: 50
    # Published 0.5.1 predates the repo's chart-default fixes: it requires a
    # huggingface-secret for a public model and enables a same-namespace-only
    # NetworkPolicy.
    install_overrides:
      huggingface: {enabled: false}
      networkPolicy: {enabled: false}
      openshift: {createSCC: true}

  # Chart on sovereign-ai's feat/gemma-4-31b-coserve (not yet on main); 0.1.1 is published
  # on RELEASE and runs on cube-9p4t83wd. Its defaults need no override. NVFP4 weights
  # (21.7 GiB) target NVIDIA Blackwell; the catalog cannot express an architecture, so the
  # description says it and min_vram_gb is the smallest card it was sized for comfortably.
  - id: gemma-4-31b
    display_name: Gemma 4 31B
    description: Large multimodal chat model from Google with tool calling, quantized to 4-bit for NVIDIA Blackwell GPUs; reads images as well as text.
    task: chat
    platform: x86
    gpu: {count: 1, min_vram_gb: 48}
    product_id: com.edgescaleai-cube:esai-sovereign-ai-gemma-4-31b
    entity_name: esai-sovereign-ai-gemma-4-31b
    config_block_version: "0.1.1"
    service: gemma-4-31b
    port: 8000
    served_model: gemma-4-31b           # --served-model-name; HF id RedHatAI/gemma-4-31B-it-NVFP4
    storage_gb: 60

