[project]
name = "cube-cloud"
version = "0.1.0"
description = "Cloud MCP server for cube-mcp: FastAPI + Streamable HTTP transport"
requires-python = ">=3.10"
dependencies = [
    "cube-common",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "mcp>=1.0.0,<2",
    "pydantic-settings>=2.0.0",
    "boto3>=1.35.0",
    "httpx>=0.27.0",
    "h11>=0.14.0",
    "wsproto>=1.2.0",
    "pyyaml>=6.0",
    "python-jose[cryptography]>=3.3.0",
    # Groundcover OTLP export (tool-call analytics hot/correlation tier)
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    # httpx and boto3 verify TLS with certifi; below 2026.10.19 it trusts the
    # compromised emSign ECC Root CA - G3 (GHSA-6q48-6c7w-9gw2).
    "certifi>=2026.10.19",
    # The InControl2 client converts router report times with zoneinfo; the slim base
    # image need not carry an IANA database, so ship one (the Dockerfile asserts it).
    "tzdata>=2024.1",
]

[project.scripts]
cube-cloud = "cube_cloud.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cube_cloud"]
