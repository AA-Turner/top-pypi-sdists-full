# Drives the example app the way a user would and checks the rendered AST. Run with
# maestro test -e APP_ID=<android or ios app id> .maestro/parse.yaml
appId: ${APP_ID}
---
- launchApp:
    clearState: true

# A release build cold starting on a two-core emulator can take a while to render, and the
# default element timeout is short enough to lose that race.
- extendedWaitUntil:
    visible:
      id: "input"
    timeout: 30000

# The default content exercises a heading, bold, and a snowflake mention; the mention id must
# round-trip as a BigInt ("…n" suffix) with full precision.
- copyTextFrom:
    id: "ast"
- assertTrue: "${maestro.copiedText.indexOf('\"type\": \"heading\"') !== -1}"
- assertTrue: "${maestro.copiedText.indexOf('\"873227248453443624n\"') !== -1}"

# The lossless tree's tokens write back exactly what was typed, so the text survived the trip
# across JSI.
- copyTextFrom:
    id: "lossless"
- assertTrue: "${maestro.copiedText === '# Hello **world** <@873227248453443624>'}"

# MainActivity.kt / AppDelegate.swift parsed content through the Kotlin or Swift wrapper at
# launch, outside JS; the app reports whether the lossless tree wrote it back, emoji included,
# and whether the AST had the snowflake as a plain number rather than JS's $bigint wrapper.
- copyTextFrom:
    id: "native"
- assertTrue: "${maestro.copiedText === 'native: ok'}"

# Type new content and check the AST updates. Clear through the button rather than erasing:
# tapping a filled input leaves the caret wherever the tap landed, and eraseText only deletes
# backwards from there, so the tail of the old content would survive.
- tapOn:
    id: "clear"
- tapOn:
    id: "input"
- inputText: "> quote me"
- copyTextFrom:
    id: "ast"
- assertTrue: "${maestro.copiedText.indexOf('\"type\": \"quote\"') !== -1}"
- copyTextFrom:
    id: "lossless"
- assertTrue: "${maestro.copiedText === '> quote me'}"
