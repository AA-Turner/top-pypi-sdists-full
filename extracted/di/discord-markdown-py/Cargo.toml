[package]
name = "discord-markdown"
description = "Discord Markdown parser"
version = "0.1.0"
edition = "2024"
license = "MIT"
resolver = "2"
rust-version = "1.93.1"

[workspace]
members = ["ffi/py", "packages/confusables", "packages/emoji", "packages/variant-struct"]

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
aho-corasick = "1.1.5"
discord-confusables = { version = "0.1.0", path = "packages/confusables" }
discord-emoji = { version = "0.1.0", path = "packages/emoji" }
enumset = { version = "1.1.5", features = ["alloc"] }
icu_properties = "2.2.0"
itertools = "0.14.0"
memchr = "2.7.4"
nom = "8.0.0"
serde = { version = "1.0.204", optional = true, features = ["derive"] }
tracing = "0.1.41"
url = "2.5.0"
variant-struct = { version = "0.1.0", path = "packages/variant-struct" }

[dev-dependencies]
discord-markdown = { path = ".", features = ["serde"] }
gungraun = "0.20.0"
nom-language = "0.1.0"
ntest = "^0.9"
pretty_assertions = "1.4.0"
serde_json = "1.0.120"
static_assertions = "1.1.0"

[[bench]]
name = "block"
harness = false

[[bench]]
name = "masked_link"
harness = false

[profile.release]
lto = true
strip = "symbols"

[profile.bench]
debug = true
strip = false

[features]
serde = ["dep:serde", "url/serde", "enumset/serde"]
