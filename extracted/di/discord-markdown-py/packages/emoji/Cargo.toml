[package]
name = "discord-emoji"
version = "0.1.0"
edition = "2024"
readme = "README.md"

[dependencies]
phf = "0.12.1"

[build-dependencies]
phf_codegen = "0.12.1"
reqwest = { version = "0.12.22", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
