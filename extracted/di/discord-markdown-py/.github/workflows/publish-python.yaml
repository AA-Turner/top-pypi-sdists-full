name: Publish Python

on:
  workflow_dispatch:
    inputs:
      publish:
        required: true
        type: boolean
        default: false
        description: "Publish to PyPI? (unchecked = dry-run / twine check only)"

concurrency:
  group: publish-python
  cancel-in-progress: false

jobs:
  build-wheels:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheels (${{ matrix.target }})
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          working-directory: ffi/py
          args: --release --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: ffi/py/dist/

  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          working-directory: ffi/py
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ffi/py/dist/

  publish:
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List built distributions
        run: ls -la dist/

      - name: Validate distributions (dry-run)
        if: ${{ !inputs.publish }}
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - name: Publish to PyPI
        if: inputs.publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
