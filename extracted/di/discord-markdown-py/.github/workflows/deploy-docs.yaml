name: Deploy Docs

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Pages deploys the artifact using the token of the run that built it.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; queue rather than cancel so a push never leaves Pages
# serving a half-finished deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Update Rust
        run: rustup update stable && rustup default stable

      # --all-features documents the serde-gated types; --no-deps keeps the
      # output to this workspace's crates rather than every dependency.
      - name: Build docs
        run: cargo doc --no-deps --workspace --all-features

      # cargo emits no root index.html for a workspace, so point / at the main
      # crate. Everything else is reachable from its sidebar.
      - name: Add redirect to index
        run: echo '<meta http-equiv="refresh" content="0;url=discord_markdown/index.html">' > target/doc/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
