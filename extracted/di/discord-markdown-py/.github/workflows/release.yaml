name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        required: true
        type: boolean
        description: "Publish to NPM?"
      package:
        required: true
        type: choice
        options:
          - lib/types
          - lib/wasm
          - lib/react
        description: "Package path to publish"
      tag:
        required: false
        type: string
        default: "latest"
        description: "NPM version tag"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update Rust
        run: rustup update stable && rustup default stable

      - uses: actions/setup-node@v4
        with:
          node-version: latest
          registry-url: https://registry.npmjs.org
          scope: "@discord"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: true

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Build web
        run: pnpm --filter "@discord/markdown-wasm" --filter "@discord/markdown-react" build

      - name: Publish ${{ inputs.package }} (dry run)
        if: ${{ !inputs.publish }}
        run: pnpm publish --access public --tag ${{ inputs.tag }} --no-git-checks --dry-run
        working-directory: ${{ inputs.package }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish ${{ inputs.package }}
        if: inputs.publish
        run: pnpm publish --access public --tag ${{ inputs.tag }} --no-git-checks
        working-directory: ${{ inputs.package }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
