name: Publish NPM

on:
  workflow_dispatch:
    inputs:
      publish:
        required: true
        type: boolean
        default: false
        description: "Publish to NPM? (unchecked = dry-run)"
      tag:
        required: false
        type: string
        default: "latest"
        description: "NPM version tag"

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    env:
      TAG: ${{ inputs.tag }}
      # "true" for a real publish; anything else makes publish.sh use --dry-run.
      PUBLISH: ${{ inputs.publish }}

    steps:
      - uses: actions/checkout@v6

      - name: Update Rust
        run: rustup update stable && rustup default stable

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never use caching in release builds

      - uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: true

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.13.1'

      - name: Build web
        id: build
        run: pnpm --filter "@discord/markdown-wasm" --filter "@discord/markdown-react" build

      # Each package is published in its own step. The `!cancelled()` guard lets
      # every package attempt to publish even if an earlier one failed, while
      # `steps.build.outcome` keeps them from running if the build itself broke.
      # publish.sh asks the registry whether the package version already exists
      # and skips it if so; any other failure fails the step. lib/react depends
      # on lib/wasm, so it is published last (pnpm rewrites workspace:* at pack
      # time).
      - name: Publish @discord/markdown-types
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: .github/workflows/publish.sh lib/types

      - name: Publish @discord/markdown-wasm
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: .github/workflows/publish.sh lib/wasm

      - name: Publish @discord/markdown-react
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: .github/workflows/publish.sh lib/react
