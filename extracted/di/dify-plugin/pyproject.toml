[project]
name = "dify-plugin"
version = "0.11.0"
description = "Dify Plugin SDK"
dependencies = [
    "Flask>=3.1.3",
    "Werkzeug>=3.1.9",
    "gevent>=26.9.0",
    "h11>=0.16.0",
    "httpx>=0.28.1",
    "pydantic_settings>=2.16.2",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "socksio>=1.0.0",
    "tiktoken>=0.14.0",
    "yarl>=1.25.1",
    "packaging>=26.3",
]
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "dify",
    "plugin",
    "sdk",
]

[[project.authors]]
name = "langgenius"
email = "hello@dify.ai"

[project.urls]
source = "https://github.com/langgenius/dify-plugin-sdks"
homepage = "https://github.com/langgenius/dify-plugin-sdks"
issues = "https://github.com/langgenius/dify-plugin-sdks/issues"

[build-system]
requires = ["uv_build~=0.13.6"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "prek",
    "pytest",
    "pytest-cov",
    "pytest-httpserver>=1.2.0",
    "pytest-mock",
    "pytest-timeout>=2.4.0",
    "ruff",
    "trustme>=1.2.1",
    "ty",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
]
timeout = "60"
xfail_strict = true
markers = ["integration: runs a real plugin process or local protocol service"]
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnhandledThreadExceptionWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
source_pkgs = ["dify_plugin"]
concurrency = ["gevent"]
patch = ["subprocess"]
sigterm = true

[tool.coverage.paths]
source = [
    "src/dify_plugin",
    "*/site-packages/dify_plugin",
]

[tool.ruff]
preview = true
required-version = ">=0.17.3"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "too-many-statements",
    "commented-out-code",
    "too-many-branches",
    "too-many-locals",
    "raise-vanilla-class",
    "blind-except",
    "raise-within-try",
    "too-many-arguments",
    "too-many-positional-arguments",
    "complex-structure",
    "FBT",
    "TC",
    "relative-imports",
    "no-self-use",
    "missing-trailing-comma",
    "CPY",
    "D",
]

[tool.ruff.lint.pydoclint]
ignore-one-line-docstrings = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "assert",
    "private-member-access",
    "magic-value-comparison",
]
