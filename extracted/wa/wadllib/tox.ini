[tox]
envlist =
    py38,py39,py310,py311,py312,py313,py314,docs

[testenv]
commands =
    zope-testrunner --test-path src --tests-pattern ^tests {posargs}
deps =
    zope-testrunner
extras =
    test

[testenv:docs]
basepython =
    python3.11
commands =
    sphinx-build -b html -d src/wadllib/docs/_build/doctrees src/wadllib/docs src/wadllib/docs/_build/html
deps =
    .[docs]

[testenv:lint]
basepython =
    python3.12
deps =
    pip>=26.0
    pre-commit
commands =
    pre-commit run --all-files

[testenv:audit]
basepython = py3.12
deps =
    pip>=26.0
    pip-audit
commands =
    pip-audit -v
