[build-system]
requires = ["uv_build>=0.9.16,<0.13.0"]
build-backend = "uv_build"

[project]
name = "peakrdl-rawheader"
version = "0.2.8"
requires-python = ">=3.10"
readme = "README.md"
description = "Generate Header files from a SystemRDL register model"
dependencies = [
    "mako>=1.2.4",
    "systemrdl-compiler >= 1.29.0, < 2",
]
keywords = [
    "SystemRDL",
    "PeakRDL",
    "CSR",
    "compiler",
    "tool",
    "registers",
    "generator",
    "C",
    "header",
    "software",
    "SystemVerilog",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.license]
file = "LICENSE"

[[project.authors]]
name = "Michael Rogenmoser"

[project.optional-dependencies]
cli = ["peakrdl-cli >= 1.2.3"]

[project.entry-points."peakrdl.exporters"]
raw-header = "peakrdl_rawheader.__peakrdl__:HeaderGeneratorDescriptor"

[dependency-groups]
test = [
    "peakrdl",
    "pytest",
]
docs = [
    "sphinx",
    "sphinx-book-theme",
    "pygments-systemrdl",
]
dev = [
    "ruff>=0.16.1",
    "ty>=0.0.65",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["peakrdl_rawheader"]
