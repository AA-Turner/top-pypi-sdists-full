[aliases]
test = pytest

[nosetests]
with-coverage = 1
cover-xml = 1
cover-branches = 1
cover-package = pyipmi

[pep257]
ignore = D100,D101,D102,D103,D104,D105,D203,D204

[codespell]
skip = ./.git,./docs/_build,*.bin,*.pyc,./tests/fru_bin,./tests/hpm_bin,./man/ipmitool.py.1
ignore-words-list = pres

[mypy]
files = pyipmi
disallow_untyped_defs = True

[mypy-serial.*,pyaardvark.*,cryptography.*,pyipmi.version]
ignore_missing_imports = True

[egg_info]
tag_build = 
tag_date = 0

