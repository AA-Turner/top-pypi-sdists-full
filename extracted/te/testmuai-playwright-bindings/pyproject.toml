[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "testmuai-playwright-bindings"
version = "0.1.35"
description = "TestMu binding for Playwright Python — thin test runtime for TestMu-exported tests on the LambdaTest grid"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "TestMu AI", email = "engineering@testmu.ai"},
]
keywords = ["testing", "playwright", "lambdatest", "testmu", "automation", "e2e"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Topic :: Software Development :: Testing",
    "Framework :: Pytest",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "playwright>=1.57.0",
    "pyotp>=2.9.0",
    "aiohttp",
    "httpx>=0.27.0",
    "Pillow>=11.0.0",
    "requests>=2.28.0",
    "websockets>=12",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.urls]
Homepage = "https://github.com/LambdaTest/testmuai-bindings"
Repository = "https://github.com/LambdaTest/testmuai-bindings"
Issues = "https://github.com/LambdaTest/testmuai-bindings/issues"

[tool.setuptools.package-data]
"testmu._helpers" = ["*.js"]

[tool.setuptools.packages.find]
include = ["testmu*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
