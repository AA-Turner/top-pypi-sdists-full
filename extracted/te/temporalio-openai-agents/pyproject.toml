[project]
name = "temporalio-openai-agents"
version = "1.1.0"
description = "Temporal integration for the OpenAI Agents SDK (temporalio.openai_agents)"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "temporalio[opentelemetry,pydantic]>=1.33.0,<2",
    "openai-agents>=0.22,<0.23",
    "openai>=3,<4",
    "mcp>=1.24,<3",
    "pydantic>=2,<3",
    "typing-extensions>=4.2,<5",
]

[[project.authors]]
name = "Temporal Technologies Inc"
email = "sdk@temporal.io"

[project.optional-dependencies]
mcp = [
    "mcp>=2,<3",
    "mcp-types>=2,<3",
    "temporalio-mcp>=0.2.0,<0.3",
]
openinference = [
    "openinference-instrumentation-openai-agents>=2,<3",
    "opentelemetry-sdk>=1.26,<2",
]

[project.urls]
Homepage = "https://github.com/temporalio/ai-integrations/tree/main/python/openai_agents"
Repository = "https://github.com/temporalio/ai-integrations"
Documentation = "https://docs.temporal.io/develop/python/integrations/openai-agents"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]
required-version = ">=0.12.5,<0.13"
exclude-newer = "2 weeks"

[tool.uv.build-backend]
module-name = "temporalio.openai_agents"

[tool.uv.exclude-newer-package]
temporalio = false
temporalio-mcp = false

[[tool.uv.cache-keys]]
file = "pyproject.toml"

[[tool.uv.cache-keys]]
file = "README.md"

[[tool.uv.cache-keys]]
file = "src/**/*"

[tool.pytest.ini_options]
asyncio_mode = "auto"
log_level = "DEBUG"
log_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
testpaths = ["tests"]
timeout = 60
timeout_func_only = true
filterwarnings = [
    "error::temporalio.workflow.UnfinishedUpdateHandlersWarning",
    "error::temporalio.workflow.UnfinishedSignalHandlersWarning",
    "ignore::pytest.PytestDeprecationWarning",
    "ignore::DeprecationWarning",
]

[tool.mypy]
files = [
    "src",
    "tests",
]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pyright]
extends = "../_shared/pyrightconfig.json"
include = [
    "src",
    "tests",
]

[[tool.pyright.executionEnvironments]]
root = "src"
reportMissingImports = "none"

[[tool.pyright.executionEnvironments]]
root = "."
extraPaths = ["src"]

[tool.pydocstyle]
convention = "google"
add_ignore = [
    "D205",
    "D415",
]

[tool.ruff]
extend = "../_shared/ruff.toml"
src = [
    ".",
    "src",
]

[dependency-groups]
dev = [
    "pyright==1.1.403",
    "basedpyright==1.34.0",
    "mypy==1.18.2",
    "ruff>=0.15.12,<0.16",
    "pydocstyle>=6.3,<7",
    "pytest~=9.0",
    "pytest-asyncio>=0.21.2,<0.22",
    "pytest-timeout~=2.2",
    "pytest-xdist>=3.6,<4",
    "pytest-pretty>=1.3",
    "pytest-rerunfailures>=16.1",
    "tomli>=2.0; python_version < '3.11'",
    "httpx2>=2.12,<3",
    "rich>=13",
    "mcp>=2,<3",
    "mcp-types>=2,<3",
    "temporalio-mcp>=0.2.0,<0.3",
    "openinference-instrumentation-openai-agents>=2,<3",
    "opentelemetry-sdk>=1.26,<2",
    "openai-agents[litellm]>=0.22,<0.23",
    "litellm==1.83.0",
]
