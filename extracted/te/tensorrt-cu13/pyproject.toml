[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorrt_cu13"
version = "11.1.0.106"
description = "A high performance deep learning inference library"
readme = {text = "NVIDIA TensorRT is an SDK that facilitates high-performance machine learning inference. It is designed to work in a complementary fashion with training frameworks such as PyTorch. It focuses specifically on running an already-trained network quickly and efficiently on NVIDIA hardware.", content-type = "text/markdown"}
license = {text = "Proprietary"}
authors = [
    {name = "NVIDIA Corporation"}
]
classifiers = [
    "License :: Other/Proprietary License",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]
keywords = ["nvidia", "tensorrt", "deeplearning", "inference"]
requires-python = ">=3.8"

# Dependencies are hosted on pypi.nvidia.com and fetched using the wheel-stub package
dependencies = [
    "tensorrt_cu13_libs==11.1.0.106",
    "tensorrt_cu13_bindings==11.1.0.106",
]

[project.optional-dependencies]
numpy = ["numpy"]

[project.urls]
Homepage = "https://github.com/nvidia/tensorrt"
Download = "https://developer.nvidia.com/tensorrt"

[tool.setuptools]
zip-safe = true
include-package-data = true

[tool.setuptools.packages.find]
include = ["tensorrt*"]

[tool.setuptools.package-data]
"*" = ["*.so*", "*.pyd", "*.pdb", "*.dll*"]
