[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "testmuai-selenium-bindings"
version = "0.1.4"
description = "Testmu binding for Selenium Python — thin test runtime for LambdaTest exports"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{name = "LambdaTest", email = "engineering@lambdatest.com"}]
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Pytest",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "selenium>=4.17.0",
    "httpx>=0.27.0",
    "tenacity>=8.5.0",
    "pyotp>=2.9.0",
    "requests>=2.28.0",
    "Pillow>=11.0.0",
    "python-dotenv>=1.0.0",
    "lambdatest-selenium-driver>=1.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "respx>=0.20",
    "build>=1.0",
    "twine>=5.0",
]

[tool.setuptools.packages.find]
include = ["testmu_selenium*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
