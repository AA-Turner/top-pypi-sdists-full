[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "testscenarios"
description = "Testscenarios, a unittest extension for dependency injection"
readme = "README.rst"
classifiers = [
    "Development Status :: 6 - Mature",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
authors = [{name = "Testing-cabal", email = "testing-cabal@lists.launchpad.net"}]
license = {text = "Apache-2.0 OR BSD-3-Clause"}
requires-python = ">=3.10"
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/testing-cabal/testscenarios"
"Bug Tracker" = "https://github.com/testing-cabal/testscenarios/issues"
"Source Code" = "https://github.com/testing-cabal/testscenarios"

[project.optional-dependencies]
test = ["testtools >= 2.8.7"]
dev = [
    "ruff==0.16.4",
    "mypy>=1.20.0",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "testscenarios/_version.py"
tag-pattern = "^(testtools-)?(?P<version>[0-9]+(\\.[0-9]+)*(-[0-9]+)?)(\\.post(?P<post>[0-9]+))?$"
template = """\
# This file is automatically generated by hatch.
version = {version!r}
__version__ = {version_tuple!r}
"""

[tool.hatch.build.targets.sdist]
include = [
    "testscenarios*",
    "Apache-2.0",
    "BSD",
    "COPYING",
    "GOALS",
    "HACKING",
    "Makefile",
    "NEWS",
    "README.rst",
    "doc/*.py",
    "tests/*.py",
]

[tool.hatch.envs.lint]
features = ["dev", "test"]

[tool.hatch.envs.lint.scripts]
check = [
    "ruff check .",
    "ruff format --check .",
    "mypy -p testscenarios",
]

[tool.mypy]
python_version = "3.10"
show_column_numbers = true
show_error_context = true
strict = true
disable_error_code = ["import-untyped"]
exclude = '(?x)(doc)'

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_subclassing_any = false

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "PIE",
    "UP",
    "RSE",
    "RUF",
]
ignore = [
    "RUF012",
]
