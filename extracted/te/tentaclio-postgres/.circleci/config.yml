---
# Python CircleCI configuration file
#
# INFO: Check CircleCI documentation for more details
#       https://circleci.com/docs/guides/getting-started/language-python

version: 2.1

executors:
  standard:
    parameters:
      python-version:
        default: &default-python "3.13.17"
        type: string
      sha256-digest:
        default: &default-sha256-digest "sha256:2b43e59737792e1d77c4dfb413525e5476b7b04954f9f73652032ee3af5a3d43"  # cimg/python:3.13.17
        type: string
    docker:
      - image: cimg/python:<< parameters.python-version >>@<< parameters.sha256-digest >>

  standard-postgres:
    parameters:
      python-version:
        default: *default-python
        type: string
      sha256-digest:
        default: *default-sha256-digest
        type: string
    docker:
      - image: cimg/python:<< parameters.python-version >>@<< parameters.sha256-digest >>
        environment:
          TENTACLIO__CONN__POSTGRES_TEST: postgresql://:@localhost:5432/tentaclio-db
      - image: cimg/postgres:18.6@sha256:d4c42df0416f6fb66db64b1f4694d08cf25eb5c387ace62fa47eda1b7a538242
        environment:
          # CircleCI img run under `circleci` user
          POSTGRES_USER: circleci
          POSTGRES_DB: tentaclio-db


# -----------------
# Reusable commands
# -----------------

commands:
  configure_github:
    steps:
      - run:
          name: Configure Github access
          command: |
            git config --global --unset url.ssh://git@github.com.insteadof;\
            echo https://${GITHUB_TOKEN}:@github.com > ~/.git-credentials
            git config --global credential.helper store

  checkout_source:
    steps:
      - restore_cache:
          keys:
            - source-{{ .Branch }}-{{ .Revision }}
            - source-{{ .Branch }}-
            - source-
      - checkout:
          method: full
      - save_cache:
          key: source-{{ .Branch }}-{{ .Revision }}
          paths:
            - "./.git"

  update_virtualenv:
    parameters:
      python-version:
        type: string
    steps:
      - restore_cache:
          keys:
            - virtualenv-<< parameters.python-version >>-{{ .Environment.CACHE_VERSION }}-{{ .Branch }}-{{ checksum "uv.lock" }}
            - virtualenv-<< parameters.python-version >>-{{ .Environment.CACHE_VERSION }}-{{ .Branch }}-
            - virtualenv-<< parameters.python-version >>-{{ .Environment.CACHE_VERSION }}-
      - configure_github
      - run:
          name: Install Python packages
          command: uv sync --locked
      - save_cache:
          key: virtualenv-<< parameters.python-version >>-{{ .Environment.CACHE_VERSION }}-{{ .Branch }}-{{ checksum "uv.lock" }}
          paths:
            - "./.venv"


jobs:
  lint:
    parameters:
      python-version:
        default: *default-python
        type: string
      sha256-digest:
        default: *default-sha256-digest
        type: string
    executor:
      name: standard
      python-version: << parameters.python-version >>
      sha256-digest: << parameters.sha256-digest >>
    steps:
      - checkout_source
      - update_virtualenv:
          python-version: << parameters.python-version >>
      - run:
          name: Run Python linter
          command: make lint

  unit:
    parameters:
      python-version:
        type: string
      sha256-digest:
        type: string
    executor:
      name: standard
      python-version: << parameters.python-version >>
      sha256-digest: << parameters.sha256-digest >>
    steps:
      - checkout_source
      - update_virtualenv:
          python-version: << parameters.python-version >>
      - run:
          name: Run Python unit tests
          command: make unit

  functional:
    parameters:
      python-version:
        type: string
      sha256-digest:
        type: string
    executor:
      name: standard-postgres
      python-version: << parameters.python-version >>
      sha256-digest: << parameters.sha256-digest >>
    steps:
      - checkout_source
      - update_virtualenv:
          python-version: << parameters.python-version >>
      - run:
          name: Run postgres functional tests
          command: make functional


workflows:
  version: 2

  test-build-deploy:
    jobs:
      - lint:
          filters:
            tags:
              only: /.*/
      - unit:
          name: unit-3.11
          python-version: &python311 "3.11.17"
          sha256-digest: &sha256-python311 "sha256:5ce8a1b7b8a325beb7a8041d5573d27f5bdc292d0ff5bf48c49a8cc5d9dd5bdd"  # cimg/python:3.11.17
          filters:
            tags:
              only: /.*/
      - unit:
          name: unit-3.12
          python-version: &python312 "3.12.15"
          sha256-digest: &sha256-python312 "sha256:e2a7e6b86e8262f313fd4832c68a61bf60084403d87009dac12d342efbfffb61"  # cimg/python:3.12.15
          filters:
            tags:
              only: /.*/
      - unit:
          name: unit-3.13
          python-version: &python313 "3.13.17"
          sha256-digest: &sha256-python313 "sha256:2b43e59737792e1d77c4dfb413525e5476b7b04954f9f73652032ee3af5a3d43"  # cimg/python:3.13.17
          filters:
            tags:
              only: /.*/
      - unit:
          name: unit-3.14
          python-version: &python314 "3.14.9"
          sha256-digest: &sha256-python314 "sha256:55b4b277ea43a3cecad39964aaa20fc3af93a5a5d4b371fc63aae0860a618bcd"  # cimg/python:3.14.9
          filters:
            tags:
              only: /.*/
      - unit:
          name: unit-3.15
          python-version: &python315 "3.15.1"
          sha256-digest: &sha256-python315 "sha256:cce73515b1ef05ddbb6dc34b562d59bb0a13de10db12baf31ffe7c1388973d39"  # cimg/python:3.15.1
          filters:
            tags:
              only: /.*/
      - functional:
          name: functional-3.11
          python-version: *python311
          sha256-digest: *sha256-python311
          filters:
            tags:
              only: /.*/
          requires:
            - lint
            - unit-3.11
      - functional:
          name: functional-3.12
          python-version: *python312
          sha256-digest: *sha256-python312
          filters:
            tags:
              only: /.*/
          requires:
            - lint
            - unit-3.12
      - functional:
          name: functional-3.13
          python-version: *python313
          sha256-digest: *sha256-python313
          filters:
            tags:
              only: /.*/
          requires:
            - lint
            - unit-3.13
      - functional:
          name: functional-3.14
          python-version: *python314
          sha256-digest: *sha256-python314
          filters:
            tags:
              only: /.*/
          requires:
            - lint
            - unit-3.14
      - functional:
          name: functional-3.15
          python-version: *python315
          sha256-digest: *sha256-python315
          filters:
            tags:
              only: /.*/
          requires:
            - lint
            - unit-3.15
