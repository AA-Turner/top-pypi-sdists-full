---
# Python CircleCI configuration file
#
# INFO: Check CircleCI documentation for more details
#       https://circleci.com/docs/guides/getting-started/language-python

version: 2.1

executors:
  standard:
    parameters:
      python-version:
        default: &default-python "3.13.17"
        type: string
      sha256-digest:
        default: &default-sha256-digest "sha256:2b43e59737792e1d77c4dfb413525e5476b7b04954f9f73652032ee3af5a3d43"  # cimg/python:3.13.17
        type: string
    docker:
      - image: cimg/python:<< parameters.python-version >>@<< parameters.sha256-digest >>

  standard-ftp:
    parameters:
      python-version:
        default: *default-python
        type: string
      sha256-digest:
        default: *default-sha256-digest
        type: string
    docker:
      - image: cimg/python:<< parameters.python-version >>@<< parameters.sha256-digest >>
        environment:
          TENTACLIO__CONN__FTP_TEST: ftp://octopus:tentacle@localhost
      - image: mauler/simple-ftp-server
        environment:
          FTP_USER: octopus
          FTP_PASS: tentacle

  standard-sftp:
    parameters:
      python-version:
        default: *default-python
        type: string
      sha256-digest:
        default: *default-sha256-digest
        type: string
    docker:
      - image: cimg/python:<< parameters.python-version >>@<< parameters.sha256-digest >>
        environment:
          TENTACLIO__CONN__SFTP_TEST: sftp://octopus:tentacle@localhost:22
      - image: atmoz/sftp
        command: octopus:tentacle:::upload


# -----------------
# Reusable commands
# -----------------

commands:
  configure_github:
    steps:
      - run:
          name: Configure Github access
          command: |
            git config --global --unset url.ssh://git@github.com.insteadof;\
            echo https://${GITHUB_TOKEN}:@github.com > ~/.git-credentials
            git config --global credential.helper store

  checkout_source:
    steps:
      - restore_cache:
          keys:
            - source-{{ .Branch }}-{{ .Revision }}
            - source-{{ .Branch }}-
            - source-
      - checkout:
          method: full
      - save_cache:
          key: source-{{ .Branch }}-{{ .Revision }}
          paths:
            - "./.git"

  update_virtualenv:
    parameters:
      python-version:
        type: string
    steps:
      - restore_cache:
          keys:
            - virtualenv-<< parameters.python-version >>-{{ .Environment.CACHE_VERSION }}-{{ .Branch }}-{{ checksum "uv.lock" }}
            - virtualenv-<< parameters.python-version >>-{{ .Environment.CACHE_VERSION }}-{{ .Branch }}-
            - virtualenv-<< parameters.python-version >>-{{ .Environment.CACHE_VERSION }}-
      - configure_github
      - run:
          name: Install uv
          command: |
            curl -LsSf https://astral.sh/uv/0.13.5/install.sh | sh 
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            uv --version
      - run:
          name: Install Python packages
          command: uv sync --locked
      - save_cache:
          key: virtualenv-<< parameters.python-version >>-{{ .Environment.CACHE_VERSION }}-{{ .Branch }}-{{ checksum "uv.lock" }}
          paths:
            - "./.venv"


jobs:
  lint:
    parameters:
      python-version:
        default: *default-python
        type: string
      sha256-digest:
        default: *default-sha256-digest
        type: string
    executor:
      name: standard
      python-version: << parameters.python-version >>
      sha256-digest: << parameters.sha256-digest >>
    steps:
      - checkout_source
      - update_virtualenv:
          python-version: << parameters.python-version >>
      - run:
          name: Run Python linter
          command: make lint

  unit:
    parameters:
      python-version:
        type: string
      sha256-digest:
        type: string
    executor:
      name: standard
      python-version: << parameters.python-version >>
      sha256-digest: << parameters.sha256-digest >>
    steps:
      - checkout_source
      - update_virtualenv:
          python-version: << parameters.python-version >>
      - run:
          name: Run Python unit tests
          command: make unit

  functional-ftp:
    parameters:
      python-version:
        type: string
      sha256-digest:
        type: string
    executor:
      name: standard-ftp
      python-version: << parameters.python-version >>
      sha256-digest: << parameters.sha256-digest >>
    steps:
      - checkout_source
      - update_virtualenv:
          python-version: << parameters.python-version >>
      - run:
          name: Run ftp functional tests
          command: make functional-ftp

  functional-sftp:
    parameters:
      python-version:
        type: string
      sha256-digest:
        type: string
    executor:
      name: standard-sftp
      python-version: << parameters.python-version >>
      sha256-digest: << parameters.sha256-digest >>
    steps:
      - checkout_source
      - update_virtualenv:
          python-version: << parameters.python-version >>
      - run:
          name: Run sftp functional tests
          command: make functional-sftp


workflows:
  version: 2

  test-build-deploy:
    jobs:
      - lint:
          filters:
            tags:
              only: /.*/
      - unit:
          name: unit-3.11
