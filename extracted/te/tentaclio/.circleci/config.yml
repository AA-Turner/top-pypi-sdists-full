      - functional-ftp:
          name: functional-ftp-3.14
          python-version: *python314
          sha256-digest: *sha256-python314
          filters:
            tags:
              only: /.*/
          requires:
            - lint
            - unit-3.14
      - functional-ftp:
          name: functional-ftp-3.15
          python-version: *python315
          sha256-digest: *sha256-python315
          filters:
            tags:
              only: /.*/
          requires:
            - lint
            - unit-3.15
      - functional-sftp:
          name: functional-sftp-3.11
          python-version: *python311
          sha256-digest: *sha256-python311
          filters:
            tags:
              only: /.*/
          requires:
