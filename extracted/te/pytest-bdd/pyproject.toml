[project]
name = "pytest-bdd"
version = "9.0.0"
description = "BDD for pytest"
requires-python = ">=3.10"
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE.txt"]
classifiers = [
    "Development Status :: 6 - Mature",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "Mako",
    "parse",
    "parse-type",
    "pytest>=7.0.0",
    "typing-extensions",
    "packaging",
    "gherkin-official>=29.0.0,!=31.0.0,!=32.0.0",
]

[[project.authors]]
name = "Oleg Pidsadnyi"
email = "oleg.pidsadnyi@gmail.com"

[[project.authors]]
name = "Anatoly Bubenkov"
email = "bubenkoff@gmail.com"

[[project.maintainers]]
name = "Alessio Bogon"
email = "778703+youtux@users.noreply.github.com"

[project.urls]
homepage = "https://pytest-bdd.readthedocs.io/"
documentation = "https://pytest-bdd.readthedocs.io/"
repository = "https://github.com/pytest-dev/pytest-bdd"

[project.scripts]
pytest-bdd = "pytest_bdd.scripts:main"

[project.entry-points.pytest11]
pytest-bdd = "pytest_bdd.plugin"

[dependency-groups]
dev = [
    "tox>=4.22.0",
    "mypy>=1.6.0",
    "types-setuptools>=68.2.0.0",
    "pytest-xdist>=3.3.1",
    "coverage[toml]>=6.5.0",
    "Pygments>=2.20.0",
    "sphinx",
    "sphinx-autobuild",
]
build = [
    "build",
    "twine",
]

[tool.uv]
default-groups = "all"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = [
    "B",
    "BLE",
    "C4",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "ISC",
    "PERF",
    "UP",
]
ignore = ["ISC001"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.coverage.report]
exclude_lines = [
    "if TYPE_CHECKING:",
    'if typing\.TYPE_CHECKING:',
]

[tool.coverage.html]
show_contexts = true

[tool.coverage.run]
branch = true
parallel = true
source = [
    "pytest_bdd",
    "tests",
]
dynamic_context = "test_function"

[tool.coverage.paths]
source = [
    "src/pytest_bdd",
    ".tox/*/lib/python*/site-packages/pytest_bdd",
]

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
files = "src/pytest_bdd/**/*.py"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "parse",
    "parse_type",
]
ignore_missing_imports = true

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
