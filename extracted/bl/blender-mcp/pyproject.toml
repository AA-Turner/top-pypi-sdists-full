[project]
name = "blender-mcp"
version = "2.0.0"
description = "Renamed to mcp-for-blender. Installing this package installs it for you."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Siddharth Ahuja", email = "ahujasid@gmail.com"}]
dependencies = ["mcp-for-blender>=2.0.0"]

[project.scripts]
blender-mcp = "blender_mcp_shim:main"

[project.urls]
"Homepage" = "https://github.com/ahujasid/mcp-for-blender"

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["blender_mcp_shim"]
