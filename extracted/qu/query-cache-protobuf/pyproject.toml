[project]
name = "query-cache-protobuf"
dynamic = ["version"]
description = "Generated protobuf code for Query Cache"
license = {file = "../../LICENSE"}
requires-python = ">=3.9"
dependencies = [
    "packaging",
    "protobuf>=4.0.0",
]

[tool.hatch.version]
source = "code"
path = "../../tooling/versions.py"
expression = "VERSIONS['query-cache-protobuf']"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
