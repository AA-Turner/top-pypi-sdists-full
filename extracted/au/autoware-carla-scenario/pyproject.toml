[project]
name = "autoware-carla-scenario"
version = "27.2.1"
description = "CARLA scenario testing framework for Autoware"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "typesafe-carla>=0.8.1,<0.9; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
    "pyxodr>=0.1.0",
    "opencv-python-headless>=4.8",
    "numpy>=1.21",
    "pytest>=9.0.1",
    "mypy>=1.19.0",
    "python-dotenv>=1.2.2",
    "simple-lanelet2>=1.2.3",
    "tqdm>=4.67.1",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "openodd-py>=0.47.0",
    "packaging>=23.0",
    "tomli>=1.1.0; python_version < '3.11'",
    "pydantic>=2.0.0",
    "carla-driver-interface>=2.4.2,<3",
    "grpcio>=1.60",
    "protobuf>=4.25.0,<8",
    "orjson>=3.13.0",
]

[[project.authors]]
name = "Masaya Kataoka"
email = "ms.kataoka@gmail.com"

[project.urls]
Homepage = "https://github.com/autowarefoundation/autoware_carla_scenario"
Documentation = "https://autowarefoundation.github.io/autoware_carla_scenario/"
Repository = "https://github.com/autowarefoundation/autoware_carla_scenario"
Issues = "https://github.com/autowarefoundation/autoware_carla_scenario/issues"
Changelog = "https://github.com/autowarefoundation/autoware_carla_scenario/releases"

[project.optional-dependencies]
sumo = [
    "eclipse-sumo>=1.23",
    "libsumo>=1.23",
    "sumolib>=1.23",
    "traci>=1.23",
    "roadgen>=0.42.0",
]
map = ["roadgen>=0.42.0"]
ros2 = ["cyclonedds>=11.0.1; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version < '3.14'"]
rerun = [
    "autoware-carla-scenario-rerun>=0.3,<0.4",
    "rerun-sdk>=0.38.1,<0.39",
]
rerun-lidar = [
    "autoware-carla-scenario-rerun>=0.3,<0.4",
    "rerun-sdk>=0.38.1,<0.39",
]
t4 = ["autoware-carla-scenario-t4>=0.1,<0.2"]
hils = ["hilspy>=0.16,<0.18"]
hils-setup = [
    "autoware-carla-scenario[hils]",
    "hilspy>=0.17,<0.18",
    "ansible-runner>=2.4",
    "ansible-core>=2.15",
]
viewer = ["autoware-carla-scenario-rerun[viewer]>=0.3,<0.4"]

[project.scripts]
scenario = "autoware_carla_scenario.examples.run:main"
scenario-expand = "autoware_carla_scenario.examples.expand:main"
scenario-check = "autoware_carla_scenario.typecheck.cli:main"
scenario-coverage = "autoware_carla_scenario.coverage.report:main"
scenario-gate = "autoware_carla_scenario.gate.evaluate:main"
scenario-slurm = "autoware_carla_scenario.slurm.cli:main"
scenario-odd = "autoware_carla_scenario.odd.cli:main"
scenario-new = "autoware_carla_scenario.scaffold.generator:main"
scenario-setup = "autoware_carla_scenario.carla_install:main"
detect-no-3d-model = "autoware_carla_scenario.tools.detect_no_3d_model_lanelets:main"
viewer = "autoware_carla_scenario.ui:main"
scenario-editor = "autoware_carla_scenario.editor:main"
scenario-hils = "autoware_carla_scenario.hils.cli:main"
scenario-t4scene = "autoware_carla_scenario.t4_scene.__main__:main"
scenario-wosac = "autoware_carla_scenario.wosac.__main__:main"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
namespace = true
module-name = [
    "autoware_carla_scenario",
    "hydra_plugins.autoware_scenario_searchpath",
    "hydra_plugins.autoware_scenario_sweeper",
]
