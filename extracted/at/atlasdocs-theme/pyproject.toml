[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlasdocs-theme"
version = "0.8.7"
description = "ATLASDocs hub theme for Zensical/MkDocs"
authors = [
  { name = "Jason Oliver", email = "jason.oliver@cern.ch" }
]
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["zensical>=0.0.41", "requests>=2.28", "pyyaml>=6"]

[project.optional-dependencies]
jira   = ["atlasdocs-jira"]
indico = ["atlasdocs-indico"]
gitlab = ["atlasdocs-gitlab"]
all    = ["atlasdocs-theme[jira,indico,gitlab]"]

[project.scripts]
atlasdocs-import-sources = "atlasdocs_theme.scripts.import_sources:main"

[tool.hatch.build.targets.wheel]
include = ["atlasdocs_theme"]

[project.entry-points."mkdocs.themes"]
atlasdocs_theme = "atlasdocs_theme"
