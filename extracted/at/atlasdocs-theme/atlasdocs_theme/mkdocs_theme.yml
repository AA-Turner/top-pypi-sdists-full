extends: "material"

logo: "assets/logo/atlaslogo.svg"
favicon: "assets/logo/atlaslogo.svg"

custom_dir: "overrides/"

font: false

palette:
  - scheme: default
    primary: blue
    accent: blue
    toggle:
      icon: lucide/sparkles
      name: Switch to dark mode
  - scheme: slate
    primary: blue
    accent: blue
    toggle:
      icon: lucide/sun
      name: Switch to light mode


