[project]
name = "investor-agent"
version = "1.7.0"
description = "DEPRECATED — v2.0 is a complete rewrite on Cloudflare Workers. See https://github.com/ferdousbhai/investor-agent"
requires-python = ">=3.12"
dependencies = []
authors = [
    { name = "Ferdous", email = "ferdous@hey.com" }
]
keywords = ["deprecated", "investment", "finance", "mcp"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/ferdousbhai/investor-agent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["investor_agent"]
