[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "instructure-dap-client"
description = "Data Access Platform client library"
readme = { file = "pypi_index.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
maintainers = [{ name = "Instructure, Inc.", email = "dapclient@instructure.com" }]
dynamic = ["version"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp == 3.13.4",
    "aiohttp-retry == 2.9.1",
    "aiofiles == 25.1.0",
    "asyncclick == 8.1.8.0",
    "PyJWT == 2.13.0",
    "tsv2py == 0.7.1",
    "rich == 14.3.3",
    # Direct dependencies of the vendored `strong_typing` and `pysqlsync` packages;
    # they are no longer resolved for us. See vendor/VENDORED.md and re-check these
    # when re-vendoring.
    "jsonschema == 4.26.0",
    "truststore == 0.10.4",
    # `pysqlsync.util.typing` imports `override` from typing_extensions below 3.12.
    "typing_extensions == 4.16.0; python_version < '3.12'",
]

# Database drivers for the vendored `pysqlsync` dialects that dap ships. These were
# previously pulled in via the `pysqlsync[...]` extras.
[project.optional-dependencies]
postgresql = ["asyncpg == 0.31.0"]
mysql = [
    "aiomysql == 0.3.2",
    # `pysqlsync.dialect.mysql.dependency` imports `cryptography` directly, and the
    # `[rsa]` extra is what supplies it. Keep both: without them the mysql dialect
    # silently degrades to an unavailable engine at run time.
    "PyMySQL[rsa] == 1.2.0",
    "cryptography == 50.0.0",
]
mssql = ["pyodbc == 5.3.0"]

[project.scripts]
dap = "dap.__main__:console_entry"

[project.urls]
Changelog = "https://community.instructure.com/en/discussion/664378/2026-api-and-cli-change-log"

[dependency-groups]
dev = [
    "mypy == 1.19.1",
    "ruff == 0.15.5",
    "build == 1.4.0",
]
test = [
    "pytest == 9.0.2",
    "pytest-asyncio == 1.3.0",
    "coverage == 7.14.1",
    "aioresponses == 0.7.8",
]
typing = ["types-aiofiles == 25.1.0.20251011"]

[tool.setuptools.dynamic]
version = { attr = "dap.__version__" }

[tool.setuptools]
include-package-data = true # picks up MANIFEST.in
zip-safe = true

[tool.setuptools.packages.find]
# Scoped to the three packages this distribution ships — `dap` plus the vendored
# `strong_typing` and `pysqlsync` (see vendor/VENDORED.md) — rather than discovering
# whatever happens to sit in this directory.
include = ["dap*", "strong_typing*", "pysqlsync*"]
exclude = [
    "dap.tests*",
    "strong_typing.tests*",
    "pysqlsync.tests*",
    "tests*",
    "doc*",
]

[tool.setuptools.package-data]
dap = ["py.typed"]
# Vendored packages -- see vendor/VENDORED.md. `pysqlsync` discovers its dialects by
# listing the installed `dialect/` directory at runtime, so every dialect subpackage
# must ship even though dap only uses postgresql/mysql/mssql.
strong_typing = ["py.typed"]
pysqlsync = ["py.typed", "dialect/*.md", "dialect/*/*.md"]

[tool.mypy]
check_untyped_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
ignore_missing_imports = true
namespace_packages = false
show_column_numbers = true
warn_redundant_casts = true
warn_unused_ignores = true

# Vendored third-party code (strong_typing, pysqlsync) -- generated artifacts, not
# held to dap's stricter settings. See vendor/VENDORED.md. `ignore_errors` rather than
# `follow_imports = silent`: the latter would also discard their type information,
# silently weakening type checking of the dap code that consumes them.
[[tool.mypy.overrides]]
module = ["strong_typing.*", "pysqlsync.*"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 88
# Vendored packages (see vendor/VENDORED.md) are generated artifacts formatted to
# their own upstream style. Excluded so that neither an explicit `ruff format .`
# nor an editor's format-on-save rewrites them and trips the vendor-guard.
extend-exclude = ["strong_typing", "pysqlsync"]
