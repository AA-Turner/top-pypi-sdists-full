[metadata]
name = instructure-dap-client
version = attr: dap.__version__
description = Data Access Platform client library
maintainer = Instucture, Inc.
maintainer_email = dapclient@instructure.com
long_description = file: pypi_index.md
long_description_content_type = text/markdown
license = MIT
classifiers = 
	Development Status :: 5 - Production/Stable
	Environment :: Console
	Intended Audience :: Developers
	Intended Audience :: End Users/Desktop
	License :: OSI Approved :: MIT License
	Operating System :: OS Independent
	Programming Language :: Python :: 3
	Programming Language :: Python :: 3.11
	Programming Language :: Python :: 3.12
	Programming Language :: Python :: 3.13
	Programming Language :: Python :: 3.14
	Typing :: Typed
project_urls = 
	Changelog = https://community.canvaslms.com/t5/Canvas-Change-Log/2025-API-and-CLI-Change-Log/ta-p/626858

[options]
zip_safe = True
include_package_data = True
packages = find:
python_requires = >=3.11
install_requires = 
	aiohttp == 3.13.3
	aiohttp-retry == 2.9.1
	aiofiles == 25.1.0
	asyncclick == 8.1.8.0
	types-aiofiles == 25.1.0.20251011
	json_strong_typing == 0.4.3
	pysqlsync[tsv] == 0.8.4
	PyJWT == 2.11.0
	tsv2py == 0.7.1
	rich == 14.3.3

[options.extras_require]
postgresql = 
	pysqlsync[postgresql] == 0.8.4
mysql = 
	pysqlsync[mysql] == 0.8.4
mssql = 
	pysqlsync[mssql] == 0.8.4

[options.entry_points]
console_scripts = 
	dap = dap.__main__:console_entry

[options.packages.find]
exclude = 
	dap.tests*
	doc*

[options.package_data]
dap = 
	py.typed

[egg_info]
tag_build = 
tag_date = 0

