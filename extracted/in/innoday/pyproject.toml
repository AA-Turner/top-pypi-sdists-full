# ruff replaces black + isort + flake8, which were three separate processes and
# three separate configs (`[tool.black]`, `[tool.isort]`, `.flake8`) doing work
# one tool now does in a fraction of the time. `ruff format` is black-compatible
# by design, so the formatting contract is unchanged; the settings below are
# ported straight from what black and flake8 were configured with.
[tool.ruff]
line-length = 88          # was black's line-length and flake8's max-line-length
target-version = "py312"  # was black's target-version = ["py312"]
# `extend-exclude`, not `exclude`: `exclude` REPLACES ruff's own default list
# (.mypy_cache, node_modules, .tox, site-packages, ...), so restating flake8's
# shorter list there would quietly start linting vendored trees.
extend-exclude = [
    "*.egg-info",  # the rest of flake8's `exclude` is already in ruff's defaults
    # ruff (unlike black) formats Python code blocks INSIDE Markdown. That is new
    # behaviour, not part of the gate being replaced, and it rewrites hand-aligned
    # example code in the docs (CLAUDE.md, CONTRIBUTING.md, docs/*.md) purely
    # cosmetically. Out of scope here; drop this line to opt in deliberately.
    "*.md",
]

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes -- together these are what flake8 ran.
# I = isort, which ruff implements natively (ruff's own default profile already
# matches black, which is what `[tool.isort] profile = "black"` was asking for).
select = ["E", "F", "W", "I"]

# Each exclusion below is here because the rule is wrong for this codebase, not
# because the findings were inconvenient. Everything else was fixed.
#
# E203 -- the formatter disagrees with pycodestyle on slice spacing. The
#   formatter wins; it is what CI enforces.
# E501 -- line length is the formatter's job, and it deliberately leaves long
#   strings and URLs alone.
# E712 -- "comparison to True should be `if cond:`". Wrong here: every one of the
#   31 occurrences is inside a SQLAlchemy `.where(...)`, where `Column == True`
#   builds the SQL predicate and `if Column:` evaluates a Python object's
#   truthiness instead. "Fixing" them would silently break the queries, which is
#   why the newer call sites were already carrying a `noqa`.
# W291, W293 -- trailing whitespace. All 33 occurrences are inside string
#   literals: LLM prompts and SQL. Stripping them edits a prompt, which is a
#   behaviour change however small. Trailing whitespace in actual *code* is
#   already impossible -- the formatter removes it, and CI runs
#   `ruff format --check`.
#
# flake8's W503 ("line break before binary operator") was also ignored, for the
# same black-disagreement reason as E203. ruff does not implement W503 at all,
# so there is nothing to list -- not an omission.
ignore = [
    "E203",
    "E501",
    "E712",
    "W291",
    "W293",
]

[tool.ruff.lint.per-file-ignores]
# NOTE: unlike flake8, ruff *merges* every matching pattern rather than letting
# a more specific one replace a more general one. The duplicated F401 below is
# therefore belt-and-braces rather than the requirement it was under flake8 --
# but it is left explicit because those imports are table registrations and
# dropping them breaks SQLModel.metadata.create_all.
"__init__.py" = ["F401"]
# Both files import late on purpose. app.py builds the FastAPI app and then
# imports routers, because the routers import from the app; database/__init__.py
# picks a backend before importing it. Moving either import to the top is not a
# tidy-up, it is a circular import.
"src/api/app.py" = ["E402"]
"src/database/__init__.py" = ["E402", "F401"]
# These scripts import after adjusting sys.path so they can run standalone.
"scripts/cleanup_orphan_test_orgs.py" = ["E402"]
"scripts/move_project_org.py" = ["E402"]
# New under ruff, not a relaxation: flake8 only ever ran over `src/ tests/
# scripts/`, so alembic/ was never linted at all. env.py's late imports are the
# same deliberate pattern as the entries above -- it must put the repo root on
# sys.path and call load_env() BEFORE importing src.env_loader and src.domain,
# because those need ENVIRONMENT-selected settings and the path fixup to resolve.
"alembic/env.py" = ["E402"]
# Migration files are GENERATED, and alembic's own template emits an import block
# that I001 rejects -- `alembic/script.py.mako` writes `from alembic import op`
# above `import sqlalchemy as sa`, which is the wrong order for isort, and
# `${imports}` then appends autogenerated imports (e.g. `import sqlmodel`) after
# both. So every new migration would fail CI the moment it was created, for a
# layout nobody chose and no author typed.
#
# This was not hypothetical: the first migration to reach this branch from main
# (20260808_095228) failed exactly this way. It went unseen until then only
# because the ruff-format commit on this branch had already rewritten the two
# pre-existing migrations in place, leaving no un-fixed example to trip on.
#
# Import order in a generated, already-applied migration is not a quality signal,
# and rewriting applied migrations to satisfy a linter is worse than not linting
# them. Only I001 is lifted -- F401, E7xx and the rest still apply here, so a
# genuine problem in a migration is still caught.
#
# Fixing script.py.mako would clean up the common case but not the `${imports}`
# one, so it is not a substitute for this.
"alembic/versions/*" = ["I001"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]
# `alembic` is a third-party package, but ruff infers first-party membership from
# directories in the project root -- and this repo has an `alembic/` migrations
# directory that is not a Python package (no __init__.py). Without this, ruff
# splits `from alembic import command` (resolves to the directory -> first-party)
# away from `from alembic.config import Config` (alembic/config.py does not
# exist -> third-party) into two different import sections.
known-third-party = ["alembic"]

# Complexity (C901 / mccabe) is deliberately NOT selected. Cyclomatic complexity
# is a design signal rather than a defect, and 41 functions are over the old
# threshold of 12 -- mostly long dispatch chains that read better flat than split
# to satisfy a number. Leaving "C90" out of `select` is what keeps it off the
# merge gate.
#
# To look at complexity deliberately:
#     uv run ruff check src/ --select C901 --config 'lint.mccabe.max-complexity = 12'

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::sqlalchemy.exc.SAWarning",
    "ignore::pytest.PytestDeprecationWarning",
]
# Marker source of truth is tests/conftest.py::pytest_configure (integration,
# requires_api, slack, github, trello, jira, claude); listed here too so
# --strict-markers/--strict-config accept the ones CI selects on.
markers = [
    "integration: marks tests as integration tests",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "innoday"
dynamic = ["version"]
description = "AI-Powered Team Orchestration Platform - Streamline product development and team collaboration with AI"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Haviland Software", email = "support@haviland-software.com"}
]
maintainers = [
    {name = "Haviland Software", email = "support@haviland-software.com"}
]
keywords = [
    "ai", "team-orchestration", "scrum", "project-management", 
    "fastapi", "cli", "automation", "workflow", "collaboration",
    "jira", "trello", "tickets", "agile"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Bug Tracking",
    "Topic :: Office/Business :: Groupware",
    "Topic :: Office/Business :: Scheduling",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Environment :: Web Environment",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "pydantic[email]",
    "sqlalchemy",
    "sqlmodel",
    "uvicorn",
    "httpx==0.28.1",
    "python-dotenv",
    "pyfiglet",
    "colorama",
    "requests",
    "keyring>=24.0.0",
    "rich>=13.0.0",
    "alembic>=1.16.4",
    "psycopg2-binary>=2.9.0",
    "psutil>=7.2.2",
    "toml>=0.10.2",
    # Docker container management
    "docker>=7.0.0",
    "fastmcp>=3.2.0",
    # Security floor, not a feature requirement. mcp is transitive via fastmcp,
    # which only asks for >=1.24.0 -- so without this line the resolver is free to
    # pick 1.27.2, which has no Host/Origin validation on the WebSocket server
    # transport (GHSA, Dependabot #76). Our server is stdio-only so that transport
    # is not reachable today, but "not reachable today" is not a thing to depend on.
    # Do not delete this as redundant: upgrading fastmcp does not raise the floor.
    "mcp>=1.28.1",
    "anthropic>=0.40.0",
    # Release/version engine. InnoDay implements blastoff's VersionStore
    # (src/integrations/innoday_version_store.py) and proxies its release/
    # hotfix commands (src/cli/commands/release_proxy.py). Distribution name
    # is `innoday-blastoff` on PyPI; import name is `blastoff`.
    #
    # Renamed from `pixelfuel-blastoff` (yanked) at 0.2.0 -- a separate PyPI
    # project, since PyPI has no rename. The import name did not change.
    #
    # Upper bound is deliberate: what we consume is an unstable ABC plus a
    # class-attribute injection point (`app_cls.version_store`), so a 0.3.0
    # that adds a fourth @abstractmethod or renames that attribute breaks
    # `innoday release` at runtime, and uv.lock only protects checkouts.
    "innoday-blastoff>=0.7.0,<0.8.0",
    # Supabase JWT verification (JWKS/asymmetric + HS256 fallback) -- auth (PF-350)
    "pyjwt[crypto]>=2.9.0",
    # Supabase admin client, for provisioning auth.users identities on user
    # create (auth.admin.invite_user_by_email).
    #
    # This used to be optional, back when the only consumer was an embeddings
    # experiment and `supabase_invite.py` could treat the import as optional.
    # #420 changed that: `POST /api/v1/users` now provisions an
    # identity FIRST and returns 503 rather than creating a user who could never
    # sign in. With the client absent that check fires on *every* create, so the
    # deployed image -- whose Dockerfile runs a bare `uv sync`, no extras -- could
    # not create users at all. Core dependency now.
    "supabase>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/havilandsoftware/innoday"
Repository = "https://github.com/havilandsoftware/innoday"
Documentation = "https://github.com/havilandsoftware/innoday#readme"
"Bug Tracker" = "https://github.com/havilandsoftware/innoday/issues"
"Release Notes" = "https://github.com/havilandsoftware/innoday/releases"
"Source Code" = "https://github.com/havilandsoftware/innoday"
"CI/CD" = "https://github.com/havilandsoftware/innoday/actions"

[project.scripts]
innoday = "src.cli.main:main"
mcp-server-innoday = "src.mcp.server:run_server"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.14.1",
    "ruff>=0.14.0",
]

[tool.setuptools.package-data]
"*" = ["*.py", "*.md", "*.txt", "*.toml", "*.yml", "*.yaml"]

[tool.setuptools.dynamic]
version = {attr = "src.version.__version__"}
