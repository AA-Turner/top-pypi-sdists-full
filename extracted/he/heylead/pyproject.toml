[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heylead"
version = "0.10.177"
description = "MCP-native autonomous LinkedIn SDR. Your AI sales rep, one command to fill your pipeline."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "HeyLead", email = "hello@heylead.dev" },
]
keywords = [
    "mcp", "model-context-protocol", "linkedin", "outreach", "sdr",
    "leads", "sales", "ai", "automation", "prospecting", "campaign",
    "lead-generation", "cold-outreach", "b2b", "icp", "buyer-persona",
    "social-selling", "drip-sequence", "linkedin-automation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Communications",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "mcp>=1.2.0,<2.0.0",
    "httpx>=0.24.0",
    "cryptography>=41.0.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
icp = ["sentence-transformers>=2.2.0", "numpy>=1.24.0"]
crawl = ["firecrawl-py>=0.0.1"]
browser = ["browser-use>=0.12.0", "playwright>=1.40.0"]
all = ["heylead[icp]", "heylead[crawl]", "heylead[browser]"]

[project.scripts]
heylead = "heylead.server:main"
heylead-logs = "heylead.cli.log_analyzer:main"

[project.urls]
Homepage = "https://github.com/D4umak/heylead"
Repository = "https://github.com/D4umak/heylead"
Issues = "https://github.com/D4umak/heylead/issues"
"LLMs.txt" = "https://heylead.dev/llms.txt"

[tool.hatch.build.targets.wheel]
packages = ["src/heylead"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
