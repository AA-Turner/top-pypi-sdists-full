[package]
name = "rapidcube"
version = "0.2.1"
edition = "2024"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "rapidcube"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28.3" }
numpy = "0.28.0"
ndarray = "0.17"
rayon = "1.12"
rand = { version = "0.10.1", features = ["sys_rng", "chacha"] }
