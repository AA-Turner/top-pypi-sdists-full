[project]
name = "radboy"
version = "0.1.109"
authors = [
  { name="Carl Hirner III", email="k.j.hirner.wisdom@gmail.com" },
]
description = "A Retail Calculator for Android/Linux"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "GPL-3.0-only"
license-files = ["LICEN[CS]E*","COPYING"]
dependencies = ['pyzipcode',
	"inputimeout",
	'gdown','biip','sympy','plotext','haversine','holidays','qrcode[pil]','chardet','nanoid','random-password-generator','cython','pint','pyupc-ean','openpyxl','plyer','colored','numpy','pandas','Pillow','python-barcode','qrcode','requests','sqlalchemy','argparse','geocoder','beautifulsoup4','pycryptodome','forecast_weather','boozelib','pint_pandas','xlsxwriter','humanfriendly','num2words',
]
[project.optional-dependencies]
linux = [
 'gnureadline',
 ]
android = [
'readline',
]
[project.urls]
Homepage = "https://google.com"
Issues = "https://google.com"
[build-system]
requires = ['pyzipcode',"setuptools >= 77.0.3",'gdown','biip','sympy','plotext==5.3.2','haversine','holidays','odfpy','qrcode[pil]','chardet','nanoid','random-password-generator','cython','pint','pyupc-ean','openpyxl','plyer','colored','numpy','pandas','Pillow','python-barcode','qrcode','requests','sqlalchemy','argparse','geocoder','beautifulsoup4','pycryptodome','forecast_weather','boozelib','inputimeout','xlsxwriter','humanfriendly','sonofman','num2words']
build-backend = "setuptools.build_meta"
