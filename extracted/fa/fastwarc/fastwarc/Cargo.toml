[package]
name = "fastwarc-py"
edition = "2024"
publish = false

[lib]
name = "fastwarc"
path = "src/lib.rs"
crate-type = [
    "cdylib",
]

[dependencies]
fastwarc = "1.1.0"
pyo3 = "0.30"

[dependencies.time]
version = "0.3"
features = [
    "formatting",
    "parsing",
    "macros",
]

[build-dependencies]
pyo3-build-config = "0.30"

[workspace]
