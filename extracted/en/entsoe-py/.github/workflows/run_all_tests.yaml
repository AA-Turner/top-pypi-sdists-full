name: tests

on:
  pull_request:
  push:
    branches:
      - "**"
      - "workflow_dispatch"

env:
  ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
  ENTSOE_USERNAME: ${{ secrets.ENTSOE_USERNAME }}
  ENTSOE_PWD: ${{ secrets.ENTSOE_PWD }}

jobs:
  run-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
        test-file: ["tests/test_files.py", "tests/test_raw.py", "tests/test_pandas.py"]
    steps:
      - uses: actions/checkout@master
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - name: Install dependencies
        run: |
          uv sync --frozen
      - name: Test with pytest
        run: |
          uv run pytest ${{ matrix.test-file }}