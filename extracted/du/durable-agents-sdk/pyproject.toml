[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "durable-agents-sdk"
version = "1.0.20260703010"
description = "Python SDK for the Durable Agents public API."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Graphlit" }
]
dependencies = [
  "httpx>=0.27",
  "microsoft-kiota-abstractions==1.10.2",
  "microsoft-kiota-http==1.10.2",
  "microsoft-kiota-serialization-form==1.10.2",
  "microsoft-kiota-serialization-json==1.10.2",
  "microsoft-kiota-serialization-multipart==1.10.2",
  "microsoft-kiota-serialization-text==1.10.2"
]

[project.optional-dependencies]
dev = [
  "build",
  "twine",
  "pytest",
  "PyYAML",
  "ruff"
]

[project.urls]
Homepage = "https://www.durableagents.ai"
Documentation = "https://www.durableagents.ai"

[tool.setuptools.packages.find]
include = ["durable_agents*"]

[tool.setuptools.package-data]
durable_agents = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
