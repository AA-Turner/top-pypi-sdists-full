[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openclaw"
version = "2026.3.20"
description = "OpenClaw — open-source agent orchestration plugin for CMDOP"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["openclaw", "cmdop", "open-source", "orchestration", "agent", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "cmdop",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://cmdop.com"
Documentation = "https://cmdop.com/docs/sdk/python/"
Repository = "https://github.com/commandoperator/cmdop-sdk"
"Bug Tracker" = "https://github.com/commandoperator/cmdop-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/openclaw"]
