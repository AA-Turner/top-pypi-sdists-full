[build-system]
requires = ["setuptools>=84.1.0", "setuptools-scm[simple]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "openshell"
dynamic = ["version"]
description = "Python SDK for OpenShell sandbox management and command execution."
license = "Apache-2.0"
readme = "README.md"
authors = [{ name = "NVIDIA Inc." }]
requires-python = ">=3.11"
dependencies = [
    "cloudpickle>=3.0",
    "grpcio>=1.60",
    "googleapis-common-protos>=1.63",
    "httpx>=0.27",
    "protobuf>=4.25",
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
]
keywords = ["openshell", "sdk", "agent", "sandbox", "nvidia"]

[project.urls]
source = "https://github.com/ai-openshell/sdk-python"
documentation = "https://docs.nvidia.com/openshell/latest/sdk/python"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "ruff>=0.4",
    "ty>=0.0.94",
    "grpcio-tools>=1.60",
    "pyyaml==6.0.2",
    "types-pyyaml>=6.0.12.20260518",
    "mypy-protobuf>=5.1",
    "types-grpcio>=1.0.0.20251009",
    "types-protobuf>=6.32,<7",
]

# mise pins uv exactly (mise.toml); this rejects older versions when uv is
# installed some other way.
[tool.uv]
required-version = ">=0.10"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["openshell*"]
namespaces = false

[tool.setuptools.package-data]
openshell = ["py.typed", "_proto/*.py", "_proto/*.pyi"]

[tool.setuptools_scm]
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*"]

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = ["src/openshell/_proto"]

[tool.ty.src]
exclude = ["src/openshell/_proto"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["openshell"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = [
    "gpu: requires a GPU-capable gateway and GPU-enabled sandbox image",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
