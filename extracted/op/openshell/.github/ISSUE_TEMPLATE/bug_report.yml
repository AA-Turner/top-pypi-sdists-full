name: Bug Report
description: Report unexpected behavior of the Python SDK with a clear user story and expected outcome.
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Reports

        Describe who encountered the bug, the problem it creates, why it matters, and the observable criteria for a fix. Please check the latest `openshell` release on PyPI and search existing issues for possible duplicates before filing.

        Problems with the gateway, CLI, or sandboxes belong in [NVIDIA/OpenShell](https://github.com/NVIDIA/OpenShell/issues). Do not report security vulnerabilities here; follow [SECURITY.md](https://github.com/ai-openshell/sdk-python/blob/main/SECURITY.md) instead.

  - type: textarea
    id: user-story
    attributes:
      label: User Story
      description: Describe the specific use case and behavior you directly encountered or need.
      placeholder: |
        I use the OpenShell Python SDK for <specific use case>.
        I directly encountered or need <specific behavior>.
        This affects <outcome>.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Summarize what is broken in the SDK's current behavior. Describe its consequences and current workarounds in Impact / Why This Matters.
      placeholder: Describe the gap or failure in the SDK's current behavior and when it occurs.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact / Why This Matters
      description: |
        Explain how the bug affects users and what they must do to work around it today. Include evidence where available, but do not diagnose the cause or prescribe the fix.
      placeholder: |
        When this happens, users must...
        This results in...
        This matters because...
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: List the specific, observable outcomes that would demonstrate the bug is fixed.
      placeholder: |
        - [ ] <observable outcome>
        - [ ] <observable outcome>
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Provide a minimal Python snippet against an OpenShell gateway, and what you expected instead.
      placeholder: |
        from openshell import Sandbox

        with Sandbox(...) as sb:
            ...
      render: python
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the SDK, Python, and gateway versions.
      placeholder: |
        - openshell (SDK): 0.x.x (output of `python -c "import openshell; print(openshell.__version__)"`)
        - Python: 3.x.x
        - OpenShell gateway: v0.x.x, deployment mode and compute driver
        - OS: macOS 15.2 / Ubuntu 24.04 / Windows 11 + WSL2
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Include the smallest relevant traceback, error message, or log excerpt.
        Redact credentials, API keys, tokens, and query parameters before pasting.
      render: shell
    validations:
      required: false
