[project]
name = "opentelemetry-instrumentation-absurd"
version = "0.1.0"
description = "OpenTelemetry instrumentation for the Absurd durable-task SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "opentelemetry",
    "instrumentation",
    "tracing",
    "observability",
    "absurd",
    "durable-tasks",
    "task-queue",
    "postgres",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Framework :: OpenTelemetry",
    "Framework :: OpenTelemetry :: Instrumentations",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "absurd-sdk>=0.4.0",
    "opentelemetry-api>=1.0",
    "opentelemetry-instrumentation>=0.65b0",
    "wrapt>=1.0.0,<2.0.0",
]

[[project.authors]]
name = "Jiri Kuncar"
email = "jiri.kuncar@gmail.com"

[project.urls]
Homepage = "https://github.com/jirikuncar/opentelemetry-instrumentation-absurd"
Repository = "https://github.com/jirikuncar/opentelemetry-instrumentation-absurd"
Issues = "https://github.com/jirikuncar/opentelemetry-instrumentation-absurd/issues"
Changelog = "https://github.com/jirikuncar/opentelemetry-instrumentation-absurd/releases"

[project.entry-points.opentelemetry_instrumentor]
absurd = "opentelemetry.instrumentation.absurd:AbsurdInstrumentor"

[build-system]
requires = ["uv_build>=0.11.0,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "opentelemetry.instrumentation.absurd"
namespace = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-v",
    "--cov",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.coverage.run]
branch = true
source = ["opentelemetry.instrumentation.absurd"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[dependency-groups]
dev = [
    "anyio>=4.0",
    "opentelemetry-sdk>=1.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0",
    "ruff>=0.8.0",
]
