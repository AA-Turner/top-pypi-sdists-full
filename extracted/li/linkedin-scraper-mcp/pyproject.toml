[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-scraper-mcp"
version = "4.14.0"
description = "Renamed to mcp-server-linkedin. This transitional package forwards to it."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
authors = [{ name = "Daniel Sticker", email = "daniel@sticker.name" }]
dependencies = ["mcp-server-linkedin>=4.14.0"]

[project.urls]
Homepage = "https://github.com/stickerdaniel/linkedin-mcp-server"

[project.scripts]
linkedin-scraper-mcp = "linkedin_scraper_mcp_shim:main"

[tool.setuptools]
py-modules = ["linkedin_scraper_mcp_shim"]
