[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# This file is automatically generated. Do not edit manually.

[project]
name = "livekit-plugins-krisp-internal"
version = "0.2.0"
description = "LiveKit Krisp Viva noise filter (private wheel)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["livekit>=1.1.8,<2", "numpy>=1.20"]
keywords = ["webrtc", "realtime", "audio", "livekit", "krisp"]
license = { text = "SEE LICENSE IN https://livekit.io/legal/terms-of-service" }

[tool.setuptools]
package-dir = { "" = "src" }
# LICENSE + NOTICE land in the wheel's .dist-info (proprietary terms + pointer to
# the LiveKit ToS and the bundled third-party attribution).
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The bundled Krisp SDK statically links ~20 third-party OSS components; their
# per-component license texts ship under krisp_internal/licenses/<dep>/.
"livekit.plugins.krisp_internal" = [
    "py.typed",
    "*.so",
    "*.dylib",
    "*.dll",
    "licenses/*",
    "licenses/*/*",
]

[tool.cibuildwheel]
build = "cp310-*"
skip = "*-musllinux_*"

# Image selection
manylinux-x86_64-image = "manylinux_2_28"
manylinux-i686-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
manylinux-ppc64le-image = "manylinux_2_28"
manylinux-s390x-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
repair-wheel-command = ""

[tool.cibuildwheel.linux]
# Attempt to repair, otherwise copy
repair-wheel-command = "auditwheel repair --allow-pure-python-wheel --exclude libkrisp-audio-sdk* -w {dest_dir} {wheel}"
