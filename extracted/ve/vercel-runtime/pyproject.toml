[project]
name = "vercel-runtime"
version = "0.24.1"
license = "Apache-2.0"
license-files = ["src/vercel_runtime/_vendor/*/LICEN[CS]E*"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[dependency-groups]
test = [
    "attrs~=25.3.0",
    "vercel~=0.5",
    "basedpyright~=1.37.0",
    "mypy~=1.19.0",
    "pytest~=9.0.2",
    "pytest-cov~=7.0.0",
    "ruff~=0.15.1",
]

[tool.uv]
default-groups = ["test"]
exclude-newer = "2 days"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = [
    "vercel_runtime",
    "tests",
]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["vercel_runtime._vendor.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["tests.fixtures.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "django",
    "django.conf",
    "django.contrib.staticfiles.handlers",
    "django.utils.module_loading",
]
ignore_missing_imports = true

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = [
    "src/vercel_runtime",
    "tests",
]
exclude = [
    "src/vercel_runtime/_vendor",
    "tests/fixtures",
]
extraPaths = ["src"]

[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = [
    ".",
    "src",
]
reportPrivateUsage = false

[tool.ruff]
line-length = 80
indent-width = 4
target-version = "py312"
exclude = [
    ".github",
    ".git",
    "src/vercel_runtime/_vendor",
]

[tool.ruff.lint]
preview = true
extend-select = [
    "B",
    "C4",
    "E",
    "ERA",
    "F",
    "FBT",
    "G",
    "I",
    "N",
    "PGH",
    "PIE",
    "PLE",
    "PLW",
    "PLC",
    "RUF",
    "SIM",
    "T20",
    "TC",
    "UP",
    "W",
]
extend-ignore = [
    "D",
    "F541",
    "PLW1514",
    "RUF067",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "N806",
    "PLC0415",
    "PLC2701",
]
"tests/fixtures/**/*.py" = [
    "N801",
    "N802",
    "T201",
    "PLC0415",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["vercel_runtime"]
parallel = true
omit = ["src/vercel_runtime/_vendor/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
]

[tool.vendoring]
destination = "src/vercel_runtime/_vendor/"
patches-dir = "patches/"
requirements = "src/vercel_runtime/_vendor/vendor.txt"
namespace = "vercel_runtime._vendor"
protected-files = [
    "__init__.py",
    "vendor.txt",
]

[tool.vendoring.transformations]
drop = [
    "bin/",
    "colorama/tests/",
    "*.so",
]

[[tool.vendoring.transformations.substitute]]
match = '"uvicorn\.(lifespan|loops|protocols)\.'
replace = '"vercel_runtime._vendor.uvicorn.\1.'
