depends_on:
  - test
  - ruff
when:
  - event: pull_request
  - event: push
    branch: master
  - event: tag
steps:
  build_docs:
    # The docs are always build to ensure the build process is not broken.
    image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    commands:
      - cd docs
      - uv run --frozen sphinx-build --builder html --doctree-dir /tmp/doctrees-docs source/ build/html/
      - uv run --frozen sphinx-build --builder html --doctree-dir /tmp/doctrees-site site/ build/site/
      - tar -C build/html -czf html.tar.gz .
      - tar -C build/site -czf site.tar.gz .
  pypi:
    # The package is uploaded to PyPI only for tags.
    image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    environment:
      # API token from https://pypi.org/manage/account/
      UV_PUBLISH_TOKEN:
        from_secret: uv_publish_token
      # https://upload.pypi.org/legacy/ or https://test.pypi.org/legacy/
      UV_PUBLISH_URL:
        from_secret: uv_publish_url
    commands:
      - export PACKAGE_VERSION_NUMBER="$(uv version --short)"
      - uv build
      - echo "Publishing version ${PACKAGE_VERSION_NUMBER} to ${UV_PUBLISH_URL}"
      - uv publish
    when:
      - event: tag
  deploy:
    # The site and docs are published to pybtex.org and docs.pybtex.org for tags.
    # This step is not run for PRs to avoid exposing Grebedoc passwords.
    image: quay.io/curl/curl:latest
    environment:
      GREBEDOC_PASSWORD_SITE:
        from_secret: grebedoc_password_site
      GREBEDOC_PASSWORD_DOCS:
        from_secret: grebedoc_password_docs
    commands:
      - 'curl https://docs.pybtex.org/ -X PUT -H "Authorization: Pages $GREBEDOC_PASSWORD_DOCS" -H "Content-Type: application/x-tar+gzip" --data-binary @docs/html.tar.gz'
      - 'curl https://pybtex.org/ -X PUT -H "Authorization: Pages $GREBEDOC_PASSWORD_SITE" -H "Content-Type: application/x-tar+gzip" --data-binary @docs/site.tar.gz'
    when:
      - event: tag
  deploy_preview:
    # The site and docs are published to dev.pybtex.org and dev-docs.pybtex.org for pushes to the main branch.
    # This step is not run for PRs to avoid exposing Grebedoc passwords.
    image: quay.io/curl/curl:latest
    environment:
      GREBEDOC_PASSWORD_SITE_DEV:
        from_secret: grebedoc_password_site_dev
      GREBEDOC_PASSWORD_DOCS_DEV:
        from_secret: grebedoc_password_docs_dev
    commands:
      - 'curl https://dev-docs.pybtex.org/ -X PUT -H "Authorization: Pages $GREBEDOC_PASSWORD_DOCS_DEV" -H "Content-Type: application/x-tar+gzip" --data-binary @docs/html.tar.gz'
      - 'curl https://dev.pybtex.org/ -X PUT -H "Authorization: Pages $GREBEDOC_PASSWORD_SITE_DEV" -H "Content-Type: application/x-tar+gzip" --data-binary @docs/site.tar.gz'
    when:
      - event: push
        branch: master
