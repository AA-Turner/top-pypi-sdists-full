[package]
name = "kcl"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true

[dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }

aws-config = { workspace = true }
aws-sdk-kinesis = { workspace = true }
aws-sdk-dynamodb = { workspace = true }
aws-sdk-cloudwatch = { workspace = true }
aws-smithy-types = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-types = { workspace = true }

bon = { workspace = true }
num-bigint = { workspace = true }
bytes = { workspace = true }
sha2 = { workspace = true }
md-5 = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
serde_json = { workspace = true }
opentelemetry = { workspace = true }


[dev-dependencies]
mockall = { workspace = true }
tokio-test = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
# `env-filter` powers the integration-test tracing harness
# (`common::init_test_tracing`), honoring RUST_LOG.
tracing-subscriber = { workspace = true, features = ["env-filter"] }
opentelemetry_sdk = { workspace = true }
aws-smithy-mocks = "0.3"
aws-smithy-types = { workspace = true }
# Enable the DynamoDB SDK `test-util` feature for the mock client harness
# (features are additive; this only affects test builds).
aws-sdk-dynamodb = { workspace = true, features = ["test-util"] }
# Enable the Kinesis SDK `test-util` feature for the retrieval polling/fanout
# publisher behavioral tests (mocking GetRecords/GetShardIterator/SubscribeToShard/
# consumer-registration calls via `aws-smithy-mocks`). Additive; test-only.
aws-sdk-kinesis = { workspace = true, features = ["test-util"] }
