[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "hwp5"
version = "0.1.0"
description = "Find hard-work patterns over rolling 5-day windows in calendar export files."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "hwp5 contributors" }
]
keywords = ["calendar", "ics", "productivity", "analytics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Scheduling",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "build>=1.2.0", "twine>=5.0.0"]

[project.urls]
Homepage = "https://github.com/your-username/hwp5"
Repository = "https://github.com/your-username/hwp5"
Issues = "https://github.com/your-username/hwp5/issues"

[project.scripts]
hwp5 = "hwp5.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hwp5"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
