[project]
name = "nonebot-adapter-qq"
version = "1.7.2"
description = "QQ adapter for nonebot2"
requires-python = ">=3.10, <4"
readme = "README.md"
license = "MIT"
keywords = [
    "bot",
    "qq",
    "qqbot",
    "qqguild",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Robot Framework",
    "Framework :: Robot Framework :: Library",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "yarl >=1.9.0, <2",
    "nonebot2 >=2.5.0, <3",
    "cryptography >=43.0.3, <49.0.0",
    "typing-extensions >=4.4.0, <5.0.0",
    "pydantic >=1.10.0, <3.0.0, !=2.5.0, !=2.5.1",
]

[[project.authors]]
name = "yanyongyu"
email = "yyy@nonebot.dev"

[project.urls]
Homepage = "https://github.com/nonebot/adapter-qq"
Repository = "https://github.com/nonebot/adapter-qq"
Documentation = "https://github.com/nonebot/adapter-qq#readme"

[dependency-groups]
dev = [
    "ruff >=0.16.0, <0.17.0",
    "nonemoji >=0.1.3, <0.2.0",
    "pre-commit >=4.0.0, <5.0.0",
    "pytest >=8.3.0, <10.0.0",
    "pytest-asyncio >=0.24.0, <2.0.0",
    "pytest-cov >=5.0.0, <8.0.0",
]

[tool.uv.build-backend]
module-root = ""
module-name = "nonebot.adapters.qq"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "F",
    "W",
    "E",
    "I",
    "UP",
    "ASYNC",
    "C4",
    "T10",
    "T20",
    "PYI",
    "PT",
    "Q",
    "RUF",
]
ignore = [
    "E402",
    "UP037",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
extra-standard-library = ["typing_extensions"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.pyright]
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "standard"
reportShadowedImports = false
disableBytesTypePromotions = true
reportIncompatibleMethodOverride = false
reportIncompatibleVariableOverride = false

[tool.pyright.defineConstant]
PYDANTIC_V2 = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=nonebot/adapters/qq --cov-report term-missing"

[build-system]
requires = ["uv_build >=0.9.0, <0.10.0"]
build-backend = "uv_build"
