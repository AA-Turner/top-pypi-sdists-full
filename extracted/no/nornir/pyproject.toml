[project]
name = "nornir"
version = "3.6.1"
description = "Pluggable multi-threaded framework with inventory management to help operate collections of devices"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = ["ruamel.yaml>=0.17"]

[[project.authors]]
name = "David Barroso"
email = "dbarrosop@dravetech.com"

[project.urls]
Repository = "https://github.com/nornir-automation/nornir"

[project.entry-points."nornir.plugins.runners"]
serial = "nornir.plugins.runners:SerialRunner"
threaded = "nornir.plugins.runners:ThreadedRunner"

[project.entry-points."nornir.plugins.inventory"]
SimpleInventory = "nornir.plugins.inventory.simple:SimpleInventory"

[dependency-groups]
dev = [
    "decorator",
    "nbval>=0.10.0,<0.11",
    "pytest",
    "pytest-cov",
    "requests-mock",
    "mypy>=2.3.1,<3",
    "nornir-jinja2==0.2.0",
    "nornir-utils==0.2.0",
    "napalm>=5.2.0",
    "nornir-napalm==0.5.0",
    "ruff>=0.15.20,<0.16",
]
docs = [
    "sphinx==6.2.1",
    "sphinx-rtd-theme==1.2.2",
    "sphinxcontrib-napoleon>=0.7,<0.8",
    "jupyter==1.0.0",
    "nbsphinx==0.9.2",
    "pygments==2.20.0",
    "sphinx-issues==3.0.1",
]

[tool.uv]
default-groups = [
    "dev",
    "docs",
]

[tool.uv.build-backend]
module-root = ""

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
ignore_errors = false
ignore_missing_imports = true
strict_optional = true
warn_unused_configs = true
warn_unused_ignores = true
warn_return_any = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "tests.core.test_InitNornir"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "tests.core.test_filter"
disable_error_code = [
    "arg-type",
    "assignment",
    "operator",
]

[[tool.mypy.overrides]]
module = "tests.core.test_inventory"
disable_error_code = [
    "arg-type",
    "index",
]

[[tool.mypy.overrides]]
module = "tests.wrapper"
disable_error_code = [
    "no-any-return",
    "untyped-decorator",
]

[tool.ruff]
line-length = 100
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "CPY001",
    "D203",
    "D213",
    "ISC001",
    "N801",
    "N818",
    "ANN401",
    "ARG002",
    "B028",
    "COM812",
    "D100",
    "D101",
    "D104",
    "D107",
    "EM101",
    "EM102",
    "FBT001",
    "FBT002",
    "FURB189",
    "INP001",
    "PERF203",
    "PIE800",
    "PLC2801",
    "PLR6201",
    "PLR6301",
    "PLW1641",
    "PYI034",
    "RSE102",
    "RUF001",
    "RUF067",
    "S701",
    "SLF001",
    "TC001",
    "TRY002",
    "TRY003",
    "TRY004",
    "UP034",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 11
max-branches = 16
max-positional-args = 10
max-public-methods = 22
max-returns = 11

[tool.ruff.lint.per-file-ignores]
"docs/conf.py" = [
    "A001",
    "ERA001",
]
"nornir/**.py" = [
    "D105",
    "D106",
    "DOC502",
    "EM103",
]
"nornir/core/configuration.py" = ["A002"]
"nornir/core/plugins/register.py" = ["RUF012"]
"nornir/core/task.py" = ["BLE001"]
"nornir/init_nornir.py" = ["N802"]
"tests/**.py" = [
    "BLE001",
    "N802",
    "S101",
    "S105",
    "ARG001",
    "D102",
    "D103",
    "DTZ005",
    "LOG009",
    "N999",
    "PLC1901",
    "PLR0904",
    "PLR2004",
    "SIM118",
    "UP032",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest]
filterwarnings = ["ignore::nornir.core.exceptions.ConflictingConfigurationWarning"]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
