[build-system]
build-backend = "uv_build"
requires = ["uv-build>=0.13.7,<0.14"]

[project]
name = "nox-uv"
version = "0.8.2"
description = "Facilitate nox integration with uv for Python projects"
readme = "README.md"
keywords = [
    "nox",
    "uv",
]
license = "MIT"
license-files = ["LICENSE.txt"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = ["nox>=2026.10.20"]

[[project.authors]]
name = "Dan Tebben"
email = "dantebben@gmail.com"

[project.urls]
Homepage = "https://github.com/dantebben/nox-uv"
Issues = "https://github.com/dantebben/nox-uv/issues"
Repository = "https://github.com/dantebben/nox-uv"

[dependency-groups]
test = [
    "pytest>=9.2",
    "pytest-cov>=7.1",
]
lint = [
    "pyproject-fmt>=2.30.3",
    "ruff>=0.17.3",
]
type_check = ["mypy>=2.4.1"]

[tool.uv]
default-groups = "all"

[tool.ruff]
line-length = 99
src = ["src"]

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "E",
    "F",
    "I",
    "ISC",
    "N",
    "PIE",
    "PT",
    "PTH",
    "RUF",
    "SIM",
    "TID",
    "UP",
]
extend-ignore = [
    "RUF005",
    "RUF012",
]
unfixable = ["F401"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
force-sort-within-sections = true
split-on-trailing-comma = false

[tool.mypy]
ignore_missing_imports = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
]
strict = true

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
patch = ["subprocess"]
