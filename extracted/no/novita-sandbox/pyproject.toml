[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "novita-sandbox"
version = "2.1.0"
description = "Novita Agent Sandbox SDK - Python library for Novita Agent Sandbox"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Novita", email = "support@novita.ai" },
]
maintainers = [
    { name = "Novita", email = "support@novita.ai" },
]
keywords = ["Novita", "sandbox", "ai", "agent", "sdk", "code-interpreter", "desktop-automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Operating System",
]
requires-python = ">=3.9"
dependencies = [
    # HTTP and networking
    "httpx>=0.27.0,<1.0.0",
    "httpcore>=1.0.5",
    
    # Data structures and types
    "attrs>=23.2.0",
    "typing-extensions>=4.1.0",
    
    # Protocol buffers
    "protobuf>=5.26.1",
    
    # Package management
    "packaging>=24.1",
    "python-dateutil>=2.8.2",
    "wcmatch>=10.1,<11.0",
    "dockerfile-parse>=2.0.1,<3.0.0",
    "rich>=14.0.0",
    "pydantic (>=2.12.4,<3.0.0)",
]

[project.optional-dependencies]
runtime = [
    "starlette>=0.48.0,<0.51.0",
    "uvicorn>=0.38.0,<0.41.0",
]
all = [
    "starlette>=0.48.0,<0.51.0",
    "uvicorn>=0.38.0,<0.41.0",
    "matplotlib>=3.6.0",
    "plotly>=5.0.0",
    "pandas>=1.5.0", 
    "numpy>=1.21.0",
    "pillow>=9.0.0",
    "pyautogui>=0.9.54",
    "pynput>=1.7.6",
    "opencv-python>=4.7.0",
    "python-dateutil>=2.8.2",
]

[project.urls]
Homepage = "https://novita.ai"
Documentation = "https://novita.ai/docs/guides/sandbox-overview"
"Bug Tracker" = "https://novita.ai"
Changelog = "https://novita.ai/docs/changelog"

[tool.poetry]
packages = [{ include = "novita_sandbox", from = "src" }]

[tool.hatch.build.targets.wheel]
packages = ["src/novita_sandbox"]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.0"
pytest-cov = ">=4.0.0"
pytest-asyncio = ">=0.23.7"
pytest-xdist = ">=3.6.1"
pytest-mock = ">=3.10.0"
black = ">=23.7.0"
isort = ">=5.12.0"
mypy = ">=1.0.0"
pre-commit = ">=3.0.0"
ruff = ">=0.11.12"
python-dotenv = ">=1.0.0"
pytest-dotenv = ">=0.5.2"
responses = ">=0.23.0"
pytest-html = "^4.2.0"
pytest-json-report = "^1.5.0"

[tool.ruff]
exclude = [
    "src/novita_sandbox/core/envd/filesystem/filesystem_pb2.py"
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "novita_sandbox.core.envd.filesystem.filesystem_pb2",
]
ignore_missing_imports = true
