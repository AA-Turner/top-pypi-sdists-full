[project]
name = "stups-zign"
version = "1.2.2"
description = "OAuth2 token management CLI"
readme = "README.rst"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    {name = "Henning Jacobs", email = "henning.jacobs@zalando.de"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "clickclick>=20.10.2",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "stups-cli-support>=1.1.22",
    "stups-tokens>=1.1.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zign"]

[project.scripts]
ztoken = "zign.cli:main"
zign = "zign.cli_zign:main"

[project.urls]
Homepage = "https://github.com/zalando-build/zign"

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.4",
]
