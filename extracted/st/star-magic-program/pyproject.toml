[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "star-magic-program"
version = "0.411.0"
description = "Star-Magic UQFF calculator v0.411.0: THE CONSOLIDATED FULL-WHEEL PUBLICATION - v0.409.0 + v0.410.0 condensed into one complete release. Every published file on the wheel (~2,540 data-files: 2,303 whitepapers, registry 6,792 rows, rulings ledger, commercial + incorporation docs), SHIP GUARD v8, Batch-1 verification, Batch-2 fold (PAPER_063 e217, [UA] canonized), live results table (82 VERIFIED_LIVE), band trails. 2,254 dispatches, gate 6,029/0, acceptance 89/89. Next: PAPER_2259."
readme = "README.md"
authors = [
    { name = "Daniel T. Murphy", email = "daniel.murphy00@enrgyone.com" }
]
license = { text = "AGPL-3.0-or-later OR LicenseRef-StarMagic-Commercial" }
requires-python = ">=3.9"
dependencies = [
    "sympy>=1.12",
    "mpmath>=1.3",
    "numpy>=1.24",
    "scipy>=1.10",
]
keywords = [
    "unified field theory",
    "vacuum physics",
    "UQFF",
    "Star-Magic",
    "LENR",
    "cosmological constant",
    "Holmlid",
    "Di-Pseudo-Monopole",
    "DPM",
    "nuclear shell model",
    "Yang-Mills mass gap",
    "Millennium Prize problems",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Daniel8Murphy0007/Star-Magic-Program"
Source = "https://github.com/Daniel8Murphy0007/Star-Magic-Program"
Predecessor = "https://github.com/Daniel8Murphy0007/Star-Magic"
Issues = "https://github.com/Daniel8Murphy0007/Star-Magic-Program/issues"

[project.optional-dependencies]
xls = ["xlrd>=2.0"]
modbus = ["pymodbus>=3.15"]
gui = ["PyQt6", "matplotlib"]

[tool.setuptools]
packages = ["uqff_downhole_simulator"]
include-package-data = true
py-modules = ["uqff_session_closures", "uqff_fubii_variants", "uqff_ngc_catalog", "uqff_primitive_identities", "uqff_material_landmarks", "uqff_backbone_locks", "uqff_derived_functions", "uqff_derived_constants", 
    "uqff_registry_primitives",
    "uqff_calculator",
    "uqff_fidelity_tests",
    "uqff_registry_status",
    "uqff_registry_graph",
    "uqff_registry_xgeo",
    "registry_generator",
]

[tool.setuptools.package-data]
# Full-wheel rule: package data ships INSIDE the package (loader reads
# package-relative paths); the pre-v0.409.0 data-files mirror only worked for
# --target installs. Operator tier is gitignored and never matches.
uqff_downhole_simulator = ["catalog/*", "*.md", "*.json", "*.csv"]

[tool.setuptools.data-files]
