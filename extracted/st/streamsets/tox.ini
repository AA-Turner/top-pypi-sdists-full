[tox]
verbosity = 2
color = true
envlist = unit-310, unit-311, unit-312, integration-310, integration-312, docs, install-{310,311,312}, jenkinsfile

[testenv]
deps = pytest
       pytest-cov
       pytest-mock
       coverage

[testenv:unit]
commands = pytest -v --disable-warnings --cov=streamsets/sdk tests/unit

[testenv:integration]
commands = python -m pytest -v --cov=streamsets/sdk --disable-warnings --sch-credential-id={env:SCH_CREDENTIAL_ID} --sch-token={env:SCH_TOKEN} --sdc-version={env:SDC_VERSION} --transformer-version={env:TRANSFORMER_VERSION} --aster-url={env:ASTER_URL} tests/integration

[testenv:unit-310]
basepython = python3.10
commands = pytest -v --cov=streamsets/sdk --cov-report xml:coverage_unit_310.xml --junitxml results_unit_310.xml --disable-warnings tests/unit

[testenv:unit-311]
basepython = python3.11
commands = pytest -v --cov=streamsets/sdk --cov-report xml:coverage_unit_311.xml --junitxml results_unit_311.xml --disable-warnings tests/unit

[testenv:unit-312]
basepython = python3.12
commands = pytest -v --cov=streamsets/sdk --cov-report xml:coverage_unit_312.xml --junitxml results_unit_312.xml --disable-warnings tests/unit

[testenv:integration-310]
basepython = python3.10
commands = python -m pytest -v --cov=streamsets/sdk --cov-report xml:coverage_integration_310.xml --junitxml results_integration_310.xml --disable-warnings --sys-admin-email={env:SYS_ADMIN_EMAIL} --sys-admin-password={env:SYS_ADMIN_PASSWORD} --org-admin-email={env:ORG_ADMIN_EMAIL} --org-admin-password={env:ORG_ADMIN_PASSWORD} --firebase-api-key={env:FIREBASE_API_KEY} --sdc-version={env:SDC_VERSION} --transformer-version={env:TRANSFORMER_VERSION} --aster-url={env:ASTER_URL} --aws-key-id={env:AWS_ACCESS_KEY_ID} --aws-access-key={env:AWS_SECRET_ACCESS_KEY} --environment-region={env:REGION} --vpc-id={env:VPC_ID} --aws-subnet-ids={env:SUBNET_IDS} --aws-security-group-id={env:SECURITY_GROUP_ID}  --instance-profile={env:INSTANCE_PROFILE} --snowflake-username {env:SNOWFLAKE_USERNAME} --snowflake-password {env:SNOWFLAKE_PASSWORD} tests/integration

[testenv:integration-312]
basepython = python3.12
commands = python -m pytest -vvv --cov=streamsets/sdk --cov-report xml:coverage_integration_312.xml --junitxml results_integration_312.xml --disable-warnings --sys-admin-email={env:SYS_ADMIN_EMAIL} --sys-admin-password={env:SYS_ADMIN_PASSWORD} --org-admin-email={env:ORG_ADMIN_EMAIL} --org-admin-password={env:ORG_ADMIN_PASSWORD} --firebase-api-key={env:FIREBASE_API_KEY} --sdc-version={env:SDC_VERSION} --transformer-version={env:TRANSFORMER_VERSION} --aster-url={env:ASTER_URL} --aws-key-id={env:AWS_ACCESS_KEY_ID} --aws-access-key={env:AWS_SECRET_ACCESS_KEY} --environment-region={env:REGION} --vpc-id={env:VPC_ID} --aws-subnet-ids={env:SUBNET_IDS} --aws-security-group-id={env:SECURITY_GROUP_ID}  --instance-profile={env:INSTANCE_PROFILE} --snowflake-username {env:SNOWFLAKE_USERNAME} --snowflake-password {env:SNOWFLAKE_PASSWORD} {posargs:tests/integration}

[testenv:format]
deps = black
       isort
       flake8
commands = black --config=evergreen/pyproject.toml streamsets/sdk
           isort --settings-path=evergreen/pyproject.toml streamsets/sdk
           flake8 --config=evergreen/.flake8 streamsets/sdk

[testenv:docs]
deps = -rdocs/requirements.txt
commands = sphinx-build -b html -d .sphinx-build docs html

[testenv:install-{310,311,312}]
basepython =
    310: python3.10
    311: python3.11
    312: python3.12
recreate = true
deps = build
allowlist_externals = sh
commands = python -m build --outdir dist .
           # clean venv from installed build packages (should leave only 'pip' and 'setuptools')
           sh -c 'pip freeze | cut -d "@" -f1 | xargs pip uninstall -y'
           pip list
           # install package from .whl file
           sh -c 'pip install dist/*.whl'
           # just import ControlHub to check if it works (any missing depencencies?)
           python -c "from streamsets.sdk import ControlHub"
           # install pytest and run unit tests
           pip install pytest pytest-mock
           pytest tests/unit

[testenv:jenkinsfile]
skip_install = true
allowlist_externals = sh
passenv =
    JENKINS_USERNAME
    JENKINS_TOKEN
setenv =
    JENKINS_URL = https://ee-jenkins.streamsets.net
commands = sh -c 'response=$(curl -s -X POST -H "Content-Type: application/x-www-form-urlencoded" \
                -u {env:JENKINS_USERNAME}:{env:JENKINS_TOKEN} \
                --data-urlencode "jenkinsfile=$(cat evergreen/Jenkinsfile)" \
                {env:JENKINS_URL}/pipeline-model-converter/validate); \
                echo "$response"; \
                echo "$response" | grep -q "Jenkinsfile successfully validated." || exit 1'
