[project]
name = "streamsets"
authors = [
    {name = "StreamSets Inc"}
]
description = "A Python SDK for StreamSets"
readme = {file = "README.rst", content-type = "text/x-rst"}
requires-python = ">=3.10"
classifiers=[
    'Development Status :: 5 - Production/Stable',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: 3.15',
]
dependencies = ['dpath==1.5.0', 'inflection', 'PyYAML', 'requests >= 2.33.0']
dynamic = ["version"]

[tool.setuptools]
packages = ["streamsets.sdk"]
include-package-data = true
zip-safe = false

[tool.setuptools.dynamic]
version = {attr = "streamsets.sdk.__version__.__version__"}

[build-system]
requires = ["setuptools>=80.9.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"
