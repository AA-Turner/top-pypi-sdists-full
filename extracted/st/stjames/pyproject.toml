[project]
name = "stjames"
version = "0.0.293"
description = "structured JSON atom/molecule encoding scheme"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = []
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.4",
    "numpy",
    "requests",
    "more-itertools",
]

[dependency-groups]
dev = [
    "prek>=0.5.3",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.16.8",
    "rumdl>=0.2.77",
    "ty>=0.0.83",
    "rdkit>=2026.3.3",
]

[project.optional-dependencies]
rdkit = [
    "rdkit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
"Homepage" = "https://github.com/rowansci/stjames"
"Bug Tracker" = "https://github.com/rowansci/stjames/issues"

[tool.hatch.build.targets.wheel]
include = ["stjames"]
exclude = ["tests/"]

[tool.hatch.build.targets.wheel.sources]
"" = "."

[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = [
    "B",  # bugbear
    "D",  # pydocstyle
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming conventions
    "W",  # pycodestyle warnings
    "C4", # comprehensions
    "PL", # pylint
    "PT", # flake8-pytest-style
    "PIE", # misc lints
    "PYI", # flake8-pyi
    "TID", # tidy imports
    "TC", # type-checking imports
    "RUF", # Ruff-specific rules
    "RSE", # flake8-raise
    "ICN001", # unconventional-import-alias
]
ignore = [
    "E741", # Conventional atom indices in public molecular geometry APIs
    "N806", # Non-lowercase variable in function
    "PLR0911", # Too many returns
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments to function call
    "PLR0917", # Too many positional arguments
    "PLR0914", # Too many locals
    "PLR0915", # Too many statements
    "PLR1702", # Too many nested-blocks
    "PLR2004", # Magic value used in comparison
    "N801",    # Public scientific classes: iMTDSettings, pKaWorkflow
    "N802",    # Public scientific methods: find_CH_bonds, check_tensor_3D
    "N815",    # Public schema fields retain chemical notation (pH, all_CH)
    "RUF001",  # String contains ambiguous character (α/β spin labels)
    "RUF002",  # Docstring contains ambiguous dash
    "RUF012",  # Pydantic validates and copies model field defaults
    "N803",    # Public parameters retain scientific symbols
    "PT011",   # Schema tests assert validation failure without coupling to Pydantic wording
    "PT013",   # Incorrect import of pytest
    "TID252",  # Existing relative imports in this flat package
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = [
    "classmethod",
    "field_validator",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["stjames", "tests"]
addopts = "--doctest-modules --durations=5 -m 'not regression'"
doctest_optionflags = "NORMALIZE_WHITESPACE"
markers = [
  "smoke: sanity tests to reveal simple failures",
  "regression: tests to make sure bugs stay closed",
]

[tool.ty.environment]
python-version = "3.11"

[tool.coverage.run]
source = ["stjames"]
omit = ["stjames/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    'pragma: no cover',
    'def __repr__',
    'if self\.debug',
    'raise AssertionError',
    'raise NotImplementedError',
    'if 0:',
    'if __name__ == .__main__.:',
    '^\s*\.\.\.',
]
