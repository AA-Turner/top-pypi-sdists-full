name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Build
        run: uv build

      - name: Export locked test dependencies
        run: |
          uv export --quiet --locked --only-group dev \
            --format requirements.txt --output-file "$RUNNER_TEMP/requirements.publish.txt"

      - name: Test installed wheel
        run: |
          artifact=("$PWD"/dist/*.whl)
          test_dir=$(mktemp -d)
          cp -r tests pyproject.toml .github/scripts/test_distribution.py "$test_dir/"
          uv run --directory "$test_dir" --isolated --no-project --python 3.13 \
            --with "${artifact[0]}" --with-requirements "$RUNNER_TEMP/requirements.publish.txt" \
            python test_distribution.py

      - name: Test installed source distribution
        run: |
          artifact=("$PWD"/dist/*.tar.gz)
          test_dir=$(mktemp -d)
          cp -r tests pyproject.toml .github/scripts/test_distribution.py "$test_dir/"
          uv run --directory "$test_dir" --isolated --no-project --python 3.13 \
            --with "${artifact[0]}" --with-requirements "$RUNNER_TEMP/requirements.publish.txt" \
            python test_distribution.py

      - name: Publish
        run: uv publish --token ${{ secrets.PYPI_API_TOKEN }}
