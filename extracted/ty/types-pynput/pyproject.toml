[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=82.0.1"]

[project]
name = "types-pynput"
version = "1.8.1.20260712"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Typing stubs for pynput"
readme = { text = """\
## Typing stubs for pynput

This is a [type stub package](https://typing.python.org/en/latest/tutorials/external_libraries.html)
for the [`pynput`](https://github.com/moses-palmer/pynput) package. It can be used by type checkers
to check code that uses `pynput`. This version of
`types-pynput` aims to provide accurate annotations for
`pynput~=1.8.1`.

This package is part of the [typeshed project](https://github.com/python/typeshed).
All fixes for types and metadata should be contributed there.
See [the README](https://github.com/python/typeshed/blob/main/README.md)
for more details. The source for this package can be found in the
[`stubs/pynput`](https://github.com/python/typeshed/tree/main/stubs/pynput)
directory.

This package was tested with the following type checkers:
* [mypy](https://github.com/python/mypy/) 2.2.0
* [pyright](https://github.com/microsoft/pyright) 1.1.411

It was generated from typeshed commit
[`8e3110c4d3cf2828734b119863c6853529bb3034`](https://github.com/python/typeshed/commit/8e3110c4d3cf2828734b119863c6853529bb3034).
""", content-type = "text/markdown" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Stubs Only",
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
"Homepage" = "https://github.com/python/typeshed"
"GitHub" = "https://github.com/python/typeshed"
"Changes" = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/pynput.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
"Chat" = "https://gitter.im/python/typing"

[tool.setuptools]
packages = ['pynput-stubs']
include-package-data = false

[tool.setuptools.package-data]
'pynput-stubs' = ['__init__.pyi', '_info.pyi', '_util.pyi', 'keyboard/__init__.pyi', 'keyboard/_base.pyi', 'keyboard/_dummy.pyi', 'mouse/__init__.pyi', 'mouse/_base.pyi', 'mouse/_dummy.pyi', 'METADATA.toml', 'py.typed']
