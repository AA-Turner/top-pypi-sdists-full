[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=82.0.1"]

[project]
name = "types-mysqlclient"
version = "2.2.0.20260408"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Typing stubs for mysqlclient"
readme = { text = """\
## Typing stubs for mysqlclient

This is a [type stub package](https://typing.python.org/en/latest/tutorials/external_libraries.html)
for the [`mysqlclient`](https://github.com/PyMySQL/mysqlclient) package. It can be used by type checkers
to check code that uses `mysqlclient`. This version of
`types-mysqlclient` aims to provide accurate annotations for
`mysqlclient==2.2.*`.

This package is part of the [typeshed project](https://github.com/python/typeshed).
All fixes for types and metadata should be contributed there.
See [the README](https://github.com/python/typeshed/blob/main/README.md)
for more details. The source for this package can be found in the
[`stubs/mysqlclient`](https://github.com/python/typeshed/tree/main/stubs/mysqlclient)
directory.

This package was tested with the following type checkers:
* [mypy](https://github.com/python/mypy/) 1.20.0
* [pyright](https://github.com/microsoft/pyright) 1.1.408

It was generated from typeshed commit
[`563213272e5db2a858e37bdf6938b0c8742ec192`](https://github.com/python/typeshed/commit/563213272e5db2a858e37bdf6938b0c8742ec192).
""", content-type = "text/markdown" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Stubs Only",
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
"Homepage" = "https://github.com/python/typeshed"
"GitHub" = "https://github.com/python/typeshed"
"Changes" = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/mysqlclient.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
"Chat" = "https://gitter.im/python/typing"

[tool.setuptools]
packages = ['MySQLdb-stubs']
include-package-data = false

[tool.setuptools.package-data]
'MySQLdb-stubs' = ['__init__.pyi', '_exceptions.pyi', '_mysql.pyi', 'connections.pyi', 'constants/CLIENT.pyi', 'constants/CR.pyi', 'constants/ER.pyi', 'constants/FIELD_TYPE.pyi', 'constants/FLAG.pyi', 'constants/__init__.pyi', 'converters.pyi', 'cursors.pyi', 'release.pyi', 'times.pyi', 'METADATA.toml', 'py.typed']
