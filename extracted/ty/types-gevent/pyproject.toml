[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=82.0.1"]

[project]
name = "types-gevent"
version = "25.9.0.20260402"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Typing stubs for gevent"
readme = { text = """\
## Typing stubs for gevent

This is a [type stub package](https://typing.python.org/en/latest/tutorials/external_libraries.html)
for the [`gevent`](https://github.com/gevent/gevent) package. It can be used by type checkers
to check code that uses `gevent`. This version of
`types-gevent` aims to provide accurate annotations for
`gevent==25.9.*`.

This package is part of the [typeshed project](https://github.com/python/typeshed).
All fixes for types and metadata should be contributed there.
See [the README](https://github.com/python/typeshed/blob/main/README.md)
for more details. The source for this package can be found in the
[`stubs/gevent`](https://github.com/python/typeshed/tree/main/stubs/gevent)
directory.

This package was tested with the following type checkers:
* [mypy](https://github.com/python/mypy/) 1.20.0
* [pyright](https://github.com/microsoft/pyright) 1.1.408

It was generated from typeshed commit
[`4ab04d22631e5842838528ceaae19c3c532cdd43`](https://github.com/python/typeshed/commit/4ab04d22631e5842838528ceaae19c3c532cdd43).
""", content-type = "text/markdown" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Stubs Only",
]
requires-python = ">=3.10"
dependencies = ['types-greenlet', 'types-psutil>=7.2.0']

[project.urls]
"Homepage" = "https://github.com/python/typeshed"
"GitHub" = "https://github.com/python/typeshed"
"Changes" = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/gevent.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
"Chat" = "https://gitter.im/python/typing"

[tool.setuptools]
packages = ['gevent-stubs']
include-package-data = false

[tool.setuptools.package-data]
'gevent-stubs' = ['__init__.pyi', '_abstract_linkable.pyi', '_config.pyi', '_ffi/__init__.pyi', '_ffi/loop.pyi', '_ffi/watcher.pyi', '_fileobjectcommon.pyi', '_greenlet_primitives.pyi', '_hub_local.pyi', '_hub_primitives.pyi', '_ident.pyi', '_imap.pyi', '_monitor.pyi', '_threading.pyi', '_types.pyi', '_util.pyi', '_waiter.pyi', 'ares.pyi', 'backdoor.pyi', 'baseserver.pyi', 'event.pyi', 'events.pyi', 'exceptions.pyi', 'fileobject.pyi', 'greenlet.pyi', 'hub.pyi', 'libev/__init__.pyi', 'libev/corecext.pyi', 'libev/corecffi.pyi', 'libev/watcher.pyi', 'libuv/__init__.pyi', 'libuv/loop.pyi', 'libuv/watcher.pyi', 'local.pyi', 'lock.pyi', 'monkey/__init__.pyi', 'monkey/api.pyi', 'os.pyi', 'pool.pyi', 'pywsgi.pyi', 'queue.pyi', 'resolver/__init__.pyi', 'resolver/ares.pyi', 'resolver/blocking.pyi', 'resolver/cares.pyi', 'resolver/dnspython.pyi', 'resolver/thread.pyi', 'resolver_ares.pyi', 'resolver_thread.pyi', 'select.pyi', 'selectors.pyi', 'server.pyi', 'signal.pyi', 'socket.pyi', 'ssl.pyi', 'subprocess.pyi', 'threadpool.pyi', 'time.pyi', 'timeout.pyi', 'util.pyi', 'win32util.pyi', 'METADATA.toml', 'py.typed']
