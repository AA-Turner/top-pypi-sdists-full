[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=82.0.1"]

[project]
name = "types-pycurl"
version = "7.48.0.20260923"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Typing stubs for pycurl"
readme = { text = """\
## Typing stubs for pycurl

This is a [type stub package](https://typing.python.org/en/latest/tutorials/external_libraries.html)
for the [`pycurl`](https://github.com/pycurl/pycurl) package. It can be used by type checkers
to check code that uses `pycurl`. This version of
`types-pycurl` aims to provide accurate annotations for
`pycurl==7.48.0`.

This package is part of the [typeshed project](https://github.com/python/typeshed).
All fixes for types and metadata should be contributed there.
See [the README](https://github.com/python/typeshed/blob/main/README.md)
for more details. The source for this package can be found in the
[`stubs/pycurl`](https://github.com/python/typeshed/tree/main/stubs/pycurl)
directory.

This package was tested with the following type checkers:
* [mypy](https://www.mypy-lang.org/) 2.3.0
* [pyrefly](https://pyrefly.org/) 1.3.0.dev1
* [pyright](https://microsoft.github.io/pyright/) 1.1.414
* [ty](https://docs.astral.sh/ty/) 0.0.59

It was generated from typeshed commit
[`6d045a9fff15db83b49b89b14b8dd47ff382470c`](https://github.com/python/typeshed/commit/6d045a9fff15db83b49b89b14b8dd47ff382470c).
""", content-type = "text/markdown" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Stubs Only",
]
requires-python = ">=3.10"
dependencies = []



[project.urls]
"Homepage" = "https://github.com/python/typeshed"
"GitHub" = "https://github.com/python/typeshed"
"Changes" = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/pycurl.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
"Chat" = "https://gitter.im/python/typing"

[tool.setuptools]
packages = ['pycurl-stubs']
include-package-data = false

[tool.setuptools.package-data]
'pycurl-stubs' = ['__init__.pyi', '_pycurl.pyi', 'async_multi.pyi', 'METADATA.toml', 'py.typed']
