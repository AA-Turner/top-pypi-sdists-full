[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=82.0.1"]

[project]
name = "types-objgraph"
version = "3.7.0.20261018"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Typing stubs for objgraph"
readme = { text = """\
## Typing stubs for objgraph

This is a [type stub package](https://typing.python.org/en/latest/tutorials/external_libraries.html)
for the [`objgraph`](https://github.com/mgedmin/objgraph) package. It can be used by type checkers
to check code that uses `objgraph`. This version of
`types-objgraph` aims to provide accurate annotations for
`objgraph==3.7.*`.

This package is part of the [typeshed project](https://github.com/python/typeshed).
All fixes for types and metadata should be contributed there.
See [the README](https://github.com/python/typeshed/blob/main/README.md)
for more details. The source for this package can be found in the
[`stubs/objgraph`](https://github.com/python/typeshed/tree/main/stubs/objgraph)
directory.

This package was tested with the following type checkers:
* [mypy](https://www.mypy-lang.org/) 2.4.0
* [pyrefly](https://pyrefly.org/) 1.3.2
* [pyright](https://microsoft.github.io/pyright/) 1.1.414
* [ty](https://docs.astral.sh/ty/) 0.0.85

It was generated from typeshed commit
[`e75a39fec6f375f5002d54c5607b44bedc025a4b`](https://github.com/python/typeshed/commit/e75a39fec6f375f5002d54c5607b44bedc025a4b).
""", content-type = "text/markdown" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Stubs Only",
]
requires-python = ">=3.10"
dependencies = []



[project.urls]
"Homepage" = "https://github.com/python/typeshed"
"GitHub" = "https://github.com/python/typeshed"
"Changes" = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/objgraph.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
"Chat" = "https://gitter.im/python/typing"

[tool.setuptools]
packages = ['objgraph-stubs']
include-package-data = false

[tool.setuptools.package-data]
'objgraph-stubs' = ['__init__.pyi', 'METADATA.toml', 'py.typed']
