[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=82.0.1"]

[project]
name = "types-uWSGI"
version = "2.0.0.20260508"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Typing stubs for uWSGI"
readme = { text = """\
## Typing stubs for uWSGI

This is a [type stub package](https://typing.python.org/en/latest/tutorials/external_libraries.html)
for the [`uWSGI`](https://github.com/unbit/uwsgi) package. It can be used by type checkers
to check code that uses `uWSGI`. This version of
`types-uWSGI` aims to provide accurate annotations for
`uWSGI==2.0.*`.

Type hints for uWSGI's [Python API](https://uwsgi-docs.readthedocs.io/en/latest/PythonModule.html). Note that this API is available only when running Python code inside a uWSGI process and some parts of the API are only present when corresponding configuration options have been enabled.

This package is part of the [typeshed project](https://github.com/python/typeshed).
All fixes for types and metadata should be contributed there.
See [the README](https://github.com/python/typeshed/blob/main/README.md)
for more details. The source for this package can be found in the
[`stubs/uWSGI`](https://github.com/python/typeshed/tree/main/stubs/uWSGI)
directory.

This package was tested with the following type checkers:
* [mypy](https://github.com/python/mypy/) 1.20.0
* [pyright](https://github.com/microsoft/pyright) 1.1.408

It was generated from typeshed commit
[`a7f0a8286aaf594602b81bef79c77175fcf9ceda`](https://github.com/python/typeshed/commit/a7f0a8286aaf594602b81bef79c77175fcf9ceda).
""", content-type = "text/markdown" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Stubs Only",
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
"Homepage" = "https://github.com/python/typeshed"
"GitHub" = "https://github.com/python/typeshed"
"Changes" = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/uWSGI.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
"Chat" = "https://gitter.im/python/typing"

[tool.setuptools]
packages = ['uwsgi-stubs', 'uwsgidecorators-stubs']
include-package-data = false

[tool.setuptools.package-data]
'uwsgi-stubs' = ['__init__.pyi', 'METADATA.toml', 'py.typed']
'uwsgidecorators-stubs' = ['__init__.pyi', 'METADATA.toml', 'py.typed']
