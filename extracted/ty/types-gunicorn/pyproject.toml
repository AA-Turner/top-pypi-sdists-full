[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=82.0.1"]

[project]
name = "types-gunicorn"
version = "26.0.0.20260728"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Typing stubs for gunicorn"
readme = { text = """\
## Typing stubs for gunicorn

This is a [type stub package](https://typing.python.org/en/latest/tutorials/external_libraries.html)
for the [`gunicorn`](https://github.com/benoitc/gunicorn) package. It can be used by type checkers
to check code that uses `gunicorn`. This version of
`types-gunicorn` aims to provide accurate annotations for
`gunicorn==26.0.0`.

This package is part of the [typeshed project](https://github.com/python/typeshed).
All fixes for types and metadata should be contributed there.
See [the README](https://github.com/python/typeshed/blob/main/README.md)
for more details. The source for this package can be found in the
[`stubs/gunicorn`](https://github.com/python/typeshed/tree/main/stubs/gunicorn)
directory.

This package was tested with the following type checkers:
* [mypy](https://github.com/python/mypy/) 2.3.0
* [pyright](https://github.com/microsoft/pyright) 1.1.411
* [ty](https://docs.astral.sh/ty/) 0.0.59

It was generated from typeshed commit
[`56cbde4208f43643727ba2896ddd585ca6bb2615`](https://github.com/python/typeshed/commit/56cbde4208f43643727ba2896ddd585ca6bb2615).
""", content-type = "text/markdown" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Stubs Only",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
all = ['types-gevent']
gevent = ['types-gevent']

[project.urls]
"Homepage" = "https://github.com/python/typeshed"
"GitHub" = "https://github.com/python/typeshed"
"Changes" = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/gunicorn.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
"Chat" = "https://gitter.im/python/typing"

[tool.setuptools]
packages = ['gunicorn-stubs']
include-package-data = false

[tool.setuptools.package-data]
'gunicorn-stubs' = ['__init__.pyi', '_types.pyi', 'app/__init__.pyi', 'app/base.pyi', 'app/pasterapp.pyi', 'app/wsgiapp.pyi', 'arbiter.pyi', 'asgi/__init__.pyi', 'asgi/lifespan.pyi', 'asgi/parser.pyi', 'asgi/protocol.pyi', 'asgi/unreader.pyi', 'asgi/uwsgi.pyi', 'asgi/websocket.pyi', 'config.pyi', 'ctl/__init__.pyi', 'ctl/cli.pyi', 'ctl/client.pyi', 'ctl/handlers.pyi', 'ctl/protocol.pyi', 'ctl/server.pyi', 'debug.pyi', 'dirty/__init__.pyi', 'dirty/app.pyi', 'dirty/arbiter.pyi', 'dirty/client.pyi', 'dirty/errors.pyi', 'dirty/protocol.pyi', 'dirty/stash.pyi', 'dirty/tlv.pyi', 'dirty/worker.pyi', 'errors.pyi', 'glogging.pyi', 'http/__init__.pyi', 'http/body.pyi', 'http/errors.pyi', 'http/message.pyi', 'http/parser.pyi', 'http/unreader.pyi', 'http/wsgi.pyi', 'http2/__init__.pyi', 'http2/async_connection.pyi', 'http2/connection.pyi', 'http2/errors.pyi', 'http2/request.pyi', 'http2/stream.pyi', 'instrument/__init__.pyi', 'instrument/statsd.pyi', 'pidfile.pyi', 'reloader.pyi', 'sock.pyi', 'systemd.pyi', 'util.pyi', 'uwsgi/__init__.pyi', 'uwsgi/errors.pyi', 'uwsgi/message.pyi', 'uwsgi/parser.pyi', 'workers/__init__.pyi', 'workers/base.pyi', 'workers/base_async.pyi', 'workers/gasgi.pyi', 'workers/ggevent.pyi', 'workers/gthread.pyi', 'workers/gtornado.pyi', 'workers/sync.pyi', 'workers/workertmp.pyi', 'METADATA.toml', 'py.typed']
