[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=82.0.1"]

[project]
name = "types-jwcrypto"
version = "1.6.0.20260903"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Typing stubs for jwcrypto"
readme = { text = """\
## Typing stubs for jwcrypto

This is a [type stub package](https://typing.python.org/en/latest/tutorials/external_libraries.html)
for the [`jwcrypto`](https://github.com/latchset/jwcrypto) package. It can be used by type checkers
to check code that uses `jwcrypto`. This version of
`types-jwcrypto` aims to provide accurate annotations for
`jwcrypto==1.6.0`.

This package is part of the [typeshed project](https://github.com/python/typeshed).
All fixes for types and metadata should be contributed there.
See [the README](https://github.com/python/typeshed/blob/main/README.md)
for more details. The source for this package can be found in the
[`stubs/jwcrypto`](https://github.com/python/typeshed/tree/main/stubs/jwcrypto)
directory.

This package was tested with the following type checkers:
* [mypy](https://www.mypy-lang.org/) 2.3.0
* [pyrefly](https://pyrefly.org/) 1.3.0.dev1
* [pyright](https://microsoft.github.io/pyright/) 1.1.411
* [ty](https://docs.astral.sh/ty/) 0.0.59

It was generated from typeshed commit
[`93a4ebde92adb94f67686a232c338b834b207442`](https://github.com/python/typeshed/commit/93a4ebde92adb94f67686a232c338b834b207442).
""", content-type = "text/markdown" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Stubs Only",
]
requires-python = ">=3.10"
dependencies = ['cryptography']



[project.urls]
"Homepage" = "https://github.com/python/typeshed"
"GitHub" = "https://github.com/python/typeshed"
"Changes" = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/jwcrypto.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
"Chat" = "https://gitter.im/python/typing"

[tool.setuptools]
packages = ['jwcrypto-stubs']
include-package-data = false

[tool.setuptools.package-data]
'jwcrypto-stubs' = ['__init__.pyi', 'common.pyi', 'jwa.pyi', 'jwe.pyi', 'jwk.pyi', 'jws.pyi', 'jwt.pyi', 'version.pyi', 'METADATA.toml', 'py.typed']
