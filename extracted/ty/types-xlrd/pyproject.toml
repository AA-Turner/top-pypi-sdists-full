[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=82.0.1"]

[project]
name = "types-xlrd"
version = "2.0.0.20260408"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Typing stubs for xlrd"
readme = { text = """\
## Typing stubs for xlrd

This is a [type stub package](https://typing.python.org/en/latest/tutorials/external_libraries.html)
for the [`xlrd`](https://github.com/python-excel/xlrd) package. It can be used by type checkers
to check code that uses `xlrd`. This version of
`types-xlrd` aims to provide accurate annotations for
`xlrd==2.0.*`.

This package is part of the [typeshed project](https://github.com/python/typeshed).
All fixes for types and metadata should be contributed there.
See [the README](https://github.com/python/typeshed/blob/main/README.md)
for more details. The source for this package can be found in the
[`stubs/xlrd`](https://github.com/python/typeshed/tree/main/stubs/xlrd)
directory.

This package was tested with the following type checkers:
* [mypy](https://github.com/python/mypy/) 1.20.0
* [pyright](https://github.com/microsoft/pyright) 1.1.408

It was generated from typeshed commit
[`563213272e5db2a858e37bdf6938b0c8742ec192`](https://github.com/python/typeshed/commit/563213272e5db2a858e37bdf6938b0c8742ec192).
""", content-type = "text/markdown" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Stubs Only",
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
"Homepage" = "https://github.com/python/typeshed"
"GitHub" = "https://github.com/python/typeshed"
"Changes" = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/xlrd.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
"Chat" = "https://gitter.im/python/typing"

[tool.setuptools]
packages = ['xlrd-stubs']
include-package-data = false

[tool.setuptools.package-data]
'xlrd-stubs' = ['__init__.pyi', 'biffh.pyi', 'book.pyi', 'compdoc.pyi', 'formatting.pyi', 'formula.pyi', 'info.pyi', 'sheet.pyi', 'timemachine.pyi', 'xldate.pyi', 'METADATA.toml', 'py.typed']
