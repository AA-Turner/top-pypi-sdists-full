[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=82.0.1"]

[project]
name = "types-pysftp"
version = "0.2.17.20260518"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Typing stubs for pysftp"
readme = { text = """\
## Typing stubs for pysftp

This is a [type stub package](https://typing.python.org/en/latest/tutorials/external_libraries.html)
for the [`pysftp`](https://bitbucket.org/dundeemt/pysftp) package. It can be used by type checkers
to check code that uses `pysftp`. This version of
`types-pysftp` aims to provide accurate annotations for
`pysftp==0.2.*`.

This package is part of the [typeshed project](https://github.com/python/typeshed).
All fixes for types and metadata should be contributed there.
See [the README](https://github.com/python/typeshed/blob/main/README.md)
for more details. The source for this package can be found in the
[`stubs/pysftp`](https://github.com/python/typeshed/tree/main/stubs/pysftp)
directory.

This package was tested with the following type checkers:
* [mypy](https://github.com/python/mypy/) 2.1.0
* [pyright](https://github.com/microsoft/pyright) 1.1.409

It was generated from typeshed commit
[`3402466d17144ed7edfc92940c6973167ba285af`](https://github.com/python/typeshed/commit/3402466d17144ed7edfc92940c6973167ba285af).
""", content-type = "text/markdown" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Stubs Only",
]
requires-python = ">=3.10"
dependencies = ['types-paramiko']

[project.urls]
"Homepage" = "https://github.com/python/typeshed"
"GitHub" = "https://github.com/python/typeshed"
"Changes" = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/pysftp.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
"Chat" = "https://gitter.im/python/typing"

[tool.setuptools]
packages = ['pysftp-stubs']
include-package-data = false

[tool.setuptools.package-data]
'pysftp-stubs' = ['__init__.pyi', 'exceptions.pyi', 'helpers.pyi', 'METADATA.toml', 'py.typed']
