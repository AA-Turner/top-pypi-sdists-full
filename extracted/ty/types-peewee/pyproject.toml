[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=82.0.1"]

[project]
name = "types-peewee"
version = "4.4.0.20260827"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Typing stubs for peewee"
readme = { text = """\
## Typing stubs for peewee

This is a [type stub package](https://typing.python.org/en/latest/tutorials/external_libraries.html)
for the [`peewee`](https://github.com/coleifer/peewee) package. It can be used by type checkers
to check code that uses `peewee`. This version of
`types-peewee` aims to provide accurate annotations for
`peewee==4.4.0`.

This stub package is marked as [partial](https://typing.python.org/en/latest/spec/distributing.html#partial-stub-packages).
If you find that annotations are missing, feel free to contribute and help complete them.


This package is part of the [typeshed project](https://github.com/python/typeshed).
All fixes for types and metadata should be contributed there.
See [the README](https://github.com/python/typeshed/blob/main/README.md)
for more details. The source for this package can be found in the
[`stubs/peewee`](https://github.com/python/typeshed/tree/main/stubs/peewee)
directory.

This package was tested with the following type checkers:
* [mypy](https://www.mypy-lang.org/) 2.3.0
* [pyrefly](https://pyrefly.org/) 1.3.0.dev1
* [pyright](https://microsoft.github.io/pyright/) 1.1.411
* [ty](https://docs.astral.sh/ty/) 0.0.59

It was generated from typeshed commit
[`c10142fb9463b1dd0c581d3f08f4c01c5c08a09e`](https://github.com/python/typeshed/commit/c10142fb9463b1dd0c581d3f08f4c01c5c08a09e).
""", content-type = "text/markdown" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Stubs Only",
]
requires-python = ">=3.10"
dependencies = []



[project.urls]
"Homepage" = "https://github.com/python/typeshed"
"GitHub" = "https://github.com/python/typeshed"
"Changes" = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/peewee.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
"Chat" = "https://gitter.im/python/typing"

[tool.setuptools]
packages = ['playhouse-stubs', 'peewee-stubs']
include-package-data = false

[tool.setuptools.package-data]
'playhouse-stubs' = ['__init__.pyi', 'flask_utils.pyi', 'METADATA.toml', 'py.typed']
'peewee-stubs' = ['__init__.pyi', 'METADATA.toml', 'py.typed']
