[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=82.0.1"]

[project]
name = "types-pyfarmhash"
version = "0.5.0.20260819"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Typing stubs for pyfarmhash"
readme = { text = """\
## Typing stubs for pyfarmhash

This is a [type stub package](https://typing.python.org/en/latest/tutorials/external_libraries.html)
for the [`pyfarmhash`](https://github.com/veelion/python-farmhash) package. It can be used by type checkers
to check code that uses `pyfarmhash`. This version of
`types-pyfarmhash` aims to provide accurate annotations for
`pyfarmhash==0.5.*`.

This package is part of the [typeshed project](https://github.com/python/typeshed).
All fixes for types and metadata should be contributed there.
See [the README](https://github.com/python/typeshed/blob/main/README.md)
for more details. The source for this package can be found in the
[`stubs/pyfarmhash`](https://github.com/python/typeshed/tree/main/stubs/pyfarmhash)
directory.

This package was tested with the following type checkers:
* [mypy](https://github.com/python/mypy/) 2.3.0
* [pyrefly](https://pyrefly.org/) 1.3.0.dev1
* [pyright](https://github.com/microsoft/pyright) 1.1.411
* [ty](https://docs.astral.sh/ty/) 0.0.59

It was generated from typeshed commit
[`29094251023b05d6411dc034da776db1e4448d5b`](https://github.com/python/typeshed/commit/29094251023b05d6411dc034da776db1e4448d5b).
""", content-type = "text/markdown" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Stubs Only",
]
requires-python = ">=3.10"
dependencies = []



[project.urls]
"Homepage" = "https://github.com/python/typeshed"
"GitHub" = "https://github.com/python/typeshed"
"Changes" = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/pyfarmhash.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
"Chat" = "https://gitter.im/python/typing"

[tool.setuptools]
packages = ['farmhash-stubs']
include-package-data = false

[tool.setuptools.package-data]
'farmhash-stubs' = ['__init__.pyi', 'METADATA.toml', 'py.typed']
