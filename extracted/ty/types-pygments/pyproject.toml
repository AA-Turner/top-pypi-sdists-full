[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=82.0.1"]

[project]
name = "types-Pygments"
version = "2.20.0.20260407"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Typing stubs for Pygments"
readme = { text = """\
## Typing stubs for Pygments

This is a [type stub package](https://typing.python.org/en/latest/tutorials/external_libraries.html)
for the [`Pygments`](https://github.com/pygments/pygments) package. It can be used by type checkers
to check code that uses `Pygments`. This version of
`types-Pygments` aims to provide accurate annotations for
`Pygments==2.20.*`.

This stub package is marked as [partial](https://typing.python.org/en/latest/spec/distributing.html#partial-stub-packages).
If you find that annotations are missing, feel free to contribute and help complete them.


This package is part of the [typeshed project](https://github.com/python/typeshed).
All fixes for types and metadata should be contributed there.
See [the README](https://github.com/python/typeshed/blob/main/README.md)
for more details. The source for this package can be found in the
[`stubs/Pygments`](https://github.com/python/typeshed/tree/main/stubs/Pygments)
directory.

This package was tested with the following type checkers:
* [mypy](https://github.com/python/mypy/) 1.20.0
* [pyright](https://github.com/microsoft/pyright) 1.1.408

It was generated from typeshed commit
[`4f08613245341098856e10ede6221ddff639ea93`](https://github.com/python/typeshed/commit/4f08613245341098856e10ede6221ddff639ea93).
""", content-type = "text/markdown" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Stubs Only",
]
requires-python = ">=3.10"
dependencies = ['types-docutils']

[project.urls]
"Homepage" = "https://github.com/python/typeshed"
"GitHub" = "https://github.com/python/typeshed"
"Changes" = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/Pygments.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
"Chat" = "https://gitter.im/python/typing"

[tool.setuptools]
packages = ['pygments-stubs']
include-package-data = false

[tool.setuptools.package-data]
'pygments-stubs' = ['__init__.pyi', 'cmdline.pyi', 'console.pyi', 'filter.pyi', 'filters/__init__.pyi', 'formatter.pyi', 'formatters/__init__.pyi', 'formatters/_mapping.pyi', 'formatters/bbcode.pyi', 'formatters/groff.pyi', 'formatters/html.pyi', 'formatters/img.pyi', 'formatters/irc.pyi', 'formatters/latex.pyi', 'formatters/other.pyi', 'formatters/pangomarkup.pyi', 'formatters/rtf.pyi', 'formatters/svg.pyi', 'formatters/terminal.pyi', 'formatters/terminal256.pyi', 'lexer.pyi', 'lexers/__init__.pyi', 'lexers/javascript.pyi', 'lexers/jsx.pyi', 'lexers/kusto.pyi', 'lexers/ldap.pyi', 'lexers/lean.pyi', 'lexers/lisp.pyi', 'lexers/prql.pyi', 'lexers/vip.pyi', 'lexers/vyper.pyi', 'modeline.pyi', 'plugin.pyi', 'regexopt.pyi', 'scanner.pyi', 'sphinxext.pyi', 'style.pyi', 'styles/__init__.pyi', 'token.pyi', 'unistring.pyi', 'util.pyi', 'METADATA.toml', 'py.typed']
