[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=82.0.1"]

[project]
name = "types-auth0-python"
version = "4.10.0.20260509"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Typing stubs for auth0-python"
readme = { text = """\
## Typing stubs for auth0-python

This is a [type stub package](https://typing.python.org/en/latest/tutorials/external_libraries.html)
for the [`auth0-python`](https://github.com/auth0/auth0-python) package. It can be used by type checkers
to check code that uses `auth0-python`. This version of
`types-auth0-python` aims to provide accurate annotations for
`auth0-python==4.10.*`.

*Note:* The `auth0-python` package includes type annotations or type stubs
since version 5.4.0. Please uninstall the `types-auth0-python`
package if you use this or a newer version.


This package is part of the [typeshed project](https://github.com/python/typeshed).
All fixes for types and metadata should be contributed there.
See [the README](https://github.com/python/typeshed/blob/main/README.md)
for more details. The source for this package can be found in the
[`stubs/auth0-python`](https://github.com/python/typeshed/tree/main/stubs/auth0-python)
directory.

This package was tested with the following type checkers:
* [mypy](https://github.com/python/mypy/) 2.0.0
* [pyright](https://github.com/microsoft/pyright) 1.1.409

It was generated from typeshed commit
[`6a4075c7bcf192227421bc13558c19bc9fd2342e`](https://github.com/python/typeshed/commit/6a4075c7bcf192227421bc13558c19bc9fd2342e).
""", content-type = "text/markdown" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Stubs Only",
]
requires-python = ">=3.10"
dependencies = ['types-requests', 'cryptography']

[project.urls]
"Homepage" = "https://github.com/python/typeshed"
"GitHub" = "https://github.com/python/typeshed"
"Changes" = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/auth0-python.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
"Chat" = "https://gitter.im/python/typing"

[tool.setuptools]
packages = ['auth0-stubs']
include-package-data = false

[tool.setuptools.package-data]
'auth0-stubs' = ['__init__.pyi', 'asyncify.pyi', 'authentication/__init__.pyi', 'authentication/async_token_verifier.pyi', 'authentication/back_channel_login.pyi', 'authentication/base.pyi', 'authentication/client_authentication.pyi', 'authentication/database.pyi', 'authentication/delegated.pyi', 'authentication/enterprise.pyi', 'authentication/get_token.pyi', 'authentication/passwordless.pyi', 'authentication/pushed_authorization_requests.pyi', 'authentication/revoke_token.pyi', 'authentication/social.pyi', 'authentication/token_verifier.pyi', 'authentication/users.pyi', 'exceptions.pyi', 'management/__init__.pyi', 'management/actions.pyi', 'management/async_auth0.pyi', 'management/attack_protection.pyi', 'management/auth0.pyi', 'management/blacklists.pyi', 'management/branding.pyi', 'management/client_credentials.pyi', 'management/client_grants.pyi', 'management/clients.pyi', 'management/connections.pyi', 'management/custom_domains.pyi', 'management/device_credentials.pyi', 'management/email_templates.pyi', 'management/emails.pyi', 'management/grants.pyi', 'management/guardian.pyi', 'management/hooks.pyi', 'management/jobs.pyi', 'management/log_streams.pyi', 'management/logs.pyi', 'management/organizations.pyi', 'management/prompts.pyi', 'management/resource_servers.pyi', 'management/roles.pyi', 'management/rules.pyi', 'management/rules_configs.pyi', 'management/self_service_profiles.pyi', 'management/stats.pyi', 'management/tenants.pyi', 'management/tickets.pyi', 'management/user_blocks.pyi', 'management/users.pyi', 'management/users_by_email.pyi', 'rest.pyi', 'rest_async.pyi', 'types.pyi', 'utils.pyi', 'METADATA.toml', 'py.typed']
