[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=82.0.1"]

[project]
name = "types-pyflakes"
version = "3.4.0.20260508"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Typing stubs for pyflakes"
readme = { text = """\
## Typing stubs for pyflakes

This is a [type stub package](https://typing.python.org/en/latest/tutorials/external_libraries.html)
for the [`pyflakes`](https://github.com/PyCQA/pyflakes) package. It can be used by type checkers
to check code that uses `pyflakes`. This version of
`types-pyflakes` aims to provide accurate annotations for
`pyflakes==3.4.*`.

This package is part of the [typeshed project](https://github.com/python/typeshed).
All fixes for types and metadata should be contributed there.
See [the README](https://github.com/python/typeshed/blob/main/README.md)
for more details. The source for this package can be found in the
[`stubs/pyflakes`](https://github.com/python/typeshed/tree/main/stubs/pyflakes)
directory.

This package was tested with the following type checkers:
* [mypy](https://github.com/python/mypy/) 1.20.0
* [pyright](https://github.com/microsoft/pyright) 1.1.408

It was generated from typeshed commit
[`a7f0a8286aaf594602b81bef79c77175fcf9ceda`](https://github.com/python/typeshed/commit/a7f0a8286aaf594602b81bef79c77175fcf9ceda).
""", content-type = "text/markdown" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Stubs Only",
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
"Homepage" = "https://github.com/python/typeshed"
"GitHub" = "https://github.com/python/typeshed"
"Changes" = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/pyflakes.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
"Chat" = "https://gitter.im/python/typing"

[tool.setuptools]
packages = ['pyflakes-stubs']
include-package-data = false

[tool.setuptools.package-data]
'pyflakes-stubs' = ['__init__.pyi', '__main__.pyi', 'api.pyi', 'checker.pyi', 'messages.pyi', 'reporter.pyi', 'scripts/__init__.pyi', 'scripts/pyflakes.pyi', 'METADATA.toml', 'py.typed']
