[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=82.0.1"]

[project]
name = "types-Flask-Cors"
version = "6.0.3.20260608"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Typing stubs for Flask-Cors"
readme = { text = """\
## Typing stubs for Flask-Cors

This is a [type stub package](https://typing.python.org/en/latest/tutorials/external_libraries.html)
for the [`Flask-Cors`](https://github.com/corydolphin/flask-cors) package. It can be used by type checkers
to check code that uses `Flask-Cors`. This version of
`types-Flask-Cors` aims to provide accurate annotations for
`Flask-Cors~=6.0.3`.

This package is part of the [typeshed project](https://github.com/python/typeshed).
All fixes for types and metadata should be contributed there.
See [the README](https://github.com/python/typeshed/blob/main/README.md)
for more details. The source for this package can be found in the
[`stubs/Flask-Cors`](https://github.com/python/typeshed/tree/main/stubs/Flask-Cors)
directory.

This package was tested with the following type checkers:
* [mypy](https://github.com/python/mypy/) 2.1.0
* [pyright](https://github.com/microsoft/pyright) 1.1.410

It was generated from typeshed commit
[`64869a290645cfcca73abb82b0aa03a731dd934f`](https://github.com/python/typeshed/commit/64869a290645cfcca73abb82b0aa03a731dd934f).
""", content-type = "text/markdown" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Stubs Only",
]
requires-python = ">=3.10"
dependencies = ['Flask>=2.0.0']

[project.urls]
"Homepage" = "https://github.com/python/typeshed"
"GitHub" = "https://github.com/python/typeshed"
"Changes" = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/Flask-Cors.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
"Chat" = "https://gitter.im/python/typing"

[tool.setuptools]
packages = ['flask_cors-stubs']
include-package-data = false

[tool.setuptools.package-data]
'flask_cors-stubs' = ['__init__.pyi', 'core.pyi', 'decorator.pyi', 'extension.pyi', 'METADATA.toml', 'py.typed']
