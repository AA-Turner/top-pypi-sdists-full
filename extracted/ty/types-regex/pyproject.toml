[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=82.0.1"]

[project]
name = "types-regex"
version = "2026.9.3.20260903"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Typing stubs for regex"
readme = { text = """\
## Typing stubs for regex

This is a [type stub package](https://typing.python.org/en/latest/tutorials/external_libraries.html)
for the [`regex`](https://github.com/mrabarnett/mrab-regex) package. It can be used by type checkers
to check code that uses `regex`. This version of
`types-regex` aims to provide accurate annotations for
`regex==2026.9.3`.

This package is part of the [typeshed project](https://github.com/python/typeshed).
All fixes for types and metadata should be contributed there.
See [the README](https://github.com/python/typeshed/blob/main/README.md)
for more details. The source for this package can be found in the
[`stubs/regex`](https://github.com/python/typeshed/tree/main/stubs/regex)
directory.

This package was tested with the following type checkers:
* [mypy](https://www.mypy-lang.org/) 2.3.0
* [pyrefly](https://pyrefly.org/) 1.3.0.dev1
* [pyright](https://microsoft.github.io/pyright/) 1.1.411
* [ty](https://docs.astral.sh/ty/) 0.0.59

It was generated from typeshed commit
[`93a4ebde92adb94f67686a232c338b834b207442`](https://github.com/python/typeshed/commit/93a4ebde92adb94f67686a232c338b834b207442).
""", content-type = "text/markdown" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Stubs Only",
]
requires-python = ">=3.10"
dependencies = []



[project.urls]
"Homepage" = "https://github.com/python/typeshed"
"GitHub" = "https://github.com/python/typeshed"
"Changes" = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/regex.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
"Chat" = "https://gitter.im/python/typing"

[tool.setuptools]
packages = ['regex-stubs']
include-package-data = false

[tool.setuptools.package-data]
'regex-stubs' = ['__init__.pyi', '_main.pyi', '_regex.pyi', '_regex_core.pyi', 'METADATA.toml', 'py.typed']
