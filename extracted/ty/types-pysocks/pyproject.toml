[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=82.0.1"]

[project]
name = "types-PySocks"
version = "1.7.1.20260508"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Typing stubs for PySocks"
readme = { text = """\
## Typing stubs for PySocks

This is a [type stub package](https://typing.python.org/en/latest/tutorials/external_libraries.html)
for the [`PySocks`](https://github.com/Anorov/PySocks) package. It can be used by type checkers
to check code that uses `PySocks`. This version of
`types-PySocks` aims to provide accurate annotations for
`PySocks==1.7.1`.

This package is part of the [typeshed project](https://github.com/python/typeshed).
All fixes for types and metadata should be contributed there.
See [the README](https://github.com/python/typeshed/blob/main/README.md)
for more details. The source for this package can be found in the
[`stubs/PySocks`](https://github.com/python/typeshed/tree/main/stubs/PySocks)
directory.

This package was tested with the following type checkers:
* [mypy](https://github.com/python/mypy/) 1.20.0
* [pyright](https://github.com/microsoft/pyright) 1.1.408

It was generated from typeshed commit
[`a7f0a8286aaf594602b81bef79c77175fcf9ceda`](https://github.com/python/typeshed/commit/a7f0a8286aaf594602b81bef79c77175fcf9ceda).
""", content-type = "text/markdown" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Stubs Only",
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
"Homepage" = "https://github.com/python/typeshed"
"GitHub" = "https://github.com/python/typeshed"
"Changes" = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/PySocks.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
"Chat" = "https://gitter.im/python/typing"

[tool.setuptools]
packages = ['socks-stubs', 'sockshandler-stubs']
include-package-data = false

[tool.setuptools.package-data]
'socks-stubs' = ['__init__.pyi', 'METADATA.toml', 'py.typed']
'sockshandler-stubs' = ['__init__.pyi', 'METADATA.toml', 'py.typed']
