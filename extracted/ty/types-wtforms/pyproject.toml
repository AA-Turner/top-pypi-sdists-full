[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=82.0.1"]

[project]
name = "types-WTForms"
version = "3.3.0.20261103"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Typing stubs for WTForms"
readme = { text = """\
## Typing stubs for WTForms

This is a [type stub package](https://typing.python.org/en/latest/tutorials/external_libraries.html)
for the [`WTForms`](https://github.com/pallets-eco/wtforms) package. It can be used by type checkers
to check code that uses `WTForms`. This version of
`types-WTForms` aims to provide accurate annotations for
`WTForms==3.3.*`.

This package is part of the [typeshed project](https://github.com/python/typeshed).
All fixes for types and metadata should be contributed there.
See [the README](https://github.com/python/typeshed/blob/main/README.md)
for more details. The source for this package can be found in the
[`stubs/WTForms`](https://github.com/python/typeshed/tree/main/stubs/WTForms)
directory.

This package was tested with the following type checkers:
* [mypy](https://www.mypy-lang.org/) 2.4.0
* [pyrefly](https://pyrefly.org/) 1.4.0
* [pyright](https://microsoft.github.io/pyright/) 1.1.414
* [ty](https://docs.astral.sh/ty/) 0.0.92

It was generated from typeshed commit
[`92b4407b6ed288e6d7cc4a0f7017e18991854e41`](https://github.com/python/typeshed/commit/92b4407b6ed288e6d7cc4a0f7017e18991854e41).
""", content-type = "text/markdown" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Stubs Only",
]
requires-python = ">=3.11"
dependencies = ['MarkupSafe']



[project.urls]
"Homepage" = "https://github.com/python/typeshed"
"GitHub" = "https://github.com/python/typeshed"
"Changes" = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/WTForms.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
"Chat" = "https://gitter.im/python/typing"

[tool.setuptools]
packages = ['wtforms-stubs']
include-package-data = false

[tool.setuptools.package-data]
'wtforms-stubs' = ['__init__.pyi', '_compat.pyi', 'csrf/__init__.pyi', 'csrf/core.pyi', 'csrf/session.pyi', 'datalist.pyi', 'fields/__init__.pyi', 'fields/choices.pyi', 'fields/core.pyi', 'fields/datetime.pyi', 'fields/form.pyi', 'fields/list.pyi', 'fields/numeric.pyi', 'fields/simple.pyi', 'form.pyi', 'i18n.pyi', 'meta.pyi', 'utils.pyi', 'validators.pyi', 'widgets/__init__.pyi', 'widgets/core.pyi', 'METADATA.toml', 'py.typed']
