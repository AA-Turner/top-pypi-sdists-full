[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=82.0.1"]

[project]
name = "types-python-jenkins"
version = "1.8.3.20260508"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Typing stubs for python-jenkins"
readme = { text = """\
## Typing stubs for python-jenkins

This is a [type stub package](https://typing.python.org/en/latest/tutorials/external_libraries.html)
for the [`python-jenkins`](https://opendev.org/jjb/python-jenkins) package. It can be used by type checkers
to check code that uses `python-jenkins`. This version of
`types-python-jenkins` aims to provide accurate annotations for
`python-jenkins~=1.8.3`.

This package is part of the [typeshed project](https://github.com/python/typeshed).
All fixes for types and metadata should be contributed there.
See [the README](https://github.com/python/typeshed/blob/main/README.md)
for more details. The source for this package can be found in the
[`stubs/python-jenkins`](https://github.com/python/typeshed/tree/main/stubs/python-jenkins)
directory.

This package was tested with the following type checkers:
* [mypy](https://github.com/python/mypy/) 1.20.0
* [pyright](https://github.com/microsoft/pyright) 1.1.408

It was generated from typeshed commit
[`a7f0a8286aaf594602b81bef79c77175fcf9ceda`](https://github.com/python/typeshed/commit/a7f0a8286aaf594602b81bef79c77175fcf9ceda).
""", content-type = "text/markdown" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Stubs Only",
]
requires-python = ">=3.10"
dependencies = ['types-requests']

[project.urls]
"Homepage" = "https://github.com/python/typeshed"
"GitHub" = "https://github.com/python/typeshed"
"Changes" = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/python-jenkins.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
"Chat" = "https://gitter.im/python/typing"

[tool.setuptools]
packages = ['jenkins-stubs']
include-package-data = false

[tool.setuptools.package-data]
'jenkins-stubs' = ['__init__.pyi', 'plugins.pyi', 'version.pyi', 'METADATA.toml', 'py.typed']
