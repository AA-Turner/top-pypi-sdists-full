[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=82.0.1"]

[project]
name = "types-zxcvbn"
version = "4.5.0.20260518"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Typing stubs for zxcvbn"
readme = { text = """\
## Typing stubs for zxcvbn

This is a [type stub package](https://typing.python.org/en/latest/tutorials/external_libraries.html)
for the [`zxcvbn`](https://github.com/dwolfhub/zxcvbn-python) package. It can be used by type checkers
to check code that uses `zxcvbn`. This version of
`types-zxcvbn` aims to provide accurate annotations for
`zxcvbn==4.5.*`.

This package is part of the [typeshed project](https://github.com/python/typeshed).
All fixes for types and metadata should be contributed there.
See [the README](https://github.com/python/typeshed/blob/main/README.md)
for more details. The source for this package can be found in the
[`stubs/zxcvbn`](https://github.com/python/typeshed/tree/main/stubs/zxcvbn)
directory.

This package was tested with the following type checkers:
* [mypy](https://github.com/python/mypy/) 2.1.0
* [pyright](https://github.com/microsoft/pyright) 1.1.409

It was generated from typeshed commit
[`3402466d17144ed7edfc92940c6973167ba285af`](https://github.com/python/typeshed/commit/3402466d17144ed7edfc92940c6973167ba285af).
""", content-type = "text/markdown" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Stubs Only",
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
"Homepage" = "https://github.com/python/typeshed"
"GitHub" = "https://github.com/python/typeshed"
"Changes" = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/zxcvbn.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
"Chat" = "https://gitter.im/python/typing"

[tool.setuptools]
packages = ['zxcvbn-stubs']
include-package-data = false

[tool.setuptools.package-data]
'zxcvbn-stubs' = ['__init__.pyi', 'adjacency_graphs.pyi', 'feedback.pyi', 'frequency_lists.pyi', 'matching.pyi', 'scoring.pyi', 'time_estimates.pyi', 'METADATA.toml', 'py.typed']
