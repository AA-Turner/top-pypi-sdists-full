[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=82.0.1"]

[project]
name = "types-grpcio-health-checking"
version = "1.85.0.20261029"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Typing stubs for grpcio-health-checking"
readme = { text = """\
## Typing stubs for grpcio-health-checking

This is a [type stub package](https://typing.python.org/en/latest/tutorials/external_libraries.html)
for the [`grpcio-health-checking`](https://github.com/grpc/grpc) package. It can be used by type checkers
to check code that uses `grpcio-health-checking`. This version of
`types-grpcio-health-checking` aims to provide accurate annotations for
`grpcio-health-checking==1.85.*`.

This package is part of the [typeshed project](https://github.com/python/typeshed).
All fixes for types and metadata should be contributed there.
See [the README](https://github.com/python/typeshed/blob/main/README.md)
for more details. The source for this package can be found in the
[`stubs/grpcio-health-checking`](https://github.com/python/typeshed/tree/main/stubs/grpcio-health-checking)
directory.

This package was tested with the following type checkers:
* [mypy](https://www.mypy-lang.org/) 2.4.0
* [pyrefly](https://pyrefly.org/) 1.4.0
* [pyright](https://microsoft.github.io/pyright/) 1.1.414
* [ty](https://docs.astral.sh/ty/) 0.0.90

It was generated from typeshed commit
[`d3fe4dd2f928b33aa50d347a21ea30a8c9c9811e`](https://github.com/python/typeshed/commit/d3fe4dd2f928b33aa50d347a21ea30a8c9c9811e).
""", content-type = "text/markdown" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Stubs Only",
]
requires-python = ">=3.10"
dependencies = ['types-grpcio', 'types-protobuf']



[project.urls]
"Homepage" = "https://github.com/python/typeshed"
"GitHub" = "https://github.com/python/typeshed"
"Changes" = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/grpcio-health-checking.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
"Chat" = "https://gitter.im/python/typing"

[tool.setuptools]
packages = ['grpc_health-stubs']
include-package-data = false

[tool.setuptools.package-data]
'grpc_health-stubs' = ['__init__.pyi', 'v1/__init__.pyi', 'v1/_async.pyi', 'v1/health.pyi', 'v1/health_pb2.pyi', 'v1/health_pb2_grpc.pyi', 'METADATA.toml', 'py.typed']
