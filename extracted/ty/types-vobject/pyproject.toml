[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=82.0.1"]

[project]
name = "types-vobject"
version = "0.9.9.20260518"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Typing stubs for vobject"
readme = { text = """\
## Typing stubs for vobject

This is a [type stub package](https://typing.python.org/en/latest/tutorials/external_libraries.html)
for the [`vobject`](https://github.com/py-vobject/vobject) package. It can be used by type checkers
to check code that uses `vobject`. This version of
`types-vobject` aims to provide accurate annotations for
`vobject~=0.9.9`.

This package is part of the [typeshed project](https://github.com/python/typeshed).
All fixes for types and metadata should be contributed there.
See [the README](https://github.com/python/typeshed/blob/main/README.md)
for more details. The source for this package can be found in the
[`stubs/vobject`](https://github.com/python/typeshed/tree/main/stubs/vobject)
directory.

This package was tested with the following type checkers:
* [mypy](https://github.com/python/mypy/) 2.1.0
* [pyright](https://github.com/microsoft/pyright) 1.1.409

It was generated from typeshed commit
[`3402466d17144ed7edfc92940c6973167ba285af`](https://github.com/python/typeshed/commit/3402466d17144ed7edfc92940c6973167ba285af).
""", content-type = "text/markdown" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Stubs Only",
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
"Homepage" = "https://github.com/python/typeshed"
"GitHub" = "https://github.com/python/typeshed"
"Changes" = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/vobject.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
"Chat" = "https://gitter.im/python/typing"

[tool.setuptools]
packages = ['vobject-stubs']
include-package-data = false

[tool.setuptools.package-data]
'vobject-stubs' = ['__init__.pyi', 'base.pyi', 'behavior.pyi', 'change_tz.pyi', 'hcalendar.pyi', 'icalendar.pyi', 'ics_diff.pyi', 'vcard.pyi', 'win32tz.pyi', 'METADATA.toml', 'py.typed']
