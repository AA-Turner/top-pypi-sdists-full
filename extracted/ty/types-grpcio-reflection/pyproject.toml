[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=82.0.1"]

[project]
name = "types-grpcio-reflection"
version = "1.0.0.20260402"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Typing stubs for grpcio-reflection"
readme = { text = """\
## Typing stubs for grpcio-reflection

This is a [type stub package](https://typing.python.org/en/latest/tutorials/external_libraries.html)
for the [`grpcio-reflection`](https://github.com/grpc/grpc) package. It can be used by type checkers
to check code that uses `grpcio-reflection`. This version of
`types-grpcio-reflection` aims to provide accurate annotations for
`grpcio-reflection==1.*`.

This package is part of the [typeshed project](https://github.com/python/typeshed).
All fixes for types and metadata should be contributed there.
See [the README](https://github.com/python/typeshed/blob/main/README.md)
for more details. The source for this package can be found in the
[`stubs/grpcio-reflection`](https://github.com/python/typeshed/tree/main/stubs/grpcio-reflection)
directory.

This package was tested with the following type checkers:
* [mypy](https://github.com/python/mypy/) 1.20.0
* [pyright](https://github.com/microsoft/pyright) 1.1.408

It was generated from typeshed commit
[`4ab04d22631e5842838528ceaae19c3c532cdd43`](https://github.com/python/typeshed/commit/4ab04d22631e5842838528ceaae19c3c532cdd43).
""", content-type = "text/markdown" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Stubs Only",
]
requires-python = ">=3.10"
dependencies = ['types-grpcio', 'types-protobuf']

[project.urls]
"Homepage" = "https://github.com/python/typeshed"
"GitHub" = "https://github.com/python/typeshed"
"Changes" = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/grpcio-reflection.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
"Chat" = "https://gitter.im/python/typing"

[tool.setuptools]
packages = ['grpc_reflection-stubs']
include-package-data = false

[tool.setuptools.package-data]
'grpc_reflection-stubs' = ['__init__.pyi', 'v1alpha/__init__.pyi', 'v1alpha/_async.pyi', 'v1alpha/_base.pyi', 'v1alpha/proto_reflection_descriptor_database.pyi', 'v1alpha/reflection.pyi', 'v1alpha/reflection_pb2.pyi', 'v1alpha/reflection_pb2_grpc.pyi', 'METADATA.toml', 'py.typed']
