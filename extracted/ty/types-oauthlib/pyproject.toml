[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=82.0.1"]

[project]
name = "types-oauthlib"
version = "3.3.0.20260724"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Typing stubs for oauthlib"
readme = { text = """\
## Typing stubs for oauthlib

This is a [type stub package](https://typing.python.org/en/latest/tutorials/external_libraries.html)
for the [`oauthlib`](https://github.com/oauthlib/oauthlib) package. It can be used by type checkers
to check code that uses `oauthlib`. This version of
`types-oauthlib` aims to provide accurate annotations for
`oauthlib==3.3.*`.

This package is part of the [typeshed project](https://github.com/python/typeshed).
All fixes for types and metadata should be contributed there.
See [the README](https://github.com/python/typeshed/blob/main/README.md)
for more details. The source for this package can be found in the
[`stubs/oauthlib`](https://github.com/python/typeshed/tree/main/stubs/oauthlib)
directory.

This package was tested with the following type checkers:
* [mypy](https://github.com/python/mypy/) 2.3.0
* [pyright](https://github.com/microsoft/pyright) 1.1.411

It was generated from typeshed commit
[`97e83f65cee88c0c978fa34668d9f59b8c362fce`](https://github.com/python/typeshed/commit/97e83f65cee88c0c978fa34668d9f59b8c362fce).
""", content-type = "text/markdown" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Stubs Only",
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
"Homepage" = "https://github.com/python/typeshed"
"GitHub" = "https://github.com/python/typeshed"
"Changes" = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/oauthlib.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
"Chat" = "https://gitter.im/python/typing"

[tool.setuptools]
packages = ['oauthlib-stubs']
include-package-data = false

