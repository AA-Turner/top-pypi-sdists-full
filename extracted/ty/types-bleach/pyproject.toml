[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=82.0.1"]

[project]
name = "types-bleach"
version = "6.3.0.20260408"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Typing stubs for bleach"
readme = { text = """\
## Typing stubs for bleach

This is a [type stub package](https://typing.python.org/en/latest/tutorials/external_libraries.html)
for the [`bleach`](https://github.com/mozilla/bleach) package. It can be used by type checkers
to check code that uses `bleach`. This version of
`types-bleach` aims to provide accurate annotations for
`bleach==6.3.*`.

This package is part of the [typeshed project](https://github.com/python/typeshed).
All fixes for types and metadata should be contributed there.
See [the README](https://github.com/python/typeshed/blob/main/README.md)
for more details. The source for this package can be found in the
[`stubs/bleach`](https://github.com/python/typeshed/tree/main/stubs/bleach)
directory.

This package was tested with the following type checkers:
* [mypy](https://github.com/python/mypy/) 1.20.0
* [pyright](https://github.com/microsoft/pyright) 1.1.408

It was generated from typeshed commit
[`563213272e5db2a858e37bdf6938b0c8742ec192`](https://github.com/python/typeshed/commit/563213272e5db2a858e37bdf6938b0c8742ec192).
""", content-type = "text/markdown" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Stubs Only",
]
requires-python = ">=3.10"
dependencies = ['types-html5lib']

[project.urls]
"Homepage" = "https://github.com/python/typeshed"
"GitHub" = "https://github.com/python/typeshed"
"Changes" = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/bleach.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
"Chat" = "https://gitter.im/python/typing"

[tool.setuptools]
packages = ['bleach-stubs']
include-package-data = false

[tool.setuptools.package-data]
'bleach-stubs' = ['__init__.pyi', 'callbacks.pyi', 'css_sanitizer.pyi', 'html5lib_shim.pyi', 'linkifier.pyi', 'parse_shim.pyi', 'sanitizer.pyi', 'METADATA.toml', 'py.typed']
