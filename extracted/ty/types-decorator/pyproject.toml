[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=82.0.1"]

[project]
name = "types-decorator"
version = "5.2.0.20260519"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Typing stubs for decorator"
readme = { text = """\
## Typing stubs for decorator

This is a [type stub package](https://typing.python.org/en/latest/tutorials/external_libraries.html)
for the [`decorator`](https://github.com/micheles/decorator) package. It can be used by type checkers
to check code that uses `decorator`. This version of
`types-decorator` aims to provide accurate annotations for
`decorator==5.2.*`.

*Note:* The `decorator` package includes type annotations or type stubs
since version 5.3.0. Please uninstall the `types-decorator`
package if you use this or a newer version.


This package is part of the [typeshed project](https://github.com/python/typeshed).
All fixes for types and metadata should be contributed there.
See [the README](https://github.com/python/typeshed/blob/main/README.md)
for more details. The source for this package can be found in the
[`stubs/decorator`](https://github.com/python/typeshed/tree/main/stubs/decorator)
directory.

This package was tested with the following type checkers:
* [mypy](https://github.com/python/mypy/) 2.1.0
* [pyright](https://github.com/microsoft/pyright) 1.1.409

It was generated from typeshed commit
[`db9c1810e99d7010710362f0dae19895626e9f48`](https://github.com/python/typeshed/commit/db9c1810e99d7010710362f0dae19895626e9f48).
""", content-type = "text/markdown" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Stubs Only",
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
"Homepage" = "https://github.com/python/typeshed"
"GitHub" = "https://github.com/python/typeshed"
"Changes" = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/decorator.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
"Chat" = "https://gitter.im/python/typing"

[tool.setuptools]
packages = ['decorator-stubs']
include-package-data = false

[tool.setuptools.package-data]
'decorator-stubs' = ['__init__.pyi', 'METADATA.toml', 'py.typed']
