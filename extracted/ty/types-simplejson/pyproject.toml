[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=82.0.1"]

[project]
name = "types-simplejson"
version = "4.2.0.20261006"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Typing stubs for simplejson"
readme = { text = """\
## Typing stubs for simplejson

This is a [type stub package](https://typing.python.org/en/latest/tutorials/external_libraries.html)
for the [`simplejson`](https://github.com/simplejson/simplejson) package. It can be used by type checkers
to check code that uses `simplejson`. This version of
`types-simplejson` aims to provide accurate annotations for
`simplejson==4.2.*`.

This package is part of the [typeshed project](https://github.com/python/typeshed).
All fixes for types and metadata should be contributed there.
See [the README](https://github.com/python/typeshed/blob/main/README.md)
for more details. The source for this package can be found in the
[`stubs/simplejson`](https://github.com/python/typeshed/tree/main/stubs/simplejson)
directory.

This package was tested with the following type checkers:
* [mypy](https://www.mypy-lang.org/) 2.3.1
* [pyrefly](https://pyrefly.org/) 1.3.2
* [pyright](https://microsoft.github.io/pyright/) 1.1.414
* [ty](https://docs.astral.sh/ty/) 0.0.84

It was generated from typeshed commit
[`0b28ac87099d7e3d40612e07ed104ef98143bbe6`](https://github.com/python/typeshed/commit/0b28ac87099d7e3d40612e07ed104ef98143bbe6).
""", content-type = "text/markdown" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Stubs Only",
]
requires-python = ">=3.10"
dependencies = []



[project.urls]
"Homepage" = "https://github.com/python/typeshed"
"GitHub" = "https://github.com/python/typeshed"
"Changes" = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/simplejson.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
"Chat" = "https://gitter.im/python/typing"

[tool.setuptools]
packages = ['simplejson-stubs']
include-package-data = false

[tool.setuptools.package-data]
'simplejson-stubs' = ['__init__.pyi', 'decoder.pyi', 'encoder.pyi', 'errors.pyi', 'raw_json.pyi', 'scanner.pyi', 'METADATA.toml', 'py.typed']
