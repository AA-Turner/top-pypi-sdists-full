[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=82.0.1"]

[project]
name = "types-icalendar"
version = "6.3.2.20260712"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Typing stubs for icalendar"
readme = { text = """\
## Typing stubs for icalendar

This is a [type stub package](https://typing.python.org/en/latest/tutorials/external_libraries.html)
for the [`icalendar`](https://github.com/collective/icalendar) package. It can be used by type checkers
to check code that uses `icalendar`. This version of
`types-icalendar` aims to provide accurate annotations for
`icalendar==6.3.2`.

*Note:* The `icalendar` package includes type annotations or type stubs
since version 7.0.0. Please uninstall the `types-icalendar`
package if you use this or a newer version.


This package is part of the [typeshed project](https://github.com/python/typeshed).
All fixes for types and metadata should be contributed there.
See [the README](https://github.com/python/typeshed/blob/main/README.md)
for more details. The source for this package can be found in the
[`stubs/icalendar`](https://github.com/python/typeshed/tree/main/stubs/icalendar)
directory.

This package was tested with the following type checkers:
* [mypy](https://github.com/python/mypy/) 2.2.0
* [pyright](https://github.com/microsoft/pyright) 1.1.411

It was generated from typeshed commit
[`8e3110c4d3cf2828734b119863c6853529bb3034`](https://github.com/python/typeshed/commit/8e3110c4d3cf2828734b119863c6853529bb3034).
""", content-type = "text/markdown" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Stubs Only",
]
requires-python = ">=3.10"
dependencies = ['types-python-dateutil', 'types-pytz']

[project.urls]
"Homepage" = "https://github.com/python/typeshed"
"GitHub" = "https://github.com/python/typeshed"
"Changes" = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/icalendar.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
"Chat" = "https://gitter.im/python/typing"

[tool.setuptools]
packages = ['icalendar-stubs']
include-package-data = false

[tool.setuptools.package-data]
'icalendar-stubs' = ['__init__.pyi', 'alarms.pyi', 'attr.pyi', 'cal.pyi', 'caselessdict.pyi', 'enums.pyi', 'error.pyi', 'param.pyi', 'parser.pyi', 'parser_tools.pyi', 'prop.pyi', 'timezone/__init__.pyi', 'timezone/equivalent_timezone_ids.pyi', 'timezone/equivalent_timezone_ids_result.pyi', 'timezone/provider.pyi', 'timezone/pytz.pyi', 'timezone/tzid.pyi', 'timezone/tzp.pyi', 'timezone/windows_to_olson.pyi', 'timezone/zoneinfo.pyi', 'tools.pyi', 'version.pyi', 'METADATA.toml', 'py.typed']
