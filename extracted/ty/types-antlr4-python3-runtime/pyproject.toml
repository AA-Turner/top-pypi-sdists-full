[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=82.0.1"]

[project]
name = "types-antlr4-python3-runtime"
version = "4.13.0.20260807"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Typing stubs for antlr4-python3-runtime"
readme = { text = """\
## Typing stubs for antlr4-python3-runtime

This is a [type stub package](https://typing.python.org/en/latest/tutorials/external_libraries.html)
for the [`antlr4-python3-runtime`](https://github.com/antlr/antlr4) package. It can be used by type checkers
to check code that uses `antlr4-python3-runtime`. This version of
`types-antlr4-python3-runtime` aims to provide accurate annotations for
`antlr4-python3-runtime==4.13.*`.

This package is part of the [typeshed project](https://github.com/python/typeshed).
All fixes for types and metadata should be contributed there.
See [the README](https://github.com/python/typeshed/blob/main/README.md)
for more details. The source for this package can be found in the
[`stubs/antlr4-python3-runtime`](https://github.com/python/typeshed/tree/main/stubs/antlr4-python3-runtime)
directory.

This package was tested with the following type checkers:
* [mypy](https://github.com/python/mypy/) 2.3.0
* [pyright](https://github.com/microsoft/pyright) 1.1.411
* [ty](https://docs.astral.sh/ty/) 0.0.59

It was generated from typeshed commit
[`e0efbeef901e9b6998d016e1ab9352678f09ae77`](https://github.com/python/typeshed/commit/e0efbeef901e9b6998d016e1ab9352678f09ae77).
""", content-type = "text/markdown" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Stubs Only",
]
requires-python = ">=3.10"
dependencies = []



[project.urls]
"Homepage" = "https://github.com/python/typeshed"
"GitHub" = "https://github.com/python/typeshed"
"Changes" = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/antlr4-python3-runtime.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
"Chat" = "https://gitter.im/python/typing"

[tool.setuptools]
packages = ['antlr4-stubs']
include-package-data = false

[tool.setuptools.package-data]
