[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=82.0.1"]

[project]
name = "types-channels"
version = "4.3.0.20260402"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Typing stubs for channels"
readme = { text = """\
## Typing stubs for channels

This is a [type stub package](https://typing.python.org/en/latest/tutorials/external_libraries.html)
for the [`channels`](https://github.com/django/channels) package. It can be used by type checkers
to check code that uses `channels`. This version of
`types-channels` aims to provide accurate annotations for
`channels==4.3.*`.

This package is part of the [typeshed project](https://github.com/python/typeshed).
All fixes for types and metadata should be contributed there.
See [the README](https://github.com/python/typeshed/blob/main/README.md)
for more details. The source for this package can be found in the
[`stubs/channels`](https://github.com/python/typeshed/tree/main/stubs/channels)
directory.

This package was tested with the following type checkers:
* [mypy](https://github.com/python/mypy/) 1.20.0
* [pyright](https://github.com/microsoft/pyright) 1.1.408

It was generated from typeshed commit
[`4ab04d22631e5842838528ceaae19c3c532cdd43`](https://github.com/python/typeshed/commit/4ab04d22631e5842838528ceaae19c3c532cdd43).
""", content-type = "text/markdown" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Stubs Only",
]
requires-python = ">=3.10"
dependencies = ['django-stubs>=4.2', 'asgiref']

[project.urls]
"Homepage" = "https://github.com/python/typeshed"
"GitHub" = "https://github.com/python/typeshed"
"Changes" = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/channels.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
"Chat" = "https://gitter.im/python/typing"

[tool.setuptools]
packages = ['channels-stubs']
include-package-data = false

[tool.setuptools.package-data]
'channels-stubs' = ['__init__.pyi', 'apps.pyi', 'auth.pyi', 'consumer.pyi', 'db.pyi', 'exceptions.pyi', 'generic/__init__.pyi', 'generic/http.pyi', 'generic/websocket.pyi', 'layers.pyi', 'management/__init__.pyi', 'management/commands/__init__.pyi', 'management/commands/runworker.pyi', 'middleware.pyi', 'routing.pyi', 'security/__init__.pyi', 'security/websocket.pyi', 'sessions.pyi', 'testing/__init__.pyi', 'testing/application.pyi', 'testing/http.pyi', 'testing/live.pyi', 'testing/websocket.pyi', 'utils.pyi', 'worker.pyi', 'METADATA.toml', 'py.typed']
