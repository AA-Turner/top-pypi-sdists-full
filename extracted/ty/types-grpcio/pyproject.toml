[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=82.0.1"]

[project]
name = "types-grpcio"
version = "1.84.0.20260928"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Typing stubs for grpcio"
readme = { text = """\
## Typing stubs for grpcio

This is a [type stub package](https://typing.python.org/en/latest/tutorials/external_libraries.html)
for the [`grpcio`](https://github.com/grpc/grpc) package. It can be used by type checkers
to check code that uses `grpcio`. This version of
`types-grpcio` aims to provide accurate annotations for
`grpcio~=1.84.0`.

This stub package is marked as [partial](https://typing.python.org/en/latest/spec/distributing.html#partial-stub-packages).
If you find that annotations are missing, feel free to contribute and help complete them.


This package is part of the [typeshed project](https://github.com/python/typeshed).
All fixes for types and metadata should be contributed there.
See [the README](https://github.com/python/typeshed/blob/main/README.md)
for more details. The source for this package can be found in the
[`stubs/grpcio`](https://github.com/python/typeshed/tree/main/stubs/grpcio)
directory.

This package was tested with the following type checkers:
* [mypy](https://www.mypy-lang.org/) 2.3.0
* [pyrefly](https://pyrefly.org/) 1.3.0.dev1
* [pyright](https://microsoft.github.io/pyright/) 1.1.414
* [ty](https://docs.astral.sh/ty/) 0.0.59

It was generated from typeshed commit
[`a767999081c11a6038300ad7a326900c5447ae1b`](https://github.com/python/typeshed/commit/a767999081c11a6038300ad7a326900c5447ae1b).
""", content-type = "text/markdown" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Stubs Only",
]
requires-python = ">=3.10"
dependencies = []



[project.urls]
"Homepage" = "https://github.com/python/typeshed"
"GitHub" = "https://github.com/python/typeshed"
"Changes" = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/grpcio.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
"Chat" = "https://gitter.im/python/typing"

[tool.setuptools]
packages = ['grpc-stubs']
include-package-data = false

[tool.setuptools.package-data]
'grpc-stubs' = ['__init__.pyi', 'aio/__init__.pyi', 'experimental/gevent.pyi', 'METADATA.toml', 'py.typed']
