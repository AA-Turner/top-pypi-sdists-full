[project]
name = "repo-standards"
version = "6.22.3"
description = "Deterministic pull-request sizing and reviewed repository policy"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "architecture",
    "github-actions",
    "lint",
    "openapi",
    "repository",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
requires-python = ">=3.14,<3.16"
dependencies = [
    "conventional-pre-commit==4.4.0",
    "markdown-it-py==4.2.0",
    "PyYAML>=6.0.3,<7",
    "pydantic>=2.14.1,<3",
    "typer>=0.27.3,<1",
]
readme = "README.md"

[[project.authors]]
name = "sarj-ai"

[project.urls]
Homepage = "https://engineering.sarj.ai/projects/repo-standards/"
Repository = "https://github.com/sarj-ai/repo-standards"
Issues = "https://github.com/sarj-ai/repo-standards/issues"
Documentation = "https://engineering.sarj.ai/projects/repo-standards/"

[project.scripts]
repo-standards = "repo_standards._entrypoint:main"

[dependency-groups]
artifacts = ["jsonschema>=4.26.0"]
hooks = ["pre-commit>=4.7.0,<5"]
dev = [
    "basedpyright>=1.40.2",
    "jsonschema>=4.26.0",
    "pre-commit>=4.7.0,<5",
    "pytest>=9.1.1",
    "pytest-xdist==3.8.0",
    "ruff>=0.17.2",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv]
python-downloads-json-url = "https://raw.githubusercontent.com/astral-sh/uv/46776a95d6686ac0160c10611327ce491e6b202f/crates/uv-python-managed/download-metadata.json"

[tool.uv.build-backend]
module-name = "repo_standards"

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
pythonpath = [
    ".",
    "src",
]
testpaths = ["tests"]

[tool.ruff]
extend = ".ruff-strict.toml"
target-version = "py314"
line-length = 100

[tool.ruff.lint]
extend-select = [
    "B",
    "E",
    "F",
    "I",
    "PERF",
    "PL",
    "RUF",
    "S",
    "SIM",
    "UP",
]

[tool.ruff.lint.extend-per-file-ignores]
"**/tests/**" = [
    "implicit-namespace-package",
    "magic-value-comparison",
    "assert",
]
"src/repo_standards/github_review_policy.py" = [
    "any-type",
    "banned-api",
    "f-string-in-exception",
    "line-too-long",
    "print",
    "raise-vanilla-args",
    "raw-string-in-exception",
    "start-process-with-partial-path",
    "suspicious-subprocess-import",
    "suspicious-url-open-usage",
    "too-many-arguments",
    "too-many-locals",
]
"release_reconciliation.py" = ["banned-api"]
"ci_artifacts.py" = [
    "too-many-locals",
    "too-many-return-statements",
]
"test_selection.py" = ["too-many-return-statements"]

[tool.ruff.per-file-target-version]
"test_selection.py" = "py312"
"src/repo_standards/github_checkout.py" = "py311"
