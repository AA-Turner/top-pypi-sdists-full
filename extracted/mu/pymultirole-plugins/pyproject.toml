[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymultirole-plugins"
dynamic = ["version"]
description = "Sherpa multirole plugins"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Olivier Terrier", email = "olivier.terrier@kairntech.com" }
]
classifiers = [
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development",
    "Typing :: Typed",
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "pydantic>=2.0,<3.0",
    "fastapi>=0.115.0",
    "python-singleton-metaclasses",
    "pytest"
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "ruff",
    "dirty-equals"
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "m2r2",
    "sphinxcontrib.apidoc",
    "lxml_html_clean",
]

sbom = ["cyclonedx-bom", "pip-audit"]

[project.urls]
Homepage = "https://kairntech.com/"

[tool.hatch.version]
path = "pymultirole_plugins/__init__.py"

[tool.pytest.ini_options]
addopts = "--durations=5"
norecursedirs = ["docs"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

